<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
    --border: #E2E8F0; --border-strong: #CBD5E1; --border-subtle: #F1F5F9;
    --primary: #EA1D2C; --primary-hover: #D0101E; --primary-light: #FEE2E2;
    --accent-blue: #2563EB; --accent-blue-dark: #1D4ED8; --accent-blue-light: #EFF6FF;
    --accent-emerald: #059669; --accent-emerald-dark: #065F46; --accent-emerald-light: #ECFDF5;
    --accent-amber: #D97706; --accent-amber-dark: #92400E; --accent-amber-light: #FEF3C7;
    --accent-coral: #DC2626;
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04); --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.05);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font); background: linear-gradient(180deg, #EBF1F6 0%, #F1F5F9 100%);
    color: var(--text); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    overflow-x: hidden; min-height: 100vh;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px;
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-sm);
  }
  .brand-wrap { display: flex; align-items: center; gap: 12px; }
  .brand-tag { font-size: 10px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; background: var(--primary); color: #fff; padding: 3px 7px; border-radius: var(--radius-sm); }
  .brand-title { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -0.2px; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; line-height: 1.15; margin-top: 2px; }
  .header-nav-tabs { display: flex; gap: 4px; background: #F1F5F9; padding: 3px; border-radius: var(--radius-sm); }
  .nav-tab {
    background: transparent; border: none; font-family: inherit; font-size: 11px; font-weight: 700; color: var(--text-secondary);
    padding: 5px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.12s ease; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { background: #FFFFFF; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .tab-counter { font-size: 10px; font-weight: 800; color: #FFFFFF; background: var(--text-muted); padding: 1px 6px; border-radius: 8px; }
  .nav-tab.active .tab-counter { background: var(--primary); }
  .control-bar {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 24px;
    display: flex; justify-content: flex-start; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .filter-box { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
  .filter-label { color: var(--text); font-size: 12px; font-weight: 700; }
  select, input[type="text"] {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: #FFFFFF; color: var(--text); outline: none; transition: border-color 0.12s, box-shadow 0.12s;
  }
  select:focus, input[type="text"]:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
  .semana-control { display: flex; align-items: center; border: 1px solid var(--border-strong); background: #FFFFFF; border-radius: var(--radius-sm); overflow: hidden; }
  .semana-nav-btn { background: #F8FAFC; color: var(--text); border: none; padding: 5px 10px; cursor: pointer; font-size: 13px; font-weight: 800; line-height: 1; transition: background 0.12s; }
  .semana-nav-btn:hover:not(:disabled) { background: #E2E8F0; }
  .semana-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; color: var(--text-muted); }
  .semana-select { border: none; background: transparent; padding: 5px 10px; font-weight: 800; color: var(--text); cursor: pointer; font-size: 12px; min-width: 240px; }
  .toggle-all-group { display: flex; align-items: center; background: #FFFFFF; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .btn-ctrl-toggle { background: #F8FAFC; border: none; color: var(--text-secondary); font-family: inherit; font-size: 11px; font-weight: 700; padding: 5px 10px; cursor: pointer; transition: background 0.12s, color 0.12s; line-height: 1.2; white-space: nowrap; }
  .btn-ctrl-toggle:hover { background: #E2E8F0; color: var(--text); }
  .btn-ctrl-toggle:first-child { border-right: 1px solid var(--border); }
  .content-container { width: 100%; max-width: 100%; margin: 0; padding: 16px 24px 60px; }
  .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .view-title { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .view-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  }

  .person-banner { background: #FFFFFF; border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }

  .person-name { font-size: 14px; font-weight: 800; color: var(--text); }
  .person-status-wrap { display: flex; align-items: center; gap: 8px; }
  .status-caption { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .status-select-inline { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; border: 1px solid transparent; cursor: pointer; outline: none; min-width: 120px; }
  .status-select-inline.opt-proceso { background: var(--accent-blue-light); color: var(--accent-blue-dark); border-color: #BFDBFE; }
  .status-select-inline.opt-completado { background: var(--accent-emerald-light); color: var(--accent-emerald-dark); border-color: #A7F3D0; }
  .status-select-inline.opt-pendiente { background: var(--accent-amber-light); color: var(--accent-amber-dark); border-color: #FDE68A; }

  .spine-section.is-collapsed .subpoints-header-toggle, .spine-section.is-collapsed .todos-toolbar { width: 100%; margin-bottom: 0; padding-bottom: 0; border-bottom: none; display: flex; align-items: center; justify-content: space-between; }
  .spine-bar { width: 36px; min-width: 36px; display: flex; align-items: center; justify-content: center; padding: 12px 0; user-select: none; flex-shrink: 0; box-shadow: inset -1px 0 0 rgba(0,0,0,0.1); cursor: pointer; transition: filter 0.12s; }
  .spine-bar:hover { filter: brightness(1.15); }
  .spine-text { writing-mode: vertical-lr; transform: rotate(180deg); font-size: 9.5px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; color: #FFFFFF; }
  .spine-semana { background: #2563EB; border-right: 1px solid #1D4ED8; }
  .spine-recurrente { background: #0D9488; border-right: 1px solid #0F766E; }
  .spine-proxima { background: #7C3AED; border-right: 1px solid #6D28D9; }

  .todos-interactive-box { background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.12s; }
  .todos-interactive-box:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(37,99,235,0.08); }
  .todos-toolbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; margin-bottom: 4px; }
  .todos-toolbar-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }

  .btn-promote-item:hover { background: var(--accent-blue); }
