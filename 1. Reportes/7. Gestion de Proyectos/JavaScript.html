    ];

    function isSlashMenuOpen() {
      const menu = document.getElementById("notionSlashMenu");
      return menu && menu.style.display !== "none";
    }

    function abrirSlashMenu(inputEl, owner, idx, query = "") {
      const menu = document.getElementById("notionSlashMenu");
      if (!menu || !inputEl) return;
      SLASH_MENU_CTX = { inputEl, owner, idx, query };
      SLASH_ACTIVE_INDEX = 0;
      renderSlashMenu();

      const rect = inputEl.getBoundingClientRect();
      const menuWidth = 270;
      const menuHeight = 310;

      let top = rect.bottom + 4;
      let left = rect.left;

      if (left + menuWidth > window.innerWidth) {
        left = Math.max(10, window.innerWidth - menuWidth - 16);
      }
      if (top + menuHeight > window.innerHeight) {
        top = Math.max(10, rect.top - menuHeight - 4);
      }

      menu.style.top = `${Math.max(10, top)}px`;
      menu.style.left = `${Math.max(10, left)}px`;
      menu.style.display = "block";
    }

    function cerrarSlashMenu() {
      const menu = document.getElementById("notionSlashMenu");
      if (menu) menu.style.display = "none";
      SLASH_MENU_CTX = null;
    }

    function renderSlashMenu() {
      const list = document.getElementById("slashMenuList");
      if (!list || !SLASH_MENU_CTX) return;

      const q = (SLASH_MENU_CTX.query || "").toLowerCase();
      const filtered = SLASH_COMMANDS.filter(c =>
        !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.id.includes(q)
      );

      if (!filtered.length) {
        list.innerHTML = `<div style="padding: 10px 14px; font-size: 11px; color: var(--text-muted); font-style: italic;">Sin comandos coincidentes</div>`;
        return;
      }

      if (SLASH_ACTIVE_INDEX >= filtered.length) SLASH_ACTIVE_INDEX = 0;
      if (SLASH_ACTIVE_INDEX < 0) SLASH_ACTIVE_INDEX = filtered.length - 1;

      let currentGroup = "";
      let html = "";

      filtered.forEach((cmd, i) => {
        if (cmd.group !== currentGroup) {
          currentGroup = cmd.group;
          html += `<div class="slash-menu-header">${currentGroup}</div>`;
        }
        const isActive = (i === SLASH_ACTIVE_INDEX);
        html += `
          <div class="slash-menu-item ${isActive ? 'is-active' : ''}" onmousedown="ejecutarSlashCommand('${cmd.id}')">
            <div class="slash-menu-icon">${cmd.icon}</div>
            <div class="slash-menu-content">
              <div class="slash-menu-title">${cmd.title}</div>
              <div class="slash-menu-desc">${cmd.desc}</div>
            </div>
          </div>
        `;
      });

      list.innerHTML = html;
    }

    function moverSlashMenu(delta) {
      if (!SLASH_MENU_CTX) return;
      const q = (SLASH_MENU_CTX.query || "").toLowerCase();
      const filtered = SLASH_COMMANDS.filter(c => !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.id.includes(q));
      if (!filtered.length) return;
      SLASH_ACTIVE_INDEX = (SLASH_ACTIVE_INDEX + delta + filtered.length) % filtered.length;
      renderSlashMenu();
    }

    function ejecutarSlashSeleccionado() {
      if (!SLASH_MENU_CTX) return;
      const q = (SLASH_MENU_CTX.query || "").toLowerCase();
      const filtered = SLASH_COMMANDS.filter(c => !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.id.includes(q));
      if (filtered[SLASH_ACTIVE_INDEX]) {
        ejecutarSlashCommand(filtered[SLASH_ACTIVE_INDEX].id);
      }
    }

    function ejecutarSlashCommand(cmdId) {
      if (!SLASH_MENU_CTX) return;
      const { inputEl, owner, idx } = SLASH_MENU_CTX;
      cerrarSlashMenu();

      if (inputEl) {
        const rawVal = inputEl.value || "";
        const cleanVal = rawVal.replace(/\/([^\s]*)$/, "").trim();
        inputEl.value = cleanVal;
        editarTextoItem(owner, idx, cleanVal);
      }

      if (cmdId === "subir_imagen") {
        TARGET_IMAGE_OWNER = owner;
        TARGET_IMAGE_TASK_IDX = idx;
        document.getElementById("inputSubirImagenGlobal")?.click();
      } else if (cmdId === "pegar_imagen") {
        TARGET_IMAGE_OWNER = owner;
        TARGET_IMAGE_TASK_IDX = idx;
        pegarImagenDesdePortapapeles(owner, idx);
      } else if (cmdId === "proyecto") {
        editarTextoItem(owner, idx, "# Nuevo Proyecto");
      } else if (cmdId === "subtarea") {
        toggleSubtareaItem(owner, idx, true);
      } else if (cmdId === "todo") {
        toggleSubtareaItem(owner, idx, false);
      } else if (cmdId === "enlace") {
        adjuntarLinkItem(owner, idx);
      } else if (cmdId === "automatizado") {
        toggleAutoItem(owner, idx);
      } else if (cmdId === "eliminar") {
        eliminarCheckItem(owner, idx, true);
      }
    }

    function dataUrlToBlob(dataUrl) {
      try {
        const parts = dataUrl.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
          u8arr[n] = bstr.charCodeAt(n);
        }
        return new Blob([u8arr], { type: mime });
      } catch (e) {
        return null;
      }
    }

    function comprimirImagen(file, maxAncho = 1100, calidad = 0.78) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxAncho || h > maxAncho) {
              if (w > h) {
                h = Math.round((h * maxAncho) / w);
                w = maxAncho;
              } else {
                w = Math.round((w * maxAncho) / h);
                h = maxAncho;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            let dataUrl = canvas.toDataURL("image/jpeg", calidad);
            if (dataUrl.length > 42000) {
              dataUrl = canvas.toDataURL("image/jpeg", 0.60);
            }
            resolve(dataUrl);
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve("");
        reader.readAsDataURL(file);
      });
    }

    let TARGET_IMAGE_TASK_IDX = null;

    function abrirAdjuntarImagenTarea(owner, taskIdx) {
      TARGET_IMAGE_OWNER = owner;
      TARGET_IMAGE_TASK_IDX = taskIdx;
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      const p = parsearTodos(it?.todos || "");
      const taskText = p.items[taskIdx]?.text || "esta tarea";
      abrirModalAdjuntarImagen(owner, taskText);
    }

    function procesarYAdjuntarImagen(file, owner, taskIdx = null) {
      const targetOwner = owner || TARGET_IMAGE_OWNER || STATE.usuario?.nombre || (STATE.ownerFiltro !== "Todos" ? STATE.ownerFiltro : "") || STATE.equipo?.[0]?.nombre;
      const targetTaskIdx = (typeof taskIdx === "number") ? taskIdx : (typeof TARGET_IMAGE_TASK_IDX === "number" ? TARGET_IMAGE_TASK_IDX : null);

      if (!file || !targetOwner) {
        notificar("No se pudo identificar a qué miembro adjuntar la imagen");
        return;
      }
      notificar("Optimizando y adjuntando imagen...");
      comprimirImagen(file, 1100, 0.78).then(base64 => {
        if (!base64) {
          notificar("Error al procesar la imagen");
          return;
        }
        const runner = getRunner();
        if (runner && typeof runner.subirImagenAdjunto === "function") {
          runner
            .withSuccessHandler(res => {
              const url = (res && res.url) ? res.url : base64;
              adjuntarUrlImagenASemana(targetOwner, url, targetTaskIdx);
            })
            .withFailureHandler(() => {
              adjuntarUrlImagenASemana(targetOwner, base64, targetTaskIdx);
            })
            .subirImagenAdjunto(base64, file.name || `captura_${Date.now()}.png`);
        } else {
          adjuntarUrlImagenASemana(targetOwner, base64, targetTaskIdx);
        }
      });
    }

    function adjuntarUrlImagenASemana(owner, url, taskIdx = null) {
      if (!owner || !url) return;
      let it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) {
        it = { id: "SEM-" + Date.now().toString(36).toUpperCase(), semana: STATE.semana, owner: owner, proyecto: "Iniciativa Principal", todos: "", estado: "En proceso" };
        STATE.semanal.push(it);
      }
      const p = parsearTodos(it.todos || "");

      const targetIdx = (typeof taskIdx === "number") ? taskIdx : (typeof TARGET_IMAGE_TASK_IDX === "number" ? TARGET_IMAGE_TASK_IDX : null);
      if (typeof targetIdx === "number" && p.items[targetIdx]) {
        if (!p.items[targetIdx].images) p.items[targetIdx].images = [];
        p.items[targetIdx].images.push(url);
        notificar(`Imagen adjuntada a "${p.items[targetIdx].text || 'tarea'}"`);
      } else {
        p.images.push(url);
        notificar("Imagen adjuntada a la semana");
      }

      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);
      renderizarJerarquiaPersonas();
      TARGET_IMAGE_TASK_IDX = null;
    }

    function eliminarImagenDeTarea(owner, taskIdx, imgIdx) {
      let it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (p.items[taskIdx]?.images) {
        p.items[taskIdx].images.splice(imgIdx, 1);
        it.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(owner, "todos", it.todos);
        renderizarJerarquiaPersonas();
        if (VISOR_IMAGEN_ACTUAL.owner?.startsWith(owner) && VISOR_IMAGEN_ACTUAL.idx === imgIdx) {
          cerrarModalVisorImagen();
        }
        notificar("Imagen eliminada de la tarea");
      }
    }

    function handleArchivoImagenSeleccionado(inputEl) {
      const file = inputEl.files?.[0];
      if (file) {
        if (MODAL_ADJUNTAR_IMAGEN_ABIERTO) {
          previsualizarArchivoEnModal(file);
        } else {
          const owner = TARGET_IMAGE_OWNER || STATE.usuario?.nombre || (STATE.ownerFiltro !== "Todos" ? STATE.ownerFiltro : "") || STATE.equipo?.[0]?.nombre;
          procesarYAdjuntarImagen(file, owner, TARGET_IMAGE_TASK_IDX);
        }
      }
      inputEl.value = "";
    }

    async function pegarImagenDesdePortapapeles(owner, taskIdx = null) {
      if (typeof taskIdx === "number") TARGET_IMAGE_TASK_IDX = taskIdx;
      try {
        if (navigator.clipboard && navigator.clipboard.read) {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const imgType = item.types.find(t => t.startsWith("image/"));
            if (imgType) {
              const blob = await item.getType(imgType);
              procesarYAdjuntarImagen(blob, owner, TARGET_IMAGE_TASK_IDX);
              return;
            }
          }
        }
        abrirModalAdjuntarImagen(owner);
        notificar("Copiá una imagen y presioná Ctrl+V para adjuntarla");
      } catch (err) {
        abrirModalAdjuntarImagen(owner);
        notificar("Presioná Ctrl+V en tu teclado para pegar la imagen");
      }
    }

    // =========================================================================
    // MODAL PARA ADJUNTAR IMAGEN (DROP ZONE, PREVIEWS Y URLS)
    // =========================================================================
    let MODAL_ADJUNTAR_IMAGEN_ABIERTO = false;
    let MODAL_PENDING_FILE = null;

    function abrirModalAdjuntarImagen(owner, subTituloCustom = null) {
      TARGET_IMAGE_OWNER = owner || (STATE.ownerFiltro !== "Todos" ? STATE.ownerFiltro : "") || STATE.usuario?.nombre || STATE.equipo?.[0]?.nombre;
      MODAL_ADJUNTAR_IMAGEN_ABIERTO = true;
      MODAL_PENDING_FILE = null;

      const sub = document.getElementById("modalAdjuntarImagenSubtitulo");
      if (sub) {
        if (subTituloCustom) {
          const cTxt = subTituloCustom.length > 34 ? subTituloCustom.slice(0, 34) + "…" : subTituloCustom;
          sub.innerText = `Para tarea: "${cTxt}"`;
        } else {
          sub.innerText = `Para ${TARGET_IMAGE_OWNER || 'el equipo'} · Semana ${STATE.semana}`;
        }
      }

      const inp = document.getElementById("modalInputUrlImagen");
      if (inp) inp.value = "";

      limpiarPrevisualizacionModalImagen();

      const modal = document.getElementById("modalAdjuntarImagen");
      if (modal) modal.style.display = "flex";
    }

    function cerrarModalAdjuntarImagen() {
      MODAL_ADJUNTAR_IMAGEN_ABIERTO = false;
      MODAL_PENDING_FILE = null;
      TARGET_IMAGE_TASK_IDX = null;
      const modal = document.getElementById("modalAdjuntarImagen");
      if (modal) modal.style.display = "none";
    }

    function previsualizarArchivoEnModal(file) {
      if (!file) return;
      MODAL_PENDING_FILE = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.getElementById("modalImagePreviewImg");
        const cont = document.getElementById("modalImagePreviewContainer");
        const info = document.getElementById("modalImagePreviewInfo");
        const btn = document.getElementById("btnConfirmarSubirImagenModal");
        if (img) img.src = e.target.result;
        if (cont) cont.style.display = "block";
        if (info) info.innerText = `${file.name || 'Captura'} (${Math.round(file.size / 1024)} KB)`;
        if (btn) btn.style.display = "inline-flex";
      };
      reader.readAsDataURL(file);
    }

    function limpiarPrevisualizacionModalImagen() {
      MODAL_PENDING_FILE = null;
      const img = document.getElementById("modalImagePreviewImg");
      const cont = document.getElementById("modalImagePreviewContainer");
      const info = document.getElementById("modalImagePreviewInfo");
      const btn = document.getElementById("btnConfirmarSubirImagenModal");
      if (img) img.src = "";
      if (cont) cont.style.display = "none";
      if (info) info.innerText = "";
      if (btn) btn.style.display = "none";
    }

    function confirmarAdjuntarImagenDesdeModal() {
      if (!MODAL_PENDING_FILE) {
        notificar("Seleccioná o pegá una imagen primero");
        return;
      }
      const owner = TARGET_IMAGE_OWNER || STATE.usuario?.nombre || STATE.equipo?.[0]?.nombre;
      procesarYAdjuntarImagen(MODAL_PENDING_FILE, owner, TARGET_IMAGE_TASK_IDX);
      cerrarModalAdjuntarImagen();
    }

    function confirmarAdjuntarUrlImagen() {
      const inp = document.getElementById("modalInputUrlImagen");
      let url = (inp?.value || "").trim();
      if (!url) {
        notificar("Ingresá una URL de imagen válida");
        return;
      }
      if (url.includes("drive.google.com/file/d/")) {
        const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (m && m[1]) {
          url = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
        }
      }
      const owner = TARGET_IMAGE_OWNER || STATE.usuario?.nombre || STATE.equipo?.[0]?.nombre;
      adjuntarUrlImagenASemana(owner, url, TARGET_IMAGE_TASK_IDX);
      cerrarModalAdjuntarImagen();
    }

    function handleModalDropOver(e) {
      e.preventDefault();
      document.getElementById("imageDropZone")?.classList.add("drag-over");
    }

    function handleModalDropLeave(e) {
      e.preventDefault();
      document.getElementById("imageDropZone")?.classList.remove("drag-over");
    }

    function handleModalDrop(e) {
      e.preventDefault();
      document.getElementById("imageDropZone")?.classList.remove("drag-over");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file && file.type && file.type.startsWith("image/")) {
          previsualizarArchivoEnModal(file);
        } else {
          notificar("El archivo no es una imagen válida");
        }
      }
    }

    // =========================================================================
    let VISOR_IMAGEN_ACTUAL = { url: "", owner: "", idx: -1, isZoomed: false };

    function abrirModalVisorImagen(url, owner, idx) {
      VISOR_IMAGEN_ACTUAL = { url: url, owner: owner, idx: idx, isZoomed: false };
      const modal = document.getElementById("modalVisorImagen");
      const img = document.getElementById("lightboxImagenPrincipal");
      const tit = document.getElementById("lightboxTitulo");
      const sub = document.getElementById("lightboxSubtitulo");

      if (tit) tit.innerText = owner ? `Adjunto de ${owner}` : "Imagen de Referencia";
      if (sub) sub.innerText = `Semana ${STATE.semana}`;
      if (img) {
        img.src = url;
        img.classList.remove("is-zoomed");
      }
      const btnZoom = document.getElementById("btnZoomVisor");
      if (btnZoom) btnZoom.querySelector("span").innerText = "Zoom";

      if (modal) modal.style.display = "flex";
    }

    function cerrarModalVisorImagen() {
      const modal = document.getElementById("modalVisorImagen");
      const img = document.getElementById("lightboxImagenPrincipal");
      if (img) {
        img.src = "";
        img.classList.remove("is-zoomed");
      }
      if (modal) modal.style.display = "none";
      VISOR_IMAGEN_ACTUAL = { url: "", owner: "", idx: -1, isZoomed: false };
    }

    function toggleZoomVisorImagen() {
      const img = document.getElementById("lightboxImagenPrincipal");
      if (!img) return;
      VISOR_IMAGEN_ACTUAL.isZoomed = !VISOR_IMAGEN_ACTUAL.isZoomed;
      img.classList.toggle("is-zoomed", VISOR_IMAGEN_ACTUAL.isZoomed);
      const btn = document.getElementById("btnZoomVisor");
      if (btn) {
        btn.querySelector("span").innerText = VISOR_IMAGEN_ACTUAL.isZoomed ? "Ajustar" : "Zoom";
      }
    }

    function abrirImagenEnPestanaNueva(url) {
      const src = url || VISOR_IMAGEN_ACTUAL.url;
      if (!src) return;
      if (src.startsWith("data:")) {
        const blob = dataUrlToBlob(src);
        if (blob) {
          const blobUrl = URL.createObjectURL(blob);
          const w = window.open(blobUrl, "_blank");
          if (!w) notificar("Permití las ventanas emergentes en tu navegador");
          return;
        }
      }
      if (src.includes("drive.google.com/thumbnail?id=")) {

      window.open(src, "_blank");

    function descargarImagenActual() {

      if (!src) return;
      const nombre = `adjunto_${(VISOR_IMAGEN_ACTUAL.owner || 'peya').replace(/\s+/g, '_')}_${Date.now()}.png`;
      if (src.startsWith("data:")) {
        const blob = dataUrlToBlob(src);
        if (blob) {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = blobUrl;
          a.download = nombre;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          return;
        }
      }
      const a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function renderizarMarkdownInline(str) {

    function aplicarNegritaAInput(input) {
      if (!input) return;
      const start = input.selectionStart ?? 0;
      const end = input.selectionEnd ?? 0;
      const val = input.value || "";
      const selected = val.substring(start, end);

      let nuevoTexto = "";
      let nuevoStart = start;
      let nuevoEnd = end;

      if (selected.length > 0) {
        if (selected.startsWith("**") && selected.endsWith("**") && selected.length >= 4) {
          const limpio = selected.slice(2, -2);
          nuevoTexto = val.substring(0, start) + limpio + val.substring(end);
          nuevoStart = start;
          nuevoEnd = start + limpio.length;
        } else {
          const prevTwo = val.substring(Math.max(0, start - 2), start);
          const nextTwo = val.substring(end, Math.min(val.length, end + 2));
          if (prevTwo === "**" && nextTwo === "**") {
            nuevoTexto = val.substring(0, start - 2) + selected + val.substring(end + 2);
            nuevoStart = start - 2;
            nuevoEnd = end - 2;
          } else {
            nuevoTexto = val.substring(0, start) + "**" + selected + "**" + val.substring(end);
            nuevoStart = start + 2;
            nuevoEnd = end + 2;
          }
        }
      } else {
        const prevTwo = val.substring(Math.max(0, start - 2), start);
        const nextTwo = val.substring(end, Math.min(val.length, end + 2));
        if (prevTwo === "**" && nextTwo === "**") {
          nuevoTexto = val.substring(0, start - 2) + val.substring(end + 2);
          nuevoStart = start - 2;
          nuevoEnd = start - 2;
        } else {
          nuevoTexto = val.substring(0, start) + "****" + val.substring(end);
          nuevoStart = start + 2;
          nuevoEnd = start + 2;
        }
      }

      input.value = nuevoTexto;
      input.setSelectionRange(nuevoStart, nuevoEnd);
      input.classList.toggle("has-bold", nuevoTexto.includes("**"));
      try { input.dispatchEvent(new Event("input", { bubbles: true })); } catch (_) {}
      notificar("Formato negrita (**)");
    }

    function handleChecklistKeydown(e, owner, idx, isSub) {
      if (isSlashMenuOpen()) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          moverSlashMenu(1);
          return;
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          moverSlashMenu(-1);
          return;
        } else if (e.key === "Enter") {
          e.preventDefault();
          ejecutarSlashSeleccionado();
          return;
        } else if (e.key === "Escape") {
          e.preventDefault();
          cerrarSlashMenu();
          return;
        }
      }

      const isCtrlOrCmd = e.ctrlKey || e.metaKey;

      // Atajo Ctrl+B / Cmd+B para negritas
      if (isCtrlOrCmd && (e.key === "b" || e.key === "B")) {
        e.preventDefault();
        aplicarNegritaAInput(e.target);
        return;
      }

      if (e.key === "Escape") {
        e.preventDefault();
        e.target.blur();
        seleccionarFilaTarea(owner, idx, false, false);
        return;
      }

      if (isCtrlOrCmd && (e.key === "d" || e.key === "D")) {
        e.preventDefault();
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(idx);
        copiarTareasSeleccionadas(true);
        pegarTareas(owner, idx + 1);
        return;
      }

      // Reordenar tareas con teclado: Alt + ↑ (subir) o Alt + ↓ (bajar)
      if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault();
        moverTareaEnLista(owner, idx, e.key === "ArrowUp" ? -1 : 1);
        return;
      }

      if (e.key === "Tab") {
        e.preventDefault();
        const nuevoEstado = !e.shiftKey; // Tab indenta a subtarea (↳), Shift+Tab desindenta o sale del grupo
        toggleSubtareaItem(owner, idx, nuevoEstado);
      } else if (e.key === "Enter") {
        e.preventDefault();
        // Comportamiento Notion: Enter en una subtarea vacía la desindenta a tarea principal
        if (isSub && e.target.value.trim() === "") {
          toggleSubtareaItem(owner, idx, false);
          return;
        }
        agregarCheckItemNuevo(owner, idx + 1, isSub);
      } else if (e.key === "Backspace" && e.target.value === "") {
        e.preventDefault();
        if (isSub) {
          toggleSubtareaItem(owner, idx, false);
        } else {
          eliminarCheckItem(owner, idx, true);
        }
      }
    }

    function moverTareaEnLista(owner, idx, direccion) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (idx < 0 || idx >= p.items.length) return;
      if (p.items[idx]?.isGroupHeader) return;

      guardarEstadoHistorial();

      let targetFinalIdx = idx;

      // =========================================================================
      // CASO 1: MOVER SUBTAREA (isSubpoint === true) - Estilo Notion
      // =========================================================================
      if (p.items[idx].isSubpoint) {
        if (direccion < 0) {
          // --- Mover SUBTAREA hacia ARRIBA ---
          if (idx <= 0) return;
          const prevItem = p.items[idx - 1];

          if (prevItem.isGroupHeader) {
            // Tope de proyecto: no saltar el encabezado
            return;
          } else if (prevItem.isSubpoint) {
            // Sube e intercambia con otra subtarea hermana
            const item = p.items.splice(idx, 1)[0];
            p.items.splice(idx - 1, 0, item);
            targetFinalIdx = idx - 1;
          } else {
            // Subió por encima de su tarea padre: en Notion se promociona a tarea principal
            const item = p.items.splice(idx, 1)[0];
            item.isSubpoint = false; // Se convierte en tarea principal
            p.items.splice(idx - 1, 0, item);
            targetFinalIdx = idx - 1;
            notificar("Subtarea promovida a tarea principal ⇧");
          }
        } else {
          // --- Mover SUBTAREA hacia ABAJO ---
          if (idx + 1 >= p.items.length) return;
          const nextItem = p.items[idx + 1];

          if (nextItem.isGroupHeader) {
            // Tope inferior de proyecto: no cruzar al siguiente proyecto
            return;
          } else if (nextItem.isSubpoint) {
            // Baja e intercambia con otra subtarea hermana
            const item = p.items.splice(idx, 1)[0];
            p.items.splice(idx + 1, 0, item);
            targetFinalIdx = idx + 1;
          } else {
            // Bajó más allá de la última subtarea del padre, quedando antes de la siguiente tarea padre:
            // En Notion se desanida y se convierte en tarea principal hermana
            const item = p.items.splice(idx, 1)[0];
            item.isSubpoint = false;
            p.items.splice(idx, 0, item);
            targetFinalIdx = idx;
            notificar("Subtarea convertida en tarea principal ⇩");
          }
        }
      } 
      // =========================================================================
      // CASO 2: MOVER TAREA PRINCIPAL (Mueve a la tarea con TODAS sus subtareas)
      // =========================================================================
      else {
        // Identificar bloque familiar completo (padre + todas sus subtareas consecutivas)
        let childCount = 0;
        while (idx + 1 + childCount < p.items.length && p.items[idx + 1 + childCount].isSubpoint && !p.items[idx + 1 + childCount].isGroupHeader) {
          childCount++;
        }
        const familyBlock = p.items.slice(idx, idx + 1 + childCount);

        if (direccion < 0) {
          // --- Mover TAREA PADRE hacia ARRIBA ---
          if (idx <= 0) return;
          const prevIdx = idx - 1;
          if (p.items[prevIdx].isGroupHeader) {
            // Tope superior del proyecto: no salirse del proyecto con Alt+Up (usar Shift+Tab para salir de grupo)
            return;
          }

          // Encontrar el inicio de la familia anterior (padre de las subtareas de arriba)
          let prevFamilyStart = prevIdx;
          while (prevFamilyStart > 0 && p.items[prevFamilyStart].isSubpoint && !p.items[prevFamilyStart - 1].isGroupHeader) {
            prevFamilyStart--;
          }

          p.items.splice(idx, familyBlock.length);
          p.items.splice(prevFamilyStart, 0, ...familyBlock);
          targetFinalIdx = prevFamilyStart;
        } else {
          // --- Mover TAREA PADRE hacia ABAJO ---
          const nextIdx = idx + familyBlock.length;
          if (nextIdx >= p.items.length) return;
          if (p.items[nextIdx].isGroupHeader) {
            // Tope inferior del proyecto: no cruzar al siguiente proyecto
            return;
          }

          // Encontrar el final de la siguiente familia
          let nextFamilyEnd = nextIdx + 1;
          while (nextFamilyEnd < p.items.length && p.items[nextFamilyEnd].isSubpoint && !p.items[nextFamilyEnd].isGroupHeader) {
            nextFamilyEnd++;
          }

          p.items.splice(idx, familyBlock.length);
          const targetInsert = nextFamilyEnd - familyBlock.length;
          p.items.splice(targetInsert, 0, ...familyBlock);
          targetFinalIdx = targetInsert;
        }
      }

      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);
      renderizarJerarquiaPersonas();

      setTimeout(() => {
        const row = document.getElementById(`todo_row_${owner}_${targetFinalIdx}`);
        const input = row?.querySelector(".checklist-input");
        if (input) {
          input.focus();
          const valLen = input.value.length;
          input.setSelectionRange(valLen, valLen);
        }
        if (row) {
          row.classList.add("task-dropped-highlight");
          try { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => row.classList.remove("task-dropped-highlight"), 850);
        }
      }, 20);
    }

    function desplegarProyectoSiColapsado(key, bodyId, iconId) {
      if (STATE.colapsadoProyectos && STATE.colapsadoProyectos[key]) {
        STATE.colapsadoProyectos[key] = false;

    function moverGrupoSemanal(owner, groupIdx, direccion) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (!p.items[groupIdx] || !p.items[groupIdx].isGroupHeader) return;

      guardarEstadoHistorial();

      // 1. Identificar el bloque completo del grupo (encabezado + TODAS sus tareas pertenecientes)
      const start = groupIdx;
      let end = start + 1;
      while (end < p.items.length && !p.items[end].isGroupHeader && !p.items[end].isGroupClose) {
        end++;
      }
      if (end < p.items.length && p.items[end].isGroupClose) {
        end++;
      }
      const groupBlock = p.items.slice(start, end);

      // 2. Localizar todas las posiciones de encabezados de grupo
      const groupHeaders = [];
      p.items.forEach((item, idx) => {
        if (item.isGroupHeader) groupHeaders.push(idx);
      });
      const currentGroupPos = groupHeaders.indexOf(groupIdx);
      if (currentGroupPos === -1) return;

      const targetGroupPos = currentGroupPos + direccion;
      if (targetGroupPos < 0 || targetGroupPos >= groupHeaders.length) {
        notificar(direccion < 0 ? "El proyecto ya está en el primer lugar" : "El proyecto ya está en el último lugar");
        return;
      }

      // 3. Remover el bloque del grupo de su posición actual
      p.items.splice(start, groupBlock.length);

      // 4. Localizar la posición de destino en el arreglo ya modificado
      const remainingHeaders = [];
      p.items.forEach((item, idx) => {
        if (item.isGroupHeader) remainingHeaders.push(idx);
      });
      const destHeaderIdx = remainingHeaders[targetGroupPos < currentGroupPos ? targetGroupPos : targetGroupPos - 1];

      let insertIdx;
      if (direccion < 0) {
        // Al subir: se inserta en el índice del encabezado destino (desplaza hacia abajo al otro grupo)
        insertIdx = destHeaderIdx;
      } else {
        // Al bajar: se inserta después del encabezado destino y de todas sus tareas hijas
        let targetEnd = destHeaderIdx + 1;
        while (targetEnd < p.items.length && !p.items[targetEnd].isGroupHeader && !p.items[targetEnd].isGroupClose) {
          targetEnd++;
        }
        if (targetEnd < p.items.length && p.items[targetEnd].isGroupClose) {
          targetEnd++;
        }
        insertIdx = targetEnd;
      }

      p.items.splice(insertIdx, 0, ...groupBlock);
      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);
      renderizarJerarquiaPersonas();

      setTimeout(() => {
        const block = document.getElementById(`proy_block_${owner}_${insertIdx}`) || document.getElementById(`todo_row_${owner}_${insertIdx}`);
        if (block) {
          block.classList.add("task-dropped-highlight");
          try { block.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => block.classList.remove("task-dropped-highlight"), 850);
          const inp = block.querySelector(".todo-group-title-input");
          if (inp) inp.focus();
        }
      }, 30);
      notificar(`Proyecto "${groupBlock[0]?.title || ''}" y sus ${groupBlock.length - 1} tarea(s) movidos`);
    }

    function moverGrupoRecurrente(owner, frec, recId, direccion) {
      guardarEstadoHistorial();
      const recs = STATE.recurrentes.filter(r => r.owner === owner && (r.frecuencia || "Semanal").startsWith(frec));
      const groupHeaders = [];
      recs.forEach((r, idx) => {
        if (r.isGroupHeader || /^#{1,3}\s+/.test(r.tarea || "")) {
          groupHeaders.push({ id: r.id, idx });
        }
      });

      const curPos = groupHeaders.findIndex(g => g.id === recId);
      if (curPos === -1) return;

      const targetPos = curPos + direccion;
      if (targetPos < 0 || targetPos >= groupHeaders.length) return;

      const targetHeader = groupHeaders[targetPos];
      const globalStart = STATE.recurrentes.findIndex(r => r.id === recId);
      if (globalStart === -1) return;

      let globalEnd = globalStart + 1;
      while (globalEnd < STATE.recurrentes.length) {
        const nextR = STATE.recurrentes[globalEnd];
        if (nextR.owner !== owner || !(nextR.frecuencia || "Semanal").startsWith(frec)) break;
        if (nextR.isGroupHeader || /^#{1,3}\s+/.test(nextR.tarea || "")) break;
        globalEnd++;
      }
      const groupBlock = STATE.recurrentes.slice(globalStart, globalEnd);
      STATE.recurrentes.splice(globalStart, groupBlock.length);

      const globalTargetIdx = STATE.recurrentes.findIndex(r => r.id === targetHeader.id);
      if (globalTargetIdx === -1) {
        STATE.recurrentes.splice(globalStart, 0, ...groupBlock);
        return;
      }

      let insertIdx;
      if (direccion < 0) {
        insertIdx = globalTargetIdx;
      } else {
        let targetEnd = globalTargetIdx + 1;
        while (targetEnd < STATE.recurrentes.length) {
          const nextR = STATE.recurrentes[targetEnd];
          if (nextR.owner !== owner || !(nextR.frecuencia || "Semanal").startsWith(frec)) break;
          if (nextR.isGroupHeader || /^#{1,3}\s+/.test(nextR.tarea || "")) break;
          targetEnd++;
        }
        insertIdx = targetEnd;
      }

      STATE.recurrentes.splice(insertIdx, 0, ...groupBlock);
      callServer("guardarOrdenRecurrentes", STATE.recurrentes.map(r => r.id));
      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();
      setTimeout(() => {
        const row = document.getElementById(`sub_rec_${groupBlock[0]?.id}`);
        const block = row?.closest(".project-block-container") || row;
        if (block) {
          block.classList.add("task-dropped-highlight");
          try { block.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => block.classList.remove("task-dropped-highlight"), 850);
        }
      }, 25);
      notificar("Proyecto recurrente movido");
    }

    function moverRecurrenteEnLista(owner, frec, id, delta) {
      guardarEstadoHistorial();
      const recs = STATE.recurrentes.filter(r => r.owner === owner && (r.frecuencia || "Semanal").startsWith(frec));
      const curIdxInFrec = recs.findIndex(r => r.id === id);
      if (curIdxInFrec === -1) return;

      const targetIdxInFrec = curIdxInFrec + delta;
      if (targetIdxInFrec < 0 || targetIdxInFrec >= recs.length) return;

      const targetId = recs[targetIdxInFrec].id;
      const globalCurIdx = STATE.recurrentes.findIndex(r => r.id === id);
      const globalTargetIdx = STATE.recurrentes.findIndex(r => r.id === targetId);
      if (globalCurIdx === -1 || globalTargetIdx === -1) return;

      const [moved] = STATE.recurrentes.splice(globalCurIdx, 1);
      STATE.recurrentes.splice(globalTargetIdx, 0, moved);

      callServer("guardarOrdenRecurrentes", STATE.recurrentes.map(r => r.id));
      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();

      setTimeout(() => {
        const row = document.getElementById(`sub_rec_${id}`);
        if (row) {
          row.classList.add("task-dropped-highlight");
          try { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => row.classList.remove("task-dropped-highlight"), 850);
          const inp = row.querySelector(".checklist-input");
          if (inp) {
            inp.focus();
            const len = inp.value.length;
            inp.setSelectionRange(len, len);
          }
        }
      }, 20);
    }

    function moverFuturoEnLista(owner, id, delta) {
      guardarEstadoHistorial();
      const futs = STATE.futuros.filter(f => f.owner === owner);
      const curIdx = futs.findIndex(f => f.id === id);
      if (curIdx === -1) return;

      const targetIdx = curIdx + delta;
      if (targetIdx < 0 || targetIdx >= futs.length) return;

      const targetId = futs[targetIdx].id;
      const globalCurIdx = STATE.futuros.findIndex(f => f.id === id);
      const globalTargetIdx = STATE.futuros.findIndex(f => f.id === targetId);
      if (globalCurIdx === -1 || globalTargetIdx === -1) return;

      const [moved] = STATE.futuros.splice(globalCurIdx, 1);
      STATE.futuros.splice(globalTargetIdx, 0, moved);

      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();

      setTimeout(() => {
        const row = document.getElementById(`sub_fut_${id}`);
        if (row) {
          row.classList.add("task-dropped-highlight");
          try { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => row.classList.remove("task-dropped-highlight"), 850);
          const inp = row.querySelector(".subpoint-task-input") || row.querySelector("input");
          if (inp) {
            inp.focus();
            const len = inp.value.length;
            inp.setSelectionRange(len, len);
          }
        }
      }, 20);
    }

    function toggleSubtareaItem(owner, idx, nuevoEstado) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (idx < 0 || idx >= p.items.length) return;
      const item = p.items[idx];
      if (!item || item.isGroupHeader || item.isGroupClose) return;

      guardarEstadoHistorial();

      let targetFocusIdx = idx;

      // ── INDENTAR (TAB): Convertir en subtarea o reintegrar a grupo ────────
      if (nuevoEstado === true) {
        if (idx === 0) {
          notificar("No hay tarea superior para anidar como subtarea");
          return;
        }
        const prevItem = p.items[idx - 1];
        if (prevItem.isGroupClose) {
          // Si el elemento inmediatamente anterior es el cierre de un grupo,
          // al presionar Tab la tarea se reintegra al grupo anterior como su última tarea
          p.items.splice(idx - 1, 1);
          targetFocusIdx = idx - 1;
          notificar("Tarea integrada al proyecto anterior ⇨");
        } else if (prevItem.isGroupHeader) {
          notificar("No hay tarea superior para anidar como subtarea");
          return;
        } else {
          item.isSubpoint = true;
          notificar("Convertida en subtarea ↳");
        }
      }
      // ── DESINDENTAR / SALIR DE GRUPO (SHIFT + TAB) ────────────────────────
      else if (nuevoEstado === false) {
        if (item.isSubpoint) {
          // Si era subtarea: se promueve a tarea principal dentro de su grupo
          item.isSubpoint = false;
          notificar("Subtarea promovida a tarea principal ⇦");
        } else {
          // Ya era tarea principal: si está dentro de un proyecto, ¡SALE DEL GRUPO! (Comportamiento Notion)
          // 1. Encontrar si esta tarea está dentro de un grupo hacia arriba
          let enclosingGroupHeaderIdx = -1;
          for (let k = idx - 1; k >= 0; k--) {
            if (p.items[k].isGroupHeader) {
              enclosingGroupHeaderIdx = k;
              break;
            } else if (p.items[k].isGroupClose) {
              // Si hay un cierre antes, esta tarea ya está fuera de cualquier grupo
              break;
            }
          }

          if (enclosingGroupHeaderIdx !== -1) {
            // Contar subtareas hijas para mover a la familia completa fuera del grupo
            let childCount = 0;
            while (idx + 1 + childCount < p.items.length && p.items[idx + 1 + childCount].isSubpoint && !p.items[idx + 1 + childCount].isGroupHeader && !p.items[idx + 1 + childCount].isGroupClose) {
              childCount++;
            }
            const familyBlock = p.items.splice(idx, 1 + childCount);

            // Encontrar el final del grupo actual en p.items
            let currentGroupEnd = enclosingGroupHeaderIdx + 1;
            while (currentGroupEnd < p.items.length && !p.items[currentGroupEnd].isGroupHeader && !p.items[currentGroupEnd].isGroupClose) {
              currentGroupEnd++;
            }

            // Insertar cierre de grupo si no hay uno ya presente
            const needClose = (currentGroupEnd >= p.items.length || !p.items[currentGroupEnd].isGroupClose);
            if (needClose) {
              p.items.splice(currentGroupEnd, 0, { isGroupClose: true }, ...familyBlock);
              targetFocusIdx = currentGroupEnd + 1;
            } else {
              p.items.splice(currentGroupEnd + 1, 0, ...familyBlock);
              targetFocusIdx = currentGroupEnd + 1;
            }
            notificar("Tarea extraída del proyecto (fuera del grupo) ⇦");
          } else {
            notificar("La tarea ya se encuentra fuera de cualquier grupo");
            return;
          }
        }
      } else {
        item.isSubpoint = !item.isSubpoint;
      }

      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);
      renderizarJerarquiaPersonas();

      setTimeout(() => {
        const row = document.getElementById(`todo_row_${owner}_${targetFocusIdx}`);
        const input = row?.querySelector(".checklist-input");
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
        if (row) {
          row.classList.add("task-dropped-highlight");
          try { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
          setTimeout(() => row.classList.remove("task-dropped-highlight"), 850);
        }
      }, 30);
    }

    function esRecurrenteSub(r) {
      if (!r) return false;
      return !!r.isSubpoint || /\[(?:sub|subtarea)\]/i.test(r.links || "") || /^\s*(?:↳|&#8627;|\u21B3)/.test(r.tarea || "");
    }

    function moverRecurrenteFueraDeProyecto(owner, frec, id) {
      const recs = STATE.recurrentes.filter(x => x.owner === owner && (x.frecuencia || "Semanal").startsWith(frec));
      const curIdx = recs.findIndex(x => x.id === id);
      if (curIdx === -1) return;

      let enclosingGroupIdx = -1;
      for (let k = curIdx - 1; k >= 0; k--) {
        if (recs[k].isGroupHeader || /^#{1,3}\s+/.test(recs[k].tarea || "")) {
          enclosingGroupIdx = k;
          break;
        }
      }

      if (enclosingGroupIdx === -1) {
        notificar("La tarea ya se encuentra en el nivel principal");
        return;
      }

      const firstGroup = recs.find(x => x.isGroupHeader || /^#{1,3}\s+/.test(x.tarea || ""));
      if (!firstGroup) return;

      const globalIdIdx = STATE.recurrentes.findIndex(x => x.id === id);
      const globalFirstGrpIdx = STATE.recurrentes.findIndex(x => x.id === firstGroup.id);
      if (globalIdIdx === -1 || globalFirstGrpIdx === -1) return;

      const item = STATE.recurrentes.splice(globalIdIdx, 1)[0];
      const insertPos = (globalIdIdx < globalFirstGrpIdx) ? globalFirstGrpIdx - 1 : globalFirstGrpIdx;
      STATE.recurrentes.splice(insertPos, 0, item);

      callServer("guardarOrdenRecurrentes", STATE.recurrentes.map(r => r.id));
      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();
      notificar("Tarea recurrente extraída del proyecto al nivel general ⇦");
    }

    function handleRecKeydown(e, owner, frec, id) {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;
      if (isCtrlOrCmd && (e.key === "b" || e.key === "B")) {
        e.preventDefault();
        aplicarNegritaAInput(e.target);
        return;
      }

      if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault();
        moverRecurrenteEnLista(owner, frec, id, e.key === "ArrowUp" ? -1 : 1);
        return;
      }

      if (e.key === "Tab") {
        e.preventDefault();
        const r = STATE.recurrentes.find(x => x.id === id);
        if (r) {
          if (e.shiftKey) {
            // Shift + Tab: desindenta subtarea o sale del grupo
            if (r.isSubpoint) {
              r.isSubpoint = false;
              let lks = (r.links || "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
              r.links = lks;
              renderizarJerarquiaPersonas();
              callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
              notificar("Subtarea recurrente promovida ⇦");
            } else {
              moverRecurrenteFueraDeProyecto(owner, frec, id);
            }
          } else {
            // Tab: indenta a subtarea si tiene padre arriba
            const recsFrec = STATE.recurrentes.filter(x => x.owner === owner && (x.frecuencia || "Semanal").startsWith(frec));
            const curIdx = recsFrec.findIndex(x => x.id === id);
            if (curIdx > 0 && !recsFrec[curIdx - 1].isGroupHeader && !/^#{1,3}\s+/.test(recsFrec[curIdx - 1].tarea || "")) {
              r.isSubpoint = true;
              let lks = (r.links || "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
              r.links = (lks ? lks + " " : "") + "[sub]";
              renderizarJerarquiaPersonas();
              callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
              notificar("Convertida en subtarea recurrente ↳");
            } else {
              notificar("No hay tarea superior para anidar como subtarea");
            }
          }
          setTimeout(() => {
            const row = document.querySelector(`[ondrop*="${id}"]`) || document.querySelector(`#sub_rec_${id}`);
            row?.querySelector(".checklist-input")?.focus();
          }, 30);
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (!e.target.value?.trim()) return;
        agregarRecurrenteConFrecuencia(owner, frec, id);
      } else if (e.key === "Backspace" && e.target.value === "") {
        e.preventDefault();
        const r = STATE.recurrentes.find(x => x.id === id);
        if (r && r.isSubpoint) {
          r.isSubpoint = false;
          r.links = (r.links || "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
          renderizarJerarquiaPersonas();
          callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
        } else {
          eliminarRecurrenteDirecto(id);
        }
      }
    }

    // Modal de Confirmación In-App
    let _confirmCallback = null;

      const overlay = document.getElementById("modalConfirmOverlay");
      const titEl = document.getElementById("modalConfirmTitulo");
      const msgEl = document.getElementById("modalConfirmMensaje");
      if (titEl) titEl.textContent = titulo || "¿Eliminar tarea?";

        }, 50);

      if (overlay) overlay.style.display = "none";
      _confirmCallback = null;
    }
    function ejecutarConfirmacionInApp() {
      if (typeof _confirmCallback === "function") {
        const cb = _confirmCallback;
        cerrarModalConfirm();
        cb();
      } else {
        cerrarModalConfirm();
      }
    }
    function handleModalConfirmKeydown(e) {

        e.stopPropagation();

    function toggleCheckRecurrente(id, chk) {
      guardarEstadoHistorial();

      if (!r) return;
      const fLower = (r.frecuencia || "").toLowerCase();

      if (fLower.includes("diari")) {
        const hoyKey = obtenerFechaHoyKey();
        if (!r.checksDiarios) r.checksDiarios = {};
        r.checksDiarios[hoyKey] = chk;
      } else if (fLower.includes("mensual") || fLower.includes("cierre")) {
        const mesKey = obtenerMesActualKey();
        if (!r.checksMensuales) r.checksMensuales = {};
        r.checksMensuales[mesKey] = chk;
      } else {
        const semKey = STATE.semana || STATE.semanaActual;
        if (!r.semanasCompletadas) r.semanasCompletadas = {};
        r.semanasCompletadas[semKey] = chk;
      }

      r.estado = JSON.stringify({
        diarios: r.checksDiarios || {},
        semanas: r.semanasCompletadas || {},
        meses: r.checksMensuales || {}
      });

      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();

        callServer("actualizarCampoRecurrente", r.id, "estado", r.estado, r.owner, r.tarea);

    function editarTextoRecurrente(id, txt) {
      const r = STATE.recurrentes.find(x => x.id === id);
      if (!r || r.tarea === txt) return;

      r.isGroupHeader = /^\s*#{1,3}\s+/.test(txt);

      const tieneHistoricoPrevio = (r.semanasCompletadas && Object.keys(r.semanasCompletadas).length > 0) || (r.checksDiarios && Object.keys(r.checksDiarios).length > 0);
      if (tieneHistoricoPrevio && r.tarea) {
        if (!r.historialVersiones) r.historialVersiones = [];
        const ult = r.historialVersiones[r.historialVersiones.length - 1];
        if (!ult || ult.tarea !== r.tarea) {
          const semPrev = obtenerSemanaAnterior(STATE.semana) || STATE.semana;
          r.historialVersiones.push({ tarea: r.tarea, hastaSemana: semPrev, fecha: obtenerFechaHoyKey() });
        }
      }

      r.tarea = txt;
      r.desdeSemana = STATE.semana;
      r.estado = JSON.stringify({
        diarios: r.checksDiarios || {},
        semanas: r.semanasCompletadas || {},
        meses: r.checksMensuales || {},
        versiones: r.historialVersiones || []
      });

      debounce(`rec_${id}`, () => {
        callServer("actualizarCampoRecurrente", id, "tarea", txt, r.owner, txt);
        callServer("actualizarCampoRecurrente", id, "estado", r.estado, r.owner, txt);
      }, 600);
    }

      guardarEstadoHistorial();
      const nuevo = {
        id: "REC-" + Date.now().toString(36).toUpperCase(),

    // =========================================================================
    // MODAL DE ENLACES
    // =========================================================================
    let _modalCtx = null;
    function abrirModalLink(ctx) {
      _modalCtx = ctx;
      const taskInput = document.getElementById("modalTaskName");
      if (taskInput) taskInput.value = ctx.taskName || "";
      document.getElementById("modalLinkUrl").value = ctx.initialUrl || "";
      document.getElementById("modalLinkLabel").value = ctx.initialLabel || "";
      document.getElementById("modalLinkOverlay").style.display = "flex";
      setTimeout(() => {
        const urlInp = document.getElementById("modalLinkUrl");
        if (urlInp) urlInp.focus();
      }, 40);
    }
    function cerrarModalLink() { document.getElementById("modalLinkOverlay").style.display = "none"; _modalCtx = null; }

    function handleModalLinkKeydown(e) {
      if (e.key === "Enter") { e.preventDefault(); confirmarGuardarLink(); }
      else if (e.key === "Escape") { cerrarModalLink(); }
    }
    function autoDetectarNombreReporte(url) {
      const lbl = document.getElementById("modalLinkLabel");
      if (!lbl || lbl.value.trim() !== "" || !url) return;
      try {
        const u = new URL(url);
        if (u.hostname.includes("sheets") || u.hostname.includes("docs.google")) lbl.value = "Google Sheet";
        else if (u.hostname.includes("datahub")) lbl.value = "Data Hub";
        else if (u.hostname.includes("looker") || u.hostname.includes("datastudio")) lbl.value = "Looker Dashboard";
        else lbl.value = u.hostname.replace("www.", "");
      } catch (_) {}
    }

    function confirmarGuardarLink() {
      if (!_modalCtx) return;
      const taskName = (document.getElementById("modalTaskName")?.value || "").trim();
      const url = (document.getElementById("modalLinkUrl").value || "").trim();
      const label = (document.getElementById("modalLinkLabel").value || "").trim() || "Link";

      if (_modalCtx.type === "todo") {
        const it = STATE.semanal.find(s => s.owner === _modalCtx.owner && coincidenSemanasClient(s.semana, STATE.semana));
        if (it) {
          const p = parsearTodos(it.todos || "");
          if (p.items[_modalCtx.index]) {
            if (taskName) p.items[_modalCtx.index].text = taskName;
            if (url && /^https?:\/\//i.test(url)) {
              p.items[_modalCtx.index].link = { url, label };
            } else {
              p.items[_modalCtx.index].link = null; // Vacío por defecto si no se agrega URL
            }
            it.todos = serializarTodos(p.items, p.images);
            guardarCampoPersonaSemana(_modalCtx.owner, "todos", it.todos);
          }
        }
      } else if (_modalCtx.type === "rec") {
        const r = STATE.recurrentes.find(x => x.id === _modalCtx.id);
        if (r) {
          if (taskName && r.tarea !== taskName) {
            const tieneHistoricoPrevio = (r.semanasCompletadas && Object.keys(r.semanasCompletadas).length > 0) || (r.checksDiarios && Object.keys(r.checksDiarios).length > 0);
            if (tieneHistoricoPrevio && r.tarea) {
              if (!r.historialVersiones) r.historialVersiones = [];
              r.historialVersiones.push({ tarea: r.tarea, hastaSemana: STATE.semana, fecha: obtenerFechaHoyKey() });
            }
            r.tarea = taskName;
            r.desdeSemana = STATE.semana;
          }
          const autoTag = esRecurrenteAuto(r) ? "[auto]" : "";
          const subTag = esRecurrenteSub(r) ? "[sub]" : "";
          const tags = [autoTag, subTag].filter(Boolean).join(" ");
          if (url && /^https?:\/\//i.test(url)) {
            r.links = `[link:${url}|${label}]${tags ? ' ' + tags : ''}`;
          } else {
            r.links = tags; // Vacío por defecto (solo tags de metadata si existieran)
          }
          callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
          r.estado = JSON.stringify({
            diarios: r.checksDiarios || {},
            semanas: r.semanasCompletadas || {},
            meses: r.checksMensuales || {},
            versiones: r.historialVersiones || []
          });
          callServer("actualizarCampoRecurrente", r.id, "tarea", r.tarea, r.owner, r.tarea);
          callServer("actualizarCampoRecurrente", r.id, "estado", r.estado, r.owner, r.tarea);
        }
      }
      cerrarModalLink();
      renderizarJerarquiaPersonas();
      notificar("Guardado correctamente");
    }

    function adjuntarLinkItem(owner, idx) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      const p = parsearTodos(it?.todos || "");
      const item = p.items[idx];
      abrirModalLink({
        type: "todo",
        owner,
        index: idx,
        taskName: item?.text || "",
        initialUrl: item?.link?.url,
        initialLabel: item?.link?.label
      });
    }
    function quitarLinkItem(owner, idx) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (p.items[idx]) { p.items[idx].link = null; it.todos = serializarTodos(p.items, p.images); guardarCampoPersonaSemana(owner, "todos", it.todos); renderizarJerarquiaPersonas(); }
    }
    function adjuntarLinkRecurrente(id) {
      const r = STATE.recurrentes.find(x => x.id === id);
      const lk = obtenerLinkData(r?.links);
      abrirModalLink({
        type: "rec",
        id,
        taskName: r?.tarea || "",
        initialUrl: lk?.url,
        initialLabel: lk?.label
      });
    }
    function quitarLinkRecurrente(id) {
      const r = STATE.recurrentes.find(x => x.id === id);
      if (r) { r.links = ""; callServer("actualizarCampoRecurrente", id, "links", "", r.owner, r.tarea); renderizarJerarquiaPersonas(); }
    }
    function obtenerLinkData(raw) {
      if (!raw) return null;
      if (typeof raw === "object" && raw.url) {
        if (/^https?:\/\//i.test(raw.url)) return raw;
        return null;
      }
      const str = String(raw).trim().replace(/\[(?:auto|automatizado)\]/gi, "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
      if (!str) return null;
      const m = str.match(RGX_LINK_TAG);
      if (m && /^https?:\/\//i.test(m[1].trim())) return { url: m[1].trim(), label: m[2] || "Link" };
      if (/^https?:\/\//i.test(str)) return { url: str, label: "Link" };
      return null;
    }

    // =========================================================================
    // DRAG & DROP COMPACTO & FLUIDO
    // =========================================================================
    let DRAG_ITEM = null;

    function crearGhostArrastre(texto, isSub, count) {
      const ghost = document.createElement("div");
      ghost.className = "custom-drag-ghost";
      const txt = (texto || "").trim();
      const txtCorto = txt.length > 36 ? txt.slice(0, 36) + "…" : txt;
      ghost.innerHTML = `
        <span class="ghost-icon">${isSub ? '↳' : '•'}</span>
        <span>${escapeHtml(txtCorto || 'Mover tarea')}</span>
        ${count > 1 ? `<span class="ghost-badge">${count} tareas</span>` : ''}
      `;
      document.body.appendChild(ghost);
      return ghost;
    }

    function activarDragFila(el) {
      const row = el?.closest(".checklist-row, .todo-group-header, .rec-group-header-row, .fut-group-header-row");
      if (row) row.setAttribute("draggable", "true");
    }

    function desactivarDragFila(el) {
      if (!DRAG_ITEM) {
        const row = el?.closest(".checklist-row, .todo-group-header, .rec-group-header-row, .fut-group-header-row");
        if (row) row.setAttribute("draggable", "false");
      }
    }

    function handleTodoDragStart(e, owner, idx) {
      const isHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
      if (!isHandle && e.currentTarget.getAttribute("draggable") !== "true") {
        e.preventDefault();
        return false;
      }

      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      const p = parsearTodos(it?.todos || "");
      const itemData = p.items[idx];

      if (itemData?.isGroupHeader) {
        let grpCount = 0;
        let k = idx + 1;
        while (k < p.items.length && !p.items[k].isGroupHeader) {
          grpCount++;
          k++;
        }
        DRAG_ITEM = { type: 'todo-group', owner, idx, title: itemData.title, count: grpCount };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
        e.currentTarget.classList.add("is-dragging");

        try {
          const ghost = crearGhostArrastre(itemData.title || "Mover proyecto", false, grpCount || 1);
          e.dataTransfer.setDragImage(ghost, 22, 16);
          setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
        } catch (_) {}
        return;
      }

      let multipleIndices = null;
      if (SELECTED_TODOS.owner === owner && SELECTED_TODOS.indices.has(idx) && SELECTED_TODOS.indices.size > 1) {
        multipleIndices = Array.from(SELECTED_TODOS.indices).sort((a, b) => a - b);
      }

      // Si es una tarea padre con subtareas hijas y no hay selección múltiple activa:
      let childCount = 0;
      if (!multipleIndices && !itemData?.isSubpoint) {
        while (idx + 1 + childCount < p.items.length && p.items[idx + 1 + childCount].isSubpoint && !p.items[idx + 1 + childCount].isGroupHeader) {
          childCount++;
        }
      }

      if (childCount > 0) {
        DRAG_ITEM = { type: 'todo-family', owner, idx, count: 1 + childCount, title: itemData?.text };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
        e.currentTarget.classList.add("is-dragging");

        try {
          const ghost = crearGhostArrastre(itemData?.text || "Mover tarea", false, 1 + childCount);
          e.dataTransfer.setDragImage(ghost, 22, 16);
          setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
        } catch (_) {}
        return;
      }

      DRAG_ITEM = { type: 'todo', owner, idx, multiple: multipleIndices };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
      e.currentTarget.classList.add("is-dragging");

      try {
        const count = multipleIndices ? multipleIndices.length : 1;
        const ghost = crearGhostArrastre(itemData?.text || "Mover tarea", itemData?.isSubpoint, count);
        e.dataTransfer.setDragImage(ghost, 22, 16);
        setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
      } catch (_) {}
    }

    function handleRecDragStart(e, owner, id) {
      const isHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
      if (!isHandle && e.currentTarget.getAttribute("draggable") !== "true") {
        e.preventDefault();
        return false;
      }

      const rec = STATE.recurrentes.find(r => r.id === id);
      if (rec?.isGroupHeader || /^#{1,3}\s+/.test(rec?.tarea || "")) {
        const title = (rec.tarea || "").replace(/^#{1,3}\s+/, "");
        DRAG_ITEM = { type: 'rec-group', owner, id, title };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
        e.currentTarget.classList.add("is-dragging");
        try {
          const ghost = crearGhostArrastre(title || "Mover proyecto recurrente", false, 1);
          e.dataTransfer.setDragImage(ghost, 22, 16);
          setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
        } catch (_) {}
        return;
      }

      DRAG_ITEM = { type: 'rec', owner, id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
      e.currentTarget.classList.add("is-dragging");

      try {
        const ghost = crearGhostArrastre(rec?.tarea || "Mover recurrente", false, 1);
        e.dataTransfer.setDragImage(ghost, 22, 16);
        setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
      } catch (_) {}
    }

    function handleBolsaDragStart(e, id) {
      DRAG_ITEM = { type: 'bolsa', id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));

      try {
        const b = STATE.bolsa.find(x => String(x.id) === String(id));
        const ghost = crearGhostArrastre(b?.titulo || "Mover iniciativa", false, 1);
        e.dataTransfer.setDragImage(ghost, 22, 16);
        setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
      } catch (_) {}
    }

    let _dragIsSubpointTarget = false;
    let _dragDropPosition = "before";

    function handleRowDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const row = e.currentTarget;
      const rect = row.getBoundingClientRect();
      const relY = e.clientY - rect.top;
      const isBottom = relY > (rect.height / 2);
      const offsetX = e.clientX - rect.left;

      const isHeader = row.classList.contains("todo-group-header") || row.classList.contains("rec-group-header-row") || row.classList.contains("fut-group-header-row");
      _dragIsSubpointTarget = (offsetX > 35 && !isHeader);
      _dragDropPosition = isBottom ? "after" : "before";

      document.querySelectorAll(".checklist-row, .todo-group-header, .rec-group-header-row, .fut-group-header-row").forEach(r => {
        if (r !== row) r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      });

      row.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      if (_dragDropPosition === "after") {
        row.classList.add("drag-over-after");
      } else if (_dragIsSubpointTarget) {
        row.classList.add("drag-over-subpoint");
      } else {
        row.classList.add("drag-over");
      }
    }

    function handleRowDragLeave(e) {
      if (!e.currentTarget.contains(e.relatedTarget)) {
        e.currentTarget.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      }
    }

    function handleRowDragEnd(e) {
      document.querySelectorAll(".checklist-row, .todo-group-header, .rec-group-header-row, .fut-group-header-row").forEach(r => {
        r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint", "is-dragging");
        r.setAttribute("draggable", "false");
      });
      DRAG_ITEM = null;
      _dragIsSubpointTarget = false;
      _dragDropPosition = "before";
    }

    function handleTodoDrop(e, targetOwner, targetIdx) {
      e.preventDefault();
      e.stopPropagation();
      document.querySelectorAll(".checklist-row, .todo-group-header, .rec-group-header-row, .fut-group-header-row").forEach(r => r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint", "is-dragging"));

      // Detección de archivo de imagen arrastrado desde el escritorio o explorador
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file && file.type && file.type.startsWith("image/")) {
          procesarYAdjuntarImagen(file, targetOwner, targetIdx);
          return;
        }
      }

      if (!DRAG_ITEM) return;

      // Transferencia de grupos completos entre secciones:
      if (DRAG_ITEM.type === "fut-group") {
        moverGrupoASeccion("fut", DRAG_ITEM.owner, DRAG_ITEM.id, "sem");
        DRAG_ITEM = null;
        return;
      }
      if (DRAG_ITEM.type === "rec-group") {
        moverGrupoASeccion("rec", DRAG_ITEM.owner, DRAG_ITEM.id, "sem");
        DRAG_ITEM = null;
        return;
      }

      const targetSem = STATE.semanal.find(s => s.owner === targetOwner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!targetSem) { DRAG_ITEM = null; return; }
      const p = parsearTodos(targetSem.todos || "");

      let insertIdx = (_dragDropPosition === "after") ? targetIdx + 1 : targetIdx;
      let finalGlowIdx = insertIdx;

      if (DRAG_ITEM.type === "todo-group" && DRAG_ITEM.owner === targetOwner) {
        guardarEstadoHistorial();
        const start = DRAG_ITEM.idx;
        let end = start + 1;
        while (end < p.items.length && !p.items[end].isGroupHeader) {
          end++;
        }
        const groupBlock = p.items.slice(start, end);
        p.items.splice(start, groupBlock.length);

        let insertPos = targetIdx;
        if (start < targetIdx) {
          insertPos = Math.max(0, insertPos - groupBlock.length);
        }
        if (_dragDropPosition === "after") {
          if (p.items[insertPos]?.isGroupHeader) {
            let nextGrpEnd = insertPos + 1;
            while (nextGrpEnd < p.items.length && !p.items[nextGrpEnd].isGroupHeader) {
              nextGrpEnd++;
            }
            insertPos = nextGrpEnd;
          } else {
            insertPos++;
          }
        }
        if (insertPos > p.items.length) insertPos = p.items.length;

        p.items.splice(insertPos, 0, ...groupBlock);
        targetSem.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
        finalGlowIdx = insertPos;
        notificar(`Proyecto "${DRAG_ITEM.title || ''}" reordenado`);

      } else if (DRAG_ITEM.type === "todo-family" && DRAG_ITEM.owner === targetOwner) {
        guardarEstadoHistorial();
        const start = DRAG_ITEM.idx;
        const familyBlock = p.items.slice(start, start + DRAG_ITEM.count);
        p.items.splice(start, familyBlock.length);

        let insertPos = targetIdx;
        if (start < targetIdx) {
          insertPos = Math.max(0, insertPos - familyBlock.length);
        }
        if (_dragDropPosition === "after") {
          let destEnd = insertPos + 1;
          while (destEnd < p.items.length && p.items[destEnd].isSubpoint && !p.items[destEnd].isGroupHeader) {
            destEnd++;
          }
          insertPos = destEnd;
        }
        if (insertPos > p.items.length) insertPos = p.items.length;

        p.items.splice(insertPos, 0, ...familyBlock);
        targetSem.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
        finalGlowIdx = insertPos;
        notificar(`Tarea y sus ${familyBlock.length - 1} subtarea(s) reordenadas`);

      } else if (DRAG_ITEM.type === "todo" && DRAG_ITEM.owner === targetOwner) {
        guardarEstadoHistorial();
        if (DRAG_ITEM.multiple && DRAG_ITEM.multiple.length > 1) {
          const movingIndices = DRAG_ITEM.multiple;
          const movingItems = movingIndices.map(i => p.items[i]).filter(Boolean);
          p.items = p.items.filter((_, i) => !movingIndices.includes(i));

          let newPos = targetIdx;
          if (_dragDropPosition === "after") newPos++;
          if (newPos > p.items.length) newPos = p.items.length;

          p.items.splice(newPos, 0, ...movingItems);
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          SELECTED_TODOS.indices.clear();
          finalGlowIdx = newPos;
          notificar(`${movingItems.length} tareas reordenadas`);
        } else {
          const itemOrigin = p.items[DRAG_ITEM.idx];
          if (DRAG_ITEM.idx < insertIdx) insertIdx--;
          if (DRAG_ITEM.idx === insertIdx && itemOrigin && itemOrigin.isSubpoint === _dragIsSubpointTarget) {
            DRAG_ITEM = null; return;
          }
          const moved = p.items.splice(DRAG_ITEM.idx, 1)[0];
          if (moved) {
            if (!moved.isGroupHeader) {
              let targetIsSub = _dragIsSubpointTarget;
              if (targetIsSub && (insertIdx === 0 || p.items[insertIdx - 1]?.isGroupHeader)) {
                targetIsSub = false;
              }
              moved.isSubpoint = targetIsSub;
            }
            p.items.splice(insertIdx, 0, moved);
            targetSem.todos = serializarTodos(p.items, p.images);
            guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
            finalGlowIdx = insertIdx;
            notificar(moved.isSubpoint ? "Convertida en subtarea ↳" : "Orden de prioridades actualizado");
          }
        }
      } else if (DRAG_ITEM.type === "rec") {
        guardarEstadoHistorial();
        const rec = STATE.recurrentes.find(r => r.id === DRAG_ITEM.id);
        if (rec) {
          p.items.splice(insertIdx, 0, { text: rec.tarea, checked: false, isSubpoint: _dragIsSubpointTarget, link: obtenerLinkData(rec.links) });
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          finalGlowIdx = insertIdx;
          notificar("Tarea recurrente copiada a la semana");
        }
      } else if (DRAG_ITEM.type === "bolsa") {
        guardarEstadoHistorial();
        const b = STATE.bolsa.find(x => String(x.id) === String(DRAG_ITEM.id));
        if (b) {
          p.items.splice(insertIdx, 0, { text: b.titulo, checked: false, isSubpoint: _dragIsSubpointTarget, link: null });
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          callServer("asignarTareaBolsaAMiembro", b.id, targetOwner, false, STATE.semana);
          finalGlowIdx = insertIdx;
          notificar("Tarea asignada a la semana");
        }
      }
      DRAG_ITEM = null;
      _dragIsSubpointTarget = false;
      _dragDropPosition = "before";
      renderizarJerarquiaPersonas();

      // Efecto suave de resplandor (glow) en la fila donde cayó la tarea
      if (typeof finalGlowIdx === "number") {
        setTimeout(() => {
          const row = document.getElementById(`todo_row_${targetOwner}_${finalGlowIdx}`);
          if (row) {
            row.classList.add("task-dropped-highlight");
            setTimeout(() => row.classList.remove("task-dropped-highlight"), 850);
          }
        }, 20);
      }
