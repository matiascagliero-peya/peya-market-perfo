    // =========================================================================
    // LLAMADAS AL SERVIDOR, PERSISTENCIA Y SINCRONIZACIÓN EN VIVO
    // =========================================================================
    let CLIENT_DATA_VERSION = null;
    let LIVE_SYNC_TIMER = null;
    let LIVE_SECONDS_TIMER = null;
    let LAST_SYNC_TIME = Date.now();
    let IS_SYNCING = false;
    let IS_SAVING = false;

    function refrescarTimestampSincronizacion() {
      LAST_SYNC_TIME = Date.now();
      const el = document.getElementById("connSecondsAgo");
      if (el) el.textContent = "0s";
    }

    function callServer(fn, ...args) {
      persistirMemoriaLocal();
      const runner = getRunner();
      if (!runner?.[fn]) {
        actualizarPillConexion(false, "Modo local: guardado en memoria");
        notificar("Guardado localmente");
        return;
      }
      try {
        IS_SAVING = true;
        runner.withSuccessHandler(res => {
          IS_SAVING = false;
          refrescarTimestampSincronizacion();
          if (res?.version) CLIENT_DATA_VERSION = res.version;
          actualizarPillConexion(true);
          notificar("Guardado en Google Sheets");
        })
        .withFailureHandler(err => {
          IS_SAVING = false;
          actualizarPillConexion(false, err?.message || err);
          notificar("Guardado localmente");
        })
        [fn](...args);
      } catch (e) {
        IS_SAVING = false;
        actualizarPillConexion(false, e.message);
      }
    }

    function iniciarSincronizacionEnVivo() {
      if (LIVE_SYNC_TIMER) clearInterval(LIVE_SYNC_TIMER);
      if (LIVE_SECONDS_TIMER) clearInterval(LIVE_SECONDS_TIMER);

      LAST_SYNC_TIME = Date.now();

      // Contador continuo de segundos estilo 1s o 2s
      LIVE_SECONDS_TIMER = setInterval(() => {
        const el = document.getElementById("connSecondsAgo");
        if (!el) return;
        const diff = Math.max(0, Math.floor((Date.now() - LAST_SYNC_TIME) / 1000));
        el.textContent = `${diff}s`;
      }, 1000);

      // Verificación en segundo plano cada 4 segundos
      LIVE_SYNC_TIMER = setInterval(() => {
        verificarCambiosEnVivo();
      }, 4000);

      // Al regresar a la pestaña, sincronizar de inmediato
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          verificarCambiosEnVivo(true);
        }
      });

      window.addEventListener("focus", () => {
        verificarCambiosEnVivo(true);
      });
    }

    let PENDING_REMOTE_SYNC_DATA = null;

    function verificarCambiosEnVivo(forzar = false) {
      if (document.hidden && !forzar) return;
      if (IS_SAVING || IS_SYNCING) return;

      // Si el usuario está escribiendo activamente, no interrumpir foco
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");
      if (isTyping && !forzar) return;

      const runner = getRunner();
      if (!runner || typeof runner.verificarVersionDatos !== "function") return;

      IS_SYNCING = true;
      const currentVer = CLIENT_DATA_VERSION || "";
      const userInfo = {
        email: STATE.usuario?.email || "",
        nombre: STATE.usuario?.nombre || ""
      };

      runner
        .withSuccessHandler(res => {
          IS_SYNCING = false;
          refrescarTimestampSincronizacion();
          if (!res) return;

          if (Array.isArray(res.conectados)) {
            actualizarUsuariosConectadosUI(res.conectados);
          }

          if (res.alDia) {
            actualizarPillConexion(true);
            return;
          }

          CLIENT_DATA_VERSION = res.version;
          if (res.datos) {
            aplicarCambiosRemotosEnVivo(res.datos);
          }
        })
        .withFailureHandler(() => {
          IS_SYNCING = false;
        })
        .verificarVersionDatos(currentVer, STATE.semana, userInfo);
    }

    function actualizarUsuariosConectadosUI(conectados) {
      const el = document.getElementById("connUsersText");
      const pill = document.getElementById("sheetsConnectionBadge");
      if (!el) return;

      let lista = Array.isArray(conectados) ? conectados.filter(Boolean) : [];
      if (!lista.length && STATE.usuario?.nombre) {
        const pNom = STATE.usuario.nombre.trim().split(" ")[0];
        lista = [pNom.charAt(0).toUpperCase() + pNom.slice(1)];
      }

      if (!lista.length) {
        el.textContent = "";
        if (pill) pill.title = "Estado de conexión con Google Sheets. Clic para ver detalles.";
        return;
      }

      el.textContent = ` · ${lista.join(", ")}`;
      if (pill) {
        pill.title = `Conectados en vivo (${lista.length}): ${lista.join(", ")}. Clic para ver diagnósticos.`;
      }
    }

    function aplicarCambiosRemotosEnVivo(d) {
      if (!d) return;

      // Si el usuario está escribiendo activamente, posponer la actualización de UI para no robar el foco
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");
      if (isTyping) {
        PENDING_REMOTE_SYNC_DATA = d;
        return;
      }

      // Actualizar datos
      if (d.recurrentes) STATE.recurrentes = d.recurrentes;
      if (d.futuros) STATE.futuros = d.futuros;
      if (d.bolsa) STATE.bolsa = d.bolsa;
      if (d.equipo?.length) STATE.equipo = d.equipo;
      if (d.seguimientoSemanal) STATE.semanal = d.seguimientoSemanal;

      // Re-renderizar la vista actual
      renderizarTodo();
      actualizarBadges();

      // Efecto visual en la barra de conexión
      const pill = document.getElementById("sheetsConnectionBadge");
      const label = document.getElementById("connLabel");
      const dot = document.getElementById("connDot");
      if (dot) dot.style.background = "#10B981";
      if (label) {
        label.textContent = "Sincronizado en vivo";
        setTimeout(() => { if (label) label.textContent = "En vivo"; }, 3000);
      }
      notificar("Cambios de tu equipo sincronizados en vivo");
    }

    window.addEventListener("focusout", e => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
        setTimeout(() => {
          const active = document.activeElement;
          if (!active || (active.tagName !== "INPUT" && active.tagName !== "TEXTAREA")) {
            if (PENDING_REMOTE_SYNC_DATA) {
              const d = PENDING_REMOTE_SYNC_DATA;
              PENDING_REMOTE_SYNC_DATA = null;
              aplicarCambiosRemotosEnVivo(d);
            }
          }
        }, 250);
      }
    });

    function guardarCampoPersonaSemana(owner, campo, val) {
      let it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) {
        it = { id: "SEM-" + Date.now().toString(36).toUpperCase(), semana: STATE.semana, owner: owner, proyecto: "Iniciativa Principal", todos: "", estado: "En proceso" };
        STATE.semanal.push(it);
      }
      it[campo] = val;
      callServer("guardarSeguimientoSemanal", it);
      notificar("Guardado");
    }

    function actualizarPillConexion(conectado, detalle) {
      const pill = document.getElementById("sheetsConnectionBadge"), label = document.getElementById("connLabel"), dot = document.getElementById("connDot");
      if (!pill || !label || !dot) return;
      pill.className = `connection-status-pill ${conectado ? 'conn-ok' : 'conn-warn'}`;
      dot.style.background = conectado ? "#10B981" : "#F59E0B";
      label.textContent = conectado ? "En vivo" : "Local";
      pill.title = detalle || (conectado ? "Sincronizado en tiempo real con Google Sheets." : "Sin conexión.");
    }

    function mostrarDiagnosticoSheets() {
      const modal = document.getElementById("modalDiagnosticoSheets"); if (!modal) return;
      modal.style.display = "flex";
      const spId = STATE.conexionSheets?.spreadsheetId || CONFIG.SPREADSHEET_ID;
      document.getElementById("diagBodyContent").innerHTML = `
        <div style="font-size:12px;line-height:1.6;">
          <strong>Estado:</strong> ${STATE.conexionSheets?.conectado ? 'Conectado a Google Sheets' : 'Desconectado / Local'}<br>
          <strong>Planilla ID:</strong> <code>${spId}</code><br>
          <strong>Tareas cargadas:</strong> ${STATE.semanal.length} semanales, ${STATE.recurrentes.length} recurrentes, ${STATE.bolsa.length} en bolsa.
        </div>
      `;
    }
    function cerrarModalDiagnostico() { document.getElementById("modalDiagnosticoSheets").style.display = "none"; }
    function forzarSincronizacionCompleta() { cerrarModalDiagnostico(); inicializarApp(); }

    // =========================================================================
    // VISTAS: TIMELINE, BOLSA Y ADMIN
    // =========================================================================
    function cambiarFiltroTipoTimeline(val) {
      STATE.timelineFiltroTipo = val || "semanal";
      try { localStorage.setItem("peya_app_tl_tipo", STATE.timelineFiltroTipo); } catch (_) {}
      renderizarTimeline();
    }

    function irASemanaYPersona(owner, semana) {
      STATE.semana = semana;
      const selSem = document.getElementById("selectSemanaActual");
      if (selSem) selSem.value = semana;
      STATE.ownerFiltro = owner || "Todos";
      const selOwn = document.getElementById("selectFiltroOwner");
      if (selOwn) selOwn.value = STATE.ownerFiltro;
      try {
        localStorage.setItem("peya_app_semana", semana);
        localStorage.setItem("peya_app_owner", STATE.ownerFiltro);
        localStorage.setItem("peya_app_tab", "semanal");
      } catch (_) {}
      actualizarBadges();
      actualizarBotonesNavegacionSemana();
      seleccionarTab("semanal");
      renderizarJerarquiaPersonas();
      setTimeout(() => {
        const card = document.getElementById(`card_persona_${owner}`);
        card?.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }

    let TIMELINE_DRAG = null;
    function handleTimelineTodoDragStart(e, id, owner, semana, idx) {
      TIMELINE_DRAG = { type: 'todo', id, owner, semana, idx };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(TIMELINE_DRAG));
      e.currentTarget.classList.add("is-dragging");
    }
    function handleTimelineTaskDragStart(e, id, owner, semana) {
      TIMELINE_DRAG = { type: 'init', id, owner, semana };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(TIMELINE_DRAG));
      e.currentTarget.classList.add("is-dragging");
    }
    function handleTimelineTaskDragEnd(e) {
      document.querySelectorAll(".timeline-card, .timeline-task-item").forEach(c => c.classList.remove("is-dragging"));
      document.querySelectorAll(".timeline-td-week").forEach(c => c.classList.remove("timeline-cell-drop-target"));
      TIMELINE_DRAG = null;
    }
    function handleTimelineCellDragOver(e) {
      if (!TIMELINE_DRAG) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const cell = e.currentTarget;
      if (!cell.classList.contains("timeline-cell-drop-target")) {
        document.querySelectorAll(".timeline-td-week").forEach(c => { if (c !== cell) c.classList.remove("timeline-cell-drop-target"); });
        cell.classList.add("timeline-cell-drop-target");
      }
    }
    function handleTimelineCellDragLeave(e) { e.currentTarget.classList.remove("timeline-cell-drop-target"); }
    function handleTimelineCellDrop(e, targetOwner, targetSemana) {
      e.preventDefault();
      document.querySelectorAll(".timeline-td-week").forEach(c => c.classList.remove("timeline-cell-drop-target"));
      document.querySelectorAll(".timeline-card, .timeline-task-item").forEach(c => c.classList.remove("is-dragging"));

      if (TIMELINE_DRAG) {
        const { type, owner: srcOwner, semana: srcSemana, idx: srcIdx, id: srcId } = TIMELINE_DRAG;
        TIMELINE_DRAG = null;

        if (srcOwner === targetOwner && coincidenSemanasClient(srcSemana, targetSemana)) return;

        if (type === "todo") {
          const srcSem = STATE.semanal.find(s => s.owner === srcOwner && coincidenSemanasClient(s.semana, srcSemana));
          if (!srcSem) return;
          const pSrc = parsearTodos(srcSem.todos || "");
          const movedTask = pSrc.items.splice(srcIdx, 1)[0];
          if (!movedTask) return;
          srcSem.todos = serializarTodos(pSrc.items, pSrc.images);
          guardarCampoPersonaSemana(srcOwner, "todos", srcSem.todos);

          let destSem = STATE.semanal.find(s => s.owner === targetOwner && coincidenSemanasClient(s.semana, targetSemana));
          if (!destSem) {
            destSem = {
              id: "SEM-" + Date.now().toString(36).toUpperCase(),
              semana: targetSemana,
              owner: targetOwner,
              proyecto: "Iniciativas de la Semana",
              todos: "",
              estado: "En proceso"
            };
            STATE.semanal.push(destSem);
          }
          const pDest = parsearTodos(destSem.todos || "");
          pDest.items.push(movedTask);
          destSem.todos = serializarTodos(pDest.items, pDest.images);
          guardarCampoPersonaSemana(targetOwner, "todos", destSem.todos);

          persistirMemoriaLocal();
          renderizarTimeline();
          renderizarJerarquiaPersonas();
          notificar(`Tarea "${movedTask.text}" movida a ${targetSemana.split('|')[0].trim()} (${targetOwner})`);
        } else {
          let task = STATE.semanal.find(x => x.id === srcId);
          if (!task) task = STATE.semanal.find(x => x.owner === srcOwner && coincidenSemanasClient(x.semana, srcSemana));
          if (!task) return;

          const destExistente = STATE.semanal.find(x => x.owner === targetOwner && coincidenSemanasClient(x.semana, targetSemana));
          if (destExistente && destExistente.id !== task.id) {
            const pSrc = parsearTodos(task.todos || "");
            const pDest = parsearTodos(destExistente.todos || "");
            pSrc.items.forEach(it => pDest.items.push(it));
            destExistente.todos = serializarTodos(pDest.items, pDest.images.concat(pSrc.images));
            task.todos = "";
            callServer("guardarSeguimientoSemanal", destExistente);
            callServer("guardarSeguimientoSemanal", task);
          } else {
            task.semana = targetSemana;
            task.owner = targetOwner;
            callServer("guardarSeguimientoSemanal", task);
          }

          persistirMemoriaLocal();
          renderizarTimeline();
          renderizarJerarquiaPersonas();
          notificar(`Iniciativa movida a ${targetSemana.split('|')[0].trim()} (${targetOwner})`);
        }
      }
    }

    function toggleCheckItemTimeline(owner, semana, idx, chk) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (p.items[idx]) {
        p.items[idx].checked = chk;
        it.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(owner, "todos", it.todos);
        renderizarTimeline();
        renderizarJerarquiaPersonas();
        notificar(chk ? "Tarea marcada como terminada" : "Tarea desmarcada");
      }
    }

    function eliminarCheckItemDesdeTimeline(owner, semana, idx) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      const itemText = p.items[idx]?.text || "esta tarea";
      confirmarEliminarInApp(
        "¿Eliminar tarea de la semana?",
        `¿Eliminar "${itemText}" de la semana de ${owner}?`,
        () => {
          p.items.splice(idx, 1);
          it.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(owner, "todos", it.todos);
          renderizarTimeline();
          renderizarJerarquiaPersonas();
          notificar("Tarea eliminada");
        }
      );
    }

    function obtenerSemanaAnterior(semana) {
      if (!semana || !STATE.semanas?.length) return null;
      const idx = STATE.semanas.findIndex(s => coincidenSemanasClient(s, semana));
      if (idx > 0) return STATE.semanas[idx - 1];
      return null;
    }

    function ejecutarRolloverTareasPendientes(semanaDestino) {
      const semDest = semanaDestino || STATE.semana;
      if (!semDest || !STATE.equipo?.length) return;
      if (esSemanaPasada(semDest)) return;

      const semPrev = obtenerSemanaAnterior(semDest);
      if (!semPrev) return;

      let totalRolled = 0;
      STATE.equipo.forEach(m => {
        const itPrev = STATE.semanal.find(s => s.owner === m.nombre && coincidenSemanasClient(s.semana, semPrev));
        if (!itPrev || !itPrev.todos) return;

        const pPrev = parsearTodos(itPrev.todos);
        const noCompletadas = pPrev.items.filter(it => !it.checked && (it.text || "").trim().length > 0);
        if (!noCompletadas.length) return;

        let itCur = STATE.semanal.find(s => s.owner === m.nombre && coincidenSemanasClient(s.semana, semDest));
        if (!itCur) {
          itCur = {
            id: "SEM-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5),
            semana: semDest,
            owner: m.nombre,
            proyecto: itPrev.proyecto || "Iniciativas de la Semana",
            todos: "",
            estado: "En proceso"
          };
          STATE.semanal.push(itCur);
        }

        const pCur = parsearTodos(itCur.todos || "");
        let cambiaron = false;

        noCompletadas.forEach(itPend => {
          const textoClean = itPend.text.trim().toLowerCase();
          const yaExiste = pCur.items.some(x => x.text.trim().toLowerCase() === textoClean);
          if (!yaExiste) {
            pCur.items.push({
              text: itPend.text,
              checked: false,
              isSubpoint: itPend.isSubpoint,
              link: itPend.link
            });
            cambiaron = true;
            totalRolled++;
          }
        });

        if (cambiaron) {
          itCur.todos = serializarTodos(pCur.items, pCur.images);
          callServer("guardarSeguimientoSemanal", itCur);
        }
      });

      if (totalRolled > 0) {
        persistirMemoriaLocal();
        notificar(`${totalRolled} tarea(s) pendiente(s) se trasladaron automáticamente a esta semana`);
      }
    }

    function eliminarTareaDesdeTimeline(e, id, owner, semana) {
      if (e) e.stopPropagation();
      const semNombre = (semana || "").split('|')[0].trim();
      confirmarEliminarInApp(
        "¿Eliminar iniciativa de la semana?",
        `¿Estás seguro de eliminar las iniciativas de ${owner} en ${semNombre}?`,
        () => {
          STATE.semanal = STATE.semanal.filter(x => {
            if (id && x.id === id) return false;
            if (x.owner === owner && coincidenSemanasClient(x.semana, semana)) return false;
            return true;
          });
          renderizarTimeline();
          renderizarJerarquiaPersonas();
          callServer("eliminarSeguimientoSemanal", id, owner, semana);
          notificar("Iniciativa eliminada");
        }
      );
    }

    function renderizarTimeline() {
      const cont = document.getElementById("timelineContainer");
      if (!cont) return;
      const semanas = STATE.semanas || [];
      if (!semanas.length || !STATE.equipo.length) {
        cont.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-muted);">Cargando línea de tiempo desde Google Sheets...</div>`;
        return;
      }
      const filtro = STATE.timelineFiltroTipo || "semanal";

      let miembros = STATE.equipo || [];
      if (STATE.timelineOwnerFiltro && STATE.timelineOwnerFiltro !== "Todos") {
        miembros = miembros.filter(m => m.nombre === STATE.timelineOwnerFiltro);
      }

      let html = `<table class="timeline-table"><thead><tr><th class="timeline-th-person">Miembro</th>` +
        semanas.map(s => {
          const isCur = coincidenSemanasClient(s, STATE.semanaActual);
          const isPast = !isCur && esSemanaPasada(s);
          const isFut = !isCur && !isPast;
          const weekThClass = isCur ? 'is-current-week' : (isPast ? 'is-past-week' : 'is-future-week');

          let badgeHtml = "";
          if (isCur) {
            badgeHtml = `<div style="display:flex;justify-content:center;"><span class="timeline-current-week-badge">Semana Actual</span></div>`;
          } else if (isPast) {
            badgeHtml = `<div style="display:flex;justify-content:center;"><span class="timeline-week-badge badge-past">Histórico</span></div>`;
          } else if (isFut) {
            badgeHtml = `<div style="display:flex;justify-content:center;"><span class="timeline-week-badge badge-future">Planificación</span></div>`;
          }

          return `<th class="timeline-th-week ${weekThClass}">
            ${badgeHtml}
            <span style="font-weight:${isCur ? '900' : '800'};font-size:${isCur ? '12px' : '11px'};">${escapeHtml(s.split('|')[0])}</span>
            <div style="font-size:9.5px;color:${isCur ? '#1D4ED8' : (isPast ? 'var(--text-muted)' : '#4338CA')};font-weight:${isCur ? '700' : '500'};">${escapeHtml(s.split('|')[1] || '')}</div>
          </th>`;
        }).join("") +
        `</tr></thead><tbody>`;

      miembros.forEach(m => {
        html += `<tr><td class="timeline-td-person"><strong>${escapeHtml(m.nombre)}</strong></td>`;
        semanas.forEach(s => {
          let semanalContent = "";
          let recurrentesContent = "";
          let futurosContent = "";

          // 1. Iniciativas y Tareas Semanales (si filtro es 'todas' o 'semanal')
          if (filtro === "todas" || filtro === "semanal") {
            const itemsSem = STATE.semanal.filter(x => x.owner === m.nombre && coincidenSemanasClient(x.semana, s));
            let semCardsHtml = "";
            itemsSem.forEach(t => {
              const parsed = parsearTodos(t.todos || "");
              const semTotal = parsed.items.length;
              const semDone = parsed.items.filter(it => it.checked).length;
              const proyTitle = (t.proyecto || "").trim() || "Iniciativas de la Semana";

              let rowsHtml = "";
              if (semTotal > 0) {
                rowsHtml = `<div class="timeline-todos-list">` + parsed.items.map((it, idx) => {
                  if (!(it.text || "").trim()) return "";
                  return `
                    <div class="timeline-task-row ${it.isSubpoint ? 'is-subtask' : ''} ${it.checked ? 'is-completed' : ''}" draggable="true"
                         ondragstart="handleTimelineTodoDragStart(event, '${t.id}', '${escapeHtml(m.nombre)}', '${escapeHtml(s)}', ${idx})"
                         ondragend="handleTimelineTaskDragEnd(event)"
                         title="${it.isSubpoint ? 'Subtarea ↳' : 'Tarea •'} (Arrastrá a otra semana · Check para marcar)">
                      <span class="drag-handle" style="font-size:9px;padding:0;" title="Arrastrar">&#8942;&#8942;</span>
                      ${it.isSubpoint ? `<span style="color:var(--accent-blue);font-weight:800;font-size:10px;">↳</span>` : ''}
                      <input type="checkbox" class="timeline-task-check" ${it.checked ? 'checked' : ''}
                             onclick="event.stopPropagation(); toggleCheckItemTimeline('${escapeHtml(m.nombre)}', '${escapeHtml(s)}', ${idx}, this.checked)"
                             title="${it.checked ? 'Marcar como pendiente' : 'Marcar como terminada'}">
                      <span class="timeline-task-name ${it.checked ? 'checked-text' : ''}"
                            onclick="irASemanaYPersona('${escapeHtml(m.nombre)}', '${escapeHtml(s)}')">
                        ${escapeHtml(it.text)}
                      </span>
                      <button class="btn-del-mini" style="font-size:10px;padding:0 2px;"
                              onclick="event.stopPropagation(); eliminarCheckItemDesdeTimeline('${escapeHtml(m.nombre)}', '${escapeHtml(s)}', ${idx})"
                              title="Eliminar tarea">&times;</button>
                    </div>
                  `;
                }).join("") + `</div>`;
              }

              semCardsHtml += `
                <div class="timeline-box-semanal">
                  <div class="timeline-box-header">
                    <div style="display:flex;align-items:center;gap:5px;flex:1;overflow:hidden;">
                      <span class="timeline-tag-pill tag-pill-semanal">Semanal</span>
                      <span class="timeline-proy-title" onclick="irASemanaYPersona('${escapeHtml(m.nombre)}', '${escapeHtml(s)}')" title="${escapeHtml(proyTitle)}">${escapeHtml(proyTitle)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:3px;flex-shrink:0;">
                      ${semTotal > 0 ? `<span class="timeline-counter-badge ${semDone === semTotal ? 'all-done' : ''}">${semDone}/${semTotal}</span>` : ''}
                      <button class="btn-del-mini" style="font-size:11px;padding:0 2px;" onclick="eliminarTareaDesdeTimeline(event, '${t.id}', '${escapeHtml(m.nombre)}', '${escapeHtml(s)}')" title="Eliminar iniciativa">&times;</button>
                    </div>
                  </div>
                  ${rowsHtml}
                </div>
              `;
            });
            semanalContent = semCardsHtml;
          }

          // 2. Tareas Recurrentes (si filtro es 'todas' o 'recurrentes')
          if (filtro === "todas" || filtro === "recurrentes") {
            const recs = STATE.recurrentes.filter(r => r.owner === m.nombre);
            let recItemsHtml = "";
            recs.forEach(r => {
              let chk = false;
              const fLower = (r.frecuencia || "").toLowerCase();
              let frecClass = "frec-pill-semanal", frecTxt = "Semanal";
              if (fLower.includes("diari")) {
                frecClass = "frec-pill-diario"; frecTxt = "Diario";
                chk = coincidenSemanasClient(s, STATE.semanaActual) ? !!r.checksDiarios?.[obtenerFechaHoyKey()] : !!r.semanasCompletadas?.[s];
              } else if (fLower.includes("mensual") || fLower.includes("cierre")) {
                frecClass = "frec-pill-mensual"; frecTxt = "Mensual";
                chk = !!r.checksMensuales?.[obtenerMesActualKey()];
              } else {
                chk = !!r.semanasCompletadas?.[s];
              }
              const txt = obtenerTextoRecurrenteParaSemana(r, s);
              if (txt) {
                const isAuto = esRecurrenteAuto(r);
                recItemsHtml += `
                  <div class="timeline-rec-item ${chk ? 'is-completed' : ''}" onclick="irASemanaYPersona('${escapeHtml(m.nombre)}', '${escapeHtml(s)}')" title="${chk ? 'Completada en ' + s : 'Pendiente en ' + s}">
                    <input type="checkbox" class="timeline-rec-check" ${chk ? 'checked' : ''}
                           onclick="event.stopPropagation(); toggleCheckRecurrente('${r.id}', this.checked)" title="Marcar recurrente">
                    <span class="timeline-frec-pill ${frecClass}">${frecTxt}</span>
                    ${isAuto ? `<span style="display:inline-flex;align-items:center;color:#047857;" title="Automatizado"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></span>` : ''}
                    <span class="timeline-rec-name ${chk ? 'checked-text' : ''}">
                      ${escapeHtml(txt)}
                    </span>
                    <button class="btn-del-mini" style="font-size:10px;padding:0 2px;margin-left:auto;" onclick="event.stopPropagation(); eliminarRecurrenteDirecto('${r.id}')" title="Eliminar recurrente">&times;</button>
                  </div>
                `;
              }
            });
            if (recItemsHtml) {
              recurrentesContent = `<div class="timeline-rec-container">${recItemsHtml}</div>`;
            }
          }

          // 3. Próximos / Futuros (si filtro es 'todas' o 'futuros')
          if (filtro === "todas" || filtro === "futuros") {
            const futuros = STATE.futuros.filter(f => f.owner === m.nombre && f.estado !== "Promovido");
            let futItemsHtml = "";
            futuros.forEach(f => {
              futItemsHtml += `
                <div class="timeline-fut-item" onclick="irASemanaYPersona('${escapeHtml(m.nombre)}', '${escapeHtml(s)}')" title="Target: ${escapeHtml(f.target || 'A definir')}">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
                    <div style="display:flex;align-items:center;gap:4px;overflow:hidden;">
                      <span class="timeline-tag-pill tag-pill-fut">Próximo</span>
                      <span class="timeline-fut-title">↳ ${escapeHtml(f.tema || 'Iniciativa')}</span>
                    </div>
                    <button class="btn-del-mini" style="font-size:10px;padding:0 2px;" onclick="event.stopPropagation(); eliminarFuturoDirecto('${f.id}')" title="Eliminar tema">&times;</button>
                  </div>
                  <div style="font-size:9.5px;color:var(--text-muted);font-weight:600;padding-left:4px;">${escapeHtml(f.target || '')}</div>
                </div>
              `;
            });
            if (futItemsHtml) {
              futurosContent = `<div style="display:flex;flex-direction:column;gap:4px;">${futItemsHtml}</div>`;
            }
          }

          let cellHtml = "";
          if (semanalContent || recurrentesContent || futurosContent) {
            cellHtml = `<div class="timeline-cell-container">${semanalContent}${recurrentesContent}${futurosContent}</div>`;
          } else {
            cellHtml = `<button class="timeline-btn-planificar" onclick="crearTareaParaPersonaSemana('${escapeHtml(m.nombre)}', '${escapeHtml(s)}')">+ Planificar Semana</button>`;
          }

          const isCur = coincidenSemanasClient(s, STATE.semanaActual);
          const isPast = !isCur && esSemanaPasada(s);
          const weekTdClass = isCur ? 'is-current-week' : (isPast ? 'is-past-week' : 'is-future-week');

          html += `<td class="timeline-td-week ${weekTdClass}"
                       ondragover="handleTimelineCellDragOver(event)"
                       ondragleave="handleTimelineCellDragLeave(event)"
                       ondrop="handleTimelineCellDrop(event, '${escapeHtml(m.nombre)}', '${escapeHtml(s)}')">${cellHtml}</td>`;
        });
        html += `</tr>`;
      });
      cont.innerHTML = html + `</tbody></table>`;
    }

    let _timelineCreateCtx = null;
    function crearTareaParaPersonaSemana(owner, sem) {
      _timelineCreateCtx = { owner, sem };
      const modal = document.getElementById("modalNuevaIniciativaTimeline");
      const tit = document.getElementById("modalTimelineTitulo");
      const sub = document.getElementById("modalTimelineSubtitulo");
      const inpProy = document.getElementById("modalTimelineInputProyecto");
      const inpTodo = document.getElementById("modalTimelineInputPrimerTodo");

      if (tit) tit.textContent = `Nueva Iniciativa para ${owner}`;
      if (sub) sub.textContent = `Semana: ${sem.split('|')[0].trim()}`;
      if (inpProy) inpProy.value = "";
      if (inpTodo) inpTodo.value = "";

      if (modal) modal.style.display = "flex";
      setTimeout(() => inpProy?.focus(), 40);
    }

    function cerrarModalNuevaIniciativaTimeline() {
      const modal = document.getElementById("modalNuevaIniciativaTimeline");
      if (modal) modal.style.display = "none";
      _timelineCreateCtx = null;
    }

    function handleTimelineModalKeydown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmarCrearIniciativaTimeline();
      } else if (e.key === "Escape") {
        cerrarModalNuevaIniciativaTimeline();
      }
    }

    function confirmarCrearIniciativaTimeline() {
      if (!_timelineCreateCtx) return;
      const { owner, sem } = _timelineCreateCtx;
      const proy = (document.getElementById("modalTimelineInputProyecto")?.value || "").trim();
      const primerTodo = (document.getElementById("modalTimelineInputPrimerTodo")?.value || "").trim();

      if (!proy) {
        notificar("Escribí el título de la iniciativa");
        document.getElementById("modalTimelineInputProyecto")?.focus();
        return;
      }

      const initialTodo = primerTodo ? `- [ ] ${primerTodo}` : "- [ ] Iniciar";

      let t = STATE.semanal.find(x => x.owner === owner && coincidenSemanasClient(x.semana, sem));
      if (t) {
        t.proyecto = proy;
        if (!t.todos || !t.todos.trim()) t.todos = initialTodo;
        else if (primerTodo) t.todos += `\n${initialTodo}`;
      } else {
        t = {
          id: "SEM-" + Date.now().toString(36).toUpperCase(),
          semana: sem,
          owner: owner,
          proyecto: proy,
          todos: initialTodo,
          estado: "En proceso"
        };
        STATE.semanal.push(t);
      }

      cerrarModalNuevaIniciativaTimeline();
      callServer("guardarSeguimientoSemanal", t);
      renderizarTimeline();
      renderizarJerarquiaPersonas();
      notificar(`Iniciativa creada para ${owner}`);
    }

    function desplazarVentanaTimeline(d) {
      const wrap = document.getElementById("timelineWrapper");
      if (!wrap) return;
      wrap.scrollBy({ left: d * 280, behavior: "smooth" });
    }

    function centrarTimelineEnSemanaActual(inmediato = false) {
      const scrollFn = () => {
        const wrap = document.getElementById("timelineWrapper");
        const cur = wrap?.querySelector(".timeline-th-week.is-current-week");
        if (wrap && cur && cur.offsetLeft > 0) {
          const personColWidth = 190;
          const left = cur.offsetLeft;
          const w = wrap.clientWidth;
          const scrollTarget = left - personColWidth - ((w - personColWidth) / 2) + (cur.offsetWidth / 2);
          wrap.scrollTo({ left: Math.max(0, scrollTarget), behavior: inmediato ? "auto" : "smooth" });
        }
      };
      setTimeout(scrollFn, 50);
      setTimeout(scrollFn, 200);
      setTimeout(scrollFn, 500);
    }

    function renderizarBolsa() {
      const cont = document.getElementById("contenedorBolsa"); if (!cont) return;

        if (prio !== "Todas" && (b.prioridad || "").toLowerCase() !== prio.toLowerCase()) return false;
        if (q && !b.titulo?.toLowerCase().includes(q) && !b.descripcion?.toLowerCase().includes(q)) return false;

      });

      if (!items.length) {
        cont.innerHTML = `
          <div style="padding: 50px 20px; text-align: center; background: #FFFFFF; border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); margin-top: 6px;">

              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
            </div>
            <div style="font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px;">No hay tareas pendientes en la bolsa</div>
            <div style="font-size: 12px; color: var(--text-secondary); max-width: 380px; margin: 0 auto 16px auto;">
              No se encontraron iniciativas con los filtros actuales. Podés publicar una nueva iniciativa para el equipo.
            </div>
            <button class="btn btn-black" onclick="toggleFormNuevaBolsaInline()">+ Publicar Nueva Tarea</button>
          </div>

      cont.innerHTML = `<div class="bolsa-grid">` + items.map(b => {
        const pilarClass = `pilar-${(b.pilar || 'performance').toLowerCase()}`;
        const pilarBorderClass = `pilar-border-${(b.pilar || 'performance').toLowerCase()}`;

        return `
          <div class="bolsa-card ${pilarBorderClass}" draggable="true" ondragstart="handleBolsaDragStart(event, '${b.id}')" title="Arrastrá esta tarjeta a la semana de un analista para asignarla">
            <div class="bolsa-card-header">
              <span class="bolsa-card-title">${escapeHtml(b.titulo)}</span>
              <div class="bolsa-card-badges">
                <span class="pilar-badge ${pilarClass}">${escapeHtml(b.pilar || 'General')}</span>
                <span class="bolsa-priority-pill ${prioClass}">${escapeHtml(b.prioridad || 'Media')}</span>
              </div>
            </div>
            ${b.descripcion ? `<div class="bolsa-card-desc">${escapeHtml(b.descripcion)}</div>` : ''}
            <div class="bolsa-card-footer">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:11px;font-weight:700;color:var(--text-secondary);">Asignar a:</span>
                <select class="bolsa-assign-select" onchange="asignarTareaBolsaASelect('${b.id}', this.value)">
                  <option value="">Elegir analista...</option>
                  ${STATE.equipo.map(m => `<option value="${escapeHtml(m.nombre)}">${escapeHtml(m.nombre)}</option>`).join("")}
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:4px;">
                <span class="bolsa-drag-hint" title="Arrastrá al tablero semanal">&#8942;&#8942; Arrastrar</span>
                <button class="btn-del-mini" style="margin-left:4px;" onclick="eliminarTareaBolsaDirecto('${b.id}')" title="Eliminar de la bolsa">&times;</button>
              </div>
            </div>
          </div>
        `;
      }).join("") + `</div>`;

    function filtrarBolsa() { renderizarBolsa(); }
    function toggleFormNuevaBolsaInline() {
      const box = document.getElementById("boxNuevaBolsaInline");
      if (box) box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function guardarTareaBolsaInlineDirecto() {
      const tit = document.getElementById("bolsa_in_titulo")?.value?.trim();
      if (!tit) { notificar("Escribí el título de la tarea"); return; }
      const b = {
        id: "BOL-" + Date.now().toString(36).toUpperCase(), titulo: tit,
        descripcion: document.getElementById("bolsa_in_desc")?.value?.trim() || "",
        pilar: document.getElementById("bolsa_in_pilar")?.value || "Performance",
        prioridad: document.getElementById("bolsa_in_prioridad")?.value || "Media",
        creado_por: STATE.usuario?.nombre || "Analista", asignado_a: "Sin asignar", estado: "Pendiente"
      };
      STATE.bolsa.push(b);
      toggleFormNuevaBolsaInline();
      actualizarBadges();
      renderizarBolsa();
      callServer("guardarTareaBolsa", b);
      notificar("Publicado en la bolsa");

    function eliminarTareaBolsaDirecto(id) {
      const b = STATE.bolsa.find(x => String(x.id) === String(id));
      confirmarEliminarInApp("¿Eliminar tarea de la bolsa?", `¿Eliminar "${b?.titulo || 'esta tarea'}" de la bolsa colectiva?`, () => {
        STATE.bolsa = STATE.bolsa.filter(x => String(x.id) !== String(id));
        actualizarBadges();
        renderizarBolsa();
        callServer("eliminarTareaBolsa", id);
        notificar("Tarea eliminada");
      });
    }

    function asignarTareaBolsaASelect(id, owner) {
      if (!owner) return;
      const b = STATE.bolsa.find(x => String(x.id) === String(id));
      if (!b) return;
      b.asignado_a = owner; b.estado = "Asignada";
      const sem = STATE.semana || STATE.semanaActual;
      let s = STATE.semanal.find(x => x.owner === owner && coincidenSemanasClient(x.semana, sem));
      if (!s) {
        s = { id: "SEM-" + Date.now().toString(36).toUpperCase(), semana: sem, owner: owner, proyecto: b.titulo, todos: `- [ ] ${b.titulo}`, estado: "En proceso" };
        STATE.semanal.push(s);
      } else {
        const p = parsearTodos(s.todos || "");
        p.items.push({ text: b.titulo, checked: false, isSubpoint: false, link: null });
        s.todos = serializarTodos(p.items, p.images);
      }
      guardarCampoPersonaSemana(owner, "todos", s.todos);
      callServer("asignarTareaBolsaAMiembro", id, owner, false, sem);
      actualizarBadges();
      renderizarBolsa();
      notificar(`Tarea asignada a ${owner}`);
    }

    function cargarDatosAdmin() {
      const runner = getRunner();
      if (!runner) return;
      runner.withSuccessHandler(res => {
        if (res?.equipo) STATE.equipo = res.equipo;
        renderizarTablaAdminEquipo();
        renderizarTablaAdminUsuarios(res?.resumenUsuarios || []);
      }).obtenerDatosAdmin();
    }

    function renderizarTablaAdminUsuarios(usuarios) {
      const tbody = document.getElementById("tbodyAdminUsuarios");
      if (!tbody) return;
      if (!usuarios || usuarios.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;">Sin registros de actividad aún en la hoja 4. Logs.</td></tr>`;
        return;
      }
      tbody.innerHTML = usuarios.map(u => `
        <tr style="border-bottom:1px solid var(--border);">
          <td style="padding:10px 12px;font-family:monospace;font-size:11px;"><strong>${escapeHtml(u.email || u.usuario)}</strong></td>
          <td style="padding:10px 12px;text-align:center;font-weight:700;">${u.sesiones || 0}</td>

    let _adminDragIdx = null;
    function handleAdminDragStart(e, idx) {
      _adminDragIdx = idx;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", idx);
      e.currentTarget.classList.add("is-dragging");
    }
    function handleAdminDragOver(e, idx) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const row = e.currentTarget;
      document.querySelectorAll(".admin-team-row").forEach(r => { if (r !== row) r.classList.remove("drag-over"); });
      row.classList.add("drag-over");
    }
    function handleAdminDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
    function handleAdminDragEnd(e) {
      document.querySelectorAll(".admin-team-row").forEach(r => r.classList.remove("is-dragging", "drag-over"));
      _adminDragIdx = null;
    }
    function handleAdminDrop(e, targetIdx) {
      e.preventDefault();
      document.querySelectorAll(".admin-team-row").forEach(r => r.classList.remove("drag-over"));
      if (_adminDragIdx === null || _adminDragIdx === targetIdx) return;
      const movido = STATE.equipo.splice(_adminDragIdx, 1)[0];
      STATE.equipo.splice(targetIdx, 0, movido);
      _adminDragIdx = null;

      renderizarTablaAdminEquipo();
      poblarOpcionesEquipo();
      renderizarJerarquiaPersonas();
      callServer("guardarOrdenEquipo", STATE.equipo.map(m => m.email));
      notificar(`Orden actualizado: ${movido.nombre} en posición #${targetIdx + 1}`);
    }

    function renderizarTablaAdminEquipo() {
      const tbody = document.getElementById("tbodyAdminEquipo");
      if (!tbody) return;
      const total = (STATE.equipo || []).length;
      tbody.innerHTML = (STATE.equipo || []).map((m, idx) => {
        const color = obtenerColorAvatar(m.nombre);
        const iniciales = obtenerIniciales(m.nombre);
        return `
          <tr class="admin-team-row" draggable="true" id="admin_row_${idx}"
              ondragstart="handleAdminDragStart(event, ${idx})"
              ondragover="handleAdminDragOver(event, ${idx})"
              ondragleave="handleAdminDragLeave(event)"
              ondrop="handleAdminDrop(event, ${idx})"
              ondragend="handleAdminDragEnd(event)"
              style="border-bottom:1px solid var(--border);">
            <td style="padding:10px 12px;text-align:center;white-space:nowrap;">
              <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
                <span class="admin-drag-handle" title="Arrastrar para ordenar">&#10495;</span>
                <span class="admin-order-badge">#${idx + 1}</span>
              </div>
            </td>
            <td style="padding:10px 12px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="avatar-badge" style="background:${color};width:26px;height:26px;font-size:10px;">${iniciales}</div>
                <input type="text" class="admin-member-input" value="${escapeHtml(m.nombre)}"
                       onchange="editarNombreMiembroDesdeAdmin('${escapeHtml(m.email)}', this.value, '${escapeHtml(m.nombre)}')"
                       title="Hacé clic para editar el nombre">
              </div>
            </td>

            <td style="padding:10px 12px;text-align:right;white-space:nowrap;">
              <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;">

                <button class="btn btn-outline" style="padding:3px 6px;font-size:9px;" onclick="moverOrdenMiembroDesdeAdmin(${idx}, 1)" ${idx === total - 1 ? 'disabled' : ''} title="Bajar">&#9660;</button>
                <button class="btn-del-mini" style="margin-left:6px;" onclick="eliminarMiembroDesdeAdmin('${escapeHtml(m.email)}')">&times;</button>
              </div>
            </td>
          </tr>

      }).join("");
      const c = document.getElementById("countAdminEquipo"); if (c) c.innerText = STATE.equipo.length;
    }

    function moverOrdenMiembroDesdeAdmin(idx, delta) {
      const nuevoIdx = idx + delta;
      if (nuevoIdx < 0 || nuevoIdx >= STATE.equipo.length) return;
      const movido = STATE.equipo.splice(idx, 1)[0];
      STATE.equipo.splice(nuevoIdx, 0, movido);
      renderizarTablaAdminEquipo();
      poblarOpcionesEquipo();
      renderizarJerarquiaPersonas();
      callServer("guardarOrdenEquipo", STATE.equipo.map(m => m.email));
      notificar("Orden del equipo actualizado");
    }

    function editarNombreMiembroDesdeAdmin(email, nuevoNombre, viejoNombre) {
      const nomTrim = (nuevoNombre || "").trim();
      if (!nomTrim) {
        notificar("El nombre no puede estar vacío");
        renderizarTablaAdminEquipo();
        return;
      }
      if (nomTrim === viejoNombre) return;

      const m = STATE.equipo.find(x => x.email === email);
      if (m) m.nombre = nomTrim;

      STATE.semanal.forEach(s => { if (s.owner === viejoNombre) s.owner = nomTrim; });
      STATE.recurrentes.forEach(r => { if (r.owner === viejoNombre) r.owner = nomTrim; });
      STATE.futuros.forEach(f => { if (f.owner === viejoNombre) f.owner = nomTrim; });

      renderizarTablaAdminEquipo();
      poblarOpcionesEquipo();
      renderizarJerarquiaPersonas();
      callServer("actualizarNombreMiembro", email, nomTrim, viejoNombre);
      notificar(`Nombre cambiado a ${nomTrim}`);
    }

    function toggleFormNuevoMiembro() {
      const box = document.getElementById("boxNuevoMiembroInline");
      if (box) box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function guardarNuevoMiembroDesdeAdmin() {
      const nom = document.getElementById("admin_in_nombre")?.value?.trim();
      const em = document.getElementById("admin_in_email")?.value?.trim().toLowerCase();
      if (!nom || !em?.includes("@")) { alert("Ingresa nombre y email corporativo válido"); return; }
      const nuevo = { nombre: nom, email: em };
      STATE.equipo.push(nuevo);
      toggleFormNuevoMiembro();
      poblarOpcionesEquipo();
      renderizarJerarquiaPersonas();
      renderizarTablaAdminEquipo();
      getRunner()?.withSuccessHandler(res => { if (res?.equipo) STATE.equipo = res.equipo; }).guardarMiembroEquipo(nuevo);
    }

    function eliminarMiembroDesdeAdmin(email) {
      confirmarEliminarInApp("¿Eliminar miembro del equipo?", `¿Estás seguro de eliminar al integrante ${email}? Esta acción lo quitará del tablero y de la hoja 3. Equipo.`, () => {
        STATE.equipo = STATE.equipo.filter(m => m.email !== email);
        poblarOpcionesEquipo();
        renderizarJerarquiaPersonas();
        renderizarTablaAdminEquipo();
        getRunner()?.withSuccessHandler(res => { if (res?.equipo) STATE.equipo = res.equipo; }).eliminarMiembroEquipo(email);
        notificar("Miembro eliminado");
      });
    }

    function cambiarFiltroOwnerTimeline(val) {
      STATE.timelineOwnerFiltro = val || "Todos";
      try { localStorage.setItem("peya_app_tl_owner", STATE.timelineOwnerFiltro); } catch (_) {}
      renderizarTimeline();
    }

    function seleccionarTab(key) {
      try { localStorage.setItem("peya_app_tab", key); } catch (_) {}
      ["semanal", "timeline", "bolsa", "admin"].forEach(t => {
        const el = document.getElementById(`tab-${t}`); if (el) el.style.display = (t === key) ? "block" : "none";
        const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (btn) btn.classList.toggle("active", t === key);
      });
      if (key === "admin") cargarDatosAdmin();
      if (key === "timeline") {
        const sel = document.getElementById("selectFiltroTipoTimeline");
        if (sel) sel.value = STATE.timelineFiltroTipo || "semanal";
        const selTl = document.getElementById("selectFiltroOwnerTimeline");
        if (selTl) selTl.value = STATE.timelineOwnerFiltro || "Todos";
        renderizarTimeline();
        centrarTimelineEnSemanaActual();
      }
      if (key === "bolsa") renderizarBolsa();
      if (key === "semanal") renderizarJerarquiaPersonas();
    }

    function poblarOpcionesEquipo() {
      const sel = document.getElementById("selectFiltroOwner");
      const selTl = document.getElementById("selectFiltroOwnerTimeline");
      const opts = `<option value="Todos">Todos los miembros</option>` + (STATE.equipo || []).map(m => `<option value="${escapeHtml(m.nombre)}">${escapeHtml(m.nombre)}</option>`).join("");
      if (sel) {
        sel.innerHTML = opts;
        if (STATE.ownerFiltro && [...sel.options].some(o => o.value === STATE.ownerFiltro)) sel.value = STATE.ownerFiltro;
      }
      if (selTl) {
        selTl.innerHTML = opts;
        if (STATE.timelineOwnerFiltro && [...selTl.options].some(o => o.value === STATE.timelineOwnerFiltro)) selTl.value = STATE.timelineOwnerFiltro;
      }
    }

    function poblarOpcionesSemanas(forzar = false) {
      const sel = document.getElementById("selectSemanaActual"); if (!sel) return;
      const curWeek = STATE.semanaActual || calcularSemanaClienteActual();
      STATE.semanaActual = curWeek;

      let semanas = STATE.semanas || [];
      if (!semanas.length || !semanas.some(s => coincidenSemanasClient(s, curWeek))) {
        semanas = generarSemanasDisponiblesCliente(curWeek);
        STATE.semanas = semanas;
      }

      // Encontrar el índice de la semana actual
      let idxCur = semanas.findIndex(s => coincidenSemanasClient(s, curWeek));
      if (idxCur === -1) idxCur = Math.floor(semanas.length / 2);

      // 1. Semanas anteriores: máximo 5 (las 5 más recientes antes de la actual)
      const todasPasadas = semanas.slice(0, idxCur);
      let pasadas = todasPasadas.slice(-5);
      if (esSemanaPasada(STATE.semana) && !pasadas.some(s => coincidenSemanasClient(s, STATE.semana))) {
        pasadas.push(STATE.semana);
        pasadas.sort((a, b) => semanas.indexOf(a) - semanas.indexOf(b));
      }

      // 2. Semana actual
      const actual = [semanas[idxCur] || curWeek];

      // 3. Próximas semanas: máximo 5 (las 5 inmediatas siguientes)
      const todasFuturas = semanas.slice(idxCur + 1);
      let futuras = todasFuturas.slice(0, 5);
      if (esSemanaFutura(STATE.semana) && !futuras.some(s => coincidenSemanasClient(s, STATE.semana))) {
        futuras.push(STATE.semana);
        futuras.sort((a, b) => semanas.indexOf(a) - semanas.indexOf(b));
      }

      const makeOpt = (s, prefix = "", suffix = "", styleAttr = "", classAttr = "") => {
        const isSel = coincidenSemanasClient(s, STATE.semana);
        return `<option value="${escapeHtml(s)}" ${isSel ? 'selected' : ''} ${classAttr ? `class="${classAttr}"` : ''} ${styleAttr ? `style="${styleAttr}"` : ''}>${prefix}${escapeHtml(s)}${suffix}</option>`;
      };

      let html = "";
      if (pasadas.length) {
        html += `<optgroup label="-- Semanas Pasadas --" class="optgroup-pasadas" style="color: #92400E; background-color: #FEF3C7; font-weight: 800;">` +
          pasadas.map(s => makeOpt(s, "• ", "", "color: var(--text); background: #FFFFFF; font-weight: 600;")).join("") +
          `</optgroup>`;
      }
      if (actual.length) {
        html += `<optgroup label="-- Semana actual --" class="optgroup-actual" style="color: #065F46; background-color: #ECFDF5; font-weight: 800;">` +
          actual.map(s => makeOpt(s, "", " (Semana Actual)", "background-color: #ECFDF5; color: #065F46; font-weight: 800;", "opt-semana-actual")).join("") +
          `</optgroup>`;
      }
      if (futuras.length) {
        html += `<optgroup label="-- Proximas semanas --" class="optgroup-futuras" style="color: #1E40AF; background-color: #EFF6FF; font-weight: 800;">` +
          futuras.map(s => makeOpt(s, "• ", "", "color: var(--text); background: #FFFFFF; font-weight: 600;")).join("") +
          `</optgroup>`;
      }

      sel.innerHTML = html;

      const optSel = [...sel.options].find(o => coincidenSemanasClient(o.value, STATE.semana));
      if (optSel) sel.value = optSel.value;
    }

    function aplicarFiltros() {
      STATE.ownerFiltro = document.getElementById("selectFiltroOwner")?.value || "Todos";
      try { localStorage.setItem("peya_app_owner", STATE.ownerFiltro); } catch (_) {}
      renderizarTodo();
    }

    function notificar(msg) {
      const t = document.getElementById("toast"), txt = document.getElementById("toastText");
      if (!t || !txt) return;
      txt.textContent = msg; t.style.display = "flex";
      setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function obtenerColorAvatar(nombre) {
      let hash = 0;
      for (let i = 0; i < (nombre || "").length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    function obtenerIniciales(nombre) {
      if (!nombre) return "AN";
      const parts = nombre.trim().split(/\s+/);
      return (parts.length >= 2 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2)).toUpperCase();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => { try { inicializarApp(); } catch (e) { console.error(e); } });
    } else {
      try { inicializarApp(); } catch (e) { console.error(e); }
    }
  </script>
