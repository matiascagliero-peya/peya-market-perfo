<script>
    const CONFIG = {

    function getRunner() {
      if (typeof window !== "undefined" && window.google?.script?.run) return window.google.script.run;

    }

    function debugLog(msg) {
      console.log("[DEBUG]", msg);
      const pre = document.getElementById("debugLogPre"), text = document.getElementById("debugText"), dot = document.getElementById("debugDot");
      if (pre) {
        pre.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        pre.scrollTop = pre.scrollHeight;
      }
      if (text) text.textContent = msg;
      if (dot) {
        if (String(msg).toLowerCase().includes("error")) dot.style.background = "#EF4444";
        else dot.style.background = "#22C55E";
      }
    }

    function limpiarLogsConsola() {
      const pre = document.getElementById("debugLogPre");
      if (pre) pre.textContent = `[${new Date().toLocaleTimeString()}] Consola de diagnóstico reiniciada.\n`;
    }

    window.onerror = function(msg, url, line) {
      console.error(`ERROR JS L${line}: ${msg}`);
      debugLog(`ERROR JS L${line}: ${msg}`);
    };

    function calcularSemanaClienteActual(fechaRef) {
      const d = fechaRef ? new Date(fechaRef) : new Date();
      const diaSem = d.getDay();
      const diffLunes = (diaSem === 0 ? -6 : 1) - diaSem;
      const lunes = new Date(d); lunes.setDate(d.getDate() + diffLunes);
      const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
      const dTarget = new Date(d.valueOf());
      dTarget.setDate(dTarget.getDate() - ((d.getDay() + 6) % 7) + 3);
      const primerJueves = dTarget.valueOf();
      dTarget.setMonth(0, 1);
      if (dTarget.getDay() !== 4) dTarget.setMonth(0, 1 + ((4 - dTarget.getDay()) + 7) % 7);
      const numSem = 1 + Math.ceil((primerJueves - dTarget) / 604800000);
      const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
      const pad = n => String(n).padStart(2, "0");
      return `Semana ${pad(numSem)} | ${pad(lunes.getDate())} ${meses[lunes.getMonth()]} - ${pad(domingo.getDate())} ${meses[domingo.getMonth()]}`;
    }

    function generarSemanasDisponiblesCliente(semanaActual) {
      const lista = [], hoy = new Date();
      for (let i = -8; i <= 8; i++) {
        const d = new Date(hoy); d.setDate(hoy.getDate() + (i * 7));
        const s = calcularSemanaClienteActual(d);
        if (!lista.includes(s)) lista.push(s);
      }
      if (semanaActual && !lista.some(s => coincidenSemanasClient(s, semanaActual))) lista.push(semanaActual);
      return lista;
    }

    function obtenerFechaHoyKey() {
      const d = new Date(), pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function obtenerMesActualKey() {
      const d = new Date(), pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    }
    function obtenerDiaHoyFormateado() {
      const d = new Date(), dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"], meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
      return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
    }
    function obtenerMesActualFormateado() {
      const d = new Date(), meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      return `${meses[d.getMonth()]} ${d.getFullYear()}`;
    }

    function hidratarChecksRecurrentes(lista) {
      (lista || []).forEach(r => {
        if (r.estado && typeof r.estado === "string" && r.estado.startsWith("{")) {
          try {
            const p = JSON.parse(r.estado);
            if (!r.checksDiarios) r.checksDiarios = p.diarios || {};
            if (!r.semanasCompletadas) r.semanasCompletadas = p.semanas || {};
            if (!r.checksMensuales) r.checksMensuales = p.meses || {};
            if (!r.historialVersiones) r.historialVersiones = p.versiones || [];
          } catch (_) {}
        }
      });
    }

    function esSemanaPasada(semana) {
      if (!semana || !STATE.semanaActual) return false;
      if (coincidenSemanasClient(semana, STATE.semanaActual)) return false;
      const idxCur = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, STATE.semanaActual));
      const idxTarget = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, semana));
      if (idxCur !== -1 && idxTarget !== -1) return idxTarget < idxCur;
      const mCur = (STATE.semanaActual || "").match(/(?:w|semana\s*)(\d{1,2})/i);
      const mTarget = (semana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
      if (mCur && mTarget) return parseInt(mTarget[1], 10) < parseInt(mCur[1], 10);
      return false;
    }

    function esSemanaFutura(semana) {
      if (!semana || !STATE.semanaActual) return false;
      if (coincidenSemanasClient(semana, STATE.semanaActual)) return false;
      return !esSemanaPasada(semana);
    }

    function irASemanaActual() {
      const targetSem = STATE.semanaActual || calcularSemanaClienteActual();
      if (!targetSem) return;

      STATE.semanaActual = targetSem;
      STATE.semana = targetSem;
      try { localStorage.setItem("peya_app_semana", STATE.semana); } catch (_) {}

      poblarOpcionesSemanas(true);
      const el = document.getElementById("selectSemanaActual");
      if (el) el.value = STATE.semana;

      ejecutarRolloverTareasPendientes(STATE.semana);
      actualizarBadges();
      renderizarJerarquiaPersonas();
      actualizarBotonesNavegacionSemana();

      if (document.getElementById("tab-timeline")?.style.display !== "none") {
        centrarTimelineEnSemanaActual();
      }

      notificar(`Volviendo a ${STATE.semana}`);
    }

    function obtenerTextoRecurrenteParaSemana(r, semana) {
      if (!r) return "";
      if (!semana || coincidenSemanasClient(semana, STATE.semanaActual) || !esSemanaPasada(semana)) {
        return r.tarea || "";
      }
      if (Array.isArray(r.historialVersiones) && r.historialVersiones.length) {
        const mTarget = (semana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
        const numTarget = mTarget ? parseInt(mTarget[1], 10) : 999;
        for (let i = r.historialVersiones.length - 1; i >= 0; i--) {
          const v = r.historialVersiones[i];
          const mHasta = (v.hastaSemana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
          const numHasta = mHasta ? parseInt(mHasta[1], 10) : 0;
          if (numTarget <= numHasta && v.tarea) return v.tarea;
        }
      }
      return r.tarea || "";
    }

    const esEntornoLocal = typeof location !== "undefined" && (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:" || !location.hostname);
    if (esEntornoLocal && !getRunner()) {
      const mockEquipo = [
        { nombre: "Matías Cagliero", email: "matias.cagliero@pedidosya.com", rol: "Lead Analyst" },
        { nombre: "Nicki Krawiecki", email: "nicole.krawiecki@pedidosya.com", rol: "Head of Performance" },
        { nombre: "Juan Pablo Pinori Diaz", email: "juan.pinori@pedidosya.com", rol: "Specialist Data" }
      ];
      const curWk = calcularSemanaClienteActual();
      window.google = { script: { run: new Proxy({}, {
        get: (t, fn) => (...args) => {
          const self = { withSuccessHandler: f => { self._s = f; return self; }, withFailureHandler: f => { self._f = f; return self; } };
          self[fn] = () => {
            if (!self._s) return;
            setTimeout(() => {
              if (fn === "obtenerConfiguracionInicial") {
                self._s({
                  success: true,
                  usuarioActual: { nombre: "Matías Cagliero", email: "matias.cagliero@pedidosya.com", esAdmin: true },
                  semanaActual: curWk,
                  semanasDisponibles: generarSemanasDisponiblesCliente(curWk),
                  equipo: mockEquipo,
                  conectados: ["Matías"],
                  version: "v_local_" + Date.now(),
                  conexionSheets: { conectado: true, spreadsheetId: CONFIG.SPREADSHEET_ID },
                  datos: {
                    equipo: mockEquipo,
                    seguimientoSemanal: (STATE.semanal && STATE.semanal.length) ? STATE.semanal : [
                      { id: "SEM-1", semana: curWk, owner: "Matías Cagliero", proyecto: "Iniciativa Principal", todos: "- [x] Automatización de métricas WOT\n- [ ] Optimización de cuotas Google Sheets\n  ↳ [ ] Pruebas en entorno local\n# Mapster 2\n- [ ] Actualización de polígonos", estado: "En proceso" },
                      { id: "SEM-2", semana: curWk, owner: "Nicki Krawiecki", proyecto: "Iniciativa Principal", todos: "- [ ] Revisión de OKRs Q4\n- [x] Alignment semanal", estado: "En proceso" },
                      { id: "SEM-3", semana: curWk, owner: "Juan Pablo Pinori Diaz", proyecto: "Iniciativa Principal", todos: "- [ ] Pipeline de reconciliación\n- [ ] QA de órdenes canceladas", estado: "En proceso" }
                    ],
                    recurrentes: (STATE.recurrentes && STATE.recurrentes.length) ? STATE.recurrentes : [
                      { id: "REC-1", owner: "Matías Cagliero", frecuencia: "Diario", tarea: "Control de fallas WOT y alertas", links: "https://looker.com|Looker", estado: "{}" },
                      { id: "REC-2", owner: "Matías Cagliero", frecuencia: "Semanal", tarea: "Reporte ejecutivo semanal", links: "", estado: "{}" },
                      { id: "REC-3", owner: "Nicki Krawiecki", frecuencia: "Semanal", tarea: "Revisión semanal con gerencia", links: "", estado: "{}" }
                    ],
                    futuros: (STATE.futuros && STATE.futuros.length) ? STATE.futuros : [
                      { id: "FUT-1", owner: "Matías Cagliero", tema: "Migración de datamart a BigQuery partitioned", target: "Q1 2027", estado: "Pendiente" }
                    ],
                    bolsa: (STATE.bolsa && STATE.bolsa.length) ? STATE.bolsa : [
                      { id: "BOL-1", titulo: "Revisión de queries lentas", creador: "Matías Cagliero", prioridad: "Media", estado: "Disponible" }
                    ],
                    reportes: []
                  }
                });
              } else if (fn === "verificarVersionDatos") {
                self._s({ alDia: true, version: "v_local_" + Date.now(), conectados: ["Matías"] });
              } else if (fn === "subirImagenAdjunto") {
                self._s({ success: true, url: args[0], fileId: "mock_file_" + Date.now() });
              } else {
                self._s({ success: true, version: "v_local_" + Date.now() });
              }
            }, 60);
          };
          return self;
        }
      }) } };
    }

    const AVATAR_COLORS = ["#EA1D2C", "#2563EB", "#7C3AED", "#059669", "#D97706", "#DB2777", "#0891B2", "#4F46E5"];

    const curWeekClient = calcularSemanaClienteActual();
    const STATE = {
      usuario: null, esAdmin: false,
      semanaActual: curWeekClient,
      semana: curWeekClient,
      semanas: generarSemanasDisponiblesCliente(curWeekClient),
      equipo: [], semanal: [], recurrentes: [], futuros: [], reportes: [], bolsa: [],
      timelineOffset: 0, timelineFiltroTipo: "semanal", timelineOwnerFiltro: "Todos", ownerFiltro: "Todos", modoEdicionTodos: {}, colapsadoSemana: {}, colapsadoRecurrentes: {}, colapsadoProxima: {}, colapsadoProyectos: {}
    };

    function persistirMemoriaLocal() {
      try {
        ["semanal", "recurrentes", "futuros", "bolsa", "reportes", "equipo"].forEach(k => {
          localStorage.setItem(`peya_app_${k}`, JSON.stringify(STATE[k] || []));
        });
      } catch (e) {}
    }

    function cargarMemoriaLocal() {
      try {
        ["semanal", "recurrentes", "futuros", "bolsa", "equipo"].forEach(k => {
          const s = localStorage.getItem(`peya_app_${k}`);
          if (s) { const p = JSON.parse(s); if (Array.isArray(p) && p.length) STATE[k] = p; }
        });
        const sOwner = localStorage.getItem("peya_app_owner");
        if (sOwner) STATE.ownerFiltro = sOwner;
        const sTlOwner = localStorage.getItem("peya_app_tl_owner");
        if (sTlOwner) STATE.timelineOwnerFiltro = sTlOwner;
        const sTlTipo = localStorage.getItem("peya_app_tl_tipo");
        if (sTlTipo) STATE.timelineFiltroTipo = sTlTipo;
        const sSem = localStorage.getItem("peya_app_semana");
        if (sSem) STATE.semana = sSem;
        const sColProy = localStorage.getItem("peya_app_colapsado_proyectos");
        if (sColProy) {
          try { STATE.colapsadoProyectos = JSON.parse(sColProy) || {}; } catch (_) {}
        }
      } catch (e) {}
    }

    function normalizarTextoComparacion(str) {
      return String(str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();
    }

    function buscarMiembroPorUsuario(usuarioActual, listaEquipo) {
      if (!usuarioActual || !Array.isArray(listaEquipo) || !listaEquipo.length) return null;

      const emailRaw = String(usuarioActual.email || "").toLowerCase().trim();
      const nombreRaw = String(usuarioActual.nombre || "").trim();

      const userHandle = emailRaw ? emailRaw.split("@")[0].toLowerCase().trim() : "";
      const userHandleNorm = normalizarTextoComparacion(userHandle);
      const userNameNorm = normalizarTextoComparacion(nombreRaw);

      for (const m of listaEquipo) {
        if (!m) continue;
        const mEmail = String(m.email || m.mail || m.correo || "").toLowerCase().trim();
        const mHandle = mEmail ? mEmail.split("@")[0].toLowerCase().trim() : "";
        const mHandleNorm = normalizarTextoComparacion(mHandle);
        const mNombreNorm = normalizarTextoComparacion(m.nombre);

        // 1. Coincidencia exacta de email completo (ej: matias.cagliero@pedidosya.com)
        if (emailRaw && mEmail && emailRaw === mEmail) return m;

        // 2. Coincidencia de prefijo/handle de email (ej: matias.cagliero sin importar dominio @pedidosya o @deliveryhero)
        if (userHandle && mHandle && userHandle === mHandle) return m;
        if (userHandleNorm && mHandleNorm && userHandleNorm === mHandleNorm && userHandleNorm.length > 2) return m;

        // 3. Coincidencia de nombre normalizado (ej: "Matias Cagliero" vs "Matías Cagliero")
        if (userNameNorm && mNombreNorm && userNameNorm === mNombreNorm) return m;
        if (userHandleNorm && mNombreNorm && userHandleNorm === mNombreNorm) return m;

        // 4. Si el nombre contiene el handle del correo o viceversa
        if (userHandleNorm.length > 5 && mNombreNorm.length > 5) {
          if (mNombreNorm.includes(userHandleNorm) || userHandleNorm.includes(mNombreNorm)) return m;
        }
      }

      return null;
    }

    function conectarConServidor(intento = 1) {
      const statusEl = document.getElementById("statusCargaDetalle");
      const runner = getRunner();
      if (!runner || typeof runner.obtenerConfiguracionInicial !== "function") {
        if (intento <= 30) {
          const msg = `Sincronizando con Google Sheets (intento ${intento}/30)...`;
          debugLog(msg);
          if (statusEl) statusEl.textContent = msg;
          setTimeout(() => conectarConServidor(intento + 1), 150);
          return;
        }
        if (statusEl) statusEl.textContent = "Aviso: No se detectó motor de Apps Script.";
        actualizarPillConexion(false, "Modo local (sin Google Apps Script)");
        return;
      }

      const msgCon = "Petición enviada a Google Sheets, esperando respuesta...";
      debugLog(msgCon);
      if (statusEl) statusEl.textContent = msgCon;

      runner
        .withSuccessHandler(config => {
          if (statusEl) statusEl.textContent = "Datos recibidos. Dibujando tablero...";
          debugLog(`Config recibida: ${config.semanaActual}. Miembros: ${(config.equipo || []).length}`);
          if (config.usuarioActual) STATE.usuario = config.usuarioActual;
          STATE.esAdmin = config.usuarioActual ? config.usuarioActual.esAdmin : true;

          STATE.semanaActual = config.semanaActual || STATE.semanaActual || calcularSemanaClienteActual();
          const savedSem = localStorage.getItem("peya_app_semana");
          if (savedSem && config.semanasDisponibles?.some(s => coincidenSemanasClient(s, savedSem))) {
            STATE.semana = savedSem;
          } else {
            STATE.semana = STATE.semanaActual;
          }

          if (config.semanasDisponibles?.length) STATE.semanas = config.semanasDisponibles;
          if (config.equipo?.length) STATE.equipo = config.equipo;
          if (config.version) CLIENT_DATA_VERSION = config.version;
          actualizarPillConexion(config.conexionSheets ? config.conexionSheets.conectado : true);
          if (Array.isArray(config.conectados)) {
            actualizarUsuariosConectadosUI(config.conectados);
          }

          const email = config.usuarioActual?.email?.toLowerCase() || "";
          if (STATE.esAdmin || email.includes("cagli") || email.includes("matias")) {
            STATE.esAdmin = true;
            const btn = document.getElementById("tabBtnAdmin"); if (btn) btn.style.display = "flex";
          }

          // Detección y filtrado inteligente del usuario que entra:
          const matchingMember = buscarMiembroPorUsuario(config.usuarioActual, config.equipo);

          if (matchingMember) {
            STATE.ownerFiltro = matchingMember.nombre;
            STATE.timelineOwnerFiltro = matchingMember.nombre;
            STATE.colapsadoSemana[matchingMember.nombre] = false;
            STATE.colapsadoRecurrentes[matchingMember.nombre] = false;
            STATE.colapsadoProxima[matchingMember.nombre] = false;
            try {
              localStorage.setItem("peya_app_owner", STATE.ownerFiltro);
              localStorage.setItem("peya_app_tl_owner", STATE.timelineOwnerFiltro);
            } catch (_) {}
          } else {
            STATE.ownerFiltro = "Todos";
            STATE.timelineOwnerFiltro = "Todos";
            STATE.colapsadoSemana = {};
            STATE.colapsadoRecurrentes = {};
            STATE.colapsadoProxima = {};
            STATE.colapsadoProyectos = {};
            (config.equipo || []).forEach(m => {
              STATE.colapsadoSemana[m.nombre] = false;
              STATE.colapsadoRecurrentes[m.nombre] = false;
              STATE.colapsadoProxima[m.nombre] = false;
            });
            try {
              localStorage.setItem("peya_app_owner", "Todos");
              localStorage.setItem("peya_app_tl_owner", "Todos");
              localStorage.removeItem("peya_app_colapsado_proyectos");
            } catch (_) {}
            const lblToggle = document.getElementById("labelToggleTodo");
            if (lblToggle) lblToggle.innerText = "Colapsar todo";
            const lblToggleProy = document.getElementById("labelToggleProyectosActuales");
            if (lblToggleProy) lblToggleProy.innerText = "Colapsar Proyectos";
          }

          poblarOpcionesEquipo();
          poblarOpcionesSemanas();
          actualizarBotonesNavegacionSemana();

          if (config.datos) {
            const d = config.datos;
            if (d.seguimientoSemanal) STATE.semanal = d.seguimientoSemanal;
            if (d.recurrentes) STATE.recurrentes = d.recurrentes;
            if (d.futuros) STATE.futuros = d.futuros;
            if (d.reportes) STATE.reportes = d.reportes;
            if (d.bolsa) STATE.bolsa = d.bolsa;
            if (d.equipo?.length) STATE.equipo = d.equipo;
            ejecutarRolloverTareasPendientes(STATE.semana);
            actualizarBadges();
            renderizarTodo();
            iniciarSincronizacionEnVivo();
            debugLog(`Listo - Datos cargados (${STATE.semanal.length} tareas semanales)`);
          } else {
            renderizarTodo();
            iniciarSincronizacionEnVivo();
            cargarDatosCompletos(config.semanaActual || STATE.semana);
          }
        })
        .withFailureHandler(err => {
          const msg = err?.message || String(err);
          debugLog(`Error Sheets: ${msg}`);
          actualizarPillConexion(false, msg);
          const box = document.getElementById("contenedorPersonas");
          if (box) {
            box.innerHTML = `
              <div style="padding:24px;text-align:center;color:#DC2626;background:#FEE2E2;border-radius:8px;margin:16px 0;border:1px solid #FECACA;">
                <div style="font-weight:800;font-size:13px;margin-bottom:4px;">Error al conectar con Google Sheets</div>
                <div style="font-size:11px;margin-bottom:10px;color:#991B1B;">${escapeHtml(msg)}</div>
                <button class="btn btn-primary" onclick="inicializarApp()">Reintentar conexión</button>
              </div>
            `;
          }
        })
        .obtenerConfiguracionInicial();
    }

    function inicializarApp() {
      cargarMemoriaLocal();
      cargarColaOffline();
      poblarOpcionesEquipo();
      poblarOpcionesSemanas();
      actualizarBotonesNavegacionSemana();
      actualizarBadges();
      renderizarTodo();
      setupNotionKeyboardShortcuts();
      procesarColaOffline();

      // Restaurar exactamente la pestaña donde estaba el usuario antes de recargar
      const savedTab = localStorage.getItem("peya_app_tab") || (location.hash ? location.hash.replace("#", "") : "semanal");
      if (savedTab && ["semanal", "timeline", "bolsa", "admin"].includes(savedTab)) {
        seleccionarTab(savedTab);
      }

      conectarConServidor(1);
    }

    function cargarDatosCompletos(semana) {
      const runner = getRunner();
      if (!runner) return;
      runner
        .withSuccessHandler(data => {
          STATE.semanal = data.seguimientoSemanal || [];
          STATE.recurrentes = data.recurrentes || [];
          STATE.futuros = data.futuros || [];
          STATE.reportes = data.reportes || [];
          STATE.bolsa = data.bolsa || [];
          STATE.semana = data.semanaSeleccionada || semana;
          if (data.semanaActual) STATE.semanaActual = data.semanaActual;
          if (data.equipo?.length) STATE.equipo = data.equipo;
          ejecutarRolloverTareasPendientes(STATE.semana);
          poblarOpcionesEquipo();
          poblarOpcionesSemanas();
          actualizarBadges();
          renderizarTodo();
          actualizarBotonesNavegacionSemana();
          notificar("Datos sincronizados");
        })
        .withFailureHandler(err => debugLog(`Error cargarDatosCompletos: ${err?.message || err}`))
        .obtenerDatosCompletos(semana);
    }

    function coincidenSemanasClient(s1, s2) {
      if (!s1 || !s2) return false;
      const a = String(s1).trim().toLowerCase(), b = String(s2).trim().toLowerCase();
      if (a === b) return true;
      const m1 = a.match(/(?:w|semana\s*)(\d{1,2})/i), m2 = b.match(/(?:w|semana\s*)(\d{1,2})/i);
      return !!(m1 && m2 && m1[1] === m2[1]);
    }

    // =========================================================================
    // PARSER & SERIALIZADOR DE TO-DOS
    // =========================================================================
    const RGX_LINK_TAG = /\[link:(https?:\/\/[^|\]]+)(?:\|([^\]]+))?\]/i;
    const RGX_IMG_TAG = /\[img:([^\]]+)\]/i;
    const RGX_IMG_URL = /^(https?:\/\/(?:[^\s]+\.(?:png|jpg|jpeg|gif|webp|svg)(?:\?[^\s]*)?|drive\.google\.com\/(?:thumbnail|file|uc)[^\s]*|lh3\.googleusercontent\.com\/d\/[^\s]*))$/i;

    function parsearTodos(rawText) {
      if (!rawText) return { items: [], images: [] };
      const items = [], images = [];
      String(rawText).split(/\r?\n/).forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Detección de imágenes puras (línea sin texto de tarea): [img:...] o URL directa
        const pureImgMatch = trimmed.match(/^\[img:([^\]]+)\]$/i);
        if (pureImgMatch) {
          images.push(pureImgMatch[1]);
          return;
        }
        const imgUrlMatch = trimmed.match(RGX_IMG_URL);
        if (imgUrlMatch) {
          images.push(imgUrlMatch[1]);
          return;
        }

        // Detección de cierre de grupo explícito: ej. # --- o # o # [fin]
        if (trimmed === "# ---" || trimmed === "#" || /^#\s*---$/.test(trimmed) || /^#\s*\[(?:fin|close|end|general|raiz)\]$/i.test(trimmed)) {
          items.push({ isGroupClose: true });
          return;
        }

        // Detección de encabezado de grupo o tema: Ej: # Mapster 2 o ## Daily Report
        const mGroup = trimmed.match(/^#{1,3}\s+(.+)$/);
        if (mGroup) {
          if (mGroup[1].trim() === "---" || mGroup[1].trim() === "[general]" || mGroup[1].trim() === "[fin]") {
            items.push({ isGroupClose: true });
            return;
          }
          items.push({ isGroupHeader: true, title: mGroup[1].trim() });
          return;
        }

        // Detección exhaustiva de subtarea (↳, sangría, tab o tag [sub]):
        const hasIndent = /^\s{1,}|\t/.test(line);
        const hasSubArrow = /↳|&#8627;|\u21B3/.test(line);
        const hasSubTag = /\[sub(?:tarea)?\]/i.test(line);
        const isSubpoint = hasIndent || hasSubArrow || hasSubTag;

        let checked = false;
        let cleanLine = trimmed.replace(/^(?:↳|&#8627;|\u21B3|\[sub(?:tarea)?\])\s*/i, "");

        if (/^[-*•]?\s*\[x\]\s*/i.test(cleanLine)) {
          checked = true;
          cleanLine = cleanLine.replace(/^[-*•]?\s*\[x\]\s*/i, "");
        } else if (/^[-*•]?\s*\[\s*\]\s*/i.test(cleanLine)) {
          checked = false;
          cleanLine = cleanLine.replace(/^[-*•]?\s*\[\s*\]\s*/i, "");
        } else if (/^[-*•]\s+/.test(cleanLine)) {
          cleanLine = cleanLine.replace(/^[-*•]\s+/, "");
        }

        // Extraer imágenes asociadas a esta tarea específica
        const itemImages = [];
        const rgxGlobalImg = /\[img:([^\]]+)\]/gi;
        let mImg;
        while ((mImg = rgxGlobalImg.exec(cleanLine)) !== null) {
          itemImages.push(mImg[1]);
        }
        cleanLine = cleanLine.replace(rgxGlobalImg, "").replace(/^(?:↳|&#8627;|\u21B3|\[sub(?:tarea)?\])\s*/i, "").trim();

        // Si la línea quedó vacía y solo tenía imágenes, agregar a las imágenes generales
        if (!cleanLine && itemImages.length) {
          images.push(...itemImages);
          return;
        }

        let itemLink = null;
        const lk = cleanLine.match(RGX_LINK_TAG);
        if (lk && /^https?:\/\//i.test(lk[1].trim())) {
          itemLink = { url: lk[1].trim(), label: lk[2] || "Link" };
          cleanLine = cleanLine.replace(lk[0], "").trim();
        } else {
          const u = cleanLine.match(/(https?:\/\/[^\s]+)$/i);
          if (u) {
            itemLink = { url: u[1], label: "Link" };
            cleanLine = cleanLine.replace(u[0], "").trim();
          }
        }
        items.push({ text: cleanLine, checked: checked, isSubpoint: isSubpoint, link: itemLink, images: itemImages });
      });
      return { items, images };
    }

    function serializarTodos(items, images) {
      const lines = [];
      let inGroup = false;

      (items || []).forEach((it) => {
        if (it.isGroupHeader) {
          inGroup = true;
          if (it.title?.trim()) lines.push(`# ${it.title.trim()}`);
          return;
        }
        if (it.isGroupClose) {
          if (inGroup) {
            lines.push("# ---");
            inGroup = false;
          }
          return;
        }

        const prefix = it.isSubpoint ? "  ↳ " : "";
        let line = `${prefix}- [${it.checked ? 'x' : ' '}] ${it.text || ''}`;
        if (it.link?.url && /^https?:\/\//i.test(it.link.url.trim())) {
          line += ` [link:${it.link.url.trim()}|${it.link.label || 'Link'}]`;
        }
        (it.images || []).forEach(img => {
          line += ` [img:${img}]`;
        });
        lines.push(line);
      });
      (images || []).forEach(img => lines.push(`[img:${img}]`));
      return lines.join("\n");
    }

        function renderFilaRecurrente(r, frec) {

              const fLower = (r.frecuencia || frec || "").toLowerCase();

              if (fLower.includes("mensual") || fLower.includes("cierre")) return !!r.checksMensuales?.[obtenerMesActualKey()];

          items.forEach(r => {

              <div class="spine-bar spine-recurrente" onclick="toggleColapsarRecurrentes('${escapeHtml(m.nombre)}')"><span class="spine-text">${cRec ? 'REC.' : 'RECURRENTE'}</span></div>
              <div class="spine-body subpoints-block">
                <div class="subpoints-header-toggle" onclick="toggleColapsarRecurrentes('${escapeHtml(m.nombre)}')">
                  <div class="subpoints-label"><span class="sub-tree-icon">&#8627;</span><span>Scope & Tareas Recurrentes</span></div>
                  <div class="collapse-btn-indicator"><span>${cRec ? 'Desplegar' : 'Colapsar'}</span></div>
                </div>
                <div style="${cRec ? 'display:none;' : ''}">${recurrentesHtml}</div>
              </div>
            </div>
            <div class="spine-section ${cProx ? 'is-collapsed' : ''}">
              <div class="spine-bar spine-proxima" onclick="toggleColapsarProxima('${escapeHtml(m.nombre)}')"><span class="spine-text">${cProx ? 'PRÓX.' : 'PRÓXIMO'}</span></div>
              <div class="spine-body backlog-block">
                <div class="subpoints-header-toggle" onclick="toggleColapsarProxima('${escapeHtml(m.nombre)}')">
                  <div class="subpoints-label"><span class="sub-tree-icon">&#8627;</span><span>Próximas tareas y proyectos</span></div>
                  <div class="collapse-btn-indicator"><span>${cProx ? 'Desplegar' : 'Colapsar'}</span></div>
                </div>
                <div style="${cProx ? 'display:none;' : ''}">${futurosHtml}</div>
              </div>

        `;
      });
      contenedor.innerHTML = html;
      actualizarVisualSeleccion();
    }

    // =========================================================================
    // SELECCIÓN, COPIA Y DUPLICACIÓN DE TAREAS ESTILO NOTION
    // =========================================================================
    const SELECTED_TODOS = {
      owner: null,
      indices: new Set()
    };
    let LAST_CLICKED_INDEX = null;
    let APP_CLIPBOARD_TASKS = [];

    function seleccionarFilaTarea(owner, idx, isShift, isCtrl) {
      if (SELECTED_TODOS.owner !== owner) {
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        LAST_CLICKED_INDEX = null;
      }

      if (isShift && LAST_CLICKED_INDEX !== null) {
        const start = Math.min(LAST_CLICKED_INDEX, idx);
        const end = Math.max(LAST_CLICKED_INDEX, idx);
        SELECTED_TODOS.indices.clear();
        for (let i = start; i <= end; i++) {
          SELECTED_TODOS.indices.add(i);
        }
      } else if (isCtrl) {
        if (SELECTED_TODOS.indices.has(idx)) {
          SELECTED_TODOS.indices.delete(idx);
          if (SELECTED_TODOS.indices.size === 0) SELECTED_TODOS.owner = null;
        } else {
          SELECTED_TODOS.indices.add(idx);
        }
        LAST_CLICKED_INDEX = idx;
      } else {
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(idx);
        LAST_CLICKED_INDEX = idx;
      }

      actualizarVisualSeleccion();
    }

    function limpiarSeleccionTareas() {
      SELECTED_TODOS.owner = null;
      SELECTED_TODOS.indices.clear();
      LAST_CLICKED_INDEX = null;
      actualizarVisualSeleccion();
    }

    function actualizarVisualSeleccion() {
      document.querySelectorAll(".checklist-row.is-selected").forEach(r => r.classList.remove("is-selected"));

      if (SELECTED_TODOS.owner && SELECTED_TODOS.indices.size > 0) {
        SELECTED_TODOS.indices.forEach(idx => {
          const row = document.getElementById(`todo_row_${SELECTED_TODOS.owner}_${idx}`);
          if (row) row.classList.add("is-selected");
        });
      }

      const bar = document.getElementById("floatingTaskSelectionBar");
      const countEl = document.getElementById("floatingSelectionCount");
      if (bar) {
        const count = SELECTED_TODOS.indices.size;
        if (count > 0) {
          if (countEl) countEl.textContent = `${count} ${count === 1 ? 'tarea seleccionada' : 'tareas seleccionadas'}`;
          bar.style.display = "flex";
        } else {
          bar.style.display = "none";
        }
      }
    }

    function handleInputFocusUndo(input) {
      if (!input) return;
      input._initialValue = input.value;
      if (!input._undoSessionActive) {
        guardarEstadoHistorial();
        input._undoSessionActive = true;
      }
    }

    function handleInputBlurUndo(input) {
      if (!input) return;
      if (input._initialValue !== undefined && input.value !== input._initialValue) {
        guardarEstadoHistorial();
      }
      input._undoSessionActive = false;
    }

    function handleRowClick(e, owner, idx) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "A" || e.target.closest("button") || e.target.closest("a") || e.target.classList.contains("checklist-checkbox")) {
        return;
      }
      seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
    }

    function handleHandleClick(e, owner, idx) {
      e.stopPropagation();
      seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
    }

    function handleChecklistFocus(e, owner, idx) {
      handleInputFocusUndo(e.target);
      LAST_CLICKED_INDEX = idx;
      if (SELECTED_TODOS.owner !== owner || SELECTED_TODOS.indices.size <= 1) {
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(idx);
        actualizarVisualSeleccion();
      }
    }

    let _isMarqueeDragging = false;
    let _marqueeStartX = 0;
    let _marqueeStartY = 0;
    let _marqueeInitialIndices = new Set();
    let _marqueeInitialized = false;

    function setupMarqueeSelection() {
      if (_marqueeInitialized) return;
      _marqueeInitialized = true;

      window.addEventListener("mousedown", function(e) {
        if (e.button !== 0) return; // solo botón primario (izquierdo)

        const target = e.target;
        if (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "BUTTON" || 
            target.tagName === "A" || target.tagName === "SELECT" || 
            target.closest("button") || target.closest("a") || target.closest("select") ||
            target.classList.contains("checklist-checkbox") || target.classList.contains("drag-handle") ||
            target.closest(".modal-overlay") || target.closest(".control-bar") || target.closest("#floatingTaskSelectionBar") ||
            target.closest("#notionSlashMenu") || target.closest("#popoverMoverGrupo") || target.closest(".toast-box")) {
          return;
        }

        const container = target.closest(".checklist-container, .project-tasks-body, .person-card, .recurrentes-rows-container, .rec-group-rows, #contenedorPersonas");
        if (!container) return;

        _marqueeStartX = e.clientX;
        _marqueeStartY = e.clientY;
        _isMarqueeDragging = false;
        _marqueeInitialIndices = e.shiftKey ? new Set(SELECTED_TODOS.indices) : new Set();
      });

      window.addEventListener("mousemove", function(e) {
        if (_marqueeStartX === 0 && _marqueeStartY === 0) return;
        if (e.buttons !== 1) {
          finalizarMarquee(false);
          return;
        }

        const dx = e.clientX - _marqueeStartX;
        const dy = e.clientY - _marqueeStartY;
        const dist = Math.hypot(dx, dy);

        if (!_isMarqueeDragging && dist > 5) {
          _isMarqueeDragging = true;
          if (!e.shiftKey) {
            SELECTED_TODOS.indices.clear();
          }
        }

        if (!_isMarqueeDragging) return;

        const left = Math.min(_marqueeStartX, e.clientX);
        const top = Math.min(_marqueeStartY, e.clientY);
        const width = Math.abs(dx);
        const height = Math.abs(dy);

        const box = document.getElementById("marqueeSelectionBox");
        if (box) {
          box.style.display = "block";
          box.style.left = `${left}px`;
          box.style.top = `${top}px`;
          box.style.width = `${width}px`;
          box.style.height = `${height}px`;
        }

        window.getSelection()?.removeAllRanges();

        const mRect = { left, top, right: left + width, bottom: top + height };
        const rows = document.querySelectorAll(".checklist-row[data-owner][data-idx]");

        rows.forEach(r => {
          const rRect = r.getBoundingClientRect();
          const intersects = !(rRect.right < mRect.left || rRect.left > mRect.right || rRect.bottom < mRect.top || rRect.top > mRect.bottom);
          const owner = r.getAttribute("data-owner");
          const idx = parseInt(r.getAttribute("data-idx"), 10);

          if (intersects && owner && !isNaN(idx)) {
            if (!SELECTED_TODOS.owner) SELECTED_TODOS.owner = owner;
            if (SELECTED_TODOS.owner === owner) {
              SELECTED_TODOS.indices.add(idx);
            }
          } else if (!intersects && !e.shiftKey && !_marqueeInitialIndices.has(idx)) {
            if (SELECTED_TODOS.owner === owner) {
              SELECTED_TODOS.indices.delete(idx);
            }
          }
        });

        actualizarVisualSeleccion();
      });

      window.addEventListener("mouseup", function() {
        finalizarMarquee(true);
      });

      function finalizarMarquee(actualizar) {
        const box = document.getElementById("marqueeSelectionBox");
        if (box) box.style.display = "none";
        _marqueeStartX = 0;
        _marqueeStartY = 0;
        _isMarqueeDragging = false;
        if (actualizar) actualizarVisualSeleccion();
      }
    }

    function handleRowMouseDown(e, owner, idx) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "A" || e.target.closest("button") || e.target.closest("a") || e.target.classList.contains("checklist-checkbox") || e.target.classList.contains("drag-handle")) {
        return;
      }
      if (e.button === 0) {
        seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
      }
    }

    function handleRowMouseEnter(e, owner, idx) {
      // Compatibilidad con drag over
    }

    function copiarTareasSeleccionadas(silencioso = false) {
      let owner = SELECTED_TODOS.owner;
      let indices = Array.from(SELECTED_TODOS.indices);

      if (!owner || !indices.length) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.classList.contains("checklist-input")) {
          const row = activeEl.closest(".checklist-row");
          owner = row?.getAttribute("data-owner");
          const idx = parseInt(row?.getAttribute("data-idx"), 10);
          if (owner && !isNaN(idx)) indices = [idx];
        }
      }

      if (!owner || !indices.length) return;

      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;

      const p = parsearTodos(it.todos || "");
      const sortedIndices = indices.sort((a, b) => a - b);
      APP_CLIPBOARD_TASKS = sortedIndices.map(idx => {
        const item = p.items[idx];
        if (!item) return null;
        return {
          text: item.text,
          isSubpoint: item.isSubpoint,
          checked: false,
          link: item.link ? { ...item.link } : null
        };
      }).filter(t => t && ((t.text || "").trim() || t.link));

      if (!APP_CLIPBOARD_TASKS.length) return;

      const mdText = APP_CLIPBOARD_TASKS.map(t => {
        const prefix = t.isSubpoint ? "  ↳ " : "";
        let line = `${prefix}- [ ] ${t.text}`;
        if (t.link?.url) line += ` [link:${t.link.url}|${t.link.label || 'Link'}]`;
        return line;
      }).join("\n");

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(mdText);
        }
      } catch (_) {}

      if (!silencioso) {
        notificar(`${APP_CLIPBOARD_TASKS.length} ${APP_CLIPBOARD_TASKS.length === 1 ? 'tarea copiada' : 'tareas copiadas'} (Ctrl+V para duplicar/pegar)`);
      }
    }

    function pegarTareas(targetOwner, targetIdx) {
      if (!APP_CLIPBOARD_TASKS || !APP_CLIPBOARD_TASKS.length) {
        notificar("No hay tareas copiadas. Seleccioná una o más y tocá Ctrl+C");
        return false;
      }
      guardarEstadoHistorial();

      const owner = targetOwner || SELECTED_TODOS.owner;
      if (!owner) {
        notificar("Seleccioná un integrante para pegar las tareas");
        return false;
      }

      let it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) {
        it = { id: "SEM-" + Date.now().toString(36).toUpperCase(), semana: STATE.semana, owner: owner, proyecto: "Iniciativa Principal", todos: "", estado: "En proceso" };
        STATE.semanal.push(it);
      }
      const p = parsearTodos(it.todos || "");

      let insertAt = (typeof targetIdx === "number" && !isNaN(targetIdx)) ? targetIdx : p.items.length;
      if (insertAt < 0) insertAt = 0;
      if (insertAt > p.items.length) insertAt = p.items.length;

      const clones = APP_CLIPBOARD_TASKS.map(t => ({
        text: t.text,
        checked: false,
        isSubpoint: t.isSubpoint,
        link: t.link ? { ...t.link } : null
      }));

      p.items.splice(insertAt, 0, ...clones);
      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);

      renderizarJerarquiaPersonas();

      SELECTED_TODOS.owner = owner;
      SELECTED_TODOS.indices.clear();
      for (let i = 0; i < clones.length; i++) {
        SELECTED_TODOS.indices.add(insertAt + i);
      }
      LAST_CLICKED_INDEX = insertAt + clones.length - 1;
      actualizarVisualSeleccion();

      notificar(`${clones.length} ${clones.length === 1 ? 'tarea duplicada/pegada' : 'tareas duplicadas/pegadas'}`);
      return true;
    }

    function duplicarTareasSeleccionadas() {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.classList.contains("checklist-input")) {
          const row = activeEl.closest(".checklist-row");
          const owner = row?.getAttribute("data-owner");
          const idx = parseInt(row?.getAttribute("data-idx"), 10);
          if (owner && !isNaN(idx)) {
            SELECTED_TODOS.owner = owner;
            SELECTED_TODOS.indices.clear();
            SELECTED_TODOS.indices.add(idx);
          }
        }
      }

      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;

      copiarTareasSeleccionadas(true);
      const maxIdx = Math.max(...SELECTED_TODOS.indices);
      pegarTareas(SELECTED_TODOS.owner, maxIdx + 1);
    }

    function eliminarTareasSeleccionadas() {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;
      const owner = SELECTED_TODOS.owner;
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;

      const count = SELECTED_TODOS.indices.size;
      const p = parsearTodos(it.todos || "");

      const accion = () => {
        guardarEstadoHistorial();
        const sortedDesc = Array.from(SELECTED_TODOS.indices).sort((a, b) => b - a);
        sortedDesc.forEach(idx => {
          if (idx >= 0 && idx < p.items.length) {
            p.items.splice(idx, 1);
          }
        });
        it.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(owner, "todos", it.todos);
        limpiarSeleccionTareas();
        renderizarJerarquiaPersonas();
        notificar(`${count} ${count === 1 ? 'tarea eliminada' : 'tareas eliminadas'}`);
      };

      if (count === 1) {
        accion();
      } else {
        confirmarEliminarInApp(
          `¿Eliminar ${count} tareas?`,
          `¿Estás seguro de eliminar las ${count} tareas seleccionadas de ${owner}?`,
          accion
        );
      }
    }

    function navegarSeleccionTareas(delta, isShift) {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;
      const owner = SELECTED_TODOS.owner;
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      const total = p.items.length;
      if (!total) return;

      const currentIdx = LAST_CLICKED_INDEX !== null ? LAST_CLICKED_INDEX : Math.max(...SELECTED_TODOS.indices);
      const targetIdx = Math.max(0, Math.min(total - 1, currentIdx + delta));

      if (isShift) {
        SELECTED_TODOS.indices.add(targetIdx);
        LAST_CLICKED_INDEX = targetIdx;
      } else {
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(targetIdx);
        LAST_CLICKED_INDEX = targetIdx;
      }
      actualizarVisualSeleccion();

      const row = document.getElementById(`todo_row_${owner}_${targetIdx}`);
      row?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    const UNDO_STACK = [];
    const REDO_STACK = [];
    const MAX_HISTORY = 40;
    let _isUndoRedoAction = false;

    function guardarEstadoHistorial() {
      if (_isUndoRedoAction) return;
      try {
        const snapshot = {
          semanal: JSON.parse(JSON.stringify(STATE.semanal || [])),
          recurrentes: JSON.parse(JSON.stringify(STATE.recurrentes || [])),
          futuros: JSON.parse(JSON.stringify(STATE.futuros || []))
        };
        UNDO_STACK.push(snapshot);
        if (UNDO_STACK.length > MAX_HISTORY) UNDO_STACK.shift();
        REDO_STACK.length = 0;
      } catch (_) {}
    }

    function deshacer() {
      if (!UNDO_STACK.length) {
        notificar("Nada que deshacer");
        return;
      }
      _isUndoRedoAction = true;
      try {
        const currentSnapshot = {
          semanal: JSON.parse(JSON.stringify(STATE.semanal || [])),
          recurrentes: JSON.parse(JSON.stringify(STATE.recurrentes || [])),
          futuros: JSON.parse(JSON.stringify(STATE.futuros || []))
        };
        REDO_STACK.push(currentSnapshot);

        const prev = UNDO_STACK.pop();
        STATE.semanal = prev.semanal;
        STATE.recurrentes = prev.recurrentes;
        STATE.futuros = prev.futuros;

        persistirMemoriaLocal();
        renderizarTodo();
        actualizarBadges();

        const curSem = STATE.semanal.find(s => coincidenSemanasClient(s.semana, STATE.semana));
        if (curSem) callServer("guardarSeguimientoSemanal", curSem);
        callServer("guardarOrdenRecurrentes", (STATE.recurrentes || []).map(r => r.id));

        notificar("Deshecho (Ctrl + Z) ↺");
      } catch (err) {
        console.error("Error en deshacer:", err);
      } finally {
        _isUndoRedoAction = false;
      }
    }

    function rehacer() {
      if (!REDO_STACK.length) {
        notificar("Nada que rehacer");
        return;
      }
      _isUndoRedoAction = true;
      try {
        const currentSnapshot = {
          semanal: JSON.parse(JSON.stringify(STATE.semanal || [])),
          recurrentes: JSON.parse(JSON.stringify(STATE.recurrentes || [])),
          futuros: JSON.parse(JSON.stringify(STATE.futuros || []))
        };
        UNDO_STACK.push(currentSnapshot);

        const next = REDO_STACK.pop();
        STATE.semanal = next.semanal;
        STATE.recurrentes = next.recurrentes;
        STATE.futuros = next.futuros;

        persistirMemoriaLocal();
        renderizarTodo();
        actualizarBadges();

        const curSem = STATE.semanal.find(s => coincidenSemanasClient(s.semana, STATE.semana));
        if (curSem) callServer("guardarSeguimientoSemanal", curSem);
        callServer("guardarOrdenRecurrentes", (STATE.recurrentes || []).map(r => r.id));

        notificar("Rehecho (Ctrl + Shift + Z) ↻");
      } catch (err) {
        console.error("Error en rehacer:", err);
      } finally {
        _isUndoRedoAction = false;
      }
    }

    // =========================================================================
    // MOVIMIENTO DE GRUPOS ENTRE SECCIONES (Próximos Proyectos <-> Frecuentes <-> Semanal)
    // =========================================================================
    function moverGrupoASeccion(origenTipo, origenOwner, origenIdOrIdx, destinoTipo, destinoFrecuencia) {
      if (!origenTipo || !origenOwner || origenIdOrIdx === undefined || !destinoTipo) return false;
      guardarEstadoHistorial();

      let groupTitle = "";
      let groupTasks = []; // Array de { text, link }

      // 1. Extraer del origen
      if (origenTipo === "fut") {
        const fIdx = STATE.futuros.findIndex(f => f.id === origenIdOrIdx);
        if (fIdx === -1) return false;
        const header = STATE.futuros[fIdx];
        groupTitle = (header.tema || "").replace(/^#{1,3}\s+/, "").trim();

        let nextIdx = fIdx + 1;
        while (nextIdx < STATE.futuros.length && STATE.futuros[nextIdx].owner === origenOwner && !STATE.futuros[nextIdx].isGroupHeader && !/^#{1,3}\s+/.test(STATE.futuros[nextIdx].tema || "")) {
          groupTasks.push({
            text: (STATE.futuros[nextIdx].tema || "").trim(),
            link: null
          });
          nextIdx++;
        }

        const countToRemove = 1 + groupTasks.length;
        const removed = STATE.futuros.splice(fIdx, countToRemove);
        removed.forEach(r => callServer("eliminarTemaFuturo", r.id));
      } else if (origenTipo === "rec") {
        const rIdx = STATE.recurrentes.findIndex(r => r.id === origenIdOrIdx);
        if (rIdx === -1) return false;
        const header = STATE.recurrentes[rIdx];
        groupTitle = (header.tarea || "").replace(/^#{1,3}\s+/, "").trim();
        const frec = header.frecuencia || "Semanal";

        let nextIdx = rIdx + 1;
        while (nextIdx < STATE.recurrentes.length && STATE.recurrentes[nextIdx].owner === origenOwner && (STATE.recurrentes[nextIdx].frecuencia === frec) && !STATE.recurrentes[nextIdx].isGroupHeader && !/^#{1,3}\s+/.test(STATE.recurrentes[nextIdx].tarea || "")) {
          groupTasks.push({
            text: (STATE.recurrentes[nextIdx].tarea || "").trim(),
            link: obtenerLinkData(STATE.recurrentes[nextIdx].links)
          });
          nextIdx++;
        }

        const countToRemove = 1 + groupTasks.length;
        const removed = STATE.recurrentes.splice(rIdx, countToRemove);
        removed.forEach(r => callServer("eliminarTareaRecurrente", r.id));
        callServer("guardarOrdenRecurrentes", STATE.recurrentes.map(r => r.id));
      } else if (origenTipo === "sem") {
        const sem = STATE.semanal.find(s => s.owner === origenOwner && coincidenSemanasClient(s.semana, STATE.semana));
        if (!sem) return false;
        const p = parsearTodos(sem.todos || "");
        const idx = typeof origenIdOrIdx === "number" ? origenIdOrIdx : parseInt(origenIdOrIdx, 10);
        if (isNaN(idx) || idx < 0 || idx >= p.items.length) return false;

        const header = p.items[idx];
        groupTitle = (header.title || "").trim();

        let end = idx + 1;
        while (end < p.items.length && !p.items[end].isGroupHeader && !p.items[end].isGroupClose) {
          groupTasks.push({
            text: (p.items[end].text || "").trim(),
            link: p.items[end].link ? { ...p.items[end].link } : null
          });
          end++;
        }
        if (end < p.items.length && p.items[end].isGroupClose) end++;

        p.items.splice(idx, end - idx);
        sem.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(origenOwner, "todos", sem.todos);
      }

      if (!groupTitle) groupTitle = "Proyecto Transferido";

      // 2. Insertar en destino

        notificar(`Proyecto "${groupTitle}" movido a Prioridades Semanales`);

      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();
      return true;

      if (!isHandle && e.currentTarget.getAttribute("draggable") !== "true") {
        e.preventDefault();
        return false;

      const fut = STATE.futuros.find(f => f.id === id);
      if (fut?.isGroupHeader || /^#{1,3}\s+/.test(fut?.tema || "")) {
        const title = (fut.tema || "").replace(/^#{1,3}\s+/, "");
        DRAG_ITEM = { type: 'fut-group', owner, id, title };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
        e.currentTarget.classList.add("is-dragging");
        try {
          const ghost = crearGhostArrastre(title || "Mover proyecto futuro", false, 1);
          e.dataTransfer.setDragImage(ghost, 22, 16);
          setTimeout(() => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 0);
        } catch (_) {}
        return;
      }

      DRAG_ITEM = { type: 'fut', owner, id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
      e.currentTarget.classList.add("is-dragging");

    let _notionShortcutsInitialized = false;
    function setupNotionKeyboardShortcuts() {
      if (_notionShortcutsInitialized) return;
      _notionShortcutsInitialized = true;

      setupMarqueeSelection();

      window.addEventListener("keydown", function(e) {
        // Modal de confirmación abierto: Enter confirma, Escape cancela
        const confirmOverlay = document.getElementById("modalConfirmOverlay");
        if (confirmOverlay && confirmOverlay.style.display !== "none") {
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            ejecutarConfirmacionInApp();
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            cerrarModalConfirm();
            return;
          }
        }

        const isCtrlOrCmd = e.ctrlKey || e.metaKey;

        // Ctrl+Z (Undo)
        if (isCtrlOrCmd && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
          e.preventDefault();
          deshacer();
          return;
        }

        // Redo: Ctrl+Shift+Z, Cmd+Shift+Z, Ctrl+Y, o Shift+Z cuando el foco no está escribiendo en un input
        const isTyping = document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA");
        const isRedoShortcut = (isCtrlOrCmd && e.shiftKey && (e.key === "z" || e.key === "Z")) ||
                               (isCtrlOrCmd && (e.key === "y" || e.key === "Y")) ||
                               (!isCtrlOrCmd && e.shiftKey && (e.key === "z" || e.key === "Z") && !isTyping);

        if (isRedoShortcut) {
          e.preventDefault();
          rehacer();
          return;
        }

        // Escape: cerrar visor de imagen, modal de adjuntar o limpiar selección
        if (e.key === "Escape") {
          cerrarMenuMoverGrupo();
          if (document.getElementById("modalVisorImagen")?.style.display !== "none") {
            e.preventDefault();
            e.stopPropagation();
            cerrarModalVisorImagen();
            return;
          }
          if (document.getElementById("modalAdjuntarImagen")?.style.display !== "none") {
            e.preventDefault();
            e.stopPropagation();
            cerrarModalAdjuntarImagen();
            return;
          }
          if (SELECTED_TODOS.indices.size > 0) {
            e.preventDefault();
            limpiarSeleccionTareas();
            return;
          }
        }

        // Ctrl+C (Copy)
        if (isCtrlOrCmd && (e.key === "c" || e.key === "C")) {
          const activeEl = document.activeElement;
          const isInput = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");
          const hasTextSel = isInput && (activeEl.selectionStart !== activeEl.selectionEnd);

          if (!hasTextSel) {
            if (SELECTED_TODOS.indices.size > 0 || (isInput && activeEl.classList.contains("checklist-input"))) {
              e.preventDefault();
              copiarTareasSeleccionadas();
              return;
            }
          }
        }

        // Ctrl+V (Paste / Duplicate)
        if (isCtrlOrCmd && (e.key === "v" || e.key === "V")) {
          const activeEl = document.activeElement;
          const isInsideInput = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

          if (APP_CLIPBOARD_TASKS && APP_CLIPBOARD_TASKS.length > 0) {
            const hasTextSel = isInsideInput && (activeEl.selectionStart !== activeEl.selectionEnd);
            if (!isInsideInput || (!hasTextSel && activeEl.classList.contains("checklist-input"))) {
              e.preventDefault();
              let targetOwner = SELECTED_TODOS.owner;
              let targetIdx = undefined;
              if (SELECTED_TODOS.indices.size > 0) {
                targetIdx = Math.max(...SELECTED_TODOS.indices) + 1;
              } else if (isInsideInput && activeEl.classList.contains("checklist-input")) {
                const row = activeEl.closest(".checklist-row");
                targetOwner = targetOwner || row?.getAttribute("data-owner");
                const rowIdx = parseInt(row?.getAttribute("data-idx"), 10);
                if (!isNaN(rowIdx)) targetIdx = rowIdx + 1;
              }
              pegarTareas(targetOwner, targetIdx);
              return;
            }
          }
        }

        // Ctrl+D (Duplicate)
        if (isCtrlOrCmd && (e.key === "d" || e.key === "D")) {
          if (SELECTED_TODOS.indices.size > 0 || document.activeElement?.classList.contains("checklist-input")) {
            e.preventDefault();
            duplicarTareasSeleccionadas();
            return;
          }
        }

        // Ctrl+A (Select all tasks for current owner)
        if (isCtrlOrCmd && (e.key === "a" || e.key === "A") && SELECTED_TODOS.owner && document.activeElement?.tagName !== "INPUT") {
          e.preventDefault();
          const it = STATE.semanal.find(s => s.owner === SELECTED_TODOS.owner && coincidenSemanasClient(s.semana, STATE.semana));
          if (it) {
            const p = parsearTodos(it.todos || "");
            SELECTED_TODOS.indices.clear();
            for (let i = 0; i < p.items.length; i++) {
              SELECTED_TODOS.indices.add(i);
            }
            actualizarVisualSeleccion();
            notificar(`${p.items.length} tareas seleccionadas`);
          }
          return;
        }

        // Delete / Backspace (Delete selected tasks)
        if ((e.key === "Delete" || e.key === "Backspace") && SELECTED_TODOS.indices.size > 0) {
          if (document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
            e.preventDefault();
            eliminarTareasSeleccionadas();
            return;
          }
        }

        // Enter (Focus input of selected task to edit)
        if (e.key === "Enter" && SELECTED_TODOS.indices.size === 1 && document.activeElement?.tagName !== "INPUT") {
          const idx = Array.from(SELECTED_TODOS.indices)[0];
          const row = document.getElementById(`todo_row_${SELECTED_TODOS.owner}_${idx}`);
          const inp = row?.querySelector(".checklist-input");
          if (inp) {
            e.preventDefault();
            inp.focus();
            const len = inp.value.length;
            inp.setSelectionRange(len, len);
            limpiarSeleccionTareas();
            return;
          }
        }

        // ArrowUp / ArrowDown navigation
        if (SELECTED_TODOS.indices.size > 0 && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
          if (document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
            e.preventDefault();
            navegarSeleccionTareas(e.key === "ArrowDown" ? 1 : -1, e.shiftKey);
            return;
          }
        }

        // Atajo global Ctrl+B / Cmd+B para aplicar formato en negrita
        if (isCtrlOrCmd && (e.key === "b" || e.key === "B")) {
          const activeEl = document.activeElement;
          if (activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA")) {
            e.preventDefault();
            aplicarNegritaAInput(activeEl);
            return;
          }
        }
      });

      // Clear selection on clicking outside
      document.addEventListener("click", function(e) {
        if (e.target.closest(".checklist-row") || e.target.closest("#floatingTaskSelectionBar") || e.target.closest(".modal-overlay") || e.target.closest(".control-bar")) {
          return;
        }
        if (SELECTED_TODOS.indices.size > 0) {
          limpiarSeleccionTareas();
        }
      });

      // Captura y pegado inteligente: imágenes del portapapeles y texto
      window.addEventListener("paste", function(e) {
        // 1. Detección de imagen en el portapapeles
        const items = e.clipboardData?.items;
        if (items) {
          for (let i = 0; i < items.length; i++) {
            if (items[i].type && items[i].type.startsWith("image/")) {
              const file = items[i].getAsFile();
              if (file) {
                e.preventDefault();
                // Si el modal de adjuntar imagen está abierto, previsualizar en el modal
                if (MODAL_ADJUNTAR_IMAGEN_ABIERTO) {
                  previsualizarArchivoEnModal(file);
                  return;
                }
                const activeEl = document.activeElement;
                const activeRow = activeEl?.closest(".checklist-row") || activeEl?.closest(".todo-group-header") || activeEl?.closest(".person-card");
                let taskIdx = null;
                if (activeRow && activeRow.hasAttribute("data-idx") && !activeRow.classList.contains("todo-group-header")) {
                  taskIdx = parseInt(activeRow.getAttribute("data-idx"), 10);
                } else if (SELECTED_TODOS.indices.size === 1) {
                  taskIdx = Array.from(SELECTED_TODOS.indices)[0];
                }
                const owner = activeRow?.getAttribute("data-owner") || activeRow?.id?.replace("card_persona_", "") || TARGET_IMAGE_OWNER || (STATE.ownerFiltro !== "Todos" ? STATE.ownerFiltro : "") || STATE.usuario?.nombre || STATE.equipo?.[0]?.nombre;
                procesarYAdjuntarImagen(file, owner, taskIdx);
                return;
              }
            }
          }
        }

        const activeEl = document.activeElement;
        const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

        if (SELECTED_TODOS.indices.size > 0 && !isTyping) {
          const text = e.clipboardData?.getData("text/plain");
          if (text) {
            const parsed = parsearTodos(text);
            if (parsed.items && parsed.items.length) {
              e.preventDefault();
              APP_CLIPBOARD_TASKS = parsed.items;
              const maxIdx = Math.max(...SELECTED_TODOS.indices);
              pegarTareas(SELECTED_TODOS.owner, maxIdx + 1);
            }
          }
        }
      });
    }
