<script>
    const CONFIG = {
      SPREADSHEET_ID: "1vBq5i_IRlAuhgos6awzl68j-tlKo-7vZAKtwp4do1dA",
      ADMIN_EMAIL: "matias.cagliero@pedidosya.com"
    };

    function getRunner() {
      if (typeof window !== "undefined" && window.google?.script?.run) return window.google.script.run;
      if (typeof google !== "undefined" && google?.script?.run) return google.script.run;
      return null;
    }

    function debugLog(msg) {
      console.log("[DEBUG]", msg);
      const pre = document.getElementById("debugLogPre"), text = document.getElementById("debugText"), dot = document.getElementById("debugDot");
      if (pre) {
        pre.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        pre.scrollTop = pre.scrollHeight;
      }
      if (text) text.textContent = msg;
      if (dot) {
        if (String(msg).toLowerCase().includes("error")) dot.style.background = "#EF4444";
        else dot.style.background = "#22C55E";
      }
    }

    function limpiarLogsConsola() {
      const pre = document.getElementById("debugLogPre");
      if (pre) pre.textContent = `[${new Date().toLocaleTimeString()}] Consola de diagnóstico reiniciada.\n`;
    }

    window.onerror = function(msg, url, line) {
      console.error(`ERROR JS L${line}: ${msg}`);
      debugLog(`ERROR JS L${line}: ${msg}`);
    };

    function calcularSemanaClienteActual(fechaRef) {
      const d = fechaRef ? new Date(fechaRef) : new Date();
      const diaSem = d.getDay();
      const diffLunes = (diaSem === 0 ? -6 : 1) - diaSem;
      const lunes = new Date(d); lunes.setDate(d.getDate() + diffLunes);
      const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
      const dTarget = new Date(d.valueOf());
      dTarget.setDate(dTarget.getDate() - ((d.getDay() + 6) % 7) + 3);
      const primerJueves = dTarget.valueOf();
      dTarget.setMonth(0, 1);
      if (dTarget.getDay() !== 4) dTarget.setMonth(0, 1 + ((4 - dTarget.getDay()) + 7) % 7);
      const numSem = 1 + Math.ceil((primerJueves - dTarget) / 604800000);
      const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
      const pad = n => String(n).padStart(2, "0");
      return `Semana ${pad(numSem)} | ${pad(lunes.getDate())} ${meses[lunes.getMonth()]} - ${pad(domingo.getDate())} ${meses[domingo.getMonth()]}`;
    }

    function generarSemanasDisponiblesCliente(semanaActual) {
      const lista = [], hoy = new Date();
      for (let i = -8; i <= 8; i++) {
        const d = new Date(hoy); d.setDate(hoy.getDate() + (i * 7));
        const s = calcularSemanaClienteActual(d);
        if (!lista.includes(s)) lista.push(s);
      }
      if (semanaActual && !lista.some(s => coincidenSemanasClient(s, semanaActual))) lista.push(semanaActual);
      return lista;
    }

    function obtenerFechaHoyKey() {
      const d = new Date(), pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function obtenerMesActualKey() {
      const d = new Date(), pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    }
    function obtenerDiaHoyFormateado() {
      const d = new Date(), dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"], meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
      return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
    }
    function obtenerMesActualFormateado() {
      const d = new Date(), meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      return `${meses[d.getMonth()]} ${d.getFullYear()}`;
    }

    function hidratarChecksRecurrentes(lista) {
      (lista || []).forEach(r => {
        if (r.estado && typeof r.estado === "string" && r.estado.startsWith("{")) {
          try {
            const p = JSON.parse(r.estado);
            if (!r.checksDiarios) r.checksDiarios = p.diarios || {};
            if (!r.semanasCompletadas) r.semanasCompletadas = p.semanas || {};
            if (!r.checksMensuales) r.checksMensuales = p.meses || {};
            if (!r.historialVersiones) r.historialVersiones = p.versiones || [];
          } catch (_) {}
        }
      });
    }

    function esSemanaPasada(semana) {
      if (!semana || !STATE.semanaActual) return false;
      if (coincidenSemanasClient(semana, STATE.semanaActual)) return false;
      const idxCur = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, STATE.semanaActual));
      const idxTarget = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, semana));
      if (idxCur !== -1 && idxTarget !== -1) return idxTarget < idxCur;
      const mCur = (STATE.semanaActual || "").match(/(?:w|semana\s*)(\d{1,2})/i);
      const mTarget = (semana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
      if (mCur && mTarget) return parseInt(mTarget[1], 10) < parseInt(mCur[1], 10);
      return false;
    }

    function esSemanaFutura(semana) {
      if (!semana || !STATE.semanaActual) return false;
      if (coincidenSemanasClient(semana, STATE.semanaActual)) return false;
      return !esSemanaPasada(semana);
    }

    function irASemanaActual() {
      const targetSem = STATE.semanaActual || calcularSemanaClienteActual();
      if (!targetSem) return;

      STATE.semanaActual = targetSem;
      STATE.semana = targetSem;
      try { localStorage.setItem("peya_app_semana", STATE.semana); } catch (_) {}

      poblarOpcionesSemanas(true);
      const el = document.getElementById("selectSemanaActual");
      if (el) el.value = STATE.semana;

      ejecutarRolloverTareasPendientes(STATE.semana);
      actualizarBadges();
      renderizarJerarquiaPersonas();
      actualizarBotonesNavegacionSemana();

      if (document.getElementById("tab-timeline")?.style.display !== "none") {
        centrarTimelineEnSemanaActual();
      }

      notificar(`Volviendo a ${STATE.semana}`);
    }

    function obtenerTextoRecurrenteParaSemana(r, semana) {
      if (!r) return "";
      if (!semana || coincidenSemanasClient(semana, STATE.semanaActual) || !esSemanaPasada(semana)) {
        return r.tarea || "";
      }
      if (Array.isArray(r.historialVersiones) && r.historialVersiones.length) {
        const mTarget = (semana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
        const numTarget = mTarget ? parseInt(mTarget[1], 10) : 999;
        for (let i = r.historialVersiones.length - 1; i >= 0; i--) {
          const v = r.historialVersiones[i];
          const mHasta = (v.hastaSemana || "").match(/(?:w|semana\s*)(\d{1,2})/i);
          const numHasta = mHasta ? parseInt(mHasta[1], 10) : 0;
          if (numTarget <= numHasta && v.tarea) return v.tarea;
        }
      }
      return r.tarea || "";
    }

    const esEntornoLocal = typeof location !== "undefined" && (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:" || !location.hostname);
    if (esEntornoLocal && !getRunner()) {
      window.google = { script: { run: new Proxy({}, {
        get: (t, fn) => (...args) => {
          const self = { withSuccessHandler: f => { self._s = f; return self; }, withFailureHandler: f => { self._f = f; return self; } };
          self[fn] = () => { if (self._s) setTimeout(() => self._s({ success: true }), 30); };
          return self;
        }
      }) } };
    }

    const AVATAR_COLORS = ["#EA1D2C", "#2563EB", "#7C3AED", "#059669", "#D97706", "#DB2777", "#0891B2", "#4F46E5"];

    const curWeekClient = calcularSemanaClienteActual();
    const STATE = {
      usuario: null, esAdmin: false,
      semanaActual: curWeekClient,
      semana: curWeekClient,
      semanas: generarSemanasDisponiblesCliente(curWeekClient),
      equipo: [], semanal: [], recurrentes: [], futuros: [], reportes: [], bolsa: [],
      timelineOffset: 0, timelineFiltroTipo: "semanal", timelineOwnerFiltro: "Todos", ownerFiltro: "Todos", modoEdicionTodos: {}, colapsadoSemana: {}, colapsadoRecurrentes: {}, colapsadoProxima: {}, colapsadoProyectos: {}
    };

    function persistirMemoriaLocal() {
      try {
        ["semanal", "recurrentes", "futuros", "bolsa", "reportes", "equipo"].forEach(k => {
          localStorage.setItem(`peya_app_${k}`, JSON.stringify(STATE[k] || []));
        });
      } catch (e) {}
    }

    function cargarMemoriaLocal() {
      try {
        ["semanal", "recurrentes", "futuros", "bolsa", "equipo"].forEach(k => {
          const s = localStorage.getItem(`peya_app_${k}`);
          if (s) { const p = JSON.parse(s); if (Array.isArray(p) && p.length) STATE[k] = p; }
        });
        const sOwner = localStorage.getItem("peya_app_owner");
        if (sOwner) STATE.ownerFiltro = sOwner;
        const sTlOwner = localStorage.getItem("peya_app_tl_owner");
        if (sTlOwner) STATE.timelineOwnerFiltro = sTlOwner;
        const sTlTipo = localStorage.getItem("peya_app_tl_tipo");
        if (sTlTipo) STATE.timelineFiltroTipo = sTlTipo;
        const sSem = localStorage.getItem("peya_app_semana");
        if (sSem) STATE.semana = sSem;
        const sColProy = localStorage.getItem("peya_app_colapsado_proyectos");
        if (sColProy) {
          try { STATE.colapsadoProyectos = JSON.parse(sColProy) || {}; } catch (_) {}
        }
      } catch (e) {}
    }

    function inicializarApp() {
      cargarMemoriaLocal();
      poblarOpcionesEquipo();
      poblarOpcionesSemanas();
      actualizarBotonesNavegacionSemana();
      actualizarBadges();
      renderizarTodo();
      setupNotionKeyboardShortcuts();

      // Restaurar exactamente la pestaña donde estaba el usuario antes de recargar
      const savedTab = localStorage.getItem("peya_app_tab") || (location.hash ? location.hash.replace("#", "") : "semanal");
      if (savedTab && ["semanal", "timeline", "bolsa", "admin"].includes(savedTab)) {
        seleccionarTab(savedTab);
      }

      function conectarConServidor(intento = 1) {
        const statusEl = document.getElementById("statusCargaDetalle");
        const runner = getRunner();
        if (!runner || typeof runner.obtenerConfiguracionInicial !== "function") {
          if (intento <= 30) {
            const msg = `Sincronizando con Google Sheets (intento ${intento}/30)...`;
            debugLog(msg);
            if (statusEl) statusEl.textContent = msg;
            setTimeout(() => conectarConServidor(intento + 1), 150);
            return;
          }
          if (statusEl) statusEl.textContent = "Aviso: No se detectó motor de Apps Script.";
          actualizarPillConexion(false, "Modo local (sin Google Apps Script)");
          return;
        }

        const msgCon = "Petición enviada a Google Sheets, esperando respuesta...";
        debugLog(msgCon);
        if (statusEl) statusEl.textContent = msgCon;

        runner
          .withSuccessHandler(config => {
            if (statusEl) statusEl.textContent = "Datos recibidos. Dibujando tablero...";
            debugLog(`Config recibida: ${config.semanaActual}. Miembros: ${(config.equipo || []).length}`);
            if (config.usuarioActual) STATE.usuario = config.usuarioActual;
            STATE.esAdmin = config.usuarioActual ? config.usuarioActual.esAdmin : true;

            STATE.semanaActual = config.semanaActual || STATE.semanaActual || calcularSemanaClienteActual();
            const savedSem = localStorage.getItem("peya_app_semana");
            if (savedSem && config.semanasDisponibles?.some(s => coincidenSemanasClient(s, savedSem))) {
              STATE.semana = savedSem;
            } else {
              STATE.semana = STATE.semanaActual;
            }

            if (config.semanasDisponibles?.length) STATE.semanas = config.semanasDisponibles;
            if (config.equipo?.length) STATE.equipo = config.equipo;
            if (config.version) CLIENT_DATA_VERSION = config.version;
            actualizarPillConexion(config.conexionSheets ? config.conexionSheets.conectado : true);
            if (Array.isArray(config.conectados)) {
              actualizarUsuariosConectadosUI(config.conectados);
            }

            const email = config.usuarioActual?.email?.toLowerCase() || "";
            if (STATE.esAdmin || email.includes("cagli") || email.includes("matias")) {
              STATE.esAdmin = true;
              const btn = document.getElementById("tabBtnAdmin"); if (btn) btn.style.display = "flex";
            }

            // Auto-filtro por defecto al usuario que entra según su email
            if (config.usuarioActual?.nombre) {
              const uNombre = config.usuarioActual.nombre.trim();
              const uEmail = (config.usuarioActual.email || "").toLowerCase().trim();
              const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
              const uNorm = norm(uNombre);

              const matchingMember = (config.equipo || []).find(m => {
                const mEmail = (m.email || "").toLowerCase().trim();
                if (mEmail && mEmail === uEmail) return true;
                const mNorm = norm(m.nombre);
                return mNorm === uNorm || (uNorm.length > 3 && mNorm.includes(uNorm)) || (mNorm.length > 3 && uNorm.includes(mNorm));
              });

              if (matchingMember) {
                STATE.ownerFiltro = matchingMember.nombre;
              } else if (uNombre && uNombre !== "Analista") {
                STATE.ownerFiltro = uNombre;
              }
              try { localStorage.setItem("peya_app_owner", STATE.ownerFiltro); } catch (_) {}
            }

            poblarOpcionesEquipo();
            poblarOpcionesSemanas();
            actualizarBotonesNavegacionSemana();

            if (config.datos) {
              const d = config.datos;
              if (d.seguimientoSemanal) STATE.semanal = d.seguimientoSemanal;
              if (d.recurrentes) STATE.recurrentes = d.recurrentes;
              if (d.futuros) STATE.futuros = d.futuros;
              if (d.reportes) STATE.reportes = d.reportes;
              if (d.bolsa) STATE.bolsa = d.bolsa;
              if (d.equipo?.length) STATE.equipo = d.equipo;
              actualizarBadges();
              renderizarTodo();
              iniciarSincronizacionEnVivo();
              debugLog(`Listo - Datos cargados (${STATE.semanal.length} tareas semanales)`);
            } else {
              renderizarTodo();
              iniciarSincronizacionEnVivo();
              cargarDatosCompletos(config.semanaActual || STATE.semana);
            }
          })
          .withFailureHandler(err => {
            const msg = err?.message || String(err);
            debugLog(`Error Sheets: ${msg}`);
            actualizarPillConexion(false, msg);
            const box = document.getElementById("contenedorPersonas");
            if (box) {
              box.innerHTML = `
                <div style="padding:24px;text-align:center;color:#DC2626;background:#FEE2E2;border-radius:8px;margin:16px 0;border:1px solid #FECACA;">
                  <div style="font-weight:800;font-size:13px;margin-bottom:4px;">Error al conectar con Google Sheets</div>
                  <div style="font-size:11px;margin-bottom:10px;color:#991B1B;">${escapeHtml(msg)}</div>
                  <button class="btn btn-primary" onclick="inicializarApp()">Reintentar conexión</button>
                </div>
              `;
            }
          })
          .obtenerConfiguracionInicial();
      }
      conectarConServidor(1);
    }

    function cargarDatosCompletos(semana) {
      const runner = getRunner();
      if (!runner) return;
      runner
        .withSuccessHandler(data => {
          STATE.semanal = data.seguimientoSemanal || [];
          STATE.recurrentes = data.recurrentes || [];
          STATE.futuros = data.futuros || [];
          STATE.reportes = data.reportes || [];
          STATE.bolsa = data.bolsa || [];
          STATE.semana = data.semanaSeleccionada || semana;
          if (data.semanaActual) STATE.semanaActual = data.semanaActual;
          if (data.equipo?.length) STATE.equipo = data.equipo;
          poblarOpcionesEquipo();
          poblarOpcionesSemanas();
          actualizarBadges();
          renderizarTodo();
          actualizarBotonesNavegacionSemana();
          notificar("Datos sincronizados");
        })
        .withFailureHandler(err => debugLog(`Error cargarDatosCompletos: ${err?.message || err}`))
        .obtenerDatosCompletos(semana);
    }

    function coincidenSemanasClient(s1, s2) {
      if (!s1 || !s2) return false;
      const a = String(s1).trim().toLowerCase(), b = String(s2).trim().toLowerCase();
      if (a === b) return true;
      const m1 = a.match(/(?:w|semana\s*)(\d{1,2})/i), m2 = b.match(/(?:w|semana\s*)(\d{1,2})/i);
      return !!(m1 && m2 && m1[1] === m2[1]);
    }

    function actualizarBadges() {
      const cSem = document.getElementById("countSemanal");
      if (cSem) cSem.innerText = (STATE.semanal || []).filter(s => coincidenSemanasClient(s.semana, STATE.semana)).length;
      const cBol = document.getElementById("countBolsa");
      if (cBol) cBol.innerText = (STATE.bolsa || []).filter(b => b.estado !== "Completado" && b.estado !== "Asignada").length;
      poblarOpcionesSemanas();
    }

    function renderizarTodo() {
      try { renderizarJerarquiaPersonas(); } catch (e) { console.error(e); }
      try { renderizarTimeline(); } catch (e) { console.error(e); }
      try { renderizarBolsa(); } catch (e) { console.error(e); }
    }

    function cambiarSemanaDirecta() {
      const el = document.getElementById("selectSemanaActual");
      if (!el || !el.value || el.value === STATE.semana) return;
      STATE.semana = el.value;
      try { localStorage.setItem("peya_app_semana", STATE.semana); } catch (_) {}
      ejecutarRolloverTareasPendientes(STATE.semana);
      actualizarBadges();
      renderizarJerarquiaPersonas();
      actualizarBotonesNavegacionSemana();
      notificar(`Mostrando ${STATE.semana}`);
    }

    function desplazarSemana(delta) {
      let idx = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, STATE.semana));
      if (idx === -1) idx = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, STATE.semanaActual));
      if (idx === -1) return;
      const nuevo = idx + delta;
      if (nuevo >= 0 && nuevo < STATE.semanas.length) {
        STATE.semana = STATE.semanas[nuevo];
        try { localStorage.setItem("peya_app_semana", STATE.semana); } catch (_) {}
        poblarOpcionesSemanas(true);
        const el = document.getElementById("selectSemanaActual");
        if (el) el.value = STATE.semana;
        ejecutarRolloverTareasPendientes(STATE.semana);
        actualizarBadges();
        renderizarJerarquiaPersonas();
        actualizarBotonesNavegacionSemana();
        notificar(`Mostrando ${STATE.semana}`);
      }
    }

    function actualizarBotonesNavegacionSemana() {
      const idx = (STATE.semanas || []).findIndex(s => coincidenSemanasClient(s, STATE.semana));
      const btnNext = document.getElementById("btnSemanaNext"), btnPrev = document.getElementById("btnSemanaPrev");
      if (btnNext) btnNext.disabled = (idx >= STATE.semanas.length - 1);
      if (btnPrev) btnPrev.disabled = (idx <= 0);

      const bEstado = document.getElementById("badgeSemanaEstado");
      const btnVolver = document.getElementById("btnVolverSemanaActual");
      const bannerContexto = document.getElementById("bannerContextoSemana");

      const esActual = coincidenSemanasClient(STATE.semana, STATE.semanaActual);
      const esPasada = !esActual && esSemanaPasada(STATE.semana);

      if (btnVolver) {
        btnVolver.style.display = esActual ? "none" : "inline-flex";
      }

      if (bEstado) {
        if (esActual) {
          bEstado.innerHTML = "Actual";
          bEstado.style.background = "#ECFDF5";
          bEstado.style.color = "#065F46";
          bEstado.style.border = "1px solid #A7F3D0";
          bEstado.style.cursor = "default";
          bEstado.title = "Semana actual en curso: las tareas y ediciones aplican en tiempo real";
          bEstado.onclick = null;
          bEstado.classList.remove("is-interactive");
        } else if (esPasada) {
          bEstado.innerHTML = "Histórico · Volver ↺";
          bEstado.style.background = "#FEF3C7";
          bEstado.style.color = "#92400E";
          bEstado.style.border = "1px solid #FDE68A";
          bEstado.style.cursor = "pointer";
          bEstado.title = "Semana pasada (registro histórico conservado). Clic para volver a la semana actual";
          bEstado.onclick = irASemanaActual;
          bEstado.classList.add("is-interactive");
        } else {
          bEstado.innerHTML = "Planificación · Volver ↺";
          bEstado.style.background = "#EFF6FF";
          bEstado.style.color = "#1D4ED8";
          bEstado.style.border = "1px solid #BFDBFE";
          bEstado.style.cursor = "pointer";
          bEstado.title = "Semana futura (planificación de próximas iniciativas). Clic para volver a la semana actual";
          bEstado.onclick = irASemanaActual;
          bEstado.classList.add("is-interactive");
        }
      }

      if (bannerContexto) {
        if (esActual) {
          bannerContexto.style.display = "none";
          bannerContexto.className = "banner-contexto-semana";
          bannerContexto.innerHTML = "";
        } else if (esPasada) {
          bannerContexto.style.display = "flex";
          bannerContexto.className = "banner-contexto-semana banner-pasado";
          bannerContexto.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="display:inline-flex;align-items:center;color:#92400E;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </span>
              <span>Estás visualizando el histórico de <strong>${escapeHtml(STATE.semana)}</strong> (Registro conservado).</span>
            </div>
            <button class="btn-banner-volver" onclick="irASemanaActual()" title="Ir a la semana actual">Volver a la Semana Actual &rarr;</button>
          `;
        } else {
          bannerContexto.style.display = "flex";
          bannerContexto.className = "banner-contexto-semana banner-futuro";
          bannerContexto.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="display:inline-flex;align-items:center;color:#1E40AF;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              </span>

    // =========================================================================
    // PARSER & SERIALIZADOR DE TO-DOS
    // =========================================================================
    const RGX_LINK_TAG = /\[link:(https?:\/\/[^|\]]+)(?:\|([^\]]+))?\]/i;
    const RGX_IMG_TAG = /\[img:(https?:\/\/[^\]]+)\]/i;
    const RGX_IMG_URL = /^(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|svg))(?:\?[^\s]*)?$/i;

    function parsearTodos(rawText) {
      if (!rawText) return { items: [], images: [] };
      const items = [], images = [];
      String(rawText).split(/\r?\n/).forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const img = trimmed.match(RGX_IMG_TAG) || trimmed.match(RGX_IMG_URL);
        if (img) { images.push(img[1]); return; }

        // Detección de encabezado de grupo o tema: Ej: # Mapster 2 o ## Daily Report
        const mGroup = trimmed.match(/^#{1,3}\s+(.+)$/);
        if (mGroup) {
          items.push({ isGroupHeader: true, title: mGroup[1].trim() });
          return;
        }

        // Detección exhaustiva de subtarea (↳, sangría, tab o tag [sub]):
        const hasIndent = /^\s{1,}|\t/.test(line);
        const hasSubArrow = /↳|&#8627;|\u21B3/.test(line);
        const hasSubTag = /\[sub(?:tarea)?\]/i.test(line);
        const isSubpoint = hasIndent || hasSubArrow || hasSubTag;

        let checked = false;
        let cleanLine = trimmed.replace(/^(?:↳|&#8627;|\u21B3|\[sub(?:tarea)?\])\s*/i, "");

        if (/^[-*•]?\s*\[x\]\s*/i.test(cleanLine)) {
          checked = true;
          cleanLine = cleanLine.replace(/^[-*•]?\s*\[x\]\s*/i, "");
        } else if (/^[-*•]?\s*\[\s*\]\s*/i.test(cleanLine)) {
          checked = false;
          cleanLine = cleanLine.replace(/^[-*•]?\s*\[\s*\]\s*/i, "");
        } else if (/^[-*•]\s+/.test(cleanLine)) {
          cleanLine = cleanLine.replace(/^[-*•]\s+/, "");
        }

        cleanLine = cleanLine.replace(/^(?:↳|&#8627;|\u21B3|\[sub(?:tarea)?\])\s*/i, "").trim();

        let itemLink = null;
        const lk = cleanLine.match(RGX_LINK_TAG);
        if (lk && /^https?:\/\//i.test(lk[1].trim())) {
          itemLink = { url: lk[1].trim(), label: lk[2] || "Link" };
          cleanLine = cleanLine.replace(lk[0], "").trim();
        } else {
          const u = cleanLine.match(/(https?:\/\/[^\s]+)$/i);
          if (u) {
            itemLink = { url: u[1], label: "Link" };
            cleanLine = cleanLine.replace(u[0], "").trim();
          }
        }
        items.push({ text: cleanLine, checked: checked, isSubpoint: isSubpoint, link: itemLink });
      });
      return { items, images };
    }

    function serializarTodos(items, images) {
      const lines = [];
      (items || []).forEach((it) => {
        if (it.isGroupHeader) {
          if (it.title?.trim()) lines.push(`# ${it.title.trim()}`);
          return;
        }
        const prefix = it.isSubpoint ? "  ↳ " : "";
        let line = `${prefix}- [${it.checked ? 'x' : ' '}] ${it.text || ''}`;
        if (it.link?.url && /^https?:\/\//i.test(it.link.url.trim())) {
          line += ` [link:${it.link.url.trim()}|${it.link.label || 'Link'}]`;
        }
        lines.push(line);
      });
      (images || []).forEach(img => lines.push(`[img:${img}]`));
      return lines.join("\n");
    }

          return `
            <div class="subpoint-row" id="sub_fut_${f.id}">
              <span class="subpoint-bullet">&#8627;</span>
              <input type="text" class="subpoint-task-input" value="${escapeHtml(f.tema || '')}" onchange="guardarCampoFuturoInline('${f.id}', 'tema', this.value)">
              <input type="text" style="width:110px;font-size:11px;font-weight:700;padding:2px 5px;border:1px solid var(--border);border-radius:4px;" value="${escapeHtml(f.target || 'A definir')}" onchange="guardarCampoFuturoInline('${f.id}', 'target', this.value)">
              <button class="btn-promote-item" onclick="promoverFuturoDirecto('${f.id}')">Promover &rarr;</button>
              <button class="btn-del-mini" onclick="eliminarFuturoDirecto('${f.id}')">&times;</button>
            </div>
          `;
        }

        let futRowsHtml = "";
        let curFutProy = null;
        let curFutTasks = [];

        function flushFutProject() {
          if (!curFutProy) return "";
          const key = `fut_${m.nombre}_${curFutProy.f.id}`;
          const isCol = !!STATE.colapsadoProyectos[key];
          const title = (curFutProy.f.tema || "").replace(/^#{1,3}\s+/, "");
          const innerTasks = curFutTasks.map(f => renderFilaFuturo(f)).join("");

          const out = `
            <div class="project-block-container fut-project" id="proy_fut_${curFutProy.f.id}">
              <div class="todo-group-header fut-group-header-row" draggable="false"
                   id="sub_fut_${curFutProy.f.id}">
                <button class="proy-toggle-btn" onclick="toggleColapsarProyectoGenerico('${key}', 'proy_body_fut_${curFutProy.f.id}', 'icon_fut_${curFutProy.f.id}')" title="Colapsar / Desplegar proyecto">
                  <span class="proy-toggle-icon ${isCol ? 'is-collapsed' : ''}" id="icon_fut_${curFutProy.f.id}">&#9660;</span>
                </button>
                <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">
                  <span style="color:#8B5CF6;font-weight:900;font-size:13px;">#</span>
                  <input type="text" class="todo-group-title-input" value="${escapeHtml(title)}"
                         placeholder="Nombre del proyecto futuro..."
                         onkeydown="if(event.key==='Enter'){event.preventDefault();agregarFilaFuturoPara('${escapeHtml(m.nombre)}');}"
                         oninput="guardarCampoFuturoInline('${curFutProy.f.id}', 'tema', '# ' + this.value.replace(/^#+\\s*/, ''))">
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <input type="text" style="width:110px;font-size:11px;font-weight:700;padding:2px 5px;border:1px solid #DDD6FE;border-radius:4px;background:#FFFFFF;"
                         value="${escapeHtml(curFutProy.f.target || 'A definir')}"
                         placeholder="Target..."
                         onchange="guardarCampoFuturoInline('${curFutProy.f.id}', 'target', this.value)">
                  <button class="btn-del-group" onclick="eliminarFuturoDirecto('${curFutProy.f.id}')" title="Eliminar proyecto">&times;</button>
                </div>
              </div>
              <div class="project-tasks-body" id="proy_body_fut_${curFutProy.f.id}" style="${isCol ? 'display:none;' : ''}">
                ${innerTasks || `<div style="font-size:11px;color:var(--text-muted);padding:4px 6px;font-style:italic;">Sin iniciativas en este proyecto.</div>`}
              </div>
            </div>
          `;
          curFutProy = null;
          curFutTasks = [];
          return out;
        }

        futuros.forEach(f => {
          if (f.isGroupHeader || /^#{1,3}\s+/.test(f.tema || "")) {
            if (curFutProy) futRowsHtml += flushFutProject();
            curFutProy = { f };
          } else {
            if (curFutProy) curFutTasks.push(f);
            else futRowsHtml += renderFilaFuturo(f);
          }
        });
        if (curFutProy) futRowsHtml += flushFutProject();

        const futurosHtml = `
          <div class="backlog-subpoints-list">
            ${futRowsHtml}
          </div>
          <div class="todos-add-actions">
            <button class="btn-add-inline" onclick="agregarFilaFuturoPara('${escapeHtml(m.nombre)}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Nueva iniciativa</span>
            </button>
            <button class="btn-add-inline btn-add-group" onclick="agregarNuevoGrupoFuturo('${escapeHtml(m.nombre)}')">
              <span style="font-weight:900;font-size:12px;color:#8B5CF6;">#</span>
              <span>Nuevo proyecto</span>
            </button>
          </div>
        `;

        html += `
          <div class="person-card" id="card_persona_${escapeHtml(m.nombre)}">
            <div class="person-banner">
              <div class="person-info"><div class="avatar-badge" style="background:${color};">${iniciales}</div><span class="person-name">${escapeHtml(m.nombre)}</span></div>
            </div>
            <div class="spine-section ${cSem ? 'is-collapsed' : ''}">
              <div class="spine-bar spine-semana" onclick="toggleColapsarSemana('${escapeHtml(m.nombre)}')"><span class="spine-text">${cSem ? 'SEM.' : 'SEMANAL'}</span></div>
              <div class="spine-body project-section-body">
                <div class="todos-interactive-box">
                  <div class="todos-toolbar" onclick="toggleColapsarSemana('${escapeHtml(m.nombre)}')">
                    <div class="todos-toolbar-title">Prioridades & Tareas de la Semana</div>
                    <div class="collapse-btn-indicator"><span>${cSem ? 'Desplegar' : 'Colapsar'}</span></div>
                  </div>
                  <div style="${cSem ? 'display:none;' : ''}">${todosHtml}</div>
                </div>
              </div>
            </div>
            <div class="spine-section ${cRec ? 'is-collapsed' : ''}">
              <div class="spine-bar spine-recurrente" onclick="toggleColapsarRecurrentes('${escapeHtml(m.nombre)}')"><span class="spine-text">${cRec ? 'REC.' : 'RECURRENTE'}</span></div>
              <div class="spine-body subpoints-block">
                <div class="subpoints-header-toggle" onclick="toggleColapsarRecurrentes('${escapeHtml(m.nombre)}')">
                  <div class="subpoints-label"><span class="sub-tree-icon">&#8627;</span><span>Scope & Tareas Recurrentes</span></div>
                  <div class="collapse-btn-indicator"><span>${cRec ? 'Desplegar' : 'Colapsar'}</span></div>
                </div>
                <div style="${cRec ? 'display:none;' : ''}">${recurrentesHtml}</div>
              </div>
            </div>
            <div class="spine-section ${cProx ? 'is-collapsed' : ''}">
              <div class="spine-bar spine-proxima" onclick="toggleColapsarProxima('${escapeHtml(m.nombre)}')"><span class="spine-text">${cProx ? 'PRÓX.' : 'PRÓXIMO'}</span></div>
              <div class="spine-body backlog-block">
                <div class="subpoints-header-toggle" onclick="toggleColapsarProxima('${escapeHtml(m.nombre)}')">
                  <div class="subpoints-label"><span class="sub-tree-icon">&#8627;</span><span>Próximas tareas y proyectos</span></div>
                  <div class="collapse-btn-indicator"><span>${cProx ? 'Desplegar' : 'Colapsar'}</span></div>
                </div>
                <div style="${cProx ? 'display:none;' : ''}">${futurosHtml}</div>
              </div>
            </div>
          </div>
        `;
      });
      contenedor.innerHTML = html;
      actualizarVisualSeleccion();
    }

    // =========================================================================
    // SELECCIÓN, COPIA Y DUPLICACIÓN DE TAREAS ESTILO NOTION
    // =========================================================================
    const SELECTED_TODOS = {
      owner: null,
      indices: new Set()
    };
    let LAST_CLICKED_INDEX = null;
    let APP_CLIPBOARD_TASKS = [];

    function seleccionarFilaTarea(owner, idx, isShift, isCtrl) {
      if (SELECTED_TODOS.owner !== owner) {
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        LAST_CLICKED_INDEX = null;
      }

      if (isShift && LAST_CLICKED_INDEX !== null) {
        const start = Math.min(LAST_CLICKED_INDEX, idx);
        const end = Math.max(LAST_CLICKED_INDEX, idx);
        SELECTED_TODOS.indices.clear();
        for (let i = start; i <= end; i++) {
          SELECTED_TODOS.indices.add(i);
        }
      } else if (isCtrl) {
        if (SELECTED_TODOS.indices.has(idx)) {
          SELECTED_TODOS.indices.delete(idx);
          if (SELECTED_TODOS.indices.size === 0) SELECTED_TODOS.owner = null;
        } else {
          SELECTED_TODOS.indices.add(idx);
        }
        LAST_CLICKED_INDEX = idx;
      } else {
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(idx);
        LAST_CLICKED_INDEX = idx;
      }

      actualizarVisualSeleccion();
    }

    function limpiarSeleccionTareas() {
      SELECTED_TODOS.owner = null;
      SELECTED_TODOS.indices.clear();
      LAST_CLICKED_INDEX = null;
      actualizarVisualSeleccion();
    }

    function actualizarVisualSeleccion() {
      document.querySelectorAll(".checklist-row.is-selected").forEach(r => r.classList.remove("is-selected"));

      if (SELECTED_TODOS.owner && SELECTED_TODOS.indices.size > 0) {
        SELECTED_TODOS.indices.forEach(idx => {
          const row = document.getElementById(`todo_row_${SELECTED_TODOS.owner}_${idx}`);
          if (row) row.classList.add("is-selected");
        });
      }

      const bar = document.getElementById("floatingTaskSelectionBar");
      const countEl = document.getElementById("floatingSelectionCount");
      if (bar) {
        const count = SELECTED_TODOS.indices.size;
        if (count > 0) {
          if (countEl) countEl.textContent = `${count} ${count === 1 ? 'tarea seleccionada' : 'tareas seleccionadas'}`;
          bar.style.display = "flex";
        } else {
          bar.style.display = "none";
        }
      }
    }

    function handleRowClick(e, owner, idx) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "A" || e.target.closest("button") || e.target.closest("a") || e.target.classList.contains("checklist-checkbox")) {
        return;
      }
      seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
    }

    function handleHandleClick(e, owner, idx) {
      e.stopPropagation();
      seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
    }

    function handleChecklistFocus(e, owner, idx) {
      if (SELECTED_TODOS.indices.size > 1 || SELECTED_TODOS.owner !== owner) {
        limpiarSeleccionTareas();
      }
      LAST_CLICKED_INDEX = idx;
    }

    let IS_MOUSE_DRAG_SELECTING = false;
    let MOUSE_DRAG_START_IDX = null;
    let MOUSE_DRAG_OWNER = null;

    function handleRowMouseDown(e, owner, idx) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON" || e.target.tagName === "A" || e.target.closest("button") || e.target.closest("a") || e.target.classList.contains("checklist-checkbox") || e.target.classList.contains("drag-handle")) {
        return;
      }
      if (e.button === 0) { // Clic primario
        IS_MOUSE_DRAG_SELECTING = true;
        MOUSE_DRAG_START_IDX = idx;
        MOUSE_DRAG_OWNER = owner;
        seleccionarFilaTarea(owner, idx, e.shiftKey, e.ctrlKey || e.metaKey);
      }
    }

    function handleRowMouseEnter(e, owner, idx) {
      if (IS_MOUSE_DRAG_SELECTING && (e.buttons === 1) && MOUSE_DRAG_OWNER === owner && MOUSE_DRAG_START_IDX !== null) {
        const start = Math.min(MOUSE_DRAG_START_IDX, idx);
        const end = Math.max(MOUSE_DRAG_START_IDX, idx);
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        for (let i = start; i <= end; i++) {
          SELECTED_TODOS.indices.add(i);
        }
        actualizarVisualSeleccion();
        window.getSelection()?.removeAllRanges();
      }
    }

    window.addEventListener("mouseup", () => {
      IS_MOUSE_DRAG_SELECTING = false;
    });

    function copiarTareasSeleccionadas(silencioso = false) {
      let owner = SELECTED_TODOS.owner;
      let indices = Array.from(SELECTED_TODOS.indices);

      if (!owner || !indices.length) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.classList.contains("checklist-input")) {
          const row = activeEl.closest(".checklist-row");
          owner = row?.getAttribute("data-owner");
          const idx = parseInt(row?.getAttribute("data-idx"), 10);
          if (owner && !isNaN(idx)) indices = [idx];
        }
      }

      if (!owner || !indices.length) return;

      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;

      const p = parsearTodos(it.todos || "");
      const sortedIndices = indices.sort((a, b) => a - b);
      APP_CLIPBOARD_TASKS = sortedIndices.map(idx => {
        const item = p.items[idx];
        if (!item) return null;
        return {
          text: item.text,
          isSubpoint: item.isSubpoint,
          checked: false,
          link: item.link ? { ...item.link } : null
        };
      }).filter(t => t && ((t.text || "").trim() || t.link));

      if (!APP_CLIPBOARD_TASKS.length) return;

      const mdText = APP_CLIPBOARD_TASKS.map(t => {
        const prefix = t.isSubpoint ? "  ↳ " : "";
        let line = `${prefix}- [ ] ${t.text}`;
        if (t.link?.url) line += ` [link:${t.link.url}|${t.link.label || 'Link'}]`;
        return line;
      }).join("\n");

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(mdText);
        }
      } catch (_) {}

      if (!silencioso) {
        notificar(`${APP_CLIPBOARD_TASKS.length} ${APP_CLIPBOARD_TASKS.length === 1 ? 'tarea copiada' : 'tareas copiadas'} (Ctrl+V para duplicar/pegar)`);
      }
    }

    function pegarTareas(targetOwner, targetIdx) {
      if (!APP_CLIPBOARD_TASKS || !APP_CLIPBOARD_TASKS.length) {
        notificar("No hay tareas copiadas. Seleccioná una o más y tocá Ctrl+C");
        return false;
      }

      const owner = targetOwner || SELECTED_TODOS.owner;
      if (!owner) {
        notificar("Seleccioná un integrante para pegar las tareas");
        return false;
      }

      let it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) {
        it = { id: "SEM-" + Date.now().toString(36).toUpperCase(), semana: STATE.semana, owner: owner, proyecto: "Iniciativa Principal", todos: "", estado: "En proceso" };
        STATE.semanal.push(it);
      }
      const p = parsearTodos(it.todos || "");

      let insertAt = (typeof targetIdx === "number" && !isNaN(targetIdx)) ? targetIdx : p.items.length;
      if (insertAt < 0) insertAt = 0;
      if (insertAt > p.items.length) insertAt = p.items.length;

      const clones = APP_CLIPBOARD_TASKS.map(t => ({
        text: t.text,
        checked: false,
        isSubpoint: t.isSubpoint,
        link: t.link ? { ...t.link } : null
      }));

      p.items.splice(insertAt, 0, ...clones);
      it.todos = serializarTodos(p.items, p.images);
      guardarCampoPersonaSemana(owner, "todos", it.todos);

      renderizarJerarquiaPersonas();

      SELECTED_TODOS.owner = owner;
      SELECTED_TODOS.indices.clear();
      for (let i = 0; i < clones.length; i++) {
        SELECTED_TODOS.indices.add(insertAt + i);
      }
      LAST_CLICKED_INDEX = insertAt + clones.length - 1;
      actualizarVisualSeleccion();

      notificar(`${clones.length} ${clones.length === 1 ? 'tarea duplicada/pegada' : 'tareas duplicadas/pegadas'}`);
      return true;
    }

    function duplicarTareasSeleccionadas() {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.classList.contains("checklist-input")) {
          const row = activeEl.closest(".checklist-row");
          const owner = row?.getAttribute("data-owner");
          const idx = parseInt(row?.getAttribute("data-idx"), 10);
          if (owner && !isNaN(idx)) {
            SELECTED_TODOS.owner = owner;
            SELECTED_TODOS.indices.clear();
            SELECTED_TODOS.indices.add(idx);
          }
        }
      }

      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;

      copiarTareasSeleccionadas(true);
      const maxIdx = Math.max(...SELECTED_TODOS.indices);
      pegarTareas(SELECTED_TODOS.owner, maxIdx + 1);
    }

    function eliminarTareasSeleccionadas() {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;
      const owner = SELECTED_TODOS.owner;
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;

      const count = SELECTED_TODOS.indices.size;
      const p = parsearTodos(it.todos || "");

      const accion = () => {
        const sortedDesc = Array.from(SELECTED_TODOS.indices).sort((a, b) => b - a);
        sortedDesc.forEach(idx => {
          if (idx >= 0 && idx < p.items.length) {
            p.items.splice(idx, 1);
          }
        });
        it.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(owner, "todos", it.todos);
        limpiarSeleccionTareas();
        renderizarJerarquiaPersonas();
        notificar(`${count} ${count === 1 ? 'tarea eliminada' : 'tareas eliminadas'}`);
      };

      if (count === 1) {
        accion();
      } else {
        confirmarEliminarInApp(
          `¿Eliminar ${count} tareas?`,
          `¿Estás seguro de eliminar las ${count} tareas seleccionadas de ${owner}?`,
          accion
        );
      }
    }

    function navegarSeleccionTareas(delta, isShift) {
      if (!SELECTED_TODOS.owner || !SELECTED_TODOS.indices.size) return;
      const owner = SELECTED_TODOS.owner;
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      const total = p.items.length;
      if (!total) return;

      const currentIdx = LAST_CLICKED_INDEX !== null ? LAST_CLICKED_INDEX : Math.max(...SELECTED_TODOS.indices);
      const targetIdx = Math.max(0, Math.min(total - 1, currentIdx + delta));

      if (isShift) {
        SELECTED_TODOS.indices.add(targetIdx);
        LAST_CLICKED_INDEX = targetIdx;
      } else {
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(targetIdx);
        LAST_CLICKED_INDEX = targetIdx;
      }
      actualizarVisualSeleccion();

      const row = document.getElementById(`todo_row_${owner}_${targetIdx}`);
      row?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    let _notionShortcutsInitialized = false;
    function setupNotionKeyboardShortcuts() {
      if (_notionShortcutsInitialized) return;
      _notionShortcutsInitialized = true;

      window.addEventListener("keydown", function(e) {
        // Modal de confirmación abierto: Enter confirma, Escape cancela
        const confirmOverlay = document.getElementById("modalConfirmOverlay");
        if (confirmOverlay && confirmOverlay.style.display !== "none") {
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            ejecutarConfirmacionInApp();
            return;
          }
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            cerrarModalConfirm();
            return;
          }
        }

        const isCtrlOrCmd = e.ctrlKey || e.metaKey;

        // Escape: clear selection
        if (e.key === "Escape") {
          if (SELECTED_TODOS.indices.size > 0) {
            e.preventDefault();
            limpiarSeleccionTareas();
            return;
          }
        }

        // Ctrl+C (Copy)
        if (isCtrlOrCmd && (e.key === "c" || e.key === "C")) {
          const selText = window.getSelection()?.toString();
          if (SELECTED_TODOS.indices.size > 0 && (!selText || selText.length === 0)) {
            e.preventDefault();
            copiarTareasSeleccionadas();
            return;
          }
        }

        // Ctrl+V (Paste)
        if (isCtrlOrCmd && (e.key === "v" || e.key === "V")) {
          const activeEl = document.activeElement;
          const isInsideInput = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

          if (SELECTED_TODOS.indices.size > 0 && (!isInsideInput || activeEl.classList.contains("checklist-input"))) {
            if (APP_CLIPBOARD_TASKS.length > 0) {
              e.preventDefault();
              const maxIdx = Math.max(...SELECTED_TODOS.indices);
              pegarTareas(SELECTED_TODOS.owner, maxIdx + 1);
              return;
            }
          }
        }

        // Ctrl+D (Duplicate)
        if (isCtrlOrCmd && (e.key === "d" || e.key === "D")) {
          if (SELECTED_TODOS.indices.size > 0 || document.activeElement?.classList.contains("checklist-input")) {
            e.preventDefault();
            duplicarTareasSeleccionadas();
            return;
          }
        }

        // Ctrl+A (Select all tasks for current owner)
        if (isCtrlOrCmd && (e.key === "a" || e.key === "A") && SELECTED_TODOS.owner && document.activeElement?.tagName !== "INPUT") {
          e.preventDefault();
          const it = STATE.semanal.find(s => s.owner === SELECTED_TODOS.owner && coincidenSemanasClient(s.semana, STATE.semana));
          if (it) {
            const p = parsearTodos(it.todos || "");
            SELECTED_TODOS.indices.clear();
            for (let i = 0; i < p.items.length; i++) {
              SELECTED_TODOS.indices.add(i);
            }
            actualizarVisualSeleccion();
            notificar(`${p.items.length} tareas seleccionadas`);
          }
          return;
        }

        // Delete / Backspace (Delete selected tasks)
        if ((e.key === "Delete" || e.key === "Backspace") && SELECTED_TODOS.indices.size > 0) {
          if (document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
            e.preventDefault();
            eliminarTareasSeleccionadas();
            return;
          }
        }

        // Enter (Focus input of selected task to edit)
        if (e.key === "Enter" && SELECTED_TODOS.indices.size === 1 && document.activeElement?.tagName !== "INPUT") {
          const idx = Array.from(SELECTED_TODOS.indices)[0];
          const row = document.getElementById(`todo_row_${SELECTED_TODOS.owner}_${idx}`);
          const inp = row?.querySelector(".checklist-input");
          if (inp) {
            e.preventDefault();
            inp.focus();
            const len = inp.value.length;
            inp.setSelectionRange(len, len);
            limpiarSeleccionTareas();
            return;
          }
        }

        // ArrowUp / ArrowDown navigation
        if (SELECTED_TODOS.indices.size > 0 && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
          if (document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") {
            e.preventDefault();
            navegarSeleccionTareas(e.key === "ArrowDown" ? 1 : -1, e.shiftKey);
            return;
          }
        }
      });

      // Clear selection on clicking outside
      document.addEventListener("click", function(e) {
        if (e.target.closest(".checklist-row") || e.target.closest("#floatingTaskSelectionBar") || e.target.closest(".modal-overlay") || e.target.closest(".control-bar")) {
          return;
        }
        if (SELECTED_TODOS.indices.size > 0) {
          limpiarSeleccionTareas();
        }
      });

      // External text paste handler into selected row
      window.addEventListener("paste", function(e) {
        const activeEl = document.activeElement;
        const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

        if (SELECTED_TODOS.indices.size > 0 && !isTyping) {
          const text = e.clipboardData?.getData("text/plain");
          if (text) {
            const parsed = parsearTodos(text);
            if (parsed.items && parsed.items.length) {
              e.preventDefault();
              APP_CLIPBOARD_TASKS = parsed.items;
              const maxIdx = Math.max(...SELECTED_TODOS.indices);
              pegarTareas(SELECTED_TODOS.owner, maxIdx + 1);
            }
          }
        }
      });
    }

    const _timers = {};
    function debounce(key, fn, delay = 600) {
      if (_timers[key]) clearTimeout(_timers[key]);
      _timers[key] = setTimeout(fn, delay);
    }

    function editarTextoItem(owner, idx, val) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (p.items[idx]) {
        if (/^#{1,3}\s+\S+/.test(val)) {
          const title = val.replace(/^#{1,3}\s+/, "").trim();
          p.items[idx] = { isGroupHeader: true, title: title };
          if (idx === p.items.length - 1 || p.items[idx + 1]?.isGroupHeader) {
            p.items.splice(idx + 1, 0, { text: "", checked: false, isSubpoint: false, link: null });
          }
          it.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(owner, "todos", it.todos);
          renderizarJerarquiaPersonas();
          setTimeout(() => {
            const nextRow = document.getElementById(`todo_row_${owner}_${idx + 1}`);
            nextRow?.querySelector(".checklist-input")?.focus();
          }, 40);
          return;
        }
        p.items[idx].text = val;
        it.todos = serializarTodos(p.items, p.images);
        debounce(`todo_${owner}`, () => guardarCampoPersonaSemana(owner, "todos", it.todos), 600);
      }
    }

    function handleChecklistKeydown(e, owner, idx, isSub) {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;

      if (e.key === "Escape") {
        e.preventDefault();
        e.target.blur();
        seleccionarFilaTarea(owner, idx, false, false);
        return;
      }

      if (isCtrlOrCmd && (e.key === "d" || e.key === "D")) {
        e.preventDefault();
        SELECTED_TODOS.owner = owner;
        SELECTED_TODOS.indices.clear();
        SELECTED_TODOS.indices.add(idx);
        copiarTareasSeleccionadas(true);
        pegarTareas(owner, idx + 1);
        return;
      }

      if (e.key === "Tab") {
        e.preventDefault();
        const nuevoEstado = !e.shiftKey; // Tab indenta a subtarea (↳), Shift+Tab desindenta
        toggleSubtareaItem(owner, idx, nuevoEstado);
      } else if (e.key === "Enter") {
        e.preventDefault();
        agregarCheckItemNuevo(owner, idx + 1, isSub);
      } else if (e.key === "Backspace" && e.target.value === "") {
        e.preventDefault();
        if (isSub) {
          toggleSubtareaItem(owner, idx, false);
        } else {
          eliminarCheckItem(owner, idx, true);
        }
      }
    }

    function toggleSubtareaItem(owner, idx, nuevoEstado) {
      const it = STATE.semanal.find(s => s.owner === owner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!it) return;
      const p = parsearTodos(it.todos || "");
      if (p.items[idx]) {
        p.items[idx].isSubpoint = typeof nuevoEstado === "boolean" ? nuevoEstado : !p.items[idx].isSubpoint;
        it.todos = serializarTodos(p.items, p.images);
        guardarCampoPersonaSemana(owner, "todos", it.todos);
        renderizarJerarquiaPersonas();
        setTimeout(() => {
          const inputs = document.querySelectorAll(`#checklist_box_${owner} .checklist-input`);
          if (inputs[idx]) {
            inputs[idx].focus();
            const len = inputs[idx].value.length;
            inputs[idx].setSelectionRange(len, len);
          }
        }, 30);
      }
    }

    function esRecurrenteSub(r) {
      if (!r) return false;
      return !!r.isSubpoint || /\[(?:sub|subtarea)\]/i.test(r.links || "") || /^\s*(?:↳|&#8627;|\u21B3)/.test(r.tarea || "");
    }

    function handleRecKeydown(e, owner, frec, id) {
      if (e.key === "Tab") {
        e.preventDefault();
        const r = STATE.recurrentes.find(x => x.id === id);
        if (r) {
          r.isSubpoint = !e.shiftKey;
          let lks = (r.links || "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
          if (r.isSubpoint) {
            lks = (lks ? lks + " " : "") + "[sub]";
          }
          r.links = lks;
          renderizarJerarquiaPersonas();
          setTimeout(() => {
            const row = document.querySelector(`[ondrop*="${id}"]`) || document.querySelector(`#sub_rec_${id}`);
            row?.querySelector(".checklist-input")?.focus();
          }, 30);
          callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (!e.target.value?.trim()) return;
        agregarRecurrenteConFrecuencia(owner, frec);
      } else if (e.key === "Backspace" && e.target.value === "") {
        e.preventDefault();
        const r = STATE.recurrentes.find(x => x.id === id);
        if (r && r.isSubpoint) {
          r.isSubpoint = false;
          r.links = (r.links || "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
          renderizarJerarquiaPersonas();
          callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
        } else {
          eliminarRecurrenteDirecto(id);
        }
      }
    }

    function confirmarEliminarInApp(titulo, mensaje, onConfirm) {
      _confirmCallback = onConfirm;
      const overlay = document.getElementById("modalConfirmOverlay");
      const titEl = document.getElementById("modalConfirmTitulo");
      const msgEl = document.getElementById("modalConfirmMensaje");
      if (titEl) titEl.textContent = titulo || "¿Eliminar tarea?";
      if (msgEl) msgEl.textContent = mensaje || "¿Estás seguro de que deseas eliminar este elemento?";
      if (overlay) {
        overlay.style.display = "flex";
        setTimeout(() => {
          document.getElementById("btnModalConfirmEjecutar")?.focus();
        }, 50);
      }

    function cerrarModalConfirm() {
      const overlay = document.getElementById("modalConfirmOverlay");
      if (overlay) overlay.style.display = "none";
      _confirmCallback = null;
    }
    function ejecutarConfirmacionInApp() {
      if (typeof _confirmCallback === "function") {
        const cb = _confirmCallback;
        cerrarModalConfirm();
        cb();
      } else {
        cerrarModalConfirm();
      }
    }
    function handleModalConfirmKeydown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        ejecutarConfirmacionInApp();

        e.preventDefault();
        e.stopPropagation();

    function toggleCheckRecurrente(id, chk) {
      const r = STATE.recurrentes.find(x => x.id === id);
      if (!r) return;
      const fLower = (r.frecuencia || "").toLowerCase();

      if (fLower.includes("diari")) {
        const hoyKey = obtenerFechaHoyKey();
        if (!r.checksDiarios) r.checksDiarios = {};
        r.checksDiarios[hoyKey] = chk;
      } else if (fLower.includes("mensual") || fLower.includes("cierre")) {
        const mesKey = obtenerMesActualKey();
        if (!r.checksMensuales) r.checksMensuales = {};
        r.checksMensuales[mesKey] = chk;
      } else {
        const semKey = STATE.semana || STATE.semanaActual;
        if (!r.semanasCompletadas) r.semanasCompletadas = {};
        r.semanasCompletadas[semKey] = chk;
      }

      r.estado = JSON.stringify({
        diarios: r.checksDiarios || {},
        semanas: r.semanasCompletadas || {},
        meses: r.checksMensuales || {}
      });

      persistirMemoriaLocal();
      renderizarJerarquiaPersonas();
      debounce(`rec_chk_${id}`, () => {
        callServer("actualizarCampoRecurrente", r.id, "estado", r.estado, r.owner, r.tarea);
      }, 400);
    }

    function editarTextoRecurrente(id, txt) {
      const r = STATE.recurrentes.find(x => x.id === id);
      if (!r || r.tarea === txt) return;

      r.isGroupHeader = /^\s*#{1,3}\s+/.test(txt);

      const tieneHistoricoPrevio = (r.semanasCompletadas && Object.keys(r.semanasCompletadas).length > 0) || (r.checksDiarios && Object.keys(r.checksDiarios).length > 0);
      if (tieneHistoricoPrevio && r.tarea) {
        if (!r.historialVersiones) r.historialVersiones = [];
        const ult = r.historialVersiones[r.historialVersiones.length - 1];
        if (!ult || ult.tarea !== r.tarea) {
          const semPrev = obtenerSemanaAnterior(STATE.semana) || STATE.semana;
          r.historialVersiones.push({ tarea: r.tarea, hastaSemana: semPrev, fecha: obtenerFechaHoyKey() });
        }
      }

      r.tarea = txt;
      r.desdeSemana = STATE.semana;
      r.estado = JSON.stringify({
        diarios: r.checksDiarios || {},
        semanas: r.semanasCompletadas || {},
        meses: r.checksMensuales || {},
        versiones: r.historialVersiones || []
      });

      debounce(`rec_${id}`, () => {
        callServer("actualizarCampoRecurrente", id, "tarea", txt, r.owner, txt);
        callServer("actualizarCampoRecurrente", id, "estado", r.estado, r.owner, txt);
      }, 600);
    }

    let _modalCtx = null;
    function abrirModalLink(ctx) {
      _modalCtx = ctx;
      const taskInput = document.getElementById("modalTaskName");
      if (taskInput) taskInput.value = ctx.taskName || "";
      document.getElementById("modalLinkUrl").value = ctx.initialUrl || "";
      document.getElementById("modalLinkLabel").value = ctx.initialLabel || "";

    function cerrarModalLink() { document.getElementById("modalLinkOverlay").style.display = "none"; _modalCtx = null; }

    function handleModalLinkKeydown(e) {
      if (e.key === "Enter") { e.preventDefault(); confirmarGuardarLink(); }
      else if (e.key === "Escape") { cerrarModalLink(); }
    }
    function autoDetectarNombreReporte(url) {
      const lbl = document.getElementById("modalLinkLabel");
      if (!lbl || lbl.value.trim() !== "" || !url) return;
      try {
        const u = new URL(url);
        if (u.hostname.includes("sheets") || u.hostname.includes("docs.google")) lbl.value = "Google Sheet";
        else if (u.hostname.includes("datahub")) lbl.value = "Data Hub";
        else if (u.hostname.includes("looker") || u.hostname.includes("datastudio")) lbl.value = "Looker Dashboard";
        else lbl.value = u.hostname.replace("www.", "");
      } catch (_) {}
    }

    function confirmarGuardarLink() {
      if (!_modalCtx) return;
      const taskName = (document.getElementById("modalTaskName")?.value || "").trim();
      const url = (document.getElementById("modalLinkUrl").value || "").trim();
      const label = (document.getElementById("modalLinkLabel").value || "").trim() || "Link";

      if (_modalCtx.type === "todo") {
        const it = STATE.semanal.find(s => s.owner === _modalCtx.owner && coincidenSemanasClient(s.semana, STATE.semana));
        if (it) {
          const p = parsearTodos(it.todos || "");
          if (p.items[_modalCtx.index]) {
            if (taskName) p.items[_modalCtx.index].text = taskName;
            if (url && /^https?:\/\//i.test(url)) {
              p.items[_modalCtx.index].link = { url, label };
            } else {
              p.items[_modalCtx.index].link = null; // Vacío por defecto si no se agrega URL
            }
            it.todos = serializarTodos(p.items, p.images);
            guardarCampoPersonaSemana(_modalCtx.owner, "todos", it.todos);
          }
        }
      } else if (_modalCtx.type === "rec") {
        const r = STATE.recurrentes.find(x => x.id === _modalCtx.id);
        if (r) {
          if (taskName && r.tarea !== taskName) {
            const tieneHistoricoPrevio = (r.semanasCompletadas && Object.keys(r.semanasCompletadas).length > 0) || (r.checksDiarios && Object.keys(r.checksDiarios).length > 0);
            if (tieneHistoricoPrevio && r.tarea) {
              if (!r.historialVersiones) r.historialVersiones = [];
              r.historialVersiones.push({ tarea: r.tarea, hastaSemana: STATE.semana, fecha: obtenerFechaHoyKey() });
            }
            r.tarea = taskName;
            r.desdeSemana = STATE.semana;
          }
          const autoTag = esRecurrenteAuto(r) ? "[auto]" : "";
          const subTag = esRecurrenteSub(r) ? "[sub]" : "";
          const tags = [autoTag, subTag].filter(Boolean).join(" ");
          if (url && /^https?:\/\//i.test(url)) {
            r.links = `[link:${url}|${label}]${tags ? ' ' + tags : ''}`;
          } else {
            r.links = tags; // Vacío por defecto (solo tags de metadata si existieran)
          }
          callServer("actualizarCampoRecurrente", r.id, "links", r.links, r.owner, r.tarea);
          r.estado = JSON.stringify({
            diarios: r.checksDiarios || {},
            semanas: r.semanasCompletadas || {},
            meses: r.checksMensuales || {},
            versiones: r.historialVersiones || []
          });
          callServer("actualizarCampoRecurrente", r.id, "tarea", r.tarea, r.owner, r.tarea);
          callServer("actualizarCampoRecurrente", r.id, "estado", r.estado, r.owner, r.tarea);
        }
      }
      cerrarModalLink();
      renderizarJerarquiaPersonas();
      notificar("Guardado correctamente");
    }

    function obtenerLinkData(raw) {
      if (!raw) return null;
      if (typeof raw === "object" && raw.url) {
        if (/^https?:\/\//i.test(raw.url)) return raw;
        return null;
      }
      const str = String(raw).trim().replace(/\[(?:auto|automatizado)\]/gi, "").replace(/\[(?:sub|subtarea)\]/gi, "").trim();
      if (!str) return null;
      const m = str.match(RGX_LINK_TAG);
      if (m && /^https?:\/\//i.test(m[1].trim())) return { url: m[1].trim(), label: m[2] || "Link" };
      if (/^https?:\/\//i.test(str)) return { url: str, label: "Link" };
      return null;
    }

    function handleTodoDragStart(e, owner, idx) {
      const isHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
      if (!isHandle && e.currentTarget.getAttribute("draggable") !== "true") {
        e.preventDefault();
        return false;
      }
      DRAG_ITEM = { type: 'todo', owner, idx };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
      e.currentTarget.classList.add("is-dragging");
    }
    function handleRecDragStart(e, owner, id) {
      const isHandle = e.target.classList.contains("drag-handle") || e.target.closest(".drag-handle");
      if (!isHandle && e.currentTarget.getAttribute("draggable") !== "true") {
        e.preventDefault();
        return false;
      }
      DRAG_ITEM = { type: 'rec', owner, id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
      e.currentTarget.classList.add("is-dragging");
    }
    function handleBolsaDragStart(e, id) {
      DRAG_ITEM = { type: 'bolsa', id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify(DRAG_ITEM));
    }

    let _dragIsSubpointTarget = false;
    let _dragDropPosition = "before";

    function handleRowDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const row = e.currentTarget;
      const rect = row.getBoundingClientRect();
      const relY = e.clientY - rect.top;
      const isBottom = relY > (rect.height / 2);
      const offsetX = e.clientX - rect.left;

      _dragIsSubpointTarget = (offsetX > 35);
      _dragDropPosition = isBottom ? "after" : "before";

      document.querySelectorAll(".checklist-row").forEach(r => {
        if (r !== row) r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      });

      row.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      if (_dragDropPosition === "after") {
        row.classList.add("drag-over-after");
      } else if (_dragIsSubpointTarget) {
        row.classList.add("drag-over-subpoint");
      } else {
        row.classList.add("drag-over");
      }
    }

    function handleRowDragLeave(e) {
      if (!e.currentTarget.contains(e.relatedTarget)) {
        e.currentTarget.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint");
      }
    }

    function handleRowDragEnd(e) {
      document.querySelectorAll(".checklist-row").forEach(r => {
        r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint", "is-dragging");
        r.setAttribute("draggable", "false");
      });
      DRAG_ITEM = null;
      _dragIsSubpointTarget = false;
      _dragDropPosition = "before";
    }

    function handleTodoDrop(e, targetOwner, targetIdx) {
      e.preventDefault();
      e.stopPropagation();
      document.querySelectorAll(".checklist-row").forEach(r => r.classList.remove("drag-over", "drag-over-after", "drag-over-subpoint", "is-dragging"));
      if (!DRAG_ITEM) return;
      const targetSem = STATE.semanal.find(s => s.owner === targetOwner && coincidenSemanasClient(s.semana, STATE.semana));
      if (!targetSem) { DRAG_ITEM = null; return; }
      const p = parsearTodos(targetSem.todos || "");

      let insertIdx = (_dragDropPosition === "after") ? targetIdx + 1 : targetIdx;

      if (DRAG_ITEM.type === "todo" && DRAG_ITEM.owner === targetOwner) {
        const itemOrigin = p.items[DRAG_ITEM.idx];
        if (DRAG_ITEM.idx < insertIdx) insertIdx--;
        if (DRAG_ITEM.idx === insertIdx && itemOrigin && itemOrigin.isSubpoint === _dragIsSubpointTarget) {
          DRAG_ITEM = null; return;
        }
        const moved = p.items.splice(DRAG_ITEM.idx, 1)[0];
        if (moved) {
          moved.isSubpoint = _dragIsSubpointTarget;
          p.items.splice(insertIdx, 0, moved);
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          notificar(moved.isSubpoint ? "Convertida en subtarea ↳" : "Orden de prioridades actualizado");
        }
      } else if (DRAG_ITEM.type === "rec") {
        const rec = STATE.recurrentes.find(r => r.id === DRAG_ITEM.id);
        if (rec) {
          p.items.splice(insertIdx, 0, { text: rec.tarea, checked: false, isSubpoint: _dragIsSubpointTarget, link: obtenerLinkData(rec.links) });
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          notificar("Tarea recurrente copiada a la semana");
        }
      } else if (DRAG_ITEM.type === "bolsa") {
        const b = STATE.bolsa.find(x => String(x.id) === String(DRAG_ITEM.id));
        if (b) {
          p.items.splice(insertIdx, 0, { text: b.titulo, checked: false, isSubpoint: _dragIsSubpointTarget, link: null });
          targetSem.todos = serializarTodos(p.items, p.images);
          guardarCampoPersonaSemana(targetOwner, "todos", targetSem.todos);
          callServer("asignarTareaBolsaAMiembro", b.id, targetOwner, false, STATE.semana);
          notificar("Tarea asignada a la semana");
        }
      }
      DRAG_ITEM = null;
      _dragIsSubpointTarget = false;
      _dragDropPosition = "before";
      renderizarJerarquiaPersonas();
    }
