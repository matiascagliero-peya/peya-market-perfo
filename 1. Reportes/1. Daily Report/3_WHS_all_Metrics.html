    <div class="date-badge" id="f-date-display">Cargando...</div>
  </div>
  <div class="fsep"></div>
  <div class="fg"><span class="fl">Buscar</span>
    <input class="fsrch" id="f-search" placeholder="Warehouse..." oninput="applyFilters()">
  </div>
  <div class="fg dropdown-container" style="position: relative; margin-left: 4px;">
    <button class="n-btn" id="btn-metrics-toggle" onclick="toggleMetricsDropdown(event)">
      <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      Columnas
    </button>
    <div class="metrics-dropdown" id="metrics-dropdown">
      <div class="dropdown-header" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span>Mostrar Columnas</span>
        <button class="restore-btn" onclick="restoreOriginalMetrics(event)" title="Restaurar orden y visibilidad original">Restaurar</button>
      </div>
      <div class="dropdown-list" id="metrics-checkboxes-list"></div>
    </div>
  </div>
  <div class="loading-pill" id="loading-pill">
    <div class="loading-pill-dot"></div>
    <span id="loading-label">Cargando...</span>
  </div>
  <span class="fcount" id="fcount"></span>
</div>

<div class="page">
  <div class="panel" id="matrix-panel">
    <div class="ph">
      <div class="ph-bar"></div>
      <span class="ph-title">Warehouses × Métricas</span>
      <div class="ph-meta">
        <span class="ph-sub" id="ph-date"></span>
        <span class="ph-count" id="ph-count"></span>
        <button class="copy-btn" onclick="copyTable()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Tabla</button>
      </div>
    </div>
    <div class="tw" id="table-wrap">
      <div style="padding:40px;text-align:center;color:var(--t3)">Cargando datos...</div>
    </div>
  </div>
</div>
<footer>PedidosYa Markets · WHS all Metrics</footer>

<script>
// ── Metric definitions ───────────────────────────────────────────
let METRICS = [
  {key:'orders',         label:'Orders',       shortLabel:'Orders',   fmt:'int', varFmt:'pct_rel', hi:true,  lwIsRatio:false, bg:'#fff0f3', tc:'#e50044', order:1},
  {key:'gmv',            label:'GMV (EUR)',     shortLabel:'GMV',      fmt:'eur', varFmt:'pct_rel', hi:true,  lwIsRatio:false, bg:'#eff6ff', tc:'#2563eb', order:2},
  {key:'new_users',      label:'New Users',     shortLabel:'New Users',fmt:'int', varFmt:'pct_rel', hi:true,  lwIsRatio:false, bg:'#fff7ed', tc:'#ea580c', order:3},
  {key:'wis',            label:'WIS %',         shortLabel:'WIS %',    fmt:'pct', varFmt:'pp',      hi:true,  lwIsRatio:true,  bg:'#f0f9ff', tc:'#0284c7', order:4},
  {key:'wis_uf',         label:'WIS UF %',      shortLabel:'WIS UF',   fmt:'pct', varFmt:'pp',      hi:true,  lwIsRatio:true,  bg:'#ecfeff', tc:'#0891b2', order:5},
  {key:'seamless',       label:'Seamless %',    shortLabel:'Seamless', fmt:'pct', varFmt:'pp',      hi:true,  lwIsRatio:true,  bg:'#f0fdf4', tc:'#16a34a', order:6},
  {key:'delivery_time',  label:'Delivery Time', shortLabel:'Deliv. T', fmt:'min', varFmt:'min_abs', hi:false, lwIsRatio:true,  bg:'#fffbeb', tc:'#d97706', order:7},
  {key:'assignment_time_orders_over_6min',label:'Assignment T > 6m',  shortLabel:'Assign > 6m',fmt:'pct', varFmt:'pp', hi:false, lwIsRatio:true,  bg:'#fdf2f8', tc:'#f43f5e', order:8},
  {key:'assignment_time',label:'Assignment T',  shortLabel:'Assign. T',fmt:'min', varFmt:'min_abs', hi:false, lwIsRatio:true,  bg:'#faf5ff', tc:'#9333ea', order:9},
  {key:'rejected_orders',label:'Rejected %',    shortLabel:'Rejected', fmt:'pct', varFmt:'pp',      hi:false, lwIsRatio:true,  bg:'#fff1f2', tc:'#dc2626', order:10},
  {key:'session_orders', label:'HC Sessions orders %', shortLabel:'HC Sess.', fmt:'pct', varFmt:'pp',      hi:false, lwIsRatio:true,  bg:'#f5f3ff', tc:'#7c3aed', order:11},
];
const ORIGINAL_METRICS_ORDER = [...METRICS]; // Guardar copia del orden original para poder restaurar
const SECONDARY = ['new_users','wis','wis_uf','seamless','delivery_time','assignment_time_orders_over_6min','assignment_time','rejected_orders','session_orders'];
const CCN={AR:'Argentina',BO:'Bolivia',CL:'Chile',CO:'Colombia',EC:'Ecuador',SV:'El Salvador',GT:'Guatemala',HN:'Honduras',NI:'Nicaragua',PA:'Panamá',PY:'Paraguay',PE:'Perú',UY:'Uruguay',DO:'Rep. Dominicana',MX:'México'};

let ALL_ROWS=[], FECHA=null, sortKey='orders', sortDir=-1; // sortDir: -1=desc, 1=asc
let visibleMetrics = new Set(METRICS.map(m => m.key)); // por defecto todas visibles
let metricsLoaded = new Set(['orders','gmv']);
let loadedCount = 2;

// ── Formatters ──────────────────────────────────────────────────
const fI=v=>{if(v==null||isNaN(v))return null;const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(2)+'M';if(a>=1e3)return(v/1e3).toFixed(1)+'k';return Math.round(v).toLocaleString('es-AR');};
const fE=v=>{if(v==null||isNaN(v))return null;const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(2)+'M €';if(a>=1e3)return(v/1e3).toFixed(1)+'k €';return Math.round(v)+'€';};
const fP=v=>v==null||isNaN(v)?null:v.toFixed(1)+'%';
const fM=v=>v==null||isNaN(v)?null:v.toFixed(1)+'m';
function fV(v,f){const r=f==='eur'?fE(v):f==='pct'?fP(v):f==='min'?fM(v):fI(v);return r!==null?r:'—';}
function calcVar(d1,d8,vf){
  if(d1==null||d8==null)return null;
  if(vf==='pp'||vf==='min_abs')return d1-d8;
  if(d8===0)return null;
  return((d1-d8)/Math.abs(d8))*100;
}
function badge(val,m){
  if(val===null||isNaN(val))return`<span class="nd">—</span>`;
  const u=m.varFmt==='pp'?'pp':m.varFmt==='min_abs'?'min':'%';
  const good=m.hi?val>0:val<0,bad=m.hi?val<0:val>0;
  const cls=good?'vb-pos':bad?'vb-neg':'vb-neu';
  const s=val>0?'+':'';
  const arr=val>0?`<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>`:val<0?`<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`:'';
  return`<span class="vb ${cls}">${arr}${s}${val.toFixed(1)}${u}</span>`;
}

function getVal(row, key, period){
  if(key==='orders'||key==='gmv') return row[key]?row[key][period]:null;
  return row[key]?row[key][period]:null;
}

function getDateLabels(){
  const d=FECHA?new Date(FECHA):new Date(), d8=new Date(d);
  d8.setDate(d.getDate()-7);
  const fmt=x=>x.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}).replace('.','');
  return{d1:fmt(d),d8:fmt(d8)};
}

function getFiltered(){
  const cc=document.getElementById('f-cc').value;
  const srch=(document.getElementById('f-search').value||'').toLowerCase();
  return ALL_ROWS.filter(r=>(!cc||r.country===cc)&&(!srch||r.warehouse_name.toLowerCase().includes(srch)));
}

function getSorted(rows){
  return [...rows].sort((a,b)=>{
    const va=getVal(a,sortKey,'d1'), vb=getVal(b,sortKey,'d1');
    if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1;
    return sortDir*(va-vb); // sortDir -1 = desc (higher first = Argentina at top)
  });
}

// ── Build full table HTML ────────────────────────────────────────
function buildTable(){
  const rows=getSorted(getFiltered());
  const dl=getDateLabels();

  document.getElementById('ph-date').textContent=`D-1: ${dl.d1} · D-8: ${dl.d8}`;
  document.getElementById('ph-count').textContent=`${rows.length} warehouses`;
  document.getElementById('fcount').textContent=`${rows.length} filas`;

  // ── Header row 1: metric groups ──
  let h1=`<th class="sticky sticky-1 grp" rowspan="2" style="text-align:left;background:var(--border2);color:var(--t2);font-size:9px">WAREHOUSE</th>`;
  h1+=`<th class="sticky sticky-2 grp" rowspan="2" style="background:var(--border2);color:var(--t2);font-size:9px;text-align:center">PAÍS</th>`;
  METRICS.forEach(m=>{
    const isSorted=sortKey===m.key;
    const arr=isSorted?(sortDir===-1?'↓':'↑'):'⇅';
    const isVisible=visibleMetrics.has(m.key);
    const colClass=`m-col m-col-${m.key}${isVisible?'':' collapsed'}`;
    h1+=`<th colspan="2" class="${colClass} grp${isSorted?' sorted':''}" onclick="setSort('${m.key}')" style="background:${m.bg};color:${m.tc};border-left:2px solid ${m.tc}20">
      ${m.shortLabel} <span class="sort-arr">${arr}</span>
    </th>`;
  });

  // ── Header row 2: D-1 / vs D-8 for each metric ──
  let h2=``;
  METRICS.forEach((m,i)=>{
    const isSorted=sortKey===m.key;
    const bg=isSorted?`background:${m.bg}`:'';   /* opaco: la sub-fila queda fija, evita transparentar el body */
    const varLabel=m.varFmt==='min_abs'?'Δmin':'vs D-8';
    const isVisible=visibleMetrics.has(m.key);
    const colClass=`m-col m-col-${m.key}${isVisible?'':' collapsed'}`;
    h2+=`<th class="${colClass} sub val-h" style="border-left:2px solid ${m.tc}20;${bg}">D-1</th>`;
    h2+=`<th class="${colClass} sub" style="${bg}">${varLabel}</th>`;
  });

  // ── Body rows ──
  const tbody=rows.map(row=>{
    let cells=`<td class="sticky sticky-1"><div class="wh-name">${row.warehouse_name}</div></td>`;
    cells+=`<td class="sticky sticky-2"><span class="cc-badge">${row.country}</span></td>`;

    METRICS.forEach((m,i)=>{
      const isLoaded=metricsLoaded.has(m.key);
      const d1=getVal(row,m.key,'d1');
      const d8=getVal(row,m.key,'d8');
      const isSorted=sortKey===m.key;
      const bg=isSorted?`background:${m.bg}30`:'';
      const sep=`border-left:2px solid ${m.tc}20`;
      const isVisible=visibleMetrics.has(m.key);
      const colClass=`m-col m-col-${m.key}${isVisible?'':' collapsed'}`;

      if(!isLoaded){
        cells+=`<td class="${colClass} grp-sep" id="c-${row.warehouse_id}-${m.key}-d1" style="${sep};${bg}"><span class="skel"></span></td>`;
        cells+=`<td class="${colClass}" id="c-${row.warehouse_id}-${m.key}-var" style="${bg}"><span class="skel"></span></td>`;
      } else {
        const varVal=calcVar(d1,d8,m.varFmt);
        cells+=`<td class="${colClass} grp-sep" id="c-${row.warehouse_id}-${m.key}-d1" style="${sep};${bg}"><span class="v">${fV(d1,m.fmt)}</span></td>`;
        cells+=`<td class="${colClass}" id="c-${row.warehouse_id}-${m.key}-var" style="${bg}">${badge(varVal,m)}</td>`;
      }
    });
    return`<tr>${cells}</tr>`;
  }).join('');

  document.getElementById('table-wrap').innerHTML=`<table class="mx">
    <thead>
      <tr class="grp">${h1}</tr>
      <tr class="sub">${h2}</tr>
    </thead>
    <tbody>${tbody}</tbody>
  </table>`;
  // La 2da fila de header (sub) se fija justo debajo de la 1ra (grp): medimos su alto real.
  const _tbl=document.querySelector('#table-wrap table.mx');
  const _grp=_tbl&&_tbl.querySelector('thead tr.grp');
  if(_grp) _tbl.style.setProperty('--grph', _grp.offsetHeight+'px');
}

// ── Update only cells for one metric (progressive load) ─────────
function updateMetricCells(key){
  const m=METRICS.find(x=>x.key===key); if(!m)return;
  const filtered=getFiltered();
  const isSorted=sortKey===key;
  const bg=isSorted?`background:${m.bg}30`:'';

  filtered.forEach(row=>{
    const d1=getVal(row,key,'d1');
    const d8=getVal(row,key,'d8');
    const varVal=calcVar(d1,d8,m.varFmt);

    const cellD1=document.getElementById(`c-${row.warehouse_id}-${key}-d1`);
    const cellVar=document.getElementById(`c-${row.warehouse_id}-${key}-var`);

    if(cellD1)cellD1.innerHTML=`<span class="v">${fV(d1,m.fmt)}</span>`;
    if(cellVar)cellVar.innerHTML=badge(varVal,m);
  });

  // Update header sort arrow if this is the sorted metric
  if(isSorted)buildTable(); // simple re-render for sort highlight
}

function setSort(key){
  if(sortKey===key){
    sortDir*=-1; // toggle asc/desc
  } else {
    sortKey=key;
    const m=METRICS.find(x=>x.key===key);
    sortDir=m?-1:-1; // default desc (higher first for hi, lower first for !hi handled by badge color)
  }
  buildTable();
}

function applyFilters(){buildTable();}

function setMetricProgress(idx,label,total){
  const pct=Math.round((idx/total)*100);
  document.getElementById('mp-bar').style.width=pct+'%';
  const pill=document.getElementById('loading-pill');
  if(idx<total){pill.classList.add('visible');document.getElementById('loading-label').textContent=label;}
  else{setTimeout(()=>{pill.classList.remove('visible');document.getElementById('mp-bar').style.width='0%';},600);}
}

function loadMetricsBatch(startIdx){
  const BATCH=3,total=SECONDARY.length;
  if(startIdx>=total){
    const mc={};
    ALL_ROWS.forEach(row=>{const rk=`${row.warehouse_id}||${row.country}`;mc[rk]={};SECONDARY.forEach(k=>{if(row[k])mc[rk][k]=row[k];});});
    cbmSetMetricsCache(mc);
    setMetricProgress(total,'',total);
    return;
  }
  const batch=SECONDARY.slice(startIdx,startIdx+BATCH);
  let done=0;
  const m0=METRICS.find(x=>x.key===batch[0]);
  setMetricProgress(startIdx,`Cargando ${m0?m0.shortLabel:batch[0]}...`,total);
  const next=()=>{if(++done===batch.length)loadMetricsBatch(startIdx+BATCH);};
  batch.forEach(key=>{
    google.script.run
      .withSuccessHandler(res=>{
        if(res&&!res.error&&res.data){
          metricsLoaded.add(key);
          ALL_ROWS.forEach(row=>{
            const rk=`${row.warehouse_id}||${row.country}`;
            const d=res.data[rk];
            if(d)row[key]={d1:d.d1,d8:d.d8,lw:d.lw};
          });
          if(sortKey===key){buildTable();}
          else{updateMetricCells(key);}
        }
        next();
      })
      .withFailureHandler(()=>next())
      .fetchMetric(key);
  });
}

function copyTable(){
  const tbl=document.querySelector('.mx'); if(!tbl)return;
  const rows=[];
  tbl.querySelectorAll('thead tr').forEach(tr=>{rows.push([...tr.querySelectorAll('th')].map(th=>th.innerText.replace(/\n/g,' ').trim()).join('\t'));});
  tbl.querySelectorAll('tbody tr').forEach(tr=>{rows.push([...tr.querySelectorAll('td')].map(td=>td.innerText.replace(/\n/g,' ').trim()).join('\t'));});
  navigator.clipboard.writeText(rows.join('\n')).then(()=>{
    const btn=document.querySelector('.copy-btn');if(btn){const orig=btn.innerHTML;btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-1px;margin-right:4px;"><polyline points="20 6 9 17 4 12"/></svg>Copiado';setTimeout(()=>btn.innerHTML=orig,2000);}
  });
}

// ── Caché local (30 min TTL) — carga instantánea en segunda visita ──
const CBM_LOCAL_KEY='peya_cbm_fast_v2',CBM_METRICS_KEY='peya_cbm_metrics_v1',CBM_TTL=30*60*1000;
function cbmGetCache(){try{const r=localStorage.getItem(CBM_LOCAL_KEY);if(!r)return null;const p=JSON.parse(r);if(Date.now()-p.ts>CBM_TTL){localStorage.removeItem(CBM_LOCAL_KEY);return null;}return p.data;}catch(e){return null;}}
function cbmSetCache(data){try{localStorage.setItem(CBM_LOCAL_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}
function cbmGetMetricsCache(){try{const r=localStorage.getItem(CBM_METRICS_KEY);if(!r)return null;const p=JSON.parse(r);if(Date.now()-p.ts>CBM_TTL){localStorage.removeItem(CBM_METRICS_KEY);return null;}return p.data;}catch(e){return null;}}
function cbmSetMetricsCache(data){try{localStorage.setItem(CBM_METRICS_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}

// Recargar EN EL LUGAR: location.reload() dentro del iframe de GAS puede fallar
// en silencio (la URL sandbox vence) y la página quedaba trabada — había que
// refrescar el navegador a mano. Ahora: limpiar cachés → re-traer el payload →
// re-inicializar la vista, con red de seguridad para que el splash siempre salga.
function cbmResetView(){
  metricsLoaded = new Set(['orders','gmv']);
  const ccS=document.getElementById('f-cc');
  // cbmInit APPENDEA los países: sin esto se duplicarían las opciones al refrescar.
  if(ccS){ while(ccS.options.length>1) ccS.remove(1); }
}
function doRefresh(){
  try{localStorage.removeItem(CBM_LOCAL_KEY);localStorage.removeItem(CBM_METRICS_KEY);}catch(e){}
  const sp=document.getElementById('splash'), note=document.getElementById('sp-note');
  if(sp) sp.classList.remove('out');
  if(note) note.textContent='Actualizando datos…';
  let done=false;
  const safety=setTimeout(()=>{ if(done)return; done=true;
    if(note) note.textContent='Tardó demasiado. Tocá Actualizar para reintentar.';
    if(sp) sp.classList.add('out');
  },90000);
  const fetchFresh=()=>{
    google.script.run
      .withSuccessHandler(res=>{
        if(done)return; done=true; clearTimeout(safety);
        if(!res||res.error||!res.payload){
          if(note) note.textContent='Sin datos. Tocá Actualizar para reintentar.';
          if(sp) sp.classList.add('out');
          return;
        }
        cbmSetCache(res.payload);
        cbmResetView();
        cbmInit(res.payload);   // re-renderiza y saca el splash en su finally
      })
      .withFailureHandler(e=>{
        if(done)return; done=true; clearTimeout(safety);
        if(note) note.textContent='Error de conexión. Tocá Actualizar para reintentar.';
        if(sp) sp.classList.add('out');
      })
      .fetchDataFast();
  };
  // Pase lo que pase con la limpieza del server, después SIEMPRE se re-traen los datos.
  google.script.run.withSuccessHandler(fetchFresh).withFailureHandler(fetchFresh).forceRefreshCache();
}

// ── Inicializa la página con el payload ya obtenido ──────────────
function cbmInit(payload){
  try {
    ALL_ROWS = payload.rows || [];
    FECHA    = payload.fechaReferencia;

    const formattedRefDate = FECHA ? new Date(FECHA).toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit', year: 'numeric'}) : '—';
    const dateDisplay = document.getElementById('f-date-display');
    if (dateDisplay) dateDisplay.textContent = formattedRefDate;

    const ccs = [...new Set(ALL_ROWS.map(r=>r.country))].sort();
    const ccS = document.getElementById('f-cc');
    ccs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=CCN[c]||c;ccS.appendChild(o);});

    document.getElementById('sp-note').textContent = 'Armando tabla...';
    buildTable();
    initMetricsDropdown();

    const mc=cbmGetMetricsCache();
    if(mc){
      ALL_ROWS.forEach(row=>{const rk=`${row.warehouse_id}||${row.country}`;if(mc[rk])SECONDARY.forEach(k=>{if(mc[rk][k]){row[k]=mc[rk][k];metricsLoaded.add(k);}});});
      buildTable();
      setMetricProgress(SECONDARY.length,'',SECONDARY.length);
    } else {
      setTimeout(()=>loadMetricsBatch(0), 150);
    }
  } catch(err) {
    console.error('CountryByMetric render error:', err);
    document.getElementById('sp-note').textContent = 'Error al renderizar. Recargá la página.';
  } finally {
    document.getElementById('splash').classList.add('out');
  }
}

// ── Drag and Drop y Lógica de Visibilidad de Columnas ────────────────
let dragSrcEl = null;

function handleDragStart(e) {
  dragSrcEl = this;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', this.getAttribute('data-key'));
  this.classList.add('dragging');
}

function handleDragOver(e) {
  if (e.preventDefault) {
    e.preventDefault();
  }
  e.dataTransfer.dropEffect = 'move';
  return false;
}

function handleDragEnter(e) {
  this.classList.add('over');
}

function handleDragLeave(e) {
  this.classList.remove('over');
}

function handleDrop(e) {
  if (e.stopPropagation) {
    e.stopPropagation();
  }
  const srcKey = e.dataTransfer.getData('text/plain') || (dragSrcEl && dragSrcEl.getAttribute('data-key'));
  const targetKey = this.getAttribute('data-key');
  
  if (srcKey && targetKey && srcKey !== targetKey) {
    const srcIdx = METRICS.findIndex(m => m.key === srcKey);
    const targetIdx = METRICS.findIndex(m => m.key === targetKey);
    
    if (srcIdx >= 0 && targetIdx >= 0) {
      // Reordenamos el array global de métricas METRICS
      const [moved] = METRICS.splice(srcIdx, 1);
      METRICS.splice(targetIdx, 0, moved);
      
      // Re-inicializamos el dropdown de checks y re-renderizamos la tabla
      initMetricsDropdown();
      buildTable();
    }
  }
  return false;
}

function handleDragEnd(e) {
  this.classList.remove('dragging');
  document.querySelectorAll('.dropdown-item').forEach(item => {
    item.classList.remove('over');
  });
}

function initMetricsDropdown() {
  const container = document.getElementById('metrics-checkboxes-list');
  if(!container) return;
  container.innerHTML = '';
  METRICS.forEach(m => {
    const item = document.createElement('div');
    item.className = 'dropdown-item';
    item.setAttribute('draggable', 'true');
    item.setAttribute('data-key', m.key);
    
    // Asignar manejadores de eventos Drag & Drop
    item.addEventListener('dragstart', handleDragStart, false);
    item.addEventListener('dragenter', handleDragEnter, false);
    item.addEventListener('dragover', handleDragOver, false);
    item.addEventListener('dragleave', handleDragLeave, false);
    item.addEventListener('drop', handleDrop, false);
    item.addEventListener('dragend', handleDragEnd, false);
    
    const isChecked = visibleMetrics.has(m.key);
    item.innerHTML = `
      <input type="checkbox" data-key="${m.key}" ${isChecked ? 'checked' : ''} onchange="onMetricCheckboxChange(this)" style="cursor: pointer; margin-right: 4px;">
      <span style="border-left: 3px solid ${m.tc}; padding-left: 6px; font-size: 11.5px; font-weight:600; flex: 1; pointer-events: none;">${m.label}</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:2.5;stroke-linecap:round;margin-left:auto;pointer-events:none;"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/></svg>
    `;
    container.appendChild(item);
  });
}

function onMetricCheckboxChange(checkbox) {
  const key = checkbox.getAttribute('data-key');
  const isChecked = checkbox.checked;
  
  if (isChecked) {
    visibleMetrics.add(key);
  } else {
    if (visibleMetrics.size <= 1) {
      checkbox.checked = true;
      alert('Debes mantener al menos una columna de métrica visible.');
      return;
    }
    visibleMetrics.delete(key);
  }
  
  toggleMetricColumn(key, isChecked);
}

function toggleMetricColumn(key, isVisible) {
  const cells = document.querySelectorAll(`.m-col-${key}`);
  cells.forEach(c => {
    c.classList.toggle('collapsed', !isVisible);
  });
}

function restoreOriginalMetrics(e) {
  if (e) e.stopPropagation(); // Evita que se cierre el dropdown
  
  // Restaurar el array METRICS a su orden original
  METRICS = [...ORIGINAL_METRICS_ORDER];
  
  // Restaurar todas las columnas como visibles
  visibleMetrics = new Set(METRICS.map(m => m.key));
  
  // Re-inicializar el dropdown de checks y re-renderizar la tabla
  initMetricsDropdown();
  buildTable();
}

function toggleMetricsDropdown(e) {
  if (e) e.stopPropagation();
  const dropdown = document.getElementById('metrics-dropdown');
  if (dropdown) dropdown.classList.toggle('show');
}

window.addEventListener('click', function(e) {
  const dropdown = document.getElementById('metrics-dropdown');
  const toggleBtn = document.getElementById('btn-metrics-toggle');
  if (dropdown && dropdown.classList.contains('show') && !dropdown.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {
    dropdown.classList.remove('show');
  }
});

window.addEventListener('load',()=>{
  // Timeout de seguridad: si en 20 s no cargó nada, quita el splash igual
  const safetyTimer = setTimeout(()=>{
    document.getElementById('sp-note').textContent = 'Tiempo de espera agotado. Recargá la página.';
    document.getElementById('splash').classList.add('out');
  }, 20000);

  // Intento con caché local primero (instantáneo)
  const cached = cbmGetCache();
  if(cached){
    clearTimeout(safetyTimer);
    cbmInit(cached);
    return;
  }

  document.getElementById('sp-note').textContent = 'Conectando con el spreadsheet...';
  google.script.run
    .withSuccessHandler(res=>{
      clearTimeout(safetyTimer);
      if(!res || res.error || !res.payload){
        document.getElementById('sp-note').textContent = 'Sin datos disponibles. Recargá la página.';
        document.getElementById('splash').classList.add('out');
        return;
      }
      cbmSetCache(res.payload);
      cbmInit(res.payload);
    })
    .withFailureHandler(e=>{
      clearTimeout(safetyTimer);
      console.warn('fetchDataFast error:', e?.message||e);
      document.getElementById('sp-note').textContent = 'Error de conexión. Recargá la página.';
      document.getElementById('splash').classList.add('out');
    })
    .fetchDataFast();
});
</script>
</body>
</html>
