  {key:'wis',            label:'WIS %',               fmt:'pct', varFmt:'pp',      hi:true,  color:'#0284c7', lwIsRatio:true},
  {key:'wis_uf',         label:'WIS UF %',            fmt:'pct', varFmt:'pp',      hi:true,  color:'#0891b2', lwIsRatio:true},
  {key:'seamless',       label:'Seamless Delivery %', fmt:'pct', varFmt:'pp',      hi:true,  color:'#16a34a', lwIsRatio:true},
  {key:'delivery_time',  label:'AVG Delivery Time',   fmt:'min', varFmt:'min_abs', hi:false, color:'#d97706', lwIsRatio:true},
  {key:'assignment_time_orders_over_6min',label:'Assignment Time > 6 min %', fmt:'pct', varFmt:'pp',      hi:false, color:'#f43f5e', lwIsRatio:true},
  {key:'assignment_time',label:'Assignment Time',     fmt:'min', varFmt:'min_abs', hi:false, color:'#9333ea', lwIsRatio:true},
  {key:'rejected_orders',label:'Rejected Orders %',   fmt:'pct', varFmt:'pp',      hi:false, color:'#dc2626', lwIsRatio:true},
  {key:'session_orders', label:'HC Sessions orders %', fmt:'pct', varFmt:'pp',      hi:false, color:'#7c3aed', lwIsRatio:true},
];
const SECONDARY_METRICS = ['new_users','wis','wis_uf','seamless','delivery_time','assignment_time_orders_over_6min','assignment_time','rejected_orders','session_orders'];
const CCN={AR:'Argentina',BO:'Bolivia',CL:'Chile',CO:'Colombia',EC:'Ecuador',SV:'El Salvador',GT:'Guatemala',HN:'Honduras',NI:'Nicaragua',PA:'Panamá',PY:'Paraguay',PE:'Perú',UY:'Uruguay',DO:'Rep. Dominicana',MX:'México'};

let ALL_ROWS=[], FECHA=null, sortDir='best', sortCol='d1', sortAsc=false;
let metricsLoaded = new Set(['orders','gmv']);

// Formatters
const fI=v=>{if(v==null||isNaN(v))return'—';const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(2)+'M';if(a>=1e3)return(v/1e3).toFixed(1)+'k';return Math.round(v).toLocaleString('es-AR');};
const fE=v=>{if(v==null||isNaN(v))return'—';const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(2)+'M €';if(a>=1e3)return(v/1e3).toFixed(1)+'k €';return v.toFixed(0)+' €';};
const fP=v=>v==null||isNaN(v)?'—':v.toFixed(1)+'%';
const fM=v=>v==null||isNaN(v)?'—':v.toFixed(1)+' min';
const fV=(v,f)=>f==='eur'?fE(v):f==='pct'?fP(v):f==='min'?fM(v):fI(v);
const nd=()=>'<span class="nd">—</span>';
const sk=()=>'<span class="skel"></span>';

function calcVar(d1,ref,vf){if(d1==null||ref==null)return null;if(vf==='pp'||vf==='min_abs')return d1-ref;if(ref===0)return null;return((d1-ref)/Math.abs(ref))*100;}
function badge(val,m){
  if(val===null||isNaN(val))return nd();
  const s=val>0?'+':'',good=m.hi?val>0:val<0,bad=m.hi?val<0:val>0;
  const cls=good?'vb-pos':bad?'vb-neg':'vb-neu';
  const u=m.varFmt==='pp'?'pp':m.varFmt==='min_abs'?' min':'%';
  const arr=val>0?`<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>`:val<0?`<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`:'';
  return`<span class="vb ${cls}">${arr}${s}${val.toFixed(1)}${u}</span>`;
}

function getDateLabels(){
  const d=FECHA?new Date(FECHA):new Date(), d8=new Date(d);
  d8.setDate(d.getDate()-7);
  const fmt=x=>x.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}).replace('.','');
  return{d1:fmt(d),d8:fmt(d8)};
}

function getFiltered(){
  const cc=document.getElementById('f-cc').value;
  const srch=(document.getElementById('f-search').value||'').toLowerCase();
  return ALL_ROWS.filter(r=>(!cc||r.country===cc)&&(!srch||r.warehouse_name.toLowerCase().includes(srch)));
}

function getMetricVal(row, mKey, period){
  if(mKey==='orders'||mKey==='gmv'){return row[mKey]?row[mKey][period]:null;}
  if(row[mKey]&&row[mKey][period]!=null)return row[mKey][period];
  return null;
}

function getSortedRows(rows, m){
  const list=[...rows];
  if(sortDir==='orders'){
    list.sort((a,b)=>(getMetricVal(b,'orders','d1')||0)-(getMetricVal(a,'orders','d1')||0));
  } else {
    list.sort((a,b)=>{
      let va=null, vb=null;
      if(sortCol==='d1'){
        va=getMetricVal(a,m.key,'d1');
        vb=getMetricVal(b,m.key,'d1');
      } else if(sortCol==='d8'){
        va=getMetricVal(a,m.key,'d8');
        vb=getMetricVal(b,m.key,'d8');
      } else if(sortCol==='var_d8'){
        va=calcVar(getMetricVal(a,m.key,'d1'),getMetricVal(a,m.key,'d8'),m.varFmt);
        vb=calcVar(getMetricVal(b,m.key,'d1'),getMetricVal(b,m.key,'d8'),m.varFmt);
      } else if(sortCol==='var_lw'){
        const la=getMetricVal(a,m.key,'lw'), lb=getMetricVal(b,m.key,'lw');
        va=calcVar(getMetricVal(a,m.key,'d1'),m.lwIsRatio?la:la/3,m.varFmt);
        vb=calcVar(getMetricVal(b,m.key,'d1'),m.lwIsRatio?lb:lb/3,m.varFmt);
      }
      if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1;
      return sortAsc ? va-vb : vb-va;
    });
  }
  return list;
}

function renderTable(){
  const metKey=document.getElementById('f-metric').value||'orders';
  const m=METRICS.find(x=>x.key===metKey)||METRICS[0];
  const filtered=getFiltered();
  const sorted=getSortedRows(filtered, m);
  const dl=getDateLabels();
  const isLoaded=metricsLoaded.has(m.key);
  const u=m.varFmt==='pp'?'pp':m.varFmt==='min_abs'?' min':'%';

  document.getElementById('fcount').textContent=`${sorted.length} warehouses`;

  const tbody=sorted.map(row=>{
    const d1=getMetricVal(row,m.key,'d1');
    const d8=getMetricVal(row,m.key,'d8');
    const lw=getMetricVal(row,m.key,'lw');
    const varD8=isLoaded&&d1!=null&&d8!=null?badge(calcVar(d1,d8,m.varFmt),m):sk();
    const varLW=isLoaded&&d1!=null&&lw!=null?badge(calcVar(d1,m.lwIsRatio?lw:lw/3,m.varFmt),m):sk();
    return`<tr>
      <td><div class="wh-name">${row.warehouse_name}</div><div class="wh-cc">${CCN[row.country]||row.country}</div></td>
      <td><span class="v">${isLoaded?fV(d1,m.fmt):sk()}</span></td>
      <td><span class="v8">${isLoaded?fV(d8,m.fmt):sk()}</span></td>
      <td>${varD8}</td>
      <td>${varLW}</td>
    </tr>`;
  }).join('');

  const main=document.getElementById('main');
  main.innerHTML=`<div class="panel" id="whs-panel">
    <div class="ph">
      <div class="ph-bar" style="background:${m.color}"></div>
      <span class="ph-title">${m.label} — por Warehouse</span>
      <div class="ph-meta">
        <span class="ph-date">D-1: ${dl.d1} · D-8: ${dl.d8}</span>
        <span class="ph-count">${sorted.length} tiendas</span>
        <button class="copy-btn" onclick="copyTable()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Tabla</button>
      </div>
    </div>
    <div class="tw"><table>
      <thead><tr>
        <th style="text-align:left;cursor:default">WAREHOUSE</th>
        <th onclick="setSortCol('d1')" class="${sortDir!=='orders'&&sortCol==='d1'?(sortAsc?'sort-asc':'sort-desc'):''}">${dl.d1}</th>
        <th onclick="setSortCol('d8')" class="${sortDir!=='orders'&&sortCol==='d8'?(sortAsc?'sort-asc':'sort-desc'):''}">${dl.d8}</th>
        <th onclick="setSortCol('var_d8')" class="${sortDir!=='orders'&&sortCol==='var_d8'?(sortAsc?'sort-asc':'sort-desc'):''}">VAR D-8 <span style="font-size:7.5px;font-weight:400;color:#cbd5e1">${u}</span></th>
        <th onclick="setSortCol('var_lw')" class="${sortDir!=='orders'&&sortCol==='var_lw'?(sortAsc?'sort-asc':'sort-desc'):''}">VAR L3W <span style="font-size:7.5px;font-weight:400;color:#cbd5e1">${u}</span></th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table></div>
  </div>`;
}

function applyFilters(){renderTable();}

function setSort(dir){
  sortDir=dir;
  ['best','worst','orders'].forEach(x=>document.getElementById('st-'+x).classList.toggle('active',x===dir));
  if (dir === 'best') {
    sortCol = 'd1';
    sortAsc = false;
  } else if (dir === 'worst') {
    sortCol = 'd1';
    sortAsc = true;
  }
  renderTable();
}

function setSortCol(col){
  sortDir = 'column';
  ['best','worst','orders'].forEach(x=>document.getElementById('st-'+x).classList.remove('active'));
  if (sortCol === col) {
    sortAsc = !sortAsc;
  } else {
    sortCol = col;
    sortAsc = false;
  }
  renderTable();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(()=>t.className='toast',2500);}

function copyTable(){
  const table=document.querySelector('#whs-panel table');
  if(!table)return;
  const rows=[...[...table.querySelectorAll('thead tr')].map(r=>[...r.querySelectorAll('th')].map(c=>c.innerText.replace(/\n/g,' ').trim()).join('\t')),...[...table.querySelectorAll('tbody tr')].map(r=>[...r.querySelectorAll('td')].map(c=>c.innerText.replace(/\n/g,' ').trim()).join('\t'))];
  navigator.clipboard.writeText(rows.join('\n')).then(()=>showToast('Tabla copiada')).catch(()=>showToast('Error'));
}

function setMetricProgress(pct){document.getElementById('mp-bar').style.width=pct+'%';}

function loadMetricsBatch(startIdx){
  const BATCH=3,total=SECONDARY_METRICS.length;
  if(startIdx>=total){
    const mc={};
    ALL_ROWS.forEach(row=>{const rk=`${row.warehouse_id}||${row.country}`;mc[rk]={};SECONDARY_METRICS.forEach(k=>{if(row[k])mc[rk][k]=row[k];});});
    whsSetMetricsCache(mc);
    setTimeout(()=>setMetricProgress(0),500);
    return;
  }
  const batch=SECONDARY_METRICS.slice(startIdx,startIdx+BATCH);
  let done=0;
  setMetricProgress(Math.round(((startIdx+1)/total)*100));
  const next=()=>{if(++done===batch.length)loadMetricsBatch(startIdx+BATCH);};
  batch.forEach(key=>{
    google.script.run
      .withSuccessHandler(res=>{
        try{
          if(res&&!res.error&&res.data){
            metricsLoaded.add(key);
            ALL_ROWS.forEach(row=>{
              const rk=`${row.warehouse_id}||${row.country}`;
              const d=res.data[rk];
              if(d)row[key]={d1:d.d1,d8:d.d8,lw:d.lw,_raw:d._raw};
            });
            const cur=document.getElementById('f-metric')?.value||'orders';
            if(cur===key)renderTable();
          }
        }catch(e){console.warn('metric update error:',key,e);}
        next();
      })
      .withFailureHandler(()=>next())
      .fetchMetric(key);
  });
}

// ── Caché local (30 min TTL) — carga instantánea en segunda visita ──
const WHS_LOCAL_KEY='peya_whs_fast_v2',WHS_METRICS_KEY='peya_whs_metrics_v1',WHS_TTL=30*60*1000;
function whsGetCache(){try{const r=localStorage.getItem(WHS_LOCAL_KEY);if(!r)return null;const p=JSON.parse(r);if(Date.now()-p.ts>WHS_TTL){localStorage.removeItem(WHS_LOCAL_KEY);return null;}return p.data;}catch(e){return null;}}
function whsSetCache(data){try{localStorage.setItem(WHS_LOCAL_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}
function whsGetMetricsCache(){try{const r=localStorage.getItem(WHS_METRICS_KEY);if(!r)return null;const p=JSON.parse(r);if(Date.now()-p.ts>WHS_TTL){localStorage.removeItem(WHS_METRICS_KEY);return null;}return p.data;}catch(e){return null;}}
function whsSetMetricsCache(data){try{localStorage.setItem(WHS_METRICS_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}

// Recargar EN EL LUGAR: location.reload() dentro del iframe de GAS puede fallar
// en silencio (la URL sandbox vence) y la página quedaba trabada — había que
// refrescar el navegador a mano. Ahora: limpiar cachés → re-traer el payload →
// re-inicializar la vista, con red de seguridad para que el splash siempre salga.
function whsResetView(){
  metricsLoaded = new Set(['orders','gmv']);
  const ccS=document.getElementById('f-cc');
  // whsInit APPENDEA los países: sin esto se duplicarían las opciones al refrescar.
  if(ccS){ while(ccS.options.length>1) ccS.remove(1); }
}
function doRefresh(){
  try{localStorage.removeItem(WHS_LOCAL_KEY);localStorage.removeItem(WHS_METRICS_KEY);}catch(e){}
  const sp=document.getElementById('splash'), note=document.getElementById('sp-note');
  if(sp) sp.classList.remove('out');
  if(note) note.textContent='Actualizando datos…';
  let done=false;
  const safety=setTimeout(()=>{ if(done)return; done=true;
    if(note) note.textContent='Tardó demasiado. Tocá Actualizar para reintentar.';
    if(sp) sp.classList.add('out');
  },90000);
  const fetchFresh=()=>{
    google.script.run
      .withSuccessHandler(res=>{
        if(done)return; done=true; clearTimeout(safety);
        if(!res||res.error||!res.payload){
          if(note) note.textContent='Sin datos. Tocá Actualizar para reintentar.';
          if(sp) sp.classList.add('out');
          return;
        }
        whsSetCache(res.payload);
        whsResetView();
        whsInit(res.payload);   // re-renderiza y saca el splash en su finally
      })
      .withFailureHandler(e=>{
        if(done)return; done=true; clearTimeout(safety);
        if(note) note.textContent='Error de conexión. Tocá Actualizar para reintentar.';
        if(sp) sp.classList.add('out');
      })
      .fetchDataFast();
  };
  // Pase lo que pase con la limpieza del server, después SIEMPRE se re-traen los datos.
  google.script.run.withSuccessHandler(fetchFresh).withFailureHandler(fetchFresh).forceRefreshCache();
}

// ── Inicializa la página con el payload ya obtenido ──────────────
function whsInit(payload){
  try {
    ALL_ROWS = payload.rows || [];
    FECHA    = payload.fechaReferencia;

    const ccs = [...new Set(ALL_ROWS.map(r=>r.country))].sort();
    const ccS = document.getElementById('f-cc');
    ccs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=CCN[c]||c;ccS.appendChild(o);});

    renderTable();
    const mc=whsGetMetricsCache();
    if(mc){
      ALL_ROWS.forEach(row=>{const rk=`${row.warehouse_id}||${row.country}`;if(mc[rk])SECONDARY_METRICS.forEach(k=>{if(mc[rk][k]){row[k]=mc[rk][k];metricsLoaded.add(k);}});});
      renderTable();
      setTimeout(()=>setMetricProgress(0),100);
    } else {
      setTimeout(()=>loadMetricsBatch(0), 200);
      setTimeout(()=>setMetricProgress(0), 90000);
    }
  } catch(err) {
    console.error('WHSByDate render error:', err);
    document.getElementById('sp-note').textContent = 'Error al renderizar. Recargá la página.';
  } finally {
    document.getElementById('splash').classList.add('out');
  }
}

window.addEventListener('load',()=>{
  // Llena el selector de métricas
  const ms = document.getElementById('f-metric');
  METRICS.forEach(m=>{const o=document.createElement('option');o.value=m.key;o.textContent=m.label;ms.appendChild(o);});

  // Timeout de seguridad: si en 20 s no cargó nada, quita el splash igual
  const safetyTimer = setTimeout(()=>{
    document.getElementById('sp-note').textContent = 'Tiempo de espera agotado. Recargá la página.';
    document.getElementById('splash').classList.add('out');
  }, 20000);

  // Intento con caché local primero (instantáneo)
  const cached = whsGetCache();
  if(cached){
    clearTimeout(safetyTimer);
    whsInit(cached);
    return;
  }

  document.getElementById('sp-note').textContent = 'Conectando con el spreadsheet...';
  google.script.run
    .withSuccessHandler(res=>{
      clearTimeout(safetyTimer);
      if(!res || res.error || !res.payload){
        document.getElementById('sp-note').textContent = 'Sin datos disponibles. Recargá la página.';
        document.getElementById('splash').classList.add('out');
        return;
      }
      whsSetCache(res.payload);
      whsInit(res.payload);
    })
    .withFailureHandler(e=>{
      clearTimeout(safetyTimer);
      console.warn('fetchDataFast error:', e?.message||e);
      document.getElementById('sp-note').textContent = 'Error de conexión. Recargá la página.';
      document.getElementById('splash').classList.add('out');
    })
    .fetchDataFast();
});
</script>
