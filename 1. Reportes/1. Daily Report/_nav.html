     createTemplateFromFile); en preview local server.ps1 hace la misma sustitución.

<style>
  /* Pestaña activa — estilo unificado para todas las páginas: píldora roja
     con punto indicador, para ver claramente en qué sección estás. */
  #n-tabs .n-tab.active{
    background:#e50044 !important; color:#fff !important; font-weight:700 !important;
    box-shadow:0 2px 6px rgba(229,0,68,.30) !important; position:relative;
  }
  #n-tabs .n-tab.active svg{ stroke:#fff !important; }
  #n-tabs .n-tab.active::before{
    content:''; width:5px; height:5px; border-radius:50%; background:#fff;
    display:inline-block; margin-right:1px; flex-shrink:0;
  }
  #n-tabs .n-tab.active:hover{ background:#cf003d !important; color:#fff !important; }

  /* Muchas pestañas (incluye Email/Analytics/RR Compare en admin):
     TODO en UNA sola línea, nunca se parte en dos filas. Si no entra a lo ancho,
     scrollea horizontal con la barra oculta y la pestaña activa se centra sola
     (ver JS al final). */
  #n-tabs{ flex-wrap:nowrap !important; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -ms-overflow-style:none; }
  #n-tabs::-webkit-scrollbar{ height:0; display:none; }
  #n-tabs .n-divider{ margin:0 4px !important; height:15px; }   /* separadores más finitos */
  #n-tabs .n-tab{ padding:5px 7px !important; gap:4px !important; font-size:11.5px !important; }
  #n-tabs .n-tab svg{ width:12px; height:12px; }

  /* Pestaña destacada de WHS Alert (más llamativa pero sutil) */
  #n-tabs .n-tab-alert {
    background: #fff1f2 !important;
    color: #e50044 !important;
    border: 1px solid rgba(229,0,68,.25) !important;
    font-weight: 700 !important;
    box-shadow: 0 1px 3px rgba(229,0,68,.05) !important;
  }
  #n-tabs .n-tab-alert:hover {
    background: #ffe4e6 !important;
    border-color: rgba(229,0,68,.45) !important;
    box-shadow: 0 2px 5px rgba(229,0,68,.1) !important;
  }
  #n-tabs .n-tab-alert svg {
    stroke: #e50044 !important;
  }

  /* ── Menú hamburguesa (solo mobile) ──────────────────────────────
     Desktop: marca "PeYa Markets", tabs en línea, botón Actualizar a la derecha.
     Mobile (≤820px): a la izquierda el logo "Daily Report"; a la derecha la
     hamburguesa; las tabs + "Actualizar" se muestran dentro del desplegable. */
  .n-tab-refresh{ display:none !important; }         /* "Actualizar" del desplegable: solo mobile */
  #n-burger{ display:none; align-items:center; justify-content:center; width:38px; height:32px;
    border:1px solid #e2e8f0; background:#fff; border-radius:7px; cursor:pointer; flex-shrink:0; }
  #n-burger svg{ width:18px; height:18px; stroke:#0f172a; fill:none; stroke-width:2; stroke-linecap:round; }
  #n-burger:hover{ background:#f8fafc; }
  @media(max-width:820px){
    nav .n-divider{ display:none !important; }       /* sin separadores en mobile */
    nav .n-right{ display:none !important; }         /* el Actualizar de desktop se oculta */
    #n-burger{ display:flex; margin-left:auto; }     /* hamburguesa pegada a la derecha */
    #n-tabs{
      position:absolute !important; top:100%; left:0; right:0;
      flex-direction:column !important; align-items:stretch !important; flex:none !important;
      gap:2px; background:#fff; border-bottom:1px solid #e2e8f0;
      box-shadow:0 10px 22px rgba(0,0,0,.12); padding:8px !important;
      max-height:0; opacity:0; pointer-events:none; overflow:hidden !important;
      transition:max-height .22s ease, opacity .18s ease; z-index:400;
    }
    nav.menu-open #n-tabs{ max-height:82vh; opacity:1; pointer-events:auto; overflow-y:auto !important; }
    #n-tabs .n-tab{ width:100%; padding:12px 14px; font-size:14px; border-radius:8px; justify-content:flex-start; }
    #n-tabs .n-tab svg{ width:17px; height:17px; }
    #n-tabs .n-tab-refresh{ display:flex !important; font-weight:600; margin-top:4px;
      border-top:1px solid #f1f5f9; border-radius:0; padding-top:14px; }
    #n-tabs .n-tab-refresh:hover{ background:#f8fafc; }
  }
</style>

<script>
  // Número de BE a mostrar (inyectado desde Code.gs → const BE_LABEL).
  // En preview local, server.ps1 reemplaza el scriptlet por el valor de Code.gs.
  window.BE_LABEL = '<?= BE_LABEL ?>';
  // Si el usuario actual es admin del email se muestra la pestaña "Email".
  window.EMAIL_ADMIN = ('<?= EMAIL_ADMIN ?>' === 'true');
  // Si está habilitado para Analytics se muestra esa pestaña (lista aparte).
  window.ANALYTICS_VIEWER = ('<?= ANALYTICS_VIEWER ?>' === 'true');
</script>
<script>
(function(){
  // Rellenar todos los <span class="be-label"></span> con el BE actual
  function fillBe(){ document.querySelectorAll('.be-label').forEach(function(el){ el.textContent = window.BE_LABEL; }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fillBe); else fillBe();

  // Ocultar pestañas según permisos (el gate real está en doGet):
  // "Email" y "Analytics" son paneles de admin: dependen de ADMIN_EMAILS.
  // "RR View" (rrcompare) es PÚBLICA: no se gatea, la ve cualquiera.
  var tabPerm = { email: window.EMAIL_ADMIN, analytics: window.ANALYTICS_VIEWER };
  Object.keys(tabPerm).forEach(function(pg){
    if (tabPerm[pg]) return;
    var et = document.querySelector('#n-tabs a[data-page="'+pg+'"]');
    if (et) {
      var prev = et.previousElementSibling;
      if (prev && prev.classList.contains('n-divider')) prev.remove();
      et.remove();
    }
  });

  // Toggle del menú hamburguesa (mobile). Expuesto global por el onclick del botón.
  window.toggleNavMenu = function(e){
    if (e) e.stopPropagation();
    var nv = document.querySelector('nav');
    if (nv) nv.classList.toggle('menu-open');
  };
  // Cerrar el menú al tocar fuera de la barra.
  document.addEventListener('click', function(e){
    var nv = document.querySelector('nav');
    if (nv && nv.classList.contains('menu-open') && !nv.contains(e.target)) nv.classList.remove('menu-open');
  });

  // Pestaña activa según window.PAGE_ID (definido por cada página antes del include)
  var active = window.PAGE_ID || '';
  var activeEl = null;
  document.querySelectorAll('#n-tabs a[data-page]').forEach(function(a){
    if (a.getAttribute('data-page') === active) { a.classList.add('active'); activeEl = a; }
  });
  // En pantallas angostas la barra de tabs scrollea: centrar la pestaña activa
  if (activeEl) {
    setTimeout(function(){
      var t = document.getElementById('n-tabs');
      if (t && t.scrollWidth > t.clientWidth) {
        try { activeEl.scrollIntoView({ inline:'center', block:'nearest' }); }
        catch(e) { t.scrollLeft = activeEl.offsetLeft - (t.clientWidth - activeEl.offsetWidth) / 2; }
      }
    }, 0);
  }

  // Limpieza de caches localStorage huérfanos de páginas eliminadas
  try { ['peya_dly_hist_v1','peya_dly_hist_v2','peya_mtdmetric_v1','peya_mtdmetric_v2','peya_mtd_v2','peya_grafic_v2'].forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}

  // Navegación con overlay + reescritura de links con la URL real del deployment.
  // LOCAL=true cuando no hay backend GAS (preview): se navega por href relativo.
  var BASE_URL = null, LOCAL = false, pendingNav = null, pendingHref = null;
  function navTo(page, href) {
    if (BASE_URL) { (window.top||window).location.href = BASE_URL + '?pagina=' + page; }
    else if (LOCAL) { window.location.href = href; }
    else { pendingNav = page; pendingHref = href; }
  }
  function wire(){
    document.querySelectorAll('#n-tabs a[data-page]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        var nv = document.querySelector('nav'); if (nv) nv.classList.remove('menu-open');
        if (a.classList.contains('active')) return;
        if (!document.getElementById('nav-ov')) {
          var ov = document.createElement('div');
          ov.id = 'nav-ov';
          ov.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center';
          ov.innerHTML = '<div style="width:32px;height:32px;border:3px solid rgba(229,0,68,.12);border-top-color:#e50044;border-radius:50%;animation:spin .7s linear infinite"></div>';
          document.body.appendChild(ov);
        }
        navTo(a.getAttribute('data-page'), a.getAttribute('href'));
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else wire();

  if (typeof google === 'undefined' || !google.script || !google.script.run) { LOCAL = true; return; }
  google.script.run.withSuccessHandler(function(u) {
    if (!u) { // mock local: getScriptUrl devuelve null
      LOCAL = true;
      if (pendingHref) window.location.href = pendingHref;
      return;
    }
    BASE_URL = u;
    document.querySelectorAll('#n-tabs a[data-page]').forEach(function(a) {
      a.href = u + '?pagina=' + a.getAttribute('data-page');
    });
    if (pendingNav) navTo(pendingNav, pendingHref);
  }).getScriptUrl();
})();
</script>
