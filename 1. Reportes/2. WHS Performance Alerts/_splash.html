<style>
  #splash {
    position: fixed;
    inset: 0;
    background: var(--bg-main, #f8fafc);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .3s ease;
    backdrop-filter: blur(4px);
  }
  #splash.out {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(229,0,68,0.12);
    border-top-color: var(--primary, #e50044);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<div id="splash">
  <div style="font-weight:700;font-size:15px;color:var(--text-sub);margin-bottom:4px;">PedidosYa Markets</div>
  <div style="font-weight:900;font-size:22px;margin-bottom:20px;"><b style="color:var(--primary)">WHS Performance Alerts</b></div>
  <div class="spinner"></div>
  <div id="splash-text" style="font-weight:600;color:var(--text-light);font-size:12px;">Cargando...</div>
</div>
