<!-- _nav.html — Navegación compartida para Alertas de Performance -->
<base target="_top">

<style>
  :root {
    --primary: #e50044;
    --primary-hover: #cf003d;
    --bg-main: #f1f5f9; /* Cambiado a un tono ligeramente más oscuro para dar mejor contraste con las tarjetas blancas */
    --panel-bg: #ffffff;
    --text-main: #0f172a;
    --text-sub: #475569;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
  }
  
  /* Premium Dark Mode variables and overrides */
  body.dark {
    --bg-main: #0b0f19;
    --panel-bg: #111827;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --text-light: #64748b;
    --border: #1f2937;
    --border-light: #374151;
  }
  
  body.dark {
    background-color: var(--bg-main) !important;
    color: var(--text-main) !important;
  }
  body.dark .card, body.dark .kpi, body.dark .store-card, body.dark pre {
    background-color: var(--panel-bg) !important;
    border-color: var(--border) !important;
    color: var(--text-main) !important;
  }
  body.dark select, body.dark button:not(.btn):not(#btn-back-to-top), body.dark .option-item, body.dark table, body.dark th, body.dark td {
    background-color: var(--panel-bg) !important;
    border-color: var(--border) !important;
    color: var(--text-sub) !important;
  }
  body.dark select:focus {
    border-color: var(--primary) !important;
  }
  body.dark th {
    background-color: var(--border-light) !important;
    color: var(--text-light) !important;
  }
  body.dark .option-item.selected {
    border-color: rgba(229,0,68,0.4) !important;
    background-color: rgba(229,0,68,0.08) !important;
  }
  body.dark #splash {
    background-color: rgba(11,15,25,0.98) !important;
  }
  body.dark #splash div {
    color: var(--text-main) !important;
  }
  body.dark .p-pill {
    background-color: var(--border-light) !important;
    color: var(--text-main) !important;
    border-color: var(--border) !important;
  }
  body.dark input[type="checkbox"] {
    accent-color: var(--primary) !important;
  }
  body.dark .seg {
    background-color: var(--border-light) !important;
  }
  body.dark .seg button {
    color: var(--text-sub) !important;
  }
  body.dark .seg button.on {
    background-color: var(--panel-bg) !important;
    color: var(--primary) !important;
  }
  body.dark tbody tr:nth-child(even) td {
    background: #182235 !important;
  }
  body.dark .btn-secondary {
    background-color: var(--border-light) !important;
    color: var(--text-main) !important;
  }
  body.dark #summary-stats-bar .pill-btn {
    background-color: var(--panel-bg) !important;
    border-color: var(--border) !important;
  }
  body.dark #alerts-grid .store-card {
    background-color: var(--panel-bg) !important;
    border-color: var(--border) !important;
  }
  body.dark #alerts-grid .store-card h3 {
    color: var(--text-main) !important;
  }

  /* Core Navbar Styles */
  nav {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 300;
  }
  .n-brand {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-right: 18px;
    flex-shrink: 0;
  }
  .n-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary, #e50044);
  }
  .n-divider {
    width: 1px;
    height: 20px;
    background: var(--border, #e2e8f0);
    margin: 0 10px;
    flex-shrink: 0;
  }
  .n-tabs {
    display: flex;
    gap: 2px;
  }
  .n-tab {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub, #475569);
    transition: all .15s;
    border: none;
    background: transparent;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .n-tab svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }
  .n-tab.active {
    background: var(--bg-main, #f8fafc);
    color: var(--primary, #e50044);
    font-weight: 600;
  }
  .n-tab:hover:not(.active) {
    background: var(--border-light, #f1f5f9);
    color: var(--text-main, #0f172a);
  }
  .n-right {
    margin-left: auto;
    display: flex;
    align-items: center;
  }
  .n-btn {
    height: 30px;
    border: 1px solid var(--border, #e2e8f0);
    background: #fff;
    border-radius: 7px;
    padding: 0 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub, #475569);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .n-btn:hover {
    border-color: var(--text-sub, #475569);
    color: var(--text-main, #0f172a);
  }
  .n-btn svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* Dropdown menu */
  .n-dropdown {
    position: relative;
    display: inline-block;
  }
  .n-dropdown-content {
    display: none;
    position: absolute;
    background-color: #fff;
    min-width: 190px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 8px;
    padding: 6px;
    z-index: 1000;
    top: 100%;
    margin-top: 4px;
    text-align: left;
  }
  .n-dropdown-content a {
    color: var(--text-sub, #475569) !important;
    padding: 8px 12px;
    text-decoration: none;
    display: block;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    transition: background 0.1s;
    box-shadow: none !important;
    border: none !important;
    background: transparent !important;
  }
  .n-dropdown-content a:hover {
    background-color: var(--border-light, #f1f5f9) !important;
    color: var(--text-main, #0f172a) !important;
  }
  .n-dropdown:hover .n-dropdown-content {
    display: block;
  }
  .n-dropdown button:hover {
    background: var(--border-light, #f1f5f9) !important;
  }

  /* Pestaña activa — estilo unificado para todas las páginas: píldora roja */
    /* Pestaña activa — idéntico al hover normal, pero levemente más oscuro al hacerle hover */
  #n-tabs .n-tab.active {
    background: var(--border-light, #f1f5f9) !important;
    color: var(--text-main, #0f172a) !important;
    font-weight: 700 !important;
    box-shadow: none !important;
  }
  #n-tabs .n-tab.active svg {
    stroke: var(--text-main, #0f172a) !important;
  }
  #n-tabs .n-tab.active:hover {
    background: var(--border, #e2e8f0) !important;
  }
/* Ajustes de scroll horizontal para tabs en mobile */
  #n-tabs{ flex-wrap:nowrap !important; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -ms-overflow-style:none; }
  #n-tabs::-webkit-scrollbar{ height:0; display:none; }
  #n-tabs .n-divider{ margin:0 4px !important; height:15px; }
  #n-tabs .n-tab{ padding:5px 7px !important; gap:4px !important; font-size:11.5px !important; }
  #n-tabs .n-tab svg{ width:12px; height:12px; }

  /* Menú hamburguesa (solo mobile) */
  .n-tab-refresh{ display:none !important; }
  #n-burger{ display:none; align-items:center; justify-content:center; width:38px; height:32px;
    border:1px solid #e2e8f0; background:#fff; border-radius:7px; cursor:pointer; flex-shrink:0; }
  #n-burger svg{ width:18px; height:18px; stroke:#0f172a; fill:none; stroke-width:2; stroke-linecap:round; }
  #n-burger:hover{ background:#f8fafc; }

  @media(max-width:820px){
    nav .n-divider{ display:none !important; }
    .n-right{ display:none !important; }
    #n-burger{ display:flex; margin-left:auto; }
    #n-tabs{
      position:absolute !important; top:100%; left:0; right:0;
      flex-direction:column !important; align-items:stretch !important; flex:none !important;
      gap:2px; background:#fff; border-bottom:1px solid #e2e8f0;
      box-shadow:0 10px 22px rgba(0,0,0,.12); padding:8px !important;
      max-height:0; opacity:0; pointer-events:none; overflow:hidden !important;
      transition:max-height .22s ease, opacity .18s ease; z-index:400;
    }
    nav.menu-open #n-tabs{ max-height:82vh; opacity:1; pointer-events:auto; overflow-y:auto !important; }
    #n-tabs .n-tab{ width:100%; padding:12px 14px; font-size:14px; border-radius:8px; justify-content:flex-start; }
    #n-tabs .n-tab svg{ width:17px; height:17px; }
    #n-tabs .n-tab-refresh{ display:flex !important; font-weight:600; margin-top:4px;
      border-top:1px solid #f1f5f9; border-radius:0; padding-top:14px; }
    #n-tabs .n-tab-refresh:hover{ background:#f8fafc; }
  }
</style>

<!-- Botón flotante para Volver Arriba -->
<button id="btn-back-to-top" onclick="scrollToTop()" style="position:fixed; bottom:24px; right:24px; width:44px; height:44px; border-radius:50%; background:#e50044; color:#ffffff; border:none; box-shadow:0 4px 10px rgba(229,0,68,0.3); cursor:pointer; display:none; align-items:center; justify-content:center; z-index:999; transition:opacity 0.2s, transform 0.2s; outline:none;" onmouseover="this.style.background='#cf003d'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#e50044'; this.style.transform='none'">
  <svg style="width:20px; height:24px; stroke:currentColor; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>
  window.USER_EMAIL = '<?= userEmail ?>';
  window.IS_ADMIN = <?= isAdmin ?>;
  
  // Fallback de actualización estándar por si la página actual no define doRefresh propio
  window.doRefresh = window.doRefresh || function() {
    window.location.reload();
  };
  
  // Script para marcar pestaña activa de forma automática según PAGE_ID de la página
  (function(){
    var pageId = window.PAGE_ID || 'dashboard';
    var activeTab = document.getElementById('tab-' + pageId);
    if (activeTab) {
      activeTab.classList.add('active');
    }
    
    // Hamburguesa en mobile
    window.toggleNavMenu = function(e){
      if (e) e.stopPropagation();
      var nv = document.querySelector('nav');
      if (nv) nv.classList.toggle('menu-open');
    };
    
    // Cerrar menú si clickean fuera
    document.addEventListener('click', function(){
      var nv = document.querySelector('nav');
      if (nv && nv.classList.contains('menu-open')) nv.classList.remove('menu-open');
    });
    
    // Forzar siempre Modo Claro y limpiar cualquier guardado previo de cookies/local storage
    (function() {
      localStorage.setItem('theme', 'light');
      document.body.classList.remove('dark');
    })();
    
    // Lógica del botón Volver Arriba
    var btt = document.getElementById('btn-back-to-top');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 250) {
        if (btt) btt.style.display = 'flex';
      } else {
        if (btt) btt.style.display = 'none';
      }
    });
    
    window.scrollToTop = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  })();
</script>
