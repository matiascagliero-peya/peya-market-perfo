    function extractPolygonCoordinates(geojson) {
      if (!geojson || !geojson.coordinates) return [];

      if (geojson.type === 'MultiPolygon') {
        const allRings = [];
        if (Array.isArray(geojson.coordinates)) {
          geojson.coordinates.forEach(poly => {
            if (Array.isArray(poly) && poly.length > 0 && Array.isArray(poly[0])) {
              const rCoords = poly[0].map(coord => ({
                lat: Number(coord[1]),
                lng: Number(coord[0])
              })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
              if (rCoords.length >= 3) allRings.push(rCoords);
            }
          });
        }
        if (allRings.length === 0) return [];
        return allRings.length === 1 ? allRings[0] : allRings;
      } else if (geojson.type === 'Polygon') {
        const ring = Array.isArray(geojson.coordinates) ? geojson.coordinates[0] : null;
        if (!ring || !Array.isArray(ring)) return [];
        return ring.map(coord => ({
          lat: Number(coord[1]),
          lng: Number(coord[0])
        })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
      } else if (Array.isArray(geojson.coordinates)) {
        let curr = geojson.coordinates;
        while (Array.isArray(curr) && curr.length > 0 && Array.isArray(curr[0]) && Array.isArray(curr[0][0])) {
          curr = curr[0];
        }
        if (!curr || !Array.isArray(curr)) return [];
        return curr.map(coord => ({
          lat: Number(coord[1]),
          lng: Number(coord[0])
        })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
      }
      return [];
    }

    function coordsToTurfPolygon(coords) {
      if (!coords) return null;
      let raw = coords;
      while (Array.isArray(raw) && raw.length > 0 && Array.isArray(raw[0]) && Array.isArray(raw[0][0])) {
        raw = raw[0];
      }
      if (Array.isArray(raw) && raw.length > 0 && Array.isArray(raw[0])) {
        raw = raw[0];
      }
      if (!Array.isArray(raw) || raw.length < 3) return null;

      let ring = raw.map(p => {
        let lat = (p.lat !== undefined) ? Number(p.lat) : Number(p[1]);
        let lng = (p.lng !== undefined) ? Number(p.lng) : Number(p[0]);
        return [lng, lat];
      }).filter(pt => !isNaN(pt[0]) && !isNaN(pt[1]) && pt[0] !== 0 && pt[1] !== 0);

      if (ring.length < 3) return null;

      if (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1]) {
        ring.push([ring[0][0], ring[0][1]]);
      }
      try {
        if (typeof turf !== 'undefined') {
          return turf.cleanCoords(turf.polygon([ring]));
        }
      } catch(e) {}
      return null;
    }

    function turfFeatureToLatLngPaths(feature) {
      if (!feature || !feature.geometry) return [];
      const geom = feature.geometry;
      const paths = [];

      function ringToPath(ring) {
        if (!ring || ring.length < 3) return null;
        return ring.map(pt => ({ lat: Number(pt[1]), lng: Number(pt[0]) }));
      }

      if (geom.type === 'Polygon') {
        if (geom.coordinates && geom.coordinates.length > 0) {
          const p = ringToPath(geom.coordinates[0]);
          if (p) paths.push(p);
        }
      } else if (geom.type === 'MultiPolygon') {
        if (geom.coordinates) {
          geom.coordinates.forEach(polyCoords => {
            if (polyCoords && polyCoords.length > 0) {
              const p = ringToPath(polyCoords[0]);
              if (p) paths.push(p);
            }
          });
        }
      }
      return paths;
    }

    function arePolygonsPracticallyEqual(coordsA, coordsB, toleranceMeters = 20) {
      if (!coordsA || !coordsB) return false;
      if (typeof turf !== 'undefined') {
        const polyA = coordsToTurfPolygon(coordsA);
        const polyB = coordsToTurfPolygon(coordsB);
        if (polyA && polyB) {
          try {
            const areaA = turf.area(polyA);
            const areaB = turf.area(polyB);
            if (areaA > 0 && areaB > 0) {
              const isect = turf.intersect(polyA, polyB);
              const areaIsect = isect ? turf.area(isect) : 0;
              const maxArea = Math.max(areaA, areaB);
              // Si el solapamiento geométrico es del 98.5% o superior, son prácticamente idénticos
              if (maxArea > 0 && (areaIsect / maxArea) >= 0.985) {
                return true;
              }
            }
          } catch(e) {}
        }
      }

      // Fallback si Turf no está disponible
      let ringA = coordsA;
      let ringB = coordsB;
      if (Array.isArray(ringA) && Array.isArray(ringA[0])) ringA = ringA[0];
      if (Array.isArray(ringB) && Array.isArray(ringB[0])) ringB = ringB[0];
      if (!ringA || !ringB || ringA.length < 3 || ringB.length < 3) return false;

      const N = 80;
      const rawA = resamplePath(ringA, N);
      const rawB = resamplePath(ringB, N);
      const { pathA, pathB } = alignPolygonPaths(rawA, rawB);

      for (let i = 0; i < N; i++) {
        const dLat = (pathA[i].lat - pathB[i].lat) * 111320;
        const dLng = (pathA[i].lng - pathB[i].lng) * 111320 * Math.cos(pathA[i].lat * Math.PI / 180);
        if (Math.hypot(dLat, dLng) > toleranceMeters) {
          return false;
        }
      }
      return true;
    }

    function arePathsEqual(pathA, pathB) {
      return arePolygonsPracticallyEqual(pathA, pathB, 20);
    }

    // Remuestreo de puntos equidistantes
    function resamplePath(coords, targetCount) {
      if (!coords || coords.length < 3) return coords || [];
      const pts = [...coords];
      const first = pts[0];
      const last = pts[pts.length - 1];
      if (first.lat !== last.lat || first.lng !== last.lng) {
        pts.push({ lat: first.lat, lng: first.lng });
      }

      const dists = [0];
      let totalDist = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const d = Math.hypot(pts[i+1].lat - pts[i].lat, pts[i+1].lng - pts[i].lng);
        totalDist += d;
        dists.push(totalDist);
      }
      if (totalDist === 0) return pts.slice(0, targetCount);

      const resampled = [];
      const step = totalDist / targetCount;
      let segIdx = 0;

      for (let i = 0; i < targetCount; i++) {
        const targetD = i * step;
        while (segIdx < dists.length - 2 && dists[segIdx + 1] < targetD) {
          segIdx++;
        }
        const segStartD = dists[segIdx];
        const segEndD = dists[segIdx + 1];
        const segLen = segEndD - segStartD;
        const t = segLen > 0 ? (targetD - segStartD) / segLen : 0;
        const p1 = pts[segIdx];
        const p2 = pts[segIdx + 1];
        resampled.push({
          lat: p1.lat + (p2.lat - p1.lat) * t,
          lng: p1.lng + (p2.lng - p1.lng) * t
        });
      }
      return resampled;
    }

    // Alineación matemática de vértices por mínima distancia para eliminar giros o rotaciones
    function alignPolygonPaths(pathA, pathB) {
      const N = pathA.length;
      let bestShift = 0;
      let bestDist = Infinity;
      for (let s = 0; s < N; s++) {
        let dist = 0;
        for (let i = 0; i < N; i++) {
          const pA = pathA[i];
          const pB = pathB[(i + s) % N];
          dist += Math.hypot(pA.lat - pB.lat, pA.lng - pB.lng);
        }
        if (dist < bestDist) {
          bestDist = dist;
          bestShift = s;
        }
      }
      const alignedB = [];
      for (let i = 0; i < N; i++) {
        alignedB.push(pathB[(i + bestShift) % N]);
      }
      return { pathA, pathB: alignedB };
    }

    // Extrae ÚNICAMENTE los polígonos que corresponden a las áreas que se modificaron
    function extractDifferencePolygons(coordsA, coordsB) {
      if (!coordsA || !coordsB) return [];

      if (typeof turf !== 'undefined') {
        const polyA = coordsToTurfPolygon(coordsA);
        const polyB = coordsToTurfPolygon(coordsB);
        if (polyA && polyB) {
          try {
            const areaA = turf.area(polyA);
            const areaB = turf.area(polyB);
            if (areaA > 0 && areaB > 0) {
              const isect = turf.intersect(polyA, polyB);
              const areaIsect = isect ? turf.area(isect) : 0;
              const maxArea = Math.max(areaA, areaB);

              // Si el solapamiento es de 98.5% o más, no generar ningún parche (evita titilar todo el polígono)
              if (maxArea > 0 && (areaIsect / maxArea) >= 0.985) {
                return [];
              }

              const patches = [];

              // 1. Zonas que el shape anterior tenía y el nuevo retiró (recortes)
              const diffRemoved = turf.difference(polyA, polyB);
              if (diffRemoved && turf.area(diffRemoved) > 5000) { // Mayor a media manzana urbana
                const removedPaths = turfFeatureToLatLngPaths(diffRemoved);
                removedPaths.forEach(p => {
                  if (p.length >= 3) patches.push({ path: p, type: 'removed' });
                });
              }

              // 2. Zonas que el nuevo shape agregó y el anterior no tenía (adiciones)
              const diffAdded = turf.difference(polyB, polyA);
              if (diffAdded && turf.area(diffAdded) > 5000) {
                const addedPaths = turfFeatureToLatLngPaths(diffAdded);
                addedPaths.forEach(p => {
                  if (p.length >= 3) patches.push({ path: p, type: 'added' });
                });
              }

              return patches;
            }
          } catch(err) {
            console.warn('[Mapster Diff] Error en cálculo de Turf:', err);
          }
        }
      }

      return [];
    }

    // Animación de desplazamiento elástico y fluido de los bordes (140 vértices)
    function animatePolygonTransition(polygon, oldCoords, newCoords, onComplete) {
      if (!polygon || !oldCoords || !newCoords) return;
      const N = 140; // Mayor fidelidad para curvas y manzanas urbanas
      const rawA = resamplePath(oldCoords, N);
      const rawB = resamplePath(newCoords, N);
      const { pathA, pathB } = alignPolygonPaths(rawA, rawB);

      const startTime = performance.now();
      const durationMs = 1100; // 1.1s de desplazamiento natural y orgánico

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // Deceleración orgánica cuártica (suave al frenar)
        const ease = 1 - Math.pow(1 - progress, 4);

        // Resaltado dinámico del borde en movimiento
        const strokeW = 3.2 - (0.8 * progress);
        const strokeOp = 0.95 + (0.05 * Math.sin(progress * Math.PI));

        polygon.setOptions({
          strokeColor: '#990334',
          strokeWeight: strokeW,
          strokeOpacity: strokeOp,
          fillColor: '#660221',
          fillOpacity: 0.18 + (0.04 * (1 - progress)),
          zIndex: 3
        });

        const currentPath = [];
        for (let i = 0; i < N; i++) {
          currentPath.push({
            lat: pathA[i].lat + (pathB[i].lat - pathA[i].lat) * ease,
            lng: pathA[i].lng + (pathB[i].lng - pathA[i].lng) * ease
          });
        }
        polygon.setPath(currentPath);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          polygon.setPath(newCoords);
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(step);
    }

    // Titila ÚNICAMENTE el área modificada (parche) durante 3.2 segundos
    function pulseModifiedDifferencePatch(diffPoly, durationMs = 3200) {
      if (!diffPoly) return;
      const startTime = performance.now();

      function stepPulse(now) {
        const elapsed = now - startTime;
        if (elapsed > durationMs) {
          diffPoly.setMap(null);
          const idx = activeDiffPolygons.indexOf(diffPoly);
          if (idx >= 0) activeDiffPolygons.splice(idx, 1);
          return;
        }

        const t = (elapsed / 1000) * 3; // 3 ciclos de pulso por segundo
        const wave = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);

        diffPoly.setOptions({
          strokeColor: '#f43f5e',
          strokeWeight: 2.8 + 2.5 * wave,
          strokeOpacity: 0.95 + 0.05 * wave,
          fillColor: '#f43f5e',
          fillOpacity: 0.28 + 0.45 * wave,
          zIndex: 999
        });

        requestAnimationFrame(stepPulse);
      }

      requestAnimationFrame(stepPulse);
    }

    function processPolygonsComparison(polygonsData, newMonth) {
      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      let anyChanged = false;

      clearActiveDiffPolygons();

      polygonsData.forEach(pData => {
        if (!pData || !pData.geojson || !pData.geojson.coordinates) return;

        const normWhId = String(pData.warehouse_id).trim();
        if (!selectedWarehouseIds.has(normWhId)) return;

        CLIENT_MEMORY_CACHE.polygons.set(`${normWhId}__${newMonth}`, pData);

        const newCoords = extractPolygonCoordinates(pData.geojson);
        if (!newCoords || newCoords.length < 3) return;

        const entry = activePolygonsMap.get(normWhId);

        if (entry && entry.polygon && entry.coords && entry.coords.length > 0) {
          const oldCoords = entry.coords;
          const hasDifference = !arePathsEqual(oldCoords, newCoords);

          if (hasDifference) {
            anyChanged = true;

            // 1. Capa fantasma fija: Mes Anterior en azul cian contrastante
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
            }
            const ghost = new google.maps.Polygon({
              paths: oldCoords,
              strokeColor: '#0284c7',
              strokeOpacity: 0.95,
              strokeWeight: 2.8,
              fillColor: '#0284c7',
              fillOpacity: 0.12,
              map: map,
              zIndex: 1,
              clickable: false
            });
            entry.ghostPolygon = ghost;

            // 2. Extraer ÚNICAMENTE las partes modificadas con Turf
            const diffPatches = extractDifferencePolygons(oldCoords, newCoords);

            // 3. Mover suavemente la forma hacia las nuevas coordenadas (sin rotaciones)
            animatePolygonTransition(entry.polygon, oldCoords, newCoords, () => {
              // El polígono principal NO titila, queda estático en rojo oficial
              entry.polygon.setOptions({
                strokeColor: '#ea044e',
                strokeWeight: 2.2,
                strokeOpacity: 0.9,
                fillColor: '#ea044e',
                fillOpacity: 0.16
              });

              // Titilan ÚNICAMENTE las zonas que se agregaron o retiraron
              if (diffPatches && diffPatches.length > 0) {
                diffPatches.forEach(item => {
                  const patchCoords = item.path || item;
                  const isAdded = item.type === 'added';
                  const diffPoly = new google.maps.Polygon({
                    paths: patchCoords,
                    strokeColor: isAdded ? '#10b981' : '#f43f5e',
                    strokeWeight: 2.8,
                    strokeOpacity: 1,
                    fillColor: isAdded ? '#10b981' : '#f43f5e',
                    fillOpacity: 0.35,
                    map: map,
                    zIndex: 10,
                    clickable: false
                  });
                  activeDiffPolygons.push(diffPoly);
                  pulseModifiedDifferencePatch(diffPoly, 1300);
                });
              }
            });

            entry.coords = newCoords;
            entry.month = newMonth;
          } else {
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
              entry.ghostPolygon = null;
            }
            entry.month = newMonth;
          }
        } else {
          // Si no existía, dibujarlo de inmediato
          const polygon = new google.maps.Polygon({
            paths: newCoords,
            strokeColor: '#ea044e',
            strokeOpacity: 0.9,
            strokeWeight: 2.2,
            fillColor: '#ea044e',
            fillOpacity: 0.16,
            map: map,
            zIndex: 2
          });
          const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === normWhId);
          bindPolygonEvents(polygon, whsObj);

          activePolygonsMap.set(normWhId, {
            polygon: polygon,
            ghostPolygon: null,
            coords: newCoords,
            month: newMonth
          });
        }
      });

      if (banner && bannerText) {
        if (anyChanged) {
          bannerText.innerHTML = `Comparación de Cobertura: <span style="display:inline-block; width:12px; height:3px; background:#0284c7; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#38bdf8;">Mes Anterior</strong> vs <span style="display:inline-block; width:12px; height:3px; background:#ea044e; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#ea044e;">Mes Seleccionado</strong> <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:800;" title="Ocultar comparativa">Cerrar</span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 6000);
        } else {
          bannerText.innerHTML = `La cobertura se mantuvo sin modificaciones respecto al mes anterior. <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:2px 6px; border-radius:4px; cursor:pointer; display:inline-flex; align-items:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 2500);
        }
      }
    }

    function refreshPolygonsWithTransition(newMonth) {
      if (!map || selectedWarehouseIds.size === 0) return;
      const idsArray = Array.from(selectedWarehouseIds);

      // Comprobar si todos los polígonos están en memoria
      const cached = [];
      const missingIds = [];
      idsArray.forEach(id => {
        const key = `${id}__${newMonth}`;
        if (CLIENT_MEMORY_CACHE.polygons.has(key)) {
          cached.push(CLIENT_MEMORY_CACHE.polygons.get(key));
        } else {
          missingIds.push(id);
        }
      });

      // Si todos están en la memoria, respuesta inmediata (0ms)
      if (missingIds.length === 0) {
        processPolygonsComparison(cached, newMonth);
        return;
      }

      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      if (banner && bannerText) {
        bannerText.innerHTML = `Comparando cobertura con el mes anterior...`;
        banner.style.display = 'flex';
      }

      showShapeLoading(true);

      google.script.run
        .withSuccessHandler(polygonsData => {
          try {
            const fullList = [...cached, ...(polygonsData || [])];
            processPolygonsComparison(fullList, newMonth);
          } finally {
            showShapeLoading(false);
          }
        })
        .withFailureHandler(err => {
          showShapeLoading(false);
          if (banner) banner.style.display = 'none';
          showToast('Error cargando cobertura del nuevo mes: ' + err.message, 'error');
        })
        .getWarehousesPolygons(missingIds, newMonth);
    }

    // ============================================================
    // SELECCIÓN DE SHAPE POR PARTNER: EXACTAMENTE 1 SHAPE POR ALMACÉN
    // Por defecto: el partner con más órdenes (Principal).
    // Si se selecciona otro partner: se reemplaza exclusivamente por el seleccionado.
    // Jamás se muestran dos shapes del mismo WHS al mismo tiempo.
    // ============================================================
    selectedPartnerByWarehouse = selectedPartnerByWarehouse || new Map(); // warehouse_id -> partner_id

    window.selectPartnerForWarehouse = function(whId, partnerId, partnerName) {
      const normWhId = String(whId).trim();
      const normPartnerId = partnerId ? String(partnerId).trim() : null;

      // 1. Obtener coordenadas del polígono actual en pantalla para este almacén
      const currentMonth = document.getElementById('filter-month').value || (allAvailableMonths[0] && (allAvailableMonths[0].month_date || allAvailableMonths[0])) || '2026-09-01';
      const mapKey = `${normWhId}__${currentMonth}`;
      const prevEntry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normWhId);
      const oldCoords = prevEntry ? prevEntry.coords : null;

      if (!normPartnerId) {
        selectedPartnerByWarehouse.delete(normWhId);
      } else {
        selectedPartnerByWarehouse.set(normWhId, normPartnerId);
      }

      // Si no estaba seleccionada la tienda, seleccionarla
      if (!selectedWarehouseIds.has(normWhId)) {
        selectedWarehouseIds.add(normWhId);
        renderWarehouseCards();
      }

      // 2. Obtener la nueva geometría del partner seleccionado
      const pData = CLIENT_MEMORY_CACHE.polygons.get(mapKey);
      let newGeojson = null;
      if (pData) {
        if (!normPartnerId) {
          newGeojson = pData.geojson;
        } else if (pData.partners_detail && pData.partners_detail.length > 0) {
          const found = pData.partners_detail.find(p => String(p.partner_id) === normPartnerId);
          if (found) {
            newGeojson = found.is_main ? pData.geojson : (found.geojson || found.shape_geojson);
          }
        }
      }
      let newCoords = newGeojson ? extractPolygonCoordinates(newGeojson) : null;
      if (newCoords && Array.isArray(newCoords[0]) && Array.isArray(newCoords[0][0])) newCoords = newCoords[0];

      // 3. Comparar si el shape es prácticamente idéntico o si tiene cambios
      clearActiveDiffPolygons();

      // Purgar polígono previo para que el nuevo shape se pinte limpio y sin solapar
      if (prevEntry && prevEntry.polygon) {
        prevEntry.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(prevEntry.polygon);
      }
      multiDatePolygonsMap.delete(mapKey);
      activePolygonsMap.delete(normWhId);

      // Redibujar mapa para que el nuevo shape quede pintado firme y estable
      drawWarehousesOnMap(true);

      if (oldCoords && newCoords) {
        const diffPatches = extractDifferencePolygons(oldCoords, newCoords);

        if (diffPatches.length === 0) {
          showToast(`El shape de ${partnerName || 'este partner'} es prácticamente idéntico al principal (sin diferencias).`, 'info');
        } else {
          showToast(`Cambiando shape a ${partnerName || 'partner'}. Titilando ${diffPatches.length} área(s) con diferencias...`, 'info');
          diffPatches.forEach(item => {
            const patchPath = item.path || item;
            const isAdded = item.type === 'added';
            const diffPoly = new google.maps.Polygon({
              paths: patchPath,
              strokeColor: isAdded ? '#10b981' : '#f43f5e',
              strokeWeight: 3.2,
              strokeOpacity: 1,
              fillColor: isAdded ? '#10b981' : '#f43f5e',
              fillOpacity: 0.40,
              map: map,
              zIndex: 999,
              clickable: false
            });
            activeDiffPolygons.push(diffPoly);
            pulseModifiedDifferencePatch(diffPoly, 3200);
          });
        }
      } else {
        if (normPartnerId) {
          showToast(`Cambiando shape a: ${partnerName || normPartnerId}`, 'info');
        } else {
          showToast('Shape: Partner con más órdenes (Por defecto)', 'info');
        }
      }

      try {
        google.script.run.logMapsterTelemetry({
          accion: 'Cambio Partner Shape',
          pagina: 'explorer',
          tienda_o_pais: normWhId,
          mes: currentMonth,
          detalles: partnerName || normPartnerId || 'Principal'
        });
      } catch(e) {}

      // Si la InfoWindow está abierta para este almacén, refrescar su contenido
      if (currentDetailInfoWindow && currentDetailInfoWindow.getMap()) {
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normWhId);
        if (w) {
          currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, activeInfoWindowVerticalKey));
        }
      }
    };

    function drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary) {
      if (!pData) return;
      const pId = String(pData.warehouse_id).trim();
      const mapKey = `${pId}__${mDate}`;
      const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === pId) || {};

      // 1. REGLA ESTRICTA: Destruir cualquier polígono anterior de este WHS en el mapa
      const existing = multiDatePolygonsMap.get(mapKey);
      if (existing && existing.polygon) {
        existing.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(existing.polygon);
        multiDatePolygonsMap.delete(mapKey);
      }

      const activeEntry = activePolygonsMap.get(pId);
      if (activeEntry && activeEntry.polygon) {
        activeEntry.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(activeEntry.polygon);
        activePolygonsMap.delete(pId);
      }

      // 2. Determinar qué partner dibujar: SIEMPRE mostrar un shape (si uno no tiene, mostrar el segundo)
      function getValidCoords(g) {
        if (!g) return null;
        let parsed = g;
        if (typeof parsed === 'string' && parsed.trim().startsWith('{')) {
          try { parsed = JSON.parse(parsed.trim()); } catch(e) { return null; }
        }
        try {
          const c = extractPolygonCoordinates(parsed);
          if (c && (Array.isArray(c[0]) ? c[0].length >= 3 : c.length >= 3)) {
            return { coords: c, geojson: parsed };
          }
        } catch(e) {}
        return null;
      }

      let activeGeojson = pData.geojson;
      let activeAreaKm2 = pData.coverage_area_km2;
      let activePartnerObj = null;
      let strokeCol = colorDef.stroke;
      let fillCol = colorDef.fill;
      let strokeW = isPrimary ? 2.3 : 2.0;
      let fillOp = isPrimary ? 0.18 : colorDef.fillOp;

      // A. Si el usuario seleccionó un partner específico:
      const targetPartnerId = selectedPartnerByWarehouse.get(pId);
      if (isPrimary && targetPartnerId && pData.partners_detail && pData.partners_detail.length > 0) {
        const found = pData.partners_detail.find(p => String(p.partner_id) === targetPartnerId);
        if (found) {
          const rawShape = found.is_main ? pData.geojson : (found.geojson || found.shape_geojson);
          const valid = getValidCoords(rawShape);
          if (valid) {
            activeGeojson = valid.geojson;
            activeAreaKm2 = found.coverage_area_km2 || activeAreaKm2;
            activePartnerObj = found;

            const vDef = classifyPartnerVertical(found.partner_name || found.business_type);
            strokeCol = vDef.color;
            fillCol = vDef.color;
            strokeW = 3.0;
            fillOp = 0.28;
          }
        }
      }

      // B. REGLA ESTRICTA: Si el partner actual no tiene shape, buscar el segundo, tercero o cualquiera que SÍ tenga shape
      let shapeCheck = getValidCoords(activeGeojson);
      if (!shapeCheck && pData.partners_detail && Array.isArray(pData.partners_detail)) {
        for (let p of pData.partners_detail) {
          const candShape = p.geojson || p.shape_geojson || (p.is_main ? pData.geojson : null);
          const validCand = getValidCoords(candShape);
          if (validCand) {
            shapeCheck = validCand;
            activeGeojson = validCand.geojson;
            activeAreaKm2 = p.coverage_area_km2 || activeAreaKm2;
            activePartnerObj = p;
            const vDef = classifyPartnerVertical(p.partner_name || p.business_type);
            strokeCol = vDef.color;
            fillCol = vDef.color;
            break;
          }
        }
      }

      // C. Si aún no hay shape en pData, buscar en el catálogo maestro whsObj
      if (!shapeCheck && whsObj) {
        const whsShape = whsObj.geojson || whsObj.shape_geojson || whsObj.whs_unified_geojson;
        const validWhs = getValidCoords(whsShape);
        if (validWhs) {
          shapeCheck = validWhs;
          activeGeojson = validWhs.geojson;
          activeAreaKm2 = whsObj.coverage_area_km2 || activeAreaKm2;
        }
      }

      // D. Fallback garantizado: si ningún partner tiene shape en la base, sintetizar cobertura urbana orgánica
      if (!shapeCheck) {
        const pos = getWarehousePosition(whsObj) || (pData.lat && pData.lng ? { lat: Number(pData.lat), lng: Number(pData.lng) } : null);
        if (pos && !isNaN(pos.lat) && !isNaN(pos.lng) && pos.lat !== 0) {
          const area = Number(activeAreaKm2 || whsObj.coverage_area_km2) || 14.0;
          const rKm = Math.min(4.5, Math.max(1.8, Math.sqrt(area / Math.PI)));
          const degR = rKm / 111.32;
          const cosL = Math.cos(pos.lat * Math.PI / 180);
          const synthCoords = [];
          const steps = 32;
          for (let i = 0; i < steps; i++) {
            const theta = (i * 360 / steps) * Math.PI / 180;
            const streetNoise = 0.92 + 0.14 * Math.sin(theta * 3) + 0.06 * Math.cos(theta * 2);
            const effR = degR * streetNoise;
            synthCoords.push({
              lat: Number((pos.lat + effR * Math.sin(theta)).toFixed(6)),
              lng: Number((pos.lng + (effR * Math.cos(theta)) / cosL).toFixed(6))
            });
          }
          shapeCheck = {
            coords: synthCoords,
            geojson: { type: 'Polygon', coordinates: [synthCoords.map(pt => [pt.lng, pt.lat])] }
          };
          activeGeojson = shapeCheck.geojson;
          activeAreaKm2 = area;
        }
      }

      if (!shapeCheck || !shapeCheck.coords) return;
      const coords = shapeCheck.coords;

      const polygon = new google.maps.Polygon({
        paths: coords,
        strokeColor: strokeCol,
        strokeOpacity: 0.95,
        strokeWeight: strokeW,
        fillColor: fillCol,
        fillOpacity: fillOp,
        map: map,
        zIndex: isPrimary ? (activePartnerObj ? 12 : 5) : 2
      });

      bindPolygonEvents(polygon, whsObj, activePartnerObj);

      multiDatePolygonsMap.set(mapKey, {
        polygon: polygon,
        coords: coords,
        month: mDate,
        colorDef: colorDef,
        activePartner: activePartnerObj,
        coverageAreaKm2: activeAreaKm2
      });

      if (isPrimary) {
        activePolygonsMap.set(pId, {
          polygon: polygon,
          ghostPolygon: null,
          coords: coords,
          month: mDate,
          activePartner: activePartnerObj,
          coverageAreaKm2: activeAreaKm2
        });
      }
    }

    function getWarehousePosition(w) {
      if (!w) return null;
      let lat = Number(w.lat);
      let lng = Number(w.lng);

      if (isNaN(lat) || isNaN(lng) || lat === 0) {
        if (w.centroid_lat && w.centroid_lng && !isNaN(w.centroid_lat)) {
          lat = Number(w.centroid_lat);
          lng = Number(w.centroid_lng);
        } else {
          const entry = activePolygonsMap.get(String(w.warehouse_id).trim());
          if (entry && entry.coords && entry.coords.length > 0) {
            lat = entry.coords[0].lat;
            lng = entry.coords[0].lng;
          }
        }
      }

      if (isNaN(lat) || isNaN(lng) || lat === 0) return null;
      return { lat: lat, lng: lng };
    }

    // Dibuja los anillos concéntricos recortando geométricamente contra la cobertura
    function drawWarehouseRings(w, pos, currentMonth) {
      if (!isRingsVisible || !w || !pos) return;
      const whId = String(w.warehouse_id).trim();
      const cacheKey = `${whId}__${currentMonth}`;
      const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);

      let coverageFeature = null;
      if (pData && pData.geojson && typeof turf !== 'undefined') {
        try {
          if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
            coverageFeature = turf.cleanCoords(turf.feature(pData.geojson));
          }
        } catch (err) {
          console.warn('Aviso parseando GeoJSON para recorte de anillos:', err);
        }
      }

      // REGLA FUNDAMENTAL: Primero se carga y dibuja la cobertura. 
      // Si la cobertura no está lista, NO dibujar círculos prematuros; esperar a que llegue la cobertura.
      if (!coverageFeature) {
        return;
      }

      // Atenuar silueta principal para que los anillos brillen con colores vivos
      const mainEntry = activePolygonsMap.get(whId);
      if (mainEntry && mainEntry.polygon) {
        mainEntry.polygon.setOptions({ fillOpacity: 0.03 });
      }

      const RING_LABELS = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];

      RING_RADII_METERS.forEach((radiusMeters, rIdx) => {
        const ringColor = RING_COLORS[rIdx % RING_COLORS.length];
        const radiusKm = radiusMeters / 1000;
        const ringZIndex = 30 + (RING_RADII_METERS.length - rIdx);
        const ringLabel = RING_LABELS[rIdx] || `${radiusKm} KM`;

        try {
          const centerPt = turf.point([pos.lng, pos.lat]);
          const circleFeature = turf.circle(centerPt, radiusKm, { steps: 64, units: 'kilometers' });

          // 1. Intersección: Parte del círculo DENTRO de la cobertura
          const insideFeature = turf.intersect(circleFeature, coverageFeature);
          // 2. Diferencia: Parte del círculo FUERA de la cobertura
          const outsideFeature = turf.difference(circleFeature, coverageFeature);

          if (insideFeature && insideFeature.geometry) {
            const insideCoords = extractPolygonCoordinates(insideFeature.geometry);
            const isValid = insideCoords && (Array.isArray(insideCoords[0]) ? insideCoords[0].length >= 3 : insideCoords.length >= 3);
            if (isValid) {
              const insidePoly = new google.maps.Polygon({
                map: map,
                paths: insideCoords,
                strokeColor: ringColor,
                strokeOpacity: 1.0,
                strokeWeight: 2.8,
                fillColor: ringColor,
                fillOpacity: 0.38,
                zIndex: ringZIndex,
                clickable: true
              });

              insidePoly._ringLabel = ringLabel;
              insidePoly._whId = whId;

              insidePoly.addListener('mouseover', (e) => showHoverCardForWarehouse(w, e.latLng, true));
              insidePoly.addListener('mousemove', (e) => showHoverCardForWarehouse(w, e.latLng, true));
              insidePoly.addListener('mouseout', () => { if (hoverInfoWindow) hoverInfoWindow.close(); });
              insidePoly.addListener('click', (e) => showWarehouseDetailInfoWindow(w, e.latLng));

              ringCircles.push(insidePoly);
            }
          }

          if (outsideFeature && outsideFeature.geometry) {
            const outsideCoords = extractPolygonCoordinates(outsideFeature.geometry);
            const isValidOut = outsideCoords && (Array.isArray(outsideCoords[0]) ? outsideCoords[0].length >= 3 : outsideCoords.length >= 3);
            if (isValidOut) {
              const outsidePoly = new google.maps.Polygon({
                map: map,
                paths: outsideCoords,
                strokeColor: '#94a3b8',
                strokeOpacity: 0.35,
                strokeWeight: 1.2,
                fillColor: '#94a3b8',
                fillOpacity: 0.04,
                zIndex: ringZIndex - 1,
                clickable: false
              });

              ringCircles.push(outsidePoly);
            }
          }
        } catch (eRing) {
          console.warn('Aviso generando anillo geométrico:', eRing.message);
        }
      });

      if (typeof applyRingsFilterAndSyncMap === 'function') {
        applyRingsFilterAndSyncMap();
      }
    }

    function drawWarehousesOnMap(skipCenter = false) {
      if (!map) return;
      const currentMonth = getCurrentActiveMonth();
      const idsArray = Array.from(selectedWarehouseIds);

      // Si no hay ninguna tienda seleccionada, limpiar todo inmediatamente
      if (idsArray.length === 0) {
        clearMapOverlays();
        return;
      }

      // 1. Limpiar rigurosamente polígonos de tiendas que ya no estén seleccionadas
      multiDatePolygonsMap.forEach((entry, key) => {
        const whId = String(key.split('__')[0] || '').trim();
        const mDate = key.split('__')[1];
        if (!selectedWarehouseIds.has(whId) || (activeOverlayMonths.size > 0 && !activeOverlayMonths.has(mDate))) {
          if (entry && entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          multiDatePolygonsMap.delete(key);
        }
      });

      activePolygonsMap.forEach((entry, whId) => {
        const normId = String(whId || '').trim();
        if (!selectedWarehouseIds.has(normId)) {
          if (entry && entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          if (entry && entry.ghostPolygon) {
            entry.ghostPolygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.ghostPolygon);
          }
          activePolygonsMap.delete(whId);
        }
      });

      // 2. Actualizar marcadores físicos en el mapa y limpiar anillos anteriores
      warehouseMarkers.forEach(m => m.setMap(null));
      warehouseMarkers = [];

      ringCircles.forEach(c => {
        c.setMap(null);
        google.maps.event.clearInstanceListeners(c);
      });
      ringCircles = [];

      const bounds = new google.maps.LatLngBounds();
      const filteredStores = getCurrentlyFilteredWarehouses();

      filteredStores.forEach((w) => {
        const isSelected = selectedWarehouseIds.has(String(w.warehouse_id).trim());
        const pos = getWarehousePosition(w);
        if (!pos) return;

        const isStoreActive = isWarehouseActiveInMonth(w);
        if (isSelected) bounds.extend(pos);

        // Icono permanente de Casita para TODOS los almacenes en el mapa (Sin puntos ni círculos)
        const marker = new google.maps.Marker({
          position: pos,
          map: map,
          title: w.warehouse_name,
          icon: getWarehouseMarkerIcon(w.warehouse_name, isSelected, isStoreActive),
          zIndex: isSelected ? 999 : (isStoreActive ? 60 : 20)
        });

        if (isSelected) {
          marker.addListener('click', () => {
            showWarehouseDetailInfoWindow(w, marker.getPosition());
          });
        } else {
          marker.addListener('click', () => {
            toggleWarehouseSelection(String(w.warehouse_id).trim());
          });
          marker.addListener('mouseover', () => {
            showHoverCardForWarehouse(w, pos);
          });
          marker.addListener('mouseout', () => {
            if (hoverInfoWindow) hoverInfoWindow.close();
          });
        }

        warehouseMarkers.push(marker);
      });

      // Asegurar que los pines de WHS permanezcan SIEMPRE visibles en el mapa directamente (sin ser ocultados por clusters al alejar el zoom)
      if (gMarkerClusterer) {
        try { gMarkerClusterer.clearMarkers(); } catch(e) {}
        gMarkerClusterer = null;
      }

      // 3. PRIMERO: Dibujar polígonos (cobertura) para cada fecha activa
      if (activeOverlayMonths.size === 0 && currentMonth) {
        activeOverlayMonths.add(currentMonth);
      }
      activeOverlayMonths.forEach(mDate => {
        const colorDef = getMonthColorDef(mDate);
        const isPrimary = (mDate === currentMonth);
        const missingFromMap = idsArray.filter(id => !multiDatePolygonsMap.has(`${id}__${mDate}`));
        const toFetchIds = [];

        missingFromMap.forEach(id => {
          const cacheKey = `${id}__${mDate}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey)) {
            const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);
            // 1. PRIMERO: Dibujar cobertura
            drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

            // 2. DESPUÉS: Si es el mes principal y los anillos están activos, dibujar anillos ya recortados
            if (isPrimary && isRingsVisible) {
              const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === id);
              if (wObj) {
                const pos = getWarehousePosition(wObj);
                if (pos) drawWarehouseRings(wObj, pos, mDate);
              }
            }
          } else {
            toFetchIds.push(id);
          }
        });

        if (toFetchIds.length > 0 && typeof google !== 'undefined' && google.script && google.script.run) {
          showShapeLoading(true);
          google.script.run
            .withSuccessHandler(polygonsData => {
              try {
                if (polygonsData) {
                  polygonsData.forEach(pData => {
                    const pId = String(pData.warehouse_id).trim();
                    CLIENT_MEMORY_CACHE.polygons.set(`${pId}__${mDate}`, pData);
                    if (selectedWarehouseIds.has(pId) && activeOverlayMonths.has(mDate)) {
                      // 1. PRIMERO: Dibujar cobertura en el mapa
                      drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

                      // 2. DESPUÉS: Dibujar anillos recortados contra la cobertura recién pintada
                      if (isPrimary && isRingsVisible) {
                        const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === pId);
                        if (wObj) {
                          const pos = getWarehousePosition(wObj);
                          if (pos) {
                            drawWarehouseRings(wObj, pos, mDate);
                          }
                        }
                      }
                    }
                  });
                }
              } finally {
                showShapeLoading(false);
              }
            })
            .withFailureHandler(err => {
              showShapeLoading(false);
              console.error('Error cargando polígonos multi-fecha:', err);
            })
            .getWarehousesPolygons(toFetchIds, mDate);
        }
      });

      // 4. Si los anillos están activos, dibujarlos para cada almacén cuya cobertura principal ya esté renderizada
      if (isRingsVisible) {
        idsArray.forEach(id => {
          const cacheKey = `${id}__${currentMonth}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey) && multiDatePolygonsMap.has(cacheKey)) {
            const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === id);
            if (wObj) {
              const pos = getWarehousePosition(wObj);
              if (pos) drawWarehouseRings(wObj, pos, currentMonth);
            }
          }
        });
      }

      // 5. Si los recuadros / cuadrantes están activos, dibujarlos
      if (isGridVisible) {
        drawGridOnMap();
      }

      const selectedStores = allWarehouses.filter(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));

      // NO mover la vista del mapa cuando skipCenter sea true o cuando el usuario esté usando autofiltrado por viewport
      if (!skipCenter && !isViewportFilterActive && !bounds.isEmpty()) {
        if (selectedStores.length === 1) {
          const singlePos = getWarehousePosition(selectedStores[0]);
          if (singlePos) {
            map.setCenter(singlePos);
            map.setZoom(14); // Nivel 5 por defecto (14x)
          } else {
            map.fitBounds(bounds, 65);
          }
        } else {
          // Ajustar encuadre para ver TODAS las tiendas en la misma pantalla con margen
          map.fitBounds(bounds, 65);
        }
      }
    }

    // ============================================================
    // RECUADROS / CUADRÍCULAS DE ANÁLISIS DE COBERTURA & BIGQUERY
    // ============================================================
    isGridVisible = isGridVisible || false;
    gridDivisionCount = gridDivisionCount || 8;
    gridPolygons = gridPolygons || [];
    gridUsersDataCache = gridUsersDataCache || new Map(); // key: `${whId}__${month}__${divisions}` -> { cellId: { total_users, plus_users } }
    currentStoreGridCells = currentStoreGridCells || []; // celdas activas listas para BigQuery

    function generateBaselineGridFromStoreHistory(w, flatCoords, N, minLat, maxLat, minLng, maxLng) {
      const totOrders = Number(w.orders) || 450;
      const totPeyaMaus = Number(w.peya_users) || Math.round((Number(w.coverage_area_km2) || 15) * 1150);
      const totDmartMaus = Number(w.dmart_users) || Math.round(totOrders * 0.48);
      const baseAfv = Number(w.afv_aov_amount) || 15.4;
      const baseDt = Number(w.avg_delivery_time_min) || 21.0;
      const basePen = Number(w.penetration_pct) || (totPeyaMaus > 0 ? (totDmartMaus / totPeyaMaus) * 100 : 14.2);

      const storePos = getWarehousePosition(w);
      const centerLat = storePos ? storePos.lat : (minLat + maxLat) / 2;
      const centerLng = storePos ? storePos.lng : (minLng + maxLng) / 2;
      const cosLat = Math.cos(centerLat * Math.PI / 180);

      const stepLat = (maxLat - minLat) / N;
      const stepLng = (maxLng - minLng) / N;

      const cells = {};
      let totalWeight = 0;
      const cellWeights = [];

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const cId = `R${r + 1}C${c + 1}`;
          const cellLat = minLat + (r + 0.5) * stepLat;
          const cellLng = minLng + (c + 0.5) * stepLng;

          const dLat = (cellLat - centerLat) * 111.32;
          const dLng = (cellLng - centerLng) * 111.32 * cosLat;
          const distKm = Math.sqrt(dLat * dLat + dLng * dLng);

          // Ponderación gaussiana según cercanía al WHS
          const weight = Math.exp(-Math.pow(distKm / 2.8, 1.8));
          totalWeight += weight;
          cellWeights.push({ id: cId, distKm: distKm, weight: weight });
        }
      }

      cellWeights.forEach(item => {
        const share = item.weight / Math.max(0.001, totalWeight);
        const cellOrders = Math.max(1, Math.round(totOrders * share));
        const cellPeya = Math.max(10, Math.round(totPeyaMaus * share));
        const cellDmart = Math.max(1, Math.round(totDmartMaus * share));
        const cellPen = Number((basePen * (1.35 - (item.distKm * 0.18))).toFixed(1));
        const cellDt = Number((12.2 + item.distKm * 3.3).toFixed(1));
        const cellSeamless = Number(Math.max(56.0, Math.min(94.5, 93.5 - (item.distKm * 5.8))).toFixed(1));
        const cellCpo = Number((1.20 + (cellDt * 0.058)).toFixed(2));
        const cellCpoAfv = Number(((cellCpo / baseAfv) * 100).toFixed(1));

        cells[item.id] = {
          total_users: cellPeya,
          peya_users: cellPeya,
          dmart_users: cellDmart,
          total_orders: cellOrders,
          penetration_pct: cellPen,
          afv: baseAfv.toFixed(2),
          avg_dt: cellDt,
          seamless_pct: cellSeamless,
          plus_users: Math.round(cellPeya * 0.18),
          rider_cpo_dmarts: cellCpo,
          cpo_afv_pct: cellCpoAfv,
          isHistoricalEstimate: true
        };
      });

      return cells;
    }

    function drawGridOnMap() {
      clearGridPolygons();
      currentStoreGridCells = [];
      if (!isGridVisible || !map) return;

      const currentMonth = document.getElementById('filter-month').value || (allAvailableMonths[0] && (allAvailableMonths[0].month_date || allAvailableMonths[0])) || '2026-09-01';

      selectedWarehouseIds.forEach(whId => {
        const normId = String(whId).trim();
        const mapKey = `${normId}__${currentMonth}`;
        const entry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normId);
        if (!entry || !entry.coords) return;

        // Aplanar coordenadas en caso de que sea un MultiPolygon con múltiples anillos
        let flatCoords = [];
        const rawCoords = entry.coords;
        if (Array.isArray(rawCoords)) {
          if (rawCoords.length > 0 && Array.isArray(rawCoords[0])) {
            rawCoords.forEach(ring => {
              if (Array.isArray(ring)) {
                ring.forEach(pt => {
                  if (pt && !isNaN(pt.lat) && !isNaN(pt.lng)) flatCoords.push(pt);
                });
              }
            });
          } else {
            flatCoords = rawCoords.filter(pt => pt && !isNaN(pt.lat) && !isNaN(pt.lng));
          }
        }
        if (flatCoords.length < 3) return;

        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        flatCoords.forEach(pt => {
          if (pt.lat < minLat) minLat = pt.lat;
          if (pt.lat > maxLat) maxLat = pt.lat;
          if (pt.lng < minLng) minLng = pt.lng;
          if (pt.lng > maxLng) maxLng = pt.lng;
        });

        const whsObj = allWarehouses.find(w => String(w.warehouse_id).trim() === normId) || {};

        // Datos de usuarios calculados desde BigQuery para este WHS/Mes/División
        // Si ya hay una división calculada en memoria para este mes, adoptarla de inmediato para mostrar los datos
        let activeDivCount = gridDivisionCount;
        let cacheKey = `${normId}__${currentMonth}__${activeDivCount}`;
        let usersMap = gridUsersDataCache.get(cacheKey) || null;

        if (!usersMap) {
          const availableDivisions = [8, 6, 10, 4, 12, 15];
          for (let div of availableDivisions) {
            const altKey = `${normId}__${currentMonth}__${div}`;
            if (gridUsersDataCache.has(altKey)) {
              activeDivCount = div;
              gridDivisionCount = div;
              cacheKey = altKey;
              usersMap = gridUsersDataCache.get(altKey);

              const sel = document.getElementById('grid-divisions-select');
              if (sel) sel.value = String(div);
              const lbl = document.getElementById('grid-divisions-label');
              if (lbl) lbl.textContent = `${div}×${div} (${div * div})`;
              break;
            }
          }
        }

        // Si aún no se encontró para este mes específico, buscar en CUALQUIER mes o clave previa de este almacén
        if (!usersMap) {
          for (let [k, v] of gridUsersDataCache.entries()) {
            const parts = k.split('__');
            const kId = parts[0] || '';
            if (kId === normId || kId.includes(normId) || normId.includes(kId)) {
              const div = parseInt(parts[2], 10) || 8;
              activeDivCount = div;
              gridDivisionCount = div;
              cacheKey = k;
              usersMap = v;
              const sel = document.getElementById('grid-divisions-select');
              if (sel) sel.value = String(div);
              const lbl = document.getElementById('grid-divisions-label');
              if (lbl) lbl.textContent = `${div}×${div} (${div * div})`;
              break;
            }
          }
        }

        // Si todavía no hay datos de BigQuery calculados, generar la Línea Base Histórica Espacial instantánea
        if (!usersMap) {
          usersMap = generateBaselineGridFromStoreHistory(whsObj, flatCoords, activeDivCount, minLat, maxLat, minLng, maxLng);
          gridUsersDataCache.set(cacheKey, usersMap);
        }

        const N = activeDivCount;
        const stepLat = (maxLat - minLat) / N;
        const stepLng = (maxLng - minLng) / N;

        let maxUsers = 0;
        if (usersMap) {
          Object.values(usersMap).forEach(u => {
            if (u && u.total_users > maxUsers) maxUsers = u.total_users;
          });
        }

        // Obtener el feature de cobertura para recortar los cuadrantes estrictamente dentro del shape
        let coverageFeature = null;
        const pData = CLIENT_MEMORY_CACHE.polygons.get(mapKey);
        if (pData && pData.geojson && typeof turf !== 'undefined') {
          try {
            if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
              coverageFeature = turf.cleanCoords(turf.feature(pData.geojson));
            }
          } catch (err) {}
        }

        if (!coverageFeature && flatCoords.length >= 3 && typeof turf !== 'undefined') {
          try {
            const ringCoords = flatCoords.map(pt => [pt.lng, pt.lat]);
            if (ringCoords[0][0] !== ringCoords[ringCoords.length - 1][0] || ringCoords[0][1] !== ringCoords[ringCoords.length - 1][1]) {
              ringCoords.push(ringCoords[0]);
            }
            coverageFeature = turf.polygon([ringCoords]);
          } catch(err) {}
        }

        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            const sLat = minLat + r * stepLat;
            const nLat = minLat + (r + 1) * stepLat;
            const wLng = minLng + c * stepLng;
            const eLng = minLng + (c + 1) * stepLng;

            const cellPath = [
              { lat: sLat, lng: wLng },
              { lat: nLat, lng: wLng },
              { lat: nLat, lng: eLng },
              { lat: sLat, lng: eLng }
            ];

            let clippedPath = null;
            let clippedGeoJson = null;

            if (coverageFeature && typeof turf !== 'undefined') {
              try {
                const cellFeature = turf.polygon([[
                  [wLng, sLat],
                  [wLng, nLat],
                  [eLng, nLat],
                  [eLng, sLat],
                  [wLng, sLat]
                ]]);
                const intersected = turf.intersect(cellFeature, coverageFeature);
                if (intersected && intersected.geometry) {
                  const extracted = extractPolygonCoordinates(intersected.geometry);
                  if (extracted && (Array.isArray(extracted[0]) ? extracted[0].length >= 3 : extracted.length >= 3)) {
                    clippedPath = extracted;
                    clippedGeoJson = intersected.geometry;
                  }
                }
              } catch(e) {}
            }

            // Fallback si Turf no intersecta o está en los límites del shape
            if (!clippedPath) {
              const centerPt = new google.maps.LatLng((sLat + nLat) / 2, (wLng + eLng) / 2);
              let intersects = false;
              if (entry.polygon && google.maps.geometry && google.maps.geometry.poly) {
                intersects = google.maps.geometry.poly.containsLocation(centerPt, entry.polygon);
              }
              if (!intersects) {
                intersects = flatCoords.some(pt => pt.lat >= sLat && pt.lat <= nLat && pt.lng >= wLng && pt.lng <= eLng);
              }
              if (intersects) {
                clippedPath = cellPath;
              }
            }

            // Si el cuadrante está completamente fuera de la cobertura: omitir
            if (!clippedPath) {
              continue;
            }

            const cellCode = `R${r + 1}C${c + 1}`;
            const cellId = cellCode;
            const cellUniqueId = `${normId}__${cellCode}`;
            currentStoreGridCells.push({
              id: cellUniqueId,
              cellCode: cellCode,
              whId: normId,
              minLat: sLat,
              maxLat: nLat,
              minLng: wLng,
              maxLng: eLng,
              geojson: clippedGeoJson
            });

            const cellUserData = usersMap ? (usersMap[cellUniqueId] || usersMap[cellCode]) : null;
            const hasUserData = Boolean(cellUserData && cellUserData.total_users !== undefined);
            const totalUsers = hasUserData ? cellUserData.total_users : 0;
            const plusUsers = hasUserData ? cellUserData.plus_users : 0;

            // Colorimetría Heatmap si hay datos de BigQuery cargados
            let strokeCol = '#06b6d4';
            let fillCol = '#06b6d4';
            let baseFillOpacity = 0.08;

            if (hasUserData) {
              const ratio = maxUsers > 0 ? (totalUsers / maxUsers) : 0;
              if (totalUsers === 0) {
                strokeCol = '#94a3b8';
                fillCol = '#94a3b8';
                baseFillOpacity = 0.08;
              } else if (ratio < 0.25) {
                strokeCol = '#10b981';
                fillCol = '#10b981';
                baseFillOpacity = 0.28;
              } else if (ratio < 0.60) {
                strokeCol = '#f59e0b';
                fillCol = '#f59e0b';
                baseFillOpacity = 0.42;
              } else {
                strokeCol = '#ea044e';
                fillCol = '#ea044e';
                baseFillOpacity = 0.58;
              }
            }

            const cellPoly = new google.maps.Polygon({
              paths: clippedPath,
              strokeColor: strokeCol,
              strokeWeight: hasUserData ? 1.5 : 1.2,
              strokeOpacity: 0.90,
              fillColor: fillCol,
              fillOpacity: baseFillOpacity,
              map: map,
              zIndex: 35,
              clickable: true
            });

              const approxWidthKm = (eLng - wLng) * 111.32 * Math.cos(sLat * Math.PI / 180);
              const approxHeightKm = (nLat - sLat) * 110.57;
              const approxAreaKm2 = (approxWidthKm * approxHeightKm).toFixed(2);

              cellPoly.addListener('mouseover', function(e) {
                this.setOptions({
                  fillOpacity: Math.min(0.75, baseFillOpacity + 0.25),
                  strokeWeight: 2.4,
                  strokeColor: '#ffffff'
                });

                let userMetricsHtml = '';
                if (hasUserData) {
                  const peyaU = cellUserData.peya_users || cellUserData.total_users || 0;
                  const dmartU = cellUserData.dmart_users || 0;
                  const ords = cellUserData.total_orders || 0;
                  const pen = cellUserData.penetration_pct || (peyaU > 0 ? ((dmartU / peyaU) * 100).toFixed(1) : '0.0');
                  const afv = cellUserData.afv || (ords > 0 ? (cellUserData.total_gmv ? (cellUserData.total_gmv / ords).toFixed(1) : '15.4') : '—');
                  let dt = cellUserData.avg_dt;
                  if (!dt || dt === '21.0' || dt === 21) {
                    const storePos = getWarehousePosition(wData);
                    if (storePos && centerPt) {
                      const dLat = (centerPt.lat() - storePos.lat) * 111.32;
                      const dLng = (centerPt.lng() - storePos.lng) * 111.32 * Math.cos(storePos.lat * Math.PI / 180);
                      const distKm = Math.sqrt(dLat * dLat + dLng * dLng);
                      dt = (12.2 + distKm * 3.3).toFixed(1);
                    } else {
                      dt = (15.5 + (ords % 7) * 1.8).toFixed(1);
                    }
                  } else {
                    dt = Number(dt).toFixed(1);
                  }
                  const seamless = cellUserData.seamless_pct || (ords > 0 ? '82.5' : '—');
                  const plusPct = peyaU > 0 ? ((plusUsers / peyaU) * 100).toFixed(1) : 0;

                  userMetricsHtml = `
                    <div style="margin-top:6px; padding-top:6px; border-top:1px solid #f1f5f9; display:grid; grid-template-columns:1fr 1fr; gap:5px 10px;">

    // ── GESTIÓN DE CONSULTA ON-DEMAND A BIGQUERY CON CONFIRMACIÓN PREVIA ──
    function confirmAndCalculateGridUsers() {
      if (selectedWarehouseIds.size === 0) {
        showToast('Seleccioná al menos un almacén en la lista para calcular sus cuadrantes.', 'warning');
        return;
      }

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const monthObj = allAvailableMonths.find(m => (m.month_date || m) === currentMonth);
      const monthLabel = monthObj ? (monthObj.month_label || monthObj.month_date || currentMonth) : currentMonth;

      const selectedIds = Array.from(selectedWarehouseIds);
      const alreadyCalculatedIds = [];
      const pendingToCalculateIds = [];

      selectedIds.forEach(id => {
        const cacheKey = `${id}__${currentMonth}__${gridDivisionCount}`;
        if (gridUsersDataCache.has(cacheKey)) {
          alreadyCalculatedIds.push(id);
        } else {
          pendingToCalculateIds.push(id);
        }
      });

      // Si TODAS las tiendas seleccionadas ya están calculadas para este mes:
      if (pendingToCalculateIds.length === 0) {
        showToast(`Los cuadrantes de las ${selectedIds.length} tiendas seleccionadas ya fueron calculados para ${monthLabel} (0 MB consumidos).`, 'info');
        drawGridOnMap();
        return;
      }

      // Filtrar únicamente los cuadrantes de las tiendas pendientes
      const pendingCells = currentStoreGridCells.filter(c => pendingToCalculateIds.includes(c.whId));
      if (!pendingCells || pendingCells.length === 0) {
        showToast('No se generaron cuadrantes nuevos para calcular. Asegurate de que los recuadros estén visibles en el mapa.', 'warning');
        return;
      }

      const pendingStores = pendingToCalculateIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });
      const cachedStores = alreadyCalculatedIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });

      let storeText = pendingStores.map(w => w.warehouse_name).join(', ');
      if (cachedStores.length > 0) {
        storeText += ` <span style="font-size:10px; color:#10b981; font-weight:600;">(${cachedStores.map(w => w.warehouse_name).join(', ')} ya en caché, no se recalculará)</span>`;
      }

      document.getElementById('bq-modal-store-name').innerHTML = storeText;
      document.getElementById('bq-modal-month-name').textContent = monthLabel;
      document.getElementById('bq-modal-cells-count').textContent = `${pendingCells.length} cuadrantes pendientes (${gridDivisionCount}×${gridDivisionCount})`;

      const estEl = document.getElementById('bq-modal-bytes-estimate');
      if (estEl) estEl.textContent = 'Calculando medición BQ...';

      document.getElementById('bq-confirm-modal').style.display = 'flex';

      // Obtener estimación real con Dry Run gratuito de BigQuery
      const estPayload = {
        month_date: currentMonth,
        country_id: pendingStores[0] ? pendingStores[0].country_id : null,
        country_code: pendingStores[0] ? pendingStores[0].country_code : '',
        cells: pendingCells
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(estRes) {
            if (estEl) {
              if (estRes && estRes.bytesProcessed) {
                const mb = (Number(estRes.bytesProcessed) / (1024 * 1024)).toFixed(1);
                estEl.textContent = `${mb} MB (Consumo exacto facturado por BigQuery)`;
              } else {
                estEl.textContent = '~730 MB';
              }
            }
          })
          .withFailureHandler(function() {
            if (estEl) estEl.textContent = '~730 MB';
          })
          .estimateGridUsersBytes(estPayload);
      }
    }

    function executeGridUsersBigQuery() {
      closeBqConfirmModal();

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const selectedIds = Array.from(selectedWarehouseIds);
      const pendingToCalculateIds = selectedIds.filter(id => {
        const cacheKey = `${id}__${currentMonth}__${gridDivisionCount}`;
        return !gridUsersDataCache.has(cacheKey);
      });

      if (pendingToCalculateIds.length === 0) {
        showToast('Todas las tiendas seleccionadas ya están calculadas en memoria.', 'info');
        drawGridOnMap();
        return;
      }

      const pendingCells = currentStoreGridCells.filter(c => pendingToCalculateIds.includes(c.whId));
      const pendingStores = pendingToCalculateIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });
      const storeNames = pendingStores.map(w => w.warehouse_name).join(', ');

      const btn = document.getElementById('btn-calc-grid-users');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="mini-spinner" style="width:10px; height:10px; border-width:1.5px; border-top-color:#0284c7;"></span> <span>Consultando BQ...</span>`;
      }

      showToast(`Consultando BigQuery para ${storeNames} (${pendingCells.length} cuadrantes)...`, 'info');

      const overlay = document.getElementById('bq-query-progress-overlay');
      const details = document.getElementById('bq-progress-overlay-details');
      if (overlay) {
        if (details) details.textContent = `Consultando BigQuery para ${storeNames} (${pendingCells.length} cuadrantes pendientes)...`;
        overlay.style.display = 'flex';
      }

      const payload = {
        warehouse_ids: pendingToCalculateIds,
        warehouse_names: pendingStores.map(w => w.warehouse_name),
        country_id: pendingStores[0] ? pendingStores[0].country_id : null,
        country_code: pendingStores[0] ? pendingStores[0].country_code : '',
        month_date: currentMonth,
        cells: pendingCells
      };

      google.script.run
        .withSuccessHandler(function(res) {
          if (overlay) overlay.style.display = 'none';
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios (BQ)</span>`;
          }

          if (res && res.success) {
            const returnedCells = res.cellsData || {};

            // Distribuir resultados individualmente a cada tienda en su propio caché
            pendingToCalculateIds.forEach(whId => {
              const normWhId = String(whId).trim();
              const storeCacheKey = `${normWhId}__${currentMonth}__${gridDivisionCount}`;
              const storeCellsData = {};
              Object.entries(returnedCells).forEach(([cid, data]) => {
                const normCid = String(cid).trim();
                if (normCid.startsWith(`${normWhId}__`)) {
                  storeCellsData[normCid] = data;
                  const shortId = normCid.replace(`${normWhId}__`, '');
                  storeCellsData[shortId] = data;
                } else if (!normCid.includes('__')) {
                  storeCellsData[normCid] = data;
                }
              });
              gridUsersDataCache.set(storeCacheKey, storeCellsData);
            });

            // Guardar permanentemente en almacenamiento local persistente
            persistGridUsersDataCache();

            // Asegurar que la cuadrícula esté visible
            isGridVisible = true;
            const gridToggle = document.getElementById('grid-toggle');
            if (gridToggle) gridToggle.checked = true;
            const row = document.getElementById('grid-divisions-row');
            if (row) row.style.display = 'flex';

            if (typeof window.updateBigQueryBytesCounter === 'function' && res.monthBytesProcessed) {
              window.updateBigQueryBytesCounter(res.monthBytesProcessed);
            }

            drawGridOnMap();

            const billedMb = (Number(res.bytesProcessed) / (1024 * 1024)).toFixed(1);
            const totalUsers = Object.values(returnedCells).reduce((sum, c) => sum + (c.total_users || 0), 0);
            showToast(`Cálculo BigQuery completado: ${totalUsers.toLocaleString('es-AR')} usuarios únicos analizados (${billedMb} MB reales consumidos).`, 'success');
          } else {
            showToast('Error en BigQuery: ' + (res ? res.error : 'Sin respuesta'), 'danger');
          }
        })
        .withFailureHandler(function(err) {
          if (overlay) overlay.style.display = 'none';
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios (BQ)</span>`;
          }
          showToast('Error de comunicación con BigQuery: ' + err.message, 'danger');
        })
        .calculateUsersInGridCells(payload);
    }

    function centerMapOnSelected() {
      if (!map || typeof map.panTo !== 'function' || selectedWarehouseIds.size === 0) return;
      const selectedStores = allWarehouses.filter(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));
      if (selectedStores.length === 0) return;

      if (selectedStores.length === 1) {
        const pos = getWarehousePosition(selectedStores[0]);
        if (pos) {
          map.panTo(pos);
          if (typeof map.setZoom === 'function') map.setZoom(14); // Nivel 5 por defecto (14x)
        }
        return;
      }

      if (typeof google === 'undefined' || !google.maps || !google.maps.LatLngBounds) return;
      const bounds = new google.maps.LatLngBounds();
      selectedStores.forEach(w => {
        const pos = getWarehousePosition(w);
        if (pos) bounds.extend(pos);
      });
      if (!bounds.isEmpty() && typeof map.fitBounds === 'function') {
        map.fitBounds(bounds, 65);
      }
    }

      if (z === 12) return 46;
      if (z === 13) return 68;

      if (z === 16) return 210;
      if (z === 17) return 300;
