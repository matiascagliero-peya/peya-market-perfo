    function extractPolygonCoordinates(geojson) {
      if (!geojson || !geojson.coordinates) return [];
      
      let ring = null;
      if (geojson.type === 'MultiPolygon') {
        let maxLen = 0;
        if (Array.isArray(geojson.coordinates)) {
          geojson.coordinates.forEach(poly => {
            if (Array.isArray(poly) && poly.length > 0 && Array.isArray(poly[0])) {
              if (poly[0].length > maxLen) {
                maxLen = poly[0].length;
                ring = poly[0];
              }
            }
          });
        }
      } else if (geojson.type === 'Polygon') {
        ring = Array.isArray(geojson.coordinates) ? geojson.coordinates[0] : null;
      } else if (Array.isArray(geojson.coordinates)) {
        let curr = geojson.coordinates;
        while (Array.isArray(curr) && curr.length > 0 && Array.isArray(curr[0]) && Array.isArray(curr[0][0])) {
          curr = curr[0];
        }
        ring = curr;
      }

      if (!ring || !Array.isArray(ring)) return [];

      return ring.map(coord => ({
        lat: Number(coord[1]),
        lng: Number(coord[0])
      })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
    }

    function arePathsEqual(pathA, pathB) {
      if (!pathA || !pathB) return false;
      if (pathA.length !== pathB.length) return false;
      for (let i = 0; i < pathA.length; i++) {
        if (Math.abs(pathA[i].lat - pathB[i].lat) > 0.00005 || Math.abs(pathA[i].lng - pathB[i].lng) > 0.00005) {
          return false;
        }
      }
      return true;
    }

    // Remuestreo de puntos equidistantes
    function resamplePath(coords, targetCount) {
      if (!coords || coords.length < 3) return coords || [];
      const pts = [...coords];
      const first = pts[0];
      const last = pts[pts.length - 1];
      if (first.lat !== last.lat || first.lng !== last.lng) {
        pts.push({ lat: first.lat, lng: first.lng });
      }

      const dists = [0];
      let totalDist = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const d = Math.hypot(pts[i+1].lat - pts[i].lat, pts[i+1].lng - pts[i].lng);
        totalDist += d;
        dists.push(totalDist);
      }
      if (totalDist === 0) return pts.slice(0, targetCount);

      const resampled = [];
      const step = totalDist / targetCount;
      let segIdx = 0;

      for (let i = 0; i < targetCount; i++) {
        const targetD = i * step;
        while (segIdx < dists.length - 2 && dists[segIdx + 1] < targetD) {
          segIdx++;
        }
        const segStartD = dists[segIdx];
        const segEndD = dists[segIdx + 1];
        const segLen = segEndD - segStartD;
        const t = segLen > 0 ? (targetD - segStartD) / segLen : 0;
        const p1 = pts[segIdx];
        const p2 = pts[segIdx + 1];
        resampled.push({
          lat: p1.lat + (p2.lat - p1.lat) * t,
          lng: p1.lng + (p2.lng - p1.lng) * t
        });
      }
      return resampled;
    }

    // Alineación matemática de vértices por mínima distancia para eliminar giros o rotaciones
    function alignPolygonPaths(pathA, pathB) {
      const N = pathA.length;
      let bestShift = 0;
      let bestDist = Infinity;
      for (let s = 0; s < N; s++) {
        let dist = 0;
        for (let i = 0; i < N; i++) {
          const pA = pathA[i];
          const pB = pathB[(i + s) % N];
          dist += Math.hypot(pA.lat - pB.lat, pA.lng - pB.lng);
        }
        if (dist < bestDist) {
          bestDist = dist;
          bestShift = s;
        }
      }
      const alignedB = [];
      for (let i = 0; i < N; i++) {
        alignedB.push(pathB[(i + bestShift) % N]);
      }
      return { pathA, pathB: alignedB };
    }

    // Extrae ÚNICAMENTE los polígonos que corresponden a las áreas que se modificaron
    function extractDifferencePolygons(pathA, pathB, thresholdMeters = 30) {
      if (!pathA || !pathB || pathA.length !== pathB.length) return [];
      const N = pathA.length;
      const dists = [];

      for (let i = 0; i < N; i++) {
        const dLat = (pathA[i].lat - pathB[i].lat) * 111320;
        const dLng = (pathA[i].lng - pathB[i].lng) * 111320 * Math.cos(pathA[i].lat * Math.PI / 180);
        dists.push(Math.hypot(dLat, dLng));
      }

      const ranges = [];
      let inRange = false;
      let startIdx = 0;

      for (let i = 0; i < N; i++) {
        if (dists[i] >= thresholdMeters) {
          if (!inRange) {
            inRange = true;
            startIdx = i;
          }
        } else {
          if (inRange) {
            inRange = false;
            if (i - startIdx >= 2) {
              ranges.push({ start: startIdx, end: i - 1 });
            }
          }
        }
      }
      if (inRange && (N - startIdx >= 2)) {
        ranges.push({ start: startIdx, end: N - 1 });
      }

      // Si casi toda la cobertura cambió, envolver ambas
      if (ranges.length === 1 && (ranges[0].end - ranges[0].start) > N * 0.8) {
        const patch = [...pathA];
        for (let i = pathB.length - 1; i >= 0; i--) {
          patch.push(pathB[i]);
        }
        return [patch];
      }

      const patches = [];
      ranges.forEach(r => {
        const patch = [];
        for (let i = r.start; i <= r.end; i++) {
          patch.push(pathA[i]);
        }
        for (let i = r.end; i >= r.start; i--) {
          patch.push(pathB[i]);
        }
        if (patch.length >= 3) {
          patches.push(patch);
        }
      });

      return patches;
    }

    // Animación de desplazamiento elástico y fluido de los bordes (140 vértices)
    function animatePolygonTransition(polygon, oldCoords, newCoords, onComplete) {
      if (!polygon || !oldCoords || !newCoords) return;
      const N = 140; // Mayor fidelidad para curvas y manzanas urbanas
      const rawA = resamplePath(oldCoords, N);
      const rawB = resamplePath(newCoords, N);
      const { pathA, pathB } = alignPolygonPaths(rawA, rawB);

      const startTime = performance.now();
      const durationMs = 1100; // 1.1s de desplazamiento natural y orgánico

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // Deceleración orgánica cuártica (suave al frenar)
        const ease = 1 - Math.pow(1 - progress, 4);

        // Resaltado dinámico del borde en movimiento
        const strokeW = 3.2 - (0.8 * progress);
        const strokeOp = 0.95 + (0.05 * Math.sin(progress * Math.PI));

        polygon.setOptions({
          strokeColor: '#990334',
          strokeWeight: strokeW,
          strokeOpacity: strokeOp,
          fillColor: '#660221',
          fillOpacity: 0.18 + (0.04 * (1 - progress)),
          zIndex: 3
        });

        const currentPath = [];
        for (let i = 0; i < N; i++) {
          currentPath.push({
            lat: pathA[i].lat + (pathB[i].lat - pathA[i].lat) * ease,
            lng: pathA[i].lng + (pathB[i].lng - pathA[i].lng) * ease
          });
        }
        polygon.setPath(currentPath);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          polygon.setPath(newCoords);
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(step);
    }

    // Titila ÚNICAMENTE el área modificada (parche) durante 1.3 segundos
    function pulseModifiedDifferencePatch(diffPoly, durationMs = 1300) {
      if (!diffPoly) return;
      const startTime = performance.now();

      function stepPulse(now) {
        const elapsed = now - startTime;
        if (elapsed > durationMs) {
          diffPoly.setMap(null);
          const idx = activeDiffPolygons.indexOf(diffPoly);
          if (idx >= 0) activeDiffPolygons.splice(idx, 1);
          return;
        }

        const t = (elapsed / 1000) * 2.5;
        const wave = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);

        diffPoly.setOptions({
          strokeColor: '#80022a',
          strokeWeight: 2.2 + 1.8 * wave,
          strokeOpacity: 0.9 + 0.1 * wave,
          fillColor: '#660221',
          fillOpacity: 0.22 + 0.25 * wave
        });

        requestAnimationFrame(stepPulse);
      }

      requestAnimationFrame(stepPulse);
    }

    function processPolygonsComparison(polygonsData, newMonth) {
      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      let anyChanged = false;

      clearActiveDiffPolygons();

      polygonsData.forEach(pData => {
        if (!pData || !pData.geojson || !pData.geojson.coordinates) return;

        const normWhId = String(pData.warehouse_id).trim();
        if (!selectedWarehouseIds.has(normWhId)) return;

        CLIENT_MEMORY_CACHE.polygons.set(`${normWhId}__${newMonth}`, pData);

        const newCoords = extractPolygonCoordinates(pData.geojson);
        if (!newCoords || newCoords.length < 3) return;

        const entry = activePolygonsMap.get(normWhId);

        if (entry && entry.polygon && entry.coords && entry.coords.length > 0) {
          const oldCoords = entry.coords;
          const hasDifference = !arePathsEqual(oldCoords, newCoords);

          if (hasDifference) {
            anyChanged = true;

            // 1. Capa fantasma fija: Mes Anterior en azul cian contrastante
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
            }
            const ghost = new google.maps.Polygon({
              paths: oldCoords,
              strokeColor: '#0284c7',
              strokeOpacity: 0.95,
              strokeWeight: 2.8,
              fillColor: '#0284c7',
              fillOpacity: 0.12,
              map: map,
              zIndex: 1,
              clickable: false
            });
            entry.ghostPolygon = ghost;

            // 2. Extraer ÚNICAMENTE las partes modificadas
            const N = 80;
            const rawA = resamplePath(oldCoords, N);
            const rawB = resamplePath(newCoords, N);
            const { pathA, pathB } = alignPolygonPaths(rawA, rawB);
            const diffPatches = extractDifferencePolygons(pathA, pathB, 30);

            // 3. Mover suavemente la forma hacia las nuevas coordenadas (sin rotaciones)
            animatePolygonTransition(entry.polygon, oldCoords, newCoords, () => {
              // El polígono principal NO titila, queda estático en rojo oficial
              entry.polygon.setOptions({
                strokeColor: '#ea044e',
                strokeWeight: 2.2,
                strokeOpacity: 0.9,
                fillColor: '#ea044e',
                fillOpacity: 0.16
              });

              // Titilan ÚNICAMENTE las zonas que se agregaron o retiraron
              if (diffPatches && diffPatches.length > 0) {
                diffPatches.forEach(patchCoords => {
                  const diffPoly = new google.maps.Polygon({
                    paths: patchCoords,
                    strokeColor: '#80022a',
                    strokeWeight: 2.8,
                    strokeOpacity: 1,
                    fillColor: '#660221',
                    fillOpacity: 0.35,
                    map: map,
                    zIndex: 10,
                    clickable: false
                  });
                  activeDiffPolygons.push(diffPoly);
                  pulseModifiedDifferencePatch(diffPoly, 1300);
                });
              }
            });

            entry.coords = newCoords;
            entry.month = newMonth;
          } else {
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
              entry.ghostPolygon = null;
            }
            entry.month = newMonth;
          }
        } else {
          // Si no existía, dibujarlo de inmediato
          const polygon = new google.maps.Polygon({
            paths: newCoords,
            strokeColor: '#ea044e',
            strokeOpacity: 0.9,
            strokeWeight: 2.2,
            fillColor: '#ea044e',
            fillOpacity: 0.16,
            map: map,
            zIndex: 2
          });
          const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === normWhId);
          bindPolygonEvents(polygon, whsObj);

          activePolygonsMap.set(normWhId, {
            polygon: polygon,
            ghostPolygon: null,
            coords: newCoords,
            month: newMonth
          });
        }
      });

      if (banner && bannerText) {
        if (anyChanged) {
          bannerText.innerHTML = `Comparación de Cobertura: <span style="display:inline-block; width:12px; height:3px; background:#0284c7; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#38bdf8;">Mes Anterior</strong> vs <span style="display:inline-block; width:12px; height:3px; background:#ea044e; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#ea044e;">Mes Seleccionado</strong> <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:1px 6px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:800;" title="Ocultar comparativa">✕ Cerrar</span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 6000);
        } else {
          bannerText.innerHTML = `La cobertura se mantuvo sin modificaciones respecto al mes anterior. <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:1px 6px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:800;">✕</span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 2500);
        }
      }
    }

    function refreshPolygonsWithTransition(newMonth) {
      if (!map || selectedWarehouseIds.size === 0) return;
      const idsArray = Array.from(selectedWarehouseIds);

      // Comprobar si todos los polígonos están en memoria
      const cached = [];
      const missingIds = [];
      idsArray.forEach(id => {
        const key = `${id}__${newMonth}`;
        if (CLIENT_MEMORY_CACHE.polygons.has(key)) {
          cached.push(CLIENT_MEMORY_CACHE.polygons.get(key));
        } else {
          missingIds.push(id);
        }
      });

      // Si todos están en la memoria, respuesta inmediata (0ms)
      if (missingIds.length === 0) {
        processPolygonsComparison(cached, newMonth);
        return;
      }

      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      if (banner && bannerText) {
        bannerText.innerHTML = `Comparando cobertura con el mes anterior...`;
        banner.style.display = 'flex';
      }

      showShapeLoading(true);

      google.script.run
        .withSuccessHandler(polygonsData => {
          try {
            const fullList = [...cached, ...(polygonsData || [])];
            processPolygonsComparison(fullList, newMonth);
          } finally {
            showShapeLoading(false);
          }
        })
        .withFailureHandler(err => {
          showShapeLoading(false);
          if (banner) banner.style.display = 'none';
          showToast('Error cargando cobertura del nuevo mes: ' + err.message, 'error');
        })
        .getWarehousesPolygons(missingIds, newMonth);
    }

    function drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary) {
      if (!pData || !pData.geojson) return;
      const pId = String(pData.warehouse_id).trim();
      const mapKey = `${pId}__${mDate}`;

      const existing = multiDatePolygonsMap.get(mapKey);
      if (existing && existing.polygon) {
        existing.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(existing.polygon);
        multiDatePolygonsMap.delete(mapKey);
      }

      const coords = extractPolygonCoordinates(pData.geojson);
      if (!coords || coords.length < 3) return;

      const polygon = new google.maps.Polygon({
        paths: coords,
        strokeColor: colorDef.stroke,
        strokeOpacity: 0.95,
        strokeWeight: isPrimary ? 2.5 : 2.0,
        fillColor: colorDef.fill,
        fillOpacity: isPrimary ? 0.18 : colorDef.fillOp,
        map: map,
        zIndex: isPrimary ? 5 : 2
      });

      const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === pId);
      bindPolygonEvents(polygon, whsObj);

      multiDatePolygonsMap.set(mapKey, {
        polygon: polygon,
        coords: coords,
        month: mDate,
        colorDef: colorDef
      });

      if (isPrimary) {
        activePolygonsMap.set(pId, {
          polygon: polygon,
          ghostPolygon: null,
          coords: coords,
          month: mDate
        });
      }
    }

    function getWarehousePosition(w) {
      if (!w) return null;
      let lat = Number(w.lat);
      let lng = Number(w.lng);

      if (isNaN(lat) || isNaN(lng) || lat === 0) {
        if (w.centroid_lat && w.centroid_lng && !isNaN(w.centroid_lat)) {
          lat = Number(w.centroid_lat);
          lng = Number(w.centroid_lng);
        } else {
          const entry = activePolygonsMap.get(String(w.warehouse_id).trim());
          if (entry && entry.coords && entry.coords.length > 0) {
            lat = entry.coords[0].lat;
            lng = entry.coords[0].lng;
          }
        }
      }

      if (isNaN(lat) || isNaN(lng) || lat === 0) return null;
      return { lat: lat, lng: lng };
    }

    // Dibuja los anillos concéntricos recortando geométricamente contra la cobertura
    function drawWarehouseRings(w, pos, currentMonth) {
      if (!isRingsVisible || !w || !pos) return;
      const whId = String(w.warehouse_id).trim();
      const cacheKey = `${whId}__${currentMonth}`;
      const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);

      let coverageFeature = null;
      if (pData && pData.geojson && typeof turf !== 'undefined') {
        try {
          if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
            coverageFeature = turf.cleanCoords(turf.feature(pData.geojson));
          }
        } catch (err) {
          console.warn('Aviso parseando GeoJSON para recorte de anillos:', err);
        }
      }

      // REGLA FUNDAMENTAL: Primero se carga y dibuja la cobertura. 
      // Si la cobertura no está lista, NO dibujar círculos prematuros; esperar a que llegue la cobertura.
      if (!coverageFeature) {
        return;
      }

      const RING_LABELS = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];

      RING_RADII_METERS.forEach((radiusMeters, rIdx) => {
        const ringColor = RING_COLORS[rIdx % RING_COLORS.length];
        const radiusKm = radiusMeters / 1000;
        const ringZIndex = 30 + (RING_RADII_METERS.length - rIdx);
        const ringLabel = RING_LABELS[rIdx] || `${radiusKm} KM`;

        try {
          const centerPt = turf.point([pos.lng, pos.lat]);
          const circleFeature = turf.circle(centerPt, radiusKm, { steps: 64, units: 'kilometers' });

          // 1. Intersección: Parte del círculo DENTRO de la cobertura
          const insideFeature = turf.intersect(circleFeature, coverageFeature);
          // 2. Diferencia: Parte del círculo FUERA de la cobertura
          const outsideFeature = turf.difference(circleFeature, coverageFeature);

          if (insideFeature && insideFeature.geometry) {
            const insideCoords = extractPolygonCoordinates(insideFeature.geometry);
            if (insideCoords && insideCoords.length >= 3) {
              const insidePoly = new google.maps.Polygon({
                map: map,
                paths: insideCoords,
                strokeColor: ringColor,
                strokeOpacity: 0.95,
                strokeWeight: 2.3,
                fillColor: ringColor,
                fillOpacity: 0.16,
                zIndex: ringZIndex,
                clickable: true
              });

              insidePoly._ringLabel = ringLabel;
              insidePoly._whId = whId;

              insidePoly.addListener('mouseover', (e) => showHoverCardForWarehouse(w, e.latLng, true));
              insidePoly.addListener('mousemove', (e) => showHoverCardForWarehouse(w, e.latLng, true));
              insidePoly.addListener('mouseout', () => { if (hoverInfoWindow) hoverInfoWindow.close(); });
              insidePoly.addListener('click', (e) => showWarehouseDetailInfoWindow(w, e.latLng));

              ringCircles.push(insidePoly);
            }
          }

          if (outsideFeature && outsideFeature.geometry) {
            const outsideCoords = extractPolygonCoordinates(outsideFeature.geometry);
            if (outsideCoords && outsideCoords.length >= 3) {
              const outsidePoly = new google.maps.Polygon({
                map: map,
                paths: outsideCoords,
                strokeColor: '#94a3b8',
                strokeOpacity: 0.35,
                strokeWeight: 1.2,
                fillColor: '#94a3b8',
                fillOpacity: 0.03, // Opacidad bajísima fuera de cobertura
                zIndex: ringZIndex - 1,
                clickable: false // ZONA GRIS TRANSPARENTE: NO INTERCEPTA NI DISPARA EVENTOS DE MOUSE
              });

              outsidePoly._ringLabel = ringLabel;
              outsidePoly._whId = whId;

              ringCircles.push(outsidePoly);
            }
          }
        } catch (e) {
          console.warn('Error calculando corte de anillo con Turf:', e);
        }
      });

      if (typeof applyRingsFilterAndSyncMap === 'function') {
        applyRingsFilterAndSyncMap();
      }
    }

    function drawWarehousesOnMap(skipCenter = false) {
      if (!map) return;
      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const idsArray = Array.from(selectedWarehouseIds);

      // Si no hay ninguna tienda seleccionada, limpiar todo
      if (idsArray.length === 0) {
        clearMapOverlays();
        return;
      }

      // 1. Limpiar polígonos huérfanos de fechas o tiendas no seleccionadas
      multiDatePolygonsMap.forEach((entry, key) => {
        const parts = key.split('__');
        const whId = parts[0];
        const mDate = parts[1];
        if (!selectedWarehouseIds.has(whId) || !activeOverlayMonths.has(mDate)) {
          if (entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          multiDatePolygonsMap.delete(key);
        }
      });

      activePolygonsMap.forEach((entry, whId) => {
        const normId = String(whId).trim();
        if (!selectedWarehouseIds.has(normId)) {
          if (entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          if (entry.ghostPolygon) {
            entry.ghostPolygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.ghostPolygon);
          }
          activePolygonsMap.delete(whId);
        }
      });

      // 2. Actualizar marcadores físicos en el mapa y limpiar anillos anteriores
      warehouseMarkers.forEach(m => m.setMap(null));
      warehouseMarkers = [];

      ringCircles.forEach(c => {
        c.setMap(null);
        google.maps.event.clearInstanceListeners(c);
      });
      ringCircles = [];

      const bounds = new google.maps.LatLngBounds();
      const selectedWarehousesList = allWarehouses.filter(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));

      selectedWarehousesList.forEach((w) => {
        const pos = getWarehousePosition(w);
        if (!pos) return;
        bounds.extend(pos);

        // Marcador con casita SIEMPRE PRESENTE
        const marker = new google.maps.Marker({
          position: pos,
          map: map,
          title: w.warehouse_name,
          icon: getWarehouseMarkerIcon(w.warehouse_name)
        });

        marker.addListener('click', () => {
          showWarehouseDetailInfoWindow(w, marker.getPosition());
        });

        warehouseMarkers.push(marker);
      });

      // 3. PRIMERO: Dibujar polígonos (cobertura) para cada fecha activa
      activeOverlayMonths.forEach(mDate => {
        const colorDef = getMonthColorDef(mDate);
        const isPrimary = (mDate === currentMonth);
        const missingFromMap = idsArray.filter(id => !multiDatePolygonsMap.has(`${id}__${mDate}`));
        const toFetchIds = [];

        missingFromMap.forEach(id => {
          const cacheKey = `${id}__${mDate}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey)) {
            const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);
            // 1. PRIMERO: Dibujar cobertura
            drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

            // 2. DESPUÉS: Si es el mes principal y los anillos están activos, dibujar anillos ya recortados
            if (isPrimary && isRingsVisible) {
              const wObj = selectedWarehousesList.find(w => String(w.warehouse_id).trim() === id);
              if (wObj) {
                const pos = getWarehousePosition(wObj);
                if (pos) drawWarehouseRings(wObj, pos, mDate);
              }
            }
          } else {
            toFetchIds.push(id);
          }
        });

        if (toFetchIds.length > 0) {
          showShapeLoading(true);
          google.script.run
            .withSuccessHandler(polygonsData => {
              try {
                if (polygonsData) {
                  polygonsData.forEach(pData => {
                    const pId = String(pData.warehouse_id).trim();
                    CLIENT_MEMORY_CACHE.polygons.set(`${pId}__${mDate}`, pData);
                    if (selectedWarehouseIds.has(pId) && activeOverlayMonths.has(mDate)) {
                      // 1. PRIMERO: Dibujar cobertura en el mapa
                      drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

                      // 2. DESPUÉS: Dibujar anillos recortados contra la cobertura recién pintada
                      if (isPrimary && isRingsVisible) {
                        const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === pId);
                        if (wObj) {
                          const pos = getWarehousePosition(wObj);
                          if (pos) {
                            drawWarehouseRings(wObj, pos, mDate);
                          }
                        }
                      }
                    }
                  });
                }
              } finally {
                showShapeLoading(false);
              }
            })
            .withFailureHandler(err => {
              showShapeLoading(false);
              console.error('Error cargando polígonos multi-fecha:', err);
            })
            .getWarehousesPolygons(toFetchIds, mDate);
        }
      });

      // 4. Si los anillos están activos, dibujarlos para cada almacén cuya cobertura principal ya esté renderizada
      if (isRingsVisible) {
        idsArray.forEach(id => {
          const cacheKey = `${id}__${currentMonth}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey) && multiDatePolygonsMap.has(cacheKey)) {
            const wObj = selectedWarehousesList.find(w => String(w.warehouse_id).trim() === id);
            if (wObj) {
              const pos = getWarehousePosition(wObj);
              if (pos) drawWarehouseRings(wObj, pos, currentMonth);
            }
          }
        });
      }

      // NO mover la vista del mapa cuando skipCenter sea true o cuando el usuario esté usando autofiltrado por viewport
      if (!skipCenter && !isViewportFilterActive && !bounds.isEmpty()) {
        if (selectedWarehousesList.length === 1) {
          const singlePos = getWarehousePosition(selectedWarehousesList[0]);
          if (singlePos) {
            map.setCenter(singlePos);
            map.setZoom(14); // Nivel 5 por defecto (14x)
          } else {
            map.fitBounds(bounds, 65);
          }
        } else {
          // Ajustar encuadre para ver TODAS las tiendas en la misma pantalla con margen
          map.fitBounds(bounds, 65);
        }
      }
    }

    function toggleRingsVisibility(visible) {
      if (visible !== undefined) {
        isRingsVisible = visible;
      } else {
        const toggle = document.getElementById('rings-toggle');
        isRingsVisible = !toggle.checked;
        toggle.checked = isRingsVisible;
      }

      const toggle = document.getElementById('rings-toggle');
      if (toggle) toggle.checked = isRingsVisible;

      // REGLA: Activar o desactivar anillos SIN centrar el mapa (skipCenter = true)
      drawWarehousesOnMap(true);
      showToast(isRingsVisible ? 'Anillos de cobertura activados (R)' : 'Anillos desactivados (R)', 'info');
    }

    function clearMapOverlays() {
      warehouseMarkers.forEach(m => m.setMap(null));
      warehouseMarkers = [];
      activePolygonsMap.forEach(entry => {
        if (entry.polygon) entry.polygon.setMap(null);
        if (entry.ghostPolygon) entry.ghostPolygon.setMap(null);
      });
      activePolygonsMap.clear();

      multiDatePolygonsMap.forEach(entry => {
        if (entry.polygon) {
          entry.polygon.setMap(null);
          google.maps.event.clearInstanceListeners(entry.polygon);
        }
      });
      multiDatePolygonsMap.clear();

      warehousePolygons = [];
      ringCircles.forEach(c => {
        c.setMap(null);
        google.maps.event.clearInstanceListeners(c);
      });
      ringCircles = [];
      dismissTransitionBanner();
    }

    function centerMapOnSelected() {
      if (warehouseMarkers.length === 0) return;
      if (warehouseMarkers.length === 1) {
        map.panTo(warehouseMarkers[0].getPosition());
        map.setZoom(14); // Nivel 5 por defecto (14x)
        return;
      }
      const bounds = new google.maps.LatLngBounds();
      warehouseMarkers.forEach(m => bounds.extend(m.getPosition()));
      // Ajustar encuadre para que TODAS las tiendas seleccionadas se vean en la pantalla al mismo tiempo
      map.fitBounds(bounds, 65);
    }

    // ============================================================
    // MAPA DE CALOR NATIVO DE GOOGLE MAPS (HeatmapLayer)
    // ============================================================
    let gHeatmapLayer = null;

    function changeHeatmapLayer(layerType) {
      currentHeatmapLayer = layerType;
      if (gHeatmapLayer) {
        gHeatmapLayer.setMap(null);
        gHeatmapLayer = null;
      }

      if (layerType === 'none') {
        showToast('Mapa de calor desactivado', 'info');
        return;
      }

      showLoading('Cargando mapa de calor...');
      const currentMonth = document.getElementById('filter-month').value || '2026-05-01';

      google.script.run
        .withSuccessHandler(points => {
          hideLoading();
          let dataPoints = points;
          if (!dataPoints || dataPoints.length === 0) {
            dataPoints = generateLocalHeatmapPoints();
          }
          renderGoogleHeatmap(dataPoints, layerType);
        })
        .withFailureHandler(err => {
          hideLoading();
          const fallbackPoints = generateLocalHeatmapPoints();
          renderGoogleHeatmap(fallbackPoints, layerType);
        })
        .getHeatmapGridData(currentMonth, layerType);
    }

    function generateLocalHeatmapPoints() {
      const activeStores = allWarehouses.filter(w => selectedWarehouseIds.has(w.warehouse_id));
      const stores = activeStores.length > 0 ? activeStores : allWarehouses;
      const points = [];

      stores.forEach(s => {
        const baseLat = Number(s.lat);
        const baseLng = Number(s.lng);
        for (let i = 0; i < 90; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * 0.032;
          points.push({
            lat: baseLat + r * Math.sin(angle),
            lng: baseLng + r * Math.cos(angle),
            weight: Math.floor(Math.random() * 45) + 12
          });
        }
      });
      return points;
    }

    function renderGoogleHeatmap(data, layerType) {
      if (gHeatmapLayer) {
        gHeatmapLayer.setMap(null);
        gHeatmapLayer = null;
      }

      if (!map || !google.maps.visualization) return;

      const heatmapData = data.map(d => ({
        location: new google.maps.LatLng(Number(d.lat), Number(d.lng)),
        weight: Math.max(1, Number(d.weight || 1))
      }));

      const gradients = {
        users: [
          'rgba(0, 255, 255, 0)',
          'rgba(0, 255, 255, 1)',
          'rgba(0, 191, 255, 1)',
          'rgba(0, 127, 255, 1)',
          'rgba(255, 0, 127, 1)',
          'rgba(234, 4, 78, 1)'
        ],
        gmv_peya: [
          'rgba(102, 255, 0, 0)',
          'rgba(147, 255, 0, 1)',
          'rgba(193, 255, 0, 1)',
          'rgba(238, 255, 0, 1)',
          'rgba(255, 153, 0, 1)',
          'rgba(234, 4, 78, 1)'
        ],
        gmv_dmart: [
          'rgba(255, 204, 0, 0)',
          'rgba(255, 153, 0, 1)',
          'rgba(255, 102, 0, 1)',
          'rgba(255, 51, 0, 1)',
          'rgba(234, 4, 78, 1)',
          'rgba(180, 4, 67, 1)'
        ]
      };

      gHeatmapLayer = new google.maps.visualization.HeatmapLayer({
        data: heatmapData,
        map: map,
        radius: 38,
        opacity: 0.85,
        gradient: gradients[layerType] || gradients.users
      });

      const labelNames = {
        users: 'Densidad PeYa Users',
        gmv_peya: 'GMV PeYa Total',
        gmv_dmart: 'GMV DMart'
      };
      showToast('Capa de calor (' + (labelNames[layerType] || layerType) + ') proyectada en el mapa', 'success');
    }

    // ============================================================
    // MÉTRICAS BY WHS (DESDE PLANILLA "2. WHS ORDERS") & TABLA COMPARATIVA
    // ============================================================
    const KPI_MATRIX_DEFINITIONS = [
      // BLOQUE 1: TRANSACCIONALES
      { isBlock: true, title: 'Bloque 1: Métricas Transaccionales', color: 'var(--brand-red)' },
      { key: 'total_orders', label: 'Órdenes Totales', desc: 'Órdenes confirmadas fact_orders', fmt: v => formatNumber(v), better: 'high' },
      { key: 'total_net_sales', label: 'Net Sales Facturación', desc: 'Venta neta neta de desc.', fmt: v => formatCurrency(v), better: 'high' },
      { key: 'afv_aov_amount', label: 'Ticket Promedio (AOV)', desc: 'AFV / Gasto por orden', fmt: v => formatCurrency(v), better: 'high' },
      { key: 'total_units_sold', label: 'Unidades Vendidas', desc: 'Artículos físicos despachados', fmt: v => formatNumber(v), better: 'high' },
      { key: 'basket_size_units', label: 'Basket Size', desc: 'Unidades por carrito', fmt: v => (v || 0) + ' un.', better: 'high' },
      { key: 'total_discounts', label: 'Total Descuentos', desc: 'Monto en promociones', fmt: v => formatCurrency(v), better: 'low' },
      { key: 'discount_intensity_pct', label: 'Intensidad Descuento %', desc: '% Descuento s/ Gross', fmt: v => (v || 0) + '%', better: 'low' },
      { key: 'uf_orders', label: 'Órdenes Ultra Fresh', desc: 'Carnes, frutas o verduras', fmt: v => formatNumber(v), better: 'high' },
      { key: 'uf_orders_share_pct', label: 'Share Ultra Fresh %', desc: '% órdenes con frescos', fmt: v => (v || 0) + '%', better: 'high' },

      // BLOQUE 2: USUARIOS Y PENETRACIÓN
      { isBlock: true, title: 'Bloque 2: Demografía de Usuarios & Penetración', color: '#2563eb' },
      { key: 'peya_users', label: 'PeYa Users (Universo)', desc: 'Clientes cubiertos en el shape', fmt: v => formatNumber(v), better: 'high' },
      { key: 'dmart_users', label: 'DMart MAUs', desc: 'Compradores únicos en WHS', fmt: v => formatNumber(v), better: 'high' },
      { key: 'penetration_pct', label: 'Penetración %', desc: 'DMart Users / PeYa Users', fmt: v => (v || 0) + '%', better: 'high' },
      { key: 'monthly_frequency', label: 'Frecuencia Mensual', desc: 'Órdenes promedio por cliente', fmt: v => (v || 0) + ' órd/mes', better: 'high' },
      { key: 'core_users_pct', label: 'Clientes Core %', desc: 'Segmento Core de PeYa', fmt: v => (v || 0) + '%', better: 'high' },
      { key: 'high_income_users_pct', label: 'Clientes High Income %', desc: 'Nivel socioeconómico alto', fmt: v => (v || 0) + '%', better: 'high' },
      { key: 'uf_users', label: 'Clientes Ultra Fresh', desc: 'Compradores de frescos', fmt: v => formatNumber(v), better: 'high' },
      { key: 'uf_users_penetration_pct', label: 'Penetración UF %', desc: 'UF Users / DMart Users', fmt: v => (v || 0) + '%', better: 'high' },

      // BLOQUE 3: OPERACIONES Y LOGÍSTICA
      { isBlock: true, title: 'Bloque 3: Operaciones & Calidad Logística', color: '#16a34a' },
      { key: 'seamless_delivery_pct', label: '% Seamless Delivery', desc: 'Entregas perfectas sin roces', fmt: v => (v || 0) + '%', better: 'high' },
      { key: 'fail_rate_pct', label: '% Fail Rate (Rechazos)', desc: 'Tasa órdenes rechazadas', fmt: v => (v || 0) + '%', better: 'low' },
      { key: 'order_late_pct', label: '% Órdenes Tardías', desc: 'Entregadas fuera de tiempo', fmt: v => (v || 0) + '%', better: 'low' },
      { key: 'avg_delivery_time_min', label: 'Avg Delivery Time', desc: 'Minutos totales de entrega', fmt: v => (v || 0) + ' min', better: 'low' },
      { key: 'pct_late_10', label: '% Tardías >10m', desc: 'Demora logística crítica', fmt: v => (v || 0) + '%', better: 'low' },
      { key: 'picking_time', label: 'Tiempo de Picking', desc: 'Minutos armando pedidos', fmt: v => (v || 0) + ' min', better: 'low' },
      { key: 'assignment_time', label: 'Tiempo de Asignación', desc: 'Minutos hasta inicio picker', fmt: v => (v || 0) + ' min', better: 'low' },

    let lastLoadedMetricsPayload = null;

    function updateQuickAddSelect() {
      const select = document.getElementById('quick-add-whs-select');
      if (!select) return;
      select.innerHTML = '<option value="">+ Agregar almacén al comparador...</option>';
      
      const unselected = allWarehouses.filter(w => !selectedWarehouseIds.has(String(w.warehouse_id).trim()));
      unselected.sort((a,b) => (a.warehouse_name || '').localeCompare(b.warehouse_name || ''));

      unselected.forEach(w => {
        const id = String(w.warehouse_id).trim();
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${w.warehouse_name} (${w.neighborhood || w.city})`;
        select.appendChild(opt);
      });
    }

    function onQuickAddWarehouse(whId) {
      if (!whId) return;
      const normId = String(whId).trim();

      selectedWarehouseIds.add(normId);
      manuallyDeselectedIds.delete(normId);
      
      const select = document.getElementById('quick-add-whs-select');
      if (select) select.value = '';

      renderWarehouseCards();
      updateSelectionAndRefresh();
    }

    function quickRemoveWarehouseFromKpis(whId) {
      const normId = String(whId).trim();
      selectedWarehouseIds.delete(normId);
      manuallyDeselectedIds.add(normId);
      removePolygonsForWarehouse(normId);

      // Eliminación reactiva instantánea en 0ms de la tabla comparativa
      if (lastLoadedMetricsPayload && lastLoadedMetricsPayload.stores) {
        lastLoadedMetricsPayload.stores = lastLoadedMetricsPayload.stores.filter(
          s => String(s.warehouse_id).trim() !== normId
        );
        renderComparativeKpiTable(lastLoadedMetricsPayload);
      }

      renderWarehouseCards();
      updateSelectionAndRefresh();
    }

    function quickClearAllKpiWarehouses() {
      selectedWarehouseIds.clear();
      if (lastLoadedMetricsPayload) {
        lastLoadedMetricsPayload.stores = [];
        renderComparativeKpiTable(lastLoadedMetricsPayload);
      }
      selectAllWarehouses(false);
    }

    function focusWarehouseOnMap(whId) {
      const normId = String(whId).trim();
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
      if (!w || !map) return;

      const lat = Number(w.lat);
      const lng = Number(w.lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
        map.panTo({ lat, lng });
        if (map.getZoom() < 14) map.setZoom(14);
        showWarehouseDetailInfoWindow(w, { lat, lng });
      }
    }

    function renderComparativeKpiTable(m) {
      lastLoadedMetricsPayload = m;
      updateQuickAddSelect();

      const table = document.getElementById('kpi-matrix-table');
      const badge = document.getElementById('kpi-total-whs');
      if (!table) return;

      let stores = (m && m.stores) ? [...m.stores] : [];

      // Rescatar de allWarehouses si alguna tienda seleccionada no tiene fila en 2. WHS orders
      selectedWarehouseIds.forEach(id => {
        if (!stores.some(s => String(s.warehouse_id).trim() === id)) {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          if (w) {
            stores.push({
              warehouse_id: w.warehouse_id,
              warehouse_name: w.warehouse_name,
              city: w.city,
              country: w.country,
              total_orders: w.orders || 0
            });
          }
        }
      });

      if (badge) {
        badge.textContent = `${stores.length} tienda${stores.length === 1 ? '' : 's'}`;
      }

      if (stores.length === 0) {
        table.innerHTML = `
          <tbody>
            <tr>
              <td style="text-align:center; padding:40px; color:var(--text-sheet-muted); font-size:12px;">
                No hay almacenes seleccionados para comparar. Usá el selector <strong>+ Agregar almacén...</strong> arriba o la pestaña <em>Filtros & Selección</em>.
              </td>
            </tr>
          </tbody>
        `;
        return;
      }

      // 1. Encabezados de la tabla (THEAD)
      let theadHtml = `
        <thead>
          <tr>
            <th style="text-align:left; width:175px; min-width:175px; max-width:175px; padding:5px 8px;">
              <div style="font-weight:800; font-size:10.5px; color:var(--text-sheet-title); text-transform:uppercase; letter-spacing:0.4px;">Métrica</div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:600;">25 indicadores oficiales</div>
            </th>
      `;

      stores.forEach(s => {
        const whObj = allWarehouses.find(w => String(w.warehouse_id).trim() === String(s.warehouse_id).trim()) || s;
        const flag = getCountryFlagImg(whObj);
        theadHtml += `
          <th style="width:122px; min-width:122px; max-width:122px; padding:5px 4px; text-align:center;">
            <div style="display:flex; flex-direction:column; gap:2px;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:4px;">
                <div style="display:flex; align-items:center; gap:4px; min-width:0; flex:1;">
                  ${flag}
                  <span style="font-weight:800; font-size:10px; color:var(--text-sheet-title); word-break:break-word; line-height:1.2; text-align:left;" title="${s.warehouse_name}">${s.warehouse_name}</span>
                </div>
                <button type="button" onclick="quickRemoveWarehouseFromKpis('${s.warehouse_id}')" title="Quitar tienda" style="background:transparent; border:none; cursor:pointer; padding:0 2px; font-size:11px; color:#ef4444; font-weight:800; line-height:1; flex-shrink:0;" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#ef4444'">✕</button>
              </div>
              <div style="display:flex; align-items:center; justify-content:space-between; font-size:8.5px; color:var(--text-sheet-muted); margin-top:2px;">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.city || s.country || ''}</span>
                <button type="button" onclick="focusWarehouseOnMap('${s.warehouse_id}')" title="Centrar en mapa" style="background:transparent; border:none; cursor:pointer; padding:0 1px; display:inline-flex; align-items:center; opacity:0.85; color:var(--text-sheet-title);">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
          </th>
        `;
      });

      theadHtml += `
          </tr>
        </thead>
      `;

      // 2. Filas de datos (TBODY)
      let tbodyHtml = '<tbody>';

      KPI_MATRIX_DEFINITIONS.forEach(def => {
        if (def.isBlock) {
          tbodyHtml += `
            <tr class="matrix-block-header">
              <td colspan="${stores.length + 1}" style="color:${def.color};">
                ${def.title}
              </td>
            </tr>
          `;
          return;
        }

        // Determinar el mejor valor si hay 2 o más tiendas
        let bestVal = null;
        if (stores.length > 1) {
          const numVals = stores.map(s => Number(s[def.key])).filter(n => !isNaN(n) && n !== null && n !== undefined);
          if (numVals.length > 0) {
            bestVal = def.better === 'high' ? Math.max(...numVals) : Math.min(...numVals);
          }
        }

        tbodyHtml += `
          <tr>
            <td style="padding:4px 8px; width:175px; min-width:175px; max-width:175px;">
              <div style="font-weight:700; font-size:10px; color:var(--text-sheet-title); line-height:1.2;">${def.label}</div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); line-height:1.1;">${def.desc}</div>
            </td>
        `;

        stores.forEach(s => {
          const rawVal = s[def.key];
          const formatted = def.fmt(rawVal);
          const isBest = (bestVal !== null && Number(rawVal) === bestVal && (def.better === 'high' ? bestVal > 0 : true));
          
          tbodyHtml += `
            <td class="matrix-val-cell ${isBest ? 'matrix-val-best' : ''}" style="width:122px; min-width:122px; max-width:122px; padding:4px 6px; font-size:11px; font-family:'Outfit',sans-serif; text-align:center;">
              ${formatted}
            </td>
          `;
        });

        tbodyHtml += `</tr>`;
      });

      tbodyHtml += '</tbody>';
      table.innerHTML = theadHtml + tbodyHtml;
    }

    function applyMetricsToUI(m) {
      if (!m) return;
      renderComparativeKpiTable(m);
    }

    function loadTotalMetrics() {
      if (selectedWarehouseIds.size === 0) {
        applyMetricsToUI({ stores: [] });
        return;
      }
      const idsArray = Array.from(selectedWarehouseIds);
      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const cacheKey = `${[...idsArray].sort().join(',')}__${currentMonth}`;

      if (CLIENT_MEMORY_CACHE.metrics.has(cacheKey)) {
        applyMetricsToUI(CLIENT_MEMORY_CACHE.metrics.get(cacheKey));
        return;
      }

      google.script.run
        .withSuccessHandler(m => {
          if (!m) return;
          CLIENT_MEMORY_CACHE.metrics.set(cacheKey, m);
          applyMetricsToUI(m);
        })
        .withFailureHandler(err => {
          console.warn('Aviso cargando métricas by WHS:', err.message);
        })
        .getStoreTotalMetrics(idsArray, currentMonth);
    }

    let allRingsData = [];
    let currentRingDistanceFilter = 'ALL';
    let currentRingsStoreFilter = 'ALL';

    function loadRingsData() {
      if (selectedWarehouseIds.size === 0) return;
      const idsArray = Array.from(selectedWarehouseIds);
      const currentMonth = document.getElementById('filter-month').value || '2026-05-01';

      // Actualizar el dropdown de tiendas del análisis por anillos
      const storeSelect = document.getElementById('rings-store-filter-select');
      if (storeSelect) {
        storeSelect.innerHTML = `<option value="ALL">Todas las tiendas (${idsArray.length})</option>`;
        idsArray.forEach(id => {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          if (w) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = w.warehouse_name;
            if (id === currentRingsStoreFilter) opt.selected = true;
            storeSelect.appendChild(opt);
          }
        });
      }

      google.script.run
        .withSuccessHandler(rings => {
          allRingsData = rings || [];
          applyRingsFilterAndSyncMap();
        })
        .getMultipleStoreRingsData(idsArray, currentMonth);
    }

    function onRingsStoreFilterChange(whId) {
      currentRingsStoreFilter = whId || 'ALL';
      applyRingsFilterAndSyncMap();
    }

    function filterRingTable(ringFilter, btn) {
      if (btn) {
        document.querySelectorAll('.ring-pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      currentRingDistanceFilter = ringFilter;
      applyRingsFilterAndSyncMap();
    }

    function applyRingsFilterAndSyncMap() {
      // 1. Filtrar datos de la tabla
      let filtered = allRingsData;
      if (currentRingsStoreFilter !== 'ALL') {
        filtered = filtered.filter(r => String(r.warehouse_id).trim() === String(currentRingsStoreFilter).trim());
      }
      if (currentRingDistanceFilter !== 'ALL') {
        filtered = filtered.filter(r => r.anillo === currentRingDistanceFilter);
      }
      renderRingsTable(filtered);

      // 2. Filtrar polígonos de anillos en el mapa en tiempo real
      ringCircles.forEach(poly => {
        if (!poly) return;
        const matchRing = (currentRingDistanceFilter === 'ALL' || poly._ringLabel === currentRingDistanceFilter);
        const matchStore = (currentRingsStoreFilter === 'ALL' || poly._whId === currentRingsStoreFilter);
        poly.setVisible(matchRing && matchStore);
      });
    }

    function renderRingsTable(data) {
      const tbody = document.getElementById('rings-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--text-muted);">Sin datos de anillos disponibles para los filtros seleccionados.</td></tr>';
        return;
      }

      data.forEach(r => {
        const tr = document.createElement('tr');
        const isLateHigh = Number(r.pct_late) > 15;
        const isPenLow = Number(r.penetration_pct) < 6;

        tr.innerHTML = `
          <td style="font-weight:700;">${r.warehouse_name}</td>
          <td><span class="status-badge" style="background:#f1f5f9; color:var(--navy-900);">${r.anillo}</span></td>
          <td>${formatNumber(r.covered_maus)}</td>
          <td>${formatNumber(r.dmart_maus_covered)}</td>
          <td style="font-weight:700; color:${isPenLow ? 'var(--danger-text)' : 'inherit'};">${r.penetration_pct}%</td>
          <td>${formatNumber(r.dmart_orders)}</td>
          <td>${formatCurrency(r.net_sales)}</td>
          <td>${formatCurrency(r.aov)}</td>
          <td>${r.avg_dt_min || '—'} min</td>
          <td>
            <span class="status-badge ${isLateHigh ? 'status-badge-danger' : 'status-badge-success'}">
              ${r.pct_late}%
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
