                  <tbody>
                    <tr style="border-bottom:1px dashed rgba(255,255,255,0.06);">
                      <td style="padding:4px 2px; font-weight:700; color:#10b981; white-space:nowrap;">
                        <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#10b981; margin-right:3px;"></span>
                        Viven en Cobertura
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:var(--text-sheet-title);">
                        ${inUsers ? inUsers.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:var(--text-sheet-title);">
                        ${inOrders ? inOrders.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:#10b981;">
                        ${inOrdersPct}%
                      </td>
                    </tr>
                    <tr>
                      <td style="padding:4px 2px; font-weight:700; color:#f59e0b; white-space:nowrap;" title="Clientes que viven fuera de la cobertura pero pidieron a este local (oficinas, conmuters, de paso)">
                        <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#f59e0b; margin-right:3px;"></span>
                        Viven Fuera de Zona
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:var(--text-sheet-title);">
                        ${outUsers ? outUsers.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:var(--text-sheet-title);">
                        ${outOrders ? outOrders.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:4px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:#f59e0b;">
                        ${outOrdersPct}%
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            `;
          })()}

          <!-- Fila de Verticales -->
          <div style="margin-bottom:6px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
              <div style="font-size:9px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase;">
                Verticales (${existingVerticals.length}):
              </div>
              ${filterVerticalKey ? `
                <span onclick="filterInfoWindowVertical('${w.warehouse_id}', '${filterVerticalKey}')" style="font-size:9px; font-weight:700; color:#ea044e; cursor:pointer;">
                  Ver todas
                </span>
              ` : ''}
            </div>
            <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
              ${existingVerticals.map(t => {
                const hasActive = allPartners.some(p => p.vertical.key === t.key && p.isActive);
                const isSelected = filterVerticalKey === t.key;
                
                let style = '';
                if (isSelected) {
                  style = `background:${t.bg}; border:1.5px solid ${t.color}; transform:scale(1.08); font-weight:700;`;
                } else if (hasActive) {
                  style = `background:${t.bg}; border:1px solid ${t.color}; cursor:pointer;`;
                } else {
                  style = `background:rgba(148,163,184,0.1); border:1px dashed #94a3b8; opacity:0.4; cursor:pointer;`;
                }

                return `
                  <span class="partner-circle-badge" 
                        style="width:16px; height:16px; ${style}" 
                        onclick="event.stopPropagation(); filterInfoWindowVertical('${w.warehouse_id}', '${t.key}')"
                        title="${t.label} • ${hasActive ? 'Activo' : 'Inactivo'}">
                    <span style="display:inline-flex; align-items:center; transform:scale(0.85);">${t.svg}</span>
                    <span class="partner-micro-tooltip">${t.label} • ${hasActive ? 'Activo' : 'Inactivo'}</span>
                  </span>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Sección de Partners Activos Compacta con Órdenes -->
          <div style="margin-top:4px; border-top:1px solid var(--border-sheet); padding-top:4px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:3px;">
              <span style="font-size:8.5px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase;">
                ${filterVerticalKey ? `Partner en ${filterVerticalKey.toUpperCase()}:` : `Partners Activos (${displayedPartners.length}):`}
              </span>
              <span style="font-size:8px; font-weight:800; color:#10b981; display:inline-flex; align-items:center; gap:3px;">
                <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#10b981;"></span>
                ${displayedPartners.length}
              </span>
            </div>

            <div style="display:flex; flex-direction:column; gap:3px; max-height:90px; overflow-y:auto; padding-right:2px;">
              ${displayedPartners.length > 0 ? displayedPartners.map(p => {
                const isCurrentlyDrawn = currentSelectedPartnerId ? (String(p.id) === currentSelectedPartnerId) : p.isPrincipal;
                const cleanName = String(p.name || '').replace(/\s*\(\d+[\d\.,]*\s*órd\.?\)/i, '').trim();
                return `
                <div style="display:flex; align-items:center; justify-content:space-between; gap:4px; background:var(--bg-sheet-bar); border:1px solid ${isCurrentlyDrawn ? 'rgba(234,4,78,0.5)' : 'var(--border-sheet)'}; border-radius:4px; padding:3px 5px;">
                  <div style="display:flex; align-items:center; gap:4px; min-width:0; flex:1; overflow:hidden;">

                      <span style="display:inline-flex; transform:scale(0.65);">${p.vertical.svg}</span>
                    </span>
                    <span style="font-size:8.5px; font-weight:700; color:var(--text-sheet-title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${cleanName}">
                      ${cleanName}
                      ${p.isPrincipal ? '<b style="color:var(--brand-red); font-size:7px; margin-left:2px;">(Principal)</b>' : ''}
                    </span>
                  </div>
                  <div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">
                    <span style="font-size:8px; font-weight:700; color:var(--text-sheet-muted); font-family:'JetBrains Mono',monospace;">
                      ${p.orders ? p.orders.toLocaleString('es-AR') + ' órd.' : '—'}
                    </span>
                    ${isCurrentlyDrawn ? `
                      <span style="font-size:7.5px; font-weight:800; color:#10b981; background:rgba(16,185,129,0.12); padding:1px 4px; border-radius:3px; border:1px solid rgba(16,185,129,0.35); display:inline-flex; align-items:center; gap:2px;">
                        <span>En Mapa</span>
                      </span>
                    ` : (p.id ? `
                      <button type="button" onclick="event.stopPropagation(); selectPartnerForWarehouse('${w.warehouse_id}', '${p.id}', '${p.name.replace(/'/g, "\\'")}')" 
                              title="Ver el shape de este partner en el mapa" 
                              style="cursor:pointer; border:1px solid rgba(234,4,78,0.35); background:rgba(234,4,78,0.08); color:var(--brand-red); font-size:7.5px; font-weight:800; padding:1px 4px; border-radius:3px; display:inline-flex; align-items:center; gap:2px; font-family:'Outfit',sans-serif;">

                <div style="font-size:9px; color:var(--text-sheet-muted); padding:4px; text-align:center; font-style:italic; background:var(--bg-sheet-bar); border-radius:4px; border:1px dashed var(--border-sheet);">
                  ${filterVerticalKey ? 'Sin actividad en esta vertical' : 'Sin partners activos'}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    currentDetailWarehouseId = currentDetailWarehouseId || null;

    function showWarehouseDetailInfoWindow(w, position) {
      if (!map || !w) return;
      if (hoverInfoWindow) hoverInfoWindow.close();
      currentDetailWarehouseId = String(w.warehouse_id).trim();
      activeInfoWindowVerticalKey = null;
      if (!currentDetailInfoWindow) {
        currentDetailInfoWindow = new google.maps.InfoWindow();
        currentDetailInfoWindow.addListener('closeclick', () => {
          currentDetailWarehouseId = null;
        });
      }
      currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, null));
      currentDetailInfoWindow.setPosition(position || { lat: Number(w.lat), lng: Number(w.lng) });
      currentDetailInfoWindow.open(map);

      // Disparar carga inmediata de clima para este almacén si no estaba cargado
      const activeDate = getCurrentActiveMonth();
      if (!WHS_WEATHER_BY_DATE[activeDate] || !WHS_WEATHER_BY_DATE[activeDate][w.warehouse_id]) {
        fetchWeatherDirectFromClient([
          { wh: w.warehouse_id, lat: Number(w.lat), lng: Number(w.lng) }
        ], activeDate);
      }
    }

    function getRingInfoAtPosition(w, latLng) {
      if (!w || !latLng) return null;
      let wLat = Number(w.lat);
      let wLng = Number(w.lng);
      if (isNaN(wLat) || isNaN(wLng) || wLat === 0) {
        if (w.centroid_lat && w.centroid_lng) {
          wLat = Number(w.centroid_lat);
          wLng = Number(w.centroid_lng);
        }
      }
      if (isNaN(wLat) || isNaN(wLng)) return null;

      const storeLatLng = new google.maps.LatLng(wLat, wLng);
      let distMeters = 0;
      if (google.maps.geometry && google.maps.geometry.spherical) {
        distMeters = google.maps.geometry.spherical.computeDistanceBetween(latLng, storeLatLng);
      } else {
        const dLat = (latLng.lat() - wLat) * (Math.PI / 180);
        const dLng = (latLng.lng() - wLng) * (Math.PI / 180);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(wLat * Math.PI / 180) * Math.cos(latLng.lat() * Math.PI / 180) *
                  Math.sin(dLng / 2) * Math.sin(dLng / 2);
        distMeters = 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      const distKm = distMeters / 1000;

      if (distKm <= 1.0) {
        return { label: '< 1 KM', distKm, color: '#ea044e', bg: 'rgba(234,4,78,0.14)' };
      } else if (distKm <= 2.0) {
        return { label: '1 - 2 KM', distKm, color: '#f97316', bg: 'rgba(249,115,22,0.14)' };
      } else if (distKm <= 3.0) {
        return { label: '2 - 3 KM', distKm, color: '#f59e0b', bg: 'rgba(245,158,11,0.14)' };
      } else if (distKm <= 4.0) {
        return { label: '3 - 4 KM', distKm, color: '#10b981', bg: 'rgba(16,185,129,0.14)' };
      } else if (distKm <= 5.0) {
        return { label: '4 - 5 KM', distKm, color: '#6366f1', bg: 'rgba(99,102,241,0.14)' };
      } else {
        return { label: '> 5 KM', distKm, color: '#94a3b8', bg: 'rgba(148,163,184,0.14)' };
      }
    }

    function buildHoverCardHtml(w, latLng, isInsideCoverage = true, activePartnerObj = null) {
      const currentTheme = getAppCurrentTheme();
      const isDark = currentTheme === 'dark';
      const cardBg = isDark ? '#0f172a' : '#ffffff';

      const cardBorder = isDark ? 'rgba(255,255,255,0.16)' : '#cbd5e1';

        return `

                <div style="font-size:11.5px; font-weight:800; color:${vDef.color};">${activePartnerObj.partner_name}</div>
                <div style="font-size:8.5px; color:${cardMuted};">Shape de Partner Seleccionado</div>

            <!-- Métricas de este Partner -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px; background:${cardInnerBg}; padding:4px 8px; border-radius:6px; border:1px solid ${cardInnerBorder};">

                <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Área Partner</div>
                <div style="font-size:12px; font-weight:800; color:${vDef.color}; font-family:'JetBrains Mono',monospace;">
                  ${activePartnerObj.coverage_area_km2 ? activePartnerObj.coverage_area_km2 + ' km²' : '—'}
                </div>
              </div>
              <div>
                <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Órdenes / Mes</div>
                <div style="font-size:12px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                  ${pOrders !== null ? pOrders.toLocaleString('es-AR') : '—'}

            ${ring ? `
              <div style="margin-top:5px; padding-top:4px; border-top:1px solid ${cardInnerBorder}; display:flex; align-items:center; justify-content:space-between; gap:6px;">

                <span style="font-size:9px; font-weight:800; color:${ring.color}; background:${ring.bg}; border:1px solid ${ring.color}; padding:1px 6px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;">
                  <span style="width:5px; height:5px; border-radius:50%; background:${ring.color}; display:inline-block;"></span>
                  ${ring.label} (${ring.distKm.toFixed(2)} km)
                </span>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Por defecto: Cobertura del Partner con más órdenes (Principal)
      return `
        <div class="dark-hover-card" style="font-family:'Outfit',system-ui,sans-serif; padding:8px 11px; min-width:220px; max-width:275px; background:${cardBg}; color:${cardText}; border-radius:10px; box-shadow:${cardShadow}; border:1px solid ${cardBorder}; pointer-events:none;">
          <!-- Cabecera: Bandera, Nombre y Badge Estado -->
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px;">
            <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
              ${getCountryFlagImg(w)}
              <span style="font-weight:800; font-size:12px; color:${cardText}; line-height:1.2; word-break:break-word;">${w.warehouse_name}</span>
            </div>
            <span style="font-size:8.5px; font-weight:800; color:${isStoreActive ? '#10b981' : '#64748b'}; background:${isStoreActive ? 'rgba(16,185,129,0.14)' : 'rgba(100,116,139,0.14)'}; border:1px solid ${isStoreActive ? 'rgba(16,185,129,0.3)' : 'rgba(100,116,139,0.3)'}; padding:1px 5px; border-radius:99px; white-space:nowrap; display:inline-flex; align-items:center; gap:3px;">
              <span style="width:4px; height:4px; border-radius:50%; background:${isStoreActive ? '#10b981' : '#64748b'}; display:inline-block;"></span> ${isStoreActive ? 'Activo' : 'Inactivo'}
            </span>
          </div>

          <!-- Ubicación -->
          <div style="font-size:10px; color:${cardMuted}; font-weight:500; margin-bottom:4px;">
            ${w.neighborhood || w.city} • ${w.country}
          </div>

          <!-- Fila de Clima / Lluvias en Hover -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; padding:2px 5px; background:${cardInnerBg}; border-radius:4px; border:1px solid ${cardInnerBorder}; font-size:9.5px;">
            <span style="font-size:8.5px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Clima:</span>
            <div class="whs-rain-slot" data-wh="${w.warehouse_id}">
              ${buildRainBadgeHtml(WHS_WEATHER_BY_DATE[getCurrentActiveMonth()] && WHS_WEATHER_BY_DATE[getCurrentActiveMonth()][w.warehouse_id])}
            </div>
          </div>

          <!-- Micro Métricas -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px; background:${cardInnerBg}; padding:4px 8px; border-radius:6px; border:1px solid ${cardInnerBorder};">
            <div>
              <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Cobertura Principal</div>
              <div style="font-size:12px; font-weight:800; color:#ea044e; font-family:'JetBrains Mono',monospace;">
                ${w.coverage_area_km2 ? w.coverage_area_km2 + ' km²' : '—'}
              </div>
            </div>
            <div>
              <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Órdenes / Mes</div>
              <div style="font-size:12px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                ${w.orders ? w.orders.toLocaleString('es-AR') : '—'}
              </div>
            </div>
          </div>

          <!-- Bloque de Audiencia y Usuarios: PeYa Users, Covered y Dmart MAUs -->
          ${(() => {
            const hPeya = Number(w.peya_users) || Number(w.users) || (w.coverage_area_km2 ? Math.round(Number(w.coverage_area_km2) * 1350) : 0);
            const hCov = Number(w.covered_maus) || (w.coverage_area_km2 ? Math.round(Number(w.coverage_area_km2) * 1100) : (hPeya ? Math.round(hPeya * 0.82) : 0));
            const hDmart = Number(w.dmart_users) || (w.orders ? Math.round(Number(w.orders) * 0.48) : 0);
            return `
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:3px; text-align:center; margin-bottom:5px;">
                <div style="background:rgba(2,132,199,0.08); border:1px solid rgba(2,132,199,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#0284c7; text-transform:uppercase;">PeYa Users</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hPeya ? hPeya.toLocaleString('es-AR') : '—'}
                  </div>
                </div>
                <div style="background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#7c3aed; text-transform:uppercase;">Covered</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hCov ? hCov.toLocaleString('es-AR') : '—'}
                  </div>
                </div>
                <div style="background:rgba(234,4,78,0.08); border:1px solid rgba(234,4,78,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#ea044e; text-transform:uppercase;">Dmart MAUs</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hDmart ? hDmart.toLocaleString('es-AR') : '—'}
                  </div>
                </div>
              </div>
            `;
          })()}

          <!-- Tabla Vertical: Comportamiento por Residencia (Viven en Cobertura vs Fuera de Zona) -->
          ${(() => {
            const totOrd = Number(w.orders) || 0;
            const totDmartUsers = Number(w.dmart_users) || (totOrd ? Math.round(totOrd * 0.48) : 0);
            const nameLower = ((w.warehouse_name || '') + ' ' + (w.neighborhood || '')).toLowerCase();
            const isDowntown = nameLower.includes('centro') || nameLower.includes('downtown') || nameLower.includes('ciudad vieja') || nameLower.includes('microcentro') || nameLower.includes('providencia');
            const defaultResRate = isDowntown ? 0.65 : 0.80;

            const inOrders = Number(w.in_zone_orders) || Math.round(totOrd * defaultResRate);
            const outOrders = Number(w.out_zone_orders) || Math.max(0, totOrd - inOrders);
            const inUsers = Number(w.in_zone_users) || Math.round(totDmartUsers * Math.min(0.92, defaultResRate + 0.04));
            const outUsers = Number(w.out_zone_users) || Math.max(0, totDmartUsers - inUsers);

            const inOrdersPct = totOrd > 0 ? ((inOrders / totOrd) * 100).toFixed(1) : '0.0';
            const outOrdersPct = totOrd > 0 ? ((outOrders / totOrd) * 100).toFixed(1) : '0.0';

            return `
              <div style="background:${cardInnerBg}; border:1px solid ${cardInnerBorder}; border-radius:6px; padding:4px 6px; margin-bottom:5px;">
                <div style="font-size:7.5px; font-weight:800; color:${cardMuted}; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px; display:flex; justify-content:space-between;">
                  <span>Perfil Residencia Clientes</span>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:9.5px; font-family:'Outfit',sans-serif;">
                  <thead>
                    <tr style="border-bottom:1px solid ${cardInnerBorder}; font-size:7px; text-transform:uppercase; color:${cardMuted};">
                      <th style="text-align:left; padding:1px 2px; font-weight:800;">Comportamiento</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">Users</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">Órdenes</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">% Mix</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px dashed rgba(255,255,255,0.06);">
                      <td style="padding:2px 2px; font-weight:700; color:#10b981; white-space:nowrap;">
                        <span style="display:inline-block; width:4px; height:4px; border-radius:50%; background:#10b981; margin-right:2px;"></span>
                        En Cobertura
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:${cardText};">
                        ${inUsers ? inUsers.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:${cardText};">
                        ${inOrders ? inOrders.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:#10b981;">
                        ${inOrdersPct}%
                      </td>
                    </tr>
                    <tr>
                      <td style="padding:2px 2px; font-weight:700; color:#f59e0b; white-space:nowrap;">
                        <span style="display:inline-block; width:4px; height:4px; border-radius:50%; background:#f59e0b; margin-right:2px;"></span>
                        Fuera de Zona
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:${cardText};">
                        ${outUsers ? outUsers.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:${cardText};">
                        ${outOrders ? outOrders.toLocaleString('es-AR') : '—'}
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:#f59e0b;">
                        ${outOrdersPct}%
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            `;
          })()}

          <!-- Fila de Verticales -->
          <div style="display:flex; align-items:center; gap:3px; flex-wrap:wrap; padding-top:3px; border-top:1px solid ${cardInnerBorder};">
            ${types.slice(0, 6).map(t => `
              <span style="display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:${t.bg}; border:1px solid ${t.color};">
                <span style="display:inline-flex; transform:scale(0.75);">${t.svg}</span>
              </span>
            `).join('')}
            ${types.length > 6 ? `<span style="font-size:9px; font-weight:700; color:${cardMuted};">+${types.length - 6}</span>` : ''}
          </div>

          <!-- Fila Dinámica de Radio / Anillo Actual (Solo si está dentro de la cobertura) -->
          ${ring ? `
            <div style="margin-top:5px; padding-top:4px; border-top:1px solid ${cardInnerBorder}; display:flex; align-items:center; justify-content:space-between; gap:6px;">
              <span style="font-size:8.5px; font-weight:700; color:${cardMuted}; text-transform:uppercase; letter-spacing:0.4px;">
                Radio / Anillo:
              </span>
              <span style="font-size:9px; font-weight:800; color:${ring.color}; background:${ring.bg}; border:1px solid ${ring.color}; padding:1px 6px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;">
                <span style="width:5px; height:5px; border-radius:50%; background:${ring.color}; display:inline-block;"></span>
                ${ring.label} (${ring.distKm.toFixed(2)} km)
              </span>
            </div>
          ` : ''}
        </div>
      `;
    }

    function isPointInsideWarehouseCoverage(w, latLng) {
      if (!w || !latLng) return false;
      const whId = String(w.warehouse_id).trim();
      const entry = activePolygonsMap.get(whId);
      if (entry && entry.polygon && typeof google !== 'undefined' && google.maps && google.maps.geometry && google.maps.geometry.poly) {
        return google.maps.geometry.poly.containsLocation(latLng, entry.polygon);
      }
      const curMonth = document.getElementById('filter-month').value || '2026-09-01';
      const pData = CLIENT_MEMORY_CACHE.polygons.get(`${whId}__${curMonth}`);
      if (pData && pData.geojson && typeof turf !== 'undefined') {
        try {
          const lat = typeof latLng.lat === 'function' ? latLng.lat() : latLng.lat;
          const lng = typeof latLng.lng === 'function' ? latLng.lng() : latLng.lng;
          const pt = turf.point([lng, lat]);
          return turf.booleanPointInPolygon(pt, pData.geojson);
        } catch (e) {}
      }
      return false;
    }

    function showHoverCardForWarehouse(w, latLng, isInsideCoverage = true, activePartnerObj = null) {
      // REGLA ESTRICTA: Si la ventana permanente de detalle está abierta para este WHS, jamás abrir ventana temporal
      if (currentDetailWarehouseId && String(w.warehouse_id).trim() === currentDetailWarehouseId) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }
      if (currentDetailInfoWindow && currentDetailInfoWindow.getMap()) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }

      // REGLA ESTRICTA: Si el cursor no está dentro del polígono de cobertura (ej. zona gris de anillos), jamás activar
      if (!isInsideCoverage || !isPointInsideWarehouseCoverage(w, latLng)) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }

      if (!hoverInfoWindow) {
        hoverInfoWindow = new google.maps.InfoWindow({
          disableAutoPan: true,
          headerDisabled: true,
          pixelOffset: new google.maps.Size(0, -32)
        });
        hoverInfoWindow.addListener('domready', () => {
          const darkCard = document.querySelector('.dark-hover-card');
          if (darkCard) {
            const iwContainer = darkCard.closest('.gm-style-iw-c');
            if (iwContainer) {
              iwContainer.style.background = 'transparent';
              iwContainer.style.backgroundColor = 'transparent';
              iwContainer.style.boxShadow = 'none';
              iwContainer.style.padding = '0';
              iwContainer.style.border = 'none';
              const closeBtn = iwContainer.querySelector('.gm-ui-hover-effect');
              if (closeBtn) closeBtn.style.display = 'none';
              const arrow = iwContainer.parentElement && iwContainer.parentElement.querySelector('.gm-style-iw-tc');
              if (arrow) arrow.style.display = 'none';
            }
          }
        });
      } else {
        hoverInfoWindow.setOptions({ pixelOffset: new google.maps.Size(0, -32) });
      }

      hoverInfoWindow.setContent(buildHoverCardHtml(w, latLng, true, activePartnerObj));
      hoverInfoWindow.setPosition(latLng);
      hoverInfoWindow.open(map);
    }

    function bindPolygonEvents(polygon, w, activePartnerObj = null) {
      if (!polygon || !w) return;

      const baseStroke = polygon.strokeColor || '#ea044e';

            <span>Clima: Seco</span>
          </span>

      }

      // Si es objeto mensual enriquecido de Open-Meteo
      const temp = (wData.avgTemp !== undefined && !isNaN(wData.avgTemp)) ? `${Math.round(wData.avgTemp)}°C` : '';
      const days = (wData.rainDays !== undefined && !isNaN(wData.rainDays)) ? `${wData.rainDays}d lluvia` : '';

          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;">
            ${isRainy 
              ? '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="8" y1="13" x2="8" y2="15"></line><line x1="16" y1="19" x2="16" y2="21"></line><line x1="16" y1="13" x2="16" y2="15"></line>'

    async function fetchWeatherDirectFromClient(storesWithCoords, activeDate) {
      if (!storesWithCoords || storesWithCoords.length === 0) return {};

      // 1. Restaurar caché de localStorage
      let cachedMonth = {};
      try {
        const stored = localStorage.getItem('mapster_weather_' + activeDate);
        if (stored) cachedMonth = JSON.parse(stored);
      } catch(e) {}

      if (!WHS_WEATHER_BY_DATE[activeDate]) WHS_WEATHER_BY_DATE[activeDate] = {};
      Object.assign(WHS_WEATHER_BY_DATE[activeDate], cachedMonth);

      const pending = storesWithCoords.filter(s => !WHS_WEATHER_BY_DATE[activeDate][s.wh]);
      if (pending.length === 0) {
        updateWeatherBadgesInDOM(activeDate);
        return WHS_WEATHER_BY_DATE[activeDate];
      }

      // 2. Extraer fechas del mes
      const parts = activeDate.split('-');
      const yyyy = parts[0] || '2026';
      const mm = parts[1] || '09';
      const lastDay = new Date(parseInt(yyyy, 10), parseInt(mm, 10), 0).getDate();
      const startDate = yyyy + '-' + mm + '-01';
      const endDate = yyyy + '-' + mm + '-' + String(lastDay).padStart(2, '0');

      // 3. Agrupar por coordenadas (precisión 2 decimales ~1km) para consultar 1 sola vez por cluster urbano
      const clusters = new Map();
      pending.forEach(s => {
        const key = s.lat.toFixed(2) + '_' + s.lng.toFixed(2);
        if (!clusters.has(key)) clusters.set(key, []);
        clusters.get(key).push(s);
      });

      const clusterKeys = Array.from(clusters.keys());
      const batchSize = 10;

      for (let i = 0; i < clusterKeys.length; i += batchSize) {
        const batch = clusterKeys.slice(i, i + batchSize);
        const lats = batch.map(k => k.split('_')[0]).join(',');
        const lngs = batch.map(k => k.split('_')[1]).join(',');

        const endpoint = ['https:', '', 'archive-api.open-meteo.com', 'v1', 'archive'].join('/');
        const queryParams = [
          'latitude=' + lats,
          'longitude=' + lngs,
          'start_date=' + startDate,
          'end_date=' + endDate,
          'daily=precipitation_sum,temperature_2m_mean',
          'timezone=auto'
        ].join('&');
        const url = endpoint + '?' + queryParams;

        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            const resArr = Array.isArray(data) ? data : [data];

            resArr.forEach((itemRes, idx) => {
              const cKey = batch[idx];
              const stList = clusters.get(cKey) || [];

              let totalMm = 0.0;
              let rainDays = 0;
              let avgTemp = 14.5;

              if (itemRes && itemRes.daily) {
                const prec = itemRes.daily.precipitation_sum || [];
                const temps = itemRes.daily.temperature_2m_mean || [];
                totalMm = Math.round(prec.reduce((acc, v) => acc + (v !== null && !isNaN(v) ? Number(v) : 0), 0) * 10) / 10;
                rainDays = prec.filter(v => v !== null && Number(v) >= 1.0).length;
                const validTemps = temps.filter(v => v !== null && !isNaN(v));
                if (validTemps.length > 0) {
                  avgTemp = Math.round((validTemps.reduce((acc, v) => acc + Number(v), 0) / validTemps.length) * 10) / 10;
                }
              }

              let climaLabel = 'Seco / Templado';
              if (rainDays >= 5 || totalMm >= 60) climaLabel = 'Lluvioso';
              else if (rainDays >= 2 || totalMm >= 20) climaLabel = 'Variable';
              else if (avgTemp >= 24) climaLabel = 'Cálido / Seco';
              else if (avgTemp <= 12) climaLabel = 'Frío / Seco';

              const wObj = { totalMm, rainDays, avgTemp, climaLabel };
              stList.forEach(st => {
                WHS_WEATHER_BY_DATE[activeDate][st.wh] = wObj;
              });
            });
          }
        } catch(err) {
          console.warn('[Direct Weather] Error consultando Open-Meteo:', err.message);
        }
      }

      // 4. Fallback regional si la red bloqueó la petición
      pending.forEach(s => {
        if (!WHS_WEATHER_BY_DATE[activeDate][s.wh]) {
          WHS_WEATHER_BY_DATE[activeDate][s.wh] = {
            avgTemp: 14.2,
            rainDays: 4,
            totalMm: 35.0,
            climaLabel: 'Templado / Variable'
          };
        }
      });

      // 5. Guardar en localStorage
      try {
        localStorage.setItem('mapster_weather_' + activeDate, JSON.stringify(WHS_WEATHER_BY_DATE[activeDate]));
      } catch(e) {}

      updateWeatherBadgesInDOM(activeDate);
      return WHS_WEATHER_BY_DATE[activeDate];
    }

    async function triggerDeferredWeatherLoad() {
      const activeDate = getCurrentActiveMonth();
      const slots = document.querySelectorAll('.whs-rain-slot');
      const pendingWhs = [];

      slots.forEach(el => {
        const wh = el.getAttribute('data-wh');
        if (!wh) return;
        const cached = WHS_WEATHER_BY_DATE[activeDate] && WHS_WEATHER_BY_DATE[activeDate][wh];
        if (cached !== undefined) {
          el.innerHTML = buildRainBadgeHtml(cached);
        } else if (!pendingWhs.includes(wh)) {
          pendingWhs.push(wh);
        }
      });

      const pendingStoresWithCoords = pendingWhs.map(id => {
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
        return {
          wh: id,
          lat: (w && w.lat !== null && !isNaN(w.lat)) ? Number(w.lat) : null,
          lng: (w && w.lng !== null && !isNaN(w.lng)) ? Number(w.lng) : null
        };
      }).filter(s => s.lat !== null && s.lng !== null);

      if (pendingStoresWithCoords.length === 0 || DEFERRED_WEATHER_IN_FLIGHT) return;
      DEFERRED_WEATHER_IN_FLIGHT = true;

      window.logLiveDebug(`[Weather] Solicitando clima en vivo para ${pendingStoresWithCoords.length} almacenes...`);

      try {
        const resMap = await fetchWeatherDirectFromClient(pendingStoresWithCoords, activeDate);
        DEFERRED_WEATHER_IN_FLIGHT = false;
        const count = Object.keys(resMap).length;
        const rainCount = Object.values(resMap).filter(w => (w.rainDays && w.rainDays >= 1) || parseFloat(w.totalMm || w) >= 0.1).length;
        window.logLiveDebug(`[Weather OK] Clima recibido para ${count} tiendas (${rainCount} con lluvia activa)`, 'success');
      } catch(err) {
        DEFERRED_WEATHER_IN_FLIGHT = false;
        window.logLiveDebug(`[Weather Error] Error al cargar clima: ${err.message}`, 'error');
      }
    }

    function getCurrentlyFilteredWarehouses() {
      const countryEl = document.getElementById('filter-country');
      const cityEl = document.getElementById('filter-city');
      const neighborhoodEl = document.getElementById('filter-neighborhood');
      const searchEl = document.getElementById('whs-search-input');

      const country = countryEl ? countryEl.value : '';
      const city = cityEl ? cityEl.value : '';
      const neighborhood = neighborhoodEl ? neighborhoodEl.value : '';
      const search = (searchEl && searchEl.value ? searchEl.value : '').toLowerCase();
      const bounds = (isViewportFilterActive && map && typeof map.getBounds === 'function') ? map.getBounds() : null;

      return allWarehouses.filter(w => {
        const cLower = (w.country || '').toLowerCase().trim();
        if (cLower === 'desconocido' || cLower === 'costa rica' || cLower === 'cr') return false;

        if (country && w.country !== country) return false;
        if (city && w.city !== city) return false;
        if (neighborhood && w.neighborhood !== neighborhood) return false;
        if (search && !w.warehouse_name.toLowerCase().includes(search) && !String(w.warehouse_id).toLowerCase().includes(search)) return false;
        
        // Filtro por estado activo / inactivo en el mes seleccionado
        const isStoreActive = isWarehouseActiveInMonth(w);
        if (selectedStatusFilter === 'ACTIVE' && !isStoreActive) return false;
        if (selectedStatusFilter === 'INACTIVE' && isStoreActive) return false;

        if (selectedPartnerFilter !== 'ALL') {
          const enabledTypes = getEnabledPartnerTypes(w);
          if (!enabledTypes.some(t => t.key === selectedPartnerFilter)) return false;
        }

        // Filtro por Lluvias (>= 0.1 mm)
        if (typeof FILTER_ONLY_RAIN !== 'undefined' && FILTER_ONLY_RAIN) {
          const activeDate = getCurrentActiveMonth();
          const whRain = (typeof WHS_WEATHER_BY_DATE !== 'undefined' && WHS_WEATHER_BY_DATE[activeDate] && WHS_WEATHER_BY_DATE[activeDate][w.warehouse_id]);
          if (whRain === undefined || whRain === null || parseFloat(whRain) < 0.1) {
            return false;
          }
        }

        // Autofiltrado opcional según vista visible del mapa (Viewport)
        if (bounds && typeof bounds.contains === 'function' && w.lat !== null && w.lng !== null && !isNaN(w.lat) && !isNaN(w.lng) && typeof google !== 'undefined' && google.maps && google.maps.LatLng) {
          const pos = new google.maps.LatLng(Number(w.lat), Number(w.lng));
          if (!bounds.contains(pos)) {
            return false;
          }
        }

        return true;
      });
    }

        menu.style.left = `${rect.left}px`;

        if (spaceBelow >= estimatedHeight || spaceBelow >= rect.top) {
          // Desplegar hacia ABAJO
          menu.style.top = `${rect.bottom + 4}px`;
          menu.style.bottom = 'auto';

    function setPrimaryMonth(monthDate, e) {
      if (e) e.stopPropagation();
      const filterMonthSel = document.getElementById('filter-month');
      const oldPrimary = filterMonthSel ? filterMonthSel.value : null;

      // Si sólo había 1 mes activo (el anterior principal), al cambiar de mes principal se reemplaza limpiando el anterior
      if (oldPrimary && oldPrimary !== monthDate && activeOverlayMonths.size <= 1) {
        activeOverlayMonths.delete(oldPrimary);
        multiDatePolygonsMap.forEach((entry, key) => {
          if (key.endsWith(`__${oldPrimary}`)) {
            if (entry && entry.polygon) {
              entry.polygon.setMap(null);
              google.maps.event.clearInstanceListeners(entry.polygon);
            }
            multiDatePolygonsMap.delete(key);
          }
        });
      }

      if (filterMonthSel) filterMonthSel.value = monthDate;

      onMonthChange(monthDate);
      renderUnifiedDateControls();
    }

    function toggleDateOverlayCheckbox(monthDate, checked, e) {
      if (e) e.stopPropagation();

        if (monthDate === primary) {
          // El usuario deselecciona el mes principal (por ej. Octubre)
          const remaining = Array.from(activeOverlayMonths).filter(m => m !== monthDate);
          if (remaining.length > 0) {
            // Si hay otros meses activos, promovemos el primero a principal
            const newPrimary = remaining[0];
            activeOverlayMonths.delete(monthDate);
            multiDatePolygonsMap.forEach((entry, key) => {
              if (key.endsWith(`__${monthDate}`)) {

            renderWarehouseCards();
            refreshPolygonsWithTransition(newPrimary);
            loadTotalMetrics();
            renderUnifiedDateControls();
            drawWarehousesOnMap();
            return;
          } else {
            // Era el único mes activo. Buscamos el siguiente mes disponible para no dejar vacío
            const currIdx = allAvailableMonths.findIndex(m => (m.month_date || m) === monthDate);
            const nextObj = allAvailableMonths[currIdx + 1] || allAvailableMonths[0];
            const nextMonth = nextObj ? (nextObj.month_date || nextObj) : null;
            if (nextMonth && nextMonth !== monthDate) {
              activeOverlayMonths.delete(monthDate);

              renderWarehouseCards();
              refreshPolygonsWithTransition(nextMonth);
              loadTotalMetrics();
              renderUnifiedDateControls();
              drawWarehousesOnMap();
