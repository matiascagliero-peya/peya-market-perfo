    function closeExpansionSimulator() {
      isExpansionSimActive = false;
      const card = document.getElementById('expansion-sim-card');
      const btn = document.getElementById('btn-expansion-sim-trigger');
      if (card) card.style.display = 'none';
      if (btn) {
        btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
        btn.style.boxShadow = 'none';
      }
      if (map) map.setOptions({ draggableCursor: null });

      if (simProposedMarker) {
        simProposedMarker.setMap(null);
        simProposedMarker = null;
      }
      if (simProposedPolygon) {
        simProposedPolygon.setMap(null);
        simProposedPolygon = null;
      }
      simProposedCenter = null;
    }

    function onSimulationMapClick(latLng) {
      if (!isExpansionSimActive || !latLng) return;
      simProposedCenter = { lat: latLng.lat(), lng: latLng.lng() };

      if (!simProposedMarker) {
        simProposedMarker = new google.maps.Marker({
          position: latLng,
          map: map,
          draggable: true,
          title: 'Nueva Darkstore Propuesta',
          icon: {
            url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 38 46" fill="none">
                <path d="M19 2C10.716 2 4 8.716 4 17C4 28 19 39 19 39C19 39 34 28 34 17C34 8.716 27.284 2 19 2Z" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
                <circle cx="19" cy="17" r="10" fill="#ffffff"/>
                <path d="M14 12v11h2v-4h6l-1-3 1-4h-8z" fill="#059669"/>
              </svg>
            `),
            scaledSize: new google.maps.Size(32, 40),
            anchor: new google.maps.Point(16, 38)
          },
          zIndex: 9999
        });

        simProposedMarker.addListener('dragend', function(e) {
          simProposedCenter = { lat: e.latLng.lat(), lng: e.latLng.lng() };
          recalculateSimulatedStore();
        });
      } else {
        simProposedMarker.setPosition(latLng);
      }

      const hint = document.getElementById('sim-placement-hint');
      if (hint) hint.style.display = 'none';
      const panel = document.getElementById('sim-results-panel');
      if (panel) panel.style.display = 'block';

      recalculateSimulatedStore();
    }

    function updateSimulatedRadius(val) {
      simProposedRadiusKm = parseFloat(val) || 2.5;
      recalculateSimulatedStore();
    }

    function recalculateSimulatedStore() {
      if (!simProposedCenter || typeof turf === 'undefined') return;
      const centerPt = [simProposedCenter.lng, simProposedCenter.lat];

      const circlePoly = turf.circle(centerPt, simProposedRadiusKm, { steps: 48, units: 'kilometers' });
      const totalAreaKm2 = Number((Math.PI * simProposedRadiusKm * simProposedRadiusKm).toFixed(2));

      const coords = circlePoly.geometry.coordinates[0].map(c => ({ lat: c[1], lng: c[0] }));
      if (simProposedPolygon) {
        simProposedPolygon.setPath(coords);
      } else {
        simProposedPolygon = new google.maps.Polygon({
          paths: coords,
          map: map,
          strokeColor: '#10b981',
          strokeOpacity: 0.9,
          strokeWeight: 2.2,
          fillColor: '#10b981',
          fillOpacity: 0.22,
          zIndex: 50
        });
      }

      let totalOverlapAreaKm2 = 0;
      const affectedStores = [];

      allWarehouses.forEach(w => {
        if (!w.is_active) return;
        const pData = multiDatePolygonsMap.get(String(w.warehouse_id).trim());
        if (!pData || !pData.geojson) return;

        try {
          const storeFeature = turf.feature(pData.geojson);
          const isect = turf.intersect(circlePoly, storeFeature);
          if (isect) {
            const overlapKm2 = turf.area(isect) / 1000000;
            if (overlapKm2 > 0.05) {
              totalOverlapAreaKm2 += overlapKm2;
              const storeArea = Number(w.coverage_area_km2) || 15;
              const overlapPct = Math.min(100, (overlapKm2 / storeArea) * 100);
              affectedStores.push({
                name: w.warehouse_name,
                overlapKm2: overlapKm2.toFixed(2),
                overlapPct: overlapPct.toFixed(1)
              });
            }
          }
        } catch(e) {}
      });

      const safeOverlapKm2 = Math.min(totalAreaKm2, totalOverlapAreaKm2);
      const whiteSpaceKm2 = Math.max(0, totalAreaKm2 - safeOverlapKm2);
      const cannibalPct = Math.min(100, Math.round((safeOverlapKm2 / totalAreaKm2) * 100));
      const whiteSpacePct = 100 - cannibalPct;

      const estMausInRadio = Math.round(totalAreaKm2 * 1150);
      const estNewOrders = Math.round(whiteSpaceKm2 * 210 + safeOverlapKm2 * 65);
      const estGmv = Math.round(estNewOrders * 15.8);

      const wsVal = document.getElementById('sim-whitespace-val');
      if (wsVal) wsVal.textContent = `${whiteSpacePct}%`;
      const wsArea = document.getElementById('sim-whitespace-area');
      if (wsArea) wsArea.textContent = `${whiteSpaceKm2.toFixed(2)} km² vírgenes`;

      const canVal = document.getElementById('sim-cannibal-val');
      if (canVal) canVal.textContent = `${cannibalPct}%`;
      const canStores = document.getElementById('sim-cannibal-stores');
      if (canStores) canStores.textContent = `${affectedStores.length} almacenes afectados`;

      const mausEl = document.getElementById('sim-maus-val');
      if (mausEl) mausEl.textContent = estMausInRadio.toLocaleString('es-AR');
      const ordsEl = document.getElementById('sim-orders-val');
      if (ordsEl) ordsEl.textContent = `${estNewOrders.toLocaleString('es-AR')} / mes`;
      const gmvEl = document.getElementById('sim-gmv-val');
      if (gmvEl) gmvEl.textContent = `$ ${estGmv.toLocaleString('es-AR')}`;

      const estCpo = (1.25 + (18.5 * 0.055)).toFixed(2);
      const cpoEl = document.getElementById('sim-cpo-val');
      if (cpoEl) cpoEl.textContent = `$ ${estCpo}`;

      const estDmartMaus = Math.round(estNewOrders * 0.48);
      const estFreq = estDmartMaus > 0 ? (estNewOrders / estDmartMaus).toFixed(1) : '2.1';
      const freqEl = document.getElementById('sim-freq-val');
      if (freqEl) freqEl.textContent = `${estFreq}x órd/usuario`;

      const listEl = document.getElementById('sim-affected-stores-list');
      if (listEl) {
        if (affectedStores.length > 0) {
          listEl.innerHTML = '<b style="color:var(--text-sheet-title);">Tiendas canibalizadas:</b> ' + 
            affectedStores.map(a => `${a.name} (${a.overlapPct}% solapado)`).join(', ');
        } else {
          listEl.innerHTML = '<span style="color:#10b981; font-weight:700;">100% Territorio Virgen (Cero Canibalización)</span>';
        }
      }
    }

    function saveSimulatedStoreZone() {
      if (!simProposedCenter) return;
      const zoneData = {
        name: `Propuesta Nueva Darkstore (${simProposedRadiusKm} km)`,
        coords: simProposedPolygon ? simProposedPolygon.getPath().getArray().map(p => ({ lat: p.lat(), lng: p.lng() })) : [],
        type: 'polygon',
        area_km2: Number((Math.PI * simProposedRadiusKm * simProposedRadiusKm).toFixed(2)),
        peya_maus: parseInt(document.getElementById('sim-maus-val').textContent.replace(/\./g, ''), 10) || 0,
        dmart_maus: Math.round((parseInt(document.getElementById('sim-orders-val').textContent.replace(/\D/g, ''), 10) || 500) * 0.48),
        orders: parseInt(document.getElementById('sim-orders-val').textContent.replace(/\D/g, ''), 10) || 0,
        afv: 15.8,
        avg_dt: 18.5,
        penetration_pct: 14.5
      };
      triggerAutoSaveCustomZone(zoneData, true);
      showToast('Propuesta de nueva darkstore guardada en biblioteca comunitaria.', 'success');
    }

    // ============================================================
    // 2. DETECCIÓN DE ZONAS DE SOLAPAMIENTO (DOBLE COBERTURA)
    // ============================================================
    let isDisputeZonesVisible = false;
    let disputePolygons = [];
    let disputeInfoWindow = null;

    function toggleDisputeZonesVisibility(force) {
      if (force !== undefined) isDisputeZonesVisible = force;
      else isDisputeZonesVisible = !isDisputeZonesVisible;

      const toggle = document.getElementById('dispute-zones-toggle');
      if (toggle) toggle.checked = isDisputeZonesVisible;

      if (!isDisputeZonesVisible) {
        disputePolygons.forEach(p => p.setMap(null));
        disputePolygons = [];
        if (disputeInfoWindow) disputeInfoWindow.close();
        showToast('Zonas de Solapamiento desactivadas', 'info');
        return;
      }

      calculateAndDrawDisputeZones();
    }

    function calculateAndDrawDisputeZones() {
      disputePolygons.forEach(p => p.setMap(null));
      disputePolygons = [];
      if (!map || typeof turf === 'undefined') return;
      if (!disputeInfoWindow) disputeInfoWindow = new google.maps.InfoWindow();

      const currentMonth = getCurrentActiveMonth();

      // 1. Obtener únicamente las tiendas que tienen polígonos activos en el mapa o están seleccionadas
      const candidateList = [];

      // A. Primero buscar en las tiendas actualmente seleccionadas
      selectedWarehouseIds.forEach(whId => {
        const normId = String(whId).trim();
        const mapKey = `${normId}__${currentMonth}`;
        const entry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normId);
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
        if (entry && entry.coords && w) {
          candidateList.push({ store: w, coords: entry.coords });
        }
      });

      // B. Si hay menos de 2 seleccionadas, complementar con las tiendas visibles en el mapa que tienen polígono dibujado
      if (candidateList.length < 2 && map) {
        const bounds = map.getBounds();
        activePolygonsMap.forEach((entry, normId) => {
          if (!candidateList.some(c => String(c.store.warehouse_id).trim() === normId)) {
            const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
            if (entry && entry.coords && w) {
              const pos = getWarehousePosition(w);
              if (pos && (!bounds || bounds.contains(new google.maps.LatLng(pos.lat, pos.lng)))) {
                candidateList.push({ store: w, coords: entry.coords });
              }
            }
          }
        });
      }

      if (candidateList.length < 2) {
        showToast('Seleccioná al menos 2 darkstores en la misma zona para detectar su área de solapamiento.', 'warning');
        return;
      }

      showToast(`Auditando solapamiento entre ${candidateList.length} tiendas con Turf.js...`, 'info');

      let disputeCount = 0;
      let totalDisputeAreaKm2 = 0;

      for (let i = 0; i < candidateList.length; i++) {
        const itemA = candidateList[i];
        const polyA = coordsToTurfPolygon(itemA.coords);
        if (!polyA) continue;

        for (let j = i + 1; j < candidateList.length; j++) {
          const itemB = candidateList[j];
          const polyB = coordsToTurfPolygon(itemB.coords);
          if (!polyB) continue;

          try {
            const isect = turf.intersect(polyA, polyB);
            if (isect) {
              const areaKm2 = turf.area(isect) / 1000000;
              // Detectar solapamientos a partir de 0.005 km² (media manzana urbana)
              if (areaKm2 > 0.005) {
                disputeCount++;
                totalDisputeAreaKm2 += areaKm2;

                const paths = turfFeatureToLatLngPaths(isect);
                if (paths.length === 0) continue;

                const dPoly = new google.maps.Polygon({
                  paths: paths,
                  map: map,
                  strokeColor: '#7c3aed',
                  strokeOpacity: 0.95,
                  strokeWeight: 2.4,
                  fillColor: '#8b5cf6',
                  fillOpacity: 0.50,
                  zIndex: 1000,
                  clickable: true
                });

                dPoly.addListener('click', function(e) {
                  disputeInfoWindow.setContent(`
                    <div style="font-family:'Outfit',sans-serif; padding:10px 14px; font-size:12px; max-width:275px; background:var(--bg-sheet-card, #ffffff); color:var(--text-sheet-title, #0f172a); border-radius:8px;">
                      <div style="font-size:8.5px; font-weight:800; color:#7c3aed; text-transform:uppercase; letter-spacing:0.5px;">Zona de Solapamiento (Doble Cobertura)</div>
                      <div style="font-weight:800; font-size:13px; margin-top:3px; color:var(--text-sheet-title, #0f172a);">
                        ${itemA.store.warehouse_name} vs ${itemB.store.warehouse_name}
                      </div>
                      <div style="margin-top:6px; font-size:11.5px; color:var(--text-sheet-muted, #475569); display:flex; justify-content:space-between; align-items:center; background:rgba(124,58,237,0.08); padding:4px 8px; border-radius:5px; border:1px solid rgba(124,58,237,0.2);">
                        <span>Área solapada:</span>
                        <b style="color:#7c3aed; font-family:'JetBrains Mono',monospace;">${areaKm2.toFixed(2)} km²</b>
                      </div>
                      <div style="margin-top:7px; font-size:9.5px; color:#dc2626; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); border-radius:5px; padding:5px 7px; font-weight:600; line-height:1.35;">
                        ⚠️ Alerta operativa: Ambas darkstores compiten por los mismos pedidos en este territorio. Conviene reasignar límites para evitar canibalización y optimizar CPO.
                      </div>
                    </div>
                  `);
                  disputeInfoWindow.setPosition(e.latLng);
                  disputeInfoWindow.open(map);
                });

                disputePolygons.push(dPoly);
              }
            }
          } catch(err) {
            console.warn('[Mapster Dispute Error]:', err);
          }
        }
      }

      if (disputeCount > 0) {
        showToast(`Se detectaron ${disputeCount} zonas de solapamiento ineficiente (${totalDisputeAreaKm2.toFixed(1)} km² en total). Tocá cualquier zona violeta para ver el detalle.`, 'info');
      } else {
        showToast('No se detectaron zonas de solapamiento entre las tiendas analizadas (coberturas independientes).', 'info');
      }
    }

    // ============================================================
    // 4. PALETA DE COMANDOS GLOBAL (CTRL+K / CMD+K / SPOTLIGHT)
    // ============================================================
    let isCommandPaletteOpen = false;
    let commandPaletteSelectedIndex = 0;
    let commandPaletteItems = [];

    function openCommandPalette() {
      isCommandPaletteOpen = true;
      const modal = document.getElementById('command-palette-modal');
      const input = document.getElementById('command-palette-input');
      if (modal) modal.style.display = 'flex';
      if (input) {
        input.value = '';
        input.focus();
      }
      renderCommandPaletteResults('');
    }

    function closeCommandPalette(e) {
      if (e) e.stopPropagation();
      isCommandPaletteOpen = false;
      const modal = document.getElementById('command-palette-modal');
      if (modal) modal.style.display = 'none';
    }

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        if (isCommandPaletteOpen) closeCommandPalette();
        else openCommandPalette();
      } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        openCommandPalette();
      } else if (e.key === 'Escape' && isCommandPaletteOpen) {
        closeCommandPalette();
      }
    });

    function onCommandPaletteInput(query) {
      renderCommandPaletteResults(query);
    }

    function onCommandPaletteKeydown(e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        commandPaletteSelectedIndex = Math.min(commandPaletteSelectedIndex + 1, commandPaletteItems.length - 1);
        highlightCommandPaletteItem();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        commandPaletteSelectedIndex = Math.max(commandPaletteSelectedIndex - 1, 0);
        highlightCommandPaletteItem();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (commandPaletteItems[commandPaletteSelectedIndex]) {
          executeCommandPaletteAction(commandPaletteItems[commandPaletteSelectedIndex]);
        }
      }
    }

    function renderCommandPaletteResults(query) {
      const q = String(query || '').toLowerCase().trim();
      const resultsContainer = document.getElementById('command-palette-results');
      if (!resultsContainer) return;

      commandPaletteItems = [];

      const systemActions = [
        { id: 'act_center', category: 'Acciones', title: 'Centrar Tiendas Seleccionadas', subtitle: 'Atajo: tecla E', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea044e" stroke-width="2.2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/></svg>', run: () => centerMapOnSelected() },
        { id: 'act_clear', category: 'Acciones', title: 'Limpiar Todo el Mapa', subtitle: 'Desmarcar todos los almacenes', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>', run: () => selectAllWarehouses(false) },
        { id: 'act_sim', category: 'Herramientas', title: 'Abrir Simulador Nueva Darkstore', subtitle: 'What-If y Canibalización', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>', run: () => toggleExpansionSimulator() },
        { id: 'act_barrio', category: 'Herramientas', title: 'Trazar Polígono de Barrio...', subtitle: 'Buscar barrio en catastro (ej. Palermo, Tolosa)', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>', run: () => { const el = document.getElementById('neighborhood-poly-search-input'); if(el){ el.focus(); el.select(); } } },
        { id: 'act_dispute', category: 'Capas', title: 'Ver Zonas de Solapamiento (Doble Cobertura)', subtitle: 'Solapamientos territoriales', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', run: () => toggleDisputeZonesVisibility(true) },
        { id: 'act_quads', category: 'Capas', title: 'Ver Cuadrantes / Recuadros', subtitle: 'Análisis de usuarios BigQuery', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>', run: () => toggleGridVisibility(true) }
      ];

      systemActions.forEach(a => {
        if (!q || a.title.toLowerCase().includes(q) || a.category.toLowerCase().includes(q)) {
          commandPaletteItems.push(a);
        }
      });

      allWarehouses.forEach(w => {
        const name = String(w.warehouse_name || '');
        const id = String(w.warehouse_id || '');
        const city = String(w.city || '');
        if (!q || name.toLowerCase().includes(q) || id.toLowerCase().includes(q) || city.toLowerCase().includes(q)) {
          commandPaletteItems.push({
            id: 'wh_' + id,
            category: 'Almacén',
            title: name,
            subtitle: `${id} • ${city} (${w.is_active ? 'Activo' : 'Inactivo'})`,
            icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea044e" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
            run: () => {
              selectedWarehouseIds.clear();
              selectedWarehouseIds.add(id);
              renderWarehouseCards();
              drawWarehousesOnMap();
              centerMapOnSelected();
              showToast(`Enfocado en ${name}`, 'success');
            }
          });
        }
      });

      commandPaletteItems = commandPaletteItems.slice(0, 20);
      commandPaletteSelectedIndex = 0;

      if (commandPaletteItems.length === 0) {
        resultsContainer.innerHTML = '<div style="padding:16px 20px; font-size:12px; color:var(--text-sheet-muted); text-align:center;">No se encontraron resultados para tu búsqueda.</div>';
        return;
      }

      let html = '';
      commandPaletteItems.forEach((item, idx) => {
        const isSelected = idx === 0;
        html += `
          <div class="cmd-item" id="cmd-item-${idx}" onclick="executeCommandPaletteAction(commandPaletteItems[${idx}])" 
               style="display:flex; align-items:center; justify-content:space-between; padding:9px 18px; cursor:pointer; background:${isSelected ? 'rgba(234,4,78,0.08)' : 'transparent'}; border-left:3px solid ${isSelected ? 'var(--brand-red)' : 'transparent'}; transition:all 0.1s ease;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:16px;">${item.icon}</span>
              <div>
                <div style="font-size:12.5px; font-weight:700; color:var(--text-sheet-title);">${item.title}</div>
                <div style="font-size:10px; color:var(--text-sheet-muted);">${item.subtitle}</div>
              </div>
            </div>
            <span style="font-size:9.5px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase; background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:4px; padding:2px 6px;">${item.category}</span>
          </div>
        `;
      });

      resultsContainer.innerHTML = html;
    }

    function highlightCommandPaletteItem() {
      document.querySelectorAll('.cmd-item').forEach((el, idx) => {
        if (idx === commandPaletteSelectedIndex) {
          el.style.background = 'rgba(234,4,78,0.08)';
          el.style.borderLeftColor = 'var(--brand-red)';
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.style.background = 'transparent';
          el.style.borderLeftColor = 'transparent';
        }
      });
    }

    function executeCommandPaletteAction(item) {
      if (!item) return;
      closeCommandPalette();
      if (typeof item.run === 'function') {
        item.run();
      }
    }

    // ============================================================
    // ARRANQUE SEGURO (UNA VEZ EVALUADO EL SCRIPT COMPLETO)
    // ============================================================
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrapStoreExplorer);
    } else {
      try {
        bootstrapStoreExplorer();
      } catch(eBootEnd) {
        if (typeof window.logLiveDebug === 'function') {
          window.logLiveDebug('Excepción en arranque bootstrapStoreExplorer: ' + eBootEnd.message, 'error');
        }
      }
    }
  </script>
