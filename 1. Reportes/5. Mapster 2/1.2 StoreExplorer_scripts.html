<script>
    (function() {
      try {
        var c = document.getElementById('live-debug-content');
        if (c) {
          var d = document.createElement('div');
          d.style.color = '#38bdf8';
          d.textContent = '[' + new Date().toTimeString().split(' ')[0] + '] [1.2 Top] Archivo de scripts iniciado en el navegador.';
          c.appendChild(d);
        }
      } catch(e) {}
    })();

    // ============================================================
    // PANEL DE DIAGNÓSTICO EN VIVO (LIVE DEBUG CONSOLE)
    // ============================================================
    window.LIVE_DEBUG_LOGS = [];
    window.logLiveDebug = function(msg, type = 'info') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const entry = `[${timeStr}] ${msg}`;
      window.LIVE_DEBUG_LOGS.push(entry);
      console.log(`%c[Mapster Debug] ${msg}`, type === 'error' ? 'color:#ef4444;font-weight:bold;' : (type === 'success' ? 'color:#10b981;font-weight:bold;' : 'color:#38bdf8;'));

      const container = document.getElementById('live-debug-content');
      const statusPill = document.getElementById('debug-status-pill');
      const statusDot = document.getElementById('debug-status-dot');

      if (container) {
        const line = document.createElement('div');
        line.style.marginBottom = '2px';
        if (type === 'error') {
          line.style.color = '#ef4444';
          line.style.fontWeight = 'bold';
        } else if (type === 'success') {
          line.style.color = '#10b981';
          line.style.fontWeight = 'bold';
        } else if (type === 'warn') {
          line.style.color = '#f59e0b';
        } else {
          line.style.color = '#cbd5e1';
        }
        line.textContent = entry;
        container.appendChild(line);
        container.scrollTop = container.scrollHeight;
      }

      if (statusPill && statusDot) {
        if (type === 'error') {
          statusPill.textContent = 'Error detectado';
          statusPill.style.color = '#ef4444';
          statusPill.style.background = 'rgba(239,68,68,0.15)';
          statusDot.style.background = '#ef4444';
        } else if (type === 'success') {
          statusPill.textContent = 'OK';
          statusPill.style.color = '#10b981';
          statusPill.style.background = 'rgba(16,185,129,0.15)';
          statusDot.style.background = '#10b981';
        }
      }
    };

    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        const src = e.target.src || e.target.href || 'recurso externo';
        window.logLiveDebug(`Error de red al cargar: ${src}`, 'warn');
        return;
      }
      if (e.error && e.error.message) {
        window.logLiveDebug(`Error JS: ${e.error.message} (${e.filename || 'local'}:${e.lineno || 0})`, 'error');
      } else if (e.message && e.message !== 'Script error.') {
        window.logLiveDebug(`Error: ${e.message} (${e.filename || ''}:${e.lineno || 0})`, 'error');
      } else {
        window.logLiveDebug('Aviso cross-origin (Script error. 0:0 ignorado, continuando carga)', 'warn');
      }
    }, true);

    window.copyLiveDebugLog = function() {
      const text = window.LIVE_DEBUG_LOGS.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast('Logs de diagnóstico copiados al portapapeles', 'success');
      });
    };

    window.forceManualDataReload = function() {
      window.logLiveDebug('Reintento manual disparado por el usuario...', 'warn');
      window.__INITIAL_MAPSTER_DATA__ = null;
      fetchInitialData();
    };

    let isDebugPanelCollapsed = false;
    window.toggleLiveDebugPanel = function() {
      const content = document.getElementById('live-debug-content');
      if (content) {
        isDebugPanelCollapsed = !isDebugPanelCollapsed;
        content.style.display = isDebugPanelCollapsed ? 'none' : 'block';
      }
    };

    // ============================================================
    // ESTADO GLOBAL DE LA APLICACIÓN & COMBOBOXES DE FILTROS
    // ============================================================
    var COMBOBOX_ITEMS = {
      country: [],
      city: [],
      neighborhood: []
    };

    function populateSelect(id, items, valKey, labelKey, emptyLabel) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '';
      if (emptyLabel) {
        el.innerHTML += `<option value="">${emptyLabel}</option>`;
      }
      items.forEach(it => {
        el.innerHTML += `<option value="${it[valKey]}">${it[labelKey]}</option>`;
      });

      // Sincronizar combobox con buscador si aplica
      const type = id.replace('filter-', '');
      if (COMBOBOX_ITEMS[type] !== undefined) {
        COMBOBOX_ITEMS[type] = [];
        if (emptyLabel) {
          COMBOBOX_ITEMS[type].push({ id: '', name: emptyLabel });
        }
        items.forEach(it => {
          COMBOBOX_ITEMS[type].push({ id: it[valKey], name: it[labelKey] });
        });
        syncComboboxDisplay(type);
      }
    }

    function syncComboboxDisplay(type) {
      const select = document.getElementById(`filter-${type}`);
      const input = document.getElementById(`search-filter-${type}`);
      if (!select || !input) return;

      const currentVal = select.value;
      const found = (COMBOBOX_ITEMS[type] || []).find(it => String(it.id) === String(currentVal));
      if (found && found.id) {
        input.value = found.name;
        input.placeholder = found.name;
      } else {
        input.value = '';
        input.placeholder = (type === 'country' ? 'Todos los países' : (type === 'city' ? 'Todas las ciudades' : 'Todas las zonas'));
      }
    }

    function filterComboboxOptions(type, query = '') {
      const menu = document.getElementById(`menu-filter-${type}`);
      if (!menu) return;
      menu.style.display = 'block';
      menu.innerHTML = '';

      const items = COMBOBOX_ITEMS[type] || [];
      const q = String(query || '').trim().toLowerCase();
      const filtered = q ? items.filter(it => it.name.toLowerCase().includes(q)) : items;

      if (filtered.length === 0) {
        menu.innerHTML = '<div style="padding:6px 10px; font-size:10.5px; color:var(--text-sheet-muted); font-style:italic;">Sin coincidencias</div>';
        return;
      }

      const select = document.getElementById(`filter-${type}`);
      const currentVal = select ? select.value : '';

      filtered.forEach(it => {
        const row = document.createElement('div');
        row.className = 'combo-option-row' + (String(it.id) === String(currentVal) ? ' selected' : '');
        row.textContent = it.name;
        row.onmousedown = (e) => {
          e.preventDefault();
          selectComboboxOption(type, it.id, it.name);
        };
        menu.appendChild(row);
      });
    }

    function selectComboboxOption(type, val, label) {
      const select = document.getElementById(`filter-${type}`);
      const input = document.getElementById(`search-filter-${type}`);
      const menu = document.getElementById(`menu-filter-${type}`);

      if (menu) menu.style.display = 'none';
      if (select) {
        select.value = val;
        if (type === 'country') onCountryChange(val);
        else if (type === 'city') onCityChange(val);
        else if (type === 'neighborhood') onNeighborhoodChange(val);
      }
      if (input) {
        input.value = val ? label : '';
        input.placeholder = val ? label : (type === 'country' ? 'Todos los países' : (type === 'city' ? 'Todas las ciudades' : 'Todas las zonas'));
      }
    }

    function openCombobox(type) {
      ['country', 'city', 'neighborhood'].forEach(t => {
        if (t !== type) {
          const m = document.getElementById(`menu-filter-${t}`);
          if (m) m.style.display = 'none';
        }
      });
      const input = document.getElementById(`search-filter-${type}`);
      if (input) input.select();
      // Mostrar SIEMPRE todas las opciones disponibles sin pre-filtrar por el valor actual
      filterComboboxOptions(type, '');
    }

    function toggleCombobox(type, e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById(`menu-filter-${type}`);
      const input = document.getElementById(`search-filter-${type}`);
      if (menu) {
        if (menu.style.display === 'block') {
          menu.style.display = 'none';
        } else {
          openCombobox(type);
          if (input) input.focus();
        }
      }
    }

    document.addEventListener('click', function(e) {
      ['country', 'city', 'neighborhood'].forEach(t => {
        const wrap = document.getElementById(`wrap-filter-${t}`);
        const menu = document.getElementById(`menu-filter-${t}`);
        if (wrap && menu && !wrap.contains(e.target)) {
          menu.style.display = 'none';
          syncComboboxDisplay(t);
        }
      });

      // Cerrar automáticamente los resultados del buscador unificado si se hace clic fuera
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      const searchInput = document.getElementById('map-places-search-input');
      if (resultsDiv && resultsDiv.style.display !== 'none') {
        if (!resultsDiv.contains(e.target) && e.target !== searchInput) {
          resultsDiv.style.display = 'none';
        }
      }
    });

    function getAppCurrentTheme() {
      try {
        if (typeof document !== 'undefined' && document.documentElement && document.documentElement.getAttribute) {
          return document.documentElement.getAttribute('data-theme') || localStorage.getItem('mapster_theme') || 'light';
        }
      } catch(e) {}
      return 'light';
    }

    var map;
    var deckOverlay;
    var initialData = null;
    var allWarehouses = [];
    var selectedWarehouseIds = new Set();
    var currentMonth = '2026-10-01';
    var allAvailableMonths = [];
    var activeOverlayMonths = new Set();
    var multiDatePolygonsMap = new Map();
    var drawingManager = null;
    var selectedPartnerFilter = 'ALL';
    var selectedStatusFilter = 'ACTIVE';
    var selectedPartnerByWarehouse = new Map();
    var currentDetailInfoWindow = null;
    var hoverInfoWindow = null;
    var activeInfoWindowVerticalKey = null;
    var currentDetailWarehouseId = null;
    var isGridVisible = false;
    var gridDivisionCount = 8;
    var gridPolygons = [];
    var gridUsersDataCache = new Map();
    var currentStoreGridCells = [];
    var gHeatmapLayer = null;
    var currentHeatmapRadius = 36;
    var currentHeatmapOpacity = 0.55;
    var allRingsData = [];
    var currentRingDistanceFilter = 'ALL';
    var currentRingsStoreFilter = 'ALL';
    var currentRingsChartMetric = 'orders';

    function getCurrentActiveMonth() {
      const sel = document.getElementById('filter-month');
      if (sel && sel.value) return sel.value;
      return currentMonth || (initialData && initialData.defaultMonth) || '2026-10-01';
    }
    
    // Capas en el Mapa
    var warehouseMarkers = [];
    var gMarkerClusterer = null;
    var warehousePolygons = [];
    var activePolygonsMap = new Map(); // warehouse_id -> { polygon, ghostPolygon, coords, month }
    var ringCircles = [];
    var isRingsVisible = false;
    var isMouseWheelZoomEnabled = true;
    var currentHeatmapLayer = 'none';
    var crmChartInstance = null;
    var transitionTimer = null;

    // Caché en memoria del cliente y estado de viewport (Disponibles globalmente desde el milisegundo 0)
    var CLIENT_MEMORY_CACHE = {
      polygons: new Map(), // key: `${whId}__${month}` -> pData
      metrics: new Map()   // key: `${sortedIds}__${month}` -> metricsData
    };
    var isViewportFilterActive = true;
    var viewportIdleTimer = null;
    var manuallyDeselectedIds = new Set();
    var activeDiffPolygons = [];

    // Radio dinámico adaptativo para Heatmap según nivel de zoom de Google Maps (Blindado globalmente)
    window.getDynamicHeatmapRadius = function(zoom) {
      const z = Number(zoom) || ((typeof map !== 'undefined' && map && map.getZoom) ? map.getZoom() : 14);
      if (z <= 10) return 24;
      if (z === 11) return 32;
      if (z === 12) return 46;
      if (z === 13) return 68;
      if (z === 14) return 96;
      if (z === 15) return 140;
      if (z === 16) return 210;
      if (z === 17) return 300;
      return 400;
    };
    var getDynamicHeatmapRadius = window.getDynamicHeatmapRadius;

    // Distancias y colores fijos para los anillos concéntricos
    const RING_RADII_METERS = [1000, 2000, 3000, 4000, 5000];
    const RING_COLORS = [
      '#ea044e', // 1 km: Rojo PeYa
      '#f97316', // 2 km: Naranja Intenso
      '#f59e0b', // 3 km: Ámbar / Dorado
      '#10b981', // 4 km: Verde Esmeralda
      '#6366f1'  // 5 km: Índigo Real
    ];

    // Paleta oficial de colores para superposición de fechas en el mapa (Disponible globalmente desde el arranque)
    var DATE_COLOR_PALETTE = [
      { stroke: '#ea044e', fill: '#ea044e', fillOp: 0.18, name: 'Rojo PeYa', hex: '#ea044e' },
      { stroke: '#0284c7', fill: '#0284c7', fillOp: 0.15, name: 'Azul Eléctrico', hex: '#0284c7' },
      { stroke: '#10b981', fill: '#10b981', fillOp: 0.15, name: 'Verde Esmeralda', hex: '#10b981' },
      { stroke: '#8b5cf6', fill: '#8b5cf6', fillOp: 0.15, name: 'Violeta / Púrpura', hex: '#8b5cf6' },
      { stroke: '#f59e0b', fill: '#f59e0b', fillOp: 0.15, name: 'Ámbar / Naranja', hex: '#f59e0b' },
      { stroke: '#06b6d4', fill: '#06b6d4', fillOp: 0.15, name: 'Cian', hex: '#06b6d4' }
    ];

    function getMonthColorDef(monthDate) {
      if (!allAvailableMonths || allAvailableMonths.length === 0) return DATE_COLOR_PALETTE[0];
      const idx = allAvailableMonths.findIndex(m => (m.month_date || m) === monthDate);
      const palIdx = idx >= 0 ? (idx % DATE_COLOR_PALETTE.length) : 0;
      return DATE_COLOR_PALETTE[palIdx] || DATE_COLOR_PALETTE[0];
    }

    // Estilos personalizados para el mapa oscuro moderno de Google Maps
    const DARK_MAP_STYLE = [
      { "elementType": "geometry", "stylers": [{ "color": "#1e293b" }] },
      { "elementType": "labels.text.stroke", "stylers": [{ "color": "#0f172a" }] },
      { "elementType": "labels.text.fill", "stylers": [{ "color": "#94a3b8" }] },
      { "featureType": "administrative.locality", "elementType": "labels.text.fill", "stylers": [{ "color": "#cbd5e1" }] },
      { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#334155" }] },
      { "featureType": "road", "elementType": "geometry.stroke", "stylers": [{ "color": "#1e293b" }] },
      { "featureType": "road.highway", "elementType": "geometry", "stylers": [{ "color": "#475569" }] },
      { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#0b0f19" }] },
      // Ocultar locales comerciales, restaurantes, heladerías y puntos de comida externos (Rapanui, etc.)
      { "featureType": "poi", "stylers": [{ "visibility": "off" }] },
      { "featureType": "poi.business", "stylers": [{ "visibility": "off" }] },
      { "featureType": "poi.attraction", "stylers": [{ "visibility": "off" }] },
      { "featureType": "transit", "stylers": [{ "visibility": "off" }] }
    ];

    // Estilos personalizados para el mapa claro (Modo Día) de Google Maps
    const LIGHT_MAP_STYLE = [
      { "featureType": "all", "elementType": "geometry", "stylers": [{ "color": "#f5f5f5" }] },
      { "featureType": "all", "elementType": "labels.text.fill", "stylers": [{ "color": "#616161" }] },
      { "featureType": "all", "elementType": "labels.text.stroke", "stylers": [{ "color": "#f5f5f5" }] },
      { "featureType": "administrative.land_parcel", "elementType": "labels.text.fill", "stylers": [{ "color": "#bdbdbd" }] },
      { "featureType": "poi", "stylers": [{ "visibility": "off" }] },
      { "featureType": "poi.business", "stylers": [{ "visibility": "off" }] },
      { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] },
      { "featureType": "road.arterial", "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
      { "featureType": "road.highway", "elementType": "geometry", "stylers": [{ "color": "#dadada" }] },
      { "featureType": "road.highway", "elementType": "labels.text.fill", "stylers": [{ "color": "#616161" }] },
      { "featureType": "transit", "stylers": [{ "visibility": "off" }] },
      { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#c9e6ff" }] },
      { "featureType": "water", "elementType": "labels.text.fill", "stylers": [{ "color": "#9e9e9e" }] }
    ];

    window.onThemeChangeCallback = function(theme) {
      updateThemeStyles(theme);
    };

    window.addEventListener('mapsterThemeChanged', function(e) {
      const theme = e.detail ? e.detail.theme : (localStorage.getItem('mapster_theme') || 'light');
      updateThemeStyles(theme);
    });

    function updateThemeStyles(theme) {
      if (map) {
        map.setOptions({
          styles: theme === 'dark' ? DARK_MAP_STYLE : LIGHT_MAP_STYLE
        });
      }
      const sel = document.getElementById('theme-selector');
      if (sel) {
        sel.value = theme;
      }
      const label = document.getElementById('toolbar-theme-label');
      if (label) {
        label.textContent = theme === 'dark' ? 'Modo Noche' : 'Modo Día';
      }
    }

    // Icono SVG vectorial personalizado para la tienda/WHS (Casita permanente)
    function getWarehouseMarkerIcon(warehouseName, isSelected = true, isActive = true) {
      // Todas las tiendas activas de PedidosYa visten el Rojo corporativo (#ea044e)
      const pinColor = isActive ? '#ea044e' : '#94a3b8';
      const roofColor = isActive ? '#990334' : '#64748b';
      // La tienda seleccionada se resalta con un halo/borde dorado brillante de 3px y mayor tamaño
      const strokeCol = isSelected ? '#f59e0b' : '#ffffff';
      const strokeW = isSelected ? 3.0 : 1.8;
      const sizeW = isSelected ? 36 : 28;
      const sizeH = isSelected ? 44 : 35;
      const anchorX = isSelected ? 18 : 14;
      const anchorY = isSelected ? 41 : 32;

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="38" height="46" viewBox="0 0 38 46" fill="none">
          <defs>
            <filter id="pin-shadow" x="0" y="0" width="38" height="46" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.38"/>
            </filter>
          </defs>
          <g filter="url(#pin-shadow)">
            <path d="M19 2C10.716 2 4 8.716 4 17C4 28 19 39 19 39C19 39 34 28 34 17C34 8.716 27.284 2 19 2Z" fill="${pinColor}" stroke="${strokeCol}" stroke-width="${strokeW}"/>
            <circle cx="19" cy="17" r="11" fill="#ffffff"/>
            <!-- Fachada y techo de tienda / Casita -->
            <path d="M13 15L19 11L25 15V22H13V15Z" fill="${pinColor}"/>
            <path d="M17 22V17.5H21V22H17Z" fill="#ffffff"/>
            <path d="M11.5 15H26.5V16.5H11.5V15Z" fill="${roofColor}"/>
          </g>
        </svg>
      `;
      return {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(sizeW, sizeH),
        anchor: new google.maps.Point(anchorX, anchorY)
      };
    }

    // ============================================================
    // INICIALIZACIÓN ROBUSTA (COMPATIBLE CON IFRAME DE APPS SCRIPT)
    // ============================================================
    let isAppBootstrapped = false;

    function bootstrapStoreExplorer() {
      if (isAppBootstrapped) return;
      isAppBootstrapped = true;
      window.logLiveDebug('Arranque bootstrapStoreExplorer iniciado');

      // Mostrar panel de diagnóstico si la URL contiene ?page=debug o ?debug=1
      try {
        if (window.location.search.includes('page=debug') || window.location.search.includes('debug=1')) {
          const dbg = document.getElementById('live-debug-panel');
          if (dbg) dbg.style.display = 'flex';
        }
      } catch(e) {}

      // 0. Restaurar caché persistente de cuadrículas y usuarios calculados
      try {
        initGridUsersDataCache();
      } catch(eCache) {}

      // 1. Cargar datos e interfaz de inmediato (totalmente independiente del mapa)
      try {
        fetchInitialData();
      } catch(eData) {
        window.logLiveDebug('Error en fetchInitialData: ' + eData.message, 'error');
      }

      // 2. Inicializar Google Maps de forma desacoplada
      try {
        initGoogleMap();
      } catch(eMap) {
        window.logLiveDebug('Aviso initGoogleMap: ' + eMap.message, 'warn');
      }
    }

    window.addEventListener('DOMContentLoaded', bootstrapStoreExplorer);
    window.addEventListener('load', bootstrapStoreExplorer);

    function removePolygonsForWarehouse(whId) {
      const normId = String(whId).trim();
      
      const entry = activePolygonsMap.get(normId);
      if (entry) {
        if (entry.polygon) entry.polygon.setMap(null);
        if (entry.ghostPolygon) entry.ghostPolygon.setMap(null);
        activePolygonsMap.delete(normId);
      }

      activePolygonsMap.forEach((e, key) => {
        if (String(key).trim() === normId) {
          if (e.polygon) e.polygon.setMap(null);
          if (e.ghostPolygon) e.ghostPolygon.setMap(null);
          activePolygonsMap.delete(key);
        }
      });

      // Limpiar también de multiDatePolygonsMap para que no queden shapes huérfanos
      multiDatePolygonsMap.forEach((e, key) => {
        if (key.startsWith(`${normId}__`)) {
          if (e && e.polygon) {
            e.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(e.polygon);
          }
          multiDatePolygonsMap.delete(key);
        }
      });
    }

    function applyViewportAutoload() {
      if (!isViewportFilterActive || !map) return;
      const bounds = map.getBounds();
      if (!bounds) return;

      // 1. Obtener todas las tiendas válidas que caen en el encuadre visible del mapa (sin limitar estáticamente por país para permitir cruzar fronteras o ciudades al panear)
      const visibleStores = allWarehouses.filter(w => {
        const cLower = (w.country || '').toLowerCase().trim();
        if (cLower === 'desconocido' || cLower === 'costa rica' || cLower === 'cr') return false;

        const isStoreActive = isWarehouseActiveInMonth(w);
        if (selectedStatusFilter === 'ACTIVE' && !isStoreActive) return false;
        if (selectedStatusFilter === 'INACTIVE' && isStoreActive) return false;

        if (selectedPartnerFilter !== 'ALL') {
          const enabledTypes = getEnabledPartnerTypes(w);
          if (!enabledTypes.some(t => t.key === selectedPartnerFilter)) return false;
        }

        const pos = getWarehousePosition(w);
        if (!pos) return false;
        return bounds.contains(new google.maps.LatLng(pos.lat, pos.lng));
      });

      // 2. Sincronizar dinámicamente los selectores de País, Ciudad y Barrio con la zona visible en el mapa
      if (visibleStores.length > 0) {
        // A. Sincronizar País predominante
        const countryCounts = {};
        visibleStores.forEach(w => {
          if (w.country) countryCounts[w.country] = (countryCounts[w.country] || 0) + 1;
        });
        const dominantCountry = Object.keys(countryCounts).reduce((a, b) => countryCounts[a] > countryCounts[b] ? a : b, '');

        const countryEl = document.getElementById('filter-country');
        if (countryEl && dominantCountry && countryEl.value !== dominantCountry) {
          countryEl.value = dominantCountry;
          syncComboboxDisplay('country');
          
          const filteredCities = allWarehouses
            .filter(w => w.country === dominantCountry)
            .map(w => w.city);
          const uniqueCities = [...new Set(filteredCities)].sort();
          populateSelect('filter-city', uniqueCities.map(c => ({ id: c, name: c })), 'id', 'name', 'Todas las ciudades');
        }

        const activeCountry = (countryEl && countryEl.value) || dominantCountry;

        // B. Sincronizar Ciudad predominante
        const cityCounts = {};
        visibleStores.forEach(w => {
          if (w.city && (!activeCountry || w.country === activeCountry)) {
            cityCounts[w.city] = (cityCounts[w.city] || 0) + 1;
          }
        });
        const dominantCity = Object.keys(cityCounts).reduce((a, b) => cityCounts[a] > cityCounts[b] ? a : b, '');

        const cityEl = document.getElementById('filter-city');
        if (cityEl && dominantCity && cityEl.value !== dominantCity) {
          cityEl.value = dominantCity;
          syncComboboxDisplay('city');

          const filteredNeighborhoods = allWarehouses
            .filter(w => w.country === activeCountry && w.city === dominantCity)
            .map(w => w.neighborhood);
          const uniqueNeighborhoods = [...new Set(filteredNeighborhoods)].sort();
          populateSelect('filter-neighborhood', uniqueNeighborhoods.map(n => ({ id: n, name: n })), 'id', 'name', 'Todas las zonas');
        }

        const activeCity = (cityEl && cityEl.value) || dominantCity;

        // C. Sincronizar Barrio / Zona si está enfocado en un barrio específico
        const currentZoom = (map && map.getZoom) ? map.getZoom() : 14;
        const neighborhoodEl = document.getElementById('filter-neighborhood');
        if (neighborhoodEl) {
          if (currentZoom >= 13) {
            const neighborhoodCounts = {};
            visibleStores.forEach(w => {
              if (w.neighborhood && (!activeCity || w.city === activeCity)) {
                neighborhoodCounts[w.neighborhood] = (neighborhoodCounts[w.neighborhood] || 0) + 1;
              }
            });
            const neighKeys = Object.keys(neighborhoodCounts);
            if (neighKeys.length === 1 && neighKeys[0]) {
              neighborhoodEl.value = neighKeys[0];
            } else {
              neighborhoodEl.value = '';
            }
          } else {
            neighborhoodEl.value = '';
          }
          syncComboboxDisplay('neighborhood');
        }
      }

      const visibleIdsSet = new Set(visibleStores.map(w => String(w.warehouse_id).trim()));

      // 3. Deseleccionar y remover polígonos de almacenes que ya no están visibles en pantalla
      const toRemove = [];
      selectedWarehouseIds.forEach(id => {
        if (!visibleIdsSet.has(id)) {
          toRemove.push(id);
        }
      });
      toRemove.forEach(id => {
        selectedWarehouseIds.delete(id);
        removePolygonsForWarehouse(id);
      });

      // 4. Agregar y seleccionar automáticamente todas las tiendas que entraron en la vista visible
      let selectionChanged = toRemove.length > 0;
      visibleIdsSet.forEach(id => {
        if (!selectedWarehouseIds.has(id)) {
          selectedWarehouseIds.add(id);
          selectionChanged = true;
        }
      });

      renderWarehouseCards();

      if (selectionChanged) {
        updateSelectionAndRefresh();
      }
    }

    function initGoogleMap() {
      if (typeof google === 'undefined' || !google.maps) {
        setTimeout(initGoogleMap, 150);
        return;
      }

      const activeTheme = localStorage.getItem('mapster_theme') || 'light';
      map = new google.maps.Map(document.getElementById('main-map'), {
        center: { lat: -34.5885, lng: -58.4305 }, // Buenos Aires por defecto
        zoom: 14, // Nivel 5 por defecto (14x)
        styles: activeTheme === 'dark' ? DARK_MAP_STYLE : LIGHT_MAP_STYLE,
        disableDefaultUI: true,
        zoomControl: true,
        mapTypeControl: false,
        streetViewControl: false,
        scrollwheel: true,

      });

      updateThemeStyles(activeTheme);

      // Cerrar la ventana flotante inferior cuando el usuario toca el mapa (o agregar punto si dibuja polígono)
      map.addListener('click', (e) => {
        if (isCustomPolygonDrawing && e && e.latLng) {
          addPointToCustomPolygon(e.latLng);
          return;
        }
        if (isExpansionSimActive && e && e.latLng) {
          onSimulationMapClick(e.latLng);
          return;
        }
        toggleBottomSheet(false);
        if (hoverInfoWindow) hoverInfoWindow.close();
        if (currentDetailInfoWindow) currentDetailInfoWindow.close();
      });

      map.addListener('dblclick', (e) => {
        if (isCustomPolygonDrawing && customPolygonPoints.length >= 3) {
          finishCustomPolygonDrawing();
        }
      });

    // Autocarga y autofiltrado en vivo al desplazar o hacer zoom en el mapa
    map.addListener('idle', () => {
      if (viewportIdleTimer) clearTimeout(viewportIdleTimer);
      viewportIdleTimer = setTimeout(() => {
        if (isViewportFilterActive) applyViewportAutoload();
        if (gHeatmapLayer && currentHeatmapLayer && currentHeatmapLayer !== 'none') {
          if (typeof gHeatmapLayer.draw === 'function') gHeatmapLayer.draw();
        }
      }, 150);
    });

    map.addListener('zoom_changed', () => {
      if (gHeatmapLayer && currentHeatmapLayer && currentHeatmapLayer !== 'none') {
        const z = (map && map.getZoom) ? map.getZoom() : 14;
        const dynRadius = (typeof window.getDynamicHeatmapRadius === 'function') ? window.getDynamicHeatmapRadius(z) : 48;
        if (typeof gHeatmapLayer.set === 'function') {
          gHeatmapLayer.set('radius', dynRadius);
        }
        if (typeof gHeatmapLayer.draw === 'function') {
          gHeatmapLayer.draw();
        }
      }
    });

      // Inicializar DrawingManager para selección de zona libre
      initDrawingManager();
      initMapPlacesSearch();

      // Si los datos ya fueron procesados o hay tiendas seleccionadas, dibujar marcadores y polígonos inmediatamente
      if (allWarehouses.length > 0 && selectedWarehouseIds.size > 0) {
        drawWarehousesOnMap();
        centerMapOnSelected();
      }
    }

    // ============================================================
    // BUSCADOR UNIFICADO DE ZONAS, BARRIOS Y DIRECCIONES
    // Ubica en el mapa Y traza automáticamente los límites del barrio o zona de cobertura
    // ============================================================
    function initMapPlacesSearch() {
      const input = document.getElementById('map-places-search-input');
      if (!input || typeof google === 'undefined' || !google.maps) return;

      if (google.maps.places && google.maps.places.Autocomplete) {
        try {
          const autocomplete = new google.maps.places.Autocomplete(input, {
            fields: ['geometry', 'name', 'formatted_address'],
            types: ['geocode', 'establishment']
          });

          // Restringir a los países principales de PedidosYa en Latam
          autocomplete.setComponentRestrictions({
            country: ['ar', 'cl', 'uy', 'pe', 'ec', 'do', 'pa', 'py', 'bo', 'gt', 'sv', 'hn', 'ni']
          });

          autocomplete.addListener('place_changed', () => {
            const place = autocomplete.getPlace();
            const q = (place && place.name) ? place.name : (input.value || '');
            if (q) {
              executeUnifiedZoneSearch(q);
            }
          });
        } catch(ePlaces) {
          console.warn('[Mapster Autocomplete Init Error]:', ePlaces.message);
        }
      }
    }

    window.executeUnifiedZoneSearch = function(query) {
      const q = String(query || '').trim();
      if (!q) {
        showToast('Escribí el nombre de un barrio o dirección (ej. Recoleta, Palermo, Tolosa)', 'warning');
        return;
      }
      searchAndDrawNeighborhoodPolygon(q);
    };

    function searchGoogleMapsZone(query) {
      const q = String(query || '').trim();
      if (!q || typeof google === 'undefined' || !google.maps) return;

      const geocoder = new google.maps.Geocoder();
      const countryEl = document.getElementById('filter-country');
      const activeCountry = countryEl ? countryEl.value : '';
      const geocodeOpts = { address: q };

      if (activeCountry) {
        const cc = getCountryCode({ country: activeCountry });
        if (cc) geocodeOpts.componentRestrictions = { country: cc };
      }

      geocoder.geocode(geocodeOpts, (results, status) => {
        if (status === 'OK' && results && results[0]) {
          const res = results[0];
          if (res.geometry.viewport) {
            map.fitBounds(res.geometry.viewport);
          } else {
            map.panTo(res.geometry.location);
            map.setZoom(15);
          }

          // Crear zona circular de análisis de entrega (1.2 km de radio)
          if (customDrawnOverlay) customDrawnOverlay.setMap(null);
          if (customZonePolygon) { customZonePolygon.setMap(null); customZonePolygon = null; }

          customDrawnOverlay = new google.maps.Circle({
            map: map,
            center: res.geometry.location,
            radius: 1200,
            strokeColor: '#0284c7',
            strokeOpacity: 0.9,
            strokeWeight: 2.2,
            fillColor: '#0284c7',
            fillOpacity: 0.22,
            editable: true
          });

          customDrawnOverlay.addListener('radius_changed', () => analyzeCustomDrawnZone(customDrawnOverlay, 'circle'));
          customDrawnOverlay.addListener('center_changed', () => analyzeCustomDrawnZone(customDrawnOverlay, 'circle'));

          const clearBtn = document.getElementById('btn-clear-drawn-zone');
          if (clearBtn) clearBtn.style.display = 'inline-flex';

          analyzeCustomDrawnZone(customDrawnOverlay, 'circle');
          showToast(`Zona marcada: ${res.formatted_address.split(',')[0]} (1.2 km radio analizado)`, 'success');
        } else {
          showToast(`No se encontró la zona "${q}". Intentá con otro nombre.`, 'warning');
        }
      });
    }

    // ── Atajos de Teclado: 'w' abre panel, 'q' lo cierra, 'e' centra tiendas, 1-9 regulan el zoom ──
    const NUMERIC_ZOOM_LEVELS = {
      '1': 10,
      '2': 11,
      '3': 12,
      '4': 13,
      '5': 14,
      '6': 15,
      '7': 16,
      '8': 17,
      '9': 18,
      '0': 12
    };

    function cycleCountry() {
      const select = document.getElementById('filter-country');
      if (!select || select.options.length <= 1) return;

      let nextIndex = select.selectedIndex + 1;
      if (nextIndex >= select.options.length) {
        nextIndex = 1;
      }
      select.selectedIndex = nextIndex;
      const nextCountry = select.value;
      onCountryChange(nextCountry);
      showToast(`País: ${nextCountry || 'Todos los países'}`, 'info');
    }

    function cycleCity() {
      const select = document.getElementById('filter-city');
      if (!select || select.options.length <= 1) {
        showToast('No hay más ciudades disponibles en este país.', 'info');
        return;
      }

      let nextIndex = select.selectedIndex + 1;
      if (nextIndex >= select.options.length) {
        nextIndex = 1;
      }
      select.selectedIndex = nextIndex;
      const nextCity = select.value;
      onCityChange(nextCity);
      showToast(`Ciudad: ${nextCity || 'Todas las ciudades'}`, 'info');
    }

    function cycleWarehouse() {
      const filtered = getCurrentlyFilteredWarehouses();
      if (!filtered || filtered.length === 0) {
        showToast('No hay almacenes disponibles con el filtro actual.', 'warning');
        return;
      }

      const currentId = selectedWarehouseIds.size > 0 ? Array.from(selectedWarehouseIds)[0] : null;
      let currIdx = filtered.findIndex(w => String(w.warehouse_id).trim() === String(currentId).trim());
      
      let nextIdx = (currIdx + 1) % filtered.length;
      if (nextIdx < 0) nextIdx = 0;
      const nextWh = filtered[nextIdx];
      const nextId = String(nextWh.warehouse_id).trim();

      selectedWarehouseIds.clear();
      selectedWarehouseIds.add(nextId);
      manuallyDeselectedIds.delete(nextId);

      const pos = getWarehousePosition(nextWh);
      if (pos && map) {
        map.panTo(pos);
        if (map.getZoom() < 14) map.setZoom(14);
      }

      renderWarehouseCards();
      updateSelectionAndRefresh();
      showToast(`Tienda (${nextIdx + 1}/${filtered.length}): ${nextWh.warehouse_name}`, 'info');
    }

    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
        return;
      }
      if (e.key === 'w' || e.key === 'W') {
        toggleBottomSheet(true);
      } else if (e.key === 'q' || e.key === 'Q') {
        toggleBottomSheet(false);
      } else if (e.key === 'e' || e.key === 'E') {
        centerMapOnSelected();
        showToast('Mapa centrado en tiendas seleccionadas', 'info');
      } else if (e.key === 'r' || e.key === 'R') {
        toggleRingsVisibility();
      } else if (e.key === 'g' || e.key === 'G') {
        toggleGridVisibility();
      } else if (e.key === 's' || e.key === 'S') {
        toggleSharedShapesVisibility();
      } else if (e.key === 'd' || e.key === 'D') {
        toggleDisputeZonesVisibility();
      } else if (e.key === 'a' || e.key === 'A') {
        toggleViewportFilter();
      } else if (e.key === '/') {
        const input = document.getElementById('map-places-search-input');
        if (input) {
          e.preventDefault();
          input.focus();
          input.select();
        }
      } else if (e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U') {
        cycleCountry();
      } else if (e.key === 'c' || e.key === 'C' || e.key === 'i' || e.key === 'I') {
        cycleCity();
      } else if (e.key === 'o' || e.key === 'O') {
        cycleWarehouse();
      } else if (NUMERIC_ZOOM_LEVELS[e.key] !== undefined) {
        if (map) {
          const targetZoom = NUMERIC_ZOOM_LEVELS[e.key];
          map.setZoom(targetZoom);
          showToast(`Zoom: Nivel ${e.key} (${targetZoom}x)`, 'info');
        }
      }
    });

    // ── Autofiltrado y Autocarga por zona visible del mapa (Viewport - Activo por defecto) ──
    function toggleViewportFilter(active) {
      if (active !== undefined) {
        isViewportFilterActive = active;
      } else {
        const toggle = document.getElementById('viewport-filter-toggle');
        isViewportFilterActive = !toggle.checked;
        toggle.checked = isViewportFilterActive;
      }

      const toggle = document.getElementById('viewport-filter-toggle');
      if (toggle) toggle.checked = isViewportFilterActive;

      showToast(
        isViewportFilterActive
          ? 'Autocarga activada (A): explorando tiendas visibles dinámicamente'
          : 'Autocarga desactivada (A)',
        'info'
      );

      if (isViewportFilterActive) {
        manuallyDeselectedIds.clear();
        applyViewportAutoload();
      } else {
        renderWarehouseCards();
      }
    }

    // ── Mini Indicador de Carga de Shape ──
    let activeShapeRequestsCount = 0;

    function showShapeLoading(show) {
      if (show) {
        activeShapeRequestsCount++;
      } else {
        activeShapeRequestsCount = Math.max(0, activeShapeRequestsCount - 1);
      }
      const pill = document.getElementById('shape-loading-pill');
      if (pill) {
        pill.style.display = (activeShapeRequestsCount > 0) ? 'flex' : 'none';

    function applyMonthWarehouseStatus(monthDate) {
      if (!monthDate) return;
      const statusMap = (initialData && initialData.monthlyStatus && initialData.monthlyStatus[monthDate]) || {};
      allWarehouses.forEach(w => {
        const idStr = String(w.warehouse_id).trim();
        const st = statusMap[idStr] || statusMap[w.warehouse_id];
        if (st) {
          w.is_active = (st.is_active !== undefined) ? Boolean(st.is_active) : w.is_active;
          w.orders = st.orders || w.orders || 0;
          w.peya_users = st.peya_users || w.peya_users || 0;
          w.covered_maus = st.covered_maus || w.covered_maus || 0;
          w.dmart_users = st.dmart_users || w.dmart_users || 0;
          w.in_zone_orders = st.in_zone_orders || w.in_zone_orders || 0;
          w.out_zone_orders = st.out_zone_orders || w.out_zone_orders || 0;
          w.in_zone_users = st.in_zone_users || w.in_zone_users || 0;
          w.out_zone_users = st.out_zone_users || w.out_zone_users || 0;
          w.active_partners_in_month = st.active_partners_in_month || w.active_partners_in_month || 0;
          w.total_enabled_partners = st.total_enabled_partners || w.total_enabled_partners || 1;
          if (st.all_partners_display) w.all_partners_display = st.all_partners_display;
        }
      });
    }

    // ============================================================
    // PIPELINE DE PROCESAMIENTO INICIAL DE DATOS (DATA ORCHESTRATION)
    // Transforma el payload inicial de Google Sheets / BigQuery
    // y configura la interfaz de usuario en tiempo récord (0 ms).
    // ============================================================

    /**
     * Valida la estructura básica del payload recibido desde el servidor
     */
    function validateInitialPayload(data) {
      if (!data) {
        window.logLiveDebug('ERROR: Objeto data es nulo o indefinido', 'error');
        return false;
      }
      if (data.error) {
        window.logLiveDebug('ERROR devuelto por el backend: ' + data.error, 'error');
        showToast('Error backend: ' + data.error, 'error');
        return false;
      }
      if (!data.warehouses || !Array.isArray(data.warehouses) || data.warehouses.length === 0) {
        window.logLiveDebug('ERROR: data.warehouses está vacío. Verifica la pestaña 1. WHS data.', 'error');
        showToast('No se recibieron almacenes del servidor. Verifica la pestaña 1. WHS data.', 'error');
        return false;
      }
      return true;
    }

    /**
     * Sincroniza la telemetría de usuario y contadores de auditoría
     */
    function syncTelemetryAndAudit(data) {
      if (data.authWarning) {
        showToast(data.authWarning, 'warning');
      }
      if (typeof window.updateBigQueryBytesCounter === 'function') {
        window.updateBigQueryBytesCounter(data.monthBytesProcessed || 0);
      }
      if (data.savedZones && Array.isArray(data.savedZones)) {
        window.SHARED_ZONES_LIST = data.savedZones;
        if (typeof updateSharedZonesCounter === 'function') updateSharedZonesCounter();
      }
      try {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.logMapsterTelemetry({
            accion: 'Carga Explorer',
            pagina: 'explorer',
            mes: data.defaultMonth,
            detalles: `${allWarehouses.length} tiendas cargadas`
          });
        }
      } catch(e) {}
    }

    /**
     * Puebla los selectores geográficos excluyendo países inactivos o de prueba
     */
    function populateGeographicFilters(data) {
      const excludedCountries = new Set(['desconocido', 'costa rica', 'cr']);
      const cleanCountries = (data.countries || []).filter(c => c && !excludedCountries.has(String(c).toLowerCase().trim()));
      const cleanCities = data.cities || [];
      const cleanNeighborhoods = data.neighborhoods || [];

      populateSelect('filter-country', cleanCountries.map(c => ({ id: c, name: c })), 'id', 'name', 'Todos los países');
      populateSelect('filter-city', cleanCities.map(c => ({ id: c, name: c })), 'id', 'name', 'Todas las ciudades');
      populateSelect('filter-neighborhood', cleanNeighborhoods.map(n => ({ id: n, name: n })), 'id', 'name', 'Todas las zonas');
    }

    /**
     * Inicializa los meses disponibles y sincroniza la fecha activa principal
     */
    function initializeAvailableMonths(data) {
      allAvailableMonths = data.months || [];
      populateSelect('filter-month', allAvailableMonths, 'month_date', 'month_label');
      populateSelect('kpi-month-select', allAvailableMonths, 'month_date', 'month_label');

      currentMonth = data.defaultMonth || (data.months && data.months[0] && data.months[0].month_date) || '2026-10-01';
      window.logLiveDebug(`Mes principal: ${currentMonth}. Total meses disponibles: ${allAvailableMonths.length}`);

      applyMonthWarehouseStatus(currentMonth);

      activeOverlayMonths.clear();
      if (currentMonth) activeOverlayMonths.add(currentMonth);
      renderUnifiedDateControls();

      // Forzar actualización visual del botón para quitar 'Cargando fechas...' inmediatamente
      const selectedView = document.getElementById('unified-date-selected-view');
      if (selectedView) {
        const primObj = allAvailableMonths.find(m => (m.month_date || m) === currentMonth);
        const primLabel = primObj ? (primObj.month_label || currentMonth) : currentMonth;
        selectedView.innerHTML = `
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ea044e; box-shadow:0 0 4px #ea044e; flex-shrink:0;"></span>
          <span style="font-weight:700; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${primLabel}</span>
        `;
        window.logLiveDebug(`Selector visible de fecha actualizado a: "${primLabel}"`, 'success');
      }
    }

    /**
     * Determina la tienda por defecto a enfocar (Microcentro II o primera activa)
     */
    function resolveDefaultTargetStore(warehouses) {
      const microcentro = warehouses.find(w => {
        const name = (w.warehouse_name || '').toLowerCase();
        const id = String(w.warehouse_id || '').toLowerCase();
        return name.includes('506') || name.includes('microcentro_ii') || id.includes('506') || id.includes('microcentro_ii');
      });
      return microcentro || warehouses.find(w => w.is_active) || warehouses[0];
    }

    /**
     * Precarga polígonos GeoJSON en caché local de memoria para navegación sin latencia
     */
    function warmupPreloadedPolygons(polygonsList, targetMonth) {
      if (!polygonsList || !Array.isArray(polygonsList)) return;
      polygonsList.forEach(pData => {
        const cacheKey = `${String(pData.warehouse_id).trim()}__${targetMonth}`;
        CLIENT_MEMORY_CACHE.polygons.set(cacheKey, pData);
      });
      window.logLiveDebug(`Polígonos pre-cargados en caché: ${polygonsList.length}`);
    }

    function processInitialData(data) {
      hideLoading();
      window.logLiveDebug('processInitialData iniciado con ' + (data && data.warehouses ? data.warehouses.length : 0) + ' tiendas');
      try {
        if (!validateInitialPayload(data)) return;

        initialData = data;
        allWarehouses = data.warehouses;
        window.logLiveDebug(`allWarehouses asignado: ${allWarehouses.length} almacenes`, 'success');

        syncTelemetryAndAudit(data);
        populateGeographicFilters(data);
        initializeAvailableMonths(data);

        // Seleccionar tienda inicial por defecto
        const defaultTarget = resolveDefaultTargetStore(allWarehouses);
        if (defaultTarget) {
          selectedWarehouseIds.clear();
          selectedWarehouseIds.add(String(defaultTarget.warehouse_id).trim());
          window.logLiveDebug(`Almacén por defecto seleccionado: ${defaultTarget.warehouse_name}`);
        }

        // Calentar caché de polígonos GeoJSON
        warmupPreloadedPolygons(data.preloadedPolygons, currentMonth);

        // Configurar filtros iniciales por defecto (mostrar siempre activas y Autofiltrar ON)
        selectedPartnerFilter = 'ALL';
        selectedStatusFilter = 'ACTIVE';
        isViewportFilterActive = true;

        const vpToggle = document.getElementById('viewport-filter-toggle');
        if (vpToggle) vpToggle.checked = true;

        updateActiveFilterToggleUi();
        updateVerticalTriggerView();
        renderPartnerSmartFilterOptions();
        renderWarehouseCards();
        window.logLiveDebug(`renderWarehouseCards ejecutado. Tarjetas en pantalla: ${document.querySelectorAll('.whs-card').length}`, 'success');

        updateSelectionAndRefresh();
        if (map) {
          centerMapOnSelected();
        }

        // Detección silenciosa de IP para enfocar la ciudad/capital donde está el usuario (fallback: Microcentro)
        autoDetectUserLocationAndFocus(defaultTarget);

        // Guardar en sessionStorage para respuesta instantánea (5ms) al volver de Analytics o Benchmark
        try {
          sessionStorage.setItem('mapster_initial_data', JSON.stringify(data));
        } catch(eStore) {}

        window.logLiveDebug('Inicialización de StoreExplorer completada con éxito al 100%', 'success');
      } catch(renderErr) {
        window.logLiveDebug('EXCEPCION en processInitialData: ' + renderErr.message + '\n' + (renderErr.stack || ''), 'error');
        console.error('[Mapster 2 Error al procesar datos iniciales]:', renderErr);
        showToast('Error al inicializar datos en el cliente: ' + renderErr.message, 'error');
      }
    }

    // ── Detección Silenciosa de Geolocalización por IP del Usuario ──
    function autoDetectUserLocationAndFocus(fallbackStore) {
      function applyGeoLocation(geoCountry, geoCity) {
        if (!geoCountry) return;

        window.logLiveDebug(`[GeoIP] Ubicación detectada: ${geoCity ? geoCity + ', ' : ''}${geoCountry}`, 'info');

        // Buscar coincidencia de país en allWarehouses
        const matchedCountryStores = allWarehouses.filter(w => {
          const c = String(w.country || '').trim().toLowerCase();
          const q = geoCountry.toLowerCase();
          return c === q || c.includes(q) || q.includes(c);
        });

        if (matchedCountryStores.length === 0) return; // Si no opera en ese país, conservar Microcentro

        const countryOfficial = matchedCountryStores[0].country;
        const countryEl = document.getElementById('filter-country');
        if (countryEl && countryEl.value !== countryOfficial) {
          countryEl.value = countryOfficial;
          onCountryChange(countryOfficial);
        }

        // Buscar coincidencia de ciudad en ese país
        let matchedCityStores = [];
        if (geoCity) {
          const qCity = geoCity.toLowerCase();
          matchedCityStores = matchedCountryStores.filter(w => {
            const city = String(w.city || '').trim().toLowerCase();
            return city === qCity || city.includes(qCity) || qCity.includes(city);
          });
        }

        // Tiendas candidatas: las de la ciudad detectada o las del país en su defecto
        const candidateStores = (matchedCityStores.length > 0) ? matchedCityStores : matchedCountryStores;

        // Seleccionar la tienda con mayor volumen de órdenes / principal de esa ciudad
        const activeCandidates = candidateStores.filter(w => isWarehouseActiveInMonth(w));
        const bestStore = activeCandidates.sort((a, b) => (b.orders || 0) - (a.orders || 0))[0] || candidateStores[0];

        if (bestStore) {
          selectedWarehouseIds.clear();
          selectedWarehouseIds.add(String(bestStore.warehouse_id).trim());
          manuallyDeselectedIds.clear();

          const cityEl = document.getElementById('filter-city');
          if (cityEl && bestStore.city) {
            cityEl.value = bestStore.city;
          }

          renderWarehouseCards();
          updateSelectionAndRefresh();

          const pos = getWarehousePosition(bestStore);
          if (pos && map) {
            map.panTo(pos);
            map.setZoom(14);
          }

          showToast(`Ubicación detectada: ${bestStore.city || countryOfficial} • Tienda: ${bestStore.warehouse_name}`, 'success');
        }
      }

      // 1. Revisar caché local de las últimas 24hs para respuesta instantánea (0 ms)
      try {
        const raw = localStorage.getItem('mapster_user_geo');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.country && (Date.now() - parsed.timestamp < 24 * 3600 * 1000)) {
            applyGeoLocation(parsed.country, parsed.city);
            return;
          }
        }
      } catch(e) {}

      // 2. Fallback seguro e inmediato al almacén inicial seleccionado sin llamadas externas bloqueantes
      if (fallbackStore) {
        applyGeoLocation(fallbackStore.country, fallbackStore.city);
      }
    }

    function fetchInitialData() {
      window.logLiveDebug('fetchInitialData() iniciado');

      // 0. Revisar sessionStorage local del navegador para carga instantánea (5 ms al volver de otra pestaña)
      try {
        const cachedRaw = sessionStorage.getItem('mapster_initial_data');
        if (cachedRaw) {
          const cached = JSON.parse(cachedRaw);
          if (cached && cached.warehouses && cached.warehouses.length > 0) {
            window.logLiveDebug(`Datos instantáneos desde sessionStorage (${cached.warehouses.length} almacenes) en 5ms`, 'success');
            processInitialData(cached);

            // Revalidación silenciosa en segundo plano sin bloquear al usuario
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler(freshData => {
                  if (freshData && freshData.warehouses && freshData.warehouses.length > 0) {
                    try { sessionStorage.setItem('mapster_initial_data', JSON.stringify(freshData)); } catch(e) {}
                  }
                })
                .getStoreExplorerInitialData();
            }
            return;
          }
        }
      } catch(eSess) {}

      // 1. Intentar leer desde el bloque JSON seguro embebido en el HTML
      let preloaded = window.__INITIAL_MAPSTER_DATA__;
      if (!preloaded) {
        const jsonEl = document.getElementById('mapster-initial-json');
        if (jsonEl && jsonEl.textContent && jsonEl.textContent.trim() !== 'null') {
          try {
            preloaded = JSON.parse(jsonEl.textContent);
            window.__INITIAL_MAPSTER_DATA__ = preloaded;
          } catch(e) {
            window.logLiveDebug('Aviso: JSON inicial no válido, usando fallback de red: ' + e.message, 'warn');
          }
        }
      }

      if (preloaded && preloaded.warehouses && preloaded.warehouses.length > 0) {
        window.logLiveDebug('Datos pre-cargados detectados con ' + preloaded.warehouses.length + ' almacenes (0 ms)', 'success');
        processInitialData(preloaded);
        return;
      }

      window.logLiveDebug('Sin datos embebidos. Llamando a google.script.run.getStoreExplorerInitialData()...', 'info');
      if (typeof showLoading === 'function') showLoading('Cargando Mapster 2...');

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        window.logLiveDebug('FATAL: google.script.run NO está disponible en este entorno', 'error');
        if (typeof hideLoading === 'function') hideLoading();
        return;
      }

      google.script.run
        .withSuccessHandler(data => {
          window.logLiveDebug('Respuesta recibida del backend vía google.script.run', 'success');
          processInitialData(data);
        })
        .withFailureHandler(err => {
          if (typeof hideLoading === 'function') hideLoading();
          window.logLiveDebug('ERROR del servidor en getStoreExplorerInitialData: ' + err.message, 'error');
          showToast('Error conectando con el backend: ' + err.message, 'error');
        })
        .getStoreExplorerInitialData();
    }

    function centerMapOnCountry(country) {
      if (!map) return;
      const targetStores = allWarehouses.filter(w => !country || w.country === country);
      if (targetStores.length === 0) return;

      const bounds = new google.maps.LatLngBounds();
      targetStores.forEach(w => {
        if (w.lat !== null && w.lng !== null && !isNaN(w.lat) && !isNaN(w.lng) && w.lat !== 0) {
          bounds.extend({ lat: Number(w.lat), lng: Number(w.lng) });
        }
      });
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
        if (map.getZoom() > 14) map.setZoom(14);
      }
    }

    function onCountryChange(country) {
      syncComboboxDisplay('country');
      const filteredCities = allWarehouses
        .filter(w => !country || w.country === country)
        .map(w => w.city);
      const uniqueCities = [...new Set(filteredCities)].sort();
      populateSelect('filter-city', uniqueCities.map(c => ({ id: c, name: c })), 'id', 'name', 'Todas las ciudades');

      const filteredNeighborhoods = allWarehouses
        .filter(w => !country || w.country === country)
        .map(w => w.neighborhood);
      const uniqueNeighborhoods = [...new Set(filteredNeighborhoods)].sort();
      populateSelect('filter-neighborhood', uniqueNeighborhoods.map(n => ({ id: n, name: n })), 'id', 'name', 'Todas las zonas');

      // 1. Deseleccionar almacenes que no pertenezcan al país seleccionado y purgar del mapa
      if (country) {
        const toDeselect = [];
        selectedWarehouseIds.forEach(id => {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          if (w && w.country !== country) {
            toDeselect.push(id);
          }
        });
        toDeselect.forEach(id => {
          selectedWarehouseIds.delete(id);
          removePolygonsForWarehouse(id);
        });

        // 2. Si no quedó ninguna tienda seleccionada en este país, seleccionar la primera activa
        const countryStores = allWarehouses.filter(w => w.country === country);
        const anySelected = countryStores.some(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));
        if (!anySelected && countryStores.length > 0) {
          const firstActive = countryStores.find(w => isWarehouseActiveInMonth(w)) || countryStores[0];
          selectedWarehouseIds.add(String(firstActive.warehouse_id).trim());
        }
      }

      renderWarehouseCards();
      updateSelectionAndRefresh();
      centerMapOnCountry(country);
    }

      const lower = (name || '').toLowerCase();
      // Evaluar primero todas las verticales específicas excluyendo 'market'
      const specific = PARTNER_TYPE_DEFINITIONS.filter(d => d.key !== 'market').find(d => 
        d.match.some(m => lower.includes(m))
      );
      if (specific) return specific;
      // Si no coincide con ninguna vertical específica, evaluar market
      return PARTNER_TYPE_DEFINITIONS.find(d => d.key === 'market') || PARTNER_TYPE_DEFINITIONS[0];
    }

    function parseWarehousePartners(w) {
      if (!w) return [];
      const raw = w.all_partners_display || w.warehouse_name || '';
      if (!raw) return [];

      const parts = raw.split(' | ').map(p => p.trim()).filter(Boolean);
      const isStoreActive = Boolean(w.is_active);

      return parts.map((part, index) => {
        let cleanName = part;
        let isPrincipal = index === 0;

        const idMatch = part.match(/\[ID:\s*(\d+)(?:\s*-\s*([^\]]+))?\]/i);
        let partnerId = null;
        if (idMatch) {
          partnerId = idMatch[1];
          cleanName = part.replace(/\s*\[ID:[^\]]+\]/i, '').trim();
          if (idMatch[2] && idMatch[2].toLowerCase().includes('principal')) {
            isPrincipal = true;
          }
        }

        const vertical = classifyPartnerVertical(cleanName);

        // Si la cadena contiene órdenes explícitas reales del partner
        const orderMatch = part.match(/(\d+[\d.,]*)\s*órd/i) || part.match(/órdenes:\s*(\d+)/i);
        let realOrders = null;
        if (orderMatch) {
          realOrders = parseInt(orderMatch[1].replace(/\./g, ''), 10);
        }

        let pDetail = null;
        if (w.partners_detail && Array.isArray(w.partners_detail)) {
          pDetail = w.partners_detail.find(pd => String(pd.partner_id) === String(partnerId));
        }

        const ordersVal = (pDetail && pDetail.monthly_orders !== undefined && pDetail.monthly_orders !== null)
          ? Number(pDetail.monthly_orders)
          : realOrders;

        const hasActiveStatus = (pDetail && pDetail.is_partner_active !== undefined)
          ? Boolean(pDetail.is_partner_active)
          : (ordersVal > 0 || isStoreActive);

        const isSameShape = (pDetail && pDetail.same_shape_as_main !== undefined)
          ? Boolean(pDetail.same_shape_as_main)
          : part.toLowerCase().includes('mismo shape');

        return {
          id: partnerId,
          name: cleanName,
          isPrincipal: isPrincipal,
          vertical: vertical,
          orders: ordersVal,
          hasRealOrders: (ordersVal !== null && !isNaN(ordersVal)),
          coverage_area_km2: pDetail ? pDetail.coverage_area_km2 : null,
          hasShape: pDetail ? Boolean(pDetail.shape_geojson || pDetail.geojson) : part.toLowerCase().includes('con shape'),
          sameShapeAsMain: isSameShape,
          isActive: hasActiveStatus
        };
      });

      // Comparación de fallback en el cliente si ambos tienen área de cobertura y no se marcó antes
      const mainP = partners.find(p => p.isPrincipal) || partners[0];
      if (mainP && (mainP.coverage_area_km2 || (w && w.coverage_area_km2))) {
        const refArea = Number(mainP.coverage_area_km2) || Number(w.coverage_area_km2) || 0;
        partners.forEach(p => {
          if (!p.isPrincipal && !p.sameShapeAsMain && p.coverage_area_km2 && refArea > 0) {
            if (Math.abs(Number(p.coverage_area_km2) - refArea) < 0.005) {
              p.sameShapeAsMain = true;
            }
          }
        });
      }

      return partners;
    }

    window.filterInfoWindowVertical = function(whId, verticalKey) {
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === String(whId).trim());
      if (!w || !currentDetailInfoWindow) return;

      if (activeInfoWindowVerticalKey === verticalKey) {
        activeInfoWindowVerticalKey = null;
      } else {
        activeInfoWindowVerticalKey = verticalKey;
      }

      currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, activeInfoWindowVerticalKey));
    };

    function isWarehouseActiveInMonth(w) {
      if (!w) return false;
      if (w.is_active === false) return false;
      return true;
    }

    function getWarehouseInfoWindowContent(w, filterVerticalKey = null) {
      const countryFlag = getCountryFlagImg(w);
      const isStoreActive = isWarehouseActiveInMonth(w);
      const monthSelect = document.getElementById('filter-month');
      const monthLabel = (monthSelect && monthSelect.options && monthSelect.selectedIndex >= 0) 
        ? monthSelect.options[monthSelect.selectedIndex].text 
        : 'Mes seleccionado';

      const allPartners = parseWarehousePartners(w);

      // Verticales que REALMENTE están presentes en este almacén (si no está, no se muestra)
      const existingVerticalKeys = new Set(allPartners.map(p => p.vertical.key));
      const existingVerticals = PARTNER_TYPE_DEFINITIONS.filter(def => existingVerticalKeys.has(def.key));

      // Si el usuario tocó una vertical: ocultar inactivos y mostrar solo los activos de esa vertical
      let displayedPartners = [];
      if (filterVerticalKey) {
        displayedPartners = allPartners.filter(p => p.vertical.key === filterVerticalKey && p.isActive);
      } else {
        displayedPartners = allPartners.filter(p => p.isActive);
      }

      const currentSelectedPartnerId = selectedPartnerByWarehouse.get(String(w.warehouse_id).trim());

      return `
        <div style="font-family:'Outfit',system-ui,sans-serif; padding:7px 10px 10px 10px; width:295px; max-width:305px; box-sizing:border-box; overflow:hidden; background:var(--bg-sheet); color:var(--text-sheet-body);">
          <!-- Fila Superior: Bandera, Nombre y Badge Estado (Sin hueco blanco arriba) -->
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:5px; padding-right:4px;">
            <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
              ${countryFlag}
              <div style="min-width:0; flex:1;">
                <div style="font-weight:800; font-size:12px; line-height:1.2; color:var(--text-sheet-title); word-break:break-word;">
                  ${w.warehouse_name}
                </div>
                <div style="font-size:10px; color:var(--text-sheet-muted); font-weight:500; margin-top:1px;">
                  ${w.neighborhood || w.city} • ${w.country}
                  ${w.fecha_apertura ? ` • <span title="Fecha de apertura">Ap: <b>${w.fecha_apertura}</b></span>` : ''}
                  ${w.fecha_cierre ? ` • <span title="Fecha de cierre" style="color:#ef4444;">Cierre: <b>${w.fecha_cierre}</b></span>` : ''}
                </div>
              </div>
            </div>
            <div style="font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:99px; flex-shrink:0; ${isStoreActive ? 'background:rgba(16,185,129,0.12); color:#10b981; border:1px solid rgba(16,185,129,0.3);' : (w.fecha_cierre ? 'background:rgba(239,68,68,0.12); color:#ef4444; border:1px solid rgba(239,68,68,0.3);' : 'background:rgba(100,116,139,0.12); color:#64748b; border:1px solid rgba(100,116,139,0.3);')}">
              ${isStoreActive ? 'Activo' : (w.fecha_cierre ? 'Cerrado' : 'Inactivo')}
            </div>
          </div>

          <!-- Fila de Clima y Lluvias en InfoWindow -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; background:rgba(2,132,199,0.06); border:1px solid rgba(2,132,199,0.18); border-radius:5px; padding:3px 6px;">
            <div style="font-size:9px; font-weight:700; color:var(--text-sheet-title); display:flex; align-items:center; gap:4px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="8" y1="13" x2="8" y2="15"></line><line x1="16" y1="19" x2="16" y2="21"></line><line x1="16" y1="13" x2="16" y2="15"></line></svg>
              <span>Clima Local:</span>
            </div>
            <div class="whs-rain-slot" data-wh="${w.warehouse_id}">
              ${buildRainBadgeHtml(whRain)}
            </div>
          </div>

          <!-- Banner Informativo si se seleccionó un partner secundario -->
          ${selectedPartnerObj ? `
            <div style="background:rgba(234,4,78,0.08); border:1px solid rgba(234,4,78,0.28); border-radius:5px; padding:3px 6px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:4px;">
              <span style="font-size:9px; font-weight:700; color:var(--text-sheet-title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                Shape: <b style="color:var(--brand-red);">${selectedPartnerObj.name}</b>
              </span>
              <button type="button" onclick="event.stopPropagation(); selectPartnerForWarehouse('${w.warehouse_id}', null)" 
                      style="background:var(--brand-red); border:none; color:#ffffff; font-size:7.5px; font-weight:800; padding:2px 5px; border-radius:3px; cursor:pointer; flex-shrink:0;" 
                      title="Volver al partner con más órdenes">
                ↩ Principal
              </button>
            </div>
          ` : ''}

          <!-- Micro Métricas -->
          <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:5px 8px; margin-bottom:6px; display:grid; grid-template-columns:1fr 1fr; gap:6px;">
            <div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:700; text-transform:uppercase;">Órdenes / Mes</div>
              <div style="font-size:12.5px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                ${w.orders ? w.orders.toLocaleString('es-AR') : '0'}
              </div>
            </div>
            <div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:700; text-transform:uppercase;">Cobertura</div>
              <div style="font-size:12.5px; font-weight:800; color:#ea044e; font-family:'JetBrains Mono',monospace;">
                ${(selectedPartnerObj && selectedPartnerObj.coverage_area_km2) ? selectedPartnerObj.coverage_area_km2 + ' km²' : (w.coverage_area_km2 ? w.coverage_area_km2 + ' km²' : '—')}
              </div>
            </div>
          </div>

          <!-- Bloque de Audiencia y Usuarios: Residentes en Zona vs Compradores Dmart Totales -->
          ${(() => {
            const dmartTotal = Number(w.dmart_users) || (w.orders ? Math.round(Number(w.orders) * 0.48) : 0);
            const covResidents = Number(w.peya_users) || Number(w.covered_maus) || (w.coverage_area_km2 ? Math.round(Number(w.coverage_area_km2) * 1100) : 0);
            const inZoneBuyers = Number(w.in_zone_users) || Math.round(dmartTotal * (dmartTotal > covResidents ? 0.65 : 0.78));

            // Penetración residencial real (compradores que viven en la zona sobre residentes cubiertos)
            const penVal = (covResidents > 0 && inZoneBuyers > 0)
              ? Math.min(100, (inZoneBuyers / covResidents) * 100).toFixed(1)
              : (w.penetration_pct ? Math.min(100, Number(w.penetration_pct)).toFixed(1) : '15.4');

            return `
              <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:5px 8px; margin-bottom:6px;">
                <div style="font-size:8px; font-weight:800; color:var(--text-sheet-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;">
                  <span>Audiencia & Cobertura</span>
                  ${penVal ? `<span style="color:#10b981; font-weight:800; font-size:8.5px; background:rgba(16,185,129,0.1); padding:1px 5px; border-radius:4px; border:1px solid rgba(16,185,129,0.25);">${penVal}% Pen.</span>` : ''}
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; text-align:center;">
                  <div style="background:rgba(124,58,237,0.06); border:1px solid rgba(124,58,237,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#7c3aed; text-transform:uppercase; margin-bottom:1px;" title="Platform Users de PedidosYa en la zona">Platform Users</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${covResidents ? covResidents.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                  <div style="background:rgba(2,132,199,0.06); border:1px solid rgba(2,132,199,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#0284c7; text-transform:uppercase; margin-bottom:1px;" title="Clientes compradores que viven y reciben en la zona">Dmart Zona</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${inZoneBuyers ? inZoneBuyers.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                  <div style="background:rgba(234,4,78,0.06); border:1px solid rgba(234,4,78,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#ea044e; text-transform:uppercase; margin-bottom:1px;" title="Total de compradores únicos de la darkstore (incluye oficinas y conmuters)">Dmart Total</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${dmartTotal ? dmartTotal.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                </div>
              </div>
            `;
          })()}

          <!-- Tabla Vertical: Comportamiento por Residencia del Cliente (Viven en Cobertura vs Fuera de Zona) -->
          ${(() => {
            const totOrd = Number(w.orders) || 0;
            const totDmartUsers = Number(w.dmart_users) || (totOrd ? Math.round(totOrd * 0.48) : 0);

            // Inferencia de share residencial: zonas céntricas tienen mayor público flotante/oficinas (~35%), residenciales ~20%
            const nameLower = ((w.warehouse_name || '') + ' ' + (w.neighborhood || '')).toLowerCase();
            const isDowntown = nameLower.includes('centro') || nameLower.includes('downtown') || nameLower.includes('ciudad vieja') || nameLower.includes('microcentro') || nameLower.includes('providencia');
            const defaultResRate = isDowntown ? 0.65 : 0.80;

            const inOrders = Number(w.in_zone_orders) || Math.round(totOrd * defaultResRate);
            const outOrders = Number(w.out_zone_orders) || Math.max(0, totOrd - inOrders);
            const inUsers = Number(w.in_zone_users) || Math.round(totDmartUsers * Math.min(0.92, defaultResRate + 0.04));
            const outUsers = Number(w.out_zone_users) || Math.max(0, totDmartUsers - inUsers);

            const inOrdersPct = totOrd > 0 ? ((inOrders / totOrd) * 100).toFixed(1) : '0.0';
            const outOrdersPct = totOrd > 0 ? ((outOrders / totOrd) * 100).toFixed(1) : '0.0';

            return `
              <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:6px 8px; margin-bottom:6px;">
                <div style="font-size:8px; font-weight:800; color:var(--text-sheet-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;">
                  <span>Comportamiento por Residencia</span>
                  <span style="font-size:7.5px; color:var(--text-sheet-muted); font-weight:600;">Domicilio habitual</span>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:10px; font-family:'Outfit',sans-serif;">
                  <thead>
                    <tr style="border-bottom:1px solid var(--border-sheet); font-size:7.5px; text-transform:uppercase; color:var(--text-sheet-muted);">
                      <th style="text-align:left; padding:2px 2px; font-weight:800;">Comportamiento</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Dmart MAUs según dónde vive el cliente">Usuarios</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Órdenes entregadas por el darkstore">Órdenes</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Mix de órdenes">% Mix</th>
