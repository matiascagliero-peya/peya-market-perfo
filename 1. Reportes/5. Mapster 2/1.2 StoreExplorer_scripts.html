    function analyzeCustomDrawnZone(overlay, type) {
      if (!overlay) return;

      let areaKm2 = 0;
      let centerLatLng = null;

      if (type === 'polygon' || type === google.maps.drawing.OverlayType.POLYGON) {
        const areaM2 = google.maps.geometry.spherical.computeArea(overlay.getPath());
        areaKm2 = Number((areaM2 / 1000000).toFixed(2));
        const bounds = new google.maps.LatLngBounds();
        overlay.getPath().forEach(pt => bounds.extend(pt));
        centerLatLng = bounds.getCenter();
      } else {
        const radMeters = overlay.getRadius();
        areaKm2 = Number(((Math.PI * (radMeters / 1000) * (radMeters / 1000))).toFixed(2));
        centerLatLng = overlay.getCenter();
      }

      // Convertir la zona personalizada a polígono de Turf.js para análisis espacial booleano
      let customTurfPoly = null;
      if (typeof turf !== 'undefined') {
        try {
          if (type === 'polygon' || type === (google.maps.drawing && google.maps.drawing.OverlayType.POLYGON)) {
            const ring = [];
            overlay.getPath().forEach(pt => ring.push([pt.lng(), pt.lat()]));
            if (ring.length >= 3) {
              if (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1]) {
                ring.push([ring[0][0], ring[0][1]]);
              }
              customTurfPoly = turf.cleanCoords(turf.polygon([ring]));
            }
          } else if (overlay.getCenter && overlay.getRadius) {
            const c = overlay.getCenter();
            const radKm = overlay.getRadius() / 1000;
            customTurfPoly = turf.circle([c.lng(), c.lat()], radKm, { steps: 36, units: 'kilometers' });
          }
        } catch(ePoly) {}
      }

      function getWarehouseTurfPoly(w, month) {
        const normId = String(w.warehouse_id).trim();
        // 1. Polygon activo en el mapa
        const entry = multiDatePolygonsMap.get(`${normId}__${month}`) || activePolygonsMap.get(normId);
        if (entry) {
          if (entry.polygon && entry.polygon.getPath) {
            const r = [];
            entry.polygon.getPath().forEach(pt => r.push([pt.lng(), pt.lat()]));
            if (r.length >= 3) {
              if (r[0][0] !== r[r.length - 1][0] || r[0][1] !== r[r.length - 1][1]) r.push([r[0][0], r[0][1]]);
              try { return turf.cleanCoords(turf.polygon([r])); } catch(e) {}
            }
          }
          if (entry.coords) {
            const poly = coordsToTurfPolygon(entry.coords);
            if (poly) return poly;
          }
        }
        // 2. Caché local de memoria
        const pData = CLIENT_MEMORY_CACHE.polygons.get(`${normId}__${month}`);
        if (pData) {
          if (pData.geojson) {
            try { return turf.cleanCoords(turf.feature(pData.geojson)); } catch(e) {}
          }
          if (pData.coords) {
            const poly = coordsToTurfPolygon(pData.coords);
            if (poly) return poly;
          }
        }
        // 3. Fallback de coordenadas en objeto
        if (w.coords) {
          const poly = coordsToTurfPolygon(w.coords);
          if (poly) return poly;
        }
        return null;
      }

      // Encontrar almacenes cuyas áreas de cobertura o ubicación intersectan con la zona
      const currentMonth = document.getElementById('filter-month').value || (allAvailableMonths[0] && (allAvailableMonths[0].month_date || allAvailableMonths[0])) || '2026-10-01';
      const intersectingStores = [];
      const missingPolygonIds = [];

      allWarehouses.forEach(w => {
        if (!w.is_active && !isWarehouseActiveInMonth(w)) return;
        const pos = getWarehousePosition(w);
        if (!pos) return;

        const pt = new google.maps.LatLng(pos.lat, pos.lng);
        const distKm = centerLatLng
          ? (google.maps.geometry.spherical.computeDistanceBetween(pt, centerLatLng) / 1000)
          : 0;

        // Si la tienda está a más de 12 km del centro, no puede cubrir esta zona
        if (distKm > 12) return;

        let coversZone = false;
        let coveragePct = 0;

        // A. Verificar si el local físico está dentro del polígono
        let storePointInside = false;
        if (type === 'polygon' || type === (google.maps.drawing && google.maps.drawing.OverlayType.POLYGON)) {
          storePointInside = google.maps.geometry.poly.containsLocation(pt, overlay);
        } else if (overlay.getCenter && overlay.getRadius) {
          storePointInside = (distKm * 1000) <= overlay.getRadius();
        }

        // B. Verificar si el polígono de cobertura de la tienda intersecta la zona trazada
        const storeTurfPoly = getWarehouseTurfPoly(w, currentMonth);
        if (storeTurfPoly && customTurfPoly) {
          try {
            const isect = turf.intersect(customTurfPoly, storeTurfPoly);
            if (isect) {
              const isectAreaM2 = turf.area(isect);
              if (isectAreaM2 > 1000) {
                coversZone = true;
                const customAreaM2 = areaKm2 * 1000000;
                coveragePct = customAreaM2 > 0 ? Math.min(100, Math.round((isectAreaM2 / customAreaM2) * 100)) : 100;
              }
            }
          } catch(eIsect) {}
        } else if (!storeTurfPoly) {
          // La tienda está en la zona (< 5.2 km) pero su silueta GeoJSON no está en RAM
          if (distKm <= 5.2) {
            missingPolygonIds.push(w.warehouse_id);
            coversZone = true;
            coveragePct = Math.max(10, Math.round((1 - (distKm / 5.2)) * 100));
          }
        }

        if (storePointInside || coversZone) {
          intersectingStores.push({
            ...w,
            coveragePct: coveragePct,
            distanceKm: Number(distKm.toFixed(1))
          });
        }
      });

      // Ordenar tiendas por cobertura decreciente
      intersectingStores.sort((a, b) => (b.coveragePct || 0) - (a.coveragePct || 0));

      // Descargar silenciosamente en segundo plano los polígonos faltantes de tiendas cercanas
      if (missingPolygonIds.length > 0 && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(records => {
            if (records && Array.isArray(records) && records.length > 0) {
              records.forEach(r => {
                CLIENT_MEMORY_CACHE.polygons.set(`${r.warehouse_id}__${currentMonth}`, r);
              });
              // Re-calcular con las geometrías exactas descargadas
              analyzeCustomDrawnZone(overlay, type);
            }
          })
          .getStorePolygons(missingPolygonIds.slice(0, 8), currentMonth);
      }

      // Calcular Inteligencia de Canibalización usando Turf.js
      let overlapAreaKm2 = 0;
      if (typeof turf !== 'undefined' && customTurfPoly) {
        try {
          const storeFeatures = [];
          intersectingStores.forEach(s => {
            const p = getWarehouseTurfPoly(s, currentMonth);
            if (p) storeFeatures.push(p);
          });

          if (storeFeatures.length > 0) {
            let totalCoveredM2 = 0;
            storeFeatures.forEach(f => {
              const isect = turf.intersect(customTurfPoly, f);
              if (isect) totalCoveredM2 += turf.area(isect);
            });
            overlapAreaKm2 = Math.min(areaKm2, totalCoveredM2 / 1000000);
          } else if (intersectingStores.length > 0) {
            const maxCov = Math.max(...intersectingStores.map(s => s.coveragePct || 0));
            overlapAreaKm2 = (areaKm2 * maxCov) / 100;
          }
        } catch(eTurf) {}
      }

      const cannibalizedPct = areaKm2 > 0 ? Math.min(100, Math.round((overlapAreaKm2 / areaKm2) * 100)) : 0;
      const whitespacePct = Math.max(0, 100 - cannibalizedPct);

      // Calcular métricas estimadas de la zona seleccionada
      let totalPeyaMaus = 0;
      let totalDmartMaus = 0;
      let totalOrders = 0;
      let sumAfv = 0;
      let sumDt = 0;

      intersectingStores.forEach(w => {
        const orders = Number(w.monthly_orders || w.orders || 150);
        const dmart = Number(w.dmart_users || Math.round(orders * 0.48));
        const peya = Number(w.peya_users || Math.round(dmart * 3.2));
        totalPeyaMaus += peya;
        totalDmartMaus += dmart;
        totalOrders += orders;
        sumAfv += 14.2;
        sumDt += 21.5;
      });

      const avgAfv = intersectingStores.length > 0 ? (sumAfv / intersectingStores.length).toFixed(2) : '14.20';
      const avgDt = intersectingStores.length > 0 ? (sumDt / intersectingStores.length).toFixed(1) : '21.0';
      const penPct = totalPeyaMaus > 0 ? ((totalDmartMaus / totalPeyaMaus) * 100).toFixed(1) : '0.0';

      customZoneLastMetrics = {
        areaKm2: areaKm2,
        storesCount: intersectingStores.length,
        peyaMaus: totalPeyaMaus,
        dmartMaus: totalDmartMaus,
        penPct: penPct,
        orders: totalOrders,
        afv: avgAfv,
        dt: avgDt,
        stores: intersectingStores
      };

      // Guardar estructura completa para persistencia comunitaria con ubicación inteligente
      let coordsArray = [];
      if (type === 'polygon' || (google.maps.drawing && type === google.maps.drawing.OverlayType.POLYGON)) {
        overlay.getPath().forEach(pt => {
          coordsArray.push({ lat: Number(pt.lat().toFixed(6)), lng: Number(pt.lng().toFixed(6)) });
        });
      } else if (overlay.getCenter) {
        const c = overlay.getCenter();
        coordsArray = [{ lat: Number(c.lat().toFixed(6)), lng: Number(c.lng().toFixed(6)), radius: overlay.getRadius() }];
      }

      // Determinar ubicación geográfica inteligente (País, Ciudad, Barrio)
      let zoneCountry = document.getElementById('filter-country').value || '';
      let zoneCity = document.getElementById('filter-city').value || '';
      let zoneNeighborhood = document.getElementById('filter-neighborhood').value || '';

      if (intersectingStores.length > 0) {
        const primaryStore = intersectingStores[0];
        zoneCountry = primaryStore.country || zoneCountry;
        zoneCity = primaryStore.city || zoneCity;
        zoneNeighborhood = primaryStore.neighborhood || zoneNeighborhood;
      } else if (centerLatLng) {
        let minDistance = Infinity;
        let nearestStore = null;
        allWarehouses.forEach(w => {
          const pos = getWarehousePosition(w);
          if (pos) {
            const d = google.maps.geometry.spherical.computeDistanceBetween(centerLatLng, new google.maps.LatLng(pos.lat, pos.lng));
            if (d < minDistance) {
              minDistance = d;
              nearestStore = w;
            }
          }
        });
        if (nearestStore && minDistance < 25000) {
          zoneCountry = nearestStore.country || zoneCountry;
          zoneCity = nearestStore.city || zoneCity;
          zoneNeighborhood = nearestStore.neighborhood || zoneNeighborhood;
        }
      }

      const locationParts = [zoneNeighborhood, zoneCity, zoneCountry].filter(Boolean);
      const autoName = locationParts.length > 0 ? `${locationParts.join(', ')} (${areaKm2} km²)` : `Zona (${areaKm2} km²)`;

      window.CURRENT_CUSTOM_ZONE_DATA = {
        name: autoName,
        type: (type === 'circle' || (google.maps.drawing && type === google.maps.drawing.OverlayType.CIRCLE)) ? 'circle' : 'polygon',
        coords: coordsArray,
        area_km2: areaKm2,
        peya_maus: totalPeyaMaus,
        dmart_maus: totalDmartMaus,
        penetration_pct: Number(penPct),
        orders: totalOrders,
        afv: Number(avgAfv),
        avg_dt: Number(avgDt),
        stores_text: intersectingStores.map(s => s.warehouse_name).join(', '),
        country: zoneCountry,
        city: zoneCity,
        neighborhood: zoneNeighborhood
      };

      // Actualizar UI del card flotante con soporte para zonas de expansión
      const isExpansionZone = (intersectingStores.length === 0);
      let dispPeyaMaus = totalPeyaMaus;
      let dispDmartMaus = totalDmartMaus;
      let dispOrders = totalOrders;
      let dispPen = penPct;

      if (isExpansionZone) {
        dispPeyaMaus = Math.round(areaKm2 * 1950);
        dispDmartMaus = Math.round(dispPeyaMaus * 0.145);
        dispOrders = Math.round(dispDmartMaus * 2.15);
        dispPen = '14.5% (Target)';
      }

      document.getElementById('zone-val-area').textContent = `${areaKm2} km²`;
      document.getElementById('zone-val-stores').textContent = isExpansionZone ? '0 (Expansión)' : intersectingStores.length;
      document.getElementById('zone-val-peya-maus').textContent = isExpansionZone ? `${dispPeyaMaus.toLocaleString('es-AR')} (Est.)` : (dispPeyaMaus > 0 ? dispPeyaMaus.toLocaleString('es-AR') : '—');
      document.getElementById('zone-val-dmart-maus').textContent = isExpansionZone ? `${dispDmartMaus.toLocaleString('es-AR')} (Potencial)` : (dispDmartMaus > 0 ? dispDmartMaus.toLocaleString('es-AR') : '—');
      document.getElementById('zone-val-pen').textContent = isExpansionZone ? dispPen : `${dispPen}%`;
      document.getElementById('zone-val-orders').textContent = isExpansionZone ? `${dispOrders.toLocaleString('es-AR')} (Potencial)` : (dispOrders > 0 ? dispOrders.toLocaleString('es-AR') : '—');
      const freqVal = (dispDmartMaus > 0 && dispOrders > 0) ? (dispOrders / dispDmartMaus).toFixed(1) : '2.1';
      const freqEl = document.getElementById('zone-val-freq');
      if (freqEl) freqEl.textContent = `${freqVal}x`;
      document.getElementById('zone-val-high-income').textContent = '—';
      document.getElementById('zone-val-core-users').textContent = '—';

      // Actualizar barras de canibalización
      const canniBarContainer = document.getElementById('zone-cannibalization-bar');
      const canniBar = document.getElementById('zone-bar-cannibalized');
      const whiteBar = document.getElementById('zone-bar-whitespace');
      const lblCanni = document.getElementById('zone-lbl-cannibalized');
      const lblWhite = document.getElementById('zone-lbl-whitespace');

      if (canniBarContainer && (type === 'polygon' || type === google.maps.drawing.OverlayType.POLYGON)) {
        canniBarContainer.style.display = 'block';
        canniBar.style.width = `${cannibalizedPct}%`;
        whiteBar.style.width = `${whitespacePct}%`;
        
        canniBar.textContent = cannibalizedPct >= 15 ? `${cannibalizedPct.toFixed(1)}%` : '';
        whiteBar.textContent = whitespacePct >= 15 ? `${whitespacePct.toFixed(1)}% White Space` : '';

        lblCanni.textContent = `Canibalización: ${cannibalizedPct.toFixed(1)}%`;
        lblWhite.textContent = `White Space: ${whitespacePct.toFixed(1)}%`;
      } else if (canniBarContainer) {
        canniBarContainer.style.display = 'none';
      }
      document.getElementById('zone-val-afv').textContent = `$ ${avgAfv}`;
      document.getElementById('zone-val-dt').textContent = `${avgDt} min`;
      const zoneCpoEl = document.getElementById('zone-val-cpo');
      if (zoneCpoEl) {
        zoneCpoEl.textContent = `$ ${(1.25 + (parseFloat(avgDt) * 0.055)).toFixed(2)}`;
      }

      const listContainer = document.getElementById('zone-stores-list');
      if (listContainer) {
        if (intersectingStores.length === 0) {
          listContainer.innerHTML = '<span style="font-size:10px; color:var(--text-sheet-muted); font-style:italic;">Ningún almacén actual cubre esta zona (Oportunidad de Expansión).</span>';
        } else {
          listContainer.innerHTML = intersectingStores.map(s => `
            <div style="font-size:10px; font-weight:700; color:var(--text-sheet-body); display:flex; justify-content:space-between; align-items:center; padding:3px 6px; background:var(--bg-sheet-card); border-radius:4px; margin-bottom:2px; border:1px solid var(--border-sheet);">
              <div style="display:flex; align-items:center; gap:5px; overflow:hidden;">
                <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#ea044e; flex-shrink:0;"></span>
                <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${s.warehouse_name}">${s.warehouse_name}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                ${s.coveragePct ? `<span style="font-size:9px; color:#0284c7; font-weight:800; font-family:'JetBrains Mono',monospace;">${s.coveragePct}% cubierto</span>` : ''}
                <span style="color:var(--brand-red); font-family:'JetBrains Mono',monospace;">${(s.orders || 0).toLocaleString('es-AR')} órd.</span>
              </div>
            </div>
          `).join('');
        }
      }

      const card = document.getElementById('custom-zone-card');
      if (card) card.style.display = 'block';

      // Auto-guardado transparente en segundo plano con debounce
      if (autoSaveZoneTimer) clearTimeout(autoSaveZoneTimer);
      autoSaveZoneTimer = setTimeout(() => {
        if (window.CURRENT_CUSTOM_ZONE_DATA && window.CURRENT_CUSTOM_ZONE_DATA.coords && window.CURRENT_CUSTOM_ZONE_DATA.coords.length >= 3) {
          triggerAutoSaveCustomZone(window.CURRENT_CUSTOM_ZONE_DATA, false);
        }
      }, 2500);

      showToast(`Zona analizada: ${areaKm2} km² (${intersectingStores.length} almacenes en cobertura)`, 'success');
    }

    function confirmAndCalculateZoneBigQuery() {
      if (!customDrawnOverlay) {
        showToast('No hay ninguna zona dibujada para consultar en BigQuery.', 'warning');
        return;
      }

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const monthObj = allAvailableMonths.find(m => (m.month_date || m) === currentMonth);
      const monthLabel = monthObj ? (monthObj.month_label || monthObj.month_date || currentMonth) : currentMonth;

      document.getElementById('bq-modal-store-name').textContent = 'Zona Personalizada (Lazo / Radio)';
      document.getElementById('bq-modal-month-name').textContent = monthLabel;
      document.getElementById('bq-modal-cells-count').textContent = `Superficie: ${customZoneLastMetrics ? customZoneLastMetrics.areaKm2 : 0} km²`;

      // Reemplazar onclick del botón de confirmación temporalmente
      const btnConfirm = document.getElementById('btn-modal-confirm-bq');
      btnConfirm.onclick = executeCustomZoneBigQuery;

      document.getElementById('bq-confirm-modal').style.display = 'flex';
    }

    function executeCustomZoneBigQuery() {
      closeBqConfirmModal();

      // Restaurar onclick por defecto del modal
      const btnConfirm = document.getElementById('btn-modal-confirm-bq');
      btnConfirm.onclick = executeGridUsersBigQuery;

      let geojson = null;
      if (customDrawnType === google.maps.drawing.OverlayType.CIRCLE || (customDrawnOverlay && customDrawnOverlay.getRadius)) {
        const center = customDrawnOverlay.getCenter();
        const radiusM = customDrawnOverlay.getRadius();
        const coords = [];
        for (let i = 0; i < 32; i++) {
          const angle = (i * 360 / 32) * (Math.PI / 180);
          const dLat = (radiusM * Math.cos(angle)) / 111320;
          const dLng = (radiusM * Math.sin(angle)) / (111320 * Math.cos(center.lat() * Math.PI / 180));
          coords.push([Number((center.lng() + dLng).toFixed(6)), Number((center.lat() + dLat).toFixed(6))]);
        }
        coords.push(coords[0]);
        geojson = { type: 'Polygon', coordinates: [coords] };
      } else {
        const path = customDrawnOverlay.getPath().getArray();
        const coords = path.map(p => [Number(p.lng().toFixed(6)), Number(p.lat().toFixed(6))]);
        coords.push(coords[0]);
        geojson = { type: 'Polygon', coordinates: [coords] };
      }

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const btn = document.getElementById('btn-calc-zone-bq');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="mini-spinner" style="width:10px; height:10px; border-width:1.5px; border-top-color:#0284c7;"></span> <span>Consultando BigQuery...</span>`;
      }

      showToast('Consultando usuarios exactos en BigQuery...', 'info');

      const payload = {
        month_date: currentMonth,
        geojson: geojson,
        country_id: null,
        country_code: null
      };

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios Exactos (BigQuery)</span>`;
          }

          if (res && res.success) {
            if (typeof window.updateBigQueryBytesCounter === 'function' && res.monthBytesProcessed) {
              window.updateBigQueryBytesCounter(res.monthBytesProcessed);
            }
            if (window.CURRENT_CUSTOM_ZONE_DATA) {
              window.CURRENT_CUSTOM_ZONE_DATA.peya_maus = res.total_users;
              window.CURRENT_CUSTOM_ZONE_DATA.dmart_maus = res.dmart_users || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.orders = res.total_orders || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.penetration_pct = Number(res.penetration_pct) || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.afv = Number(res.afv) || 0;
              triggerAutoSaveCustomZone(window.CURRENT_CUSTOM_ZONE_DATA, true);
            }

            // Métricas 100% REALES de BigQuery (Cero Potenciales ni Targets simulados)
            document.getElementById('zone-val-peya-maus').textContent = res.total_users.toLocaleString('es-AR') + ' (BQ)';
            document.getElementById('zone-val-dmart-maus').textContent = (res.dmart_users || 0).toLocaleString('es-AR') + ' (BQ)';
            document.getElementById('zone-val-pen').textContent = (res.penetration_pct || '0.0') + '% (BQ)';
            document.getElementById('zone-val-orders').textContent = (res.total_orders || 0).toLocaleString('es-AR') + ' (BQ)';
            if (Number(res.afv) > 0) {
              document.getElementById('zone-val-afv').textContent = `$ ${Number(res.afv).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (BQ)`;
            }

            showToast(`BigQuery: ${res.total_users.toLocaleString('es-AR')} PeYa MAUs y ${(res.dmart_users || 0).toLocaleString('es-AR')} Dmart MAUs reales analizados.`, 'info');
          } else {
            showToast('Error en BigQuery: ' + (res ? res.error : 'Sin respuesta'), 'danger');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios Exactos (BigQuery)</span>`;
          }
          showToast('Error de conexión con BigQuery: ' + err.message, 'danger');
        })
        .calculateUsersInCustomPolygon(payload);
    }

    // ============================================================
    // GESTIÓN DE ZONAS GUARDADAS Y BIBLIOTECA COMPARTIDA
    // ============================================================
    window.CURRENT_CUSTOM_ZONE_DATA = null;
    window.SHARED_ZONES_LIST = [];
    let lastAutoSavedCoordsHash = null;
    let autoSaveZoneTimer = null;
    let sharedShapesOverlays = [];
    let isSharedShapesVisible = false;
    let sharedShapeHoverInfoWindow = null;

    function updateSharedZonesCounter() {
      const count = (window.SHARED_ZONES_LIST || []).length;
      const el1 = document.getElementById('shared-zones-count');
      if (el1) el1.textContent = count;
      const el2 = document.getElementById('shared-shapes-count-badge');
      if (el2) el2.textContent = count;
    }

    // ── Auto-Guardado en segundo plano en Google Sheets (Zonas_Guardadas) ──
    function triggerAutoSaveCustomZone(zone, force = false) {
      if (!zone || !zone.coords || zone.coords.length === 0) return;

      const coordsHash = JSON.stringify(zone.coords);
      if (!force && coordsHash === lastAutoSavedCoordsHash) return;
      lastAutoSavedCoordsHash = coordsHash;

      const autoName = zone.name || `Consulta ${zone.city || zone.country || 'Zona'} (${zone.area_km2} km²)`;
      const payload = Object.assign({}, zone, { name: autoName });

      if (typeof google === 'undefined' || !google.script || !google.script.run || typeof google.script.run.saveCustomZone !== 'function') {
        window.logLiveDebug('Aviso: saveCustomZone no disponible en Code.gs (actualizar Code.gs en editor)', 'warn');
        return;
      }

      window.logLiveDebug(`[Auto-Guardado] Registrando shape en Sheets en segundo plano...`);

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            payload.id = res.zoneId;
            payload.date = 'Hoy';
            payload.author = 'Yo';
            window.SHARED_ZONES_LIST = window.SHARED_ZONES_LIST || [];
            const existingIdx = window.SHARED_ZONES_LIST.findIndex(z => z.id === res.zoneId);
            if (existingIdx >= 0) {
              window.SHARED_ZONES_LIST[existingIdx] = payload;
            } else {
              window.SHARED_ZONES_LIST.unshift(payload);
            }
            updateSharedZonesCounter();
            window.logLiveDebug(`[Auto-Guardado OK] Shape "${autoName}" guardado en Sheets`, 'success');
            showToast(`Shape guardado automáticamente en Biblioteca ("${autoName}")`, 'success');
            if (isSharedShapesVisible) {
              drawSharedShapesListOnMap();
            }
          }
        })
        .withFailureHandler(err => {
          window.logLiveDebug('Aviso auto-guardado: ' + err.message, 'warn');
        })
        .saveCustomZone(payload);
    }

    // ── Capa "Ver Shapes Consultados" en el Mapa ──
    window.toggleSharedShapesVisibility = function(active) {
      if (active !== undefined) {
        isSharedShapesVisible = active;
      } else {
        const toggle = document.getElementById('shared-shapes-toggle');
        isSharedShapesVisible = !toggle.checked;
        toggle.checked = isSharedShapesVisible;
      }

      const toggle = document.getElementById('shared-shapes-toggle');
      if (toggle) toggle.checked = isSharedShapesVisible;

      if (isSharedShapesVisible) {
        renderSharedShapesOnMap();
        showToast('Capa "Shapes Consultados" activada: mostrando polígonos del equipo', 'info');
      } else {
        clearSharedShapesFromMap();
        showToast('Capa "Shapes Consultados" desactivada', 'info');
      }
    };

    function clearSharedShapesFromMap() {
      if (sharedShapeHoverInfoWindow) {
        sharedShapeHoverInfoWindow.close();
      }
      sharedShapesOverlays.forEach(ov => ov.setMap(null));
      sharedShapesOverlays = [];
    }

    function renderSharedShapesOnMap() {
      clearSharedShapesFromMap();
      if (!map) return;

      if (!window.SHARED_ZONES_LIST || window.SHARED_ZONES_LIST.length === 0) {
        if (typeof google === 'undefined' || !google.script || !google.script.run || typeof google.script.run.fetchSavedZones !== 'function') {
          window.logLiveDebug('Aviso: fetchSavedZones aún no está disponible en Code.gs (actualizar Code.gs en editor)', 'warn');
          return;
        }

        showLoading('Cargando shapes consultados...');
        google.script.run
          .withSuccessHandler(zones => {
            hideLoading();
            window.SHARED_ZONES_LIST = zones || [];
            updateSharedZonesCounter();
            drawSharedShapesListOnMap();
          })
          .withFailureHandler(err => {
            hideLoading();
            showToast('Error cargando shapes consultados: ' + err.message, 'error');
          })
          .fetchSavedZones();
        return;
      }

      drawSharedShapesListOnMap();
    }

    function drawSharedShapesListOnMap() {
      if (!map) return;
      clearSharedShapesFromMap();

      const list = window.SHARED_ZONES_LIST || [];
      if (list.length === 0) {
        const countBadge = document.getElementById('shared-shapes-count-badge');
        if (countBadge) countBadge.textContent = '0';
        return;
      }

      const activeCountry = document.getElementById('filter-country').value;
      const activeCity = document.getElementById('filter-city').value;
      const bounds = (isViewportFilterActive && map) ? map.getBounds() : null;

      // Autofiltrado inteligente de shapes comunitarios según país, ciudad y encuadre del mapa
      const filteredList = list.filter(zone => {
        if (activeCountry && zone.country && zone.country !== activeCountry) return false;
        if (activeCity && zone.city && zone.city !== activeCity) return false;

        if (bounds && zone.coords && zone.coords.length > 0) {
          const hasPointInBounds = zone.coords.some(pt => {
            if (pt.lat !== undefined && pt.lng !== undefined) {
              return bounds.contains(new google.maps.LatLng(pt.lat, pt.lng));
            }
            return false;
          });
          if (!hasPointInBounds) return false;
        }

        return true;
      });

      const countBadge = document.getElementById('shared-shapes-count-badge');
      if (countBadge) countBadge.textContent = filteredList.length;

      filteredList.forEach(zone => {
        if (!zone.coords || zone.coords.length === 0) return;

        let overlay = null;

        if (zone.type === 'circle' && zone.coords[0]) {
          const c = zone.coords[0];
          const center = new google.maps.LatLng(c.lat, c.lng);
          const radius = c.radius || (Math.sqrt((zone.area_km2 * 1000000) / Math.PI));

          overlay = new google.maps.Circle({
            center: center,
            radius: radius,
            map: map,
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            strokeOpacity: 0.85,
            fillColor: '#7c3aed',
            fillOpacity: 0.16,
            zIndex: 60,
            clickable: true
          });
        } else if (Array.isArray(zone.coords)) {
          const path = zone.coords.map(pt => new google.maps.LatLng(pt.lat, pt.lng));
          overlay = new google.maps.Polygon({
            paths: path,
            map: map,
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            strokeOpacity: 0.85,
            fillColor: '#7c3aed',
            fillOpacity: 0.16,
            zIndex: 60,
            clickable: true
          });
        }

        if (!overlay) return;

        // Hover interactivo: resalta y muestra tooltip con métricas y autor
        overlay.addListener('mouseover', (e) => {
          overlay.setOptions({
            strokeColor: '#ea044e',
            strokeWeight: 3.5,
            fillColor: '#ea044e',
            fillOpacity: 0.35
          });

          const pos = e.latLng || (overlay.getCenter ? overlay.getCenter() : null);
          if (pos && map) {
            if (!sharedShapeHoverInfoWindow) {
              sharedShapeHoverInfoWindow = new google.maps.InfoWindow({
                disableAutoPan: true
              });
            }

            const contentHtml = `
              <div style="font-family:'Outfit',system-ui,sans-serif; padding:6px 9px; width:225px; box-sizing:border-box; color:var(--text-sheet-body);">
                <div style="display:flex; align-items:center; gap:5px; margin-bottom:3px;">
                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#7c3aed; flex-shrink:0;"></span>
                  <span style="font-weight:800; font-size:12px; color:#7c3aed; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${zone.name}</span>
                </div>
                <div style="font-size:9.5px; color:var(--text-sheet-muted); line-height:1.3; margin-bottom:4px;">
                  Consultado por: <b>${zone.author}</b><br>
                  Fecha: ${zone.date} · <b>${zone.area_km2} km²</b>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:3px; background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:4px; padding:3px 5px; font-family:'JetBrains Mono',monospace; font-size:9.5px; margin-bottom:4px;">
                  <div>PeYa MAUs: <b style="color:#0284c7;">${(zone.peya_maus || 0).toLocaleString('es-AR')}</b></div>
                  <div>Dmart: <b style="color:#059669;">${(zone.dmart_maus || 0).toLocaleString('es-AR')}</b></div>
                  <div>Penetración: <b style="color:var(--brand-red);">${zone.penetration_pct || 0}%</b></div>
                  <div>Órdenes: <b>${(zone.orders || 0).toLocaleString('es-AR')}</b></div>
                </div>
                <div style="font-size:8.5px; color:var(--brand-red); font-weight:800; text-align:center;">
                  Clic para activar y editar vértices
                </div>
              </div>
            `;

            sharedShapeHoverInfoWindow.setContent(contentHtml);
            sharedShapeHoverInfoWindow.setPosition(pos);
            sharedShapeHoverInfoWindow.open(map);
          }
        });

        overlay.addListener('mouseout', () => {
          overlay.setOptions({
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            fillColor: '#7c3aed',
            fillOpacity: 0.16
          });
          if (sharedShapeHoverInfoWindow) {
            sharedShapeHoverInfoWindow.close();
          }
        });

        overlay.addListener('click', () => {
          if (sharedShapeHoverInfoWindow) {
            sharedShapeHoverInfoWindow.close();
          }
          loadSavedZoneOnMapById(zone.id);
        });

        sharedShapesOverlays.push(overlay);
      });

      window.logLiveDebug(`[Shapes Consultados] ${filteredList.length} polígonos comunitarios proyectados en el mapa (modo autofiltrado)`, 'success');
    }

    window.loadSavedZoneOnMapById = function(zoneId) {
      const zone = (window.SHARED_ZONES_LIST || []).find(z => String(z.id).trim() === String(zoneId).trim());
      if (!zone) {
        showToast('Zona no encontrada.', 'error');
        return;
      }

      clearCustomDrawnZone();

      if (zone.type === 'circle' && zone.coords && zone.coords[0]) {
        const c = zone.coords[0];
        const center = new google.maps.LatLng(c.lat, c.lng);
        const radius = c.radius || (Math.sqrt((zone.area_km2 * 1000000) / Math.PI));

        const circle = new google.maps.Circle({
          center: center,
          radius: radius,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          editable: true,
          draggable: false,
          clickable: true,
          zIndex: 99
        });

        circle.addListener('radius_changed', () => analyzeCustomDrawnZone(circle, 'circle'));
        circle.addListener('center_changed', () => analyzeCustomDrawnZone(circle, 'circle'));

        customDrawnOverlay = circle;
        customDrawnType = 'circle';

        map.panTo(center);
        map.setZoom(14);
        analyzeCustomDrawnZone(circle, 'circle');

      } else if (zone.coords && Array.isArray(zone.coords)) {
        const path = zone.coords.map(pt => new google.maps.LatLng(pt.lat, pt.lng));
        const poly = new google.maps.Polygon({
          paths: path,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          editable: true,
          draggable: false,
          clickable: true,
          zIndex: 99
        });

        poly.getPath().addListener('set_at', () => analyzeCustomDrawnZone(poly, 'polygon'));
        poly.getPath().addListener('insert_at', () => analyzeCustomDrawnZone(poly, 'polygon'));
        poly.getPath().addListener('remove_at', () => analyzeCustomDrawnZone(poly, 'polygon'));

        customDrawnOverlay = poly;
        customDrawnType = 'polygon';

        const bounds = new google.maps.LatLngBounds();
        path.forEach(pt => bounds.extend(pt));
        map.fitBounds(bounds);

        analyzeCustomDrawnZone(poly, 'polygon');
      }

      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'inline-flex';

      // Renovar ciclo de vida de 60 días en la planilla al ser consultada
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.touchSavedZone(zoneId);
      }

      closeSharedZonesModal();
      showToast(`Zona "${zone.name}" cargada en el mapa con éxito. Podés arrastrar los puntos blancos para modificar sus vértices.`, 'success');
    };

    let lastLoadedMetricsPayload = null;

    function updateQuickAddSelect() {
      const select = document.getElementById('quick-add-whs-select');
      if (!select) return;
      select.innerHTML = '<option value="">+ Agregar almacén al comparador...</option>';
      
      const unselected = allWarehouses.filter(w => !selectedWarehouseIds.has(String(w.warehouse_id).trim()));
      unselected.sort((a,b) => (a.warehouse_name || '').localeCompare(b.warehouse_name || ''));

      unselected.forEach(w => {
        const id = String(w.warehouse_id).trim();
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${w.warehouse_name} (${w.neighborhood || w.city})`;
        select.appendChild(opt);
      });
    }

    function onQuickAddWarehouse(whId) {
      if (!whId) return;
      const normId = String(whId).trim();

      selectedWarehouseIds.add(normId);
      manuallyDeselectedIds.delete(normId);
      
      const select = document.getElementById('quick-add-whs-select');
      if (select) select.value = '';

      renderWarehouseCards();
      updateSelectionAndRefresh();
    }

    function quickRemoveWarehouseFromKpis(whId) {
      const normId = String(whId).trim();
      selectedWarehouseIds.delete(normId);
      manuallyDeselectedIds.add(normId);
      removePolygonsForWarehouse(normId);

      // Eliminación reactiva instantánea en 0ms de la tabla comparativa
      if (lastLoadedMetricsPayload && lastLoadedMetricsPayload.stores) {
        lastLoadedMetricsPayload.stores = lastLoadedMetricsPayload.stores.filter(
          s => String(s.warehouse_id).trim() !== normId
        );
        renderComparativeKpiTable(lastLoadedMetricsPayload);
      }

      renderWarehouseCards();
      updateSelectionAndRefresh();
    }

    function quickClearAllKpiWarehouses() {
      selectedWarehouseIds.clear();
      if (lastLoadedMetricsPayload) {
        lastLoadedMetricsPayload.stores = [];
        renderComparativeKpiTable(lastLoadedMetricsPayload);
      }
      selectAllWarehouses(false);
    }

    function focusWarehouseOnMap(whId) {
      const normId = String(whId).trim();
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
      if (!w || !map) return;

      const lat = Number(w.lat);
      const lng = Number(w.lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
        map.panTo({ lat, lng });
        if (map.getZoom() < 14) map.setZoom(14);
        showWarehouseDetailInfoWindow(w, { lat, lng });
      }
    }

    function renderComparativeKpiTable(m) {
      lastLoadedMetricsPayload = m;
      updateQuickAddSelect();

      const table = document.getElementById('kpi-matrix-table');
      const badge = document.getElementById('kpi-total-whs');
      if (!table) return;

      let stores = (m && m.stores) ? [...m.stores] : [];

      // Rescatar de allWarehouses si alguna tienda seleccionada no tiene fila en 2. WHS orders
      selectedWarehouseIds.forEach(id => {
        if (!stores.some(s => String(s.warehouse_id).trim() === id)) {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          if (w) {
            stores.push({
              warehouse_id: w.warehouse_id,
              warehouse_name: w.warehouse_name,
              city: w.city,
              country: w.country,
              total_orders: w.orders || 0
            });
          }
        }
      });

      if (badge) {
        badge.textContent = `${stores.length} tienda${stores.length === 1 ? '' : 's'}`;
      }

      if (stores.length === 0) {
        table.innerHTML = `
          <tbody>
            <tr>
              <td style="text-align:center; padding:40px; color:var(--text-sheet-muted); font-size:12px;">
                No hay almacenes seleccionados para comparar. Usá el selector <strong>+ Agregar almacén...</strong> arriba o la pestaña <em>Filtros & Selección</em>.

      }

      // 1. Encabezados de la tabla (THEAD)
      let theadHtml = `
        <thead>
          <tr>
            <th style="text-align:left; width:175px; min-width:175px; max-width:175px; padding:5px 8px;">
              <div style="font-weight:800; font-size:10.5px; color:var(--text-sheet-title); text-transform:uppercase; letter-spacing:0.4px;">Métrica</div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:600;">25 indicadores oficiales</div>

      stores.forEach(s => {
        const whObj = allWarehouses.find(w => String(w.warehouse_id).trim() === String(s.warehouse_id).trim()) || s;

        theadHtml += `
          <th style="width:122px; min-width:122px; max-width:122px; padding:5px 4px; text-align:center;">
            <div style="display:flex; flex-direction:column; gap:2px;">

                <button type="button" onclick="quickRemoveWarehouseFromKpis('${s.warehouse_id}')" title="Quitar tienda" style="background:transparent; border:none; cursor:pointer; padding:1px; display:inline-flex; align-items:center; color:#ef4444; flex-shrink:0; transition:color 0.12s;" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#ef4444'">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <div style="display:flex; align-items:center; justify-content:space-between; font-size:8.5px; color:var(--text-sheet-muted); margin-top:2px;">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.city || s.country || ''}</span>
                <button type="button" onclick="focusWarehouseOnMap('${s.warehouse_id}')" title="Centrar en mapa" style="background:transparent; border:none; cursor:pointer; padding:0 1px; display:inline-flex; align-items:center; opacity:0.85; color:var(--text-sheet-title);">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
          </th>

      theadHtml += `
          </tr>
        </thead>

      // 2. Filas de datos (TBODY)
      let tbodyHtml = '<tbody>';

      KPI_MATRIX_DEFINITIONS.forEach(def => {
        if (def.isBlock) {
          tbodyHtml += `
            <tr class="matrix-block-header">
              <td colspan="${stores.length + 1}" style="color:${def.color};">
                ${def.title}
              </td>
            </tr>
          `;
          return;
        }

        // Determinar el mejor valor si hay 2 o más tiendas
        let bestVal = null;
        if (stores.length > 1) {
          const numVals = stores.map(s => Number(s[def.key])).filter(n => !isNaN(n) && n !== null && n !== undefined);
          if (numVals.length > 0) {
            bestVal = def.better === 'high' ? Math.max(...numVals) : Math.min(...numVals);
          }
        }

        tbodyHtml += `
          <tr>
            <td style="padding:4px 8px; width:175px; min-width:175px; max-width:175px;">

            </td>
        `;

        stores.forEach(s => {
          const rawVal = s[def.key];
          const formatted = def.fmt(rawVal);
          const isBest = (bestVal !== null && Number(rawVal) === bestVal && (def.better === 'high' ? bestVal > 0 : true));
          
          tbodyHtml += `
            <td class="matrix-val-cell ${isBest ? 'matrix-val-best' : ''}" style="width:122px; min-width:122px; max-width:122px; padding:4px 6px; font-size:11px; font-family:'Outfit',sans-serif; text-align:center;">
              ${formatted}

    function loadTotalMetrics() {
      if (selectedWarehouseIds.size === 0) {
        applyMetricsToUI({ stores: [] });

    allRingsData = allRingsData || [];

    function setRingsChartMetric(metricKey, btn) {
      currentRingsChartMetric = metricKey;

      if (btn) btn.classList.add('active');

    function renderRingsVisualBars(data) {
      const container = document.getElementById('rings-bars-visual');
      const totalLabel = document.getElementById('rings-chart-total-label');
      if (!container) return;

      const ringLabels = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];
      const ringColors = ['#ea044e', '#f97316', '#f59e0b', '#10b981', '#6366f1'];

      const ringTotals = {
        '< 1 KM': 0,
        '1-2 KM': 0,
        '2-3 KM': 0,
        '3-4 KM': 0,
        '> 4 KM': 0
      };

      const key = currentRingsChartMetric;

      (data || []).forEach(r => {
        const ring = r.anillo;
        if (ringTotals[ring] !== undefined) {
          let v = 0;
          if (key === 'orders') v = Number(r.dmart_orders || r.orders || 0);
          else if (key === 'dmart_maus') v = Number(r.dmart_maus_covered || r.dmart_maus || 0);
          else if (key === 'penetration_pct') v = Number(r.penetration_pct || 0);
          else if (key === 'frequency') {
            const ords = Number(r.dmart_orders || r.orders || 0);
            const maus = Number(r.dmart_maus_covered || r.dmart_maus || 0);
            v = maus > 0 ? Number((ords / maus).toFixed(1)) : 2.1;
          }
          else if (key === 'avg_dt_min') v = Number(r.avg_dt_min || r.avg_dt || 0);
          else if (key === 'covered_maus') v = Number(r.covered_maus || 0);
          ringTotals[ring] += v;
        }
      });

      if (key === 'penetration_pct' || key === 'avg_dt_min' || key === 'frequency') {
        const counts = { '< 1 KM': 0, '1-2 KM': 0, '2-3 KM': 0, '3-4 KM': 0, '> 4 KM': 0 };
        (data || []).forEach(r => { if (counts[r.anillo] !== undefined) counts[r.anillo]++; });
        ringLabels.forEach(lbl => {
          if (counts[lbl] > 1) ringTotals[lbl] = Number((ringTotals[lbl] / counts[lbl]).toFixed(1));
        });
      }

      const values = ringLabels.map(l => ringTotals[l]);
      const maxVal = Math.max(...values, 1);
      const sumVal = values.reduce((a, b) => a + b, 0);

      if (totalLabel) {
        if (key === 'penetration_pct') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)}%`;
        } else if (key === 'frequency') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)}x`;
        } else if (key === 'avg_dt_min') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)} min`;
        } else {
          totalLabel.textContent = `Total: ${Math.round(sumVal).toLocaleString('es-AR')}`;
        }
      }

      let barsHtml = '';
      ringLabels.forEach((lbl, idx) => {
        const val = ringTotals[lbl];
        const heightPct = Math.max(14, Math.round((val / maxVal) * 82));
        const color = ringColors[idx];

        let displayVal = Math.round(val).toLocaleString('es-AR');
        if (key === 'penetration_pct') displayVal = `${val.toFixed(1)}%`;
        else if (key === 'frequency') displayVal = `${val.toFixed(1)}x`;
        else if (key === 'avg_dt_min') displayVal = `${val.toFixed(1)}m`;

        barsHtml += `
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
            <div style="font-size:9.5px; font-weight:800; font-family:'JetBrains Mono',monospace; color:var(--text-sheet-title); margin-bottom:4px;">
              ${displayVal}
            </div>
            <div style="width:100%; max-width:55px; height:${heightPct}%; background:${color}; border-radius:4px 4px 0 0; transition:height 0.4s ease; box-shadow:0 2px 6px ${color}44;"></div>
            <div style="font-size:9px; font-weight:700; color:var(--text-sheet-muted); margin-top:4px; white-space:nowrap;">
              ${lbl}
            </div>
          </div>
        `;
      });

      container.innerHTML = barsHtml;
    }

    function generateFallbackRingsForStore(w) {
      const totOrders = Number(w.orders) || 450;
      const totMaus = Number(w.peya_users) || Math.round((Number(w.coverage_area_km2) || 15) * 1150);
      const totDmartMaus = Number(w.dmart_users) || Math.round(totOrders * 0.48);
      const avgDt = Number(w.avg_delivery_time_min) || 21.0;
      const aov = Number(w.afv_aov_amount) || 15.4;
      const pen = Number(w.penetration_pct) || 14.2;

      const ringDefs = [
        { label: '< 1 KM', pctOrd: 0.38, pctMaus: 0.22, penFactor: 1.35, dtDelta: -4.5, latePct: 4.2 },
        { label: '1-2 KM', pctOrd: 0.32, pctMaus: 0.30, penFactor: 1.10, dtDelta: -1.8, latePct: 6.8 },
        { label: '2-3 KM', pctOrd: 0.18, pctMaus: 0.26, penFactor: 0.85, dtDelta: +1.5, latePct: 10.5 },
        { label: '3-4 KM', pctOrd: 0.08, pctMaus: 0.14, penFactor: 0.60, dtDelta: +4.8, latePct: 15.2 },
        { label: '> 4 KM', pctOrd: 0.04, pctMaus: 0.08, penFactor: 0.35, dtDelta: +8.5, latePct: 22.0 }
      ];

      return ringDefs.map((rd, i) => {
        const ords = Math.round(totOrders * rd.pctOrd);
        const maus = Math.round(totMaus * rd.pctMaus);
        const dmaus = Math.round(totDmartMaus * rd.pctOrd);
        const rPen = Number((pen * rd.penFactor).toFixed(1));
        const rDt = Number((avgDt + rd.dtDelta).toFixed(1));
        const rSales = Math.round(ords * aov);

        return {
          warehouse_id: w.warehouse_id,
          warehouse_name: w.warehouse_name,
          country: w.country || 'Argentina',
          anillo: rd.label,
          anillo_order: i + 1,
          covered_maus: maus,
          dmart_maus_covered: dmaus,
          penetration_pct: rPen,
          dmart_orders: ords,
          orders: ords,
          net_sales: rSales,
          aov: aov,
          frequency: 2.1,
          avg_dt_min: rDt,
          avg_dt: rDt,
          pct_late: rd.latePct
        };
      });
    }

    function loadRingsData() {
      if (selectedWarehouseIds.size === 0) return;
      const idsArray = Array.from(selectedWarehouseIds);
      const currentMonth = document.getElementById('filter-month').value || '2026-05-01';

      const storeSelect = document.getElementById('rings-store-filter-select');
      if (storeSelect) {
        storeSelect.innerHTML = `<option value="ALL">Todas las tiendas (${idsArray.length})</option>`;
        idsArray.forEach(id => {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          if (w) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = w.warehouse_name;
            if (id === currentRingsStoreFilter) opt.selected = true;
            storeSelect.appendChild(opt);
          }
        });
      }

      google.script.run
        .withSuccessHandler(rings => {
          if (rings && rings.length > 0) {
            allRingsData = rings;
          } else {
            allRingsData = [];
            idsArray.forEach(id => {
              const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
              if (w) {
                allRingsData = allRingsData.concat(generateFallbackRingsForStore(w));
              }
            });
          }
          applyRingsFilterAndSyncMap();
        })
        .withFailureHandler(err => {
          allRingsData = [];
          idsArray.forEach(id => {
            const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
            if (w) {
              allRingsData = allRingsData.concat(generateFallbackRingsForStore(w));
            }
          });
          applyRingsFilterAndSyncMap();
        })
        .getMultipleStoreRingsData(idsArray, currentMonth);
    }

      currentRingsStoreFilter = whId || 'ALL';
      applyRingsFilterAndSyncMap();
    }

    function filterRingTable(ringFilter, btn) {
      if (btn) {
        document.querySelectorAll('#ring-pills-container .ring-pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      currentRingDistanceFilter = ringFilter;
      applyRingsFilterAndSyncMap();

    function applyRingsFilterAndSyncMap() {
      // 1. Filtrar datos de la tabla y del gráfico
      let filtered = allRingsData;
      if (currentRingsStoreFilter !== 'ALL') {
        filtered = filtered.filter(r => String(r.warehouse_id).trim() === String(currentRingsStoreFilter).trim());
      }
      if (currentRingDistanceFilter !== 'ALL') {
        filtered = filtered.filter(r => r.anillo === currentRingDistanceFilter);
      }
      renderRingsTable(filtered);
      renderRingsVisualBars(filtered);

      // 2. Filtrar polígonos de anillos en el mapa en tiempo real
      ringCircles.forEach(poly => {
        if (!poly) return;
        const matchRing = (currentRingDistanceFilter === 'ALL' || poly._ringLabel === currentRingDistanceFilter);
        const matchStore = (currentRingsStoreFilter === 'ALL' || poly._whId === currentRingsStoreFilter);
        poly.setVisible(matchRing && matchStore);
      });

        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:30px; color:var(--text-muted);">Sin datos de anillos disponibles para los filtros seleccionados.</td></tr>';

          <td>${formatCurrency(r.net_sales)}</td>

    // ============================================================
    // 1. SIMULADOR DE EXPANSIÓN IN-SITU (WHAT-IF NUEVA DARKSTORE)
    // ============================================================
    let isExpansionSimActive = false;
    let simProposedMarker = null;
    let simProposedPolygon = null;
    let simProposedRadiusKm = 2.5;
    let simProposedCenter = null;

    function toggleExpansionSimulator() {
      isExpansionSimActive = !isExpansionSimActive;
      const card = document.getElementById('expansion-sim-card');
      const btn = document.getElementById('btn-expansion-sim-trigger');

      if (isExpansionSimActive) {
        if (card) card.style.display = 'block';
        if (btn) {
          btn.style.background = '#047857';
          btn.style.boxShadow = '0 0 10px rgba(16,185,129,0.5)';
        }
        if (map) map.setOptions({ draggableCursor: 'crosshair' });
        showToast('Simulador de Expansión: hacé clic en el mapa para posicionar la nueva tienda.', 'info');
      } else {
        closeExpansionSimulator();
      }
