    function generatePointsForStoreBatch(storesBatch, layerType, minVal, maxVal) {
      const type = String(layerType || 'peya_maus').toLowerCase();
      const points = [];

      storesBatch.forEach(s => {
        const baseLat = Number(s.lat);
        const baseLng = Number(s.lng);
        if (isNaN(baseLat) || isNaN(baseLng)) return;

        const ordersVal = Number(s.orders) || 200;
        const areaVal = Number(s.coverage_area_km2) || 12;
        let rawVal = 0;
        let intensity = 0.5;

        if (type === 'peya_maus') {
          rawVal = Number(s.peya_users) || Math.round(areaVal * 1100);
          // Normalización logarítmica: evita que megaciudades como CABA aplasten ciudades medianas como Santo Tomé
          const logRaw = Math.log(1 + rawVal);
          const logMin = Math.log(1 + Math.min(1000, minVal || 1000));
          const logMax = Math.log(1 + (maxVal || 120000));
          intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));
        } else if (type === 'covered_maus') {
          rawVal = Number(s.covered_maus) || Number(s.peya_users) || Math.round(areaVal * 950);
          const logRaw = Math.log(1 + rawVal);
          const logMin = Math.log(1 + Math.min(800, minVal || 800));
          const logMax = Math.log(1 + (maxVal || 100000));
          intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));
        } else if (type === 'dmart_maus') {
          rawVal = Number(s.dmart_users) || Math.round(ordersVal * 0.48);
        } else if (type === 'penetration') {
          rawVal = Number(s.penetration_pct) || 14.5;
        } else if (type === 'seamless_worst') {
          const seamless = Number(s.seamless_delivery_pct) || 78;
          rawVal = seamless;
          intensity = Math.max(0.35, Math.min(1.0, (86 - seamless) / 16));
        } else if (type === 'seamless_best') {
          const seamless = Number(s.seamless_delivery_pct) || 82;
          rawVal = seamless;
          intensity = Math.max(0.35, Math.min(1.0, (seamless - 74) / 18));
        } else if (type === 'afv') rawVal = Number(s.afv_aov_amount) || 15.2;
        else if (type === 'late_orders') rawVal = Number(s.order_late_pct) || 7.5;
        else if (type === 'orders') rawVal = ordersVal;
        else if (type === 'gmv_dmart') rawVal = Number(s.total_net_sales) || (ordersVal * 15);
        else if (type === 'cpo') rawVal = Number(s.rider_cpo_dmarts) || Number((1.25 + ((Number(s.avg_delivery_time_min) || 21) * 0.055)).toFixed(2));

        if (rawVal <= 0) return;

        const cosLat = Math.cos(baseLat * Math.PI / 180);
        if (type !== 'seamless_worst' && type !== 'seamless_best') {
          intensity = maxVal > minVal ? Math.max(0.35, (rawVal - minVal) / (maxVal - minVal)) : 0.65;
        }

        // Obtener la geometría oficial del shape para no derramar calor en el océano o cerros (ej. Antofagasta)
        let storePolyFeature = null;
        const normWhId = String(s.warehouse_id).trim();
        const pData = multiDatePolygonsMap.get(normWhId) || CLIENT_MEMORY_CACHE.polygons.get(normWhId);
        if (pData && pData.geojson && typeof turf !== 'undefined') {
          try {
            if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
              storePolyFeature = turf.cleanCoords(turf.feature(pData.geojson));
            }
          } catch(e) {}
        }

        function pushPointIfInside(pLat, pLng, weightVal) {
          // Si es Covered MAUs o Dmart MAUs: sí restringir estrictamente al polígono de despacho de la tienda
          // Pero para Platform MAUs (peya_maus): ¡LOS USUARIOS VIVEN EN TODA LA CIUDAD Y FUERA DE LOS SHAPES!
          // ¡NO DESCARTAR PUNTOS POR ESTAR FUERA DEL SHAPE!
          if (type === 'covered_maus' || type === 'dmart_maus' || type === 'orders') {
            if (storePolyFeature && typeof turf !== 'undefined') {
              try {
                const pt = turf.point([pLng, pLat]);
                if (!turf.booleanPointInPolygon(pt, storePolyFeature)) {
                  return;
                }
              } catch(e) {}
            }
          }
          points.push({
            lat: pLat,
            lng: pLng,
            latLng: new google.maps.LatLng(pLat, pLng),
            weight: weightVal,
            rawVal: rawVal
          });
        }

        // Radio proporcional a la cobertura urbana
        const maxRadiusDeg = Math.min(0.024, Math.max(0.012, Math.sqrt(areaVal / Math.PI) * 0.007));
        const isFrictionLayer = (type === 'seamless_worst' || type === 'late_orders');

        if (isFrictionLayer) {
          // CAPA DE FRICCIÓN Y RETRASOS VIALES (Seamless Negativo y Late Orders):
          // En La Plata y cualquier ciudad, la fricción operativa ocurre LEJOS del almacén (en la periferia urbana).
          // El epicentro (tienda) tiene 0 fricción.
          // Malla continua de 4 anillos densos (30%, 55%, 78%, 100%) con pesos crecientes hacia el borde
          [
            { r: maxRadiusDeg * 0.30, count: 6,  weightFactor: 2.0 },
            { r: maxRadiusDeg * 0.55, count: 10, weightFactor: 5.5 },
            { r: maxRadiusDeg * 0.78, count: 14, weightFactor: 9.0 },
            { r: maxRadiusDeg * 1.00, count: 18, weightFactor: 12.0 }
          ].forEach(ring => {
            const step = (Math.PI * 2) / ring.count;
            for (let k = 0; k < ring.count; k++) {
              const rad = k * step;
              const pLat = Number((baseLat + ring.r * Math.cos(rad)).toFixed(6));
              const pLng = Number((baseLng + (ring.r * Math.sin(rad)) / cosLat).toFixed(6));
              pushPointIfInside(pLat, pLng, Math.max(1, Math.round(intensity * ring.weightFactor)));
            }
          });

        } else {
          // CAPAS DE VOLUMEN Y EXCELENCIA (Órdenes, MAUs, Seamless Positivo):
          pushPointIfInside(baseLat, baseLng, Math.round(intensity * 14));

          // Para Platform MAUs: generamos 5 anillos expansivos hacia los barrios periféricos no cubiertos
          const ringsConfig = (type === 'peya_maus')
            ? [
                { r: maxRadiusDeg * 0.35, count: 6,  weightFactor: 11.0 },
                { r: maxRadiusDeg * 0.70, count: 10, weightFactor: 8.0 },
                { r: maxRadiusDeg * 1.15, count: 14, weightFactor: 5.5 },
                { r: maxRadiusDeg * 1.65, count: 18, weightFactor: 3.5 },
                { r: maxRadiusDeg * 2.20, count: 22, weightFactor: 2.0 }
              ]
            : [
                { r: maxRadiusDeg * 0.25, count: 6,  weightFactor: 11.0 },
                { r: maxRadiusDeg * 0.50, count: 10, weightFactor: 7.5 },
                { r: maxRadiusDeg * 0.75, count: 14, weightFactor: 4.5 },
                { r: maxRadiusDeg * 1.00, count: 18, weightFactor: 2.5 }
              ];

          ringsConfig.forEach(ring => {
            const step = (Math.PI * 2) / ring.count;
            for (let k = 0; k < ring.count; k++) {
              const rad = k * step;
              const pLat = Number((baseLat + ring.r * Math.cos(rad)).toFixed(6));
              const pLng = Number((baseLng + (ring.r * Math.sin(rad)) / cosLat).toFixed(6));
              pushPointIfInside(pLat, pLng, Math.max(1, Math.round(intensity * ring.weightFactor)));
            }
          });
        }
      });

      return points;
    }

    function renderHeatmapProgressively(targetStores, layerType) {
      if (HEATMAP_PROGRESSIVE_TIMER) clearTimeout(HEATMAP_PROGRESSIVE_TIMER);

      const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;
      const currentMonth = getCurrentActiveMonth();
      const activeCountry = document.getElementById('filter-country').value || 'ALL';
      const cacheKey = `${layerType}__${activeCountry}__${currentMonth}`;

      // Si ya está en caché, renderizar instantáneamente a 0 ms sin barra de espera
      if (HEATMAP_CACHE.has(cacheKey)) {
        const cachedPoints = HEATMAP_CACHE.get(cacheKey);
        renderGoogleHeatmap(cachedPoints, layerType);
        updateHeatmapScaleLegend(layerType, null, cachedPoints);
        updateHeatmapProgress(100, `${metricLabel} listo (desde caché)`);
        return;
      }

      // Calibrar cotas fijas de la ciudad para evitar saltos térmicos
      calibrateHeatmapStableBounds(layerType);
      const stable = HEATMAP_STABLE_BOUNDS[layerType] || { min: 0, max: 100 };

      const totalStores = targetStores.length;
      if (totalStores === 0) {
        updateHeatmapProgress(100, 'Sin tiendas');
        return;
      }

      // Tamaño de micro-lote: procesar de 4 a 6 tiendas por cuadro para que cargue "de a poco"
      const batchSize = Math.max(3, Math.ceil(totalStores / 6));
      let currentIdx = 0;
      let accumulatedPoints = [];

      updateHeatmapProgress(12, `Iniciando ${metricLabel}...`);

      function processBatch() {
        if (currentHeatmapLayer !== layerType) {
          updateHeatmapProgress(100, 'Cancelado');
          return;
        }

        const nextIdx = Math.min(currentIdx + batchSize, totalStores);
        const batch = targetStores.slice(currentIdx, nextIdx);

        const batchPoints = generatePointsForStoreBatch(batch, layerType, stable.min, stable.max);
        accumulatedPoints = accumulatedPoints.concat(batchPoints);

        // Renderizar progresivamente en el canvas para que aparezca "de a poco"
        renderGoogleHeatmap(accumulatedPoints, layerType);

        currentIdx = nextIdx;
        const progressPct = Math.min(94, Math.round((currentIdx / totalStores) * 92) + 6);
        updateHeatmapProgress(progressPct, `Cargando tiendas (${currentIdx}/${totalStores})...`);

        if (currentIdx < totalStores) {
          HEATMAP_PROGRESSIVE_TIMER = setTimeout(processBatch, 25);
        } else {
          // Si es la capa de Platform MAUs, incorporar los nodos urbanos satélites de la plataforma (ej. Santo Tomé, Rafaela, etc.)
          if (layerType === 'peya_maus') {
            const country = document.getElementById('filter-country').value || 'Argentina';
            const matchingSatellites = PLATFORM_SATELLITE_NODES.filter(n => !country || n.country === country);
            matchingSatellites.forEach(sat => {
              const rawVal = sat.peya_users;
              const logRaw = Math.log(1 + rawVal);
              const logMin = Math.log(1 + 1000);
              const logMax = Math.log(1 + (stable.max || 120000));
              const intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));

              const baseLat = sat.lat;
              const baseLng = sat.lng;
              const cosLat = Math.cos(baseLat * Math.PI / 180);
              const maxRadiusDeg = 0.022;

              accumulatedPoints.push({
                lat: baseLat,
                lng: baseLng,
                latLng: new google.maps.LatLng(baseLat, baseLng),
                weight: Math.round(intensity * 10),
                rawVal: rawVal
              });

              [0, 60, 120, 180, 240, 300].forEach(deg => {
                const rad = deg * Math.PI / 180;
                const pLat = Number((baseLat + maxRadiusDeg * 0.65 * Math.cos(rad)).toFixed(6));
                const pLng = Number((baseLng + (maxRadiusDeg * 0.65 * Math.sin(rad)) / cosLat).toFixed(6));
                accumulatedPoints.push({
                  lat: pLat,
                  lng: pLng,
                  latLng: new google.maps.LatLng(pLat, pLng),
                  weight: Math.max(1, Math.round(intensity * 4.5)),
                  rawVal: rawVal
                });
              });
            });
            renderGoogleHeatmap(accumulatedPoints, layerType);
          }

          // Guardar en caché permanente de sesión
          HEATMAP_CACHE.set(cacheKey, accumulatedPoints);
          updateHeatmapProgress(100, `${metricLabel} listo (${accumulatedPoints.length} puntos)`);
          updateHeatmapScaleLegend(layerType, null, accumulatedPoints);
          window.logLiveDebug(`[Heatmap OK] ${accumulatedPoints.length} puntos renderizados progresivamente para ${metricLabel}`, 'success');
        }
      }

      processBatch();
    }

    function changeHeatmapLayer(layerType) {
      if (HEATMAP_PROGRESSIVE_TIMER) clearTimeout(HEATMAP_PROGRESSIVE_TIMER);
      currentHeatmapLayer = layerType;

      if (gHeatmapLayer) {
        try { gHeatmapLayer.setMap(null); } catch(e) {}
        gHeatmapLayer = null;
      }

      if (layerType === 'none') {
        updateHeatmapProgress(100);
        const pill = document.getElementById('heatmap-loading-pill');
        if (pill) pill.style.display = 'none';

        // Zoom 100% libre sin ninguna restricción cuando el heatmap está inactivo
        if (map) map.setOptions({ maxZoom: null, minZoom: null });
        updateHeatmapVerificationUI(false, '—', 0, 'none');
        updateHeatmapScaleLegend('none');
        showToast('Mapa de calor desactivado', 'info');
        window.logLiveDebug('Heatmap desactivado por el usuario');
        if (activePolygonsMap) {
          activePolygonsMap.forEach(e => {
            if (e && e.polygon) e.polygon.setOptions({ fillOpacity: 0.28 });
          });
        }
        return;
      }

      // Limitar zoom únicamente mientras el heatmap esté activo para optimizar GPU y evitar saturación en escala microscópica
      if (map) map.setOptions({ maxZoom: 18, minZoom: null });

      const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;
      window.logLiveDebug(`changeHeatmapLayer ejecutado: métrica="${metricLabel}"`);

      if (!window.google || !google.maps) {
        updateHeatmapProgress(100);
        const errorMsg = 'Google Maps SDK no disponible en la página';
        window.logLiveDebug(`ERROR: ${errorMsg}`, 'error');
        updateHeatmapVerificationUI(false, 'SDK no disponible', 0, metricLabel);
        return;
      }

      const activeCountry = document.getElementById('filter-country').value;
      const targetStores = allWarehouses.filter(w => {
        const lat = Number(w.lat);
        const lng = Number(w.lng);
        if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return false;
        if (activeCountry && w.country !== activeCountry) return false;
        return true;
      });

      // Renderizado progresivo de todas las tiendas del territorio para que el mapa nunca quede vacío al panear o hacer zoom
      renderHeatmapProgressively(targetStores, layerType);
    }

    function generateLocalHeatmapPoints(layerType) {
      calibrateHeatmapStableBounds(layerType);
      const stable = HEATMAP_STABLE_BOUNDS[layerType] || { min: 0, max: 100 };
      const candidateStores = allWarehouses.filter(w => {
        const lat = Number(w.lat);
        const lng = Number(w.lng);
        return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0 && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
      });
      return generatePointsForStoreBatch(candidateStores, layerType, stable.min, stable.max);
    }

    // ============================================================
    // MOTOR CANVAS HEATMAP OVERLAY (OPTIMIZADO AL MÁXIMO ABSOLUTO)
    // Inicialización perezosa (Lazy) para nunca fallar si Google Maps carga asíncronamente
    // ============================================================
    let CanvasHeatmapOverlayClass = null;

    function getCanvasHeatmapOverlayClass() {
      if (CanvasHeatmapOverlayClass) return CanvasHeatmapOverlayClass;
      if (typeof google === 'undefined' || !google.maps || !google.maps.OverlayView) return null;

      class CanvasHeatmapOverlay extends google.maps.OverlayView {
      constructor(options) {
        super();
        this.points = options.data || [];
        this.opacity = options.opacity || 0.85;
        this.gradient = options.gradient || [
          'rgba(0, 255, 255, 0)',
          'rgba(0, 255, 255, 1)',
          'rgba(0, 191, 255, 1)',
          'rgba(0, 127, 255, 1)',
          'rgba(99, 102, 241, 1)',
          'rgba(79, 70, 229, 1)'
        ];
        this.canvas = null;
        this.ctx = null;
        this.offscreenCanvas = document.createElement('canvas');
        this.offscreenCtx = this.offscreenCanvas.getContext('2d', { willReadFrequently: true });
        this.brushCanvas = document.createElement('canvas');
        this.brushCtx = this.brushCanvas.getContext('2d');
        this._lastBrushRadius = 0;
        this.palette32 = this.createPalette32(this.gradient);
        this.setMap(options.map);
      }

      onAdd() {
        this.canvas = document.createElement('canvas');
        this.canvas.style.position = 'absolute';
        this.canvas.style.top = '0';
        this.canvas.style.left = '0';
        this.canvas.style.pointerEvents = 'none';
        this.canvas.style.opacity = this.opacity;
        this.canvas.style.zIndex = '30';
        this.ctx = this.canvas.getContext('2d');
        const panes = this.getPanes();
        if (panes && panes.overlayLayer) {
          panes.overlayLayer.appendChild(this.canvas);
        }
      }

      draw() {
        if (!this.canvas || !this.ctx || !this.getMap()) return;
        if (this._rafId) cancelAnimationFrame(this._rafId);
        this._rafId = requestAnimationFrame(() => {
          this._renderHeatmap();
        });
      }

      _updateBrush(radius) {
        const r = Math.max(8, Math.round(radius));
        const d = r * 2;
        if (this._lastBrushRadius === r && this.brushCanvas.width === d) return;
        this._lastBrushRadius = r;

        this.brushCanvas.width = d;
        this.brushCanvas.height = d;
        this.brushCtx.clearRect(0, 0, d, d);

        const grad = this.brushCtx.createRadialGradient(r, r, 0, r, r, r);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        this.brushCtx.fillStyle = grad;
        this.brushCtx.beginPath();
        this.brushCtx.arc(r, r, r, 0, Math.PI * 2);
        this.brushCtx.fill();
      }

      _renderHeatmap() {
        if (!this.canvas || !this.ctx || !this.getMap()) return;
        const overlayProjection = this.getProjection();
        if (!overlayProjection) return;

        const bounds = this.getMap().getBounds();
        if (!bounds) return;

        const sw = overlayProjection.fromLatLngToDivPixel(bounds.getSouthWest());
        const ne = overlayProjection.fromLatLngToDivPixel(bounds.getNorthEast());
        if (!sw || !ne) return;

        const pad = 80;
        const width = Math.max(10, Math.round(Math.abs(ne.x - sw.x) + pad * 2));
        const height = Math.max(10, Math.round(Math.abs(sw.y - ne.y) + pad * 2));
        const left = Math.round(Math.min(sw.x, ne.x) - pad);
        const top = Math.round(Math.min(sw.y, ne.y) - pad);

        // Evitar reasignación innecesaria de tamaño de texturas si no cambiaron
        if (this.canvas.width !== width || this.canvas.height !== height) {
          this.canvas.width = width;
          this.canvas.height = height;
          this.canvas.style.width = width + 'px';
          this.canvas.style.height = height + 'px';
        }
        this.canvas.style.left = left + 'px';
        this.canvas.style.top = top + 'px';

        // Resolución adaptativa: resolución completa 1.0 al acercarse para nitidez total sin pixelado
        const zoom = (this.getMap().getZoom) ? this.getMap().getZoom() : 13;
        const scale = zoom >= 15 ? 1.0 : 0.75;
        const sW = Math.max(1, Math.round(width * scale));
        const sH = Math.max(1, Math.round(height * scale));
        if (this.offscreenCanvas.width !== sW || this.offscreenCanvas.height !== sH) {
          this.offscreenCanvas.width = sW;
          this.offscreenCanvas.height = sH;
        } else {
          this.offscreenCtx.clearRect(0, 0, sW, sH);
        }

        // Radio adaptativo conectado al zoom geográfico para no encogerse ni desintegrarse al acercarse
        const dynR = (typeof window.getDynamicHeatmapRadius === 'function') ? window.getDynamicHeatmapRadius(zoom) : 48;
        const baseR = Math.max(16, Math.round(dynR * scale * 0.75));
        this._updateBrush(baseR);

        // 1. Estampar sombras de densidad aceleradas por GPU (drawImage en vez de createRadialGradient)
        const pts = this.points;
        const len = pts.length;
        const brush = this.brushCanvas;
        const visiblePoints = [];

        for (let i = 0; i < len; i++) {
          const pt = pts[i];
          const loc = pt.latLng || pt.location || (pt.lat !== undefined ? new google.maps.LatLng(pt.lat, pt.lng) : pt);
          if (!bounds.contains(loc)) continue;

          visiblePoints.push(pt);

          const pixel = overlayProjection.fromLatLngToDivPixel(loc);
          if (!pixel) continue;

          const px = (pixel.x - left) * scale;
          const py = (pixel.y - top) * scale;
          const w = pt.weight || 1;
          const r = baseR * (0.85 + Math.min(0.60, w / 12));
          // Opacidad suave, traslúcida y elegante que no tapa las calles ni los nombres del mapa
          const pointAlpha = Math.min(0.25, 0.07 + (w * 0.015));

          this.offscreenCtx.globalAlpha = pointAlpha;
          this.offscreenCtx.drawImage(brush, px - r, py - r, r * 2, r * 2);
        }
        this.offscreenCtx.globalAlpha = 1.0;

        // 2. Colorear píxeles con manipulación de memoria directa de 32 bits (Uint32Array)
        try {
          const imgData = this.offscreenCtx.getImageData(0, 0, sW, sH);
          const data32 = new Uint32Array(imgData.data.buffer);
          const totalPixels = data32.length;
          const palette32 = this.palette32;

          for (let i = 0; i < totalPixels; i++) {
            const pixel = data32[i];
            const alpha = (pixel >> 24) & 0xff;
            if (alpha > 0) {
              data32[i] = palette32[alpha];
            }
          }
          this.offscreenCtx.putImageData(imgData, 0, 0);

          // 3. Proyección por hardware al canvas principal (interpolación bicúbica)
          this.ctx.clearRect(0, 0, width, height);
          this.ctx.imageSmoothingEnabled = true;
          this.ctx.imageSmoothingQuality = 'high';
          this.ctx.drawImage(this.offscreenCanvas, 0, 0, width, height);
        } catch(e) {}

        // Actualizar la Escala de Densidad en tiempo real en función de lo que realmente se ve en pantalla
        if (visiblePoints.length > 0 && currentHeatmapLayer && currentHeatmapLayer !== 'none') {
          updateHeatmapScaleLegend(currentHeatmapLayer, null, visiblePoints);
        }
      }

      setGradient(gradient) {
        this.gradient = gradient;
        this.palette32 = this.createPalette32(gradient);
        this.draw();
      }

      createPalette32(gradColors) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 1;
        pCanvas.height = 256;
        const pCtx = pCanvas.getContext('2d');
        const grad = pCtx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        const step = 1 / Math.max(1, gradColors.length - 1);
        gradColors.forEach((c, idx) => {
          grad.addColorStop(Math.min(1, idx * step), c);
        });
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, 1, 256);
        const pData = pCtx.getImageData(0, 0, 1, 256).data;
        return new Uint32Array(pData.buffer);
      }

      onRemove() {
        if (this._rafId) cancelAnimationFrame(this._rafId);
        if (this.canvas && this.canvas.parentNode) {
          this.canvas.parentNode.removeChild(this.canvas);
        }
        this.canvas = null;
        this.ctx = null;
        this.brushCanvas = null;
        this.offscreenCanvas = null;
      }
    }

    CanvasHeatmapOverlayClass = CanvasHeatmapOverlay;
    return CanvasHeatmapOverlayClass;
  }

  function renderGoogleHeatmap(data, layerType) {
      try {
        if (gHeatmapLayer) {
          try { gHeatmapLayer.setMap(null); } catch(e) {}
          gHeatmapLayer = null;
        }

        const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;

        if (!map) {
          window.logLiveDebug('Aviso: Objeto map no está disponible aún para Heatmap', 'warn');
          updateHeatmapVerificationUI(false, 'Mapa no inicializado', 0, metricLabel);
          return;
        }

        if (!data || !Array.isArray(data) || data.length === 0) {
          window.logLiveDebug('Aviso: No hay puntos válidos para renderizar el Heatmap', 'warn');
          updateHeatmapVerificationUI(false, 'Sin puntos de coordenadas', 0, metricLabel);
          return;
        }

        // Validar y sanitizar cada punto para prevenir InvalidValueError
        const validPoints = [];
        data.forEach(d => {
          const lat = Number(d.lat);
          const lng = Number(d.lng);
          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            validPoints.push({
              location: new google.maps.LatLng(lat, lng),
              weight: Math.max(1, Math.min(50, Number(d.weight) || 1))
            });
          }
        });

        if (validPoints.length === 0) {
          window.logLiveDebug('ERROR: Todos los puntos del Heatmap fueron descartados por coordenadas inválidas', 'error');
          updateHeatmapVerificationUI(false, 'Coordenadas inválidas (NaN)', 0, metricLabel);
          return;
        }

        const gradients = {
          peya_maus: [
            'rgba(30, 58, 138, 0)',
            'rgba(59, 130, 246, 0.35)',
            'rgba(6, 182, 212, 0.52)',
            'rgba(16, 185, 129, 0.68)',
            'rgba(245, 158, 11, 0.76)',
            'rgba(234, 4, 78, 0.82)'
          ],
          covered_maus: [

            'rgba(139, 92, 246, 0.52)',
            'rgba(124, 58, 237, 0.68)',
            'rgba(192, 132, 252, 0.78)',
            'rgba(234, 4, 78, 0.82)'
          ],
          dmart_maus: [
            'rgba(159, 18, 57, 0)',
            'rgba(251, 113, 133, 0.35)',
            'rgba(244, 63, 94, 0.52)',
            'rgba(225, 29, 72, 0.68)',
            'rgba(234, 4, 78, 0.80)',
            'rgba(190, 18, 60, 0.82)'
          ],
          penetration: [
            'rgba(15, 118, 110, 0)',
            'rgba(94, 234, 212, 0.35)',
            'rgba(45, 212, 191, 0.52)',
            'rgba(20, 184, 166, 0.68)',
            'rgba(16, 185, 129, 0.78)',
            'rgba(5, 150, 105, 0.82)'
          ],
          seamless_worst: [
            'rgba(254, 240, 138, 0)',
            'rgba(253, 224, 71, 0.40)',
            'rgba(249, 115, 22, 0.60)',
            'rgba(239, 68, 68, 0.75)',
            'rgba(185, 28, 28, 0.82)'
          ],
          seamless_best: [
            'rgba(167, 243, 208, 0)',
            'rgba(110, 231, 183, 0.40)',
            'rgba(52, 211, 153, 0.60)',
            'rgba(16, 185, 129, 0.75)',
            'rgba(5, 150, 105, 0.82)'
          ],
          afv: [
            'rgba(254, 243, 199, 0)',
            'rgba(253, 230, 138, 0.40)',
            'rgba(251, 191, 36, 0.60)',
            'rgba(245, 158, 11, 0.75)',
            'rgba(217, 119, 6, 0.82)'
          ],
          late_orders: [
            'rgba(254, 226, 226, 0)',
            'rgba(252, 165, 165, 0.40)',
            'rgba(248, 113, 113, 0.60)',
            'rgba(239, 68, 68, 0.75)',
            'rgba(185, 28, 28, 0.82)'
          ],
          orders: [
            'rgba(255, 228, 230, 0)',
            'rgba(254, 205, 211, 0.40)',
            'rgba(251, 113, 133, 0.60)',
            'rgba(244, 63, 94, 0.75)',
            'rgba(234, 4, 78, 0.82)'
          ],
          gmv_dmart: [
            'rgba(209, 250, 229, 0)',
            'rgba(110, 231, 183, 0.40)',
            'rgba(52, 211, 153, 0.60)',
            'rgba(16, 185, 129, 0.75)',
            'rgba(5, 150, 105, 0.82)'
          ]
        };

        const currentZoom = (map && map.getZoom) ? map.getZoom() : 14;
        const dynRadius = (typeof window.getDynamicHeatmapRadius === 'function') ? window.getDynamicHeatmapRadius(currentZoom) : 36;

        // Crear HeatmapLayer con array nativo compatible o fallback automático a CanvasHeatmapOverlay
        try {
          if (google.maps.visualization && google.maps.visualization.HeatmapLayer) {
            gHeatmapLayer = new google.maps.visualization.HeatmapLayer({
              data: validPoints,
              map: map,
              radius: dynRadius,
              opacity: currentHeatmapOpacity || 0.55,
              dissipating: true,
              maxIntensity: 32
            });
            if (gradients[layerType]) {
              gHeatmapLayer.set('gradient', gradients[layerType]);
            }
          } else {
            throw new Error('HeatmapLayer no disponible en SDK Google Maps');
          }
        } catch(instErr) {
          window.logLiveDebug('Activando motor nativo CanvasHeatmapOverlay: ' + instErr.message, 'info');
          const CustomOverlay = getCanvasHeatmapOverlayClass();
          if (CustomOverlay) {
            gHeatmapLayer = new CustomOverlay({
              data: validPoints,
              map: map,
              radius: dynRadius,
              opacity: currentHeatmapOpacity || 0.55,
              gradient: gradients[layerType] || gradients.peya_maus
            });
          }
        }

        // Atenuar polígonos rojos de cobertura para que no tapen el brillo del heatmap
        try {

            });
          }
          if (activePolygonsMap) {
            activePolygonsMap.forEach(e => {
              if (e && e.polygon && e.polygon.setOptions) e.polygon.setOptions({ fillOpacity: 0.05 });
            });

        showToast(`Heatmap activo: ${metricLabel} (${validPoints.length} puntos)`, 'success');
      } catch(fatalErr) {
        window.logLiveDebug('EXCEPCION DENTRO DE renderGoogleHeatmap: ' + fatalErr.message + '\n' + (fatalErr.stack || ''), 'error');
        console.error('Heatmap render error:', fatalErr);
      }
    }

    let HEATMAP_STABLE_BOUNDS = {};

    function calibrateHeatmapStableBounds(layerType) {
      const type = String(layerType || '').toLowerCase();
      if (!type || type === 'none') return;

      const activeCountry = document.getElementById('filter-country').value;
      const stores = allWarehouses.filter(w => {
        if (!w.is_active) return false;
        if (activeCountry && w.country !== activeCountry) return false;
        return true;
      });

      let min = Infinity;
      let max = -Infinity;

      stores.forEach(s => {
        const areaVal = Number(s.coverage_area_km2) || 12;
        const ordersVal = Number(s.orders) || 200;
        let val = 0;

        if (type === 'peya_maus') val = Number(s.peya_users) || Math.round(areaVal * 1100);
        else if (type === 'covered_maus') val = Number(s.covered_maus) || Number(s.peya_users) || Math.round(areaVal * 950);
        else if (type === 'dmart_maus') val = Number(s.dmart_users) || Math.round(ordersVal * 0.48);
        else if (type === 'penetration') val = Number(s.penetration_pct) || 14.5;
        else if (type === 'seamless_worst' || type === 'seamless_best') val = Number(s.seamless_delivery_pct) || 80;
        else if (type === 'afv') val = Number(s.afv_aov_amount) || 15.2;
        else if (type === 'late_orders') val = Number(s.order_late_pct) || 7.5;
        else if (type === 'orders') val = ordersVal;
        else if (type === 'gmv_dmart') val = Number(s.total_net_sales) || (ordersVal * 15);
        else if (type === 'cpo') val = Number(s.rider_cpo_dmarts) || Number((1.25 + ((Number(s.avg_delivery_time_min) || 21) * 0.055)).toFixed(2));

        if (!isNaN(val) && val > 0) {
          if (val < min) min = val;
          if (val > max) max = val;
        }
      });

      if (min === Infinity || min === max) {
        min = 0;
        max = 100;
      }

      HEATMAP_STABLE_BOUNDS[type] = { min, max };
    }

    // ── Actualización de la Escala de Color y Concentración Dinámica y Estable ──
    function updateHeatmapScaleLegend(layerType, gradients, points = []) {
      const container = document.getElementById('heatmap-legend-container');
      if (!container) return;
      if (layerType === 'none') {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';

      const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;
      const metricEl = document.getElementById('heatmap-scale-metric-name');
      if (metricEl) metricEl.textContent = metricLabel;

      const gradColors = (gradients && gradients[layerType]) || [
        'rgba(0, 255, 255, 0.2)', '#00ffff', '#007fff', '#6366f1', '#4f46e5'
      ];
      const barEl = document.getElementById('heatmap-gradient-bar');
      if (barEl && gradColors && gradColors.length > 0) {
        barEl.style.background = `linear-gradient(to right, ${gradColors.join(', ')})`;
      }

      const minEl = document.getElementById('heatmap-legend-min');
      const midEl = document.getElementById('heatmap-legend-mid');
      const maxEl = document.getElementById('heatmap-legend-max');

      // Obtener cotas estables para evitar fluctuaciones aleatorias al desplazar el mapa
      if (!HEATMAP_STABLE_BOUNDS[layerType]) {
        calibrateHeatmapStableBounds(layerType);
      }

      const stable = HEATMAP_STABLE_BOUNDS[layerType] || { min: 0, max: 100 };
      let minVal = stable.min;
      let maxVal = stable.max;

      // Si hay puntos en pantalla, la Escala de Densidad refleja dinámicamente lo que se está viendo en el mapa
      if (points && points.length > 0) {
        let pMin = Infinity, pMax = -Infinity;
        points.forEach(p => {
          const v = (p.rawVal !== undefined) ? Number(p.rawVal) : Number(p.weight || 0);
          if (!isNaN(v) && v > 0) {
            if (v < pMin) pMin = v;
            if (v > pMax) pMax = v;
          }
        });
        if (pMin !== Infinity && pMax !== -Infinity) {
          minVal = pMin;
          maxVal = pMax;
        }
      }

      if (minVal === maxVal) {
        minVal = minVal * 0.9;
        maxVal = maxVal * 1.1;
      }

      const midVal = (minVal + maxVal) / 2;

      // Formato dinámico según la métrica activa
      if (layerType === 'penetration' || layerType === 'seamless_worst' || layerType === 'seamless_best' || layerType === 'late_orders') {
        if (minEl) minEl.textContent = `${minVal.toFixed(1)}%`;
        if (midEl) midEl.textContent = `${midVal.toFixed(1)}%`;
        if (maxEl) maxEl.textContent = `${maxVal.toFixed(1)}%`;
      } else if (layerType === 'afv' || layerType === 'cpo') {
        if (minEl) minEl.textContent = `$ ${minVal.toFixed(2)}`;
        if (midEl) midEl.textContent = `$ ${midVal.toFixed(2)}`;
        if (maxEl) maxEl.textContent = `$ ${maxVal.toFixed(2)}`;
      } else {
        if (minEl) minEl.textContent = Math.round(minVal).toLocaleString('es-AR');
        if (midEl) midEl.textContent = Math.round(midVal).toLocaleString('es-AR');
        if (maxEl) maxEl.textContent = Math.round(maxVal).toLocaleString('es-AR');
      }
    }

    function startCustomPolygonDrawing() {

      if (map) map.setOptions({ draggableCursor: 'crosshair', disableDoubleClickZoom: true });

    function addPointToCustomPolygon(latLng) {
      if (!isCustomPolygonDrawing || !latLng) return;

      // Detección de doble clic o doble toque rápido para cerrar el shape inmediatamente
      const now = Date.now();
      if (now - lastVertexClickTime < 380 && customPolygonPoints.length >= 3) {
        lastVertexClickTime = 0;
        customPolygonPoints.pop(); // descartar el punto redundante del segundo toque
        finishCustomPolygonDrawing();
        return;
      }
      lastVertexClickTime = now;

      customPolygonPoints.push(latLng);

      const ptMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 4.5,
          fillColor: '#0284c7',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 2
        },
        clickable: true,
        zIndex: 1000
      });

      ptMarker.addListener('click', () => {
        if (customPolygonPoints.length >= 3) {
          finishCustomPolygonDrawing();
        }
      });

      ptMarker.addListener('dblclick', (e) => {
        if (e && e.stop) e.stop();
        if (customPolygonPoints.length >= 3) {
          finishCustomPolygonDrawing();
        }
      });

      customPolygonVertexMarkers.push(ptMarker);

      if (customPolygonPreview) {
        customPolygonPreview.setPath(customPolygonPoints);
      } else {
        customPolygonPreview = new google.maps.Polygon({
          paths: customPolygonPoints,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          clickable: false,
          zIndex: 99
        });
      }

      const bannerText = document.getElementById('polygon-drawing-status-text');
      const finishBtn = document.getElementById('btn-finish-custom-polygon');

      if (customPolygonPoints.length < 3) {
        if (bannerText) bannerText.textContent = `${customPolygonPoints.length} punto${customPolygonPoints.length === 1 ? '' : 's'}. Marcá al menos 3 puntos.`;
        if (finishBtn) finishBtn.disabled = true;
      } else {
        if (bannerText) bannerText.textContent = `${customPolygonPoints.length} puntos. Hacé doble clic para cerrar el shape.`;
        if (finishBtn) finishBtn.disabled = false;
      }
    }

    function finishCustomPolygonDrawing() {
      if (!isCustomPolygonDrawing || customPolygonPoints.length < 3) {
        showToast('Se necesitan al menos 3 puntos para cerrar el polígono.', 'warning');
        return;
      }

      if (map) map.setOptions({ draggableCursor: null, disableDoubleClickZoom: false });
      customPolygonVertexMarkers.forEach(m => m.setMap(null));
      customPolygonVertexMarkers = [];

      if (customPolygonPreview) {
        customPolygonPreview.setMap(null);
        customPolygonPreview = null;
      }

      const finalPolygon = new google.maps.Polygon({
        paths: customPolygonPoints,
        map: map,
        strokeColor: '#0284c7',
        strokeWeight: 2.5,
        fillColor: '#0284c7',
        fillOpacity: 0.22,
        editable: true,
        draggable: false,
        clickable: true,
        zIndex: 99
      });

      customDrawnOverlay = finalPolygon;
      customDrawnType = 'polygon';
      isCustomPolygonDrawing = false;

      if (map) map.setOptions({ draggableCursor: null });
      setStoreLayersClickable(true);

      const banner = document.getElementById('polygon-drawing-banner');
      if (banner) banner.style.display = 'none';

      const badge = document.getElementById('zone-drawing-active-badge');
      if (badge) badge.style.display = 'none';

      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'block';

      finalPolygon.getPath().addListener('set_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));
      finalPolygon.getPath().addListener('insert_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));
      finalPolygon.getPath().addListener('remove_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));

      analyzeCustomDrawnZone(finalPolygon, 'polygon');
      showToast('Polígono cerrado con éxito. Podés arrastrar los puntos blancos para modificar sus vértices.', 'success');
    }

    function cancelCustomPolygonDrawing() {

      customPolygonPoints = [];

    function initDrawingManager() {
      try {
        if (drawingManager || !map || !window.google || !google.maps || !google.maps.drawing || !google.maps.drawing.DrawingManager) return;

        drawingManager = new google.maps.drawing.DrawingManager({
          drawingMode: null,
          drawingControl: false,
          circleOptions: {
            fillColor: '#0284c7',
            fillOpacity: 0.20,
            strokeColor: '#0284c7',
            strokeWeight: 2.5,
            clickable: true,
            editable: true,
            draggable: false,
            zIndex: 99
          }

        drawingManager.setMap(map);

      google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
        if (customDrawnOverlay) {
          customDrawnOverlay.setMap(null);
        }
        customDrawnOverlay = event.overlay;
        customDrawnType = event.type;
        drawingManager.setDrawingMode(null);

        if (event.type === google.maps.drawing.OverlayType.CIRCLE) {
          event.overlay.addListener('radius_changed', () => analyzeCustomDrawnZone(event.overlay, 'circle'));
          event.overlay.addListener('center_changed', () => analyzeCustomDrawnZone(event.overlay, 'circle'));
        }

        analyzeCustomDrawnZone(event.overlay, event.type);
      });
      } catch(e) {
        console.warn('[DrawingManager Notice]:', e.message);

    }

    window.exportCustomZoneGeoJSON = function() {

    // ============================================================
    // BUSCADOR AUTOMÁTICO DE POLÍGONOS DE BARRIOS Y ZONAS (CATASTRAL)
    // ============================================================
    async function searchAndDrawNeighborhoodPolygon() {
      const input = document.getElementById('neighborhood-poly-search-input');
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      if (!input || !input.value.trim()) {
        showToast('Escribí el nombre de un barrio o zona (ej. Palermo, Tolosa, Caballito)', 'warning');
        return;
      }

      const query = input.value.trim();
      const countryEl = document.getElementById('filter-country');
      const cityEl = document.getElementById('filter-city');
      const activeCountry = (countryEl && countryEl.value) || 'Argentina';
      const activeCity = (cityEl && cityEl.value) || '';

      // Construir query georreferenciada con país y ciudad activa
      let fullQuery = query;
      if (!query.toLowerCase().includes(activeCountry.toLowerCase())) {
        if (activeCity && !query.toLowerCase().includes(activeCity.toLowerCase())) {
          fullQuery += `, ${activeCity}`;
        }
        fullQuery += `, ${activeCountry}`;
      }

      showToast(`Buscando límites catastrales de "${query}"...`, 'info');
      if (resultsDiv) {
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = '<div style="padding:8px 10px; color:var(--text-sheet-muted); text-align:center;">Buscando límites oficiales...</div>';
      }

      const countryCodesMap = {
        'argentina': 'ar', 'chile': 'cl', 'uruguay': 'uy', 'peru': 'pe', 'perú': 'pe',
        'ecuador': 'ec', 'bolivia': 'bo', 'paraguay': 'py', 'dominicana': 'do', 'república dominicana': 'do'
      };
      const cc = countryCodesMap[activeCountry.toLowerCase()] || '';
      const ccParam = cc ? ('&countrycodes=' + cc) : '';

      try {
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(fullQuery) + '&format=json&polygon_geojson=1&addressdetails=1&limit=5' + ccParam;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) throw new Error('Servidor de límites no disponible');
        const data = await resp.json();

        // Filtrar aquellos que tengan geometría de polígono válida
        let validResults = (data || []).filter(item => {
          return item.geojson && (item.geojson.type === 'Polygon' || item.geojson.type === 'MultiPolygon');
        });

        if (validResults.length === 0) {
          // Búsqueda más amplia por si la ciudad acotó demasiado
          const broadUrl = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query + ', ' + activeCountry) + '&format=json&polygon_geojson=1&limit=5' + ccParam;
          const broadResp = await fetch(broadUrl);
          const broadData = await broadResp.json();
          validResults = (broadData || []).filter(item => item.geojson && (item.geojson.type === 'Polygon' || item.geojson.type === 'MultiPolygon'));
        }

        if (validResults.length === 0) {
          if (resultsDiv) resultsDiv.style.display = 'none';
          searchGoogleMapsZone(query);
          return;
        }

        if (validResults.length === 1) {
          if (resultsDiv) resultsDiv.style.display = 'none';
          drawFoundNeighborhoodPolygon(validResults[0], query);
        } else {
          displayNeighborhoodSearchResults(validResults, query);
        }

      } catch(e) {
        console.warn('Fallback a geocoder Google Maps tras error en límites:', e.message);
        if (resultsDiv) resultsDiv.style.display = 'none';
        searchGoogleMapsZone(query);
      }
    }

    function displayNeighborhoodSearchResults(results, query) {
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      if (!resultsDiv) return;

      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = '';

      results.forEach((item) => {
        const itemRow = document.createElement('div');
        itemRow.style.padding = '6px 9px';

        itemRow.style.cursor = 'pointer';
        itemRow.style.transition = 'background 0.15s ease';

        const displayName = item.display_name || item.name;

    function drawFoundNeighborhoodPolygon(item, query) {
      if (!item || !item.geojson || !map) return;

      // Limpiar zona previa si existe
      clearCustomDrawnZone();

      let outerRing = [];
      if (item.geojson.type === 'Polygon') {
        outerRing = item.geojson.coordinates[0];
      } else if (item.geojson.type === 'MultiPolygon') {
        let maxLen = 0;
        item.geojson.coordinates.forEach(polyCoords => {
          if (polyCoords[0] && polyCoords[0].length > maxLen) {
            maxLen = polyCoords[0].length;
            outerRing = polyCoords[0];
          }
        });
      }

      if (!outerRing || outerRing.length < 3) {
        showToast('Geometría de polígono inválida para este barrio.', 'error');
        return;
      }

      const path = outerRing.map(pt => ({ lat: pt[1], lng: pt[0] }));

      // Crear el polígono editable en Google Maps
      customZonePolygon = new google.maps.Polygon({
        paths: path,
        map: map,
        strokeColor: '#7c3aed',
        strokeOpacity: 0.95,
        strokeWeight: 2.5,
        fillColor: '#7c3aed',
        fillOpacity: 0.22,
        editable: true,
        draggable: false,
        zIndex: 100
      });

      // Encuadrar la cámara directamente en el barrio
      const bounds = new google.maps.LatLngBounds();
      path.forEach(pt => bounds.extend(pt));
      map.fitBounds(bounds, 50);

      // Asignar el nombre del barrio al input de guardado
      const zoneName = item.name || query;
      const nameInput = document.getElementById('zone-name-input');
      if (nameInput) nameInput.value = `Barrio ${zoneName}`;

      const searchInput = document.getElementById('neighborhood-poly-search-input');
      if (searchInput) searchInput.value = zoneName;

      // Mostrar botón de limpiar zona
      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'block';

      // Calcular métricas, intersecciones y canibalización
      analyzeCustomDrawnZone(customZonePolygon, 'polygon');

      // Escuchar modificaciones en los vértices del polígono
      customZonePolygon.getPath().addListener('set_at', () => {
        analyzeCustomDrawnZone(customZonePolygon, 'polygon');
      });
      customZonePolygon.getPath().addListener('insert_at', () => {
        analyzeCustomDrawnZone(customZonePolygon, 'polygon');
      });

      showToast(`Límites de "${zoneName}" trazados con éxito. Podés editar vértices con el mouse o calcular con BQ.`, 'success');
    }

    // Cerrar sugerencias al hacer clic fuera del buscador
    document.addEventListener('click', function(e) {
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      const input = document.getElementById('neighborhood-poly-search-input');
      if (resultsDiv && e.target !== resultsDiv && e.target !== input && !resultsDiv.contains(e.target)) {
