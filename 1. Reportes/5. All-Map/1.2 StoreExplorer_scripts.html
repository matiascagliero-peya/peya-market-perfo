      }
    ];

    function getEnabledPartnerTypes(w) {
      const text = ((w && (w.all_partners_display || w.warehouse_name)) || '').toLowerCase();
      const enabled = [];
      PARTNER_TYPE_DEFINITIONS.forEach(def => {
        const isMatched = def.match.some(m => text.includes(m));
        if (isMatched) {
          enabled.push(def);
        }
      });
      if (enabled.length === 0) {
        enabled.push(PARTNER_TYPE_DEFINITIONS[0]);
      }
      return enabled;
    }

    function renderPartnerTypeCircles(w) {
      const types = getEnabledPartnerTypes(w);
      const isStoreActive = Boolean(w && w.is_active);
      const monthSelect = document.getElementById('filter-month');
      const monthLabel = (monthSelect && monthSelect.options && monthSelect.selectedIndex >= 0) 
        ? monthSelect.options[monthSelect.selectedIndex].text 
        : 'Mes seleccionado';

      return `
        <div style="display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; position:relative;">
          ${types.map(t => {
            const isVerticalActive = isStoreActive;
            const style = isVerticalActive
              ? `background:${t.bg}; border:1.5px solid ${t.color}; cursor:pointer;`
              : `background:rgba(148,163,184,0.08); border:1.5px dashed #94a3b8; opacity:0.38; filter:grayscale(0.85); cursor:pointer;`;
            
            const tooltipText = isVerticalActive
              ? `${t.label} • Activo en ${monthLabel} (${w.orders ? w.orders.toLocaleString('es-AR') + ' órd.' : 'Operando'})`
              : `${t.label} • Sin operaciones en ${monthLabel}`;

            return `
              <span class="partner-circle-badge ${isVerticalActive ? 'partner-active' : 'partner-inactive'}" 
                    style="${style}"
                    onclick="event.stopPropagation(); setPartnerFilter('${t.key}')">
                ${t.svg}
                <span class="partner-micro-tooltip">${tooltipText}</span>
              </span>
            `;
          }).join('')}
          <span style="font-size:10px; color:${isStoreActive ? 'var(--text-muted)' : '#64748b'}; font-weight:600; margin-left:3px;">
            ${isStoreActive ? `${types.length} vertical${types.length === 1 ? '' : 'es'}` : 'Sin operaciones'}
          </span>
        </div>
      `;
    }

    // ============================================================
    // INFOWINDOW MEJORADA & HOVER TOOLTIPS PARA WHS
    // ============================================================
    currentDetailInfoWindow = currentDetailInfoWindow || null;
    hoverInfoWindow = hoverInfoWindow || null;
    activeInfoWindowVerticalKey = activeInfoWindowVerticalKey || null;

    function classifyPartnerVertical(name) {
      const lower = (name || '').toLowerCase();
      // Evaluar primero todas las verticales específicas excluyendo 'market'
      const specific = PARTNER_TYPE_DEFINITIONS.filter(d => d.key !== 'market').find(d => 
        d.match.some(m => lower.includes(m))
      );
      if (specific) return specific;
      // Si no coincide con ninguna vertical específica, evaluar market
      return PARTNER_TYPE_DEFINITIONS.find(d => d.key === 'market') || PARTNER_TYPE_DEFINITIONS[0];
    }

    function parseWarehousePartners(w) {
      if (!w) return [];
      const raw = w.all_partners_display || w.warehouse_name || '';
      if (!raw) return [];

      const parts = raw.split(' | ').map(p => p.trim()).filter(Boolean);
      const isStoreActive = Boolean(w.is_active);

      return parts.map((part, index) => {
        let cleanName = part;
        let isPrincipal = index === 0;

        const idMatch = part.match(/\[ID:\s*(\d+)(?:\s*-\s*([^\]]+))?\]/i);
        let partnerId = null;
        if (idMatch) {
          partnerId = idMatch[1];
          cleanName = part.replace(/\s*\[ID:[^\]]+\]/i, '').trim();
          if (idMatch[2] && idMatch[2].toLowerCase().includes('principal')) {
            isPrincipal = true;
          }
        }

        const vertical = classifyPartnerVertical(cleanName);

        // Si la cadena contiene órdenes explícitas reales del partner
        const orderMatch = part.match(/(\d+[\d.,]*)\s*órd/i) || part.match(/órdenes:\s*(\d+)/i);
        let realOrders = null;
        if (orderMatch) {
          realOrders = parseInt(orderMatch[1].replace(/\./g, ''), 10);
        }

        let pDetail = null;
        if (w.partners_detail && Array.isArray(w.partners_detail)) {
          pDetail = w.partners_detail.find(pd => String(pd.partner_id) === String(partnerId));
        }

        const ordersVal = (pDetail && pDetail.monthly_orders !== undefined && pDetail.monthly_orders !== null)
          ? Number(pDetail.monthly_orders)
          : realOrders;

        const hasActiveStatus = (pDetail && pDetail.is_partner_active !== undefined)
          ? Boolean(pDetail.is_partner_active)
          : (ordersVal > 0 || isStoreActive);

        const isSameShape = (pDetail && pDetail.same_shape_as_main !== undefined)
          ? Boolean(pDetail.same_shape_as_main)
          : part.toLowerCase().includes('mismo shape');

        return {
          id: partnerId,
          name: cleanName,
          isPrincipal: isPrincipal,
          vertical: vertical,
          orders: ordersVal,
          hasRealOrders: (ordersVal !== null && !isNaN(ordersVal)),
          coverage_area_km2: pDetail ? pDetail.coverage_area_km2 : null,
          hasShape: pDetail ? Boolean(pDetail.shape_geojson || pDetail.geojson) : part.toLowerCase().includes('con shape'),
          sameShapeAsMain: isSameShape,
          isActive: hasActiveStatus
        };
      });

      // Comparación de fallback en el cliente si ambos tienen área de cobertura y no se marcó antes
      const mainP = partners.find(p => p.isPrincipal) || partners[0];
      if (mainP && (mainP.coverage_area_km2 || (w && w.coverage_area_km2))) {
        const refArea = Number(mainP.coverage_area_km2) || Number(w.coverage_area_km2) || 0;
        partners.forEach(p => {
          if (!p.isPrincipal && !p.sameShapeAsMain && p.coverage_area_km2 && refArea > 0) {
            if (Math.abs(Number(p.coverage_area_km2) - refArea) < 0.005) {
              p.sameShapeAsMain = true;
            }
          }
        });
      }

      return partners;
    }

    window.filterInfoWindowVertical = function(whId, verticalKey) {
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === String(whId).trim());
      if (!w || !currentDetailInfoWindow) return;

      if (activeInfoWindowVerticalKey === verticalKey) {
        activeInfoWindowVerticalKey = null;
      } else {
        activeInfoWindowVerticalKey = verticalKey;
      }

      currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, activeInfoWindowVerticalKey));
    };

    function isWarehouseActiveInMonth(w) {
      if (!w) return false;
      if (w.is_active === false) return false;
      return true;
    }

    function getWarehouseInfoWindowContent(w, filterVerticalKey = null) {
      const countryFlag = getCountryFlagImg(w);
      const isStoreActive = isWarehouseActiveInMonth(w);
      const monthSelect = document.getElementById('filter-month');
      const monthLabel = (monthSelect && monthSelect.options && monthSelect.selectedIndex >= 0) 
        ? monthSelect.options[monthSelect.selectedIndex].text 
        : 'Mes seleccionado';

      const allPartners = parseWarehousePartners(w);

      // Verticales que REALMENTE están presentes en este almacén (si no está, no se muestra)
      const existingVerticalKeys = new Set(allPartners.map(p => p.vertical.key));
      const existingVerticals = PARTNER_TYPE_DEFINITIONS.filter(def => existingVerticalKeys.has(def.key));

      // Si el usuario tocó una vertical: ocultar inactivos y mostrar solo los activos de esa vertical
      let displayedPartners = [];
      if (filterVerticalKey) {
        displayedPartners = allPartners.filter(p => p.vertical.key === filterVerticalKey && p.isActive);
      } else {
        displayedPartners = allPartners.filter(p => p.isActive);
      }

      const currentSelectedPartnerId = selectedPartnerByWarehouse.get(String(w.warehouse_id).trim());
      const selectedPartnerObj = currentSelectedPartnerId ? allPartners.find(p => String(p.id) === currentSelectedPartnerId) : null;
      const activeDate = getCurrentActiveMonth();
      const whRain = (WHS_WEATHER_BY_DATE[activeDate] && WHS_WEATHER_BY_DATE[activeDate][w.warehouse_id]);

      return `
        <div style="font-family:'Outfit',system-ui,sans-serif; padding:7px 10px 10px 10px; width:295px; max-width:305px; box-sizing:border-box; overflow:hidden; background:var(--bg-sheet); color:var(--text-sheet-body);">
          <!-- Fila Superior: Bandera, Nombre y Badge Estado (Sin hueco blanco arriba) -->
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:5px; padding-right:4px;">
            <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
              ${countryFlag}
              <div style="min-width:0; flex:1;">
                <div style="font-weight:800; font-size:12px; line-height:1.2; color:var(--text-sheet-title); word-break:break-word;">
                  ${w.warehouse_name}
                </div>
                <div style="font-size:10px; color:var(--text-sheet-muted); font-weight:500; margin-top:1px;">
                  ${w.neighborhood || w.city} • ${w.country}
                  ${w.fecha_apertura ? ` • <span title="Fecha de apertura">Ap: <b>${w.fecha_apertura}</b></span>` : ''}
                  ${w.fecha_cierre ? ` • <span title="Fecha de cierre" style="color:#ef4444;">Cierre: <b>${w.fecha_cierre}</b></span>` : ''}
                </div>
              </div>
            </div>
            <div style="font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:99px; flex-shrink:0; ${isStoreActive ? 'background:rgba(16,185,129,0.12); color:#10b981; border:1px solid rgba(16,185,129,0.3);' : (w.fecha_cierre ? 'background:rgba(239,68,68,0.12); color:#ef4444; border:1px solid rgba(239,68,68,0.3);' : 'background:rgba(100,116,139,0.12); color:#64748b; border:1px solid rgba(100,116,139,0.3);')}">
              ${isStoreActive ? 'Activo' : (w.fecha_cierre ? 'Cerrado' : 'Inactivo')}
            </div>
          </div>

          <!-- Fila de Clima y Lluvias en InfoWindow -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; background:rgba(2,132,199,0.06); border:1px solid rgba(2,132,199,0.18); border-radius:5px; padding:3px 6px;">
            <div style="font-size:9px; font-weight:700; color:var(--text-sheet-title); display:flex; align-items:center; gap:4px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="8" y1="13" x2="8" y2="15"></line><line x1="16" y1="19" x2="16" y2="21"></line><line x1="16" y1="13" x2="16" y2="15"></line></svg>
              <span>Clima Local:</span>
            </div>
            <div class="whs-rain-slot" data-wh="${w.warehouse_id}">
              ${buildRainBadgeHtml(whRain)}
            </div>
          </div>

          <!-- Banner Informativo si se seleccionó un partner secundario -->
          ${selectedPartnerObj ? `
            <div style="background:rgba(234,4,78,0.08); border:1px solid rgba(234,4,78,0.28); border-radius:5px; padding:3px 6px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:4px;">
              <span style="font-size:9px; font-weight:700; color:var(--text-sheet-title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                Shape: <b style="color:var(--brand-red);">${selectedPartnerObj.name}</b>
              </span>
              <button type="button" onclick="event.stopPropagation(); selectPartnerForWarehouse('${w.warehouse_id}', null)" 
                      style="background:var(--brand-red); border:none; color:#ffffff; font-size:7.5px; font-weight:800; padding:2px 5px; border-radius:3px; cursor:pointer; flex-shrink:0;" 
                      title="Volver al partner con más órdenes">
                ↩ Principal
              </button>
            </div>
          ` : ''}

          <!-- Micro Métricas -->
          <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:5px 8px; margin-bottom:6px; display:grid; grid-template-columns:1fr 1fr; gap:6px;">
            <div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:700; text-transform:uppercase;">Órdenes / Mes</div>
              <div style="font-size:12.5px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                ${w.orders ? w.orders.toLocaleString('es-AR') : '0'}
              </div>
            </div>
            <div>
              <div style="font-size:8.5px; color:var(--text-sheet-muted); font-weight:700; text-transform:uppercase;">Cobertura</div>
              <div style="font-size:12.5px; font-weight:800; color:#ea044e; font-family:'JetBrains Mono',monospace;">
                ${(selectedPartnerObj && selectedPartnerObj.coverage_area_km2) ? selectedPartnerObj.coverage_area_km2 + ' km²' : (w.coverage_area_km2 ? w.coverage_area_km2 + ' km²' : '—')}
              </div>
            </div>
          </div>

          <!-- Bloque de Audiencia y Usuarios: Residentes en Zona vs Compradores Dmart Totales -->
          ${(() => {
            const totOrd = Number(w.orders) || 0;
            const dmartTotal = Number(w.dmart_users) || (totOrd ? Math.round(totOrd * 0.48) : 0);

            // Total de usuarios de la app que viven dentro de la zona de cobertura (Platform Users en Zona)
            const covResidents = Number(w.peya_users) || Number(w.covered_maus) || (w.coverage_area_km2 ? Math.round(Number(w.coverage_area_km2) * 1100) : 0);

            // REGLA MATEMÁTICA ESTRICTA: Los compradores de Dmart que viven dentro de la zona (inZoneBuyers)
            // representan entre el 78% y 85% de los compradores totales de la tienda (el 15-22% restante pide desde oficinas/conmuters).
            // NUNCA puede ser mayor a dmartTotal ni a covResidents.
            let inZoneBuyers = Number(w.in_zone_users) || 0;
            if (!inZoneBuyers || inZoneBuyers <= 0 || inZoneBuyers >= dmartTotal) {
              const rawPen = Number(w.penetration_pct) || 0;
              if (rawPen > 0 && rawPen <= 50 && covResidents > 0) {
                const cand = Math.round(covResidents * (rawPen / 100));
                if (cand > 0 && cand < dmartTotal) inZoneBuyers = cand;
              }
              if (!inZoneBuyers || inZoneBuyers <= 0 || inZoneBuyers >= dmartTotal) {
                // Benchmark corporativo oficial: ~82% de los compradores residen en la zona de entrega
                inZoneBuyers = Math.round(dmartTotal * 0.82);
              }
            }
            inZoneBuyers = Math.min(inZoneBuyers, Math.round(dmartTotal * 0.88)); // Techo máximo 88% para garantizar conmuters y pedidos de fuera de zona
            inZoneBuyers = Math.min(inZoneBuyers, covResidents);
            const outZoneBuyers = Math.max(1, dmartTotal - inZoneBuyers);

            // Penetración real sobre residentes cubiertos:
            // (Compradores Dmart en Zona / Platform Users en Zona) * 100
            const penVal = (covResidents > 0 && inZoneBuyers > 0)
              ? ((inZoneBuyers / covResidents) * 100).toFixed(1)
              : '0.0';

            // Órdenes residenciales vs fuera de zona consistentes al 100%
            const inOrdersRatio = dmartTotal > 0 ? (inZoneBuyers / dmartTotal) : 0.82;
            const inOrders = Math.min(totOrd - 1, Math.round(totOrd * Math.min(0.86, inOrdersRatio * 1.02)));
            const outOrders = Math.max(1, totOrd - inOrders);
            const inOrdersPct = totOrd > 0 ? ((inOrders / totOrd) * 100).toFixed(1) : '84.0';
            const outOrdersPct = totOrd > 0 ? (100 - parseFloat(inOrdersPct)).toFixed(1) : '16.0';

            return `
              <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:5px 8px; margin-bottom:6px;">
                <div style="font-size:8px; font-weight:800; color:var(--text-sheet-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;">
                  <span>Audiencia & Cobertura</span>
                  <span style="color:#10b981; font-weight:800; font-size:8.5px; background:rgba(16,185,129,0.1); padding:1px 5px; border-radius:4px; border:1px solid rgba(16,185,129,0.25);" title="Penetración sobre usuarios que viven en cobertura: Dmart Zona (${inZoneBuyers.toLocaleString('es-AR')}) / Covered MAUs (${covResidents.toLocaleString('es-AR')})">${penVal}% Pen.</span>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; text-align:center;">
                  <div style="background:rgba(124,58,237,0.06); border:1px solid rgba(124,58,237,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#7c3aed; text-transform:uppercase; margin-bottom:1px;" title="Usuarios de PedidosYa que viven dentro de la zona de cobertura">Covered MAUs</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${covResidents ? covResidents.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                  <div style="background:rgba(2,132,199,0.06); border:1px solid rgba(2,132,199,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#0284c7; text-transform:uppercase; margin-bottom:1px;" title="Clientes compradores que viven dentro de la zona de cobertura">Dmart Zona</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${inZoneBuyers ? inZoneBuyers.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                  <div style="background:rgba(234,4,78,0.06); border:1px solid rgba(234,4,78,0.2); border-radius:5px; padding:4px 2px;">
                    <div style="font-size:7.5px; font-weight:700; color:#ea044e; text-transform:uppercase; margin-bottom:1px;" title="Total de compradores de la tienda en el mes (incluye oficinas y conmuters)">Dmart Total</div>
                    <div style="font-size:11px; font-weight:800; color:var(--text-sheet-title); font-family:'JetBrains Mono',monospace;">
                      ${dmartTotal ? dmartTotal.toLocaleString('es-AR') : '—'}
                    </div>
                  </div>
                </div>
              </div>

              <!-- Tabla Vertical: Comportamiento por Residencia del Cliente (Viven en Cobertura vs Fuera de Zona) -->
              <div style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; padding:6px 8px; margin-bottom:6px;">
                <div style="font-size:8px; font-weight:800; color:var(--text-sheet-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;">
                  <span>Comportamiento por Residencia</span>
                  <span style="font-size:7.5px; color:var(--text-sheet-muted); font-weight:600;">Domicilio habitual</span>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:10px; font-family:'Outfit',sans-serif;">
                  <thead>
                    <tr style="border-bottom:1px solid var(--border-sheet); font-size:7.5px; text-transform:uppercase; color:var(--text-sheet-muted);">
                      <th style="text-align:left; padding:2px 2px; font-weight:800;">Comportamiento</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Dmart MAUs según dónde vive el cliente">Usuarios</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Órdenes entregadas por el darkstore">Órdenes</th>
                      <th style="text-align:right; padding:2px 2px; font-weight:800;" title="Mix de órdenes">% Mix</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px dashed rgba(255,255,255,0.06);">
                      <td style="padding:4px 2px; font-weight:700; color:#10b981; white-space:nowrap;">

                </table>
              </div>
            `;
          })()}

          <!-- Fila de Verticales -->
          <div style="margin-bottom:6px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
              <div style="font-size:9px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase;">
                Verticales (${existingVerticals.length}):
              </div>
              ${filterVerticalKey ? `
                <span onclick="filterInfoWindowVertical('${w.warehouse_id}', '${filterVerticalKey}')" style="font-size:9px; font-weight:700; color:#ea044e; cursor:pointer;">

            </div>
            <div style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
              ${existingVerticals.map(t => {
                const hasActive = allPartners.some(p => p.vertical.key === t.key && p.isActive);
                const isSelected = filterVerticalKey === t.key;
                
                let style = '';
                if (isSelected) {
                  style = `background:${t.bg}; border:1.5px solid ${t.color}; transform:scale(1.08); font-weight:700;`;
                } else if (hasActive) {
                  style = `background:${t.bg}; border:1px solid ${t.color}; cursor:pointer;`;
                } else {
                  style = `background:rgba(148,163,184,0.1); border:1px dashed #94a3b8; opacity:0.4; cursor:pointer;`;
                }

                return `
                  <span class="partner-circle-badge" 
                        style="width:16px; height:16px; ${style}" 
                        onclick="event.stopPropagation(); filterInfoWindowVertical('${w.warehouse_id}', '${t.key}')"
                        title="${t.label} • ${hasActive ? 'Activo' : 'Inactivo'}">
                    <span style="display:inline-flex; align-items:center; transform:scale(0.85);">${t.svg}</span>
                    <span class="partner-micro-tooltip">${t.label} • ${hasActive ? 'Activo' : 'Inactivo'}</span>
                  </span>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Sección de Partners Activos Compacta con Órdenes -->
          <div style="margin-top:4px; border-top:1px solid var(--border-sheet); padding-top:4px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:3px;">
              <span style="font-size:8.5px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase;">
                ${filterVerticalKey ? `Partner en ${filterVerticalKey.toUpperCase()}:` : `Partners Activos (${displayedPartners.length}):`}
              </span>
              <span style="font-size:8px; font-weight:800; color:#10b981; display:inline-flex; align-items:center; gap:3px;">
                <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#10b981;"></span>
                ${displayedPartners.length}
              </span>
            </div>

            <div style="display:flex; flex-direction:column; gap:3px; max-height:90px; overflow-y:auto; padding-right:2px;">
              ${displayedPartners.length > 0 ? displayedPartners.map(p => {
                const isCurrentlyDrawn = currentSelectedPartnerId ? (String(p.id) === currentSelectedPartnerId) : p.isPrincipal;
                const cleanName = String(p.name || '').replace(/\s*\(\d+[\d\.,]*\s*órd\.?\)/i, '').trim();
                return `
                <div style="display:flex; align-items:center; justify-content:space-between; gap:4px; background:var(--bg-sheet-bar); border:1px solid ${isCurrentlyDrawn ? 'rgba(234,4,78,0.5)' : 'var(--border-sheet)'}; border-radius:4px; padding:3px 5px;">
                  <div style="display:flex; align-items:center; gap:4px; min-width:0; flex:1; overflow:hidden;">
                    <span style="display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:${p.vertical.bg}; border:1px solid ${p.vertical.color}; flex-shrink:0;">
                      <span style="display:inline-flex; transform:scale(0.65);">${p.vertical.svg}</span>
                    </span>
                    <span style="font-size:8.5px; font-weight:700; color:var(--text-sheet-title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${cleanName}">

                      ${p.isPrincipal ? '<b style="color:var(--brand-red); font-size:7px; margin-left:2px;">(Principal)</b>' : ''}
                    </span>
                  </div>
                  <div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">
                    <span style="font-size:8px; font-weight:700; color:var(--text-sheet-muted); font-family:'JetBrains Mono',monospace;">
                      ${p.orders ? p.orders.toLocaleString('es-AR') + ' órd.' : '—'}
                    </span>
                    ${isCurrentlyDrawn ? `
                      <span style="font-size:7.5px; font-weight:800; color:#10b981; background:rgba(16,185,129,0.12); padding:1px 4px; border-radius:3px; border:1px solid rgba(16,185,129,0.35); display:inline-flex; align-items:center; gap:2px;">
                        <span>En Mapa</span>
                      </span>
                    ` : (p.id ? `
                      <button type="button" onclick="event.stopPropagation(); selectPartnerForWarehouse('${w.warehouse_id}', '${p.id}', '${p.name.replace(/'/g, "\\'")}')" 
                              title="Ver el shape de este partner en el mapa" 
                              style="cursor:pointer; border:1px solid rgba(234,4,78,0.35); background:rgba(234,4,78,0.08); color:var(--brand-red); font-size:7.5px; font-weight:800; padding:1px 4px; border-radius:3px; display:inline-flex; align-items:center; gap:2px; font-family:'Outfit',sans-serif;">
                        Ver Shape
                      </button>
                    ` : '')}
                  </div>
                </div>
              `;}).join('') : `
                <div style="font-size:9px; color:var(--text-sheet-muted); padding:4px; text-align:center; font-style:italic; background:var(--bg-sheet-bar); border-radius:4px; border:1px dashed var(--border-sheet);">

    }

    currentDetailWarehouseId = currentDetailWarehouseId || null;

    function showWarehouseDetailInfoWindow(w, position) {
      if (!map || !w) return;
      if (hoverInfoWindow) hoverInfoWindow.close();
      currentDetailWarehouseId = String(w.warehouse_id).trim();
      activeInfoWindowVerticalKey = null;
      if (!currentDetailInfoWindow) {
        currentDetailInfoWindow = new google.maps.InfoWindow();
        currentDetailInfoWindow.addListener('closeclick', () => {
          currentDetailWarehouseId = null;
        });
      }
      currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, null));
      currentDetailInfoWindow.setPosition(position || { lat: Number(w.lat), lng: Number(w.lng) });
      currentDetailInfoWindow.open(map);

      // Disparar carga inmediata de clima para este almacén si no estaba cargado
      const activeDate = getCurrentActiveMonth();
      if (!WHS_WEATHER_BY_DATE[activeDate] || !WHS_WEATHER_BY_DATE[activeDate][w.warehouse_id]) {
        fetchWeatherDirectFromClient([
          { wh: w.warehouse_id, lat: Number(w.lat), lng: Number(w.lng) }
        ], activeDate);
      }
    }

    function getRingInfoAtPosition(w, latLng) {
      if (!w || !latLng) return null;
      let wLat = Number(w.lat);
      let wLng = Number(w.lng);
      if (isNaN(wLat) || isNaN(wLng) || wLat === 0) {
        if (w.centroid_lat && w.centroid_lng) {
          wLat = Number(w.centroid_lat);
          wLng = Number(w.centroid_lng);
        }
      }
      if (isNaN(wLat) || isNaN(wLng)) return null;

      const storeLatLng = new google.maps.LatLng(wLat, wLng);
      let distMeters = 0;
      if (google.maps.geometry && google.maps.geometry.spherical) {
        distMeters = google.maps.geometry.spherical.computeDistanceBetween(latLng, storeLatLng);
      } else {
        const dLat = (latLng.lat() - wLat) * (Math.PI / 180);
        const dLng = (latLng.lng() - wLng) * (Math.PI / 180);
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(wLat * Math.PI / 180) * Math.cos(latLng.lat() * Math.PI / 180) *
                  Math.sin(dLng / 2) * Math.sin(dLng / 2);
        distMeters = 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      const distKm = distMeters / 1000;

      if (distKm <= 1.0) {
        return { label: '< 1 KM', distKm, color: '#ea044e', bg: 'rgba(234,4,78,0.14)' };
      } else if (distKm <= 2.0) {
        return { label: '1 - 2 KM', distKm, color: '#f97316', bg: 'rgba(249,115,22,0.14)' };
      } else if (distKm <= 3.0) {
        return { label: '2 - 3 KM', distKm, color: '#f59e0b', bg: 'rgba(245,158,11,0.14)' };
      } else if (distKm <= 4.0) {
        return { label: '3 - 4 KM', distKm, color: '#10b981', bg: 'rgba(16,185,129,0.14)' };
      } else if (distKm <= 5.0) {
        return { label: '4 - 5 KM', distKm, color: '#6366f1', bg: 'rgba(99,102,241,0.14)' };
      } else {
        return { label: '> 5 KM', distKm, color: '#94a3b8', bg: 'rgba(148,163,184,0.14)' };
      }
    }

    function buildHoverCardHtml(w, latLng, isInsideCoverage = true, activePartnerObj = null) {
      const currentTheme = getAppCurrentTheme();
      const isDark = currentTheme === 'dark';
      const cardBg = isDark ? '#0f172a' : '#ffffff';
      const cardText = isDark ? '#ffffff' : '#0f172a';
      const cardMuted = isDark ? '#94a3b8' : '#64748b';
      const cardBorder = isDark ? 'rgba(255,255,255,0.16)' : '#cbd5e1';
      const cardInnerBg = isDark ? 'rgba(30,41,59,0.7)' : '#f8fafc';
      const cardInnerBorder = isDark ? 'rgba(255,255,255,0.06)' : '#e2e8f0';
      const cardShadow = isDark ? '0 14px 35px rgba(0,0,0,0.6)' : '0 10px 25px rgba(0,0,0,0.15)';

      const types = getEnabledPartnerTypes(w);
      const isStoreActive = isWarehouseActiveInMonth(w);
      const ring = isInsideCoverage ? getRingInfoAtPosition(w, latLng) : null;

      // Si se está dibujando un partner específico (no el principal por defecto)
      if (activePartnerObj) {
        const vDef = classifyPartnerVertical(activePartnerObj.partner_name || activePartnerObj.business_type);
        const pOrders = activePartnerObj.monthly_orders !== undefined ? Number(activePartnerObj.monthly_orders) : null;
        return `
          <div class="dark-hover-card" style="font-family:'Outfit',system-ui,sans-serif; padding:8px 11px; min-width:225px; max-width:280px; background:${cardBg}; color:${cardText}; border-radius:10px; box-shadow:${cardShadow}; border:1px solid ${cardBorder}; pointer-events:none;">
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:3px;">
              <div style="display:flex; align-items:center; gap:5px; min-width:0; flex:1;">
                ${getCountryFlagImg(w)}
                <span style="font-weight:800; font-size:12px; color:${cardText}; line-height:1.2; word-break:break-word;">${w.warehouse_name}</span>
              </div>
              <span style="font-size:8px; font-weight:800; color:${vDef.color}; background:${vDef.bg}; border:1px solid ${vDef.color}; padding:1px 5px; border-radius:99px; text-transform:uppercase;">
                ${vDef.label}
              </span>
            </div>

            <!-- Nombre del Partner seleccionado -->
            <div style="display:flex; align-items:center; gap:5px; margin-bottom:5px; background:${cardInnerBg}; padding:3px 6px; border-radius:6px; border:1px solid ${cardInnerBorder};">
              <span style="display:inline-flex; align-items:center; transform:scale(0.85);">${vDef.svg}</span>
              <div style="min-width:0; flex:1;">
                <div style="font-size:11.5px; font-weight:800; color:${vDef.color};">${activePartnerObj.partner_name}</div>
                <div style="font-size:8.5px; color:${cardMuted};">Shape de Partner Seleccionado</div>
              </div>
            </div>

            <!-- Métricas de este Partner -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px; background:${cardInnerBg}; padding:4px 8px; border-radius:6px; border:1px solid ${cardInnerBorder};">
              <div>
                <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Área Partner</div>
                <div style="font-size:12px; font-weight:800; color:${vDef.color}; font-family:'JetBrains Mono',monospace;">
                  ${activePartnerObj.coverage_area_km2 ? activePartnerObj.coverage_area_km2 + ' km²' : '—'}
                </div>
              </div>
              <div>
                <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Órdenes / Mes</div>
                <div style="font-size:12px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                  ${pOrders !== null ? pOrders.toLocaleString('es-AR') : '—'}
                </div>
              </div>
            </div>

            ${ring ? `
              <div style="margin-top:5px; padding-top:4px; border-top:1px solid ${cardInnerBorder}; display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <span style="font-size:8.5px; font-weight:700; color:${cardMuted}; text-transform:uppercase;">Radio / Anillo:</span>
                <span style="font-size:9px; font-weight:800; color:${ring.color}; background:${ring.bg}; border:1px solid ${ring.color}; padding:1px 6px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace;">
                  <span style="width:5px; height:5px; border-radius:50%; background:${ring.color}; display:inline-block;"></span>
                  ${ring.label} (${ring.distKm.toFixed(2)} km)
                </span>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Por defecto: Cobertura del Partner con más órdenes (Principal)
      return `
        <div class="dark-hover-card" style="font-family:'Outfit',system-ui,sans-serif; padding:8px 11px; min-width:220px; max-width:275px; background:${cardBg}; color:${cardText}; border-radius:10px; box-shadow:${cardShadow}; border:1px solid ${cardBorder}; pointer-events:none;">
          <!-- Cabecera: Bandera, Nombre y Badge Estado -->
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px;">
            <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1;">
              ${getCountryFlagImg(w)}
              <span style="font-weight:800; font-size:12px; color:${cardText}; line-height:1.2; word-break:break-word;">${w.warehouse_name}</span>
            </div>
            <span style="font-size:8.5px; font-weight:800; color:${isStoreActive ? '#10b981' : '#64748b'}; background:${isStoreActive ? 'rgba(16,185,129,0.14)' : 'rgba(100,116,139,0.14)'}; border:1px solid ${isStoreActive ? 'rgba(16,185,129,0.3)' : 'rgba(100,116,139,0.3)'}; padding:1px 5px; border-radius:99px; white-space:nowrap; display:inline-flex; align-items:center; gap:3px;">
              <span style="width:4px; height:4px; border-radius:50%; background:${isStoreActive ? '#10b981' : '#64748b'}; display:inline-block;"></span> ${isStoreActive ? 'Activo' : 'Inactivo'}
            </span>
          </div>

          <!-- Ubicación -->
          <div style="font-size:10px; color:${cardMuted}; font-weight:500; margin-bottom:4px;">
            ${w.neighborhood || w.city} • ${w.country}
          </div>

          <!-- Fila de Clima / Lluvias en Hover -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; padding:2px 5px; background:${cardInnerBg}; border-radius:4px; border:1px solid ${cardInnerBorder}; font-size:9.5px;">
            <span style="font-size:8.5px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Clima:</span>
            <div class="whs-rain-slot" data-wh="${w.warehouse_id}">
              ${buildRainBadgeHtml(WHS_WEATHER_BY_DATE[getCurrentActiveMonth()] && WHS_WEATHER_BY_DATE[getCurrentActiveMonth()][w.warehouse_id])}
            </div>
          </div>

          <!-- Micro Métricas -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:5px; background:${cardInnerBg}; padding:4px 8px; border-radius:6px; border:1px solid ${cardInnerBorder};">
            <div>
              <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Cobertura Principal</div>
              <div style="font-size:12px; font-weight:800; color:#ea044e; font-family:'JetBrains Mono',monospace;">
                ${w.coverage_area_km2 ? w.coverage_area_km2 + ' km²' : '—'}
              </div>
            </div>
            <div>
              <div style="font-size:8px; color:${cardMuted}; text-transform:uppercase; font-weight:700;">Órdenes / Mes</div>
              <div style="font-size:12px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                ${w.orders ? w.orders.toLocaleString('es-AR') : '—'}
              </div>
            </div>
          </div>

          <!-- Bloque de Audiencia y Usuarios: PeYa Users, Covered y Dmart MAUs -->
          ${(() => {
            const hPeya = Number(w.peya_users) || Number(w.users) || 0;
            const hCov = Number(w.covered_maus) || 0;
            const hDmart = Number(w.dmart_users) || 0;
            return `
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:3px; text-align:center; margin-bottom:5px;">
                <div style="background:rgba(2,132,199,0.08); border:1px solid rgba(2,132,199,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#0284c7; text-transform:uppercase;">PeYa Users</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hPeya ? hPeya.toLocaleString('es-AR') : '—'}
                  </div>
                </div>
                <div style="background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#7c3aed; text-transform:uppercase;">Covered</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hCov ? hCov.toLocaleString('es-AR') : '—'}

                </div>
                <div style="background:rgba(234,4,78,0.08); border:1px solid rgba(234,4,78,0.22); border-radius:4px; padding:2px;">
                  <div style="font-size:7px; font-weight:700; color:#ea044e; text-transform:uppercase;">Dmart MAUs</div>
                  <div style="font-size:10px; font-weight:800; color:${cardText}; font-family:'JetBrains Mono',monospace;">
                    ${hDmart ? hDmart.toLocaleString('es-AR') : '—'}
                  </div>
                </div>
              </div>
            `;
          })()}

          <!-- Tabla Vertical: Comportamiento por Residencia (Viven en Cobertura vs Fuera de Zona) -->
          ${(() => {
            const totOrd = Number(w.orders) || 0;
            const totDmartUsers = Number(w.dmart_users) || 0;

            const inOrders = Number(w.in_zone_orders) || 0;
            const outOrders = Number(w.out_zone_orders) || 0;
            const inUsers = Number(w.in_zone_users) || 0;
            const outUsers = Number(w.out_zone_users) || 0;

            const hasRes = (inOrders > 0 || outOrders > 0 || inUsers > 0 || outUsers > 0);
            const inOrdersPct = (hasRes && totOrd > 0 && inOrders > 0) ? ((inOrders / totOrd) * 100).toFixed(1) : '—';
            const outOrdersPct = (hasRes && totOrd > 0 && outOrders > 0) ? ((outOrders / totOrd) * 100).toFixed(1) : '—';

            return `
              <div style="background:${cardInnerBg}; border:1px solid ${cardInnerBorder}; border-radius:6px; padding:4px 6px; margin-bottom:5px;">
                <div style="font-size:7.5px; font-weight:800; color:${cardMuted}; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px; display:flex; justify-content:space-between;">
                  <span>Perfil Residencia Clientes</span>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:9.5px; font-family:'Outfit',sans-serif;">
                  <thead>
                    <tr style="border-bottom:1px solid ${cardInnerBorder}; font-size:7px; text-transform:uppercase; color:${cardMuted};">
                      <th style="text-align:left; padding:1px 2px; font-weight:800;">Comportamiento</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">Users</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">Órdenes</th>
                      <th style="text-align:right; padding:1px 2px; font-weight:800;">% Mix</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom:1px dashed rgba(255,255,255,0.06);">
                      <td style="padding:2px 2px; font-weight:700; color:#10b981; white-space:nowrap;">
                        <span style="display:inline-block; width:4px; height:4px; border-radius:50%; background:#10b981; margin-right:2px;"></span>
                        En Cobertura
                      </td>
                      <td style="text-align:right; padding:2px 2px; font-family:'JetBrains Mono',monospace; font-weight:800; color:${cardText};">
                        ${inUsers ? inUsers.toLocaleString('es-AR') : '—'}
                      </td>

    function isPointInsideWarehouseCoverage(w, latLng) {
      if (!w || !latLng) return false;
      const whId = String(w.warehouse_id).trim();
      const entry = activePolygonsMap.get(whId);
      if (entry && entry.polygon && typeof google !== 'undefined' && google.maps && google.maps.geometry && google.maps.geometry.poly) {
        return google.maps.geometry.poly.containsLocation(latLng, entry.polygon);
      }
      const curMonth = document.getElementById('filter-month').value || '2026-09-01';
      const pData = CLIENT_MEMORY_CACHE.polygons.get(`${whId}__${curMonth}`);
      if (pData && pData.geojson && typeof turf !== 'undefined') {
        try {
          const lat = typeof latLng.lat === 'function' ? latLng.lat() : latLng.lat;
          const lng = typeof latLng.lng === 'function' ? latLng.lng() : latLng.lng;
          const pt = turf.point([lng, lat]);
          return turf.booleanPointInPolygon(pt, pData.geojson);
        } catch (e) {}
      }
      return false;
    }

    function getRingDataForStore(whId, ringLabel) {
      const normId = String(whId).trim();
      if (allRingsData && allRingsData.length > 0) {
        const found = allRingsData.find(r => String(r.warehouse_id).trim() === normId && (r.anillo === ringLabel || (r.anillo && r.anillo.trim().toLowerCase() === ringLabel.trim().toLowerCase())));
        if (found) return Object.assign({}, found, { isExact: true });
      }
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
      if (w) {
        const generated = generateFallbackRingsForStore(w);
        const match = generated.find(r => r.anillo === ringLabel || (r.anillo && r.anillo.trim().toLowerCase() === ringLabel.trim().toLowerCase()));
        if (match) return Object.assign({}, match, { isHistoricalEstimate: true });
      }
      return null;
    }

    function showHoverCardForRing(w, ringLabel, ringColor, latLng, sector = null) {
      if (!map || !w) return;

      const strokeCol = ringColor || '#ea044e';

        String(r.warehouse_id).trim() === String(w.warehouse_id).trim() &&

      const ringUsersFromQuads = allCardinalRowsInRing.reduce((sum, r) => sum + Number(r.covered_maus || 0), 0);
      const ringDmartFromQuads = allCardinalRowsInRing.reduce((sum, r) => sum + Number(r.dmart_maus || r.dmart_maus_covered || 0), 0);
      const ringOrdersFromQuads = allCardinalRowsInRing.reduce((sum, r) => sum + Number(r.orders || r.dmart_orders || 0), 0);

      const ringUsers = ringUsersFromQuads > 0 ? ringUsersFromQuads : Number(ringData?.covered_maus || ringData?.peya_users || 0);
      const ringDmart = ringDmartFromQuads > 0 ? ringDmartFromQuads : Number(ringData?.dmart_maus_covered || ringData?.dmart_maus || 0);
      const ringOrders = ringOrdersFromQuads > 0 ? ringOrdersFromQuads : Number(ringData?.dmart_orders || ringData?.orders || 0);
      const ringPen = ringUsers > 0 ? ((ringDmart / ringUsers) * 100).toFixed(1) : (ringData?.penetration_pct ? Number(ringData.penetration_pct).toFixed(1) : '—');
      const aov = ringData?.aov ? Number(ringData.aov).toFixed(1) : '—';
      const dt = (ringData?.avg_dt_min || ringData?.avg_dt) ? Number(ringData.avg_dt_min || ringData.avg_dt).toFixed(1) : '—';

      // ── DIVISIÓN 2 (MEDIA): EJE CARDINAL (NORTE / SUR / ESTE / OESTE) ──
      const cardinalKey = (sector && (sector.cardinalKey || sector.key)) || 'N';
      const cardinalName = (sector && (sector.cardinalName || sector.name)) || 'Norte';

      const cardinalRow = (allRingsData || []).find(r => 
        String(r.warehouse_id).trim() === String(w.warehouse_id).trim() && 
        (r.ringBase === ringLabel || r.anillo === ringLabel) && 
        (r.sectorKey === cardinalKey || r.cuadrante_key === cardinalKey || (r.cuadrante && r.cuadrante.toLowerCase().includes(cardinalName.toLowerCase())))
      );

      const cardUsers = cardinalRow ? Number(cardinalRow.covered_maus || 0) : 0;
      const cardDmart = cardinalRow ? Number(cardinalRow.dmart_maus || cardinalRow.dmart_maus_covered || 0) : 0;
      const cardOrders = cardinalRow ? Number(cardinalRow.orders || cardinalRow.dmart_orders || 0) : 0;
      const cardPen = cardinalRow ? Number(cardinalRow.penetration_pct || 0).toFixed(1) : (cardUsers > 0 ? ((cardDmart / cardUsers) * 100).toFixed(1) : '—');
      const cardMixRingPct = (ringOrders > 0 && cardOrders > 0) ? ((cardOrders / ringOrders) * 100).toFixed(1) : '—';

      // ── DIVISIÓN 3 (INFERIOR): SUBDIVISIÓN (EL CARDINAL CORTADO EN DOS) ──
      const subKey = (sector && sector.subKey) || (sector && sector.key) || 'N1';
      const subName = (sector && sector.name) || `${cardinalName} (Mitad)`;

      let subUsers = 0;
      let subDmart = 0;
      let subOrders = 0;
      let matchCount = 0;

      if (window.RAW_REAL_BQ_POINTS && Array.isArray(window.RAW_REAL_BQ_POINTS) && window.RAW_REAL_BQ_POINTS.length > 0 && sector) {
        const RING_LABELS = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];
        const rIdx = RING_LABELS.indexOf(ringLabel);
        const radiusM = (rIdx >= 0) ? RING_RADII_METERS[rIdx] : 2000;
        const innerM = (rIdx > 0) ? RING_RADII_METERS[rIdx - 1] : 0;
        const radiusKm = radiusM / 1000;
        const innerKm = innerM / 1000;
        const pos = getWarehousePosition(w);

        if (pos) {
          window.RAW_REAL_BQ_POINTS.forEach(pt => {
            const pLat = Number(pt.lat);
            const pLng = Number(pt.lng);
            if (isNaN(pLat) || isNaN(pLng)) return;
            const d = getDistanceKm(pos.lat, pos.lng, pLat, pLng);
            if (d >= innerKm && d < radiusKm) {
              const b = getBearing(pos.lat, pos.lng, pLat, pLng);
              if (isAngleInSector(b, sector.startDeg, sector.endDeg)) {
                subUsers += Number(pt.peya_users || 1);
                subDmart += Number(pt.dmart_users || 0);
                subOrders += Number(pt.dmart_orders || 0);
                matchCount++;
              }
            }
          });
        }
      }

      if (matchCount === 0) {
        const weight = (sector && sector.urbanWeight) ? sector.urbanWeight : 0.50;
        subUsers = Math.max(1, Math.round(cardUsers * weight));
        subDmart = Math.max(1, Math.round(cardDmart * weight));
        subOrders = Math.max(1, Math.round(cardOrders * weight));

      const subPen = subUsers > 0 ? ((subDmart / subUsers) * 100).toFixed(1) : '0.0';

          : `<span style="font-size:7.5px; font-weight:800; color:#10b981; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); border-radius:3px; padding:1px 4px; text-transform:uppercase;">Censo BQ</span>`);

          <div style="font-size:12px; font-weight:800; color:${cardTitleCol}; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">

          </div>

          <!-- Matriz Compacta con Columnas Espaciadas y Legibles -->

            <thead>
              <tr style="border-bottom:1px solid ${cardDividerCol}; color:${cardMutedCol}; font-size:7.5px; text-transform:uppercase;">
                <th style="text-align:left; padding:2px 0; width:88px;">Nivel</th>

                <td style="padding:3px 0; color:#d97706; font-weight:700;">1. Anillo 360°</td>
                <td style="text-align:right; padding:3px 6px;">${ringUsers.toLocaleString('es-AR')}</td>

    function showHoverCardForWarehouse(w, latLng, isInsideCoverage = true, activePartnerObj = null) {
      // REGLA ESTRICTA: Si el cursor no está dentro del polígono de cobertura (ej. zona gris de anillos), jamás activar
      if (!isInsideCoverage || !isPointInsideWarehouseCoverage(w, latLng)) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }

      // Si los anillos concéntricos están activos, cambiar la ventana de hover a la ventana de anillo de inmediato
      if (isRingsVisible) {
        const pos = getWarehousePosition(w);
        const wLat = pos ? pos.lat : Number(w.lat);
        const wLng = pos ? pos.lng : Number(w.lng);
        let distKm = 0;
        const latVal = typeof latLng.lat === 'function' ? latLng.lat() : latLng.lat;
        const lngVal = typeof latLng.lng === 'function' ? latLng.lng() : latLng.lng;
        if (typeof google !== 'undefined' && google.maps && google.maps.geometry && google.maps.geometry.spherical) {
          const dMeters = google.maps.geometry.spherical.computeDistanceBetween(
            new google.maps.LatLng(wLat, wLng),
            latLng
          );
          distKm = dMeters / 1000;
        } else {
          const dLat = (latVal - wLat) * Math.PI / 180;
          const dLng = (lngVal - wLng) * Math.PI / 180;
          const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(wLat * Math.PI / 180) * Math.cos(latVal * Math.PI / 180) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          distKm = 6371 * c;
        }

        let ringIdx = 0;
        if (distKm < 1.0) ringIdx = 0;
        else if (distKm < 2.0) ringIdx = 1;
        else if (distKm < 3.0) ringIdx = 2;
        else if (distKm < 4.0) ringIdx = 3;
        else ringIdx = 4;

        const ringLabel = RING_LABELS[ringIdx] || `${ringIdx + 1} KM`;
        const ringColor = RING_COLORS[ringIdx % RING_COLORS.length] || '#ea044e';

        showHoverCardForRing(w, ringLabel, ringColor, latLng);
        return;
      }

      // Si la ventana permanente de detalle está abierta para este WHS, no pisarla con el hover del warehouse genérico
      if (currentDetailWarehouseId && String(w.warehouse_id).trim() === currentDetailWarehouseId) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }
      if (currentDetailInfoWindow && currentDetailInfoWindow.getMap()) {
        if (hoverInfoWindow) hoverInfoWindow.close();
        return;
      }

      if (!hoverInfoWindow) {
        hoverInfoWindow = new google.maps.InfoWindow({
          disableAutoPan: true,
          headerDisabled: true,
          pixelOffset: new google.maps.Size(0, -32)
        });
        hoverInfoWindow.addListener('domready', () => {
          const darkCard = document.querySelector('.dark-hover-card');
          if (darkCard) {
            const iwContainer = darkCard.closest('.gm-style-iw-c');
            if (iwContainer) {
              iwContainer.style.background = 'transparent';
              iwContainer.style.backgroundColor = 'transparent';
              iwContainer.style.boxShadow = 'none';
              iwContainer.style.padding = '0';
              iwContainer.style.border = 'none';
              const closeBtn = iwContainer.querySelector('.gm-ui-hover-effect');
              if (closeBtn) closeBtn.style.display = 'none';
              const arrow = iwContainer.parentElement && iwContainer.parentElement.querySelector('.gm-style-iw-tc');
              if (arrow) arrow.style.display = 'none';
            }
          }
        });
      } else {
        hoverInfoWindow.setOptions({ pixelOffset: new google.maps.Size(0, -32) });
      }

      hoverInfoWindow.setContent(buildHoverCardHtml(w, latLng, true, activePartnerObj));
      hoverInfoWindow.setPosition(latLng);
      hoverInfoWindow.open(map);
    }

    function bindPolygonEvents(polygon, w, activePartnerObj = null) {
      if (!polygon || !w) return;

      const baseStroke = polygon.strokeColor || '#ea044e';
      const baseFill = polygon.fillColor || '#ea044e';
      const baseWeight = polygon.strokeWeight || 2.2;
      const baseOpacity = polygon.fillOpacity || 0.16;

      polygon.addListener('mouseover', (e) => {
        if (!isRingsVisible) {
          polygon.setOptions({
            strokeWeight: baseWeight + 1.2,
            strokeColor: '#ffffff',
            fillOpacity: 0.32
          });
        }
        showHoverCardForWarehouse(w, e.latLng, true, activePartnerObj);
      });

      polygon.addListener('mousemove', (e) => {
        showHoverCardForWarehouse(w, e.latLng, true, activePartnerObj);
      });

      polygon.addListener('mouseout', () => {
        polygon.setOptions({
          strokeWeight: baseWeight,
          strokeColor: baseStroke,
          fillOpacity: isRingsVisible ? 0.03 : baseOpacity
        });
        if (hoverInfoWindow) hoverInfoWindow.close();
      });

      polygon.addListener('click', (e) => {
        if (hoverInfoWindow) hoverInfoWindow.close();
        showWarehouseDetailInfoWindow(w, e.latLng);
      });
    }

            </span>

    function buildRainBadgeHtml(wData) {
      if (wData === null || wData === undefined) {
        return `
          <span style="display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:600; color:var(--text-sheet-muted); opacity:0.8;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
            <span>Clima: —</span>
          </span>
        `;
      }
      if (typeof wData === 'number' || typeof wData === 'string') {
        const num = parseFloat(wData);
        if (num >= 0.1) {
          return `
            <span style="display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:700; color:#0284c7; background:rgba(2,132,199,0.12); border:1px solid rgba(2,132,199,0.3); padding:1px 5px; border-radius:4px;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="8" y1="13" x2="8" y2="15"></line></svg>
              <span>Lluvia: ${num.toFixed(1)} mm</span>
            </span>
          `;
        }
        return `
          <span style="display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:600; color:var(--text-sheet-muted); opacity:0.85;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
            <span>Clima: Seco</span>
          </span>
        `;
      }

      // Si es objeto mensual enriquecido de Open-Meteo
      const temp = (wData.avgTemp !== undefined && !isNaN(wData.avgTemp)) ? `${Math.round(wData.avgTemp)}°C` : '';
      const days = (wData.rainDays !== undefined && !isNaN(wData.rainDays)) ? `${wData.rainDays}d lluvia` : '';
      const mm = (wData.totalMm !== undefined && !isNaN(wData.totalMm)) ? `${wData.totalMm} mm` : '';
      const label = wData.climaLabel || (wData.rainDays >= 3 ? 'Lluvioso' : 'Seco / Templado');
      const isRainy = (Number(wData.rainDays) >= 2 || Number(wData.totalMm) >= 20);

      const titleTooltip = `Clima mensual promedio: ${temp ? temp + ' • ' : ''}${days ? days + ' (' + mm + ') • ' : ''}${label}`;

      return `
        <span style="display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:700; ${isRainy ? 'color:#0284c7; background:rgba(2,132,199,0.12); border:1px solid rgba(2,132,199,0.3);' : 'color:var(--text-sheet-body); background:var(--bg-sheet-bar); border:1px solid var(--border-sheet);'} padding:1px 6px; border-radius:4px;" title="${titleTooltip}">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;">
            ${isRainy 
              ? '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="8" y1="13" x2="8" y2="15"></line><line x1="16" y1="19" x2="16" y2="21"></line><line x1="16" y1="13" x2="16" y2="15"></line>' 
              : '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>'}
          </svg>
          <span style="white-space:nowrap;">${temp ? temp + ' • ' : ''}${days ? days : label}</span>
        </span>
      `;
    }

    function updateWeatherBadgesInDOM(activeDate) {
      if (!WHS_WEATHER_BY_DATE[activeDate]) return;
      document.querySelectorAll('.whs-rain-slot').forEach(el => {

    async function fetchWeatherDirectFromClient(storesWithCoords, activeDate) {
      if (!storesWithCoords || storesWithCoords.length === 0) return {};

      // 1. Restaurar caché de localStorage
      let cachedMonth = {};
      try {
        const stored = localStorage.getItem('mapster_weather_' + activeDate);
        if (stored) cachedMonth = JSON.parse(stored);
      } catch(e) {}

      if (!WHS_WEATHER_BY_DATE[activeDate]) WHS_WEATHER_BY_DATE[activeDate] = {};
      Object.assign(WHS_WEATHER_BY_DATE[activeDate], cachedMonth);

      const pending = storesWithCoords.filter(s => !WHS_WEATHER_BY_DATE[activeDate][s.wh]);
      if (pending.length === 0) {
        updateWeatherBadgesInDOM(activeDate);
        return WHS_WEATHER_BY_DATE[activeDate];
      }

      // 2. Extraer fechas del mes
      const parts = activeDate.split('-');
      const yyyy = parts[0] || '2026';
      const mm = parts[1] || '09';
      const lastDay = new Date(parseInt(yyyy, 10), parseInt(mm, 10), 0).getDate();
      const startDate = yyyy + '-' + mm + '-01';
      const endDate = yyyy + '-' + mm + '-' + String(lastDay).padStart(2, '0');

      // 3. Agrupar por coordenadas (precisión 2 decimales ~1km) para consultar 1 sola vez por cluster urbano
      const clusters = new Map();
      pending.forEach(s => {
        const key = s.lat.toFixed(2) + '_' + s.lng.toFixed(2);
        if (!clusters.has(key)) clusters.set(key, []);
        clusters.get(key).push(s);
      });

      const clusterKeys = Array.from(clusters.keys());
      const batchSize = 10;

      for (let i = 0; i < clusterKeys.length; i += batchSize) {
        const batch = clusterKeys.slice(i, i + batchSize);
        const lats = batch.map(k => k.split('_')[0]).join(',');
        const lngs = batch.map(k => k.split('_')[1]).join(',');

        const endpoint = ['https:', '', 'archive-api.open-meteo.com', 'v1', 'archive'].join('/');
        const queryParams = [
          'latitude=' + lats,
          'longitude=' + lngs,
          'start_date=' + startDate,
          'end_date=' + endDate,
          'daily=precipitation_sum,temperature_2m_mean',
          'timezone=auto'
        ].join('&');
        const url = endpoint + '?' + queryParams;

        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            const resArr = Array.isArray(data) ? data : [data];

            resArr.forEach((itemRes, idx) => {
              const cKey = batch[idx];
              const stList = clusters.get(cKey) || [];

              let totalMm = 0.0;
              let rainDays = 0;
              let avgTemp = 14.5;

              if (itemRes && itemRes.daily) {
                const prec = itemRes.daily.precipitation_sum || [];
                const temps = itemRes.daily.temperature_2m_mean || [];
                totalMm = Math.round(prec.reduce((acc, v) => acc + (v !== null && !isNaN(v) ? Number(v) : 0), 0) * 10) / 10;
                rainDays = prec.filter(v => v !== null && Number(v) >= 1.0).length;
                const validTemps = temps.filter(v => v !== null && !isNaN(v));
                if (validTemps.length > 0) {
                  avgTemp = Math.round((validTemps.reduce((acc, v) => acc + Number(v), 0) / validTemps.length) * 10) / 10;
                }
              }

              let climaLabel = 'Seco / Templado';
              if (rainDays >= 5 || totalMm >= 60) climaLabel = 'Lluvioso';
              else if (rainDays >= 2 || totalMm >= 20) climaLabel = 'Variable';
              else if (avgTemp >= 24) climaLabel = 'Cálido / Seco';
              else if (avgTemp <= 12) climaLabel = 'Frío / Seco';

              const wObj = { totalMm, rainDays, avgTemp, climaLabel };
              stList.forEach(st => {
                WHS_WEATHER_BY_DATE[activeDate][st.wh] = wObj;
              });
            });
          }
        } catch(err) {
          console.warn('[Direct Weather] Error consultando Open-Meteo:', err.message);
        }
      }

      // 4. Fallback regional si la red bloqueó la petición
      pending.forEach(s => {
        if (!WHS_WEATHER_BY_DATE[activeDate][s.wh]) {
          WHS_WEATHER_BY_DATE[activeDate][s.wh] = {
            avgTemp: 14.2,
            rainDays: 4,
            totalMm: 35.0,
            climaLabel: 'Templado / Variable'
          };
        }
      });

      // 5. Guardar en localStorage
      try {
        localStorage.setItem('mapster_weather_' + activeDate, JSON.stringify(WHS_WEATHER_BY_DATE[activeDate]));
      } catch(e) {}

      updateWeatherBadgesInDOM(activeDate);
      return WHS_WEATHER_BY_DATE[activeDate];
    }

    async function triggerDeferredWeatherLoad() {
      const activeDate = getCurrentActiveMonth();
      const slots = document.querySelectorAll('.whs-rain-slot');
      const pendingWhs = [];

      slots.forEach(el => {
        const wh = el.getAttribute('data-wh');
        if (!wh) return;
        const cached = WHS_WEATHER_BY_DATE[activeDate] && WHS_WEATHER_BY_DATE[activeDate][wh];
        if (cached !== undefined) {
          el.innerHTML = buildRainBadgeHtml(cached);
        } else if (!pendingWhs.includes(wh)) {
          pendingWhs.push(wh);
        }
      });

      const pendingStoresWithCoords = pendingWhs.map(id => {
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
        return {
          wh: id,
          lat: (w && w.lat !== null && !isNaN(w.lat)) ? Number(w.lat) : null,
          lng: (w && w.lng !== null && !isNaN(w.lng)) ? Number(w.lng) : null
        };
      }).filter(s => s.lat !== null && s.lng !== null);

      if (pendingStoresWithCoords.length === 0 || DEFERRED_WEATHER_IN_FLIGHT) return;
      DEFERRED_WEATHER_IN_FLIGHT = true;

      window.logLiveDebug(`[Weather] Solicitando clima en vivo para ${pendingStoresWithCoords.length} almacenes...`);

      try {
        const resMap = await fetchWeatherDirectFromClient(pendingStoresWithCoords, activeDate);
        DEFERRED_WEATHER_IN_FLIGHT = false;
        const count = Object.keys(resMap).length;
        const rainCount = Object.values(resMap).filter(w => (w.rainDays && w.rainDays >= 1) || parseFloat(w.totalMm || w) >= 0.1).length;
        window.logLiveDebug(`[Weather OK] Clima recibido para ${count} tiendas (${rainCount} con lluvia activa)`, 'success');
      } catch(err) {
        DEFERRED_WEATHER_IN_FLIGHT = false;
        window.logLiveDebug(`[Weather Error] Error al cargar clima: ${err.message}`, 'error');
      }
    }

    function getCurrentlyFilteredWarehouses() {
      const countryEl = document.getElementById('filter-country');
      const cityEl = document.getElementById('filter-city');
      const neighborhoodEl = document.getElementById('filter-neighborhood');
      const searchEl = document.getElementById('whs-search-input');

      const country = countryEl ? countryEl.value : '';
      const city = cityEl ? cityEl.value : '';
      const neighborhood = neighborhoodEl ? neighborhoodEl.value : '';
      const search = (searchEl && searchEl.value ? searchEl.value : '').toLowerCase().trim();
      const bounds = (isViewportFilterActive && map && typeof map.getBounds === 'function') ? map.getBounds() : null;

      return allWarehouses.filter(w => {
        const cLower = (w.country || '').toLowerCase().trim();
        if (cLower === 'desconocido' || cLower === 'costa rica' || cLower === 'cr') return false;

        // Si el usuario escribe una búsqueda, buscar globalmente por nombre, ID, ciudad, barrio o país
        if (search) {
          const name = (w.warehouse_name || '').toLowerCase();
          const id = String(w.warehouse_id || '').toLowerCase();
          const wCity = (w.city || '').toLowerCase();
          const wNeigh = (w.neighborhood || '').toLowerCase();
          const wCountry = (w.country || '').toLowerCase();
          if (!name.includes(search) && !id.includes(search) && !wCity.includes(search) && !wNeigh.includes(search) && !wCountry.includes(search)) {
            return false;
          }
        } else {
          if (country && w.country !== country) return false;
          if (city && w.city !== city) return false;
          if (neighborhood && w.neighborhood !== neighborhood) return false;
        }
        
        // Filtro por estado activo / inactivo en el mes seleccionado
        const isStoreActive = isWarehouseActiveInMonth(w);
        if (selectedStatusFilter === 'ACTIVE' && !isStoreActive) return false;
        if (selectedStatusFilter === 'INACTIVE' && isStoreActive) return false;

        if (selectedPartnerFilter !== 'ALL') {
          const enabledTypes = getEnabledPartnerTypes(w);
          if (!enabledTypes.some(t => t.key === selectedPartnerFilter)) return false;
        }

        // Filtro por Lluvias (>= 0.1 mm)
        if (typeof FILTER_ONLY_RAIN !== 'undefined' && FILTER_ONLY_RAIN) {
          const activeDate = getCurrentActiveMonth();
          const whRain = (typeof WHS_WEATHER_BY_DATE !== 'undefined' && WHS_WEATHER_BY_DATE[activeDate] && WHS_WEATHER_BY_DATE[activeDate][w.warehouse_id]);
          if (whRain === undefined || whRain === null || parseFloat(whRain) < 0.1) {
            return false;
          }
        }

        return true;
      });
    }

    // ============================================================
    // SELECTOR DE VERTICALES / PARTNERS CON ICONOS (POPOVER SUPERIOR)
    // ============================================================
    function renderPartnerSmartFilterOptions() {
      const menu = document.getElementById('vertical-dropdown-menu');
      if (!menu) return;

      // Obtener almacenes filtrados geográficamente (País, Ciudad, Barrio)
      const countryEl = document.getElementById('filter-country');
      const activeCountry = countryEl ? countryEl.value.trim() : '';
      const cityEl = document.getElementById('filter-city');
      const activeCity = cityEl ? cityEl.value.trim() : '';
      const neighEl = document.getElementById('filter-neighborhood');
      const activeNeigh = neighEl ? neighEl.value.trim() : '';

      const geoFilteredStores = allWarehouses.filter(w => {
        if (activeCountry && w.country !== activeCountry) return false;
        if (activeCity && w.city !== activeCity) return false;
        if (activeNeigh && w.neighborhood !== activeNeigh) return false;
        return true;
      });

      const counts = {};
      PARTNER_TYPE_DEFINITIONS.forEach(def => {
        counts[def.key] = 0;
      });

      geoFilteredStores.forEach(w => {
        const enabled = getEnabledPartnerTypes(w);
        enabled.forEach(t => {
          counts[t.key] = (counts[t.key] || 0) + 1;
        });
      });

      // Si la vertical actualmente seleccionada no existe en este país/filtro, volver a 'ALL'
      if (selectedPartnerFilter !== 'ALL' && (!counts[selectedPartnerFilter] || counts[selectedPartnerFilter] === 0)) {
        selectedPartnerFilter = 'ALL';
      }

      const view = document.getElementById('vertical-selected-view');
      const badge = document.getElementById('partner-filter-badge-label');
      if (!view) return;

      if (selectedPartnerFilter === 'ALL') {
        view.innerHTML = `

            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

        `;
        if (badge) badge.textContent = 'Todas';
      } else {
        const def = PARTNER_TYPE_DEFINITIONS.find(d => d.key === selectedPartnerFilter);
        if (def) {
          view.innerHTML = `
            <span style="display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:${def.bg}; border:1px solid ${def.color}; flex-shrink:0;">

    function selectVerticalOption(val, e) {
      if (e) e.stopPropagation();
      selectedPartnerFilter = val;
      updateVerticalTriggerView();
      toggleVerticalMenu(null, false);

      const def = PARTNER_TYPE_DEFINITIONS.find(d => d.key === val);
      const vLabel = def ? def.label.split(' ')[0] : 'coberturas';

      // Mostrar píldora flotante de cargando shapes inmediatamente en pantalla
      showShapeLoading(true, `Cargando shapes de ${vLabel}...`);

      renderPartnerSmartFilterOptions();
      renderWarehouseCards();

      // Limpiar y remover todos los polígonos previos del mapa para refrescar según la vertical elegida
      activePolygonsMap.forEach((entry, key) => {
        if (entry.polygon) entry.polygon.setMap(null);
        if (entry.ghostPolygon) entry.ghostPolygon.setMap(null);
      });
      activePolygonsMap.clear();

      multiDatePolygonsMap.forEach((entry, key) => {
        if (entry && entry.polygon) {
          entry.polygon.setMap(null);
          google.maps.event.clearInstanceListeners(entry.polygon);
        }
      });
      multiDatePolygonsMap.clear();

      setTimeout(() => {
        const filtered = getCurrentlyFilteredWarehouses();
        if (filtered.length > 0) {
          // Deseleccionar almacenes que no tengan esta vertical disponible
          if (val !== 'ALL') {
            const toDeselect = [];
            selectedWarehouseIds.forEach(id => {
              const w = allWarehouses.find(s => String(s.warehouse_id).trim() === id);
              if (!w || !filtered.some(fw => String(fw.warehouse_id).trim() === id)) {
                toDeselect.push(id);
              }
            });
            toDeselect.forEach(id => selectedWarehouseIds.delete(id));

            if (selectedWarehouseIds.size === 0) {
              selectedWarehouseIds.add(String(filtered[0].warehouse_id).trim());
            }
          }
        }

        updateSelectionAndRefresh();
        showShapeLoading(false);
      }, 150);

      const toastLabel = def ? def.label : 'Todas las verticales';
      showToast(`Filtro de vertical: ${toastLabel}`, 'info');
    }

    function toggleVerticalMenu(e, force) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('vertical-dropdown-menu');
      const btn = document.getElementById('vertical-dropdown-btn');
      const dateMenu = document.getElementById('unified-date-dropdown-menu');
      if (dateMenu) dateMenu.classList.remove('open');

      if (!menu || !btn) return;
      const isOpen = force !== undefined ? force : !menu.classList.contains('open');

      if (isOpen) {
        if (menu.parentElement !== document.body) {
          document.body.appendChild(menu);
        }

        const rect = btn.getBoundingClientRect();
        menu.style.position = 'fixed';
        menu.style.left = `${rect.left}px`;
        menu.style.width = `${Math.max(220, rect.width)}px`;
        menu.style.zIndex = '999999';

        const spaceBelow = window.innerHeight - rect.bottom - 12;
        const spaceAbove = rect.top - 12;
        const maxMenuHeight = 240;

        if (spaceAbove >= 130 || spaceAbove >= spaceBelow) {
          // Desplegar hacia ARRIBA (hacia el mapa, donde siempre hay espacio amplio y limpio)
          menu.style.bottom = `${window.innerHeight - rect.top + 4}px`;
          menu.style.top = 'auto';
          menu.style.maxHeight = `${Math.min(maxMenuHeight, spaceAbove)}px`;
          menu.style.boxShadow = '0 -14px 35px rgba(0, 0, 0, 0.40)';
        } else {
          // Desplegar hacia ABAJO
          menu.style.top = `${rect.bottom + 4}px`;
          menu.style.bottom = 'auto';
          menu.style.maxHeight = `${Math.min(maxMenuHeight, spaceBelow)}px`;
          menu.style.boxShadow = '0 14px 35px rgba(0, 0, 0, 0.40)';
        }

        menu.classList.add('open');
      } else {
        menu.classList.remove('open');
      }
    }

    // ============================================================
    // SUPERPOSICIÓN DE FECHAS EN EL MAPA (POPOVER SUPERIOR)
    // ============================================================
    allAvailableMonths = allAvailableMonths || [];
    activeOverlayMonths = activeOverlayMonths || new Set();
    multiDatePolygonsMap = multiDatePolygonsMap || new Map(); // `${whId}__${monthDate}` -> Polygon
