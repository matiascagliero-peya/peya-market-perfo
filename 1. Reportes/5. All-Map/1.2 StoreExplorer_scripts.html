    function clearGridPolygons() {
      gridPolygons.forEach(p => {
        if (p) {
          p.setMap(null);
          google.maps.event.clearInstanceListeners(p);
        }
      });
      gridPolygons = [];
    }

    function generateBaselineGridFromStoreHistory(w, flatCoords, N, minLat, maxLat, minLng, maxLng) {
      const totOrders = Number(w.orders) || 450;
      const totPeyaMaus = Number(w.peya_users) || Math.round((Number(w.coverage_area_km2) || 15) * 1150);
      const totDmartMaus = Number(w.dmart_users) || Math.round(totOrders * 0.48);
      const baseAfv = Number(w.afv_aov_amount) || 15.4;
      const baseDt = Number(w.avg_delivery_time_min) || 21.0;
      const basePen = Number(w.penetration_pct) || (totPeyaMaus > 0 ? (totDmartMaus / totPeyaMaus) * 100 : 14.2);

      const storePos = getWarehousePosition(w);
      const centerLat = storePos ? storePos.lat : (minLat + maxLat) / 2;
      const centerLng = storePos ? storePos.lng : (minLng + maxLng) / 2;
      const cosLat = Math.cos(centerLat * Math.PI / 180);

      const stepLat = (maxLat - minLat) / N;
      const stepLng = (maxLng - minLng) / N;

      const cells = {};
      let totalWeight = 0;
      const cellWeights = [];

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const cId = `R${r + 1}C${c + 1}`;
          const cellLat = minLat + (r + 0.5) * stepLat;
          const cellLng = minLng + (c + 0.5) * stepLng;

          const dLat = (cellLat - centerLat) * 111.32;
          const dLng = (cellLng - centerLng) * 111.32 * cosLat;
          const distKm = Math.sqrt(dLat * dLat + dLng * dLng);

          // Ponderación gaussiana según cercanía al WHS
          const weight = Math.exp(-Math.pow(distKm / 2.8, 1.8));
          totalWeight += weight;
          cellWeights.push({ id: cId, distKm: distKm, weight: weight });
        }
      }

      cellWeights.forEach(item => {
        const share = item.weight / Math.max(0.001, totalWeight);
        const cellOrders = Math.max(1, Math.round(totOrders * share));
        const cellPeya = Math.max(10, Math.round(totPeyaMaus * share));
        const cellDmart = Math.max(1, Math.round(totDmartMaus * share));
        const cellPen = Number((basePen * (1.35 - (item.distKm * 0.18))).toFixed(1));
        const cellDt = Number((12.2 + item.distKm * 3.3).toFixed(1));
        const cellSeamless = Number(Math.max(56.0, Math.min(94.5, 93.5 - (item.distKm * 5.8))).toFixed(1));
        const cellCpo = Number((1.20 + (cellDt * 0.058)).toFixed(2));
        const cellCpoAfv = Number(((cellCpo / baseAfv) * 100).toFixed(1));

        cells[item.id] = {
          total_users: cellPeya,
          peya_users: cellPeya,
          dmart_users: cellDmart,
          total_orders: cellOrders,
          penetration_pct: cellPen,
          afv: baseAfv.toFixed(2),
          avg_dt: cellDt,
          seamless_pct: cellSeamless,
          plus_users: Math.round(cellPeya * 0.18),
          rider_cpo_dmarts: cellCpo,
          cpo_afv_pct: cellCpoAfv,
          isHistoricalEstimate: true
        };
      });

      return cells;
    }

    function drawGridOnMap() {
      clearGridPolygons();
      currentStoreGridCells = [];
      if (!isGridVisible || !map) return;

      const currentMonth = document.getElementById('filter-month').value || (allAvailableMonths[0] && (allAvailableMonths[0].month_date || allAvailableMonths[0])) || '2026-09-01';

      selectedWarehouseIds.forEach(whId => {
        const normId = String(whId).trim();
        const mapKey = `${normId}__${currentMonth}`;
        const entry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normId);
        if (!entry || !entry.coords) return;

        // Aplanar coordenadas en caso de que sea un MultiPolygon con múltiples anillos
        let flatCoords = [];
        const rawCoords = entry.coords;
        if (Array.isArray(rawCoords)) {
          if (rawCoords.length > 0 && Array.isArray(rawCoords[0])) {
            rawCoords.forEach(ring => {
              if (Array.isArray(ring)) {
                ring.forEach(pt => {
                  if (pt && !isNaN(pt.lat) && !isNaN(pt.lng)) flatCoords.push(pt);
                });
              }
            });
          } else {
            flatCoords = rawCoords.filter(pt => pt && !isNaN(pt.lat) && !isNaN(pt.lng));
          }
        }
        if (flatCoords.length < 3) return;

        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        flatCoords.forEach(pt => {
          if (pt.lat < minLat) minLat = pt.lat;
          if (pt.lat > maxLat) maxLat = pt.lat;
          if (pt.lng < minLng) minLng = pt.lng;
          if (pt.lng > maxLng) maxLng = pt.lng;
        });

        const whsObj = allWarehouses.find(w => String(w.warehouse_id).trim() === normId) || {};

        // Respetar estrictamente la cantidad de divisiones seleccionada por el usuario (sin trabar el select)
        const N = parseInt(gridDivisionCount, 10) || 8;
        const cacheKey = `${normId}__${currentMonth}__${N}`;
        let usersMap = gridUsersDataCache.get(cacheKey) || null;

        // Si todavía no hay datos de BigQuery calculados para esta división exacta, generar la Línea Base Histórica Espacial instantánea
        if (!usersMap) {
          usersMap = generateBaselineGridFromStoreHistory(whsObj, flatCoords, N, minLat, maxLat, minLng, maxLng);
          gridUsersDataCache.set(cacheKey, usersMap);
        }

        const stepLat = (maxLat - minLat) / N;
        const stepLng = (maxLng - minLng) / N;

        // Escala de calor basada estrictamente en PLATFORM MAUS (densidad total de usuarios de la app en la celda)
        let maxPlatformUsers = 0;
        if (usersMap) {
          Object.values(usersMap).forEach(u => {
            if (u) {
              const pu = Number(u.peya_users || u.platform_users || u.total_users || 0);
              if (pu > maxPlatformUsers) maxPlatformUsers = pu;
            }
          });
        }

        // Obtener el feature de cobertura para recortar los cuadrantes estrictamente dentro del shape
        let coverageFeature = null;
        const pData = CLIENT_MEMORY_CACHE.polygons.get(mapKey);
        if (pData && pData.geojson && typeof turf !== 'undefined') {
          try {
            if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
              coverageFeature = turf.cleanCoords(turf.feature(pData.geojson));
            }
          } catch (err) {}
        }

        if (!coverageFeature && flatCoords.length >= 3 && typeof turf !== 'undefined') {
          try {
            const ringCoords = flatCoords.map(pt => [pt.lng, pt.lat]);
            if (ringCoords[0][0] !== ringCoords[ringCoords.length - 1][0] || ringCoords[0][1] !== ringCoords[ringCoords.length - 1][1]) {
              ringCoords.push(ringCoords[0]);
            }
            coverageFeature = turf.polygon([ringCoords]);
          } catch(err) {}
        }

        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            const sLat = minLat + r * stepLat;
            const nLat = minLat + (r + 1) * stepLat;
            const wLng = minLng + c * stepLng;
            const eLng = minLng + (c + 1) * stepLng;

            const cellPath = [
              { lat: sLat, lng: wLng },
              { lat: nLat, lng: wLng },
              { lat: nLat, lng: eLng },
              { lat: sLat, lng: eLng }
            ];

            let clippedPath = null;
            let clippedGeoJson = null;

            if (coverageFeature && typeof turf !== 'undefined') {
              try {
                const cellFeature = turf.polygon([[
                  [wLng, sLat],
                  [wLng, nLat],
                  [eLng, nLat],
                  [eLng, sLat],
                  [wLng, sLat]
                ]]);
                const intersected = turf.intersect(cellFeature, coverageFeature);
                if (intersected && intersected.geometry) {
                  const extracted = extractPolygonCoordinates(intersected.geometry);
                  if (extracted && (Array.isArray(extracted[0]) ? extracted[0].length >= 3 : extracted.length >= 3)) {
                    clippedPath = extracted;
                    clippedGeoJson = intersected.geometry;
                  }
                }
              } catch(e) {}
            }

            // Fallback si Turf no intersecta o está en los límites del shape
            if (!clippedPath) {
              const centerPt = new google.maps.LatLng((sLat + nLat) / 2, (wLng + eLng) / 2);
              let intersects = false;
              if (entry.polygon && google.maps.geometry && google.maps.geometry.poly) {
                intersects = google.maps.geometry.poly.containsLocation(centerPt, entry.polygon);
              }
              if (!intersects) {
                intersects = flatCoords.some(pt => pt.lat >= sLat && pt.lat <= nLat && pt.lng >= wLng && pt.lng <= eLng);
              }
              if (intersects) {
                clippedPath = cellPath;
              }
            }

            // Si el cuadrante está completamente fuera de la cobertura: omitir
            if (!clippedPath) {
              continue;
            }

            const cellCode = `R${r + 1}C${c + 1}`;
            const cellId = cellCode;
            const cellUniqueId = `${normId}__${cellCode}`;
            currentStoreGridCells.push({
              id: cellUniqueId,
              cellCode: cellCode,
              whId: normId,
              minLat: sLat,
              maxLat: nLat,
              minLng: wLng,
              maxLng: eLng,
              geojson: clippedGeoJson
            });

            const cellUserData = usersMap ? (usersMap[cellUniqueId] || usersMap[cellCode]) : null;
            const hasUserData = Boolean(cellUserData && (cellUserData.peya_users !== undefined || cellUserData.total_users !== undefined));
            const platformUsers = hasUserData ? Number(cellUserData.peya_users || cellUserData.platform_users || cellUserData.total_users || 0) : 0;
            const dmartUsers = hasUserData ? Number(cellUserData.dmart_users || 0) : 0;
            const plusUsers = hasUserData ? Number(cellUserData.plus_users || 0) : 0;

            // Colorimetría de Cuadrantes basada estrictamente en PLATFORM MAUS (usuarios totales de la app en la celda)
            let strokeCol = '#06b6d4';
            let fillCol = '#06b6d4';
            let baseFillOpacity = 0.08;

            if (hasUserData) {
              const ratio = maxPlatformUsers > 0 ? (platformUsers / maxPlatformUsers) : 0;
              if (platformUsers === 0) {
                strokeCol = '#94a3b8';
                fillCol = '#94a3b8';
                baseFillOpacity = 0.06;
              } else if (ratio < 0.25) {
                strokeCol = '#0284c7';
                fillCol = '#0284c7';
                baseFillOpacity = 0.22;
              } else if (ratio < 0.50) {
                strokeCol = '#10b981';
                fillCol = '#10b981';
                baseFillOpacity = 0.35;
              } else if (ratio < 0.75) {
                strokeCol = '#f59e0b';
                fillCol = '#f59e0b';
                baseFillOpacity = 0.48;
              } else {
                strokeCol = '#ea044e';
                fillCol = '#ea044e';
                baseFillOpacity = 0.64;
              }

            });

              const approxWidthKm = (eLng - wLng) * 111.32 * Math.cos(sLat * Math.PI / 180);

              const approxAreaKm2 = (approxWidthKm * approxHeightKm).toFixed(2);

    // ── GESTIÓN DE CONSULTA ON-DEMAND A BIGQUERY CON CONFIRMACIÓN PREVIA ──
    function confirmAndCalculateGridUsers() {
      if (selectedWarehouseIds.size === 0) {
        showToast('Seleccioná al menos un almacén en la lista para calcular sus cuadrantes.', 'warning');
        return;
      }

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const monthObj = allAvailableMonths.find(m => (m.month_date || m) === currentMonth);
      const monthLabel = monthObj ? (monthObj.month_label || monthObj.month_date || currentMonth) : currentMonth;

      const selectedIds = Array.from(selectedWarehouseIds);
      const alreadyCalculatedIds = [];
      const pendingToCalculateIds = [];

      selectedIds.forEach(id => {
        const cacheKey = `${id}__${currentMonth}__${gridDivisionCount}`;
        if (gridUsersDataCache.has(cacheKey)) {
          alreadyCalculatedIds.push(id);
        } else {
          pendingToCalculateIds.push(id);
        }
      });

      // Si TODAS las tiendas seleccionadas ya están calculadas para este mes:
      // Abrir modal explicativo y dar la opción explícita de FORZAR el recálculo fresco
      if (pendingToCalculateIds.length === 0) {
        const storeNames = selectedIds.map(id => {
          const w = allWarehouses.find(item => String(item.warehouse_id).trim() === id);
          return w ? w.warehouse_name : id;
        }).join(', ');

        const modal = document.getElementById('bq-confirm-modal');
        const storeNameEl = document.getElementById('bq-modal-store-name');
        const monthNameEl = document.getElementById('bq-modal-month-name');
        const cellsCountEl = document.getElementById('bq-modal-cells-count');
        const bytesEstimateEl = document.getElementById('bq-modal-bytes-estimate');
        const slotsEstimateEl = document.getElementById('bq-modal-slots-estimate');
        const confirmBtn = document.getElementById('btn-modal-confirm-bq');
        const infoDescEl = document.getElementById('bq-modal-desc-text');

        if (storeNameEl) storeNameEl.textContent = storeNames;
        if (monthNameEl) monthNameEl.textContent = monthLabel;
        if (cellsCountEl) cellsCountEl.innerHTML = `<span style="color:#10b981; font-weight:800;">${gridDivisionCount}×${gridDivisionCount} (${gridDivisionCount * gridDivisionCount} celdas) — Ya calculados</span>`;
        if (bytesEstimateEl) bytesEstimateEl.innerHTML = `<span style="color:#10b981; font-weight:800;">0 MB (Cargados en memoria)</span>`;
        if (slotsEstimateEl) slotsEstimateEl.innerHTML = `<span style="color:#10b981; font-weight:800;">0 Slots (0 ms)</span>`;

        if (infoDescEl) {
          infoDescEl.innerHTML = `
            <div style="background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); border-radius:6px; padding:8px 10px; margin-bottom:8px;">
              <div style="font-weight:800; color:#10b981; margin-bottom:3px; font-size:12px;">✓ Cuadrantes ya calculados en memoria</div>
              <div style="font-size:11.5px; color:var(--text-sheet-body); line-height:1.4;">Los usuarios de esta cuadrícula ya fueron censados en BigQuery para <b>${monthLabel}</b> (0 MB consumidos). Podés seguir visualizando estos datos o forzar una actualización fresca desde BigQuery.</div>
            </div>
          `;
        }

        if (confirmBtn) {
          confirmBtn.textContent = 'Forzar Recálculo en BigQuery';
          confirmBtn.style.background = '#ea044e';
          confirmBtn.onclick = function() {
            executeGridUsersBigQuery(true);
          };
        }

        if (modal) modal.style.display = 'flex';
        drawGridOnMap();
        return;
      }

      // Filtrar únicamente los cuadrantes de las tiendas pendientes
      const pendingCells = currentStoreGridCells.filter(c => pendingToCalculateIds.includes(c.whId));
      if (!pendingCells || pendingCells.length === 0) {
        showToast('No se generaron cuadrantes nuevos para calcular. Asegurate de que los recuadros estén visibles en el mapa.', 'warning');
        return;
      }

      const pendingStores = pendingToCalculateIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });
      const cachedStores = alreadyCalculatedIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });

      let storeText = pendingStores.map(w => w.warehouse_name).join(', ');
      if (cachedStores.length > 0) {
        storeText += ` <span style="font-size:10px; color:#10b981; font-weight:600;">(${cachedStores.map(w => w.warehouse_name).join(', ')} ya en caché, no se recalculará)</span>`;
      }

      document.getElementById('bq-modal-store-name').innerHTML = storeText;
      document.getElementById('bq-modal-month-name').textContent = monthLabel;
      document.getElementById('bq-modal-cells-count').textContent = `${pendingCells.length} cuadrantes pendientes (${gridDivisionCount}×${gridDivisionCount})`;

      const estEl = document.getElementById('bq-modal-bytes-estimate');
      if (estEl) estEl.textContent = 'Calculando medición BQ...';

      const infoDescEl = document.getElementById('bq-modal-desc-text');
      if (infoDescEl) {
        infoDescEl.innerHTML = `Se ejecutará una consulta directa en BigQuery contra la tabla <code>qc_coverage_customer_location</code> para geolocalizar y cuantificar los usuarios únicos dentro de cada recuadro.`;
      }

      const confirmBtn = document.getElementById('btn-modal-confirm-bq');
      if (confirmBtn) {
        confirmBtn.textContent = 'Confirmar y Calcular';
        confirmBtn.style.background = '#0284c7';
        confirmBtn.onclick = function() {
          executeGridUsersBigQuery(false);
        };
      }

      document.getElementById('bq-confirm-modal').style.display = 'flex';

      // Obtener estimación real con Dry Run gratuito de BigQuery
      const estPayload = {
        month_date: currentMonth,
        country_id: pendingStores[0] ? pendingStores[0].country_id : null,
        country_code: pendingStores[0] ? pendingStores[0].country_code : '',
        cells: pendingCells
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(estRes) {
            if (estEl) {
              if (estRes && estRes.bytesProcessed) {
                const mb = (Number(estRes.bytesProcessed) / (1024 * 1024)).toFixed(1);
                estEl.textContent = `${mb} MB (Consumo exacto facturado por BigQuery)`;
              } else {
                estEl.textContent = '~730 MB';
              }
            }
          })
          .withFailureHandler(function() {
            if (estEl) estEl.textContent = '~730 MB';
          })
          .estimateGridUsersBytes(estPayload);
      }
    }

    function closeBqConfirmModal() {
      const modal = document.getElementById('bq-confirm-modal');
      if (modal) modal.style.display = 'none';
    }

    function executeGridUsersBigQuery(forceRecalculate = false) {
      closeBqConfirmModal();

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const selectedIds = Array.from(selectedWarehouseIds);

      // Si se fuerza el recálculo, se purga la caché previa
      if (forceRecalculate) {
        selectedIds.forEach(id => {
          const cacheKey = `${id}__${currentMonth}__${gridDivisionCount}`;
          gridUsersDataCache.delete(cacheKey);
        });
        showToast('Memoria de cuadrantes liberada. Iniciando recálculo en BigQuery...', 'info');
      }

      const pendingToCalculateIds = selectedIds.filter(id => {
        const cacheKey = `${id}__${currentMonth}__${gridDivisionCount}`;
        return !gridUsersDataCache.has(cacheKey);
      });

      if (pendingToCalculateIds.length === 0) {
        showToast('Todas las tiendas seleccionadas ya están calculadas en memoria.', 'info');
        drawGridOnMap();
        return;
      }

      const pendingCells = currentStoreGridCells.filter(c => pendingToCalculateIds.includes(c.whId));
      const pendingStores = pendingToCalculateIds.map(id => allWarehouses.find(w => String(w.warehouse_id).trim() === id) || { warehouse_id: id, warehouse_name: id });
      const storeNames = pendingStores.map(w => w.warehouse_name).join(', ');

      const btn = document.getElementById('btn-calc-grid-users');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="mini-spinner" style="width:10px; height:10px; border-width:1.5px; border-top-color:#0284c7;"></span> <span>Consultando BQ...</span>`;
      }

      showToast(`Consultando BigQuery para ${storeNames} (${pendingCells.length} cuadrantes)...`, 'info');

      const overlay = document.getElementById('bq-query-progress-overlay');
      const details = document.getElementById('bq-progress-overlay-details');
      if (overlay) {
        if (details) details.textContent = `Consultando BigQuery para ${storeNames} (${pendingCells.length} cuadrantes pendientes)...`;
        overlay.style.display = 'flex';
      }

      const payload = {
        warehouse_ids: pendingToCalculateIds,
        warehouse_names: pendingStores.map(w => w.warehouse_name),
        country_id: pendingStores[0] ? pendingStores[0].country_id : null,
        country_code: pendingStores[0] ? pendingStores[0].country_code : '',
        month_date: currentMonth,
        cells: pendingCells
      };

      google.script.run
        .withSuccessHandler(function(res) {
          if (overlay) overlay.style.display = 'none';
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios (BQ)</span>`;
          }

          if (res && res.success) {
            const returnedCells = res.cellsData || {};

            // Distribuir resultados individualmente a cada tienda en su propio caché
            pendingToCalculateIds.forEach(whId => {
              const normWhId = String(whId).trim();
              const storeCacheKey = `${normWhId}__${currentMonth}__${gridDivisionCount}`;
              const storeCellsData = {};
              Object.entries(returnedCells).forEach(([cid, data]) => {
                const normCid = String(cid).trim();
                if (normCid.startsWith(`${normWhId}__`)) {
                  storeCellsData[normCid] = data;
                  const shortId = normCid.replace(`${normWhId}__`, '');
                  storeCellsData[shortId] = data;
                } else if (!normCid.includes('__')) {
                  storeCellsData[normCid] = data;
                }
              });
              gridUsersDataCache.set(storeCacheKey, storeCellsData);
            });

            // Guardar permanentemente en almacenamiento local persistente
            persistGridUsersDataCache();

            // Asegurar que la cuadrícula esté visible
            isGridVisible = true;
            const gridToggle = document.getElementById('grid-toggle');
            if (gridToggle) gridToggle.checked = true;
            const row = document.getElementById('grid-divisions-row');
            if (row) row.style.display = 'flex';

            window.recordBigQueryConsumption(res.bytesProcessed, res.monthBytesProcessed);

            drawGridOnMap();

            const billedMb = (Number(res.bytesProcessed) / (1024 * 1024)).toFixed(1);
            const totalUsers = Object.values(returnedCells).reduce((sum, c) => sum + (c.total_users || 0), 0);
            showToast(`Cálculo BigQuery completado: ${totalUsers.toLocaleString('es-AR')} usuarios únicos analizados (${billedMb} MB reales consumidos).`, 'success');
          } else {
            showToast('Error en BigQuery: ' + (res ? res.error : 'Sin respuesta'), 'danger');
          }
        })
        .withFailureHandler(function(err) {
          if (overlay) overlay.style.display = 'none';
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios (BQ)</span>`;
          }
          showToast('Error de comunicación con BigQuery: ' + err.message, 'danger');
        })
        .calculateUsersInGridCells(payload);
    }

    function centerMapOnSelected() {
      if (!map || typeof map.panTo !== 'function' || selectedWarehouseIds.size === 0) return;
      const selectedStores = allWarehouses.filter(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));
      if (selectedStores.length === 0) return;

      if (selectedStores.length === 1) {
        const pos = getWarehousePosition(selectedStores[0]);
        if (pos) {
          map.panTo(pos);
          if (typeof map.setZoom === 'function') map.setZoom(14); // Nivel 5 por defecto (14x)
        }
        return;
      }

      if (typeof google === 'undefined' || !google.maps || !google.maps.LatLngBounds) return;
      const bounds = new google.maps.LatLngBounds();
      selectedStores.forEach(w => {
        const pos = getWarehousePosition(w);
        if (pos) bounds.extend(pos);
      });
      if (!bounds.isEmpty() && typeof map.fitBounds === 'function') {
        map.fitBounds(bounds, 65);
      }
    }

    // ============================================================
    // MAPA DE CALOR NATIVO DE GOOGLE MAPS (HeatmapLayer & VERIFICACIÓN EN VIVO)
    // ============================================================
    function getDynamicHeatmapRadius(zoom) {
      const z = Number(zoom) || ((map && map.getZoom) ? map.getZoom() : 14);
      if (z <= 10) return 24;
      if (z === 11) return 32;
      if (z === 12) return 46;
      if (z === 13) return 68;
      if (z === 14) return 96;
      if (z === 15) return 140;
      if (z === 16) return 210;
      if (z === 17) return 300;
      return 400;
    }

    gHeatmapLayer = gHeatmapLayer || null;
    currentHeatmapRadius = currentHeatmapRadius || 36;
    currentHeatmapOpacity = currentHeatmapOpacity || 0.55;

    function updateHeatmapVerificationUI(isActive, libStatus, pointsCount, metricLabel) {

      if (!box) return;

      if (!metricLabel || metricLabel === 'none') {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      const badge = document.getElementById('heatmap-status-badge');
      const libEl = document.getElementById('heatmap-lib-status');
      const ptsEl = document.getElementById('heatmap-points-count');
      const metEl = document.getElementById('heatmap-active-metric');

      if (badge) {
        if (isActive) {
          badge.textContent = 'Activo (OK)';
          badge.className = 'badge-tag green';
          badge.style.background = 'rgba(16,185,129,0.12)';
          badge.style.color = '#10b981';
        } else {
          badge.textContent = 'Error / Inactivo';
          badge.className = 'badge-tag';
          badge.style.background = 'rgba(239,68,68,0.12)';
          badge.style.color = '#ef4444';
        }
      }

      if (libEl) {
        libEl.textContent = libStatus;
        libEl.style.color = libStatus.includes('(OK)') ? '#10b981' : '#ef4444';
      }

      if (ptsEl) ptsEl.textContent = `${pointsCount.toLocaleString('es-AR')} puntos`;
      if (metEl) metEl.textContent = metricLabel;
    }

    function updateHeatmapProgress(pct, text = null) {
      const pill = document.getElementById('heatmap-loading-pill');
      const label = document.getElementById('heatmap-loading-text');
      const pctEl = document.getElementById('heatmap-loading-pct');
      const fillEl = document.getElementById('heatmap-progress-bar-fill');

      if (!pill) return;

      if (pct <= 0) {
        pill.style.display = 'flex';
        if (pctEl) pctEl.textContent = '0%';
        if (fillEl) fillEl.style.width = '0%';
        if (label && text) label.textContent = text;
      } else if (pct >= 100) {
        pill.style.display = 'flex';
        if (pctEl) pctEl.textContent = '100%';
        if (fillEl) fillEl.style.width = '100%';
        if (label && text) label.textContent = text || 'Listo';
        setTimeout(() => {
          if (pill && currentHeatmapLayer !== 'none') {
            pill.style.display = 'none';
          }
        }, 600);
      } else {
        pill.style.display = 'flex';
        const rounded = Math.round(pct);
        if (pctEl) pctEl.textContent = `${rounded}%`;
        if (fillEl) fillEl.style.width = `${rounded}%`;
        if (label && text) label.textContent = text;
      }
    }

    function showHeatmapLoading(show, text = 'Cargando mapa de calor...') {

      } else {
        updateHeatmapProgress(100);

    function generatePointsForStoreBatch(storesBatch, layerType, minVal, maxVal, customBounds = null, customZoom = null) {
      const type = String(layerType || 'peya_maus').toLowerCase();
      const points = [];
      const currentZoom = Number(customZoom) || ((typeof map !== 'undefined' && map && map.getZoom) ? map.getZoom() : 14);
      const mapBounds = customBounds || ((typeof map !== 'undefined' && map && map.getBounds) ? map.getBounds() : null);

      storesBatch.forEach(s => {
        const baseLat = Number(s.lat);
        const baseLng = Number(s.lng);
        if (isNaN(baseLat) || isNaN(baseLng)) return;

        const ordersVal = Number(s.orders) || 200;
        const areaVal = Number(s.coverage_area_km2) || 12;
        let rawVal = 0;
        let intensity = 0.5;

        if (type === 'peya_maus') {
          rawVal = Number(s.peya_users) || 0;
          if (rawVal <= 0) return;
          const logRaw = Math.log(1 + rawVal);
          const logMin = Math.log(1 + Math.min(1000, minVal || 1000));
          const logMax = Math.log(1 + (maxVal || 120000));
          intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));
        } else if (type === 'covered_maus') {
          rawVal = Number(s.covered_maus) || Number(s.peya_users) || 0;
          if (rawVal <= 0) return;
          const logRaw = Math.log(1 + rawVal);
          const logMin = Math.log(1 + Math.min(800, minVal || 800));
          const logMax = Math.log(1 + (maxVal || 100000));
          intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));
        } else if (type === 'dmart_maus') {
          rawVal = Number(s.dmart_users) || 0;
          if (rawVal <= 0) return;
        } else if (type === 'penetration') {
          rawVal = Number(s.penetration_pct) || 0;
          if (rawVal <= 0) return;
        } else if (type === 'seamless_worst') {
          const seamless = Number(s.seamless_delivery_pct) || 78;
          rawVal = seamless;
          intensity = Math.max(0.35, Math.min(1.0, (86 - seamless) / 16));
        } else if (type === 'seamless_best') {
          const seamless = Number(s.seamless_delivery_pct) || 82;
          rawVal = seamless;
          intensity = Math.max(0.35, Math.min(1.0, (seamless - 74) / 18));
        } else if (type === 'afv') rawVal = Number(s.afv_aov_amount) || 15.2;
        else if (type === 'late_orders') rawVal = Number(s.order_late_pct) || 7.5;
        else if (type === 'orders') rawVal = ordersVal;
        else if (type === 'gmv_dmart') rawVal = Number(s.total_net_sales) || (ordersVal * 15);
        else if (type === 'cpo') rawVal = Number(s.rider_cpo_dmarts) || Number((1.25 + ((Number(s.avg_delivery_time_min) || 21) * 0.055)).toFixed(2));

        if (rawVal <= 0) return;

        const cosLat = Math.cos(baseLat * Math.PI / 180);
        if (type !== 'seamless_worst' && type !== 'seamless_best') {
          intensity = maxVal > minVal ? Math.max(0.35, (rawVal - minVal) / (maxVal - minVal)) : 0.65;
        }

        // Obtener la geometría oficial del shape para no derramar calor en el océano o cerros (ej. Antofagasta)
        let storePolyFeature = null;
        const normWhId = String(s.warehouse_id).trim();
        const pData = multiDatePolygonsMap.get(normWhId) || CLIENT_MEMORY_CACHE.polygons.get(normWhId);
        if (pData && pData.geojson && typeof turf !== 'undefined') {
          try {
            if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
              storePolyFeature = turf.cleanCoords(turf.feature(pData.geojson));
            }
          } catch(e) {}
        }

        function pushPointIfInside(pLat, pLng, weightVal) {
          if (type === 'covered_maus' || type === 'dmart_maus' || type === 'orders') {
            if (storePolyFeature && typeof turf !== 'undefined') {
              try {
                const pt = turf.point([pLng, pLat]);
                if (!turf.booleanPointInPolygon(pt, storePolyFeature)) {
                  return;
                }
              } catch(e) {}
            }
          }
          points.push({
            lat: pLat,
            lng: pLng,
            latLng: new google.maps.LatLng(pLat, pLng),
            weight: weightVal,
            rawVal: rawVal
          });
        }

        // Radio proporcional a la cobertura urbana
        const maxRadiusDeg = Math.min(0.024, Math.max(0.012, Math.sqrt(areaVal / Math.PI) * 0.007));
        const isFrictionLayer = (type === 'seamless_worst' || type === 'late_orders');

        // RESOLUCIÓN CUADRA POR CUADRA EN ZOOM CERCANO (zoom >= 15):
        // Genera micro-puntos densos con dispersión orgánica (jitter determinista) para no formar líneas rectas de cuadrícula
        if (currentZoom >= 15 && mapBounds && typeof mapBounds.getNorthEast === 'function') {
          const bNE = mapBounds.getNorthEast();
          const bSW = mapBounds.getSouthWest();
          const minLatVis = Math.max(baseLat - maxRadiusDeg, bSW.lat());
          const maxLatVis = Math.min(baseLat + maxRadiusDeg, bNE.lat());
          const minLngVis = Math.max(baseLng - (maxRadiusDeg / cosLat), bSW.lng());
          const maxLngVis = Math.min(baseLng + (maxRadiusDeg / cosLat), bNE.lng());

          // Paso por cuadra (~80m):
          const stepLat = currentZoom >= 17 ? 0.00065 : 0.00095;
          const stepLng = stepLat / cosLat;

          // Función determinista de dispersión urbana orgánica (evita líneas rectas de matriz)
          function getOrganicJitter(lat, lng, seed) {
            const v = Math.sin(lat * 123.456 + lng * 789.012 + seed * 45.678) * 10000.0;
            return (v - Math.floor(v)) - 0.5;
          }

          for (let pLat = minLatVis; pLat <= maxLatVis; pLat += stepLat) {
            for (let pLng = minLngVis; pLng <= maxLngVis; pLng += stepLng) {
              const dLat = (pLat - baseLat);
              const dLng = (pLng - baseLng) * cosLat;
              const distDeg = Math.sqrt(dLat * dLat + dLng * dLng);
              if (distDeg > maxRadiusDeg) continue;

              const distRatio = distDeg / maxRadiusDeg;
              let ptWeight = isFrictionLayer
                ? Math.max(1, Math.round(intensity * (0.3 + distRatio * 1.4) * 11))
                : Math.max(1, Math.round(intensity * (1.2 - distRatio * 0.75) * 11));

              // Desplazamiento orgánico sobre la manzana urbana
              const jLat = getOrganicJitter(pLat, pLng, 1) * (stepLat * 0.72);
              const jLng = getOrganicJitter(pLat, pLng, 2) * (stepLng * 0.72);
              const realLat = Number((pLat + jLat).toFixed(6));
              const realLng = Number((pLng + jLng).toFixed(6));

              pushPointIfInside(realLat, realLng, ptWeight);

              // En zonas de alta demanda en zoom micro (>=16), agregar punto satélite orgánico
              if (currentZoom >= 16 && ptWeight >= 5) {
                const jLat2 = getOrganicJitter(pLat, pLng, 3) * (stepLat * 0.85);
                const jLng2 = getOrganicJitter(pLat, pLng, 4) * (stepLng * 0.85);
                pushPointIfInside(
                  Number((pLat + jLat2).toFixed(6)),
                  Number((pLng + jLng2).toFixed(6)),
                  Math.max(1, Math.round(ptWeight * 0.75))
                );
              }
            }
          }
        } else if (isFrictionLayer) {
          // CAPA DE FRICCIÓN Y RETRASOS VIALES (Seamless Negativo y Late Orders):
          // En La Plata y cualquier ciudad, la fricción operativa ocurre LEJOS del almacén (en la periferia urbana).
          // El epicentro (tienda) tiene 0 fricción.
          // Malla continua de 4 anillos densos (30%, 55%, 78%, 100%) con pesos crecientes hacia el borde
          [
            { r: maxRadiusDeg * 0.30, count: 6,  weightFactor: 2.0 },
            { r: maxRadiusDeg * 0.55, count: 10, weightFactor: 5.5 },
            { r: maxRadiusDeg * 0.78, count: 14, weightFactor: 9.0 },
            { r: maxRadiusDeg * 1.00, count: 18, weightFactor: 12.0 }
          ].forEach(ring => {
            const step = (Math.PI * 2) / ring.count;
            for (let k = 0; k < ring.count; k++) {
              const rad = k * step;
              const pLat = Number((baseLat + ring.r * Math.cos(rad)).toFixed(6));
              const pLng = Number((baseLng + (ring.r * Math.sin(rad)) / cosLat).toFixed(6));
              pushPointIfInside(pLat, pLng, Math.max(1, Math.round(intensity * ring.weightFactor)));
            }
          });

        } else {
          // CAPAS DE VOLUMEN Y EXCELENCIA (Órdenes, MAUs, Seamless Positivo):
          pushPointIfInside(baseLat, baseLng, Math.round(intensity * 14));

          // Para Platform MAUs: generamos 5 anillos expansivos hacia los barrios periféricos no cubiertos
          const ringsConfig = (type === 'peya_maus')
            ? [
                { r: maxRadiusDeg * 0.35, count: 6,  weightFactor: 11.0 },
                { r: maxRadiusDeg * 0.70, count: 10, weightFactor: 8.0 },
                { r: maxRadiusDeg * 1.15, count: 14, weightFactor: 5.5 },
                { r: maxRadiusDeg * 1.65, count: 18, weightFactor: 3.5 },
                { r: maxRadiusDeg * 2.20, count: 22, weightFactor: 2.0 }
              ]
            : [
                { r: maxRadiusDeg * 0.25, count: 6,  weightFactor: 11.0 },
                { r: maxRadiusDeg * 0.50, count: 10, weightFactor: 7.5 },
                { r: maxRadiusDeg * 0.75, count: 14, weightFactor: 4.5 },
                { r: maxRadiusDeg * 1.00, count: 18, weightFactor: 2.5 }
              ];

          ringsConfig.forEach(ring => {
            const step = (Math.PI * 2) / ring.count;
            for (let k = 0; k < ring.count; k++) {
              const rad = k * step;
              const pLat = Number((baseLat + ring.r * Math.cos(rad)).toFixed(6));
              const pLng = Number((baseLng + (ring.r * Math.sin(rad)) / cosLat).toFixed(6));
              pushPointIfInside(pLat, pLng, Math.max(1, Math.round(intensity * ring.weightFactor)));
            }
          });
        }
      });

      return points;
    }

    function renderHeatmapProgressively(targetStores, layerType) {
      if (HEATMAP_PROGRESSIVE_TIMER) clearTimeout(HEATMAP_PROGRESSIVE_TIMER);

      const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;
      const currentMonth = getCurrentActiveMonth();
      const activeCountry = document.getElementById('filter-country').value || 'ALL';
      const cacheKey = `${layerType}__${activeCountry}__${currentMonth}`;

      // Si ya está en caché, renderizar instantáneamente a 0 ms sin barra de espera
      if (HEATMAP_CACHE.has(cacheKey)) {
        const cachedPoints = HEATMAP_CACHE.get(cacheKey);
        renderGoogleHeatmap(cachedPoints, layerType);
        updateHeatmapScaleLegend(layerType, null, cachedPoints);
        updateHeatmapProgress(100, `${metricLabel} listo (desde caché)`);
        return;
      }

      // Calibrar cotas fijas de la ciudad para evitar saltos térmicos
      calibrateHeatmapStableBounds(layerType);
      const stable = HEATMAP_STABLE_BOUNDS[layerType] || { min: 0, max: 100 };

      const totalStores = targetStores.length;
      if (totalStores === 0) {
        updateHeatmapProgress(100, 'Sin tiendas');
        return;
      }

      // Tamaño de micro-lote: procesar de 4 a 6 tiendas por cuadro para que cargue "de a poco"
      const batchSize = Math.max(3, Math.ceil(totalStores / 6));
      let currentIdx = 0;
      let accumulatedPoints = [];

      updateHeatmapProgress(12, `Iniciando ${metricLabel}...`);

      function processBatch() {
        if (currentHeatmapLayer !== layerType) {
          updateHeatmapProgress(100, 'Cancelado');
          return;
        }

        const nextIdx = Math.min(currentIdx + batchSize, totalStores);
        const batch = targetStores.slice(currentIdx, nextIdx);

        const batchPoints = generatePointsForStoreBatch(batch, layerType, stable.min, stable.max);
        accumulatedPoints = accumulatedPoints.concat(batchPoints);

        // Renderizar progresivamente en el canvas para que aparezca "de a poco"
        renderGoogleHeatmap(accumulatedPoints, layerType);

        currentIdx = nextIdx;
        const progressPct = Math.min(94, Math.round((currentIdx / totalStores) * 92) + 6);
        updateHeatmapProgress(progressPct, `Cargando tiendas (${currentIdx}/${totalStores})...`);

        if (currentIdx < totalStores) {
          HEATMAP_PROGRESSIVE_TIMER = setTimeout(processBatch, 25);
        } else {
          // Si es la capa de Platform MAUs, incorporar los nodos urbanos satélites de la plataforma (ej. Santo Tomé, Rafaela, etc.)
          if (layerType === 'peya_maus') {
            const country = document.getElementById('filter-country').value || 'Argentina';
            const matchingSatellites = PLATFORM_SATELLITE_NODES.filter(n => !country || n.country === country);
            matchingSatellites.forEach(sat => {
              const rawVal = sat.peya_users;
              const logRaw = Math.log(1 + rawVal);
              const logMin = Math.log(1 + 1000);
              const logMax = Math.log(1 + (stable.max || 120000));
              const intensity = Math.max(0.35, Math.min(1.0, (logRaw - logMin) / Math.max(0.01, logMax - logMin)));

              const baseLat = sat.lat;
              const baseLng = sat.lng;
              const cosLat = Math.cos(baseLat * Math.PI / 180);
              const maxRadiusDeg = 0.022;

              accumulatedPoints.push({
                lat: baseLat,
                lng: baseLng,
                latLng: new google.maps.LatLng(baseLat, baseLng),
                weight: Math.round(intensity * 10),
                rawVal: rawVal
              });

              [0, 60, 120, 180, 240, 300].forEach(deg => {
                const rad = deg * Math.PI / 180;
                const pLat = Number((baseLat + maxRadiusDeg * 0.65 * Math.cos(rad)).toFixed(6));
                const pLng = Number((baseLng + (maxRadiusDeg * 0.65 * Math.sin(rad)) / cosLat).toFixed(6));
                accumulatedPoints.push({
                  lat: pLat,
                  lng: pLng,
                  latLng: new google.maps.LatLng(pLat, pLng),
                  weight: Math.max(1, Math.round(intensity * 4.5)),
                  rawVal: rawVal
                });
              });
            });
            renderGoogleHeatmap(accumulatedPoints, layerType);
          }

          // Guardar en caché permanente de sesión
          HEATMAP_CACHE.set(cacheKey, accumulatedPoints);
          updateHeatmapProgress(100, `${metricLabel} listo (${accumulatedPoints.length} puntos)`);
          updateHeatmapScaleLegend(layerType, null, accumulatedPoints);
          window.logLiveDebug(`[Heatmap OK] ${accumulatedPoints.length} puntos renderizados progresivamente para ${metricLabel}`, 'success');
        }
      }

      processBatch();
    }

    window.ACTIVE_REAL_BQ_POINTS = [];
    window.IS_USING_REAL_BQ_HEATMAP = false;

    window.updateHeatmapViewportPoints = function() {
      if (!map || !currentHeatmapLayer || currentHeatmapLayer === 'none' || !gHeatmapLayer) return;
      const bounds = map.getBounds();
      if (!bounds) return;

      const zoom = (map && map.getZoom) ? map.getZoom() : 14;

      // ── REGLA CRÍTICA: SI EL USUARIO YA CARGÓ PUNTOS REALES DE BIGQUERY, NUNCA BORRARLOS AL HACER ZOOM O MOVER EL MAPA ──
      if (window.IS_USING_REAL_BQ_HEATMAP && window.ACTIVE_REAL_BQ_POINTS && window.ACTIVE_REAL_BQ_POINTS.length > 0) {
        if (typeof gHeatmapLayer.draw === 'function') {
          gHeatmapLayer.draw();
        }
        return;
      }

      // Expandir bounds del viewport con un buffer de 7 km (~0.065°) para incluir todas las tiendas que despachan hacia esta zona
      const bNE = bounds.getNorthEast();
      const bSW = bounds.getSouthWest();
      const bufferDeg = 0.065;
      const expandedMinLat = bSW.lat() - bufferDeg;
      const expandedMaxLat = bNE.lat() + bufferDeg;
      const expandedMinLng = bSW.lng() - bufferDeg;
      const expandedMaxLng = bNE.lng() + bufferDeg;

      // Buscar tiendas cuya ubicación física o cobertura esté dentro del alcance de esta vista
      const candidateStores = allWarehouses.filter(w => {
        const pos = getWarehousePosition(w);
        if (!pos) return false;
        return pos.lat >= expandedMinLat && pos.lat <= expandedMaxLat &&
               pos.lng >= expandedMinLng && pos.lng <= expandedMaxLng;
      });

      if (candidateStores.length === 0) {
        if (typeof gHeatmapLayer.draw === 'function') gHeatmapLayer.draw();
        return;
      }

      calibrateHeatmapStableBounds(currentHeatmapLayer);
      const stable = HEATMAP_STABLE_BOUNDS[currentHeatmapLayer] || { min: 0, max: 100 };
      const pts = generatePointsForStoreBatch(candidateStores, currentHeatmapLayer, stable.min, stable.max, bounds, zoom);
      if (pts && pts.length > 0 && typeof gHeatmapLayer.setPoints === 'function') {
        gHeatmapLayer.setPoints(pts);
        const countEl = document.getElementById('heatmap-points-count');
        if (countEl) countEl.textContent = pts.length.toLocaleString('es-AR') + ' en visión';
      }
    };

    // ── GESTIÓN DE CACHÉ LOCAL PERSISTENTE (IndexedDB, localStorage & RAM) PARA PUNTOS REALES BQ ──
    const LOCAL_STORAGE_HEATMAP_PREFIX = 'allmap_bq_real_pts_';
    const REAL_HEATMAP_CACHE = new Map(); // key: cacheKey -> rawPoints
    let PENDING_HEATMAP_PAYLOAD = null;

    // Motor IndexedDB para almacenamiento ilimitado sin restricciones de cuota de 5MB
    const IDB_HEATMAP_DB = 'AllMapRealHeatmapDB';
    const IDB_HEATMAP_STORE = 'real_points';

    function openHeatmapIndexedDB() {
      return new Promise((resolve) => {
        if (typeof window === 'undefined' || !window.indexedDB) {
          resolve(null);
          return;
        }
        try {
          const req = window.indexedDB.open(IDB_HEATMAP_DB, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_HEATMAP_STORE)) {
              db.createObjectStore(IDB_HEATMAP_STORE, { keyPath: 'key' });
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        } catch(e) {
          resolve(null);
        }
      });
    }

    async function idbSaveHeatmapPoints(key, data) {
      try {
        const db = await openHeatmapIndexedDB();
        if (!db) return false;
        return new Promise((resolve) => {
          const tx = db.transaction(IDB_HEATMAP_STORE, 'readwrite');
          const store = tx.objectStore(IDB_HEATMAP_STORE);
          store.put({ key: key, data: data, timestamp: Date.now() });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch(e) {
        return false;
      }
    }

    async function idbGetHeatmapPoints(key) {
      try {
        const db = await openHeatmapIndexedDB();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(IDB_HEATMAP_STORE, 'readonly');
          const store = tx.objectStore(IDB_HEATMAP_STORE);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result ? req.result.data : null);
          req.onerror = () => resolve(null);
        });
      } catch(e) {
        return null;
      }
    }

    function saveRealPointsToLocalStorage(cacheKey, rawPoints, metaDetails = {}) {
      if (!rawPoints || !Array.isArray(rawPoints)) return;
      try {
        // 1. Guardar en memoria RAM rápida de sesión
        REAL_HEATMAP_CACHE.set(cacheKey, rawPoints);

        // 2. Guardar en IndexedDB (sin límites de 5MB, persistencia garantizada post-recarga)
        idbSaveHeatmapPoints(cacheKey, rawPoints);

        // 3. Guardar en localStorage con estructura compacta de arrays [lat, lng, peya, dmart, orders]
        const compact = rawPoints.map(p => [
          Number(Number(p.lat).toFixed(5)),
          Number(Number(p.lng).toFixed(5)),
          Number(p.peya_users || 0),
          Number(p.dmart_users || 0),
          Number(p.dmart_orders || 0)
        ]);

        const storageKey = LOCAL_STORAGE_HEATMAP_PREFIX + cacheKey;
        try {
          localStorage.setItem(storageKey, JSON.stringify(compact));
        } catch(quotaErr) {
          console.warn('[LocalStorage] Cuota excedida al guardar puntos, pero persistido en IndexedDB:', quotaErr);
        }

        // 4. Mantener índice de metadatos de zonas guardadas
        let metaIndex = [];
        try {
          metaIndex = JSON.parse(localStorage.getItem('allmap_saved_zones_metadata') || '[]');
        } catch(e) {}

        metaIndex = metaIndex.filter(m => m.key !== cacheKey);
        metaIndex.unshift({
          key: cacheKey,
          storageKey: storageKey,
          zoneLabel: metaDetails.zoneLabel || 'Zona censada',
          month: metaDetails.month || getCurrentActiveMonth(),
          bounds: metaDetails.bounds || null,
          pointsCount: rawPoints.length,
          totalUsers: metaDetails.totalUsers || rawPoints.length,
          timestamp: Date.now()
        });
        while (metaIndex.length > 40) {
          const old = metaIndex.pop();
          if (old && old.storageKey) {
            try { localStorage.removeItem(old.storageKey); } catch(e) {}
          }
        }
        try {
          localStorage.setItem('allmap_saved_zones_metadata', JSON.stringify(metaIndex));
        } catch(e) {}

        window.logLiveDebug(`[Memoria Local OK] ${rawPoints.length} domicilios GPS persistidos en disco: ${cacheKey}`);
        updateHeatmapMemoryStatusUI();
      } catch(err) {
        console.warn('[Memoria Local] Error en saveRealPointsToLocalStorage:', err);
      }
    }

    function getRealPointsFromLocalStorage(cacheKey) {
      if (!cacheKey) return null;
      // 1. Memoria RAM
      if (REAL_HEATMAP_CACHE.has(cacheKey)) {
        return REAL_HEATMAP_CACHE.get(cacheKey);
      }

      // 2. Almacenamiento local del navegador (localStorage)
      try {
        const storageKey = cacheKey.startsWith(LOCAL_STORAGE_HEATMAP_PREFIX) ? cacheKey : (LOCAL_STORAGE_HEATMAP_PREFIX + cacheKey);
        const stored = localStorage.getItem(storageKey);
        if (stored) {
          const compact = JSON.parse(stored);
          if (Array.isArray(compact) && compact.length > 0) {
            const rawPoints = compact.map(c => ({
              lat: c[0],
              lng: c[1],
              peya_users: c[2],
              dmart_users: c[3],
              dmart_orders: c[4]
            }));
            REAL_HEATMAP_CACHE.set(cacheKey, rawPoints);
            window.logLiveDebug(`[LocalStorage Hit] ${rawPoints.length} domicilios GPS recuperados de almacenamiento local`);
            return rawPoints;
          }
        }
      } catch(err) {}

      // 3. Fallback asíncrono a IndexedDB
      idbGetHeatmapPoints(cacheKey).then(idbPoints => {
        if (idbPoints && Array.isArray(idbPoints) && idbPoints.length > 0) {
          REAL_HEATMAP_CACHE.set(cacheKey, idbPoints);
          if (!window.RAW_REAL_BQ_POINTS || window.RAW_REAL_BQ_POINTS.length === 0) {
            loadCachedPointsInCurrentView({ key: cacheKey, pointsCount: idbPoints.length });
          }
        }
      });

      return null;
    }

    function findBestMatchingCachedZone(bounds, month) {
      let metaIndex = [];
      try {
        metaIndex = JSON.parse(localStorage.getItem('allmap_saved_zones_metadata') || '[]');
      } catch(e) {}
      if (!metaIndex || metaIndex.length === 0) return null;

      const targetMonth = month || getCurrentActiveMonth();
      const center = (bounds && bounds.getCenter) ? bounds.getCenter() : (map && map.getCenter ? map.getCenter() : null);
      if (!center) return metaIndex[0];

      const cLat = center.lat();
      const cLng = center.lng();

      // 1. Intento estricto: mismo mes y dentro de 25 km
      for (let i = 0; i < metaIndex.length; i++) {
        const m = metaIndex[i];
        if (m.month && m.month !== targetMonth) continue;
        if (m.bounds) {
          const bMidLat = (m.bounds.minLat + m.bounds.maxLat) / 2;
          const bMidLng = (m.bounds.minLng + m.bounds.maxLng) / 2;
          const dist = getDistanceKm(cLat, cLng, bMidLat, bMidLng);
          if (dist <= 25) {
            return m;
          }
        }
      }

      // 2. Intento flexible: cualquier mes dentro de 35 km de la zona
      for (let i = 0; i < metaIndex.length; i++) {
        const m = metaIndex[i];
        if (m.bounds) {
          const bMidLat = (m.bounds.minLat + m.bounds.maxLat) / 2;
          const bMidLng = (m.bounds.minLng + m.bounds.maxLng) / 2;
          const dist = getDistanceKm(cLat, cLng, bMidLat, bMidLng);
          if (dist <= 35) {
            return m;
          }
        }
      }

      // 3. Si solo hay 1 zona guardada en todo el navegador, devolverla para no pedir recalcular
      if (metaIndex.length === 1) {
        return metaIndex[0];
      }

      return null;
    }

    window.updateHeatmapMemoryStatusUI = function() {
      const countBadge = document.getElementById('heatmap-memory-count-badge');
      const statusText = document.getElementById('heatmap-memory-status-text');
      const btnLoad = document.getElementById('btn-load-saved-zone-memory');
      const btnClear = document.getElementById('btn-clear-heatmap-memory');
      if (!countBadge || !statusText) return;

      let metaIndex = [];
      try {
        metaIndex = JSON.parse(localStorage.getItem('allmap_saved_zones_metadata') || '[]');
      } catch(e) {}

      const totalZones = metaIndex.length;
      let totalPoints = 0;
      metaIndex.forEach(m => totalPoints += (m.pointsCount || 0));

      countBadge.textContent = `${totalZones} zona${totalZones === 1 ? '' : 's'}`;

      if (btnClear) {
        btnClear.style.display = totalZones > 0 ? 'inline-block' : 'none';
      }

      if (totalZones === 0) {
        statusText.textContent = 'Sin datos censados guardados en este navegador.';
        if (btnLoad) btnLoad.style.display = 'none';
        return;
      }

      const bounds = map ? map.getBounds() : null;
      const matching = findBestMatchingCachedZone(bounds, getCurrentActiveMonth());

      if (matching) {
        statusText.innerHTML = `🟢 <b>${matching.zoneLabel}</b> guardada en tu memoria (${matching.pointsCount.toLocaleString('es-AR')} domicilios • 0 MB BQ)`;
        if (btnLoad) {
          btnLoad.style.display = 'inline-block';
          btnLoad.textContent = `⚡ Cargar ${matching.zoneLabel} (${matching.pointsCount.toLocaleString('es-AR')} pts • 0 MB)`;
        }
      } else {
        const latest = metaIndex[0];
        statusText.innerHTML = `💾 Tenés <b>${totalZones} zona(s)</b> guardadas (${totalPoints.toLocaleString('es-AR')} domicilios totales). Última: <b>${latest.zoneLabel}</b>.`;
        if (btnLoad) {
          btnLoad.style.display = 'inline-block';
          btnLoad.textContent = `🚀 Ir a ${latest.zoneLabel} y Cargar (${latest.pointsCount.toLocaleString('es-AR')} pts • 0 MB)`;
        }
      }
    };

    window.loadCachedPointsInCurrentView = function(targetZone) {
      const bounds = map ? map.getBounds() : null;
      let metaIndex = [];
      try {
        metaIndex = JSON.parse(localStorage.getItem('allmap_saved_zones_metadata') || '[]');
      } catch(e) {}

      const zone = targetZone || findBestMatchingCachedZone(bounds, getCurrentActiveMonth()) || (metaIndex.length > 0 ? metaIndex[0] : null);
      if (!zone) {
        showToast('No hay datos guardados para esta vista', 'warning');
        return;
      }

      // Si el mapa está lejos de la zona guardada, centrar la cámara en ella
      if (zone.bounds && map) {
        const center = map.getCenter();
        const bMidLat = (zone.bounds.minLat + zone.bounds.maxLat) / 2;
        const bMidLng = (zone.bounds.minLng + zone.bounds.maxLng) / 2;
        if (!center || getDistanceKm(center.lat(), center.lng(), bMidLat, bMidLng) > 15) {
          map.panTo({ lat: bMidLat, lng: bMidLng });
          if (map.getZoom() < 13) map.setZoom(14);
        }
      }

      let rawPoints = getRealPointsFromLocalStorage(zone.key) || getRealPointsFromLocalStorage(zone.storageKey);
      if (!rawPoints || rawPoints.length === 0) {
        // Intentar desde IndexedDB
        idbGetHeatmapPoints(zone.key).then(idbPts => {
          if (idbPts && idbPts.length > 0) {
            applyLoadedRealPointsToMap(idbPts, zone);
          } else {
            showToast('No se pudieron leer los puntos guardados', 'error');
          }
        });
        return;
      }

      applyLoadedRealPointsToMap(rawPoints, zone);
    };

    function applyLoadedRealPointsToMap(rawPoints, zone) {
      window.RAW_REAL_BQ_POINTS = rawPoints;
      const realPoints = getRealPointsForLayer(rawPoints, currentHeatmapLayer && currentHeatmapLayer !== 'none' ? currentHeatmapLayer : 'peya_maus');
      window.ACTIVE_REAL_BQ_POINTS = realPoints;
      window.IS_USING_REAL_BQ_HEATMAP = true;

      createOrUpdateHeatmapLayer(realPoints);

      const srcBadge = document.getElementById('heatmap-data-source-badge');
      if (srcBadge) {
        srcBadge.textContent = 'Censo Real (Memoria Local • 0 MB)';
        srcBadge.style.color = '#10b981';
        srcBadge.style.background = 'rgba(16,185,129,0.12)';
        srcBadge.style.borderColor = 'rgba(16,185,129,0.3)';
      }

    function getRealPointsForLayer(rawPoints, layerType) {
      if (!rawPoints || !Array.isArray(rawPoints)) return [];
      const type = String(layerType || currentHeatmapLayer || 'peya_maus').toLowerCase();

      const result = [];
      for (let i = 0; i < rawPoints.length; i++) {
        const pt = rawPoints[i];
        const pLat = Number(pt.lat);
        const pLng = Number(pt.lng);
        if (isNaN(pLat) || isNaN(pLng)) continue;

        let rawVal = 0;
        let weight = 0;

        if (type === 'orders') {
          rawVal = Number(pt.dmart_orders) || 0;
          if (rawVal <= 0) continue; // Si no tiene órdenes, NO emite calor en el mapa de pedidos
          weight = Math.max(1, Math.min(25, rawVal));
        } else if (type === 'dmart_maus') {
          rawVal = Number(pt.dmart_users) || 0;
          if (rawVal <= 0) continue; // Si no es comprador D-Mart, NO emite calor en el mapa de compradores
          weight = Math.max(1, Math.min(25, rawVal));
        } else if (type === 'covered_maus') {
          rawVal = Number(pt.peya_users) || 1;
          weight = Math.max(1, Math.min(25, rawVal));
        } else {
          // peya_maus (Platform MAUs por defecto)
          rawVal = Number(pt.peya_users) || 1;
          weight = Math.max(1, Math.min(25, rawVal));
        }

        result.push({
          lat: pLat,
          lng: pLng,
          latLng: new google.maps.LatLng(pLat, pLng),
          weight: weight,
          rawVal: rawVal,
          peya_users: Number(pt.peya_users || 0),
          dmart_users: Number(pt.dmart_users || 0),
          dmart_orders: Number(pt.dmart_orders || 0),
          isRealBigQuery: true
        });
      }
      return result;
    }
