    function setPrimaryMonth(monthDate, e) {
      if (e) e.stopPropagation();
      const filterMonthSel = document.getElementById('filter-month');
      const oldPrimary = filterMonthSel ? filterMonthSel.value : null;

      // Si sólo había 1 mes activo (el anterior principal), al cambiar de mes principal se reemplaza limpiando el anterior
      if (oldPrimary && oldPrimary !== monthDate && activeOverlayMonths.size <= 1) {
        activeOverlayMonths.delete(oldPrimary);
        multiDatePolygonsMap.forEach((entry, key) => {
          if (key.endsWith(`__${oldPrimary}`)) {
            if (entry && entry.polygon) {
              entry.polygon.setMap(null);
              google.maps.event.clearInstanceListeners(entry.polygon);
            }
            multiDatePolygonsMap.delete(key);
          }
        });
      }

      if (filterMonthSel) filterMonthSel.value = monthDate;

      onMonthChange(monthDate);
      renderUnifiedDateControls();
    }

    function toggleDateOverlayCheckbox(monthDate, checked, e) {
      if (e) e.stopPropagation();
      const primary = document.getElementById('filter-month').value;

      if (!checked) {
        if (monthDate === primary) {
          // El usuario deselecciona el mes principal (por ej. Octubre)
          const remaining = Array.from(activeOverlayMonths).filter(m => m !== monthDate);
          if (remaining.length > 0) {
            // Si hay otros meses activos, promovemos el primero a principal
            const newPrimary = remaining[0];
            activeOverlayMonths.delete(monthDate);
            multiDatePolygonsMap.forEach((entry, key) => {
              if (key.endsWith(`__${monthDate}`)) {
                if (entry && entry.polygon) {
                  entry.polygon.setMap(null);
                  google.maps.event.clearInstanceListeners(entry.polygon);
                }
                multiDatePolygonsMap.delete(key);
              }
            });
            const filterMonthSel = document.getElementById('filter-month');
            if (filterMonthSel) filterMonthSel.value = newPrimary;
            const kpiMonthSel = document.getElementById('kpi-month-select');
            if (kpiMonthSel) kpiMonthSel.value = newPrimary;

            applyMonthWarehouseStatus(newPrimary);
            renderPartnerSmartFilterOptions();
            renderWarehouseCards();
            refreshPolygonsWithTransition(newPrimary);
            loadTotalMetrics();
            renderUnifiedDateControls();
            drawWarehousesOnMap();
            return;
          } else {
            // Era el único mes activo. Buscamos el siguiente mes disponible para no dejar vacío
            const currIdx = allAvailableMonths.findIndex(m => (m.month_date || m) === monthDate);
            const nextObj = allAvailableMonths[currIdx + 1] || allAvailableMonths[0];
            const nextMonth = nextObj ? (nextObj.month_date || nextObj) : null;
            if (nextMonth && nextMonth !== monthDate) {
              activeOverlayMonths.delete(monthDate);
              multiDatePolygonsMap.forEach((entry, key) => {
                if (key.endsWith(`__${monthDate}`)) {
                  if (entry && entry.polygon) {
                    entry.polygon.setMap(null);
                    google.maps.event.clearInstanceListeners(entry.polygon);
                  }
                  multiDatePolygonsMap.delete(key);
                }
              });
              activeOverlayMonths.add(nextMonth);
              const filterMonthSel = document.getElementById('filter-month');
              if (filterMonthSel) filterMonthSel.value = nextMonth;
              const kpiMonthSel = document.getElementById('kpi-month-select');
              if (kpiMonthSel) kpiMonthSel.value = nextMonth;

              applyMonthWarehouseStatus(nextMonth);
              renderPartnerSmartFilterOptions();
              renderWarehouseCards();
              refreshPolygonsWithTransition(nextMonth);
              loadTotalMetrics();
              renderUnifiedDateControls();
              drawWarehousesOnMap();
              showToast(`Mes cambiado a ${nextObj.month_label || nextMonth}`, 'info');
              return;
            } else {
              showToast('Debe haber al menos un mes seleccionado.', 'warning');
              renderUnifiedDateControls();
              return;
            }
          }
        } else {
          activeOverlayMonths.delete(monthDate);
          multiDatePolygonsMap.forEach((entry, key) => {
            if (key.endsWith(`__${monthDate}`)) {
              if (entry && entry.polygon) {
                entry.polygon.setMap(null);
                google.maps.event.clearInstanceListeners(entry.polygon);
              }
              multiDatePolygonsMap.delete(key);
            }
          });
        }
      } else {
        if (activeOverlayMonths.size >= 5) {
          showToast('Máximo 5 fechas simultáneas para mantener legibilidad.', 'warning');
          renderUnifiedDateControls();
          return;
        }
        activeOverlayMonths.add(monthDate);
      }

      renderUnifiedDateControls();
      drawWarehousesOnMap();
    }

    function resetToSinglePrimaryMonth(e) {
      if (e) e.stopPropagation();
      const primary = document.getElementById('filter-month').value;
      activeOverlayMonths.clear();
      activeOverlayMonths.add(primary);

      multiDatePolygonsMap.forEach((entry, key) => {

          }
          multiDatePolygonsMap.delete(key);

    function renderUnifiedDateControls() {
      const container = document.getElementById('unified-date-list-container');

        if (filterMonthSel) filterMonthSel.value = primary;

            : (isChecked ? `${colorDef.stroke}10` : 'transparent');

                     name="primary_month_radio_group" 
                     ${isPrimary ? 'checked' : ''}

                     title="Seleccionar ${mLabel} como Mes Principal único"
                     style="cursor:pointer; accent-color:#ea044e; width:13px; height:13px; margin:0;">

    function extractPolygonCoordinates(geojson) {
      if (!geojson || !geojson.coordinates) return [];

      if (geojson.type === 'MultiPolygon') {
        const allRings = [];
        if (Array.isArray(geojson.coordinates)) {
          geojson.coordinates.forEach(poly => {
            if (Array.isArray(poly) && poly.length > 0 && Array.isArray(poly[0])) {
              const rCoords = poly[0].map(coord => ({
                lat: Number(coord[1]),
                lng: Number(coord[0])
              })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
              if (rCoords.length >= 3) allRings.push(rCoords);
            }
          });
        }
        if (allRings.length === 0) return [];
        return allRings.length === 1 ? allRings[0] : allRings;
      } else if (geojson.type === 'Polygon') {
        const ring = Array.isArray(geojson.coordinates) ? geojson.coordinates[0] : null;
        if (!ring || !Array.isArray(ring)) return [];
        return ring.map(coord => ({
          lat: Number(coord[1]),
          lng: Number(coord[0])
        })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
      } else if (Array.isArray(geojson.coordinates)) {
        let curr = geojson.coordinates;
        while (Array.isArray(curr) && curr.length > 0 && Array.isArray(curr[0]) && Array.isArray(curr[0][0])) {
          curr = curr[0];
        }
        if (!curr || !Array.isArray(curr)) return [];
        return curr.map(coord => ({
          lat: Number(coord[1]),
          lng: Number(coord[0])
        })).filter(pt => !isNaN(pt.lat) && !isNaN(pt.lng) && pt.lat !== 0 && pt.lng !== 0);
      }
      return [];
    }

    function coordsToTurfPolygon(coords) {
      if (!coords) return null;
      let raw = coords;
      while (Array.isArray(raw) && raw.length > 0 && Array.isArray(raw[0]) && Array.isArray(raw[0][0])) {
        raw = raw[0];
      }
      if (Array.isArray(raw) && raw.length > 0 && Array.isArray(raw[0])) {
        raw = raw[0];
      }
      if (!Array.isArray(raw) || raw.length < 3) return null;

      let ring = raw.map(p => {
        let lat = (p.lat !== undefined) ? Number(p.lat) : Number(p[1]);
        let lng = (p.lng !== undefined) ? Number(p.lng) : Number(p[0]);
        return [lng, lat];
      }).filter(pt => !isNaN(pt[0]) && !isNaN(pt[1]) && pt[0] !== 0 && pt[1] !== 0);

      if (ring.length < 3) return null;

      if (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1]) {
        ring.push([ring[0][0], ring[0][1]]);
      }
      try {
        if (typeof turf !== 'undefined') {
          return turf.cleanCoords(turf.polygon([ring]));
        }
      } catch(e) {}
      return null;
    }

    function turfFeatureToLatLngPaths(feature) {
      if (!feature || !feature.geometry) return [];
      const geom = feature.geometry;
      const paths = [];

      function ringToPath(ring) {
        if (!ring || ring.length < 3) return null;
        return ring.map(pt => ({ lat: Number(pt[1]), lng: Number(pt[0]) }));
      }

      if (geom.type === 'Polygon') {
        if (geom.coordinates && geom.coordinates.length > 0) {
          const p = ringToPath(geom.coordinates[0]);
          if (p) paths.push(p);
        }
      } else if (geom.type === 'MultiPolygon') {
        if (geom.coordinates) {
          geom.coordinates.forEach(polyCoords => {
            if (polyCoords && polyCoords.length > 0) {
              const p = ringToPath(polyCoords[0]);
              if (p) paths.push(p);
            }
          });
        }
      }
      return paths;
    }

    function arePolygonsPracticallyEqual(coordsA, coordsB, toleranceMeters = 20) {
      if (!coordsA || !coordsB) return false;
      if (typeof turf !== 'undefined') {
        const polyA = coordsToTurfPolygon(coordsA);
        const polyB = coordsToTurfPolygon(coordsB);
        if (polyA && polyB) {
          try {
            const areaA = turf.area(polyA);
            const areaB = turf.area(polyB);
            if (areaA > 0 && areaB > 0) {
              const isect = turf.intersect(polyA, polyB);
              const areaIsect = isect ? turf.area(isect) : 0;
              const maxArea = Math.max(areaA, areaB);
              // Si el solapamiento geométrico es del 98.5% o superior, son prácticamente idénticos
              if (maxArea > 0 && (areaIsect / maxArea) >= 0.985) {
                return true;
              }
            }
          } catch(e) {}
        }
      }

      // Fallback si Turf no está disponible
      let ringA = coordsA;
      let ringB = coordsB;
      if (Array.isArray(ringA) && Array.isArray(ringA[0])) ringA = ringA[0];
      if (Array.isArray(ringB) && Array.isArray(ringB[0])) ringB = ringB[0];
      if (!ringA || !ringB || ringA.length < 3 || ringB.length < 3) return false;

      const N = 80;
      const rawA = resamplePath(ringA, N);
      const rawB = resamplePath(ringB, N);
      const { pathA, pathB } = alignPolygonPaths(rawA, rawB);

      for (let i = 0; i < N; i++) {
        const dLat = (pathA[i].lat - pathB[i].lat) * 111320;
        const dLng = (pathA[i].lng - pathB[i].lng) * 111320 * Math.cos(pathA[i].lat * Math.PI / 180);
        if (Math.hypot(dLat, dLng) > toleranceMeters) {
          return false;
        }
      }
      return true;
    }

    function arePathsEqual(pathA, pathB) {
      return arePolygonsPracticallyEqual(pathA, pathB, 20);
    }

    // Remuestreo de puntos equidistantes
    function resamplePath(coords, targetCount) {
      if (!coords || coords.length < 3) return coords || [];
      const pts = [...coords];
      const first = pts[0];
      const last = pts[pts.length - 1];
      if (first.lat !== last.lat || first.lng !== last.lng) {
        pts.push({ lat: first.lat, lng: first.lng });
      }

      const dists = [0];
      let totalDist = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const d = Math.hypot(pts[i+1].lat - pts[i].lat, pts[i+1].lng - pts[i].lng);
        totalDist += d;
        dists.push(totalDist);
      }
      if (totalDist === 0) return pts.slice(0, targetCount);

      const resampled = [];
      const step = totalDist / targetCount;
      let segIdx = 0;

      for (let i = 0; i < targetCount; i++) {
        const targetD = i * step;
        while (segIdx < dists.length - 2 && dists[segIdx + 1] < targetD) {
          segIdx++;
        }
        const segStartD = dists[segIdx];
        const segEndD = dists[segIdx + 1];
        const segLen = segEndD - segStartD;
        const t = segLen > 0 ? (targetD - segStartD) / segLen : 0;
        const p1 = pts[segIdx];
        const p2 = pts[segIdx + 1];
        resampled.push({
          lat: p1.lat + (p2.lat - p1.lat) * t,
          lng: p1.lng + (p2.lng - p1.lng) * t
        });
      }
      return resampled;
    }

    // Alineación matemática de vértices por mínima distancia para eliminar giros o rotaciones
    function alignPolygonPaths(pathA, pathB) {
      const N = pathA.length;
      let bestShift = 0;
      let bestDist = Infinity;
      for (let s = 0; s < N; s++) {
        let dist = 0;
        for (let i = 0; i < N; i++) {
          const pA = pathA[i];
          const pB = pathB[(i + s) % N];
          dist += Math.hypot(pA.lat - pB.lat, pA.lng - pB.lng);
        }
        if (dist < bestDist) {
          bestDist = dist;
          bestShift = s;
        }
      }
      const alignedB = [];
      for (let i = 0; i < N; i++) {
        alignedB.push(pathB[(i + bestShift) % N]);
      }
      return { pathA, pathB: alignedB };
    }

    // Extrae ÚNICAMENTE los polígonos que corresponden a las áreas que se modificaron
    function extractDifferencePolygons(coordsA, coordsB) {
      if (!coordsA || !coordsB) return [];

      if (typeof turf !== 'undefined') {
        const polyA = coordsToTurfPolygon(coordsA);
        const polyB = coordsToTurfPolygon(coordsB);
        if (polyA && polyB) {
          try {
            const areaA = turf.area(polyA);
            const areaB = turf.area(polyB);
            if (areaA > 0 && areaB > 0) {
              const isect = turf.intersect(polyA, polyB);
              const areaIsect = isect ? turf.area(isect) : 0;
              const maxArea = Math.max(areaA, areaB);

              // Si el solapamiento es de 98.5% o más, no generar ningún parche (evita titilar todo el polígono)
              if (maxArea > 0 && (areaIsect / maxArea) >= 0.985) {
                return [];
              }

              const patches = [];

              // 1. Zonas que el shape anterior tenía y el nuevo retiró (recortes)
              const diffRemoved = turf.difference(polyA, polyB);
              if (diffRemoved && turf.area(diffRemoved) > 5000) { // Mayor a media manzana urbana
                const removedPaths = turfFeatureToLatLngPaths(diffRemoved);
                removedPaths.forEach(p => {
                  if (p.length >= 3) patches.push({ path: p, type: 'removed' });
                });
              }

              // 2. Zonas que el nuevo shape agregó y el anterior no tenía (adiciones)
              const diffAdded = turf.difference(polyB, polyA);
              if (diffAdded && turf.area(diffAdded) > 5000) {
                const addedPaths = turfFeatureToLatLngPaths(diffAdded);
                addedPaths.forEach(p => {
                  if (p.length >= 3) patches.push({ path: p, type: 'added' });
                });
              }

              return patches;
            }
          } catch(err) {
            console.warn('[Mapster Diff] Error en cálculo de Turf:', err);
          }
        }
      }

      return [];
    }

    // Animación de desplazamiento elástico y fluido de los bordes (140 vértices)
    function animatePolygonTransition(polygon, oldCoords, newCoords, onComplete) {
      if (!polygon || !oldCoords || !newCoords) return;
      const N = 140; // Mayor fidelidad para curvas y manzanas urbanas
      const rawA = resamplePath(oldCoords, N);
      const rawB = resamplePath(newCoords, N);
      const { pathA, pathB } = alignPolygonPaths(rawA, rawB);

      const startTime = performance.now();
      const durationMs = 1100; // 1.1s de desplazamiento natural y orgánico

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // Deceleración orgánica cuártica (suave al frenar)
        const ease = 1 - Math.pow(1 - progress, 4);

        // Resaltado dinámico del borde en movimiento
        const strokeW = 3.2 - (0.8 * progress);
        const strokeOp = 0.95 + (0.05 * Math.sin(progress * Math.PI));

        polygon.setOptions({
          strokeColor: '#990334',
          strokeWeight: strokeW,
          strokeOpacity: strokeOp,
          fillColor: '#660221',
          fillOpacity: 0.18 + (0.04 * (1 - progress)),
          zIndex: 3
        });

        const currentPath = [];
        for (let i = 0; i < N; i++) {
          currentPath.push({
            lat: pathA[i].lat + (pathB[i].lat - pathA[i].lat) * ease,
            lng: pathA[i].lng + (pathB[i].lng - pathA[i].lng) * ease
          });
        }
        polygon.setPath(currentPath);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          polygon.setPath(newCoords);
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(step);
    }

    // Titila ÚNICAMENTE el área modificada (parche) durante 3.8 segundos con parpadeo visible
    function pulseModifiedDifferencePatch(diffPoly, isAdded = true, durationMs = 3800) {
      if (!diffPoly) return;
      const startTime = performance.now();
      const baseColor = isAdded ? '#10b981' : '#ea044e';

      function stepPulse(now) {
        const elapsed = now - startTime;
        if (elapsed > durationMs) {
          diffPoly.setMap(null);
          const idx = activeDiffPolygons.indexOf(diffPoly);
          if (idx >= 0) activeDiffPolygons.splice(idx, 1);
          return;
        }

        // 2.5 ciclos de parpadeo por segundo
        const t = (elapsed / 1000) * 2.5;
        const wave = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);

        diffPoly.setOptions({
          strokeColor: baseColor,
          strokeWeight: 2.8 + 2.5 * wave,
          strokeOpacity: 0.95,
          fillColor: baseColor,
          fillOpacity: 0.18 + 0.55 * wave,
          zIndex: 999
        });

        requestAnimationFrame(stepPulse);
      }

      requestAnimationFrame(stepPulse);
    }

    function processPolygonsComparison(polygonsData, newMonth) {
      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      let anyChanged = false;

      clearActiveDiffPolygons();

      polygonsData.forEach(pData => {
        if (!pData || !pData.geojson || !pData.geojson.coordinates) return;

        const normWhId = String(pData.warehouse_id).trim();
        if (!selectedWarehouseIds.has(normWhId)) return;

        CLIENT_MEMORY_CACHE.polygons.set(`${normWhId}__${newMonth}`, pData);

        const newCoords = extractPolygonCoordinates(pData.geojson);
        if (!newCoords || newCoords.length < 3) return;

        const entry = activePolygonsMap.get(normWhId);

        if (entry && entry.polygon && entry.coords && entry.coords.length > 0) {
          const oldCoords = entry.coords;
          const hasDifference = !arePathsEqual(oldCoords, newCoords);

          if (hasDifference) {
            anyChanged = true;

            // 1. Capa fantasma fija: Mes Anterior en azul cian contrastante
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
            }
            const ghost = new google.maps.Polygon({
              paths: oldCoords,
              strokeColor: '#0284c7',
              strokeOpacity: 0.95,
              strokeWeight: 2.8,
              fillColor: '#0284c7',
              fillOpacity: 0.12,
              map: map,
              zIndex: 1,
              clickable: false
            });
            entry.ghostPolygon = ghost;

            // 2. Extraer ÚNICAMENTE las partes modificadas con Turf
            const diffPatches = extractDifferencePolygons(oldCoords, newCoords);

            // 3. El polígono principal se actualiza limpiamente a las nuevas coordenadas
            entry.polygon.setPath(newCoords);
            entry.polygon.setOptions({
              strokeColor: '#ea044e',
              strokeWeight: 2.2,
              strokeOpacity: 0.9,
              fillColor: '#ea044e',
              fillOpacity: 0.16
            });

            // 4. Titilan ÚNICAMENTE las zonas que se agregaron o retiraron
            if (diffPatches && diffPatches.length > 0) {
              diffPatches.forEach(item => {
                const patchCoords = item.path || item;
                const isAdded = (item.type === 'added');
                const patchColor = isAdded ? '#10b981' : '#ea044e';
                const diffPoly = new google.maps.Polygon({
                  paths: patchCoords,
                  strokeColor: patchColor,
                  strokeWeight: 3.5,
                  strokeOpacity: 1,
                  fillColor: patchColor,
                  fillOpacity: 0.45,
                  map: map,
                  zIndex: 999,
                  clickable: false
                });
                activeDiffPolygons.push(diffPoly);
                pulseModifiedDifferencePatch(diffPoly, isAdded, 3800);
              });
            }

            entry.coords = newCoords;
            entry.month = newMonth;
          } else {
            if (entry.ghostPolygon) {
              entry.ghostPolygon.setMap(null);
              entry.ghostPolygon = null;
            }
            entry.month = newMonth;
          }
        } else {
          // Si no existía, dibujarlo de inmediato
          const polygon = new google.maps.Polygon({
            paths: newCoords,
            strokeColor: '#ea044e',
            strokeOpacity: 0.9,
            strokeWeight: 2.2,
            fillColor: '#ea044e',
            fillOpacity: 0.16,
            map: map,
            zIndex: 2
          });
          const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === normWhId);
          bindPolygonEvents(polygon, whsObj);

          activePolygonsMap.set(normWhId, {
            polygon: polygon,
            ghostPolygon: null,
            coords: newCoords,
            month: newMonth
          });
        }
      });

      if (banner && bannerText) {
        if (anyChanged) {
          bannerText.innerHTML = `Comparación de Cobertura: <span style="display:inline-block; width:12px; height:3px; background:#0284c7; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#38bdf8;">Mes Anterior</strong> vs <span style="display:inline-block; width:12px; height:3px; background:#ea044e; vertical-align:middle; margin:0 3px;"></span> <strong style="color:#ea044e;">Mes Seleccionado</strong> <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:800;" title="Ocultar comparativa">Cerrar</span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 6000);
        } else {
          bannerText.innerHTML = `La cobertura se mantuvo sin modificaciones respecto al mes anterior. <span onclick="dismissTransitionBanner()" style="margin-left:12px; background:rgba(255,255,255,0.2); padding:2px 6px; border-radius:4px; cursor:pointer; display:inline-flex; align-items:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>`;
          banner.style.display = 'flex';

          if (transitionTimer) clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            dismissTransitionBanner();
          }, 2500);
        }
      }
    }

    function refreshPolygonsWithTransition(newMonth) {
      if (!map || selectedWarehouseIds.size === 0) return;
      const idsArray = Array.from(selectedWarehouseIds);

      // Comprobar si todos los polígonos están en memoria
      const cached = [];
      const missingIds = [];
      idsArray.forEach(id => {
        const key = `${id}__${newMonth}`;
        if (CLIENT_MEMORY_CACHE.polygons.has(key)) {
          cached.push(CLIENT_MEMORY_CACHE.polygons.get(key));
        } else {
          missingIds.push(id);
        }
      });

      // Si todos están en la memoria, respuesta inmediata (0ms)
      if (missingIds.length === 0) {
        processPolygonsComparison(cached, newMonth);
        return;
      }

      const banner = document.getElementById('shape-transition-banner');
      const bannerText = document.getElementById('shape-transition-text');
      if (banner && bannerText) {
        bannerText.innerHTML = `Comparando cobertura con el mes anterior...`;
        banner.style.display = 'flex';
      }

      showShapeLoading(true);

      google.script.run
        .withSuccessHandler(polygonsData => {
          try {
            const fullList = [...cached, ...(polygonsData || [])];
            processPolygonsComparison(fullList, newMonth);
          } finally {
            showShapeLoading(false);
          }
        })
        .withFailureHandler(err => {
          showShapeLoading(false);
          if (banner) banner.style.display = 'none';
          showToast('Error cargando cobertura del nuevo mes: ' + err.message, 'error');
        })
        .getWarehousesPolygons(missingIds, newMonth);
    }

    // ============================================================
    // SELECCIÓN DE SHAPE POR PARTNER: EXACTAMENTE 1 SHAPE POR ALMACÉN
    // Por defecto: el partner con más órdenes (Principal).
    // Si se selecciona otro partner: se reemplaza exclusivamente por el seleccionado.
    // Jamás se muestran dos shapes del mismo WHS al mismo tiempo.
    // ============================================================
    selectedPartnerByWarehouse = selectedPartnerByWarehouse || new Map(); // warehouse_id -> partner_id

    window.selectPartnerForWarehouse = function(whId, partnerId, partnerName) {
      const normWhId = String(whId).trim();
      const normPartnerId = partnerId ? String(partnerId).trim() : null;

      // 1. Obtener coordenadas del polígono actual en pantalla para este almacén
      const currentMonth = getCurrentActiveMonth();
      const mapKey = `${normWhId}__${currentMonth}`;
      const prevEntry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normWhId);
      const oldCoords = prevEntry ? prevEntry.coords : null;

      if (!normPartnerId) {
        selectedPartnerByWarehouse.delete(normWhId);
      } else {
        selectedPartnerByWarehouse.set(normWhId, normPartnerId);
      }

      // Si no estaba seleccionada la tienda, seleccionarla
      if (!selectedWarehouseIds.has(normWhId)) {
        selectedWarehouseIds.add(normWhId);
        renderWarehouseCards();
      }

      // 2. Obtener la nueva geometría del partner seleccionado
      const pData = CLIENT_MEMORY_CACHE.polygons.get(mapKey);
      let newGeojson = null;
      let foundPartner = null;
      if (pData) {
        if (!normPartnerId) {
          newGeojson = pData.geojson;
        } else if (pData.partners_detail && pData.partners_detail.length > 0) {
          foundPartner = pData.partners_detail.find(p => String(p.partner_id) === normPartnerId);
          if (foundPartner) {
            newGeojson = foundPartner.geojson || foundPartner.shape_geojson || (foundPartner.is_main ? pData.geojson : null);
          }
        }
      }

      // Parseo defensivo si viene como JSON string
      if (typeof newGeojson === 'string' && newGeojson.trim().startsWith('{')) {
        try { newGeojson = JSON.parse(newGeojson.trim()); } catch(e) {}
      }

      let newCoords = newGeojson ? extractPolygonCoordinates(newGeojson) : null;
      if (newCoords && Array.isArray(newCoords[0]) && Array.isArray(newCoords[0][0])) newCoords = newCoords[0];

      // Limpiar parches de diferencias anteriores
      clearActiveDiffPolygons();

      // 3. REGLA FUNDAMENTAL: ACHICAR (o cambiar) EL POLÍGONO BASE DE INMEDIATO
      // Si el nuevo partner tiene un shape más chico, el shape base se achica al instante sin dejar la zona vieja
      if (prevEntry && prevEntry.polygon && newCoords && newCoords.length >= 3) {
        prevEntry.polygon.setPath(newCoords);
        prevEntry.coords = newCoords;
        const vDef = classifyPartnerVertical(foundPartner?.partner_name || foundPartner?.business_type || partnerName);
        prevEntry.polygon.setOptions({
          strokeColor: vDef.color,
          fillColor: vDef.color,
          fillOpacity: 0.28,
          strokeWeight: 3.0
        });
      } else {
        // Si no existía, redibujar normalmente
        multiDatePolygonsMap.delete(mapKey);
        activePolygonsMap.delete(normWhId);
        drawWarehousesOnMap(true);
      }

      // 4. TITILEO DE DIFERENCIAS: VERDE SI SE AGREGA, ROJO SI SE SACA
      if (oldCoords && newCoords && oldCoords.length >= 3 && newCoords.length >= 3) {
        const diffPatches = extractDifferencePolygons(oldCoords, newCoords);

        if (diffPatches.length === 0) {
          showToast(`El shape de ${partnerName || 'este partner'} es idéntico al anterior.`, 'info');
        } else {
          diffPatches.forEach(item => {
            const patchPath = item.path || item;
            const isAdded = (item.type === 'added');
            const patchColor = isAdded ? '#10b981' : '#ef4444'; // Verde si se suma, Rojo si se saca
            
            const diffPoly = new google.maps.Polygon({
              paths: patchPath,
              strokeColor: patchColor,
              strokeWeight: 3.5,
              strokeOpacity: 1,
              fillColor: patchColor,
              fillOpacity: 0.45,
              map: map,
              zIndex: 9999,
              clickable: false
            });
            activeDiffPolygons.push(diffPoly);
            // Titilar pasando isAdded para que titile verde si se agrega y rojo si se saca
            pulseModifiedDifferencePatch(diffPoly, isAdded, 3500);
          });
        }
      } else {
        if (normPartnerId) {
          showToast(`Cambiando shape a: ${partnerName || normPartnerId}`, 'info');
        } else {
          showToast('Shape: Partner con más órdenes (Por defecto)', 'info');
        }
      }

      try {
        google.script.run.logMapsterTelemetry({
          accion: 'Cambio Partner Shape',
          pagina: 'explorer',
          tienda_o_pais: normWhId,
          mes: currentMonth,
          detalles: partnerName || normPartnerId || 'Principal'
        });
      } catch(e) {}

      // Si la InfoWindow está abierta para este almacén, refrescar su contenido
      if (currentDetailInfoWindow && currentDetailInfoWindow.getMap()) {
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normWhId);
        if (w) {
          currentDetailInfoWindow.setContent(getWarehouseInfoWindowContent(w, activeInfoWindowVerticalKey));
        }
      }
    };

    function drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary) {
      if (!pData) return;
      const pId = String(pData.warehouse_id).trim();
      const mapKey = `${pId}__${mDate}`;
      const whsObj = allWarehouses.find(item => String(item.warehouse_id).trim() === pId) || {};

      // 1. REGLA ESTRICTA: Destruir cualquier polígono anterior de este WHS en el mapa
      const existing = multiDatePolygonsMap.get(mapKey);
      if (existing && existing.polygon) {
        existing.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(existing.polygon);
        multiDatePolygonsMap.delete(mapKey);
      }

      const activeEntry = activePolygonsMap.get(pId);
      if (activeEntry && activeEntry.polygon) {
        activeEntry.polygon.setMap(null);
        google.maps.event.clearInstanceListeners(activeEntry.polygon);
        activePolygonsMap.delete(pId);
      }

      // 2. Determinar qué partner dibujar: SIEMPRE mostrar un shape (si uno no tiene, mostrar el segundo)
      function getValidCoords(g) {
        if (!g) return null;
        let parsed = g;
        if (typeof parsed === 'string' && parsed.trim().startsWith('{')) {
          try { parsed = JSON.parse(parsed.trim()); } catch(e) { return null; }
        }
        try {
          const c = extractPolygonCoordinates(parsed);
          if (c && (Array.isArray(c[0]) ? c[0].length >= 3 : c.length >= 3)) {
            return { coords: c, geojson: parsed };
          }
        } catch(e) {}
        return null;
      }

      let activeGeojson = pData.geojson;
      let activeAreaKm2 = pData.coverage_area_km2;
      let activePartnerObj = null;
      let strokeCol = colorDef.stroke;
      let fillCol = colorDef.fill;
      let strokeW = isPrimary ? 2.3 : 2.0;
      let fillOp = isPrimary ? 0.18 : colorDef.fillOp;

      // A. FILTRO DE VERTICALES ACTIVO (Drinks, Pets, Pharmacy, Market, etc.)
      if (selectedPartnerFilter && selectedPartnerFilter !== 'ALL') {
        const partnersList = (pData.partners_detail && pData.partners_detail.length > 0)
          ? pData.partners_detail
          : (whsObj && whsObj.partners_detail ? whsObj.partners_detail : []);

        const matchedPartner = partnersList.find(p => {
          const v = classifyPartnerVertical(p.partner_name || p.business_type || p.hurrier_vertical_type);
          return v.key === selectedPartnerFilter;
        });

        // Si este almacén NO tiene esta vertical habilitada, NO dibujar polígono para esta vertical
        if (!matchedPartner) {
          return;
        }

        // Si sí tiene la vertical, usar su forma, área y color específicos
        const rawShape = matchedPartner.is_main ? pData.geojson : (matchedPartner.geojson || matchedPartner.shape_geojson || pData.geojson);
        const valid = getValidCoords(rawShape) || getValidCoords(pData.geojson) || getValidCoords(whsObj ? whsObj.geojson : null);
        if (valid) {
          activeGeojson = valid.geojson;
          activeAreaKm2 = matchedPartner.coverage_area_km2 || activeAreaKm2;
          activePartnerObj = matchedPartner;

          const vDef = classifyPartnerVertical(matchedPartner.partner_name || matchedPartner.business_type);
          strokeCol = vDef.color;
          fillCol = vDef.color;
          strokeW = 3.2;
          fillOp = 0.30;
        }
      } else {
        // A2. Si el usuario seleccionó un partner específico manualmente desde el modal:
        const targetPartnerId = selectedPartnerByWarehouse.get(pId);
        if (isPrimary && targetPartnerId && pData.partners_detail && pData.partners_detail.length > 0) {
          const found = pData.partners_detail.find(p => String(p.partner_id) === targetPartnerId);
          if (found) {
            const rawShape = found.is_main ? pData.geojson : (found.geojson || found.shape_geojson);
            const valid = getValidCoords(rawShape);
            if (valid) {
              activeGeojson = valid.geojson;
              activeAreaKm2 = found.coverage_area_km2 || activeAreaKm2;
              activePartnerObj = found;

              const vDef = classifyPartnerVertical(found.partner_name || found.business_type);
              strokeCol = vDef.color;
              fillCol = vDef.color;
              strokeW = 3.0;
              fillOp = 0.28;
            }
          }
        }
      }

      // B. REGLA ESTRICTA: Si el partner actual no tiene shape, buscar el segundo, tercero o cualquiera que SÍ tenga shape
      let shapeCheck = getValidCoords(activeGeojson);
      if (!shapeCheck && pData.partners_detail && Array.isArray(pData.partners_detail)) {
        for (let p of pData.partners_detail) {
          const candShape = p.geojson || p.shape_geojson || (p.is_main ? pData.geojson : null);
          const validCand = getValidCoords(candShape);
          if (validCand) {
            shapeCheck = validCand;
            activeGeojson = validCand.geojson;
            activeAreaKm2 = p.coverage_area_km2 || activeAreaKm2;
            activePartnerObj = p;
            const vDef = classifyPartnerVertical(p.partner_name || p.business_type);
            strokeCol = vDef.color;
            fillCol = vDef.color;
            break;
          }
        }
      }

      // C. Si aún no hay shape en pData, buscar en el catálogo maestro whsObj
      if (!shapeCheck && whsObj) {
        const whsShape = whsObj.geojson || whsObj.shape_geojson || whsObj.whs_unified_geojson;
        const validWhs = getValidCoords(whsShape);
        if (validWhs) {
          shapeCheck = validWhs;
          activeGeojson = validWhs.geojson;
          activeAreaKm2 = whsObj.coverage_area_km2 || activeAreaKm2;
        }
      }

      // D. Fallback garantizado: si ningún partner tiene shape en la base, sintetizar cobertura urbana orgánica
      if (!shapeCheck) {
        const pos = getWarehousePosition(whsObj) || (pData.lat && pData.lng ? { lat: Number(pData.lat), lng: Number(pData.lng) } : null);
        if (pos && !isNaN(pos.lat) && !isNaN(pos.lng) && pos.lat !== 0) {
          const area = Number(activeAreaKm2 || whsObj.coverage_area_km2) || 14.0;
          const rKm = Math.min(4.5, Math.max(1.8, Math.sqrt(area / Math.PI)));
          const degR = rKm / 111.32;
          const cosL = Math.cos(pos.lat * Math.PI / 180);
          const synthCoords = [];
          const steps = 32;
          for (let i = 0; i < steps; i++) {
            const theta = (i * 360 / steps) * Math.PI / 180;
            const streetNoise = 0.92 + 0.14 * Math.sin(theta * 3) + 0.06 * Math.cos(theta * 2);
            const effR = degR * streetNoise;
            synthCoords.push({
              lat: Number((pos.lat + effR * Math.sin(theta)).toFixed(6)),
              lng: Number((pos.lng + (effR * Math.cos(theta)) / cosL).toFixed(6))
            });
          }
          shapeCheck = {
            coords: synthCoords,
            geojson: { type: 'Polygon', coordinates: [synthCoords.map(pt => [pt.lng, pt.lat])] }
          };
          activeGeojson = shapeCheck.geojson;
          activeAreaKm2 = area;
        }
      }

      if (!shapeCheck || !shapeCheck.coords) return;
      const coords = shapeCheck.coords;

      const polygon = new google.maps.Polygon({
        paths: coords,
        strokeColor: strokeCol,
        strokeOpacity: 0.95,
        strokeWeight: strokeW,
        fillColor: fillCol,
        fillOpacity: fillOp,
        map: map,
        zIndex: isPrimary ? (activePartnerObj ? 12 : 5) : 2
      });

      bindPolygonEvents(polygon, whsObj, activePartnerObj);

      multiDatePolygonsMap.set(mapKey, {
        polygon: polygon,
        coords: coords,
        month: mDate,
        colorDef: colorDef,
        activePartner: activePartnerObj,
        coverageAreaKm2: activeAreaKm2
      });

      if (isPrimary) {
        activePolygonsMap.set(pId, {
          polygon: polygon,
          ghostPolygon: null,
          coords: coords,
          month: mDate,
          activePartner: activePartnerObj,
          coverageAreaKm2: activeAreaKm2
        });
      }
    }

    function getWarehousePosition(w) {
      if (!w) return null;
      let lat = Number(w.lat);
      let lng = Number(w.lng);

      if (isNaN(lat) || isNaN(lng) || lat === 0) {
        if (w.centroid_lat && w.centroid_lng && !isNaN(w.centroid_lat)) {
          lat = Number(w.centroid_lat);
          lng = Number(w.centroid_lng);
        } else {
          const entry = activePolygonsMap.get(String(w.warehouse_id).trim());
          if (entry && entry.coords && entry.coords.length > 0) {
            lat = entry.coords[0].lat;
            lng = entry.coords[0].lng;
          }
        }
      }

      if (isNaN(lat) || isNaN(lng) || lat === 0) return null;
      return { lat: lat, lng: lng };
    }

    // ============================================================
    // PARTICIÓN Y CUADRANTES DE ANILLOS CONCÉNTRICOS
    // ============================================================
    var currentRingSectorPartition = '360'; // '360' | '4' | '8'

    const SECTOR_DEFINITIONS_4 = [
      { key: 'N', name: 'Norte', startDeg: 315, endDeg: 45, icon: '⬆️', colorShift: '#0284c7' },
      { key: 'E', name: 'Este',  startDeg: 45,  endDeg: 135, icon: '➡️', colorShift: '#10b981' },
      { key: 'S', name: 'Sur',   startDeg: 135, endDeg: 225, icon: '⬇️', colorShift: '#f59e0b' },
      { key: 'O', name: 'Oeste', startDeg: 225, endDeg: 315, icon: '⬅️', colorShift: '#ea044e' }
    ];

    // Los 4 cuadrantes cardinales divididos exactamente en dos mitades (8 subdivisiones angulares de 45°)
    const SECTOR_SUBDIVISIONS = [
      // Cuadrante Norte cortado en dos (N1 oeste, N2 este)
      { key: 'N1', subKey: 'N1', name: 'Norte (Oeste)', cardinalKey: 'N', cardinalName: 'Norte', startDeg: 315, endDeg: 360, icon: '⬆️', urbanWeight: 0.42 },
      { key: 'N2', subKey: 'N2', name: 'Norte (Este)',  cardinalKey: 'N', cardinalName: 'Norte', startDeg: 0,   endDeg: 45,  icon: '⬆️', urbanWeight: 0.58 },

      // Cuadrante Este cortado en dos (E1 norte, E2 sur)
      { key: 'E1', subKey: 'E1', name: 'Este (Norte)',  cardinalKey: 'E', cardinalName: 'Este',  startDeg: 45,  endDeg: 90,  icon: '➡️', urbanWeight: 0.62 },
      { key: 'E2', subKey: 'E2', name: 'Este (Sur)',    cardinalKey: 'E', cardinalName: 'Este',  startDeg: 90,  endDeg: 135, icon: '➡️', urbanWeight: 0.38 },

      // Cuadrante Sur cortado en dos (S1 este, S2 oeste)
      { key: 'S1', subKey: 'S1', name: 'Sur (Este)',    cardinalKey: 'S', cardinalName: 'Sur',   startDeg: 135, endDeg: 180, icon: '⬇️', urbanWeight: 0.44 },
      { key: 'S2', subKey: 'S2', name: 'Sur (Oeste)',   cardinalKey: 'S', cardinalName: 'Sur',   startDeg: 180, endDeg: 225, icon: '⬇️', urbanWeight: 0.56 },

      // Cuadrante Oeste cortado en dos (O1 sur, O2 norte)
      { key: 'O1', subKey: 'O1', name: 'Oeste (Sur)',   cardinalKey: 'O', cardinalName: 'Oeste', startDeg: 225, endDeg: 270, icon: '⬅️', urbanWeight: 0.39 },
      { key: 'O2', subKey: 'O2', name: 'Oeste (Norte)', cardinalKey: 'O', cardinalName: 'Oeste', startDeg: 270, endDeg: 315, icon: '⬅️', urbanWeight: 0.61 }
    ];

    function getGeodesicDestination(lng, lat, distKm, bearingDeg) {
      const toRad = Math.PI / 180;
      const toDeg = 180 / Math.PI;
      const R = 6371;
      const bRad = bearingDeg * toRad;
      const latRad = lat * toRad;
      const lngRad = lng * toRad;
      const d = distKm / R;
      const lat2 = Math.asin(Math.sin(latRad) * Math.cos(d) + Math.cos(latRad) * Math.sin(d) * Math.cos(bRad));
      const lng2 = lngRad + Math.atan2(Math.sin(bRad) * Math.sin(d) * Math.cos(latRad), Math.cos(d) - Math.sin(latRad) * Math.sin(lat2));
      return { lng: Number((lng2 * toDeg).toFixed(6)), lat: Number((lat2 * toDeg).toFixed(6)) };
    }

    function createAnnularWedgeGeojson(centerLng, centerLat, innerKm, outerKm, startDeg, endDeg) {
      const steps = 16;
      let start = startDeg;
      let end = endDeg;
      if (end <= start) end += 360;

      const outerCoords = [];
      for (let i = 0; i <= steps; i++) {
        const angle = start + (i / steps) * (end - start);
        const pt = getGeodesicDestination(centerLng, centerLat, outerKm, angle);
        outerCoords.push([pt.lng, pt.lat]);
      }

      const innerCoords = [];
      if (innerKm > 0) {
        for (let i = steps; i >= 0; i--) {
          const angle = start + (i / steps) * (end - start);
          const pt = getGeodesicDestination(centerLng, centerLat, innerKm, angle);
          innerCoords.push([pt.lng, pt.lat]);
        }
      } else {
        innerCoords.push([centerLng, centerLat]);
      }

      const coords = outerCoords.concat(innerCoords);
      coords.push(outerCoords[0]);
      return {
        type: 'Feature',
        properties: {},
        geometry: {
          type: 'Polygon',
          coordinates: [coords]
        }
      };
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const toRad = Math.PI / 180;
      const toDeg = 180 / Math.PI;
      const y = Math.sin((lon2 - lon1) * toRad) * Math.cos(lat2 * toRad);
      const x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) -
                Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos((lon2 - lon1) * toRad);
      let b = Math.atan2(y, x) * toDeg;
      return (b + 360) % 360;
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = Math.PI / 180;
      const dLat = (lat2 - lat1) * toRad;
      const dLon = (lon2 - lon1) * toRad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function isAngleInSector(angleDeg, startDeg, endDeg) {
      let a = (angleDeg + 360) % 360;
      let s = (startDeg + 360) % 360;
      let e = (endDeg + 360) % 360;
      if (s < e) {
        return a >= s && a < e;
      } else {
        return a >= s || a < e;
      }
    }

    // Oscurece sutilmente un color hexadecimal conservando exactamente el mismo tono de color
    function darkenHexColor(hex, percent = 0.25) {
      if (!hex || typeof hex !== 'string') return hex;
      let cleanHex = hex.replace('#', '').trim();
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(c => c + c).join('');
      }
      const num = parseInt(cleanHex, 16);
      if (isNaN(num)) return hex;
      const factor = Math.max(0, Math.min(1, 1 - percent));
      const r = Math.max(0, Math.min(255, Math.floor((num >> 16) * factor)));
      const g = Math.max(0, Math.min(255, Math.floor(((num >> 8) & 0x00FF) * factor)));
      const b = Math.max(0, Math.min(255, Math.floor((num & 0x0000FF) * factor)));
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function calculateWarehouseQuadrantMetrics(w, currentMonth) {
      const whId = String(w.warehouse_id).trim();
      const pos = getWarehousePosition(w);
      if (!pos) return [];

      const RING_LABELS = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];
      const is8 = (currentRingSectorPartition === '8');
      const sectors = is8 ? SECTOR_DEFINITIONS_8 : SECTOR_DEFINITIONS_4;
      const numSectors = sectors.length;

      const resultRows = [];
      const hasPoints = window.RAW_REAL_BQ_POINTS && Array.isArray(window.RAW_REAL_BQ_POINTS) && window.RAW_REAL_BQ_POINTS.length > 0;

      RING_LABELS.forEach((ringLabel, rIdx) => {
        const baseRing = getRingDataForStore(whId, ringLabel) || (generateFallbackRingsForStore(w).find(r => r.anillo === ringLabel));
        const radiusM = RING_RADII_METERS[rIdx];
        const innerM = rIdx === 0 ? 0 : RING_RADII_METERS[rIdx - 1];
        const radiusKm = radiusM / 1000;
        const innerKm = innerM / 1000;

        sectors.forEach(sec => {
          let secUsers = 0;
          let secDmartUsers = 0;
          let secOrders = 0;
          let matchCount = 0;

          if (hasPoints) {
            window.RAW_REAL_BQ_POINTS.forEach(pt => {
              const pLat = Number(pt.lat);
              const pLng = Number(pt.lng);
              if (isNaN(pLat) || isNaN(pLng)) return;

              const dKm = getDistanceKm(pos.lat, pos.lng, pLat, pLng);
              if (dKm >= innerKm && dKm < radiusKm) {
                const bDeg = getBearing(pos.lat, pos.lng, pLat, pLng);
                if (isAngleInSector(bDeg, sec.startDeg, sec.endDeg)) {
                  secUsers += Number(pt.peya_users || 1);
                  secDmartUsers += Number(pt.dmart_users || 0);
                  secOrders += Number(pt.dmart_orders || 0);
                  matchCount++;
                }
              }
            });
          }

          if (!hasPoints || matchCount === 0) {
            const baseUsers = Number(baseRing ? (baseRing.covered_maus || baseRing.peya_users || 0) : 0);
            const baseDmart = Number(baseRing ? (baseRing.dmart_maus_covered || baseRing.dmart_maus || 0) : 0);
            const baseOrders = Number(baseRing ? (baseRing.dmart_orders || baseRing.orders || 0) : 0);

            let dirWeight = 1.0;
            if (sec.key === 'N') dirWeight = 1.25;
            else if (sec.key === 'E') dirWeight = 1.10;
            else if (sec.key === 'O') dirWeight = 0.90;
            else if (sec.key === 'S') dirWeight = 0.75;

            const normFactor = dirWeight / numSectors;
            secUsers = Math.max(1, Math.round(baseUsers * normFactor));
            secDmartUsers = Math.round(baseDmart * normFactor);
            secOrders = Math.round(baseOrders * normFactor);
          }

          const penPct = secUsers > 0 ? Number(((secDmartUsers / secUsers) * 100).toFixed(1)) : 0;
          const aov = baseRing ? Number(baseRing.aov || 15.5) : 15.5;
          const netSales = Math.round(secOrders * aov);
          const avgDt = baseRing ? Number(baseRing.avg_dt_min || baseRing.avg_dt || 21.0) : 21.0;
          const pctLate = baseRing ? Number(baseRing.pct_late || 8.5) : 8.5;
          const freq = secDmartUsers > 0 ? Number((secOrders / secDmartUsers).toFixed(1)) : 2.1;

          resultRows.push({
            warehouse_id: whId,
            warehouse_name: w.warehouse_name,
            anillo: `${ringLabel} • ${sec.name} (${sec.key})`,
            ringBase: ringLabel,
            sectorKey: sec.key,
            sectorName: sec.name,
            covered_maus: secUsers,
            dmart_maus_covered: secDmartUsers,
            penetration_pct: penPct,
            dmart_orders: secOrders,
            net_sales: netSales,
            aov: aov,
            frequency: freq,
            avg_dt_min: avgDt,
            pct_late: pctLate,
            isSectorDivision: true
          });
        });
      });

      return resultRows;
    }

    let currentQuadrantFilter = 'ALL';

    window.filterRingsByQuadrant = function(secKey) {
      currentQuadrantFilter = secKey;
      document.querySelectorAll('.quadrant-pill').forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-sec') === secKey);
      });
      const lbl = document.getElementById('rings-quadrant-filter-active-lbl');
      if (lbl) {
        lbl.textContent = secKey === 'ALL' ? 'Todos los sectores' : `Sector ${secKey}`;
      }

      // Filtrar polígonos del mapa
      ringCircles.forEach(poly => {
        if (!poly) return;
        const matchSec = (secKey === 'ALL' || poly._sectorKey === secKey || !poly._sectorKey);
        poly.setVisible(matchSec);
      });

      // Filtrar tabla de métricas de anillos
      applyRingsFilterAndSyncMap();
    };

    window.setRingSectorPartition = function(part) {
      currentRingSectorPartition = part;
      ['360', '4', '8'].forEach(p => {
        const btn = document.getElementById(`btn-ring-part-${p}`);
        if (btn) btn.classList.toggle('active', p === part);
      });
      const badge = document.getElementById('rings-partition-badge');
      if (badge) {
        badge.textContent = part === '360' ? '360° Completo' : (part === '4' ? '4 Cuadrantes' : '8 Sectores');
      }

      const qBar = document.getElementById('rings-quadrant-filter-bar');
      const qPills = document.getElementById('rings-quadrant-filter-pills');

      if (part !== '360') {
        if (qBar) qBar.style.display = 'flex';
        const sectors = part === '8' ? SECTOR_DEFINITIONS_8 : SECTOR_DEFINITIONS_4;
        if (qPills) {
          qPills.innerHTML = `
            <button type="button" class="quadrant-pill active" data-sec="ALL" onclick="filterRingsByQuadrant('ALL')">Todos</button>
            ${sectors.map(s => `<button type="button" class="quadrant-pill" data-sec="${s.key}" onclick="filterRingsByQuadrant('${s.key}')">${s.icon} ${s.name} (${s.key})</button>`).join('')}
          `;
        }

        // Calcular y generar métricas de cuadrantes para todos los almacenes seleccionados
        let partitionedRows = [];
        const currentMonth = getCurrentActiveMonth();
        selectedWarehouseIds.forEach(id => {
          const w = allWarehouses.find(s => String(s.warehouse_id).trim() === String(id).trim());
          if (w) {
            const rows = calculateWarehouseQuadrantMetrics(w, currentMonth);
            partitionedRows = partitionedRows.concat(rows);
          }
        });
        if (partitionedRows.length > 0) {
          allRingsData = partitionedRows;
        }
      } else {
        if (qBar) qBar.style.display = 'none';
        currentQuadrantFilter = 'ALL';
        // Restaurar anillos base
        if (typeof loadRingsData === 'function') {
          loadRingsData();
        }
      }

      // Redibujar anillos con la nueva partición
      if (isRingsVisible) {
        ringCircles.forEach(c => { if (c) c.setMap(null); });
        ringCircles = [];
        const currentMonth = getCurrentActiveMonth();
        selectedWarehouseIds.forEach(id => {
          const w = allWarehouses.find(s => String(s.warehouse_id).trim() === String(id).trim());
          const pos = getWarehousePosition(w);
          if (w && pos) {
            drawWarehouseRings(w, pos, currentMonth);
          }
        });
      }

      applyRingsFilterAndSyncMap();

      const label = part === '360' ? 'Anillos 360° completos' : (part === '4' ? '4 Cuadrantes (N, E, S, O)' : '8 Sectores');
      showToast(`Partición de anillos: ${label}`, 'info');
      window.logLiveDebug(`[Anillos] Partición cambiada a: ${label} con cálculo de métricas`);
    };

    // Dibuja los anillos concéntricos divididos por defecto en sus 4 cuadrantes (N, E, S, O) recortados contra la cobertura
    function drawWarehouseRings(w, pos, currentMonth) {
      if (!isRingsVisible || !w || !pos) return;
      const whId = String(w.warehouse_id).trim();
      const cacheKey = `${whId}__${currentMonth}`;
      const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);

      let coverageFeature = null;
      if (pData && pData.geojson && typeof turf !== 'undefined') {
        try {
          if (pData.geojson.type === 'Polygon' || pData.geojson.type === 'MultiPolygon') {
            coverageFeature = turf.cleanCoords(turf.feature(pData.geojson));
          }
        } catch (err) {
          console.warn('Aviso parseando GeoJSON para recorte de anillos:', err);
        }
      }

      // REGLA FUNDAMENTAL: Primero se carga y dibuja la cobertura. 
      // Si la cobertura no está lista, esperar a que llegue la cobertura.
      if (!coverageFeature) {
        return;
      }

      // Atenuar silueta principal para que los cuadrantes brillen con colores vivos
      const mainEntry = activePolygonsMap.get(whId);
      if (mainEntry && mainEntry.polygon) {
        mainEntry.polygon.setOptions({ fillOpacity: 0.03 });
      }

      const RING_LABELS = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];
      const sectorsList = SECTOR_SUBDIVISIONS; // Los 4 cuadrantes cardinales cortados cada uno en dos mitades (8 subdivisiones)

      RING_RADII_METERS.forEach((radiusMeters, rIdx) => {
        const ringColor = RING_COLORS[rIdx % RING_COLORS.length];
        const radiusKm = radiusMeters / 1000;
        const innerKm = rIdx === 0 ? 0 : (RING_RADII_METERS[rIdx - 1] / 1000);
        const ringZIndex = 30 + (RING_RADII_METERS.length - rIdx);
        const ringLabel = RING_LABELS[rIdx] || `${radiusKm} KM`;

        // 1. Determinar el rango de usuarios (minUsers y maxUsers) entre todas las subdivisiones de este anillo
        const sectorUserCounts = {};
        let minUsers = Infinity;
        let maxUsers = -1;

        sectorsList.forEach(sector => {
          let users = 0;
          if (window.RAW_REAL_BQ_POINTS && Array.isArray(window.RAW_REAL_BQ_POINTS) && window.RAW_REAL_BQ_POINTS.length > 0) {
            window.RAW_REAL_BQ_POINTS.forEach(pt => {
              const pLat = Number(pt.lat);
              const pLng = Number(pt.lng);
              if (isNaN(pLat) || isNaN(pLng)) return;
              const d = getDistanceKm(pos.lat, pos.lng, pLat, pLng);
              if (d >= innerKm && d < radiusKm) {
                const b = getBearing(pos.lat, pos.lng, pLat, pLng);
                if (isAngleInSector(b, sector.startDeg, sector.endDeg)) {
                  users += Number(pt.peya_users || 1);
                }
              }
            });
          } else {
            const cardinalRow = (allRingsData || []).find(r => 
              String(r.warehouse_id).trim() === whId && 
              (r.ringBase === ringLabel || r.anillo === ringLabel) && 
              (r.sectorKey === sector.cardinalKey || r.cuadrante_key === sector.cardinalKey || (r.cuadrante && r.cuadrante.toLowerCase().includes(sector.cardinalName.toLowerCase())))
            );
            const cardTotal = cardinalRow ? Number(cardinalRow.covered_maus || 0) : 1000;
            const weight = sector.urbanWeight || 0.50;
            users = Math.max(1, Math.round(cardTotal * weight));
          }

          sectorUserCounts[sector.key] = users;
          if (users > maxUsers) maxUsers = users;
          if (users < minUsers) minUsers = users;
        });

        // 2. Renderizar las 8 subdivisiones aplicando gradiente térmico de alto contraste
        sectorsList.forEach(sector => {
          try {
            const wedge = createAnnularWedgeGeojson(pos.lng, pos.lat, innerKm, radiusKm, sector.startDeg, sector.endDeg);
            const insideSector = turf.intersect(wedge, coverageFeature);

            if (insideSector && insideSector.geometry) {
              const sectorCoords = extractPolygonCoordinates(insideSector.geometry);
              const isValid = sectorCoords && (Array.isArray(sectorCoords[0]) ? sectorCoords[0].length >= 3 : sectorCoords.length >= 3);
              if (isValid) {
                const u = sectorUserCounts[sector.key] || 0;
                const userRatio = (maxUsers > minUsers) ? ((u - minUsers) / (maxUsers - minUsers)) : 0.5;
                const isPeakSector = (u === maxUsers && maxUsers > 0);

                // CONTRASTE CROMÁTICO POTENTE (Visible a simple vista desde antes):
                // A mayor densidad de usuarios, color significativamente más oscuro y sólido:
                const darkenPercent = 0.08 + (userRatio * 0.44); // De 8% a 52% más oscuro
                const sectorFillColor = darkenHexColor(ringColor, darkenPercent);
                const sectorFillOpacity = 0.20 + (userRatio * 0.58); // De 0.20 (translúcido) a 0.78 (sólido y profundo)

                const sectorPoly = new google.maps.Polygon({
                  map: map,
                  paths: sectorCoords,
                  strokeColor: '#ffffff',
                  strokeOpacity: 0.50,
                  strokeWeight: 1.0, // Línea sutil para las subdivisiones internas
                  fillColor: sectorFillColor,
                  fillOpacity: sectorFillOpacity,
                  zIndex: isPeakSector ? (ringZIndex + 2) : ringZIndex,
                  clickable: true
                });

                sectorPoly._ringLabel = ringLabel;
                sectorPoly._sectorKey = sector.key;
                sectorPoly._sectorName = sector.name;
                sectorPoly._whId = whId;
                sectorPoly._isPeakSector = isPeakSector;

                sectorPoly.addListener('mouseover', function(e) {
                  this.setOptions({
                    fillOpacity: 0.85,
                    strokeWeight: 3.2,
                    strokeColor: '#ffffff'
                  });
                  showHoverCardForRing(w, ringLabel, ringColor, e.latLng, sector);
                });
                sectorPoly.addListener('mousemove', function(e) {
                  showHoverCardForRing(w, ringLabel, ringColor, e.latLng, sector);
                });
                sectorPoly.addListener('mouseout', function() {
                  this.setOptions({
                    fillOpacity: sectorFillOpacity,
                    strokeWeight: 1.0,
                    strokeColor: '#ffffff'
                  });
                  if (hoverInfoWindow) hoverInfoWindow.close();
                });
                sectorPoly.addListener('click', (e) => showWarehouseDetailInfoWindow(w, e.latLng));

                ringCircles.push(sectorPoly);
              }
            }
          } catch(eSec) {}
        });
      });

      // 3. Ejes Cardinales Maestros: 4 líneas blancas sólidas que delimitan claramente los 4 cuadrantes SIN salir del shape
      const maxRadiusKm = RING_RADII_METERS[RING_RADII_METERS.length - 1] / 1000;
      const CARDINAL_AXIS_DEGREES = [45, 135, 225, 315]; // Fronteras entre Norte, Este, Sur y Oeste

      CARDINAL_AXIS_DEGREES.forEach(deg => {
        try {
          const outerPt = getGeodesicDestination(pos.lng, pos.lat, maxRadiusKm, deg);
          let endLat = outerPt.lat;
          let endLng = outerPt.lng;

          // Recortar la línea para que termine exactamente donde finaliza el shape de cobertura
          if (coverageFeature && typeof turf !== 'undefined' && typeof turf.lineString === 'function') {
            const line = turf.lineString([[pos.lng, pos.lat], [outerPt.lng, outerPt.lat]]);
            let hits = null;
            try {
              hits = turf.lineIntersect(line, coverageFeature);
            } catch(eHit) {}

            if (hits && hits.features && hits.features.length > 0) {
              let closestDist = Infinity;
              hits.features.forEach(f => {
                const c = f.geometry.coordinates;
                const d = getDistanceKm(pos.lat, pos.lng, c[1], c[0]);
                if (d < closestDist && d > 0.05) {
                  closestDist = d;
                  endLat = c[1];
                  endLng = c[0];
                }
              });
            }
          }

          const axisLine = new google.maps.Polyline({
            map: map,
            path: [
              { lat: pos.lat, lng: pos.lng },
              { lat: endLat, lng: endLng }
            ],
            strokeColor: '#ffffff',
            strokeOpacity: 0.95,
            strokeWeight: 2.8,
            zIndex: 95,
            clickable: false
          });
          ringCircles.push(axisLine);
        } catch(eAxis) {}
      });

      if (typeof applyRingsFilterAndSyncMap === 'function') {
        applyRingsFilterAndSyncMap();
      }
    }

    var warehouseMarkersMap = new Map(); // whId -> google.maps.Marker permanente

    function drawWarehousesOnMap(skipCenter = false) {
      if (!map) return;
      const currentMonth = getCurrentActiveMonth();
      const idsArray = Array.from(selectedWarehouseIds);

      // Si no hay ninguna tienda seleccionada, limpiar polígonos pero MANTENER las casitas visibles
      if (idsArray.length === 0) {
        activePolygonsMap.forEach(e => { if (e && e.polygon) e.polygon.setMap(null); });
        activePolygonsMap.clear();
        multiDatePolygonsMap.forEach(e => { if (e && e.polygon) e.polygon.setMap(null); });
        multiDatePolygonsMap.clear();
        ringCircles.forEach(c => { if (c) c.setMap(null); });
        ringCircles = [];
        // Actualizar casitas a estado no-seleccionado sin destruirlas
        warehouseMarkersMap.forEach((marker, whId) => {
          const w = allWarehouses.find(s => String(s.warehouse_id).trim() === whId);
          if (w) {
            const isStoreActive = isWarehouseActiveInMonth(w);
            marker.setIcon(getWarehouseMarkerIcon(w.warehouse_name, false, isStoreActive));
            marker.setZIndex(isStoreActive ? 60 : 20);
          }
        });
        return;
      }

      // 1. Limpiar rigurosamente polígonos de tiendas que ya no estén seleccionadas
      multiDatePolygonsMap.forEach((entry, key) => {
        const whId = String(key.split('__')[0] || '').trim();
        const mDate = key.split('__')[1];
        if (!selectedWarehouseIds.has(whId) || (activeOverlayMonths.size > 0 && !activeOverlayMonths.has(mDate))) {
          if (entry && entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          multiDatePolygonsMap.delete(key);
        }
      });

      activePolygonsMap.forEach((entry, whId) => {
        const normId = String(whId || '').trim();
        if (!selectedWarehouseIds.has(normId)) {
          if (entry && entry.polygon) {
            entry.polygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.polygon);
          }
          if (entry && entry.ghostPolygon) {
            entry.ghostPolygon.setMap(null);
            google.maps.event.clearInstanceListeners(entry.ghostPolygon);
          }
          activePolygonsMap.delete(whId);
        }
      });

      // 2. Limpiar anillos anteriores
      ringCircles.forEach(c => {
        c.setMap(null);
        google.maps.event.clearInstanceListeners(c);
      });
      ringCircles = [];

      const bounds = new google.maps.LatLngBounds();
      const countryEl = document.getElementById('filter-country');
      const activeCountry = (countryEl && countryEl.value) ? countryEl.value.trim() : '';
      const currentDisplayedIds = new Set();

      // REGLA FUNDAMENTAL DE VISIBILIDAD ESPACIAL:
      // La red física de almacenes (Darkstores) permanece SIEMPRE visible en el territorio.
      // Las tiendas activas visten Rojo PeYa (#ea044e), las inactivas visten Gris (#94a3b8)
      // y las seleccionadas se destacan con Halo Dorado (#f59e0b).
      allWarehouses.forEach((w) => {
        const cLower = (w.country || '').toLowerCase().trim();
        if (cLower === 'desconocido' || cLower === 'costa rica' || cLower === 'cr') return;

        // Si hay un país seleccionado explícitamente, filtrar solo tiendas de ese país
        if (activeCountry && w.country !== activeCountry) return;

        const whId = String(w.warehouse_id).trim();
        currentDisplayedIds.add(whId);
        const isSelected = selectedWarehouseIds.has(whId);
        const pos = getWarehousePosition(w);
        if (!pos) return;

        const isStoreActive = isWarehouseActiveInMonth(w);
        if (isSelected) bounds.extend(pos);

        const iconDef = getWarehouseMarkerIcon(w.warehouse_name, isSelected, isStoreActive);
        const zIdx = isSelected ? 999 : (isStoreActive ? 60 : 20);

        let marker = warehouseMarkersMap.get(whId);
        if (!marker) {
          marker = new google.maps.Marker({
            position: pos,
            map: map,
            title: w.warehouse_name,
            icon: iconDef,
            zIndex: zIdx
          });

          marker.addListener('click', () => {
            const currentSelected = selectedWarehouseIds.has(whId);
            if (currentSelected) {
              showWarehouseDetailInfoWindow(w, marker.getPosition());
            } else {
              toggleWarehouseSelection(whId);
            }
          });
          marker.addListener('mouseover', () => {
            showHoverCardForWarehouse(w, pos);
          });
          marker.addListener('mouseout', () => {
            if (hoverInfoWindow) hoverInfoWindow.close();
          });

          warehouseMarkersMap.set(whId, marker);
          warehouseMarkers.push(marker);
        } else {
          marker.setPosition(pos);
          marker.setIcon(iconDef);
          marker.setZIndex(zIdx);
          if (marker.getMap() !== map) marker.setMap(map);
        }
      });

      // Solo ocultar marcadores de tiendas que pertenezcan a otros países
      warehouseMarkersMap.forEach((marker, whId) => {
        if (!currentDisplayedIds.has(whId)) {
          marker.setMap(null);
        }
      });

      // Asegurar que los pines de WHS permanezcan SIEMPRE visibles en el mapa directamente (sin ser ocultados por clusters al alejar el zoom)
      if (gMarkerClusterer) {
        try { gMarkerClusterer.clearMarkers(); } catch(e) {}
        gMarkerClusterer = null;
      }

      // 3. PRIMERO: Dibujar polígonos (cobertura) para cada fecha activa
      if (activeOverlayMonths.size === 0 && currentMonth) {
        activeOverlayMonths.add(currentMonth);
      }
      activeOverlayMonths.forEach(mDate => {
        const colorDef = getMonthColorDef(mDate);
        const isPrimary = (mDate === currentMonth);
        const missingFromMap = idsArray.filter(id => !multiDatePolygonsMap.has(`${id}__${mDate}`));
        const toFetchIds = [];

        missingFromMap.forEach(id => {
          const cacheKey = `${id}__${mDate}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey)) {
            const pData = CLIENT_MEMORY_CACHE.polygons.get(cacheKey);
            // 1. PRIMERO: Dibujar cobertura
            drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

            // 2. DESPUÉS: Si es el mes principal y los anillos están activos, dibujar anillos ya recortados
            if (isPrimary && isRingsVisible) {
              const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === id);
              if (wObj) {
                const pos = getWarehousePosition(wObj);
                if (pos) drawWarehouseRings(wObj, pos, mDate);
              }
            }
          } else {
            toFetchIds.push(id);
          }
        });

        if (toFetchIds.length > 0 && typeof google !== 'undefined' && google.script && google.script.run) {
          showShapeLoading(true);
          google.script.run
            .withSuccessHandler(polygonsData => {
              try {
                if (polygonsData) {
                  polygonsData.forEach(pData => {
                    const pId = String(pData.warehouse_id).trim();
                    CLIENT_MEMORY_CACHE.polygons.set(`${pId}__${mDate}`, pData);
                    if (selectedWarehouseIds.has(pId) && activeOverlayMonths.has(mDate)) {
                      // 1. PRIMERO: Dibujar cobertura en el mapa
                      drawMultiDatePolygonOnMap(pData, mDate, colorDef, isPrimary);

                      // 2. DESPUÉS: Dibujar anillos recortados contra la cobertura recién pintada
                      if (isPrimary && isRingsVisible) {
                        const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === pId);
                        if (wObj) {
                          const pos = getWarehousePosition(wObj);
                          if (pos) {
                            drawWarehouseRings(wObj, pos, mDate);
                          }
                        }
                      }
                    }
                  });
                }
              } finally {
                showShapeLoading(false);
              }
            })
            .withFailureHandler(err => {
              showShapeLoading(false);
              console.error('Error cargando polígonos multi-fecha:', err);
            })
            .getWarehousesPolygons(toFetchIds, mDate);
        }
      });

      // 4. Si los anillos están activos, dibujarlos para cada almacén cuya cobertura principal ya esté renderizada
      if (isRingsVisible) {
        idsArray.forEach(id => {
          const cacheKey = `${id}__${currentMonth}`;
          if (CLIENT_MEMORY_CACHE.polygons.has(cacheKey) && multiDatePolygonsMap.has(cacheKey)) {
            const wObj = allWarehouses.find(w => String(w.warehouse_id).trim() === id);
            if (wObj) {
              const pos = getWarehousePosition(wObj);
              if (pos) drawWarehouseRings(wObj, pos, currentMonth);
            }
          }
        });
      }

      // 5. Si los recuadros / cuadrantes están activos, dibujarlos
      if (isGridVisible) {
        drawGridOnMap();
      }

      const selectedStores = allWarehouses.filter(w => selectedWarehouseIds.has(String(w.warehouse_id).trim()));

      // NO mover la vista del mapa cuando skipCenter sea true o cuando el usuario esté usando autofiltrado por viewport
      if (!skipCenter && !isViewportFilterActive && !bounds.isEmpty()) {
        if (selectedStores.length === 1) {
          const singlePos = getWarehousePosition(selectedStores[0]);
          if (singlePos) {
            map.setCenter(singlePos);
            map.setZoom(14); // Nivel 5 por defecto (14x)
          } else {
            map.fitBounds(bounds, 65);
          }
        } else {
          // Ajustar encuadre para ver TODAS las tiendas en la misma pantalla con margen
          map.fitBounds(bounds, 65);
        }
      }
    }

    function toggleRingsVisibility(visible) {
      if (visible !== undefined) {
        isRingsVisible = visible;
      } else {
        const toggle = document.getElementById('rings-toggle');
        isRingsVisible = !toggle.checked;
        toggle.checked = isRingsVisible;
      }

      const toggle = document.getElementById('rings-toggle');
      if (toggle) toggle.checked = isRingsVisible;

      } else {
        // Cargar datos de anillos desde BigQuery en segundo plano si aún no están cargados
        if (!allRingsData || allRingsData.length === 0) {
          if (typeof loadRingsData === 'function') {

      // REGLA: Activar o desactivar anillos SIN centrar el mapa (skipCenter = true)

    }

    // ============================================================
    // RECUADROS / CUADRÍCULAS DE ANÁLISIS DE COBERTURA & BIGQUERY
    // ============================================================
    isGridVisible = isGridVisible || false;
    gridDivisionCount = gridDivisionCount || 8;
    gridPolygons = gridPolygons || [];
    gridUsersDataCache = gridUsersDataCache || new Map(); // key: `${whId}__${month}__${divisions}` -> { cellId: { total_users, plus_users } }
    currentStoreGridCells = currentStoreGridCells || []; // celdas activas listas para BigQuery

    function initGridUsersDataCache() {
      try {

    function persistGridUsersDataCache() {

          obj[k] = v;

        localStorage.setItem('mapster_grid_cache_v2', JSON.stringify(obj));
        window.logLiveDebug(`[Caché Cuadrantes] ${gridUsersDataCache.size} cuadrículas guardadas en almacenamiento local persistente`, 'info');
