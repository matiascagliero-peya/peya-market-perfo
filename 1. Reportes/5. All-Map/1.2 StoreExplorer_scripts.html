    function aggregatePointsByStreetBlock(points, zoom) {
      // Escala dinámica del tamaño de celda según el nivel de zoom:
      // Zoom >= 16: ~100m (manzana individual estándar: 0.00095°)
      // Zoom 15:    ~180m (0.0017°)
      // Zoom 14:    ~360m (0.0034°)
      // Zoom 13:    ~700m (0.0068°)
      // Zoom <= 12: ~1500m (0.014°)
      let stepLat = 0.00095;
      if (zoom === 15) stepLat = 0.0017;
      else if (zoom === 14) stepLat = 0.0034;
      else if (zoom === 13) stepLat = 0.0068;
      else if (zoom <= 12) stepLat = 0.014;

      const firstLat = points[0] && points[0].lat ? Number(points[0].lat) : -34.6;
      const cosLat = Math.cos(firstLat * (Math.PI / 180));
      const stepLng = stepLat / Math.max(0.1, Math.abs(cosLat));

      const mapBlocks = new Map();
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const lat = Number(p.lat);
        const lng = Number(p.lng);
        if (isNaN(lat) || isNaN(lng)) continue;

        const bLatIdx = Math.floor(lat / stepLat);
        const bLngIdx = Math.floor(lng / stepLng);
        const key = `${bLatIdx}_${bLngIdx}`;

        let b = mapBlocks.get(key);
        if (!b) {
          b = {
            minLat: bLatIdx * stepLat,
            maxLat: (bLatIdx + 1) * stepLat,
            minLng: bLngIdx * stepLng,
            maxLng: (bLngIdx + 1) * stepLng,
            centerLat: (bLatIdx + 0.5) * stepLat,
            centerLng: (bLngIdx + 0.5) * stepLng,
            users: 0,
            orders: 0
          };
          mapBlocks.set(key, b);
        }
        b.users += Number(p.peya_users || p.rawVal || 1);
        b.orders += Number(p.dmart_orders || 0);
      }
      return Array.from(mapBlocks.values());
    }

    // ============================================================
    // MOTOR CANVAS HEATMAP OVERLAY (OPTIMIZADO AL MÁXIMO ABSOLUTO)
    // Inicialización perezosa (Lazy) para nunca fallar si Google Maps carga asíncronamente
    // ============================================================
    let CanvasHeatmapOverlayClass = null;

    function getCanvasHeatmapOverlayClass() {
      if (CanvasHeatmapOverlayClass) return CanvasHeatmapOverlayClass;
      if (typeof google === 'undefined' || !google.maps || !google.maps.OverlayView) return null;

      class CanvasHeatmapOverlay extends google.maps.OverlayView {
      constructor(dataOrOptions, options = {}) {
        super();
        let pts = [];
        let opts = {};
        if (Array.isArray(dataOrOptions)) {
          pts = dataOrOptions;
          opts = options || {};
        } else if (dataOrOptions && typeof dataOrOptions === 'object') {
          pts = dataOrOptions.data || [];
          opts = dataOrOptions;
        }
        this.points = pts;
        this.opacity = opts.opacity !== undefined ? opts.opacity : 0.85;
        this.gradient = opts.gradient || [
          'rgba(0, 255, 255, 0)',
          'rgba(0, 255, 255, 1)',
          'rgba(0, 191, 255, 1)',
          'rgba(0, 127, 255, 1)',
          'rgba(99, 102, 241, 1)',
          'rgba(79, 70, 229, 1)'
        ];
        this.canvas = null;
        this.ctx = null;
        this.offscreenCanvas = document.createElement('canvas');
        this.offscreenCtx = this.offscreenCanvas.getContext('2d', { willReadFrequently: true });
        this.brushCanvas = document.createElement('canvas');
        this.brushCtx = this.brushCanvas.getContext('2d');
        this._lastBrushRadius = 0;
        this.palette32 = this.createPalette32(this.gradient);
        this.realPalette32 = this.createPalette32([
          'rgba(0,0,0,0)',
          'rgba(2,132,199,0.30)',  // Azul cielo suave inicial
          'rgba(6,182,212,0.60)',  // Cian
          'rgba(16,185,129,0.75)', // Verde Esmeralda
          'rgba(245,158,11,0.85)', // Dorado / Ámbar
          'rgba(234,4,78,0.95)'    // Rojo PeYa (SOLO PICO MÁXIMO)
        ]);
        this.estPalette32 = this.createPalette32([
          'rgba(245,158,11,0)',
          'rgba(251,191,36,0.30)',
          '#fbbf24',
          '#f59e0b',
          '#d97706',
          '#b45309'
        ]);
        if (opts.map) this.setMap(opts.map);
      }

      onAdd() {
        this.canvas = document.createElement('canvas');
        this.canvas.style.position = 'absolute';
        this.canvas.style.top = '0';
        this.canvas.style.left = '0';
        this.canvas.style.pointerEvents = 'none';
        this.canvas.style.opacity = this.opacity;
        this.canvas.style.zIndex = '30';
        this.ctx = this.canvas.getContext('2d');
        const panes = this.getPanes();
        if (panes && panes.overlayLayer) {
          panes.overlayLayer.appendChild(this.canvas);
        }
        this.draw();
      }

      draw() {
        if (!this.canvas || !this.ctx || !this.getMap()) return;
        if (!this.getProjection()) {
          setTimeout(() => this.draw(), 30);
          return;
        }
        if (this._rafId) cancelAnimationFrame(this._rafId);
        this._rafId = requestAnimationFrame(() => {
          this._renderHeatmap();
        });
      }

      _updateBrush(radius) {
        const r = Math.max(8, Math.round(radius));
        const d = r * 2;
        if (this._lastBrushRadius === r && this.brushCanvas.width === d) return;
        this._lastBrushRadius = r;

        this.brushCanvas.width = d;
        this.brushCanvas.height = d;
        this.brushCtx.clearRect(0, 0, d, d);

        const grad = this.brushCtx.createRadialGradient(r, r, 0, r, r, r);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        this.brushCtx.fillStyle = grad;
        this.brushCtx.beginPath();
        this.brushCtx.arc(r, r, r, 0, Math.PI * 2);
        this.brushCtx.fill();
      }

      _renderHeatmap() {
        if (!this.canvas || !this.ctx || !this.getMap()) return;
        const overlayProjection = this.getProjection();
        if (!overlayProjection) return;

        const bounds = this.getMap().getBounds();
        if (!bounds) return;

        const sw = overlayProjection.fromLatLngToDivPixel(bounds.getSouthWest());
        const ne = overlayProjection.fromLatLngToDivPixel(bounds.getNorthEast());
        if (!sw || !ne) return;

        const pad = 60;
        const width = Math.max(10, Math.round(Math.abs(ne.x - sw.x) + pad * 2));
        const height = Math.max(10, Math.round(Math.abs(sw.y - ne.y) + pad * 2));
        const left = Math.round(Math.min(sw.x, ne.x) - pad);
        const top = Math.round(Math.min(sw.y, ne.y) - pad);

        if (this.canvas.width !== width || this.canvas.height !== height) {
          this.canvas.width = width;
          this.canvas.height = height;
          this.canvas.style.width = width + 'px';
          this.canvas.style.height = height + 'px';
        }
        this.canvas.style.left = left + 'px';
        this.canvas.style.top = top + 'px';

        const zoom = (this.getMap().getZoom) ? this.getMap().getZoom() : 13;
        this.ctx.clearRect(0, 0, width, height);

        const pts = this.points;
        const len = pts.length;
        const visiblePoints = [];

        // 1. Filtrado ultra rápido con comparaciones numéricas primitivas
        const bNE = bounds.getNorthEast();
        const bSW = bounds.getSouthWest();
        const minLat = bSW.lat();
        const maxLat = bNE.lat();
        const minLng = bSW.lng();
        const maxLng = bNE.lng();

        for (let i = 0; i < len; i++) {
          const pt = pts[i];
          const pLat = Number(pt.lat !== undefined ? pt.lat : (pt.latLng ? pt.latLng.lat() : 0));
          const pLng = Number(pt.lng !== undefined ? pt.lng : (pt.latLng ? pt.latLng.lng() : 0));
          if (pLat >= minLat && pLat <= maxLat && pLng >= minLng && pLng <= maxLng) {
            visiblePoints.push(pt);
          }
        }

        if (visiblePoints.length === 0) return;

        // -------------------------------------------------------------
        // HEATMAP NORMAL CLÁSICO EQUILIBRADO (NUNCA SE SATURA EN ROJO)
        // -------------------------------------------------------------
        const scale = 0.75;
        const sW = Math.max(1, Math.round(width * scale));
        const sH = Math.max(1, Math.round(height * scale));
        if (this.offscreenCanvas.width !== sW || this.offscreenCanvas.height !== sH) {
          this.offscreenCanvas.width = sW;
          this.offscreenCanvas.height = sH;
        } else {
          this.offscreenCtx.clearRect(0, 0, sW, sH);
        }

        // Radio dinámico adaptativo para que no se empaste al alejar el zoom:
        let baseR = 24;
        if (zoom <= 10) baseR = 12;
        else if (zoom <= 12) baseR = 16;
        else if (zoom <= 14) baseR = 22;
        else if (zoom >= 16) baseR = 30;

        this._updateBrush(baseR);
        const brush = this.brushCanvas;

        // Normalización de intensidad:
        // Evita saturar en rojo cuando hay miles de puntos en pantalla
        const count = Math.max(30, visiblePoints.length);
        const basePointAlpha = Math.min(0.14, Math.max(0.010, 55 / count));

        for (let i = 0; i < visiblePoints.length; i++) {
          const pt = visiblePoints[i];
          const loc = pt.latLng || pt.location || (pt.lat !== undefined ? new google.maps.LatLng(pt.lat, pt.lng) : pt);
          const pixel = overlayProjection.fromLatLngToDivPixel(loc);
          if (!pixel) continue;

          const px = (pixel.x - left) * scale;
          const py = (pixel.y - top) * scale;

          // Usar el valor real y el peso calculados específicamente para la métrica activa
          const rawW = Number(pt.rawVal !== undefined ? pt.rawVal : (pt.weight || 1));
          if (rawW <= 0) continue; // Si para esta métrica no tiene valor (ej. 0 órdenes), NO emite calor

          const wFactor = Math.min(2.5, Math.max(0.7, Math.sqrt(rawW)));
          const ptAlpha = Math.min(0.22, basePointAlpha * wFactor);
          const ptR = baseR * (0.85 + Math.min(0.4, wFactor * 0.15));

          this.offscreenCtx.globalAlpha = ptAlpha;
          this.offscreenCtx.drawImage(brush, px - ptR, py - ptR, ptR * 2, ptR * 2);
        }
        this.offscreenCtx.globalAlpha = 1.0;

        try {
          const imgData = this.offscreenCtx.getImageData(0, 0, sW, sH);
          const data32 = new Uint32Array(imgData.data.buffer);
          const totalPixels = data32.length;
          const palette32 = this.realPalette32 || this.palette32;

          for (let i = 0; i < totalPixels; i++) {
            const pixel = data32[i];
            const alpha = (pixel >> 24) & 0xff;
            if (alpha > 0) {
              data32[i] = palette32[alpha];
            }
          }
          this.offscreenCtx.putImageData(imgData, 0, 0);

          this.ctx.imageSmoothingEnabled = true;
          this.ctx.imageSmoothingQuality = 'high';
          this.ctx.drawImage(this.offscreenCanvas, 0, 0, width, height);
        } catch(e) {}

        // Actualizar la escala de densidad en la barra lateral con los puntos reales en visión
        if (visiblePoints.length > 0 && currentHeatmapLayer && currentHeatmapLayer !== 'none') {
          updateHeatmapScaleLegend(currentHeatmapLayer, null, visiblePoints);
        }
      }

      setPoints(points) {
        this.points = points || [];
        this.draw();
      }

      setGradient(gradient) {
        this.gradient = gradient;
        this.palette32 = this.createPalette32(gradient);
        this.draw();
      }

      createPalette32(gradColors) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 1;
        pCanvas.height = 256;
        const pCtx = pCanvas.getContext('2d');
        const grad = pCtx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        const step = 1 / Math.max(1, gradColors.length - 1);
        gradColors.forEach((c, idx) => {
          grad.addColorStop(Math.min(1, idx * step), c);
        });
        pCtx.fillStyle = grad;
        pCtx.fillRect(0, 0, 1, 256);
        const pData = pCtx.getImageData(0, 0, 1, 256).data;
        return new Uint32Array(pData.buffer);
      }

      onRemove() {
        if (this._rafId) cancelAnimationFrame(this._rafId);
        if (this.canvas && this.canvas.parentNode) {
          this.canvas.parentNode.removeChild(this.canvas);
        }
        this.canvas = null;
        this.ctx = null;
        this.brushCanvas = null;
        this.offscreenCanvas = null;
      }
    }

    CanvasHeatmapOverlayClass = CanvasHeatmapOverlay;
    window.CanvasHeatmapOverlay = CanvasHeatmapOverlay;
    return CanvasHeatmapOverlayClass;
  }

  function createOrUpdateHeatmapLayer(points, opts = {}) {
    const OverlayClass = getCanvasHeatmapOverlayClass();
    if (!OverlayClass) return null;
    if (!gHeatmapLayer || !(gHeatmapLayer instanceof OverlayClass)) {
      if (gHeatmapLayer) {
        try { gHeatmapLayer.setMap(null); } catch(e) {}
      }
      gHeatmapLayer = new OverlayClass(points, Object.assign({ opacity: currentHeatmapOpacity, map: map }, opts));
      gHeatmapLayer.setMap(map);
    } else {
      gHeatmapLayer.setPoints(points);
    }
    if (typeof gHeatmapLayer.draw === 'function') {
      gHeatmapLayer.draw();
    }
    return gHeatmapLayer;
  }

  function renderGoogleHeatmap(data, layerType) {
      try {
        if (gHeatmapLayer) {
          try { gHeatmapLayer.setMap(null); } catch(e) {}
          gHeatmapLayer = null;
        }

        const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;

        if (!map) {
          window.logLiveDebug('Aviso: Objeto map no está disponible aún para Heatmap', 'warn');
          updateHeatmapVerificationUI(false, 'Mapa no inicializado', 0, metricLabel);
          return;
        }

        if (!data || !Array.isArray(data) || data.length === 0) {
          window.logLiveDebug('Aviso: No hay puntos válidos para renderizar el Heatmap', 'warn');
          updateHeatmapVerificationUI(false, 'Sin puntos de coordenadas', 0, metricLabel);
          return;
        }

        // Validar y sanitizar cada punto para prevenir InvalidValueError
        const validPoints = [];
        data.forEach(d => {
          const lat = Number(d.lat);
          const lng = Number(d.lng);
          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            validPoints.push({
              location: new google.maps.LatLng(lat, lng),
              weight: Math.max(1, Math.min(50, Number(d.weight) || 1))
            });
          }
        });

        if (validPoints.length === 0) {
          window.logLiveDebug('ERROR: Todos los puntos del Heatmap fueron descartados por coordenadas inválidas', 'error');
          updateHeatmapVerificationUI(false, 'Coordenadas inválidas (NaN)', 0, metricLabel);
          return;
        }

        const gradients = {
          peya_maus: [
            'rgba(30, 58, 138, 0)',
            'rgba(59, 130, 246, 0.35)',
            'rgba(6, 182, 212, 0.52)',
            'rgba(16, 185, 129, 0.68)',
            'rgba(245, 158, 11, 0.76)',
            'rgba(234, 4, 78, 0.82)'
          ],
          covered_maus: [
            'rgba(109, 40, 217, 0)',
            'rgba(167, 139, 250, 0.35)',
            'rgba(139, 92, 246, 0.52)',
            'rgba(124, 58, 237, 0.68)',
            'rgba(192, 132, 252, 0.78)',
            'rgba(234, 4, 78, 0.82)'
          ],
          dmart_maus: [
            'rgba(159, 18, 57, 0)',
            'rgba(251, 113, 133, 0.35)',
            'rgba(244, 63, 94, 0.52)',
            'rgba(225, 29, 72, 0.68)',
            'rgba(234, 4, 78, 0.80)',
            'rgba(190, 18, 60, 0.82)'
          ],
          penetration: [
            'rgba(15, 118, 110, 0)',
            'rgba(94, 234, 212, 0.35)',
            'rgba(45, 212, 191, 0.52)',
            'rgba(20, 184, 166, 0.68)',
            'rgba(16, 185, 129, 0.78)',
            'rgba(5, 150, 105, 0.82)'
          ],
          seamless_worst: [
            'rgba(254, 240, 138, 0)',
            'rgba(253, 224, 71, 0.40)',
            'rgba(249, 115, 22, 0.60)',
            'rgba(239, 68, 68, 0.75)',
            'rgba(185, 28, 28, 0.82)'
          ],
          seamless_best: [
            'rgba(167, 243, 208, 0)',
            'rgba(110, 231, 183, 0.40)',
            'rgba(52, 211, 153, 0.60)',
            'rgba(16, 185, 129, 0.75)',
            'rgba(5, 150, 105, 0.82)'
          ],
          afv: [
            'rgba(254, 243, 199, 0)',
            'rgba(253, 230, 138, 0.40)',
            'rgba(251, 191, 36, 0.60)',
            'rgba(245, 158, 11, 0.75)',
            'rgba(217, 119, 6, 0.82)'
          ],
          late_orders: [
            'rgba(254, 226, 226, 0)',
            'rgba(252, 165, 165, 0.40)',
            'rgba(248, 113, 113, 0.60)',
            'rgba(239, 68, 68, 0.75)',
            'rgba(185, 28, 28, 0.82)'
          ],
          orders: [
            'rgba(255, 228, 230, 0)',
            'rgba(254, 205, 211, 0.40)',
            'rgba(251, 113, 133, 0.60)',
            'rgba(244, 63, 94, 0.75)',
            'rgba(234, 4, 78, 0.82)'
          ],
          gmv_dmart: [
            'rgba(209, 250, 229, 0)',
            'rgba(110, 231, 183, 0.40)',
            'rgba(52, 211, 153, 0.60)',
            'rgba(16, 185, 129, 0.75)',
            'rgba(5, 150, 105, 0.82)'
          ]
        };

        const currentZoom = (map && map.getZoom) ? map.getZoom() : 14;
        const dynRadius = (typeof window.getDynamicHeatmapRadius === 'function') ? window.getDynamicHeatmapRadius(currentZoom) : 36;

        // Crear HeatmapLayer con array nativo compatible o fallback automático a CanvasHeatmapOverlay
        try {
          if (google.maps.visualization && google.maps.visualization.HeatmapLayer) {
            gHeatmapLayer = new google.maps.visualization.HeatmapLayer({
              data: validPoints,
              map: map,
              radius: dynRadius,
              opacity: currentHeatmapOpacity || 0.55,
              dissipating: true,
              maxIntensity: 32
            });
            if (gradients[layerType]) {
              gHeatmapLayer.set('gradient', gradients[layerType]);
            }
          } else {
            throw new Error('HeatmapLayer no disponible en SDK Google Maps');
          }
        } catch(instErr) {
          window.logLiveDebug('Activando motor nativo CanvasHeatmapOverlay: ' + instErr.message, 'info');
          const CustomOverlay = getCanvasHeatmapOverlayClass();
          if (CustomOverlay) {
            gHeatmapLayer = new CustomOverlay({
              data: validPoints,
              map: map,
              radius: dynRadius,
              opacity: currentHeatmapOpacity || 0.55,
              gradient: gradients[layerType] || gradients.peya_maus
            });
          }
        }

        // Atenuar polígonos rojos de cobertura para que no tapen el brillo del heatmap
        try {
          if (multiDatePolygonsMap) {
            multiDatePolygonsMap.forEach(e => {
              if (e && e.polygon && e.polygon.setOptions) e.polygon.setOptions({ fillOpacity: 0.05 });
            });
          }
          if (activePolygonsMap) {
            activePolygonsMap.forEach(e => {
              if (e && e.polygon && e.polygon.setOptions) e.polygon.setOptions({ fillOpacity: 0.05 });
            });
          }
        } catch(e) {}

        // Actualizar verificación y leyenda visual dinámica en la interfaz
        updateHeatmapVerificationUI(true, 'Activa (OK)', validPoints.length, metricLabel);
        updateHeatmapScaleLegend(layerType, gradients, validPoints);
        window.logLiveDebug(`[Heatmap OK] ${validPoints.length} puntos proyectados en el mapa para ${metricLabel}`, 'success');
        showToast(`Heatmap activo: ${metricLabel} (${validPoints.length} puntos)`, 'success');
      } catch(fatalErr) {
        window.logLiveDebug('EXCEPCION DENTRO DE renderGoogleHeatmap: ' + fatalErr.message + '\n' + (fatalErr.stack || ''), 'error');
        console.error('Heatmap render error:', fatalErr);
      }
    }

    let HEATMAP_STABLE_BOUNDS = {};

    function calibrateHeatmapStableBounds(layerType) {
      const type = String(layerType || '').toLowerCase();
      if (!type || type === 'none') return;

      const activeCountry = document.getElementById('filter-country').value;
      const stores = allWarehouses.filter(w => {
        if (!w.is_active) return false;
        if (activeCountry && w.country !== activeCountry) return false;
        return true;
      });

      let min = Infinity;
      let max = -Infinity;

      stores.forEach(s => {
        let val = 0;

        if (type === 'peya_maus') val = Number(s.peya_users) || 0;
        else if (type === 'covered_maus') val = Number(s.covered_maus) || Number(s.peya_users) || 0;
        else if (type === 'dmart_maus') val = Number(s.dmart_users) || 0;
        else if (type === 'penetration') val = Number(s.penetration_pct) || 0;
        else if (type === 'seamless_worst' || type === 'seamless_best') val = Number(s.seamless_delivery_pct) || 0;
        else if (type === 'afv') val = Number(s.afv_aov_amount) || 0;
        else if (type === 'late_orders') val = Number(s.order_late_pct) || 0;
        else if (type === 'orders') val = Number(s.orders) || 0;
        else if (type === 'gmv_dmart') val = Number(s.total_net_sales) || 0;
        else if (type === 'cpo') val = Number(s.rider_cpo_dmarts) || 0;

        if (!isNaN(val) && val > 0) {
          if (val < min) min = val;
          if (val > max) max = val;
        }
      });

      if (min === Infinity || min === max) {
        min = 0;
        max = 100;
      }

      HEATMAP_STABLE_BOUNDS[type] = { min, max };
    }

    // ── Actualización de la Escala de Color y Concentración Dinámica y Estable ──
    function updateHeatmapScaleLegend(layerType, gradients, points = []) {
      const container = document.getElementById('heatmap-legend-container');
      if (!container) return;
      if (layerType === 'none') {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'flex';

      const metricLabel = HEATMAP_METRIC_LABELS[layerType] || layerType;
      const metricEl = document.getElementById('heatmap-scale-metric-name');
      if (metricEl) metricEl.textContent = metricLabel;

      const gradColors = (gradients && gradients[layerType]) || [
        'rgba(0, 255, 255, 0.2)', '#00ffff', '#007fff', '#6366f1', '#4f46e5'
      ];
      const barEl = document.getElementById('heatmap-gradient-bar');
      if (barEl && gradColors && gradColors.length > 0) {
        barEl.style.background = `linear-gradient(to right, ${gradColors.join(', ')})`;
      }

      const minEl = document.getElementById('heatmap-legend-min');
      const midEl = document.getElementById('heatmap-legend-mid');
      const maxEl = document.getElementById('heatmap-legend-max');

      // Obtener cotas estables para evitar fluctuaciones aleatorias al desplazar el mapa
      if (!HEATMAP_STABLE_BOUNDS[layerType]) {
        calibrateHeatmapStableBounds(layerType);
      }

      const stable = HEATMAP_STABLE_BOUNDS[layerType] || { min: 0, max: 100 };
      let minVal = stable.min;
      let maxVal = stable.max;

      // Si hay puntos en pantalla, la Escala de Densidad refleja dinámicamente lo que se está viendo en el mapa
      if (points && points.length > 0) {
        let pMin = Infinity, pMax = -Infinity;
        points.forEach(p => {
          const v = (p.rawVal !== undefined) ? Number(p.rawVal) : Number(p.weight || 0);
          if (!isNaN(v) && v > 0) {
            if (v < pMin) pMin = v;
            if (v > pMax) pMax = v;
          }
        });
        if (pMin !== Infinity && pMax !== -Infinity) {
          minVal = pMin;
          maxVal = pMax;
        }
      }

      if (minVal === maxVal) {
        minVal = minVal * 0.9;
        maxVal = maxVal * 1.1;
      }

      const midVal = (minVal + maxVal) / 2;

      // Formato dinámico según la métrica activa
      if (layerType === 'penetration' || layerType === 'seamless_worst' || layerType === 'seamless_best' || layerType === 'late_orders') {
        if (minEl) minEl.textContent = `${minVal.toFixed(1)}%`;
        if (midEl) midEl.textContent = `${midVal.toFixed(1)}%`;
        if (maxEl) maxEl.textContent = `${maxVal.toFixed(1)}%`;
      } else if (layerType === 'afv' || layerType === 'cpo') {
        if (minEl) minEl.textContent = `$ ${minVal.toFixed(2)}`;
        if (midEl) midEl.textContent = `$ ${midVal.toFixed(2)}`;
        if (maxEl) maxEl.textContent = `$ ${maxVal.toFixed(2)}`;
      } else {
        if (minEl) minEl.textContent = Math.round(minVal).toLocaleString('es-AR');
        if (midEl) midEl.textContent = Math.round(midVal).toLocaleString('es-AR');
        if (maxEl) maxEl.textContent = Math.round(maxVal).toLocaleString('es-AR');
      }
    }

    function addPointToCustomPolygon(latLng) {
      if (!isCustomPolygonDrawing || !latLng) return;

      // Detección de doble clic o doble toque rápido para cerrar el shape inmediatamente
      const now = Date.now();
      if (now - lastVertexClickTime < 380 && customPolygonPoints.length >= 3) {
        lastVertexClickTime = 0;
        customPolygonPoints.pop(); // descartar el punto redundante del segundo toque
        finishCustomPolygonDrawing();
        return;
      }
      lastVertexClickTime = now;

      customPolygonPoints.push(latLng);

      const ptMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 4.5,
          fillColor: '#0284c7',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 2
        },
        clickable: true,
        zIndex: 1000
      });

      ptMarker.addListener('click', () => {
        if (customPolygonPoints.length >= 3) {
          finishCustomPolygonDrawing();
        }
      });

      ptMarker.addListener('dblclick', (e) => {
        if (e && e.stop) e.stop();
        if (customPolygonPoints.length >= 3) {
          finishCustomPolygonDrawing();
        }
      });

      customPolygonVertexMarkers.push(ptMarker);

      if (customPolygonPreview) {
        customPolygonPreview.setPath(customPolygonPoints);
      } else {
        customPolygonPreview = new google.maps.Polygon({
          paths: customPolygonPoints,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          clickable: false,
          zIndex: 99
        });
      }

      const bannerText = document.getElementById('polygon-drawing-status-text');
      const finishBtn = document.getElementById('btn-finish-custom-polygon');

      if (customPolygonPoints.length < 3) {
        if (bannerText) bannerText.textContent = `${customPolygonPoints.length} punto${customPolygonPoints.length === 1 ? '' : 's'}. Marcá al menos 3 puntos.`;
        if (finishBtn) finishBtn.disabled = true;
      } else {
        if (bannerText) bannerText.textContent = `${customPolygonPoints.length} puntos. Hacé doble clic para cerrar el shape.`;
        if (finishBtn) finishBtn.disabled = false;
      }
    }

    function finishCustomPolygonDrawing() {
      if (!isCustomPolygonDrawing || customPolygonPoints.length < 3) {
        showToast('Se necesitan al menos 3 puntos para cerrar el polígono.', 'warning');
        return;
      }

      if (map) map.setOptions({ draggableCursor: null, disableDoubleClickZoom: false });
      customPolygonVertexMarkers.forEach(m => m.setMap(null));
      customPolygonVertexMarkers = [];

      if (customPolygonPreview) {
        customPolygonPreview.setMap(null);
        customPolygonPreview = null;
      }

      const finalPolygon = new google.maps.Polygon({
        paths: customPolygonPoints,
        map: map,
        strokeColor: '#0284c7',
        strokeWeight: 2.5,
        fillColor: '#0284c7',
        fillOpacity: 0.22,
        editable: true,
        draggable: false,
        clickable: true,
        zIndex: 99
      });

      customDrawnOverlay = finalPolygon;
      customDrawnType = 'polygon';
      isCustomPolygonDrawing = false;

      if (map) map.setOptions({ draggableCursor: null });
      setStoreLayersClickable(true);

      const banner = document.getElementById('polygon-drawing-banner');
      if (banner) banner.style.display = 'none';

      const badge = document.getElementById('zone-drawing-active-badge');
      if (badge) badge.style.display = 'none';

      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'block';

      finalPolygon.getPath().addListener('set_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));
      finalPolygon.getPath().addListener('insert_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));
      finalPolygon.getPath().addListener('remove_at', () => analyzeCustomDrawnZone(finalPolygon, 'polygon'));

      analyzeCustomDrawnZone(finalPolygon, 'polygon');
      showToast('Polígono cerrado con éxito. Podés arrastrar los puntos blancos para modificar sus vértices.', 'success');
    }

    function initDrawingManager() {
      try {
        if (drawingManager || !map || !window.google || !google.maps || !google.maps.drawing || !google.maps.drawing.DrawingManager) return;

        drawingManager = new google.maps.drawing.DrawingManager({
          drawingMode: null,
          drawingControl: false,
          circleOptions: {
            fillColor: '#0284c7',

            strokeColor: '#0284c7',
            strokeWeight: 2.5,

            editable: true,
            draggable: false,
            zIndex: 99
          }

        drawingManager.setMap(map);

      google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
        if (customDrawnOverlay) {
          customDrawnOverlay.setMap(null);
        }
        customDrawnOverlay = event.overlay;
        customDrawnType = event.type;
        drawingManager.setDrawingMode(null);

        if (event.type === google.maps.drawing.OverlayType.CIRCLE) {
          event.overlay.addListener('radius_changed', () => analyzeCustomDrawnZone(event.overlay, 'circle'));
          event.overlay.addListener('center_changed', () => analyzeCustomDrawnZone(event.overlay, 'circle'));
        }

        analyzeCustomDrawnZone(event.overlay, event.type);
      });
      } catch(e) {
        console.warn('[DrawingManager Notice]:', e.message);

    window.exportCustomZoneGeoJSON = function() {
      if (!window.CURRENT_CUSTOM_ZONE_DATA || !window.CURRENT_CUSTOM_ZONE_DATA.coords) {
        showToast('No hay zona activa para exportar.', 'warning');
        return;
      }

      const zData = window.CURRENT_CUSTOM_ZONE_DATA;

      if (zData.type === 'polygon') {

        if (ring.length > 0 && (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1])) {
          ring.push(ring[0]);
        }
        geojson = {
          type: "FeatureCollection",
          features: [{
            type: "Feature",
            properties: {
              name: zData.name,
              area_km2: zData.area_km2,
              peya_maus: zData.peya_maus,
              dmart_maus: zData.dmart_maus,
              orders: zData.orders
            },
            geometry: {
              type: "Polygon",
              coordinates: [ring]
            }
          }]
        };

      if (!geojson) return;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(geojson, null, 2));

    };

    // ============================================================
    // BUSCADOR AUTOMÁTICO DE POLÍGONOS DE BARRIOS Y ZONAS (CATASTRAL)
    // ============================================================
    async function searchAndDrawNeighborhoodPolygon(targetQuery) {
      const input = document.getElementById('map-places-search-input') || document.getElementById('neighborhood-poly-search-input');
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      const query = String(targetQuery || (input ? input.value : '')).trim();

      if (!query) {
        showToast('Escribí el nombre de un barrio o zona (ej. Palermo, Tolosa, Caballito)', 'warning');
        return;
      }

      if (input) input.value = query;

      const countryEl = document.getElementById('filter-country');
      const cityEl = document.getElementById('filter-city');
      const activeCountry = (countryEl && countryEl.value) || 'Argentina';
      const activeCity = (cityEl && cityEl.value) || '';

      // Construir query georreferenciada con país y ciudad activa
      let fullQuery = query;
      if (!query.toLowerCase().includes(activeCountry.toLowerCase())) {
        if (activeCity && !query.toLowerCase().includes(activeCity.toLowerCase())) {
          fullQuery += `, ${activeCity}`;
        }
        fullQuery += `, ${activeCountry}`;
      }

      showToast(`Buscando límites catastrales de "${query}"...`, 'info');
      if (resultsDiv) {
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = '<div style="padding:8px 10px; color:var(--text-sheet-muted); text-align:center;">Buscando límites oficiales...</div>';
      }

      const countryCodesMap = {
        'argentina': 'ar', 'chile': 'cl', 'uruguay': 'uy', 'peru': 'pe', 'perú': 'pe',
        'ecuador': 'ec', 'bolivia': 'bo', 'paraguay': 'py', 'dominicana': 'do', 'república dominicana': 'do'
      };
      const cc = countryCodesMap[activeCountry.toLowerCase()] || '';
      const ccParam = cc ? ('&countrycodes=' + cc) : '';

      try {
        const url = 'https:' + '\x2F\x2F' + 'nominatim.openstreetmap.org/search?q=' + encodeURIComponent(fullQuery) + '&format=json&polygon_geojson=1&addressdetails=1&limit=5' + ccParam;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) throw new Error('Servidor de límites no disponible');
        const data = await resp.json();

        // Filtrar aquellos que tengan geometría de polígono válida
        let validResults = (data || []).filter(item => {
          return item.geojson && (item.geojson.type === 'Polygon' || item.geojson.type === 'MultiPolygon');
        });

        if (validResults.length === 0) {
          // Búsqueda más amplia por si la ciudad acotó demasiado
          const broadUrl = 'https:' + '\x2F\x2F' + 'nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query + ', ' + activeCountry) + '&format=json&polygon_geojson=1&limit=5' + ccParam;
          const broadResp = await fetch(broadUrl);
          const broadData = await broadResp.json();
          validResults = (broadData || []).filter(item => item.geojson && (item.geojson.type === 'Polygon' || item.geojson.type === 'MultiPolygon'));
        }

        if (validResults.length === 0) {
          if (resultsDiv) resultsDiv.style.display = 'none';
          searchGoogleMapsZone(query);
          return;
        }

        if (validResults.length === 1) {
          if (resultsDiv) resultsDiv.style.display = 'none';
          drawFoundNeighborhoodPolygon(validResults[0], query);
        } else {
          displayNeighborhoodSearchResults(validResults, query);
        }

      } catch(e) {
        console.warn('Fallback a geocoder Google Maps tras error en límites:', e.message);
        if (resultsDiv) resultsDiv.style.display = 'none';
        searchGoogleMapsZone(query);
      }
    }

    function displayNeighborhoodSearchResults(results, query) {
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      if (!resultsDiv) return;

      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = '';

      results.forEach((item) => {
        const itemRow = document.createElement('div');
        itemRow.style.padding = '6px 9px';
        itemRow.style.borderBottom = '1px solid var(--border-sheet)';
        itemRow.style.cursor = 'pointer';
        itemRow.style.transition = 'background 0.15s ease';
        itemRow.style.lineHeight = '1.25';

        const displayName = item.display_name || item.name;
        itemRow.innerHTML = `
          <div style="font-weight:700; color:var(--text-sheet-title); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${item.name || query}
          </div>
          <div style="font-size:9px; color:var(--text-sheet-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${displayName}
          </div>
        `;

        itemRow.onmouseenter = () => { itemRow.style.background = 'var(--bg-sheet-card-hover)'; };
        itemRow.onmouseleave = () => { itemRow.style.background = 'transparent'; };

        itemRow.onclick = () => {
          resultsDiv.style.display = 'none';
          drawFoundNeighborhoodPolygon(item, query);
        };

        resultsDiv.appendChild(itemRow);
      });
    }

    function drawFoundNeighborhoodPolygon(item, query) {
      if (!item || !item.geojson || !map) return;

      // Limpiar zona previa si existe
      clearCustomDrawnZone();

      let outerRing = [];
      if (item.geojson.type === 'Polygon') {
        outerRing = item.geojson.coordinates[0];
      } else if (item.geojson.type === 'MultiPolygon') {
        let maxLen = 0;
        item.geojson.coordinates.forEach(polyCoords => {
          if (polyCoords[0] && polyCoords[0].length > maxLen) {
            maxLen = polyCoords[0].length;
            outerRing = polyCoords[0];
          }
        });
      }

      if (!outerRing || outerRing.length < 3) {
        showToast('Geometría de polígono inválida para este barrio.', 'error');
        return;
      }

      const path = outerRing.map(pt => ({ lat: pt[1], lng: pt[0] }));

      // Crear el polígono editable en Google Maps
      customZonePolygon = new google.maps.Polygon({
        paths: path,
        map: map,
        strokeColor: '#7c3aed',
        strokeOpacity: 0.95,
        strokeWeight: 2.5,
        fillColor: '#7c3aed',
        fillOpacity: 0.22,
        editable: true,
        draggable: false,
        zIndex: 100
      });

      customDrawnOverlay = customZonePolygon;
      customDrawnType = 'polygon';

      // Encuadrar la cámara directamente en el barrio
      const bounds = new google.maps.LatLngBounds();
      path.forEach(pt => bounds.extend(pt));
      map.fitBounds(bounds, 50);

      // Asignar el nombre del barrio al input de guardado
      const zoneName = item.name || query;
      const nameInput = document.getElementById('zone-name-input');
      if (nameInput) nameInput.value = `Barrio ${zoneName}`;

      const searchInput = document.getElementById('neighborhood-poly-search-input');
      if (searchInput) searchInput.value = zoneName;

      // Mostrar botón de limpiar zona
      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'block';

      // Calcular métricas, intersecciones y canibalización
      analyzeCustomDrawnZone(customZonePolygon, 'polygon');

      // Escuchar modificaciones en los vértices del polígono
      customZonePolygon.getPath().addListener('set_at', () => {
        analyzeCustomDrawnZone(customZonePolygon, 'polygon');
      });
      customZonePolygon.getPath().addListener('insert_at', () => {
        analyzeCustomDrawnZone(customZonePolygon, 'polygon');
      });

      showToast(`Límites de "${zoneName}" trazados con éxito. Podés editar vértices con el mouse o calcular con BQ.`, 'success');
    }

    // Cerrar sugerencias al hacer clic fuera del buscador
    document.addEventListener('click', function(e) {
      const resultsDiv = document.getElementById('neighborhood-poly-results');
      const input = document.getElementById('neighborhood-poly-search-input');
      if (resultsDiv && e.target !== resultsDiv && e.target !== input && !resultsDiv.contains(e.target)) {

    function analyzeCustomDrawnZone(overlay, type) {
      if (!overlay) return;

      const card = document.getElementById('custom-zone-card');
      if (card) {
        card.style.display = 'block';
        card.style.zIndex = '1000';
      }

      const isPolyType = (type === 'polygon' || (typeof google !== 'undefined' && google.maps && google.maps.drawing && type === google.maps.drawing.OverlayType.POLYGON));
      let areaKm2 = 0;
      let centerLatLng = null;

      try {
        if (isPolyType) {
          let areaM2 = 0;
          if (typeof google !== 'undefined' && google.maps && google.maps.geometry && google.maps.geometry.spherical && overlay.getPath) {
            areaM2 = google.maps.geometry.spherical.computeArea(overlay.getPath());
          }
          const bounds = new google.maps.LatLngBounds();
          if (overlay.getPath) {
            overlay.getPath().forEach(pt => bounds.extend(pt));
            centerLatLng = bounds.getCenter();
          }
          areaKm2 = Number((areaM2 / 1000000).toFixed(2));
        } else if (overlay.getRadius && overlay.getCenter) {
          const radMeters = overlay.getRadius();
          areaKm2 = Number(((Math.PI * (radMeters / 1000) * (radMeters / 1000))).toFixed(2));
          centerLatLng = overlay.getCenter();
        }
      } catch(eArea) {
        console.warn('Cálculo de área inicial:', eArea);
      }

      // Convertir la zona personalizada a polígono de Turf.js para análisis espacial booleano
      let customTurfPoly = null;
      if (typeof turf !== 'undefined') {
        try {
          if (isPolyType) {
            const ring = [];
            overlay.getPath().forEach(pt => ring.push([pt.lng(), pt.lat()]));
            if (ring.length >= 3) {
              if (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1]) {
                ring.push([ring[0][0], ring[0][1]]);
              }
              customTurfPoly = turf.cleanCoords(turf.polygon([ring]));
            }
          } else if (overlay.getCenter && overlay.getRadius) {
            const c = overlay.getCenter();
            const radKm = overlay.getRadius() / 1000;
            customTurfPoly = turf.circle([c.lng(), c.lat()], radKm, { steps: 36, units: 'kilometers' });
          }
        } catch(ePoly) {}
      }

      function getWarehouseTurfPoly(w, month) {
        const normId = String(w.warehouse_id).trim();
        // 1. Polygon activo en el mapa
        const entry = multiDatePolygonsMap.get(`${normId}__${month}`) || activePolygonsMap.get(normId);
        if (entry) {
          if (entry.polygon && entry.polygon.getPath) {
            const r = [];
            entry.polygon.getPath().forEach(pt => r.push([pt.lng(), pt.lat()]));
            if (r.length >= 3) {
              if (r[0][0] !== r[r.length - 1][0] || r[0][1] !== r[r.length - 1][1]) r.push([r[0][0], r[0][1]]);
              try { return turf.cleanCoords(turf.polygon([r])); } catch(e) {}
            }
          }
          if (entry.coords) {
            const poly = coordsToTurfPolygon(entry.coords);
            if (poly) return poly;
          }
        }
        // 2. Caché local de memoria
        const pData = CLIENT_MEMORY_CACHE.polygons.get(`${normId}__${month}`);
        if (pData) {
          if (pData.geojson) {
            try { return turf.cleanCoords(turf.feature(pData.geojson)); } catch(e) {}
          }
          if (pData.coords) {
            const poly = coordsToTurfPolygon(pData.coords);
            if (poly) return poly;
          }
        }
        // 3. Fallback de coordenadas en objeto
        if (w.coords) {
          const poly = coordsToTurfPolygon(w.coords);
          if (poly) return poly;
        }
        return null;
      }

      // Encontrar almacenes cuyas áreas de cobertura o ubicación intersectan con la zona
      const currentMonth = document.getElementById('filter-month').value || (allAvailableMonths[0] && (allAvailableMonths[0].month_date || allAvailableMonths[0])) || '2026-10-01';
      const intersectingStores = [];
      const missingPolygonIds = [];

      allWarehouses.forEach(w => {
        if (!w.is_active && !isWarehouseActiveInMonth(w)) return;
        const pos = getWarehousePosition(w);
        if (!pos) return;

        const pt = new google.maps.LatLng(pos.lat, pos.lng);
        const distKm = centerLatLng
          ? (google.maps.geometry.spherical.computeDistanceBetween(pt, centerLatLng) / 1000)
          : 0;

        // Si la tienda está a más de 12 km del centro, no puede cubrir esta zona
        if (distKm > 12) return;

        let coversZone = false;
        let coveragePct = 0;

        // A. Verificar si el local físico está dentro del polígono
        let storePointInside = false;
        if (type === 'polygon' || type === (google.maps.drawing && google.maps.drawing.OverlayType.POLYGON)) {
          storePointInside = google.maps.geometry.poly.containsLocation(pt, overlay);
        } else if (overlay.getCenter && overlay.getRadius) {
          storePointInside = (distKm * 1000) <= overlay.getRadius();
        }

        // B. Verificar si el polígono de cobertura de la tienda intersecta la zona trazada
        const storeTurfPoly = getWarehouseTurfPoly(w, currentMonth);
        if (storeTurfPoly && customTurfPoly) {
          try {
            const isect = turf.intersect(customTurfPoly, storeTurfPoly);
            if (isect) {
              const isectAreaM2 = turf.area(isect);
              if (isectAreaM2 > 1000) {
                coversZone = true;
                const customAreaM2 = areaKm2 * 1000000;
                coveragePct = customAreaM2 > 0 ? Math.min(100, Math.round((isectAreaM2 / customAreaM2) * 100)) : 100;
              }
            }
          } catch(eIsect) {}
        } else if (!storeTurfPoly) {
          // La tienda está en la zona (< 5.2 km) pero su silueta GeoJSON no está en RAM
          if (distKm <= 5.2) {
            missingPolygonIds.push(w.warehouse_id);
            coversZone = true;
            coveragePct = Math.max(10, Math.round((1 - (distKm / 5.2)) * 100));
          }
        }

        if (storePointInside || coversZone) {
          intersectingStores.push({
            ...w,
            coveragePct: coveragePct,
            distanceKm: Number(distKm.toFixed(1))
          });
        }
      });

      // Ordenar tiendas por cobertura decreciente
      intersectingStores.sort((a, b) => (b.coveragePct || 0) - (a.coveragePct || 0));

      // Descargar silenciosamente en segundo plano los polígonos faltantes de tiendas cercanas
      if (missingPolygonIds.length > 0 && typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(records => {
            if (records && Array.isArray(records) && records.length > 0) {
              records.forEach(r => {
                CLIENT_MEMORY_CACHE.polygons.set(`${r.warehouse_id}__${currentMonth}`, r);
              });
              // Re-calcular con las geometrías exactas descargadas
              analyzeCustomDrawnZone(overlay, type);
            }
          })
          .getStorePolygons(missingPolygonIds.slice(0, 8), currentMonth);
      }

      // Calcular Inteligencia de Canibalización usando Turf.js
      let overlapAreaKm2 = 0;
      if (typeof turf !== 'undefined' && customTurfPoly) {
        try {
          const storeFeatures = [];
          intersectingStores.forEach(s => {
            const p = getWarehouseTurfPoly(s, currentMonth);
            if (p) storeFeatures.push(p);
          });

          if (storeFeatures.length > 0) {
            let totalCoveredM2 = 0;
            storeFeatures.forEach(f => {
              const isect = turf.intersect(customTurfPoly, f);
              if (isect) totalCoveredM2 += turf.area(isect);
            });
            overlapAreaKm2 = Math.min(areaKm2, totalCoveredM2 / 1000000);
          } else if (intersectingStores.length > 0) {
            const maxCov = Math.max(...intersectingStores.map(s => s.coveragePct || 0));
            overlapAreaKm2 = (areaKm2 * maxCov) / 100;
          }
        } catch(eTurf) {}
      }

      const cannibalizedPct = areaKm2 > 0 ? Math.min(100, Math.round((overlapAreaKm2 / areaKm2) * 100)) : 0;
      const whitespacePct = Math.max(0, 100 - cannibalizedPct);

      // Calcular métricas estimadas de la zona seleccionada
      let totalPeyaMaus = 0;
      let totalDmartMaus = 0;
      let totalOrders = 0;
      let sumAfv = 0;
      let countAfv = 0;
      let sumDt = 0;
      let countDt = 0;

      intersectingStores.forEach(w => {
        const orders = Number(w.monthly_orders || w.orders || 0);
        const dmart = Number(w.dmart_users || 0);
        const peya = Number(w.peya_users || w.covered_maus || 0);
        totalPeyaMaus += peya;
        totalDmartMaus += dmart;
        totalOrders += orders;
        if (Number(w.afv_aov_amount) > 0) {
          sumAfv += Number(w.afv_aov_amount);
          countAfv++;
        }
        if (Number(w.avg_delivery_time_min) > 0) {
          sumDt += Number(w.avg_delivery_time_min);
          countDt++;
        }
      });

      const avgAfv = countAfv > 0 ? (sumAfv / countAfv).toFixed(2) : '—';
      const avgDt = countDt > 0 ? (sumDt / countDt).toFixed(1) : '—';
      const penPct = (totalPeyaMaus > 0 && totalDmartMaus > 0) ? ((totalDmartMaus / totalPeyaMaus) * 100).toFixed(1) : '—';

      customZoneLastMetrics = {
        areaKm2: areaKm2,
        storesCount: intersectingStores.length,
        peyaMaus: totalPeyaMaus,
        dmartMaus: totalDmartMaus,
        penPct: penPct,
        orders: totalOrders,
        afv: avgAfv,
        dt: avgDt,
        stores: intersectingStores
      };

      // Guardar estructura completa para persistencia comunitaria con ubicación inteligente
      let coordsArray = [];
      if (type === 'polygon' || (google.maps.drawing && type === google.maps.drawing.OverlayType.POLYGON)) {
        overlay.getPath().forEach(pt => {
          coordsArray.push({ lat: Number(pt.lat().toFixed(6)), lng: Number(pt.lng().toFixed(6)) });
        });
      } else if (overlay.getCenter) {
        const c = overlay.getCenter();
        coordsArray = [{ lat: Number(c.lat().toFixed(6)), lng: Number(c.lng().toFixed(6)), radius: overlay.getRadius() }];
      }

      // Determinar ubicación geográfica inteligente (País, Ciudad, Barrio)
      let zoneCountry = document.getElementById('filter-country').value || '';
      let zoneCity = document.getElementById('filter-city').value || '';
      let zoneNeighborhood = document.getElementById('filter-neighborhood').value || '';

      if (intersectingStores.length > 0) {
        const primaryStore = intersectingStores[0];
        zoneCountry = primaryStore.country || zoneCountry;
        zoneCity = primaryStore.city || zoneCity;
        zoneNeighborhood = primaryStore.neighborhood || zoneNeighborhood;
      } else if (centerLatLng) {
        let minDistance = Infinity;
        let nearestStore = null;
        allWarehouses.forEach(w => {
          const pos = getWarehousePosition(w);
          if (pos) {
            const d = google.maps.geometry.spherical.computeDistanceBetween(centerLatLng, new google.maps.LatLng(pos.lat, pos.lng));
            if (d < minDistance) {
              minDistance = d;
              nearestStore = w;
            }
          }
        });
        if (nearestStore && minDistance < 25000) {
          zoneCountry = nearestStore.country || zoneCountry;
          zoneCity = nearestStore.city || zoneCity;
          zoneNeighborhood = nearestStore.neighborhood || zoneNeighborhood;
        }
      }

      const locationParts = [zoneNeighborhood, zoneCity, zoneCountry].filter(Boolean);
      const autoName = locationParts.length > 0 ? `${locationParts.join(', ')} (${areaKm2} km²)` : `Zona (${areaKm2} km²)`;

      window.CURRENT_CUSTOM_ZONE_DATA = {
        name: autoName,
        type: (type === 'circle' || (google.maps.drawing && type === google.maps.drawing.OverlayType.CIRCLE)) ? 'circle' : 'polygon',
        coords: coordsArray,
        area_km2: areaKm2,
        peya_maus: totalPeyaMaus,
        dmart_maus: totalDmartMaus,
        penetration_pct: Number(penPct),
        orders: totalOrders,
        afv: Number(avgAfv),
        avg_dt: Number(avgDt),
        stores_text: intersectingStores.map(s => s.warehouse_name).join(', '),
        country: zoneCountry,
        city: zoneCity,
        neighborhood: zoneNeighborhood
      };

      // Actualizar UI del card flotante con soporte para zonas de expansión
      const isExpansionZone = (intersectingStores.length === 0);
      let dispPeyaMaus = totalPeyaMaus;
      let dispDmartMaus = totalDmartMaus;
      let dispOrders = totalOrders;
      let dispPen = penPct;

      if (isExpansionZone) {
        dispPeyaMaus = Math.round(areaKm2 * 1950);
        dispDmartMaus = Math.round(dispPeyaMaus * 0.145);
        dispOrders = Math.round(dispDmartMaus * 2.15);
        dispPen = '14.5% (Target)';
      }

      function setElSafe(id, val) {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      }

      setElSafe('zone-val-area', `${areaKm2} km²`);
      setElSafe('zone-val-stores', isExpansionZone ? '0 (Expansión)' : intersectingStores.length);
      setElSafe('zone-val-peya-maus', isExpansionZone ? `${dispPeyaMaus.toLocaleString('es-AR')} (Est.)` : (dispPeyaMaus > 0 ? dispPeyaMaus.toLocaleString('es-AR') : '—'));
      setElSafe('zone-val-dmart-maus', isExpansionZone ? `${dispDmartMaus.toLocaleString('es-AR')} (Potencial)` : (dispDmartMaus > 0 ? dispDmartMaus.toLocaleString('es-AR') : '—'));
      setElSafe('zone-val-pen', isExpansionZone ? dispPen : `${dispPen}%`);
      setElSafe('zone-val-orders', isExpansionZone ? `${dispOrders.toLocaleString('es-AR')} (Potencial)` : (dispOrders > 0 ? dispOrders.toLocaleString('es-AR') : '—'));
      const freqVal = (dispDmartMaus > 0 && dispOrders > 0) ? (dispOrders / dispDmartMaus).toFixed(1) : '2.1';
      setElSafe('zone-val-freq', `${freqVal}x`);
      setElSafe('zone-val-high-income', '—');
      setElSafe('zone-val-core-users', '—');
      setElSafe('zone-val-afv', `$ ${avgAfv}`);
      setElSafe('zone-val-dt', `${avgDt} min`);
      const zoneCpoEl = document.getElementById('zone-val-cpo');
      if (zoneCpoEl) {
        zoneCpoEl.textContent = `$ ${(1.25 + (parseFloat(avgDt) * 0.055)).toFixed(2)}`;
      }

      // Actualizar barras de canibalización
      const canniBarContainer = document.getElementById('zone-cannibalization-bar');
      const canniBar = document.getElementById('zone-bar-cannibalized');
      const whiteBar = document.getElementById('zone-bar-whitespace');
      const lblCanni = document.getElementById('zone-lbl-cannibalized');
      const lblWhite = document.getElementById('zone-lbl-whitespace');

      if (canniBarContainer && isPolyType) {
        canniBarContainer.style.display = 'block';
        if (canniBar) {
          canniBar.style.width = `${cannibalizedPct}%`;
          canniBar.textContent = cannibalizedPct >= 15 ? `${cannibalizedPct.toFixed(1)}%` : '';
        }
        if (whiteBar) {
          whiteBar.style.width = `${whitespacePct}%`;
          whiteBar.textContent = whitespacePct >= 15 ? `${whitespacePct.toFixed(1)}% White Space` : '';
        }
        if (lblCanni) lblCanni.textContent = `Canibalización: ${cannibalizedPct.toFixed(1)}%`;
        if (lblWhite) lblWhite.textContent = `White Space: ${whitespacePct.toFixed(1)}%`;
      } else if (canniBarContainer) {
        canniBarContainer.style.display = 'none';
      }

      const listContainer = document.getElementById('zone-stores-list');
      if (listContainer) {
        if (intersectingStores.length === 0) {
          listContainer.innerHTML = '<span style="font-size:10px; color:var(--text-sheet-muted); font-style:italic;">Ningún almacén actual cubre esta zona (Oportunidad de Expansión).</span>';
        } else {
          listContainer.innerHTML = intersectingStores.map(s => `
            <div style="font-size:10px; font-weight:700; color:var(--text-sheet-body); display:flex; justify-content:space-between; align-items:center; padding:3px 6px; background:var(--bg-sheet-card); border-radius:4px; margin-bottom:2px; border:1px solid var(--border-sheet);">
              <div style="display:flex; align-items:center; gap:5px; overflow:hidden;">
                <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#ea044e; flex-shrink:0;"></span>
                <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${s.warehouse_name}">${s.warehouse_name}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                ${s.coveragePct ? `<span style="font-size:9px; color:#0284c7; font-weight:800; font-family:'JetBrains Mono',monospace;">${s.coveragePct}% cubierto</span>` : ''}
                <span style="color:var(--brand-red); font-family:'JetBrains Mono',monospace;">${(s.orders || 0).toLocaleString('es-AR')} órd.</span>
              </div>
            </div>
          `).join('');
        }
      }

      if (card) {
        card.style.display = 'block';
        card.style.zIndex = '1000';
      }

      // Auto-guardado transparente en segundo plano con debounce
      if (autoSaveZoneTimer) clearTimeout(autoSaveZoneTimer);
      autoSaveZoneTimer = setTimeout(() => {
        if (window.CURRENT_CUSTOM_ZONE_DATA && window.CURRENT_CUSTOM_ZONE_DATA.coords && window.CURRENT_CUSTOM_ZONE_DATA.coords.length >= 3) {
          triggerAutoSaveCustomZone(window.CURRENT_CUSTOM_ZONE_DATA, false);
        }
      }, 2500);

      showToast(`Zona analizada: ${areaKm2} km² (${intersectingStores.length} almacenes en cobertura)`, 'success');
    }

    function confirmAndCalculateZoneBigQuery() {
      const activeOverlay = customDrawnOverlay || customZonePolygon;
      if (!activeOverlay) {
        showToast('No hay ninguna zona marcada para consultar en BigQuery.', 'warning');
        return;
      }
      customDrawnOverlay = activeOverlay;

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const monthObj = allAvailableMonths.find(m => (m.month_date || m) === currentMonth);
      const monthLabel = monthObj ? (monthObj.month_label || monthObj.month_date || currentMonth) : currentMonth;

      const nameEl = document.getElementById('bq-modal-store-name');
      const monthEl = document.getElementById('bq-modal-month-name');
      const cellsEl = document.getElementById('bq-modal-cells-count');
      const bytesEl = document.getElementById('bq-modal-bytes-estimate');
      const slotsEl = document.getElementById('bq-modal-slots-estimate');

      if (nameEl) nameEl.textContent = (window.CURRENT_CUSTOM_ZONE_DATA && window.CURRENT_CUSTOM_ZONE_DATA.name) || 'Zona Personalizada';
      if (monthEl) monthEl.textContent = monthLabel;
      if (cellsEl) cellsEl.innerHTML = `<span style="font-weight:700;">Superficie: ${customZoneLastMetrics ? customZoneLastMetrics.areaKm2 : 0} km²</span>`;
      if (bytesEl) bytesEl.innerHTML = `<span style="color:#10b981; font-weight:800;">~150 MB a 320 MB</span>`;
      if (slotsEl) slotsEl.innerHTML = `<span style="color:#0284c7; font-weight:700;">~6 a 12 Slots</span>`;

      // Reemplazar onclick del botón de confirmación temporalmente
      const btnConfirm = document.getElementById('btn-modal-confirm-bq');
      if (btnConfirm) btnConfirm.onclick = executeCustomZoneBigQuery;

      const modal = document.getElementById('bq-confirm-modal');
      if (modal) modal.style.display = 'flex';
    }

    function executeCustomZoneBigQuery() {
      closeBqConfirmModal();

      // Restaurar onclick por defecto del modal
      const btnConfirm = document.getElementById('btn-modal-confirm-bq');
      if (btnConfirm) btnConfirm.onclick = executeGridUsersBigQuery;

      const activeOverlay = customDrawnOverlay || customZonePolygon;
      if (!activeOverlay) {
        showToast('No se encontró el trazado de la zona para consultar en BigQuery.', 'error');
        return;
      }
      customDrawnOverlay = activeOverlay;

      let geojson = null;
      if (customDrawnType === 'circle' || (activeOverlay.getRadius && typeof activeOverlay.getRadius === 'function')) {
        const center = activeOverlay.getCenter();
        const radiusM = activeOverlay.getRadius();
        const coords = [];
        for (let i = 0; i < 32; i++) {
          const angle = (i * 360 / 32) * (Math.PI / 180);
          const dLat = (radiusM * Math.cos(angle)) / 111320;
          const dLng = (radiusM * Math.sin(angle)) / (111320 * Math.cos(center.lat() * Math.PI / 180));
          coords.push([Number((center.lng() + dLng).toFixed(6)), Number((center.lat() + dLat).toFixed(6))]);
        }
        coords.push(coords[0]);
        geojson = { type: 'Polygon', coordinates: [coords] };
      } else if (activeOverlay.getPath && typeof activeOverlay.getPath === 'function') {
        const path = activeOverlay.getPath().getArray();
        const coords = path.map(p => [Number(p.lng().toFixed(6)), Number(p.lat().toFixed(6))]);
        if (coords.length > 0 && (coords[0][0] !== coords[coords.length - 1][0] || coords[0][1] !== coords[coords.length - 1][1])) {
          coords.push(coords[0]);
        }
        geojson = { type: 'Polygon', coordinates: [coords] };
      }

      if (!geojson) {
        showToast('No se pudo generar la geometría espacial de la zona.', 'error');
        return;
      }

      const currentMonth = document.getElementById('filter-month').value || '2026-09-01';
      const btn = document.getElementById('btn-calc-zone-bq');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="mini-spinner" style="width:10px; height:10px; border-width:1.5px; border-top-color:#0284c7;"></span> <span>Consultando BigQuery...</span>`;
      }

      showToast('Consultando usuarios exactos en BigQuery...', 'info');

      const payload = {
        month_date: currentMonth,
        geojson: geojson,
        country_id: null,
        country_code: null
      };

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios Exactos (BigQuery)</span>`;
          }

          if (res && res.success) {
            window.recordBigQueryConsumption(res.bytesProcessed, res.monthBytesProcessed);
            if (window.CURRENT_CUSTOM_ZONE_DATA) {
              window.CURRENT_CUSTOM_ZONE_DATA.peya_maus = res.total_users;
              window.CURRENT_CUSTOM_ZONE_DATA.dmart_maus = res.dmart_users || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.orders = res.total_orders || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.penetration_pct = Number(res.penetration_pct) || 0;
              window.CURRENT_CUSTOM_ZONE_DATA.afv = Number(res.afv) || 0;
              triggerAutoSaveCustomZone(window.CURRENT_CUSTOM_ZONE_DATA, true);
            }

            // Métricas 100% REALES de BigQuery (Cero Potenciales ni Targets simulados)
            document.getElementById('zone-val-peya-maus').textContent = res.total_users.toLocaleString('es-AR') + ' (BQ)';
            document.getElementById('zone-val-dmart-maus').textContent = (res.dmart_users || 0).toLocaleString('es-AR') + ' (BQ)';
            document.getElementById('zone-val-pen').textContent = (res.penetration_pct || '0.0') + '% (BQ)';
            document.getElementById('zone-val-orders').textContent = (res.total_orders || 0).toLocaleString('es-AR') + ' (BQ)';
            if (Number(res.afv) > 0) {
              document.getElementById('zone-val-afv').textContent = `$ ${Number(res.afv).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (BQ)`;
            }

            showToast(`BigQuery: ${res.total_users.toLocaleString('es-AR')} PeYa MAUs y ${(res.dmart_users || 0).toLocaleString('es-AR')} Dmart MAUs reales analizados.`, 'info');
          } else {
            showToast('Error en BigQuery: ' + (res ? res.error : 'Sin respuesta'), 'danger');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> <span>Calcular Usuarios Exactos (BigQuery)</span>`;
          }
          showToast('Error de conexión con BigQuery: ' + err.message, 'danger');
        })
        .calculateUsersInCustomPolygon(payload);
    }

    // ============================================================
    // GESTIÓN DE ZONAS GUARDADAS Y BIBLIOTECA COMPARTIDA
    // ============================================================
    window.CURRENT_CUSTOM_ZONE_DATA = null;
    window.SHARED_ZONES_LIST = [];
    let lastAutoSavedCoordsHash = null;
    let autoSaveZoneTimer = null;
    let sharedShapesOverlays = [];
    let isSharedShapesVisible = false;
    let sharedShapeHoverInfoWindow = null;

    function updateSharedZonesCounter() {
      const count = (window.SHARED_ZONES_LIST || []).length;
      const el1 = document.getElementById('shared-zones-count');
      if (el1) el1.textContent = count;
      const el2 = document.getElementById('shared-shapes-count-badge');
      if (el2) el2.textContent = count;
    }

    // ── Auto-Guardado en segundo plano en Google Sheets (Zonas_Guardadas) ──
    function triggerAutoSaveCustomZone(zone, force = false) {
      if (!zone || !zone.coords || zone.coords.length === 0) return;

      const coordsHash = JSON.stringify(zone.coords);
      if (!force && coordsHash === lastAutoSavedCoordsHash) return;
      lastAutoSavedCoordsHash = coordsHash;

      const autoName = zone.name || `Consulta ${zone.city || zone.country || 'Zona'} (${zone.area_km2} km²)`;
      const payload = Object.assign({}, zone, { name: autoName });

      if (typeof google === 'undefined' || !google.script || !google.script.run || typeof google.script.run.saveCustomZone !== 'function') {
        window.logLiveDebug('Aviso: saveCustomZone no disponible en Code.gs (actualizar Code.gs en editor)', 'warn');
        return;
      }

      window.logLiveDebug(`[Auto-Guardado] Registrando shape en Sheets en segundo plano...`);

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            payload.id = res.zoneId;
            payload.date = 'Hoy';
            payload.author = 'Yo';
            window.SHARED_ZONES_LIST = window.SHARED_ZONES_LIST || [];
            const existingIdx = window.SHARED_ZONES_LIST.findIndex(z => z.id === res.zoneId);
            if (existingIdx >= 0) {
              window.SHARED_ZONES_LIST[existingIdx] = payload;
            } else {
              window.SHARED_ZONES_LIST.unshift(payload);
            }
            updateSharedZonesCounter();
            window.logLiveDebug(`[Auto-Guardado OK] Shape "${autoName}" guardado en Sheets`, 'success');
            showToast(`Shape guardado automáticamente en Biblioteca ("${autoName}")`, 'success');
            if (isSharedShapesVisible) {
              drawSharedShapesListOnMap();
            }
          }
        })
        .withFailureHandler(err => {

    function drawSharedShapesListOnMap() {
      if (!map) return;
      clearSharedShapesFromMap();

      const list = window.SHARED_ZONES_LIST || [];
      if (list.length === 0) {
        const countBadge = document.getElementById('shared-shapes-count-badge');
        if (countBadge) countBadge.textContent = '0';
        return;
      }

      const activeCountry = document.getElementById('filter-country').value;
      const activeCity = document.getElementById('filter-city').value;
      const bounds = (isViewportFilterActive && map) ? map.getBounds() : null;

      // Autofiltrado inteligente de shapes comunitarios según país, ciudad y encuadre del mapa
      const filteredList = list.filter(zone => {
        if (activeCountry && zone.country && zone.country !== activeCountry) return false;
        if (activeCity && zone.city && zone.city !== activeCity) return false;

        if (bounds && zone.coords && zone.coords.length > 0) {
          const hasPointInBounds = zone.coords.some(pt => {
            if (pt.lat !== undefined && pt.lng !== undefined) {
              return bounds.contains(new google.maps.LatLng(pt.lat, pt.lng));
            }
            return false;
          });
          if (!hasPointInBounds) return false;
        }

        return true;
      });

      const countBadge = document.getElementById('shared-shapes-count-badge');
      if (countBadge) countBadge.textContent = filteredList.length;

      filteredList.forEach(zone => {
        if (!zone.coords || zone.coords.length === 0) return;

        let overlay = null;

        if (zone.type === 'circle' && zone.coords[0]) {
          const c = zone.coords[0];
          const center = new google.maps.LatLng(c.lat, c.lng);
          const radius = c.radius || (Math.sqrt((zone.area_km2 * 1000000) / Math.PI));

          overlay = new google.maps.Circle({
            center: center,
            radius: radius,
            map: map,
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            strokeOpacity: 0.85,
            fillColor: '#7c3aed',
            fillOpacity: 0.16,
            zIndex: 60,
            clickable: true
          });
        } else if (Array.isArray(zone.coords)) {
          const path = zone.coords.map(pt => new google.maps.LatLng(pt.lat, pt.lng));
          overlay = new google.maps.Polygon({
            paths: path,
            map: map,
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            strokeOpacity: 0.85,
            fillColor: '#7c3aed',
            fillOpacity: 0.16,
            zIndex: 60,
            clickable: true

        }

        if (!overlay) return;

        // Hover interactivo: resalta y muestra tooltip con métricas y autor
        overlay.addListener('mouseover', (e) => {
          overlay.setOptions({
            strokeColor: '#ea044e',
            strokeWeight: 3.5,
            fillColor: '#ea044e',
            fillOpacity: 0.35
          });

          const pos = e.latLng || (overlay.getCenter ? overlay.getCenter() : null);
          if (pos && map) {
            if (!sharedShapeHoverInfoWindow) {
              sharedShapeHoverInfoWindow = new google.maps.InfoWindow({
                disableAutoPan: true
              });
            }

            const contentHtml = `
              <div style="font-family:'Outfit',system-ui,sans-serif; padding:6px 9px; width:225px; box-sizing:border-box; color:var(--text-sheet-body);">
                <div style="display:flex; align-items:center; gap:5px; margin-bottom:3px;">
                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#7c3aed; flex-shrink:0;"></span>
                  <span style="font-weight:800; font-size:12px; color:#7c3aed; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${zone.name}</span>
                </div>
                <div style="font-size:9.5px; color:var(--text-sheet-muted); line-height:1.3; margin-bottom:4px;">
                  Consultado por: <b>${zone.author}</b><br>
                  Fecha: ${zone.date} · <b>${zone.area_km2} km²</b>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:3px; background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:4px; padding:3px 5px; font-family:'JetBrains Mono',monospace; font-size:9.5px; margin-bottom:4px;">
                  <div>PeYa MAUs: <b style="color:#0284c7;">${(zone.peya_maus || 0).toLocaleString('es-AR')}</b></div>
                  <div>Dmart: <b style="color:#059669;">${(zone.dmart_maus || 0).toLocaleString('es-AR')}</b></div>
                  <div>Penetración: <b style="color:var(--brand-red);">${zone.penetration_pct || 0}%</b></div>
                  <div>Órdenes: <b>${(zone.orders || 0).toLocaleString('es-AR')}</b></div>
                </div>
                <div style="font-size:8.5px; color:var(--brand-red); font-weight:800; text-align:center;">
                  Clic para activar y editar vértices
                </div>
              </div>
            `;

            sharedShapeHoverInfoWindow.setContent(contentHtml);
            sharedShapeHoverInfoWindow.setPosition(pos);
            sharedShapeHoverInfoWindow.open(map);
          }
        });

        overlay.addListener('mouseout', () => {
          overlay.setOptions({
            strokeColor: '#7c3aed',
            strokeWeight: 2,
            fillColor: '#7c3aed',
            fillOpacity: 0.16
          });
          if (sharedShapeHoverInfoWindow) {
            sharedShapeHoverInfoWindow.close();
          }
        });

        overlay.addListener('click', () => {
          if (sharedShapeHoverInfoWindow) {
            sharedShapeHoverInfoWindow.close();
          }
          loadSavedZoneOnMapById(zone.id);
        });

        sharedShapesOverlays.push(overlay);
      });

      window.logLiveDebug(`[Shapes Consultados] ${filteredList.length} polígonos comunitarios proyectados en el mapa (modo autofiltrado)`, 'success');
    }

    function generateZoneSvgThumbnail(coords, type) {
      if (type === 'circle' || !coords || !Array.isArray(coords) || coords.length < 3) {
        return `
          <svg width="68" height="52" viewBox="0 0 68 52" style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; flex-shrink:0;" title="Zona circular">
            <circle cx="34" cy="26" r="16" fill="rgba(2,132,199,0.22)" stroke="#0284c7" stroke-width="1.8"/>
            <circle cx="34" cy="26" r="2.5" fill="#ea044e"/>
          </svg>
        `;
      }
      try {
        const lats = coords.map(c => Number(c.lat)).filter(n => !isNaN(n));
        const lngs = coords.map(c => Number(c.lng)).filter(n => !isNaN(n));
        if (lats.length < 3) throw new Error();

        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        const spanLat = maxLat - minLat || 0.001;
        const spanLng = maxLng - minLng || 0.001;

        const pad = 6;
        const w = 68 - (pad * 2);
        const h = 52 - (pad * 2);

        const points = coords.map(c => {
          const x = pad + ((Number(c.lng) - minLng) / spanLng) * w;
          const y = pad + (1 - (Number(c.lat) - minLat) / spanLat) * h;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');

        return `
          <svg width="68" height="52" viewBox="0 0 68 52" style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; flex-shrink:0;" title="Polígono vectorial">
            <line x1="0" y1="26" x2="68" y2="26" stroke="var(--border-subtle)" stroke-width="0.8" stroke-dasharray="2 2"/>
            <line x1="34" y1="0" x2="34" y2="52" stroke="var(--border-subtle)" stroke-width="0.8" stroke-dasharray="2 2"/>
            <polygon points="${points}" fill="rgba(234,4,78,0.22)" stroke="#ea044e" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        `;
      } catch(e) {
        return `
          <svg width="68" height="52" viewBox="0 0 68 52" style="background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:6px; flex-shrink:0;">
            <rect x="14" y="10" width="40" height="32" rx="4" fill="rgba(234,4,78,0.15)" stroke="#ea044e" stroke-width="1.5"/>
          </svg>
        `;
      }
    }
