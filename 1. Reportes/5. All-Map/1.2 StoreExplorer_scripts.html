    window.loadSavedZoneOnMapById = function(zoneId) {
      const zone = (window.SHARED_ZONES_LIST || []).find(z => String(z.id).trim() === String(zoneId).trim());
      if (!zone) {
        showToast('Zona no encontrada.', 'error');
        return;
      }

      clearCustomDrawnZone();

      if (zone.type === 'circle' && zone.coords && zone.coords[0]) {
        const c = zone.coords[0];
        const center = new google.maps.LatLng(c.lat, c.lng);
        const radius = c.radius || (Math.sqrt((zone.area_km2 * 1000000) / Math.PI));

        const circle = new google.maps.Circle({
          center: center,
          radius: radius,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          editable: true,
          draggable: false,
          clickable: true,
          zIndex: 99
        });

        circle.addListener('radius_changed', () => analyzeCustomDrawnZone(circle, 'circle'));
        circle.addListener('center_changed', () => analyzeCustomDrawnZone(circle, 'circle'));

        customDrawnOverlay = circle;
        customDrawnType = 'circle';

        map.panTo(center);
        map.setZoom(14);
        analyzeCustomDrawnZone(circle, 'circle');

      } else if (zone.coords && Array.isArray(zone.coords)) {
        const path = zone.coords.map(pt => new google.maps.LatLng(pt.lat, pt.lng));
        const poly = new google.maps.Polygon({
          paths: path,
          map: map,
          strokeColor: '#0284c7',
          strokeWeight: 2.5,
          fillColor: '#0284c7',
          fillOpacity: 0.22,
          editable: true,
          draggable: false,
          clickable: true,
          zIndex: 99
        });

        poly.getPath().addListener('set_at', () => analyzeCustomDrawnZone(poly, 'polygon'));
        poly.getPath().addListener('insert_at', () => analyzeCustomDrawnZone(poly, 'polygon'));
        poly.getPath().addListener('remove_at', () => analyzeCustomDrawnZone(poly, 'polygon'));

        customDrawnOverlay = poly;
        customDrawnType = 'polygon';

        const bounds = new google.maps.LatLngBounds();
        path.forEach(pt => bounds.extend(pt));
        map.fitBounds(bounds);

        analyzeCustomDrawnZone(poly, 'polygon');
      }

      const clearBtn = document.getElementById('btn-clear-drawn-zone');
      if (clearBtn) clearBtn.style.display = 'inline-flex';

      // Renovar ciclo de vida de 60 días en la planilla al ser consultada
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.touchSavedZone(zoneId);
      }

      closeSharedZonesModal();
      showToast(`Zona "${zone.name}" cargada en el mapa con éxito. Podés arrastrar los puntos blancos para modificar sus vértices.`, 'success');
    };

        opt.textContent = `${w.warehouse_name} (${w.neighborhood || w.city})`;

        lastLoadedMetricsPayload.stores = lastLoadedMetricsPayload.stores.filter(
          s => String(s.warehouse_id).trim() !== normId
        );
        renderComparativeKpiTable(lastLoadedMetricsPayload);
      }

      renderWarehouseCards();
      updateSelectionAndRefresh();
    }

      selectAllWarehouses(false);

      const normId = String(whId).trim();
      const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
      if (!w || !map) return;

      const lat = Number(w.lat);
      const lng = Number(w.lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
        map.panTo({ lat, lng });
        if (map.getZoom() < 14) map.setZoom(14);
        showWarehouseDetailInfoWindow(w, { lat, lng });

    function renderComparativeKpiTable(m) {
      lastLoadedMetricsPayload = m;
      updateQuickAddSelect();

      if (!table) return;

      let stores = (m && m.stores) ? [...m.stores] : [];

            stores.push({
              warehouse_id: w.warehouse_id,
              warehouse_name: w.warehouse_name,
              city: w.city,
              country: w.country,
              total_orders: w.orders || 0

        theadHtml += `
          <th style="width:180px; min-width:180px; max-width:180px; padding:8px 10px; text-align:center;">
            <div style="display:flex; flex-direction:column; gap:4px;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
                <div style="display:flex; align-items:center; gap:5px; min-width:0; flex:1;">
                  ${flag}
                  <span style="font-weight:800; font-size:11.5px; color:var(--text-sheet-title); word-break:break-word; line-height:1.2; text-align:left;" title="${s.warehouse_name}">${s.warehouse_name}</span>
                </div>
                <div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">
                  <button type="button" onclick="focusWarehouseOnMap('${s.warehouse_id}')" title="Centrar en mapa" style="background:var(--bg-sheet-card); border:1px solid var(--border-sheet); border-radius:4px; cursor:pointer; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-sheet-title); transition:all 0.12s;">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>

                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

      theadHtml += `
          </tr>

      // 2. Filas de datos (TBODY)
      let tbodyHtml = '<tbody>';

      visibleDefs.forEach(def => {

              <td colspan="${stores.length + 1}" style="color:${def.color}; border-left:4px solid ${def.color}; background:linear-gradient(90deg, rgba(234,4,78,0.06) 0%, transparent 100%) !important;">
                <span style="display:inline-flex; align-items:center; gap:6px;">
                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${def.color};"></span>
                  ${def.title}
                </span>
              </td>
            </tr>
          `;
          return;
        }

        // Determinar el mejor valor si hay 2 o más tiendas
        let bestVal = null;
        if (stores.length > 1) {
          const numVals = stores.map(s => Number(s[def.key])).filter(n => !isNaN(n) && n !== null && n !== undefined);
          if (numVals.length > 0) {
            bestVal = def.better === 'high' ? Math.max(...numVals) : Math.min(...numVals);
          }
        }

        tbodyHtml += `
          <tr>
            <td style="padding:3.5px 8px; width:195px; min-width:195px; max-width:195px;">
              <div style="font-weight:700; font-size:10px; color:var(--text-sheet-title); line-height:1.15;">${def.label}</div>
              <div style="font-size:8px; color:var(--text-sheet-muted); line-height:1.1; margin-top:1px;">${def.desc}</div>
            </td>
        `;

        stores.forEach(s => {
          const rawVal = s[def.key];
          const formatted = def.fmt(rawVal);
          const isBest = (bestVal !== null && Number(rawVal) === bestVal && (def.better === 'high' ? bestVal > 0 : true));
          
          tbodyHtml += `
            <td class="matrix-val-cell" style="width:125px; min-width:115px; max-width:135px; padding:3.5px 6px; font-size:10.5px; text-align:center;">

            </td>
          `;
        });

        tbodyHtml += `</tr>`;
      });

      tbodyHtml += '</tbody>';
      table.innerHTML = theadHtml + tbodyHtml;

            if (!m) return;
            CLIENT_MEMORY_CACHE.metrics.set(cacheKey, m);
            applyMetricsToUI(m);
          })
          .withFailureHandler(err => {
            console.warn('Aviso cargando métricas by WHS:', err.message);

            if (table) {
              table.innerHTML = `
                <tbody>

    function renderRingsVisualBars(data) {
      const container = document.getElementById('rings-bars-visual');
      const totalLabel = document.getElementById('rings-chart-total-label');
      if (!container) return;

      const ringLabels = ['< 1 KM', '1-2 KM', '2-3 KM', '3-4 KM', '> 4 KM'];
      const ringColors = ['#ea044e', '#f97316', '#f59e0b', '#10b981', '#6366f1'];

      const ringTotals = {
        '< 1 KM': 0,
        '1-2 KM': 0,
        '2-3 KM': 0,
        '3-4 KM': 0,
        '> 4 KM': 0
      };

      const key = currentRingsChartMetric;

      (data || []).forEach(r => {
        const ring = r.anillo;
        if (ringTotals[ring] !== undefined) {
          let v = 0;
          if (key === 'orders') v = Number(r.dmart_orders || r.orders || 0);
          else if (key === 'dmart_maus') v = Number(r.dmart_maus_covered || r.dmart_maus || 0);
          else if (key === 'penetration_pct') v = Number(r.penetration_pct || 0);
          else if (key === 'frequency') {
            const ords = Number(r.dmart_orders || r.orders || 0);
            const maus = Number(r.dmart_maus_covered || r.dmart_maus || 0);
            v = maus > 0 ? Number((ords / maus).toFixed(1)) : 2.1;
          }
          else if (key === 'avg_dt_min') v = Number(r.avg_dt_min || r.avg_dt || 0);
          else if (key === 'covered_maus') v = Number(r.covered_maus || 0);
          ringTotals[ring] += v;
        }
      });

      if (key === 'penetration_pct' || key === 'avg_dt_min' || key === 'frequency') {
        const counts = { '< 1 KM': 0, '1-2 KM': 0, '2-3 KM': 0, '3-4 KM': 0, '> 4 KM': 0 };
        (data || []).forEach(r => { if (counts[r.anillo] !== undefined) counts[r.anillo]++; });
        ringLabels.forEach(lbl => {
          if (counts[lbl] > 1) ringTotals[lbl] = Number((ringTotals[lbl] / counts[lbl]).toFixed(1));
        });
      }

      const values = ringLabels.map(l => ringTotals[l]);
      const maxVal = Math.max(...values, 1);
      const sumVal = values.reduce((a, b) => a + b, 0);

      if (totalLabel) {
        if (key === 'penetration_pct') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)}%`;
        } else if (key === 'frequency') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)}x`;
        } else if (key === 'avg_dt_min') {
          totalLabel.textContent = `Promedio: ${(sumVal / 5).toFixed(1)} min`;
        } else {
          totalLabel.textContent = `Total: ${Math.round(sumVal).toLocaleString('es-AR')}`;
        }
      }

      let barsHtml = '';
      ringLabels.forEach((lbl, idx) => {
        const val = ringTotals[lbl];
        const heightPct = Math.max(14, Math.round((val / maxVal) * 82));
        const color = ringColors[idx];

        let displayVal = Math.round(val).toLocaleString('es-AR');
        if (key === 'penetration_pct') displayVal = `${val.toFixed(1)}%`;
        else if (key === 'frequency') displayVal = `${val.toFixed(1)}x`;
        else if (key === 'avg_dt_min') displayVal = `${val.toFixed(1)}m`;

        barsHtml += `
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
            <div style="font-size:9.5px; font-weight:800; font-family:'JetBrains Mono',monospace; color:var(--text-sheet-title); margin-bottom:4px;">
              ${displayVal}
            </div>
            <div style="width:100%; max-width:55px; height:${heightPct}%; background:${color}; border-radius:4px 4px 0 0; transition:height 0.4s ease; box-shadow:0 2px 6px ${color}44;"></div>
            <div style="font-size:9px; font-weight:700; color:var(--text-sheet-muted); margin-top:4px; white-space:nowrap;">
              ${lbl}
            </div>
          </div>
        `;
      });

      container.innerHTML = barsHtml;
    }

      sortedStores.forEach(w => {

        items.push({
          id: id,
          name: `${w.warehouse_name}${cityStr}`
        });
      });

      COMBOBOX_ITEMS['rings-store'] = items;

      select.innerHTML = '';
      items.forEach(it => {
        const opt = document.createElement('option');
        opt.value = it.id;
        opt.textContent = it.name;
        if (it.id === currentRingsStoreFilter) opt.selected = true;
        select.appendChild(opt);

        .getMultipleStoreRingsData(idsArray, currentMonth);

      currentRingsStoreFilter = whId || 'ALL';

        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
        if (w) {
          const pos = getWarehousePosition(w);
          if (pos && map) {
            map.panTo(pos);
            map.setZoom(14);
          }
        }
      }

      applyRingsFilterAndSyncMap();
    }

    function filterRingTable(ringFilter, btn) {
      if (btn) {
        document.querySelectorAll('#ring-pills-container .ring-pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      currentRingDistanceFilter = ringFilter;
      applyRingsFilterAndSyncMap();
    }

    function applyRingsFilterAndSyncMap() {
      // 1. Filtrar datos de la tabla y del gráfico
      let filtered = allRingsData;
      if (currentRingsStoreFilter !== 'ALL') {
        filtered = filtered.filter(r => String(r.warehouse_id).trim() === String(currentRingsStoreFilter).trim());
      }
      if (currentRingDistanceFilter !== 'ALL') {
        filtered = filtered.filter(r => r.anillo === currentRingDistanceFilter);
      }
      renderRingsTable(filtered);
      renderRingsVisualBars(filtered);

      // 2. Filtrar polígonos de anillos en el mapa en tiempo real
      ringCircles.forEach(poly => {
        if (!poly) return;
        const matchRing = (currentRingDistanceFilter === 'ALL' || poly._ringLabel === currentRingDistanceFilter);
        const matchStore = (currentRingsStoreFilter === 'ALL' || poly._whId === currentRingsStoreFilter);
        poly.setVisible(matchRing && matchStore);
      });
    }

    function getRingColorHex(anillo) {
      const a = String(anillo || '').trim();
      if (a.includes('< 1') || a.includes('<1')) return '#ea044e';
      if (a.includes('1-2')) return '#f97316';
      if (a.includes('2-3')) return '#f59e0b';
      if (a.includes('3-4')) return '#10b981';
      if (a.includes('4-5')) return '#0284c7';
      if (a.includes('5-6.5') || a.includes('5-6')) return '#6366f1';
      if (a.includes('6.5-8') || a.includes('6-8')) return '#8b5cf6';
      return '#64748b';
    }

          </td>
          <td>
            <span style="font-weight:700; color:var(--text-sheet-body); background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); padding:2px 6px; border-radius:4px; font-size:10px;">
              ${r.cuadrante || r.cuadrante_key || '—'}
            </span>
          </td>
          <td style="font-family:'JetBrains Mono',monospace;">${formatNumber(r.covered_maus)}</td>
          <td style="font-family:'JetBrains Mono',monospace;">${formatNumber(r.dmart_maus_covered)}</td>
          <td style="font-weight:700; font-family:'JetBrains Mono',monospace; color:${isPenLow ? '#ef4444' : '#10b981'};">${r.penetration_pct}%</td>
          <td style="font-family:'JetBrains Mono',monospace;">${formatNumber(r.dmart_orders)}</td>
          <td style="font-family:'JetBrains Mono',monospace;">${formatCurrency(r.net_sales)}</td>

    // ============================================================
    // 1. SIMULADOR DE EXPANSIÓN IN-SITU (WHAT-IF NUEVA DARKSTORE)
    // ============================================================
    let isExpansionSimActive = false;
    let simProposedMarker = null;
    let simProposedPolygon = null;
    let simProposedRadiusKm = 2.5;
    let simProposedCenter = null;

    function toggleExpansionSimulator() {
      isExpansionSimActive = !isExpansionSimActive;
      const card = document.getElementById('expansion-sim-card');
      const btn = document.getElementById('btn-expansion-sim-trigger');

      if (isExpansionSimActive) {
        if (card) card.style.display = 'block';
        if (btn) {
          btn.style.background = '#047857';
          btn.style.boxShadow = '0 0 10px rgba(16,185,129,0.5)';
        }
        if (map) map.setOptions({ draggableCursor: 'crosshair' });
        showToast('Simulador de Expansión: hacé clic en el mapa para posicionar la nueva tienda.', 'info');
      } else {
        closeExpansionSimulator();
      }
    }

    function closeExpansionSimulator() {
      isExpansionSimActive = false;
      const card = document.getElementById('expansion-sim-card');
      const btn = document.getElementById('btn-expansion-sim-trigger');
      if (card) card.style.display = 'none';
      if (btn) {
        btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
        btn.style.boxShadow = 'none';
      }
      if (map) map.setOptions({ draggableCursor: null });

      if (simProposedMarker) {
        simProposedMarker.setMap(null);
        simProposedMarker = null;
      }
      if (simProposedPolygon) {
        simProposedPolygon.setMap(null);
        simProposedPolygon = null;
      }
      simProposedCenter = null;
    }

    function onSimulationMapClick(latLng) {
      if (!isExpansionSimActive || !latLng) return;
      simProposedCenter = { lat: latLng.lat(), lng: latLng.lng() };

      if (!simProposedMarker) {
        simProposedMarker = new google.maps.Marker({
          position: latLng,
          map: map,
          draggable: true,
          title: 'Nueva Darkstore Propuesta',
          icon: {
            url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 38 46" fill="none">
                <path d="M19 2C10.716 2 4 8.716 4 17C4 28 19 39 19 39C19 39 34 28 34 17C34 8.716 27.284 2 19 2Z" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
                <circle cx="19" cy="17" r="10" fill="#ffffff"/>
                <path d="M14 12v11h2v-4h6l-1-3 1-4h-8z" fill="#059669"/>
              </svg>
            `),
            scaledSize: new google.maps.Size(32, 40),
            anchor: new google.maps.Point(16, 38)
          },
          zIndex: 9999
        });

        simProposedMarker.addListener('dragend', function(e) {
          simProposedCenter = { lat: e.latLng.lat(), lng: e.latLng.lng() };
          recalculateSimulatedStore();
        });
      } else {
        simProposedMarker.setPosition(latLng);
      }

      const hint = document.getElementById('sim-placement-hint');
      if (hint) hint.style.display = 'none';
      const panel = document.getElementById('sim-results-panel');
      if (panel) panel.style.display = 'block';

      recalculateSimulatedStore();
    }

    function updateSimulatedRadius(val) {
      simProposedRadiusKm = parseFloat(val) || 2.5;
      recalculateSimulatedStore();
    }

    function recalculateSimulatedStore() {
      if (!simProposedCenter || typeof turf === 'undefined') return;
      const centerPt = [simProposedCenter.lng, simProposedCenter.lat];

      const circlePoly = turf.circle(centerPt, simProposedRadiusKm, { steps: 48, units: 'kilometers' });
      const totalAreaKm2 = Number((Math.PI * simProposedRadiusKm * simProposedRadiusKm).toFixed(2));

      const coords = circlePoly.geometry.coordinates[0].map(c => ({ lat: c[1], lng: c[0] }));
      if (simProposedPolygon) {
        simProposedPolygon.setPath(coords);
      } else {
        simProposedPolygon = new google.maps.Polygon({
          paths: coords,
          map: map,
          strokeColor: '#10b981',
          strokeOpacity: 0.9,
          strokeWeight: 2.2,
          fillColor: '#10b981',
          fillOpacity: 0.22,
          zIndex: 50
        });
      }

      let totalOverlapAreaKm2 = 0;
      const affectedStores = [];

      allWarehouses.forEach(w => {
        const pos = getWarehousePosition(w);
        if (!pos) return;
        const distKm = getDistanceKm(simProposedCenter.lat, simProposedCenter.lng, pos.lat, pos.lng);
        // Analizar tiendas en radio de influencia (hasta radio propuesto + 5.5 km)
        if (distKm > (simProposedRadiusKm + 5.5)) return;

        // 1. Obtener el shape GeoJSON real del almacén (de memoria o caché de polígonos)
        let storeGeojson = w.geojson || w.shape_geojson;
        const wIdStr = String(w.warehouse_id).trim();

        if (!storeGeojson) {
          const cached = CLIENT_MEMORY_CACHE.polygons.get(`${wIdStr}__2026-10-01`) || 
                         CLIENT_MEMORY_CACHE.polygons.get(`${wIdStr}__2026-09-01`) ||
                         activePolygonsMap.get(wIdStr);
          if (cached && cached.geojson) storeGeojson = cached.geojson;
          else if (cached && cached.coords) {
            storeGeojson = {
              type: 'Polygon',
              coordinates: [cached.coords.map(c => [c.lng, c.lat])]
            };
          }
        }

        let storeFeature = null;
        if (storeGeojson) {
          try {
            storeFeature = turf.feature(storeGeojson);
          } catch(eFeat) {}
        }

        // Si no tiene GeoJSON poligonal cargado en memoria, usar círculo de su área oficial de cobertura
        if (!storeFeature) {
          const storeRadiusKm = Math.sqrt((Number(w.coverage_area_km2) || 16) / Math.PI);
          try {
            storeFeature = turf.circle([pos.lng, pos.lat], storeRadiusKm, { steps: 36, units: 'kilometers' });
          } catch(eCirc) {}
        }

        if (storeFeature) {
          try {
            const isect = turf.intersect(circlePoly, storeFeature);
            if (isect) {
              const overlapKm2 = turf.area(isect) / 1000000;
              if (overlapKm2 > 0.05) {
                totalOverlapAreaKm2 += overlapKm2;
                const storeArea = Number(w.coverage_area_km2) || 16;
                const overlapPct = Math.min(100, (overlapKm2 / storeArea) * 100);

                affectedStores.push({
                  name: w.warehouse_name,
                  distKm: distKm.toFixed(1),
                  overlapKm2: overlapKm2.toFixed(2),
                  overlapPct: overlapPct.toFixed(1)
                });
              }
            }
          } catch(eIsect) {}
        }
      });

      const safeOverlapKm2 = Math.min(totalAreaKm2, totalOverlapAreaKm2);
      const whiteSpaceKm2 = Math.max(0, totalAreaKm2 - safeOverlapKm2);
      const cannibalPct = Math.min(100, Math.round((safeOverlapKm2 / totalAreaKm2) * 100));
      const whiteSpacePct = 100 - cannibalPct;

      // Obtener medias reales de las tiendas circundantes o del país activo
      let realDensity = 0, sumArea = 0, sumUsers = 0;
      let realOrdersPerKm2 = 0, sumOrd = 0;
      let realAfv = 0, countAfv = 0;
      let realCpo = 0, countCpo = 0;
      let realFreq = 0, countFreq = 0;

      const sampleStores = affectedStores.length > 0 
        ? allWarehouses.filter(w => affectedStores.some(a => a.name === w.warehouse_name))
        : allWarehouses.filter(w => w.country === (affectedStores[0]?.country || 'Argentina'));

      sampleStores.forEach(w => {
        const a = Number(w.coverage_area_km2) || 0;
        const u = Number(w.peya_users || w.covered_maus) || 0;
        const o = Number(w.orders) || 0;
        if (a > 0 && u > 0) { sumArea += a; sumUsers += u; }
        if (a > 0 && o > 0) { sumOrd += o; }
        if (Number(w.afv_aov_amount) > 0) { realAfv += Number(w.afv_aov_amount); countAfv++; }
        if (Number(w.rider_cpo_dmarts) > 0) { realCpo += Number(w.rider_cpo_dmarts); countCpo++; }
        if (Number(w.dmart_users) > 0 && o > 0) { realFreq += (o / Number(w.dmart_users)); countFreq++; }
      });

      const densityKm2 = sumArea > 0 ? (sumUsers / sumArea) : 950;
      const orderDensityKm2 = sumArea > 0 ? (sumOrd / sumArea) : 150;
      const avgAfvVal = countAfv > 0 ? (realAfv / countAfv) : 15.0;
      const avgCpoVal = countCpo > 0 ? (realCpo / countCpo) : 1.85;
      const avgFreqVal = countFreq > 0 ? (realFreq / countFreq) : 2.2;

      const estMausInRadio = Math.round(totalAreaKm2 * densityKm2);
      const estNewOrders = Math.round(whiteSpaceKm2 * orderDensityKm2 + safeOverlapKm2 * (orderDensityKm2 * 0.35));
      const estGmv = Math.round(estNewOrders * avgAfvVal);

      const wsVal = document.getElementById('sim-whitespace-val');
      if (wsVal) wsVal.textContent = `${whiteSpacePct}%`;
      const wsArea = document.getElementById('sim-whitespace-area');
      if (wsArea) wsArea.textContent = `${whiteSpaceKm2.toFixed(2)} km² vírgenes`;

      const canVal = document.getElementById('sim-cannibal-val');
      if (canVal) canVal.textContent = `${cannibalPct}%`;
      const canStores = document.getElementById('sim-cannibal-stores');
      if (canStores) canStores.textContent = `${affectedStores.length} almacenes afectados`;

      const mausEl = document.getElementById('sim-maus-val');
      if (mausEl) mausEl.textContent = estMausInRadio.toLocaleString('es-AR');
      const ordsEl = document.getElementById('sim-orders-val');
      if (ordsEl) ordsEl.textContent = `${estNewOrders.toLocaleString('es-AR')} / mes`;
      const gmvEl = document.getElementById('sim-gmv-val');
      if (gmvEl) gmvEl.textContent = `$ ${estGmv.toLocaleString('es-AR')}`;

      const cpoEl = document.getElementById('sim-cpo-val');
      if (cpoEl) cpoEl.textContent = `$ ${avgCpoVal.toFixed(2)}`;

      const freqEl = document.getElementById('sim-freq-val');
      if (freqEl) freqEl.textContent = `${avgFreqVal.toFixed(1)}x órd/usuario`;

      // Detalle de almacenes afectados por solapamiento
      const listEl = document.getElementById('sim-affected-stores-list');
      if (listEl) {
        if (affectedStores.length > 0) {
          listEl.innerHTML = '<div style="font-weight:800; color:var(--text-sheet-title); margin-bottom:3px;">Almacenes con solapamiento:</div>' +
            affectedStores.map(a => `
              <div style="display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid var(--border-subtle); font-size:9.5px;">
                <span style="font-weight:700; color:var(--text-sheet-title);">${a.name} <span style="font-size:8px; color:var(--text-sheet-muted);">(${a.distKm} km)</span></span>
                <span style="color:#ea044e; font-family:'JetBrains Mono',monospace; font-weight:700;">${a.overlapKm2} km² (${a.overlapPct}%)</span>
              </div>
            `).join('');
        } else {
          listEl.innerHTML = '<span style="color:#10b981; font-weight:700;">✓ 100% Territorio Virgen (Cero Canibalización)</span>';
        }
      }

      // Propuesta de Reorganización de Shapes & Optimización de Anillos Concéntricos
      const reorgBox = document.getElementById('sim-reorg-proposal-box');
      if (reorgBox) {
        if (affectedStores.length > 0) {
          reorgBox.style.display = 'block';

          // Proyección matemática de redistribución de anillos:
          // Antes: ~35% en anillos 1-2 km, 45% en 2-4 km, 20% en >4 km
          // Al introducir la nueva tienda en el corazón de la zona, los pedidos se concentran en anillos <2 km
          const beforeInnerPct = Math.max(25, 45 - Math.round(cannibalPct * 0.25));
          const beforeMidPct = 45;
          const beforeOuterPct = 100 - beforeInnerPct - beforeMidPct;

          const afterInnerPct = Math.min(88, Math.round(beforeInnerPct + (cannibalPct * 0.65)));
          const afterOuterPct = Math.max(2, Math.round(beforeOuterPct * 0.25));
          const afterMidPct = 100 - afterInnerPct - afterOuterPct;

          const gainInner = afterInnerPct - beforeInnerPct;

          const effBadge = document.getElementById('sim-reorg-efficiency-badge');
          if (effBadge) effBadge.textContent = `+${gainInner}% en Anillos 1 y 2`;

          const reorgDesc = document.getElementById('sim-reorg-desc');
          if (reorgDesc) {
            const storeNames = affectedStores.slice(0, 2).map(s => s.name).join(' y ');
            reorgDesc.textContent = `Reasignando los sectores lejanos (>3 km) de ${storeNames} a esta nueva darkstore, concentrando el ${afterInnerPct}% de clientes en los primeros 2 km.`;
          }

          // Actualizar gráfico de barras comparativas
          const bBeforeInner = document.getElementById('sim-bar-before-inner');
          if (bBeforeInner) bBeforeInner.style.width = `${beforeInnerPct}%`;
          const bBeforeMid = document.getElementById('sim-bar-before-mid');
          if (bBeforeMid) bBeforeMid.style.width = `${beforeMidPct}%`;
          const bBeforeOuter = document.getElementById('sim-bar-before-outer');
          if (bBeforeOuter) bBeforeOuter.style.width = `${beforeOuterPct}%`;
          const lblBefore = document.getElementById('sim-lbl-before-pct');
          if (lblBefore) lblBefore.textContent = `${beforeInnerPct}%`;

          const bAfterInner = document.getElementById('sim-bar-after-inner');
          if (bAfterInner) bAfterInner.style.width = `${afterInnerPct}%`;
          const bAfterMid = document.getElementById('sim-bar-after-mid');
          if (bAfterMid) bAfterMid.style.width = `${afterMidPct}%`;
          const bAfterOuter = document.getElementById('sim-bar-after-outer');
          if (bAfterOuter) bAfterOuter.style.width = `${afterOuterPct}%`;
          const lblAfter = document.getElementById('sim-lbl-after-pct');
          if (lblAfter) lblAfter.textContent = `${afterInnerPct}%`;

          // Ahorros logísticos calculados
          const dtSavings = (4.5 + (cannibalPct * 0.07)).toFixed(1);
          const cpoSavings = (0.35 + (cannibalPct * 0.009)).toFixed(2);
          const dtEl = document.getElementById('sim-reorg-dt-savings');
          if (dtEl) dtEl.textContent = `Ahorro DT: -${dtSavings} min`;
          const cpoEl = document.getElementById('sim-reorg-cpo-savings');
          if (cpoEl) cpoEl.textContent = `Rider CPO: -$ ${cpoSavings}/ord`;
        } else {
          reorgBox.style.display = 'none';
        }
      }
    }

    function calculateSimulatedStoreBigQuery() {
      if (!simProposedCenter) {
        showToast('Hacé clic en el mapa para ubicar la nueva tienda primero.', 'warning');
        return;
      }

      const btn = document.getElementById('btn-sim-calc-bq');
      const btnText = document.getElementById('btn-sim-calc-bq-text');
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.7';
      }
      if (btnText) {
        btnText.textContent = 'Consultando BigQuery (~35 MB)...';
      }

      showToast('Consultando domicilios y pedidos en BigQuery...', 'info');

      const circlePoly = turf.circle([simProposedCenter.lng, simProposedCenter.lat], simProposedRadiusKm, { steps: 36, units: 'kilometers' });
      const coords = circlePoly.geometry.coordinates[0].map(c => ({ lat: c[1], lng: c[0] }));
      const month = getCurrentActiveMonth();

      google.script.run
        .withSuccessHandler(res => {
          if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
          }
          if (btnText) {
            btnText.textContent = '✓ Datos 100% verificados con BigQuery';
          }
          if (res && !res.error) {
            const mausEl = document.getElementById('sim-maus-val');
            if (mausEl && res.peya_maus) mausEl.textContent = Number(res.peya_maus).toLocaleString('es-AR');

            const ordsEl = document.getElementById('sim-orders-val');
            if (ordsEl && res.orders) ordsEl.textContent = `${Number(res.orders).toLocaleString('es-AR')} / mes`;

            const gmvEl = document.getElementById('sim-gmv-val');
            if (gmvEl && res.net_sales) gmvEl.textContent = `$ ${Number(res.net_sales).toLocaleString('es-AR')}`;

            showToast(`BigQuery completado: ${Number(res.peya_maus || 0).toLocaleString('es-AR')} usuarios censados`, 'success');
          } else {
            showToast('Aviso: se mantuvieron los cálculos espaciales proyectados.', 'info');
          }
        })
        .withFailureHandler(err => {
          if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
          }
          if (btnText) {
            btnText.textContent = 'Calcular datos reales con BigQuery (~35 MB)';
          }
          console.warn('Error en BQ simulación:', err.message);
          showToast('Aviso de conexión: se mantienen las métricas espaciales proyectadas.', 'info');
        })
        .calculateCustomZoneMetricsBigQuery(coords, month);
    }

    function saveSimulatedStoreZone() {
      if (!simProposedCenter) return;
      const zoneData = {
        name: `Propuesta Nueva Darkstore (${simProposedRadiusKm} km)`,
        coords: simProposedPolygon ? simProposedPolygon.getPath().getArray().map(p => ({ lat: p.lat(), lng: p.lng() })) : [],
        type: 'polygon',
        area_km2: Number((Math.PI * simProposedRadiusKm * simProposedRadiusKm).toFixed(2)),
        peya_maus: parseInt(document.getElementById('sim-maus-val').textContent.replace(/\./g, ''), 10) || 0,
        dmart_maus: Math.round((parseInt(document.getElementById('sim-orders-val').textContent.replace(/\D/g, ''), 10) || 500) * 0.48),
        orders: parseInt(document.getElementById('sim-orders-val').textContent.replace(/\D/g, ''), 10) || 0,
        afv: 15.8,
        avg_dt: 18.5,
        penetration_pct: 14.5
      };
      triggerAutoSaveCustomZone(zoneData, true);
      showToast('Propuesta de nueva darkstore guardada en biblioteca comunitaria.', 'success');
    }

    // ============================================================
    // 2. DETECCIÓN DE ZONAS DE SOLAPAMIENTO (DOBLE COBERTURA)
    // ============================================================
    let isDisputeZonesVisible = false;
    let disputePolygons = [];
    let disputeInfoWindow = null;

    function toggleDisputeZonesVisibility(force) {
      if (force !== undefined) isDisputeZonesVisible = force;
      else isDisputeZonesVisible = !isDisputeZonesVisible;

      const toggle = document.getElementById('dispute-zones-toggle');
      if (toggle) toggle.checked = isDisputeZonesVisible;

      const btn = document.getElementById('btn-toggle-dispute-zones');
      if (btn) {
        if (isDisputeZonesVisible) {
          btn.style.background = 'rgba(234, 4, 78, 0.12)';
          btn.style.borderColor = 'var(--brand-red)';
          btn.style.color = 'var(--brand-red)';
        } else {
          btn.style.background = 'var(--bg-sheet-card)';
          btn.style.borderColor = 'var(--border-sheet)';
          btn.style.color = 'var(--text-sheet-body)';
        }
      }

      if (!isDisputeZonesVisible) {
        disputePolygons.forEach(p => p.setMap(null));
        disputePolygons = [];
        if (disputeInfoWindow) disputeInfoWindow.close();
        showToast('Zonas de Solapamiento desactivadas', 'info');
        return;
      }

      calculateAndDrawDisputeZones();
      showToast('Zonas de Solapamiento activadas', 'success');
    }

    function calculateAndDrawDisputeZones() {
      disputePolygons.forEach(p => p.setMap(null));
      disputePolygons = [];
      if (!map || typeof turf === 'undefined') return;
      if (!disputeInfoWindow) disputeInfoWindow = new google.maps.InfoWindow();

      const currentMonth = getCurrentActiveMonth();

      // 1. Obtener únicamente las tiendas que tienen polígonos activos en el mapa o están seleccionadas
      const candidateList = [];

      // A. Primero buscar en las tiendas actualmente seleccionadas
      selectedWarehouseIds.forEach(whId => {
        const normId = String(whId).trim();
        const mapKey = `${normId}__${currentMonth}`;
        const entry = multiDatePolygonsMap.get(mapKey) || activePolygonsMap.get(normId);
        const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
        if (entry && entry.coords && w) {
          candidateList.push({ store: w, coords: entry.coords });
        }
      });

      // B. Si hay menos de 2 seleccionadas, complementar con las tiendas visibles en el mapa que tienen polígono dibujado
      if (candidateList.length < 2 && map) {
        const bounds = map.getBounds();
        activePolygonsMap.forEach((entry, normId) => {
          if (!candidateList.some(c => String(c.store.warehouse_id).trim() === normId)) {
            const w = allWarehouses.find(item => String(item.warehouse_id).trim() === normId);
            if (entry && entry.coords && w) {
              const pos = getWarehousePosition(w);
              if (pos && (!bounds || bounds.contains(new google.maps.LatLng(pos.lat, pos.lng)))) {
                candidateList.push({ store: w, coords: entry.coords });
              }
            }
          }
        });
      }

      if (candidateList.length < 2) {
        showToast('Seleccioná al menos 2 darkstores en la misma zona para detectar su área de solapamiento.', 'warning');
        return;
      }

      showToast(`Auditando solapamiento entre ${candidateList.length} tiendas con Turf.js...`, 'info');

      let disputeCount = 0;
      let totalDisputeAreaKm2 = 0;

      for (let i = 0; i < candidateList.length; i++) {
        const itemA = candidateList[i];
        const polyA = coordsToTurfPolygon(itemA.coords);
        if (!polyA) continue;

        for (let j = i + 1; j < candidateList.length; j++) {
          const itemB = candidateList[j];
          const polyB = coordsToTurfPolygon(itemB.coords);
          if (!polyB) continue;

          try {
            const isect = turf.intersect(polyA, polyB);
            if (isect) {
              const areaKm2 = turf.area(isect) / 1000000;
              // Detectar solapamientos a partir de 0.005 km² (media manzana urbana)
              if (areaKm2 > 0.005) {
                disputeCount++;
                totalDisputeAreaKm2 += areaKm2;

                const paths = turfFeatureToLatLngPaths(isect);
                if (paths.length === 0) continue;

                const dPoly = new google.maps.Polygon({
                  paths: paths,
                  map: map,
                  strokeColor: '#7c3aed',
                  strokeOpacity: 0.95,
                  strokeWeight: 2.4,
                  fillColor: '#8b5cf6',
                  fillOpacity: 0.50,
                  zIndex: 1000,
                  clickable: true
                });

                dPoly.addListener('click', function(e) {
                  disputeInfoWindow.setContent(`
                    <div style="font-family:'Outfit',sans-serif; padding:10px 14px; font-size:12px; max-width:275px; background:var(--bg-sheet-card, #ffffff); color:var(--text-sheet-title, #0f172a); border-radius:8px;">
                      <div style="font-size:8.5px; font-weight:800; color:#7c3aed; text-transform:uppercase; letter-spacing:0.5px;">Zona de Solapamiento (Doble Cobertura)</div>
                      <div style="font-weight:800; font-size:13px; margin-top:3px; color:var(--text-sheet-title, #0f172a);">
                        ${itemA.store.warehouse_name} vs ${itemB.store.warehouse_name}
                      </div>
                      <div style="margin-top:6px; font-size:11.5px; color:var(--text-sheet-muted, #475569); display:flex; justify-content:space-between; align-items:center; background:rgba(124,58,237,0.08); padding:4px 8px; border-radius:5px; border:1px solid rgba(124,58,237,0.2);">
                        <span>Área solapada:</span>
                        <b style="color:#7c3aed; font-family:'JetBrains Mono',monospace;">${areaKm2.toFixed(2)} km²</b>
                      </div>
                      <div style="margin-top:7px; font-size:9.5px; color:#dc2626; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); border-radius:5px; padding:5px 7px; font-weight:600; line-height:1.35;">
                        <strong style="text-transform:uppercase; font-size:9px;">Alerta operativa:</strong> Ambas darkstores compiten por los mismos pedidos en este territorio. Conviene reasignar límites para evitar canibalización y optimizar CPO.
                      </div>
                    </div>
                  `);
                  disputeInfoWindow.setPosition(e.latLng);
                  disputeInfoWindow.open(map);
                });

                disputePolygons.push(dPoly);
              }
            }
          } catch(err) {
            console.warn('[Mapster Dispute Error]:', err);
          }
        }
      }

      if (disputeCount > 0) {
        showToast(`Se detectaron ${disputeCount} zonas de solapamiento ineficiente (${totalDisputeAreaKm2.toFixed(1)} km² en total). Tocá cualquier zona violeta para ver el detalle.`, 'info');
      } else {
        showToast('No se detectaron zonas de solapamiento entre las tiendas analizadas (coberturas independientes).', 'info');
      }
    }

    // ============================================================
    // 4. PALETA DE COMANDOS GLOBAL (CTRL+K / CMD+K / SPOTLIGHT)
    // ============================================================
    let isCommandPaletteOpen = false;
    let commandPaletteSelectedIndex = 0;
    let commandPaletteItems = [];

    function openCommandPalette() {
      isCommandPaletteOpen = true;
      const modal = document.getElementById('command-palette-modal');
      const input = document.getElementById('command-palette-input');
      if (modal) modal.style.display = 'flex';
      if (input) {
        input.value = '';
        input.focus();
      }
      renderCommandPaletteResults('');
    }

    function closeCommandPalette(e) {
      if (e) e.stopPropagation();
      isCommandPaletteOpen = false;
      const modal = document.getElementById('command-palette-modal');
      if (modal) modal.style.display = 'none';
    }

    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        if (isCommandPaletteOpen) closeCommandPalette();
        else openCommandPalette();
      } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        openCommandPalette();
      } else if (e.key === 'Escape' && isCommandPaletteOpen) {
        closeCommandPalette();
      }
    });

    function onCommandPaletteInput(query) {
      renderCommandPaletteResults(query);
    }

    function onCommandPaletteKeydown(e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        commandPaletteSelectedIndex = Math.min(commandPaletteSelectedIndex + 1, commandPaletteItems.length - 1);
        highlightCommandPaletteItem();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        commandPaletteSelectedIndex = Math.max(commandPaletteSelectedIndex - 1, 0);
        highlightCommandPaletteItem();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (commandPaletteItems[commandPaletteSelectedIndex]) {
          executeCommandPaletteAction(commandPaletteItems[commandPaletteSelectedIndex]);
        }
      }
    }

    function renderCommandPaletteResults(query) {
      const q = String(query || '').toLowerCase().trim();
      const resultsContainer = document.getElementById('command-palette-results');
      if (!resultsContainer) return;

      commandPaletteItems = [];

      const systemActions = [
        { id: 'act_center', category: 'Acciones', title: 'Centrar Tiendas Seleccionadas', subtitle: 'Atajo: tecla E', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea044e" stroke-width="2.2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/></svg>', run: () => centerMapOnSelected() },
        { id: 'act_clear', category: 'Acciones', title: 'Limpiar Todo el Mapa', subtitle: 'Desmarcar todos los almacenes', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>', run: () => selectAllWarehouses(false) },
        { id: 'act_sim', category: 'Herramientas', title: 'Abrir Simulador Nueva Darkstore', subtitle: 'What-If y Canibalización', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>', run: () => toggleExpansionSimulator() },
        { id: 'act_barrio', category: 'Herramientas', title: 'Trazar Polígono de Barrio...', subtitle: 'Buscar barrio en catastro (ej. Palermo, Tolosa)', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>', run: () => { const el = document.getElementById('neighborhood-poly-search-input'); if(el){ el.focus(); el.select(); } } },
        { id: 'act_dispute', category: 'Capas', title: 'Ver Zonas de Solapamiento (Doble Cobertura)', subtitle: 'Solapamientos territoriales', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', run: () => toggleDisputeZonesVisibility(true) },
        { id: 'act_quads', category: 'Capas', title: 'Ver Cuadrantes / Recuadros', subtitle: 'Análisis de usuarios BigQuery', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>', run: () => toggleGridVisibility(true) }
      ];

      systemActions.forEach(a => {
        if (!q || a.title.toLowerCase().includes(q) || a.category.toLowerCase().includes(q)) {
          commandPaletteItems.push(a);
        }
      });

      allWarehouses.forEach(w => {
        const name = String(w.warehouse_name || '');
        const id = String(w.warehouse_id || '');
        const city = String(w.city || '');
        if (!q || name.toLowerCase().includes(q) || id.toLowerCase().includes(q) || city.toLowerCase().includes(q)) {
          commandPaletteItems.push({
            id: 'wh_' + id,
            category: 'Almacén',
            title: name,
            subtitle: `${id} • ${city} (${w.is_active ? 'Activo' : 'Inactivo'})`,
            icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ea044e" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
            run: () => {
              selectedWarehouseIds.clear();
              selectedWarehouseIds.add(id);
              renderWarehouseCards();
              drawWarehousesOnMap();
              centerMapOnSelected();
              showToast(`Enfocado en ${name}`, 'success');
            }
          });
        }
      });

      commandPaletteItems = commandPaletteItems.slice(0, 20);
      commandPaletteSelectedIndex = 0;

      if (commandPaletteItems.length === 0) {
        resultsContainer.innerHTML = '<div style="padding:16px 20px; font-size:12px; color:var(--text-sheet-muted); text-align:center;">No se encontraron resultados para tu búsqueda.</div>';
        return;
      }

      let html = '';
      commandPaletteItems.forEach((item, idx) => {
        const isSelected = idx === 0;
        html += `
          <div class="cmd-item" id="cmd-item-${idx}" onclick="executeCommandPaletteAction(commandPaletteItems[${idx}])" 
               style="display:flex; align-items:center; justify-content:space-between; padding:9px 18px; cursor:pointer; background:${isSelected ? 'rgba(234,4,78,0.08)' : 'transparent'}; border-left:3px solid ${isSelected ? 'var(--brand-red)' : 'transparent'}; transition:all 0.1s ease;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:16px;">${item.icon}</span>
              <div>
                <div style="font-size:12.5px; font-weight:700; color:var(--text-sheet-title);">${item.title}</div>
                <div style="font-size:10px; color:var(--text-sheet-muted);">${item.subtitle}</div>
              </div>
            </div>
            <span style="font-size:9.5px; font-weight:700; color:var(--text-sheet-muted); text-transform:uppercase; background:var(--bg-sheet-bar); border:1px solid var(--border-sheet); border-radius:4px; padding:2px 6px;">${item.category}</span>
          </div>
        `;
      });

      resultsContainer.innerHTML = html;
    }

    function highlightCommandPaletteItem() {
      document.querySelectorAll('.cmd-item').forEach((el, idx) => {
        if (idx === commandPaletteSelectedIndex) {
          el.style.background = 'rgba(234,4,78,0.08)';
          el.style.borderLeftColor = 'var(--brand-red)';
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.style.background = 'transparent';
          el.style.borderLeftColor = 'transparent';
        }
      });
    }

    function executeCommandPaletteAction(item) {
      if (!item) return;
      closeCommandPalette();
      if (typeof item.run === 'function') {
        item.run();
      }
    }

    // ============================================================
    // ARRANQUE SEGURO (UNA VEZ EVALUADO EL SCRIPT COMPLETO)
    // ============================================================
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrapStoreExplorer);
    } else {
      try {
        bootstrapStoreExplorer();
      } catch(eBootEnd) {
        if (typeof window.logLiveDebug === 'function') {
          window.logLiveDebug('Excepción en arranque bootstrapStoreExplorer: ' + eBootEnd.message, 'error');
        }
      }
    }
  </script>
