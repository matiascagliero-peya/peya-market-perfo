<style>
:root{
  --bg:#0b0d13;--card:#141722;--card2:#1b1f2e;--border:#262b3a;
  --text:#f1f3f9;--muted:#848d9f;--accent:#3b82f6;--accent2:#2563eb;
  --green:#10b981;--orange:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899;
  --shadow:0 4px 14px rgba(0,0,0,0.3);
  --shadow-sm:0 2px 6px rgba(0,0,0,0.2);
  --transition:all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
html.light{
  --bg:#f5f7fb;--card:#ffffff;--card2:#f1f4fa;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent2:#1d4ed8;
  --green:#047857;--orange:#b45309;--red:#b91c1c;--purple:#6d28d9;--cyan:#0369a1;--pink:#be185d;
  --shadow:0 4px 14px rgba(15,23,42,0.04);
  --shadow-sm:0 2px 6px rgba(15,23,42,0.03);
}
html,body{overflow-x:hidden;max-width:100%;width:100%;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background-color:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:13px;padding:16px;line-height:1.4;}

/* ─── Typography & Titles ─── */
h1{font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.01em;}
.by{font-size:10px;color:var(--muted);font-weight:500;font-style:italic;align-self:flex-end;padding-bottom:2px;}
h2{font-size:14px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:-0.01em;}

/* ─── Modern Control Panel Header ─── */
#header-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: var(--transition);
}
#header-panel:hover {
  border-color: rgba(59, 130, 246, 0.4);
}
html.light #header-panel:hover {
  border-color: rgba(37, 99, 235, 0.3);
}
#header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
#header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
#primary-filters {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
#adv-filters {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  margin-top: 2px;
  transition: var(--transition);
}
#adv-filters-grid {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-group select, .filter-group input {
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  min-width: 140px;
  max-width: 200px;
}
.filter-group input#cfg-user {
  max-width: 230px;
}

.navgroup{display:none;}
.navfield{display:inline-flex;align-items:center;gap:6px;}
.navfield+.navfield{border-left:1px solid var(--border);padding-left:12px;}
.navspacer{flex:1 1 12px;}
.gsep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.sep{color:var(--border);user-select:none;}
.lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:2px;}

/* ─── Inputs & Buttons ─── */
select,input,button,textarea{font-family:inherit;font-size:12px;background:var(--card);color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:6px 10px;outline:none;transition:var(--transition);}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37, 99, 235, 0.12);}
select:hover,input:hover,textarea:hover{border-color:var(--muted);}
#sf-sql{font-family:'Fira Code','Segoe UI Mono','Courier New',monospace;font-size:11.5px;}

button{cursor:pointer;font-weight:600;}
button:hover{border-color:var(--accent);background:var(--card2);}
.btn-p{background:var(--accent2);color:#fff;border:none;font-weight:700;padding:8px 18px;border-radius:8px;box-shadow:0 2px 5px rgba(37, 99, 235, 0.2);}
.btn-p:hover{background:var(--accent);box-shadow:0 4px 10px rgba(59, 130, 246, 0.3);transform:translateY(-1px);}
.btn-p:active{transform:translateY(0);box-shadow:0 2px 5px rgba(37, 99, 235, 0.2);}

.pr{padding:6px 12px;font-weight:600;}
.pr.on{background:var(--accent2);color:#fff;border-color:var(--accent2);box-shadow:0 2px 4px rgba(37, 99, 235, 0.15);}
.pr.on:hover{background:var(--accent);border-color:var(--accent);}

/* ─── Tabs ─── */
#tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin:12px 0 18px;padding-bottom:1px;}
.tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);
  padding:10px 16px;font-size:13px;font-weight:600;border-radius:6px 6px 0 0;cursor:pointer;transition:var(--transition);margin-bottom:-1px;text-decoration:none;}
.tab:hover{color:var(--text);background:var(--card2);}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;background:rgba(59,130,246,0.04);}
html.light .tab.on{background:rgba(37,99,235,0.03);}

.hidden{display:none!important;}

/* ─── Cards ─── */
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:var(--transition);}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.18);border-color:var(--accent);}
html.light .card:hover{box-shadow:0 6px 16px rgba(15,23,42,0.06);}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac);}
.card.c1{--ac:var(--accent);}.card.c2{--ac:var(--green);}.card.c3{--ac:var(--orange);}.card.c4{--ac:var(--purple);}.card.c5{--ac:var(--pink);}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.card .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.03em;}
.card .s{font-size:11px;color:var(--muted);margin-top:4px;}

/* ─── Charts ─── */
.charts{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:12px;}
@media (max-width: 860px){.charts{grid-template-columns:1fr;}}
.chartbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);transition:var(--transition);}
.chartbox:hover{border-color:var(--border);}
.chartbox h3{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
.cwrap{position:relative;height:220px;}

/* ─── Tables ─── */
.cnt{background:var(--card2);color:var(--muted);font-size:11px;padding:2px 10px;border-radius:12px;font-weight:600;border:1px solid var(--border);}
.tablebox{width:100%;max-width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow);}

/* Soft scrollbars */
.tablebox::-webkit-scrollbar { height: 6px; width: 6px; }
.tablebox::-webkit-scrollbar-track { background: var(--bg); }
.tablebox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.tablebox::-webkit-scrollbar-thumb:hover { background: var(--muted); }

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;
  padding:12px 14px;background:var(--card2);border-bottom:2px solid var(--border);white-space:nowrap;user-select:none;cursor:pointer;transition:var(--transition);}
th:hover{color:var(--text);background:var(--border);}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap;transition:var(--transition);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--card2);color:var(--text);}
.r{text-align:right;}
.mono{font-family:'Consolas', 'Fira Code', monospace;font-size:11px;}

/* ─── Badges & Status ─── */
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:0.02em;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
.b-gsheet{background:rgba(16,185,129,0.12);color:var(--green);}
.b-bq{background:rgba(59,130,246,0.12);color:var(--accent);}
.b-looker{background:rgba(139,92,246,0.12);color:var(--purple);}
.b-dataform{background:rgba(245,158,11,0.12);color:var(--orange);}
.b-scheduled{background:rgba(245,158,11,0.12);color:var(--orange);}
.b-appsscript{background:rgba(236,72,153,0.12);color:var(--pink);}
.b-none{background:rgba(132,141,159,0.12);color:var(--muted);}
.b-crit{background:rgba(239,68,68,0.12);color:var(--red);}
.b-warn{background:rgba(245,158,11,0.12);color:var(--orange);}
.stmt{font-family:'Consolas',monospace;font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted);background:var(--card2);}

.link{color:var(--accent);text-decoration:none;font-weight:600;transition:var(--transition);}
.link:hover{color:var(--accent2);text-decoration:underline;}

/* ─── Alert & Cohesion Cards ─── */
#err{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:14px;margin-bottom:16px;font-weight:500;}
#loader{text-align:center;color:var(--muted);padding:60px 20px;}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:12px;}
@keyframes sp{to{transform:rotate(360deg);}}

#alert{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text);margin-bottom:12px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow-sm);width:fit-content;transition:var(--transition);}
#alert:hover{border-color:var(--accent);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:var(--transition);}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}

#filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
#theme-btn{font-size:14px;padding:6px 11px;border-radius:8px;}
#theme-btn:hover{background:var(--card2);border-color:var(--accent);}
#proj-status{font-size:10px;color:var(--muted);}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.qcell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.namecell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}

/* Ancho estricto y alineación centradora para consultas repetidas */
#t-repeated th:nth-child(1), #t-repeated td:nth-child(1) {
  width: 15%;
  max-width: 15vw;
}
#t-repeated th:nth-child(2), #t-repeated td:nth-child(2) {
  width: 30%;
  max-width: 30vw;
}
#t-repeated th:nth-child(3), #t-repeated td:nth-child(3) {
  width: 12%;
  text-align: center !important;
  padding-left: 12px;
  padding-right: 12px;
}
#t-repeated th:nth-child(4), #t-repeated td:nth-child(4) {
  width: 15%;
  text-align: center !important;
  padding-left: 12px;
  padding-right: 12px;
}
#t-repeated th:nth-child(5), #t-repeated td:nth-child(5) {
  width: 12%;
  text-align: center !important;
  padding-left: 12px;
  padding-right: 12px;
}
#t-repeated th:nth-child(6), #t-repeated td:nth-child(6) {
  width: 16%;
  text-align: center !important;
  padding-left: 12px;
  padding-right: 12px;
}

.formbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);margin-bottom:12px;}
.warn{background:rgba(245,158,11,.1);color:var(--orange);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.4;}
.warn-success{background:rgba(16,185,129,.08);color:var(--green);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.4;}

/* Action Buttons inside Lists */
.ibtn{padding:4px 10px;margin-right:4px;font-size:12px;background:var(--card2);border:1px solid var(--border);border-radius:6px;cursor:pointer;}
.ibtn:hover{border-color:var(--accent);background:var(--card);}
.ibtn.on{background:var(--accent2);color:#fff;border-color:var(--accent2);}

.sbtn{padding:4px 8px;margin:2px;font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:6px;background:var(--card2);color:var(--text);cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;}
.sbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--accent);background:var(--card);}
.sbtn:active{transform:translateY(0);}
.s-run{background:rgba(16,185,129,0.1);color:var(--green);border-color:rgba(16,185,129,0.25);}
.s-run:hover{background:rgba(16,185,129,0.2);border-color:var(--green);}
.s-edit{background:rgba(59,130,246,0.1);color:var(--accent);border-color:rgba(59,130,246,0.25);}
.s-edit:hover{background:rgba(59,130,246,0.2);border-color:var(--accent);}
.s-toggle{background:rgba(139,92,246,0.1);color:var(--purple);border-color:rgba(139,92,246,0.25);}
.s-toggle:hover{background:rgba(139,92,246,0.2);border-color:var(--purple);}
.s-hist{background:rgba(6,182,212,0.1);color:var(--cyan);border-color:rgba(6,182,212,0.25);}
.s-hist:hover{background:rgba(6,182,212,0.2);border-color:var(--cyan);}
.s-del{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.25);}
.s-del:hover{background:rgba(239,68,68,0.2);border-color:var(--red);}

.copybtn{font-size:10px;font-weight:600;padding:3px 10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;transition:var(--transition);}
.copybtn:hover{border-color:var(--accent);color:var(--accent);background:var(--card);}

.grangrp{display:inline-flex;gap:0;margin-left:6px;vertical-align:middle;box-shadow:var(--shadow-sm);border-radius:6px;overflow:hidden;}
.granbtn{font-size:10px;font-weight:600;padding:3px 10px;background:var(--card2);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:var(--transition);}
.granbtn:first-child{border-radius:6px 0 0 6px;}
.granbtn:last-child{border-radius:0 6px 6px 0;}
.granbtn:not(:first-child){border-left:1px solid var(--border);margin-left:-1px;}
.granbtn:hover{color:var(--accent);background:var(--card);position:relative;z-index:1;}
.granbtn.on{background:var(--accent2);color:#fff;border-color:var(--accent2);position:relative;z-index:2;}

h2 .copybtn{margin-left:auto;}
.chartbox h3{display:flex;align-items:center;}
.chartbox h3 .copybtn{margin-left:auto;}
tfoot td{font-weight:800;background:var(--card2);border-top:2px solid var(--border);border-bottom:none;}

/* ─── Responsive ─────────────────────────────────────────────────── */
@media (max-width: 860px){
  .charts{grid-template-columns:1fr;}
}
@media (max-width: 768px){
  #header-top {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  #header-actions {
    width: 100%;
    justify-content: flex-start;
    gap: 6px;
  }
  #primary-filters, #adv-filters-grid {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .filter-group {
    width: 100%;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filter-group select, .filter-group input {
    flex: 1 1 auto;
    max-width: none !important;
    min-width: 120px;
  }
  .filter-group .grangrp {
    margin-left: auto;
  }
  .filter-group > div[style*="inline-flex"] {
    display: flex !important;
    flex-wrap: wrap;
    flex: 1 1 auto;
    width: 100%;
    justify-content: space-between;
    gap: 6px;
  }
  .filter-group > div[style*="inline-flex"] input[type="date"] {
    flex: 1 1 calc(50% - 20px);
    min-width: 110px;
  }
}
@media (max-width: 640px){
  body{padding:12px;}
  h1{font-size:15px;}
  #bar{gap:8px;}
  #bar .sep{display:none;}
  #cfg-project,#cfg-platform,#cfg-region{flex:1 1 130px;min-width:0;}
  #bar2{gap:8px;padding:10px;}
  .navfield{flex:1 1 100%;}
  .navfield+.navfield{border-left:none;padding-left:0;margin-top:4px;}
  .navgroup{flex-wrap:wrap;flex:1 1 100%;}
  #tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab{padding:8px 12px;font-size:13px;white-space:nowrap;}
  #cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
  .card{padding:12px 13px;}
  .card .v{font-size:21px;}
  h2{font-size:13px;flex-wrap:wrap;}
  .cwrap{height:200px;}
  #filters select,#filters input{flex:1 1 100%;}
  .formbox{padding:11px;}
}
@media (max-width: 420px){
  .card .v{font-size:19px;}
  .btn-p,.pr{padding:7px 10px;}
}

/* Live badge with pulse animation */
.badge-live {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: #ef4444;
  color: #ffffff;
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  animation: live-pulse 1.8s infinite;
  box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
  vertical-align: middle;
}
@keyframes live-pulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
  }
  70% {
    transform: scale(1);
    box-shadow: 0 0 0 5px rgba(239, 68, 68, 0);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
  }
}
</style>
